# Digilent PmodAMP3: SSM2518 stereo I2S class-D amplifier with two speaker outputs
# and a headphone jack (2x6 Pmod).
Module:
  id: digilent_pmod_amp3
  name: Digilent PmodAMP3
  peripheral: i2s_audio_out
  voltage: 3.3
  pins:
    "1": lrclk
    "2": sdata
    "4": bclk
    "5": ground
    "6": power
    "9": mclk
    "11": ground
    "12": power
  source: >-
    Digilent PmodAMP3 reference manual, not fetched (digilent.com refuses automated
    access). Pins as BGM's nexys4 / nexys_a7_100 tops wire it (inst_pmod_amp3: LRCLK JB1,
    SDATA JB2, BCLK JB4, MCLK JB9). A third-party Raspberry Pi guide
    (centennialsoftwaresolutions.github.io, i2s-audio-output-with-...-pmod-amp3) wires
    BCLK to pin 1 and LRCLK to pin 4 instead: check against Digilent's pin table
  verified: false
