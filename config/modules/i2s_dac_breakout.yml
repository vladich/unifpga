# I2S stereo DAC breakout with a master-clock input (PCM5102A-class).
Module:
  id: i2s_dac_breakout
  name: I2S DAC breakout
  peripheral: i2s_audio_out
  voltage: 3.3
  pins:
    VIN: power
    GND: ground
    SCK: mclk
    BCK: bclk
    DIN: sdata
    LCK: lrclk
  # what a pin must be when the rig leaves it unwired (the editor says so on the pin)
  unwired:
    SCK:
      tie: ground
      why: "the PCM5102A runs from BCK when SCK stays low (TI SLAS859, p. 25: its PLL makes SCK from BCK)"
  source: common PCM5102A breakout silkscreen (SCK BCK DIN LCK); the exact board used is not recorded
  verified: false
