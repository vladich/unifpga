# Digilent PmodCON3: four RC servo connectors on a 1x6 Pmod (signal pins
# 1-4; the servos' power comes from the Pmod or an external supply).
Module:
  id: digilent_pmod_con3
  name: Digilent PmodCON3 (4 servos)
  peripheral: servo_pwm
  params: {count: 4}
  voltage: 3.3
  pins:
    "1": pwm[0]
    "2": pwm[1]
    "3": pwm[2]
    "4": pwm[3]
    "5": ground
    "6": power
  source: >-
    not verified: the Pmod GPIO convention (servo signals on pins 1-4, 5 GND, 6 VCC)
    assumed; the reference manual is not fetchable (digilent.com refuses automated access)
  verified: false
