# Digilent PmodOD1: four open-drain MOSFET outputs (relays, solenoids, lamps)
# on a 1x6 Pmod, gates on pins 1-4.
Module:
  id: digilent_pmod_od1
  name: Digilent PmodOD1 (4 open-drain outputs)
  peripheral: relay_bank
  params: {count: 4}
  voltage: 3.3
  pins:
    "1": ctl[0]
    "2": ctl[1]
    "3": ctl[2]
    "4": ctl[3]
    "5": ground
    "6": power
  source: >-
    not verified: the Pmod GPIO convention (gates G1-G4 on pins 1-4, 5 GND, 6 VCC)
    assumed; the reference manual is not fetchable (digilent.com refuses automated access)
  verified: false
