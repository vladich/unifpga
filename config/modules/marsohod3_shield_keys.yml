# marsohod.org 7-segment + 4-button extension shield for the Marsohod3GW / 3GW2:
# its four keys (to ground: pressed reads 0). The display is marsohod3_shield_display.
Module:
  id: marsohod3_shield_keys
  name: Marsohod3 7-segment + 4-button shield (keys)
  peripheral: button_array
  voltage: 3.3
  params:
    width: 4
    active: low
  pins:
    IO11: btn[0]
    IO10: btn[1]
    IO9: btn[2]
    IO8: btn[3]
  source: >-
    marsohod4you/Marsohod3GW, branch Marsohod3GW2_GW1NR-LV9QN88PC6I5, _clk_pll_counter_7seg
    top.v: the keys on IO8-IO11, active low (`IO[8]==1'b0`); their order as BGM's marsohod3gw2
    top numbers them (key 0 = IO11)
  verified: true
