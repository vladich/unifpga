# Raster-scan pixel display. The provider drives the pixel-clock domain and
# emits the current (x, y) raster position; the user computes RGB for that
# coordinate combinationally (or through registered colour memories).
# Color-channel widths are negotiated: the screen reports its native depth,
# the user's design_top picks compatible w_red/w_green/w_blue.

Capability:
  id: screen
  description: Raster-scan pixel display addressable by (x, y) coordinates.
  parameters:
    width:
      type: int
      required: true
      description: Active pixel width.
    height:
      type: int
      required: true
      description: Active pixel height.
    color_depth:
      type: enum
      values: [111, 444, 565, 888]
      default: 444
      description: Bits per RGB channel — 1-1-1 (HUB75 panels, 3-bit VGA), 4-4-4 (12-bit), 5-6-5 (16-bit), 8-8-8 (24-bit).
    bits_r: { type: int, description: "Explicit red width (design_top's w_red); overrides color_depth" }
    bits_g: { type: int, description: "Explicit green width (design_top's w_green)" }
    bits_b: { type: int, description: "Explicit blue width (design_top's w_blue)" }
  signals:
    - { name: x,     type: bus, direction: hw_to_user, comment: "X position; width = ceil(log2(screen_width))" }
    - { name: y,     type: bus, direction: hw_to_user, comment: "Y position; width = ceil(log2(screen_height))" }
    - { name: red,   type: bus, direction: user_to_hw, comment: "Width comes from color_depth's R channel" }
    - { name: green, type: bus, direction: user_to_hw }
    - { name: blue,  type: bus, direction: user_to_hw }
  # Only one screen at a time. Boards with both LCD and HDMI list each as a
  # separate configuration, never both attached.
  aggregation: exclusive
  size: [width, height]           # what `screen >= WxH` compares
  depth: [w_red, w_green, w_blue]  # what `screen >= WxH@444` compares, digit by digit

  # a summary line the editor shows for the rig's screen (design_top parameters)
  summary: "{screen_width}×{screen_height}, rgb{w_red + w_green + w_blue} ({w_red}-{w_green}-{w_blue})"
  design:
    parameters:
      # without a screen the lab_top defaults stand (640x480, 4-bit colours),
      # so the design's x / y stay 10 / 9 bits wide
      screen_width: {value: width, absent: 640}
      screen_height: {value: height, absent: 480}
      # a channel is bits_r/g/b when given, else that digit of color_depth
      w_red: {value: [bits_r, {param: color_depth, default: 444, digit: 0, otherwise: 4}], absent: 4}
      w_green: {value: [bits_g, {param: color_depth, default: 444, digit: 1, otherwise: 4}], absent: 4}
      w_blue: {value: [bits_b, {param: color_depth, default: 444, digit: 2, otherwise: 4}], absent: 4}
    derived:               # the interface's own derived widths
      w_x: {clog2: screen_width}
      w_y: {clog2: screen_height}
    ports:
      x: {signal: x, width: w_x}
      y: {signal: y, width: w_y}
      red: {signal: red, width: w_red}
      green: {signal: green, width: w_green}
      blue: {signal: blue, width: w_blue}
