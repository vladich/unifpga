# Bank of momentary push-buttons. Like switches, multiple peripherals may
# contribute and the codegen concatenates. Polarity is normalized to
# active-high (pressed = 1) at the codegen layer.

Capability:
  id: buttons
  description: Bank of momentary push-buttons readable by user code.
  parameters:
    width:
      type: int
      description: Total number of buttons exposed (sum across providers).
  signals:
    - name: btn
      type: bus
      width: $width
      direction: hw_to_user
  aggregation: concat

  primary: width
  design:
    comment: Buttons (active-high — codegen normalizes polarity)

    parameters:
      w_btn:
        value: width
        absent: 0
        description: Width of push-button bus
    ports:
      btn:
        signal: btn
        width: w_btn
