# A free-running synchronous clock visible to user code as `clk`.
#
# Direction in `signals`:
#   hw_to_user - this is an input on the user's design_top
#   user_to_hw - this is an output on the user's design_top
#   inout      - bidirectional (only used for gpio)

Capability:
  id: clock
  description: Free-running synchronous clock for user logic.
  parameters:
    frequency_mhz:
      type: float
      required: true
      description: Frequency advertised to user code via the `clk_mhz` parameter.
  signals:
    - { name: clk, type: scalar, direction: hw_to_user }
  aggregation: exclusive

  # what design_top gets from this capability (tools/codegen.py reads it; the
  # order of parameters and ports is design_top_interface.sv's)
  required: true           # every rig needs one (a new setup starts with the board's)
  design:
    parameters:
      clk_mhz: {value: {source: lab_clock_mhz}}
    ports:
      clk: {signal: clk, width: 1, net: {source: lab_clock_net}}
