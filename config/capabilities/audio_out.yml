# Mono audio sample sink. The user produces a 16-bit signed sample stream
# (free-running, one new sample per `sample_clk` rising edge); the provider's
# driver encodes it for the actual amplifier (PWM, I²S, hub75-style sigma-delta,
# etc.).

Capability:
  id: audio_out
  description: 16-bit signed mono audio sample sink.
  signals:
    - { name: sample, type: bus, width: 16, direction: user_to_hw }
  # Every provider hears the same samples (e.g. a PWM amplifier plus I2S DACs
  # on two Pmods at once); the user drives one bus.
  aggregation: broadcast

  design:
    comment: Audio out (16-bit signed mono samples; one per cycle)

    ports:
      sound: {signal: sample, width: 16}
