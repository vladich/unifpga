# Generic bidirectional I/O bank. Pins from any number of unbound headers
# (Pmods, GPIO headers, Arduino shields, etc.) are concatenated into a single
# `gpio[w_gpio-1:0]` bus exposed to user code. Direction is determined per-bit
# by the user's logic.

Capability:
  id: gpio
  description: Generic bidirectional I/O for user-defined uses.
  parameters:
    width:
      type: int
      description: Total GPIO width (sum across providers).
  signals:
    - { name: io, type: bus, width: $width, direction: inout }
  aggregation: concat

  primary: width
  passthrough: gpio_header # the peripheral a setup's `gpio: <connector>` attaches
  design:
    parameters:
      # without a provider: the configuration's design_width.gpio (the design's w_gpio)
      w_gpio: {value: width, absent: {source: design_width}}
    ports:
      # straight to the pin nets (inout), also without a provider (design_width)
      gpio: {signal: io, width: w_gpio, net: {source: gpio_connection}}
