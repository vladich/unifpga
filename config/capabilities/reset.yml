# Synchronous reset visible to user code as `rst`. Active-high. The codegen
# normalizes per-board polarity (active-low buttons are inverted automatically).

Capability:
  id: reset
  description: Synchronous active-high reset for user logic.
  signals:
    - { name: rst, type: scalar, direction: hw_to_user }
  # OR-aggregation: any source asserting reset asserts the user's rst signal.
  # On boards without a dedicated reset button, a power-on-reset module can
  # provide this capability without any explicit pin.
  aggregation: or

  design:
    ports:
      rst: {signal: rst, width: 1, net: {source: reset_net}}
