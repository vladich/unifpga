# Synchronous reset visible to user code as `rst`. Active-high. The codegen
# normalizes per-board polarity (active-low buttons are inverted automatically).

Capability:
  id: reset
  description: Synchronous active-high reset for user logic.
  signals:
    - { name: rst, type: scalar, direction: hw_to_user }
  # OR-aggregation: any source asserting reset asserts the user's rst signal.
  # On boards without a dedicated reset button, a power-on-reset module can
  # provide this capability without any explicit pin.
  aggregation: or

  # the reset sources a configuration's `reset.sources` may take from other
  # capabilities (tools/codegen.py reset_sources): a bit of that capability's
  # signal, from its providers' own pins (`parts: pins`, the board's switches
  # and keys, read even when they do not reach the design) or from the first
  # provider with a driver (`parts: driver`, a TM1638's keys). `index`: the
  # bit a flag form means (`switch_msb: true`, `any_key: true`), `kind` the
  # source it is a form of.
  sources:
    switch:     {capability: switches, signal: sw, parts: pins}
    switch_msb: {capability: switches, signal: sw, parts: pins, index: msb, kind: switch}
    key:        {capability: buttons, signal: btn, parts: pins}
    any_key:    {capability: buttons, signal: btn, parts: pins, index: any, kind: key}
    tm_key:     {capability: buttons, signal: btn, parts: driver}

  design:
    ports:
      rst: {signal: rst, width: 1, net: {source: reset_net}}
