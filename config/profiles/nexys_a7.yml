# Design-wiring profile for nexys_a7: how the example designs use the hardware
# described in config/configurations/nexys_a7.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: nexys_a7
  lab_width:
    gpio: 32
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [1, 3, 2, 0, 4]
