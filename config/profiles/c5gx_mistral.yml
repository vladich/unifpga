# Design-wiring profile for c5gx_mistral: how the example designs use the hardware
# described in config/configurations/c5gx_mistral.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: c5gx_mistral
  reset:
    sync: 2
  tie:
    onboard_leds[0]: 0
    onboard_leds[1]: 0
    onboard_leds[2]: 0
    onboard_leds[3]: 0
    onboard_leds[4]: 0
    onboard_leds[5]: 0
  attach:
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: [0, 1, 2, 3, 4, 5, 6, 7, 8, null]
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
  - peripheral: led_bank
    index: 1
    lab_bits:
      leds: [null, null, null, null, null, null, null, null, null, null]
  - peripheral: seven_segment_per_digit
    index: 0
    bind:
      dp: ['onboard_leds[6]', 'onboard_leds[7]', 'onboard_leds[8]', 'onboard_leds[9]']
