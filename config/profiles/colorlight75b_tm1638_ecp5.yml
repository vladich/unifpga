# Design-wiring profile for colorlight75b_tm1638_ecp5: how the example designs use the hardware
# described in config/configurations/colorlight75b_tm1638_ecp5.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: colorlight75b_tm1638_ecp5
  reset:
    sources:
    - tm_key: msb
    - pll_lock: serial
  uart_rx: 0
  lab_width:
    gpio: 2
  attach:
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0]
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: []
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
