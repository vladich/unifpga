# Design-wiring profile for piswords6: how the example designs use the hardware
# described in config/configurations/piswords6.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: piswords6
  reset:
    sources:
    - key: msb
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [0, 1, 2, null]
