# Design-wiring profile for orangecrab_ecp5: how the example designs use the hardware
# described in config/configurations/orangecrab_ecp5.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: orangecrab_ecp5
  lab_width:
    gpio: 8
  attach:
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: []
