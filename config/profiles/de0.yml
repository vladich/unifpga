# Design-wiring profile for de0: how the example designs use the hardware
# described in config/configurations/de0.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: de0
  reset:
    sources:
    - switch_msb: true
  attach:
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: [0, 1, 2, 3, 4, 5, 6, 7, 8, null]
