# Design-wiring profile for tang_nano_9k_lcd_480_272_tm1638_hackathon: how the example designs use the hardware
# described in config/configurations/tang_nano_9k_lcd_480_272_tm1638_hackathon.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: tang_nano_9k_lcd_480_272_tm1638_hackathon
  reset:
    sources:
    - power_up: true
    - any_key: true
