# Design-wiring profile for tang_nano_20k_hdmi_no_tm1638: how the example designs use the hardware
# described in config/configurations/tang_nano_20k_hdmi_no_tm1638.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: tang_nano_20k_hdmi_no_tm1638
  reset:
    sources:
    - power_up: true
  lab_width:
    gpio: 5
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      switches: [0, 1]
    params:
      as_switches: true
