# Design-wiring profile for alinx_ax4010: how the example designs use the hardware
# described in config/configurations/alinx_ax4010.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: alinx_ax4010
  uart_rx: 0
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      switches: [0, 1, 2]
    params:
      as_switches: true
