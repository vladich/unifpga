# Design-wiring profile for nexys4_openxc7: how the example designs use the hardware
# described in config/configurations/nexys4_openxc7.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: nexys4_openxc7
  tie:
    onboard_rgb_led_1.r: 0
    onboard_rgb_led_1.g: 0
    onboard_rgb_led_1.b: 0
    onboard_rgb_led_2.r: 0
    onboard_rgb_led_2.g: 0
    onboard_rgb_led_2.b: 0
    onboard_pwm_amp.pwm: 0
    onboard_pwm_amp.sd: 0
  lab_width:
    gpio: 32
  attach:
  - peripheral: pwm_amp
    index: 0
    drop: true
  - peripheral: rgb_led
    index: 0
    drop: true
  - peripheral: rgb_led
    index: 1
    drop: true
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [1, 3, 2, 0, 4]
