# Design-wiring profile for orangepi_msoc: how the example designs use the hardware
# described in config/configurations/orangepi_msoc.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: orangepi_msoc
  reset:
    sources:
    - key: msb
  lab_width:
    gpio: 20
