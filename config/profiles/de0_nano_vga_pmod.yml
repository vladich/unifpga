# Design-wiring profile for de0_nano_vga_pmod: how the example designs use the hardware
# described in config/configurations/de0_nano_vga_pmod.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: de0_nano_vga_pmod
  reset:
    sources:
    - switch_msb: true
  uart_rx: 1
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [0, 1]
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: [0, 1, 2, null]
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: []
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
