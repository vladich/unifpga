# Design-wiring profile for terasic_sockit: how the example designs use the hardware
# described in config/configurations/terasic_sockit.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: terasic_sockit
  uart_rx: 0
  lab_width:
    gpio: 2
