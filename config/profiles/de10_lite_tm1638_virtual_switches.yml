# Design-wiring profile for de10_lite_tm1638_virtual_switches: how the example designs use the hardware
# described in config/configurations/de10_lite_tm1638_virtual_switches.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: de10_lite_tm1638_virtual_switches
  reset:
    sources:
    - switch_msb: true
  uart_rx: 0
  tie:
    arduino_reset_n: ~rst
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [0, 1]
