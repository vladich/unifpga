# Design-wiring profile for de10_lite: how the example designs use the hardware
# described in config/configurations/de10_lite.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: de10_lite
  reset:
    sources:
    - switch_msb: true
  uart_rx: 0
  tie:
    arduino_reset_n: ~rst
  attach:
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: [0, 1, 2, 3, 4, 5, 6, 7, 8, null]
