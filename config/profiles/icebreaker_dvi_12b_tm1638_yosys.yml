# Design-wiring profile for icebreaker_dvi_12b_tm1638_yosys: how the example designs use the hardware
# described in config/configurations/icebreaker_dvi_12b_tm1638_yosys.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: icebreaker_dvi_12b_tm1638_yosys
  reset:
    sources:
    - power_up: true
    - tm_key: msb
  lab_clock: pixel
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: []
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: [0, 1, 2, 3, 4, 5, 6, 7]
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
