# Design-wiring profile for ice40hx8k_evb: how the example designs use the hardware
# described in config/configurations/ice40hx8k_evb.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: ice40hx8k_evb
  reset:
    sources:
    - tm_key: msb
  lab_width:
    gpio: 12
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: []
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [null, null]
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: []
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: []
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
