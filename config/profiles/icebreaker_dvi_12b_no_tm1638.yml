# Design-wiring profile for icebreaker_dvi_12b_no_tm1638: how the example designs use the hardware
# described in config/configurations/icebreaker_dvi_12b_no_tm1638.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: icebreaker_dvi_12b_no_tm1638
  reset:
    sources:
    - key: 0
  lab_clock: pixel
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [null]
  - peripheral: button_array
    index: 1
    lab_bits:
      buttons: [0, 1, 2]
      switches: [0, 1, 2]
    params:
      as_switches: true
