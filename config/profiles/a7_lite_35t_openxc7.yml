# Design-wiring profile for a7_lite_35t_openxc7: how the example designs use the hardware
# described in config/configurations/a7_lite_35t_openxc7.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: a7_lite_35t_openxc7
  reset:
    sync: 4
  lab_clock:
    name: lab
    mhz: 50
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: []
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0, 1]
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: [0, 1, 2, 3, 4, 5, 6, 7]
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
