# Design-wiring profile for emooc_cc: how the example designs use the hardware
# described in config/configurations/emooc_cc.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: emooc_cc
  reset:
    sources:
    - key: msb
  tie:
    gpio_p2[12]: 0
  lab_width:
    buttons: 8
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, null]
  - peripheral: gpio_header
    index: 0
    params:
      direction: out
