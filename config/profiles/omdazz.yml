# Design-wiring profile for omdazz: how the example designs use the hardware
# described in config/configurations/omdazz.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: omdazz
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      switches: [0, 1, 2, 3]
    params:
      as_switches: true
