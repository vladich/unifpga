# Design-wiring profile for de0_cv_mistral: how the example designs use the hardware
# described in config/configurations/de0_cv_mistral.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: de0_cv_mistral
  attach:
  - peripheral: seven_segment_per_digit
    index: 0
    bind:
      dp: ['onboard_leds[4]', 'onboard_leds[5]', 'onboard_leds[6]', 'onboard_leds[7]', 'onboard_leds[8]',
        'onboard_leds[9]']
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0, 1, 2, 3, null, null, null, null, null, null]
