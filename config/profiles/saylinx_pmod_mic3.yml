# Design-wiring profile for saylinx_pmod_mic3: how the example designs use the hardware
# described in config/configurations/saylinx_pmod_mic3.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: saylinx_pmod_mic3
  uart_rx: 0
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [2, 1, 0]
      switches: [2, 1, 0]
    params:
      as_switches: true
