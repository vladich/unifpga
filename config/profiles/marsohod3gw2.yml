# Design-wiring profile for marsohod3gw2: how the example designs use the hardware
# described in config/configurations/marsohod3gw2.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: marsohod3gw2
  reset:
    sources:
    - any_key: true
      bank: onboard_buttons
    - pll_lock: serial
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [null, null]
  - peripheral: button_array
    index: 1
    lab_bits:
      buttons: [0, 1, 2, 3]
  - peripheral: adc_8bit_mic
    index: 0
    params:
      clock: clock.pixel
