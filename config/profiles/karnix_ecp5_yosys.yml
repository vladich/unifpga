# Design-wiring profile for karnix_ecp5_yosys: how the example designs use the hardware
# described in config/configurations/karnix_ecp5_yosys.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: karnix_ecp5_yosys
  reset:
    sources:
    - key: msb
  lab_width:
    gpio: 12
  attach:
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: []
