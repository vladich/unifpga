# Design-wiring profile for tang_mega_138k_pro_lcd_480_272_no_tm1638: how the example designs use the hardware
# described in config/configurations/tang_mega_138k_pro_lcd_480_272_no_tm1638.yml (reset, buses, clock). Applied on
# top of it by config/init.py; synthesize.py --no-profile turns it off.
Profile:
  configuration: tang_mega_138k_pro_lcd_480_272_no_tm1638
  reset:
    sources:
    - key: msb
  uart_rx: 0
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      switches: [0, 1, 2, 3]
    params:
      as_switches: true
  - peripheral: lcd_480_272
    index: 0
    params:
      mirror_screen: true
