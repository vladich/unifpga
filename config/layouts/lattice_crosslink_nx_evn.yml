# Layout of lattice_crosslink_nx_evn generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (lattice_crosslink_nx_evn.yml); regenerate it with
# ./unifpga layout draft lattice_crosslink_nx_evn (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: lattice_crosslink_nx_evn
  verified: false
  generated: true

  connectors:
    - id: rpi_header
      type: pin_row
      label: RPI_HEADER (pin order from the pinmap)
      bank: rpi_header
      pins: {'[0]': 'rpi_header[0]', '[1]': 'rpi_header[1]', '[2]': 'rpi_header[2]', '[3]': 'rpi_header[3]', '[4]': 'rpi_header[4]', '[5]': 'rpi_header[5]', '[6]': 'rpi_header[6]', '[7]': 'rpi_header[7]', '[8]': 'rpi_header[8]', '[9]': 'rpi_header[9]', '[10]': 'rpi_header[10]', '[11]': 'rpi_header[11]', '[12]': 'rpi_header[12]', '[13]': 'rpi_header[13]', '[14]': 'rpi_header[14]', '[15]': 'rpi_header[15]', '[16]': 'rpi_header[16]', '[17]': 'rpi_header[17]', '[18]': 'rpi_header[18]', '[19]': 'rpi_header[19]', '[20]': 'rpi_header[20]', '[21]': 'rpi_header[21]', '[22]': 'rpi_header[22]', '[23]': 'rpi_header[23]', '[24]': 'rpi_header[24]', '[25]': 'rpi_header[25]', '[26]': 'rpi_header[26]', '[27]': 'rpi_header[27]'}
    - id: pmod0
      type: pin_row
      label: PMOD0 (pin order from the pinmap)
      bank: pmod0
      pins: {'[0]': 'pmod0[0]', '[1]': 'pmod0[1]', '[2]': 'pmod0[2]', '[3]': 'pmod0[3]', '[4]': 'pmod0[4]', '[5]': 'pmod0[5]', '[6]': 'pmod0[6]', '[7]': 'pmod0[7]'}
    - id: pmod1
      type: pin_row
      label: PMOD1 (pin order from the pinmap)
      bank: pmod1
      pins: {'[0]': 'pmod1[0]', '[1]': 'pmod1[1]', '[2]': 'pmod1[2]', '[3]': 'pmod1[3]', '[4]': 'pmod1[4]', '[5]': 'pmod1[5]', '[6]': 'pmod1[6]', '[7]': 'pmod1[7]'}
    - id: pmod2
      type: pin_row
      label: PMOD2 (pin order from the pinmap)
      bank: pmod2
      pins: {'[0]': 'pmod2[0]', '[1]': 'pmod2[1]', '[2]': 'pmod2[2]', '[3]': 'pmod2[3]', '[4]': 'pmod2[4]', '[5]': 'pmod2[5]', '[6]': 'pmod2[6]', '[7]': 'pmod2[7]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, params: {frequency_mhz: 12}, bind: {clk: clk}}
    - id: reset
      label: reset
      attach: {peripheral: reset_button, bind: {rst: onboard_reset}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 8}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 14}, bind: {led: onboard_leds}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {rx: onboard_uart.rx, tx: onboard_uart.tx}}
    - id: clk_125
      label: 125 MHz LVDS oscillator U4 (default) / 200 MHz U5 (resistor option)
      device: {kind: clock, bank: onboard_clk_125}   # no peripheral model yet
    - id: programn
      label: PROGRAMN push button SW5
      device: {kind: reset, bank: onboard_programn}   # no peripheral model yet
    - id: serial_flash
      label: Macronix MX25L12833F SPI flash (config) / Parallel Configuration header J27
      device: {kind: flash, bank: onboard_serial_flash}   # no peripheral model yet
    - id: config_status
      label: 'Config status: INITN (D17 red LED, TP10) and DONE (D18 green LED, TP12)'
      device: {kind: other, bank: onboard_config_status}   # no peripheral model yet
    - id: jtag
      label: JTAG header J1
      device: {kind: other, bank: onboard_jtag}   # no peripheral model yet
    - id: fmc
      label: FMC LPC connector U9 (68 LA single-ended / 34 pairs + 2 clock pairs + VREF)
      device: {kind: header, bank: fmc}   # no peripheral model yet
    - id: fmc_config
      label: FMC configuration / sideband header J27 (JTAG, I2C, PRSNT, PS_POR_B)
      device: {kind: header, bank: fmc_config}   # no peripheral model yet
    - id: camera
      label: Camera connector CN1 (MIPI CSI-2 4-lane on D-PHY0 + I2C + reset)
      device: {kind: other, bank: onboard_camera}   # no peripheral model yet
    - id: dphy1
      label: D-PHY1 header J6 (4 lanes + clock, hard D-PHY)
      device: {kind: header, bank: dphy1}   # no peripheral model yet
    - id: adc
      label: ADC test header J26 (hard ADC input 1)
      device: {kind: other, bank: onboard_adc}   # no peripheral model yet
