# Layout of orangecrab_ecp5 generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (orangecrab_ecp5.yml); regenerate it with
# ./unifpga layout draft orangecrab_ecp5 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: orangecrab_ecp5
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 3}, bind: {led: onboard_leds}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 2}, bind: {sw: onboard_switches}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: program
      label: FPGA_RESET (drives PROGRAMN to reboot into the DFU bootloader)
      device: {kind: reset, bank: onboard_program}   # no peripheral model yet
    - id: ddr3
      label: DDR3L SDRAM (MT41K64M16TW 128 MiB on -25F / MT41K256M16TW 512 MiB on -85F)
      device: {kind: ddr, bank: onboard_ddr3}   # no peripheral model yet
    - id: sdcard
      label: MicroSD socket
      device: {kind: sdcard, bank: onboard_sdcard}   # no peripheral model yet
    - id: usb
      label: USB-C full-speed device (direct FPGA USB)
      device: {kind: usb, bank: onboard_usb}   # no peripheral model yet
    - id: adc
      label: Analog front-end (ADC_CTRL, analog mux, sense comparator)
      device: {kind: other, bank: onboard_adc}   # no peripheral model yet
    - id: feather
      label: Feather header I/O (20 user pins incl. 6 analog-capable A0..A5)
      device: {kind: header, bank: feather}   # no peripheral model yet
    - id: feather_i2c
      label: Feather I2C (SDA/SCL on the header)
      device: {kind: other, bank: onboard_feather_i2c}   # no peripheral model yet
    - id: feather_serial
      label: Feather UART pins 0/1 (RX/TX)
      device: {kind: uart, bank: onboard_feather_serial}   # no peripheral model yet
