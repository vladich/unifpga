# Layout of a7_lite_35t generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/a7_lite_35t.yml; regenerate it with
# ./unifpga layout draft a7_lite_35t (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: a7_lite_35t
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]'}

  onboard:
    - id: clk50mhz
      label: clk50mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk50mhz}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 2}, bind: {led: onboard_leds}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: hdmi
      label: hdmi
      attach: {peripheral: hdmi_tmds, params: {timing: dvi, clock_serial_mhz: 250}, bind: {clk_p: onboard_hdmi.clk_p, d_p: onboard_hdmi.d_p, clk_n: onboard_hdmi.clk_n, d_n: onboard_hdmi.d_n}}
