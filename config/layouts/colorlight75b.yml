# Layout of colorlight75b generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (colorlight75b.yml); regenerate it with
# ./unifpga layout draft colorlight75b (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: colorlight75b
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]'}
    - id: onboard_buttons_pads
      type: pin_row
      label: BUTTONS PADS
      note: pins of the on-board buttons, reached by a wire soldered to them
      pins: {'[0]': 'onboard_buttons[0]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 1, active: low, open_drain: true}, bind: {led: onboard_leds}}
    - id: hdmi
      label: hdmi
      attach: {peripheral: hdmi_tmds, params: {timing: lab, clock_serial_mhz: 250}, bind: {d_p: onboard_hdmi.d_p, d_n: onboard_hdmi.d_n, clk_p: onboard_hdmi.clk_p, clk_n: onboard_hdmi.clk_n}}
    - id: sdram
      label: ESMT M12L64322A SDRAM (2M x 32, 8 MB)
      device: {kind: sdram, bank: onboard_sdram}   # no peripheral model yet
    - id: eth0
      label: Ethernet PHY U11 (RTL8211FD, RGMII, port 0)
      device: {kind: ethernet, bank: onboard_eth0}   # no peripheral model yet
    - id: eth1
      label: Ethernet PHY U13 (RTL8211FD, RGMII, port 1)
      device: {kind: ethernet, bank: onboard_eth1}   # no peripheral model yet
    - id: config
      label: sysCONFIG resistor pads (PROGRAMN R9, CFG_1 P10, INITN T9, DONE P9)
      device: {kind: other, bank: onboard_config}   # no peripheral model yet
    - id: spare_pads
      label: Spare pads R26 (N16), R107 (D12), R109 (A12)
      device: {kind: other, bank: onboard_spare_pads}   # no peripheral model yet
    - id: hub75_j1
      label: HUB75 connector J1 (outputs through 74HC245T 5 V buffers)
      device: {kind: header, bank: hub75_j1}   # no peripheral model yet
    - id: hub75_j2
      label: HUB75 connector J2 (outputs through 74HC245T 5 V buffers)
      device: {kind: header, bank: hub75_j2}   # no peripheral model yet
    - id: hub75_j3
      label: HUB75 connector J3 (outputs through 74HC245T 5 V buffers)
      device: {kind: header, bank: hub75_j3}   # no peripheral model yet
    - id: hub75_j4
      label: HUB75 connector J4 (outputs through 74HC245T 5 V buffers)
      device: {kind: header, bank: hub75_j4}   # no peripheral model yet
    - id: hub75_j5
      label: HUB75 connector J5 (outputs through 74HC245T 5 V buffers)
      device: {kind: header, bank: hub75_j5}   # no peripheral model yet
    - id: hub75_j6
      label: HUB75 connector J6 (outputs through 74HC245T 5 V buffers)
      device: {kind: header, bank: hub75_j6}   # no peripheral model yet
    - id: hub75_j7
      label: HUB75 connector J7 (outputs through 74HC245T 5 V buffers)
      device: {kind: header, bank: hub75_j7}   # no peripheral model yet
    - id: hub75_j8
      label: HUB75 connector J8 (outputs through 74HC245T 5 V buffers)
      device: {kind: header, bank: hub75_j8}   # no peripheral model yet
