# Layout of colorlight75b generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/colorlight75b.yml; regenerate it with
# ./unifpga layout draft colorlight75b (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: colorlight75b
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 1, active: low, open_drain: true}, bind: {led: onboard_leds}}
    - id: hdmi
      label: hdmi
      attach: {peripheral: hdmi_tmds, params: {timing: lab, clock_serial_mhz: 250}, bind: {d_p: onboard_hdmi.d_p, d_n: onboard_hdmi.d_n, clk_p: onboard_hdmi.clk_p, clk_n: onboard_hdmi.clk_n}}
