# Layout of eclypse_z7 generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (eclypse_z7.yml); regenerate it with
# ./unifpga layout draft eclypse_z7 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: eclypse_z7
  verified: false
  generated: true

  connectors:
    - id: pmod_jb
      type: pin_row
      label: PMOD_JB (pin order from the pinmap)
      bank: pmod_jb
      pins: {'[0]': 'pmod_jb[0]', '[1]': 'pmod_jb[1]', '[2]': 'pmod_jb[2]', '[3]': 'pmod_jb[3]', '[4]': 'pmod_jb[4]', '[5]': 'pmod_jb[5]', '[6]': 'pmod_jb[6]', '[7]': 'pmod_jb[7]'}
    - id: pmod_ja
      type: pin_row
      label: PMOD_JA (pin order from the pinmap)
      bank: pmod_ja
      pins: {'[0]': 'pmod_ja[0]', '[1]': 'pmod_ja[1]', '[2]': 'pmod_ja[2]', '[3]': 'pmod_ja[3]', '[4]': 'pmod_ja[4]', '[5]': 'pmod_ja[5]', '[6]': 'pmod_ja[6]', '[7]': 'pmod_ja[7]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: rgb_led_1
      label: rgb led 1
      variants:
        - id: led_bank
          label: led_bank (other pins)
          attach: {peripheral: led_bank, params: {width: 1}, bind: {led: onboard_rgb_led_1.b}}
        - id: led_bank_2
          label: led_bank (other pins)
          attach: {peripheral: led_bank, params: {width: 1}, bind: {led: onboard_rgb_led_1.g}}
        - id: led_bank_3
          label: led_bank (other pins)
          attach: {peripheral: led_bank, params: {width: 1}, bind: {led: onboard_rgb_led_1.r}}
    - id: rgb_led_0
      label: rgb led 0
      variants:
        - id: led_bank
          label: led_bank (other pins)
          attach: {peripheral: led_bank, params: {width: 1}, bind: {led: onboard_rgb_led_0.b}}
        - id: led_bank_2
          label: led_bank (other pins)
          attach: {peripheral: led_bank, params: {width: 1}, bind: {led: onboard_rgb_led_0.g}}
        - id: led_bank_3
          label: led_bank (other pins)
          attach: {peripheral: led_bank, params: {width: 1}, bind: {led: onboard_rgb_led_0.r}}
    - id: syzygy_a
      label: SYZYGY port A (Zmod port A; 8 differential pairs, 2 clock pairs, 12 single-ended)
      device: {kind: header, bank: syzygy_a}   # no peripheral model yet
    - id: syzygy_b
      label: SYZYGY port B (Zmod port B; 8 differential pairs, 2 clock pairs, 12 single-ended)
      device: {kind: header, bank: syzygy_b}   # no peripheral model yet
    - id: crypto
      label: Crypto authentication chip SDA
      device: {kind: other, bank: onboard_crypto}   # no peripheral model yet
    - id: mcu_rsvd
      label: Reserved lines to the platform MCU (mcu_rsvd)
      device: {kind: other, bank: onboard_mcu_rsvd}   # no peripheral model yet
    - id: ps_ethernet
      label: PS Gigabit Ethernet (GEM0, RGMII PHY)
      device: {kind: ethernet, bank: onboard_ps_ethernet}   # no peripheral model yet
    - id: ps_usb
      label: PS USB 2.0 OTG (USB0, ULPI PHY)
      device: {kind: other, bank: onboard_ps_usb}   # no peripheral model yet
    - id: ps_sdcard
      label: PS microSD slot (SD0)
      device: {kind: sdcard, bank: onboard_ps_sdcard}   # no peripheral model yet
    - id: ps_qspi_flash
      label: PS Quad-SPI flash (boot)
      device: {kind: flash, bank: onboard_ps_qspi_flash}   # no peripheral model yet
    - id: ps_uart
      label: PS UART0 (the board USB-UART; the bridge is not named in the preset)
      device: {kind: uart, bank: onboard_ps_uart}   # no peripheral model yet
    - id: ps_i2c1
      label: PS I2C1
      device: {kind: other, bank: onboard_ps_i2c1}   # no peripheral model yet
