# Layout of marsohod_mcy316 generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/marsohod_mcy316.yml; regenerate it with
# ./unifpga layout draft marsohod_mcy316 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: marsohod_mcy316
  verified: false
  generated: true

  connectors:
    - id: gpio_a
      type: pin_row
      label: GPIO_A (pin order from the pinmap)
      bank: gpio_a
      pins: {'[0]': 'gpio_a[0]', '[1]': 'gpio_a[1]', '[2]': 'gpio_a[2]', '[3]': 'gpio_a[3]', '[4]': 'gpio_a[4]', '[5]': 'gpio_a[5]', '[6]': 'gpio_a[6]', '[7]': 'gpio_a[7]', '[8]': 'gpio_a[8]', '[9]': 'gpio_a[9]', '[10]': 'gpio_a[10]', '[11]': 'gpio_a[11]', '[12]': 'gpio_a[12]', '[13]': 'gpio_a[13]', '[14]': 'gpio_a[14]', '[15]': 'gpio_a[15]', '[16]': 'gpio_a[16]', '[17]': 'gpio_a[17]', '[18]': 'gpio_a[18]', '[19]': 'gpio_a[19]', '[20]': 'gpio_a[20]', '[21]': 'gpio_a[21]', '[22]': 'gpio_a[22]', '[23]': 'gpio_a[23]'}
    - id: gpio_a_i
      type: pin_row
      label: GPIO_A_I (pin order from the pinmap)
      bank: gpio_a_i
      pins: {'[0]': 'gpio_a_i[0]', '[1]': 'gpio_a_i[1]', '[2]': 'gpio_a_i[2]', '[3]': 'gpio_a_i[3]'}
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]', '[13]': 'gpio[13]', '[14]': 'gpio[14]', '[15]': 'gpio[15]', '[16]': 'gpio[16]', '[17]': 'gpio[17]', '[18]': 'gpio[18]', '[19]': 'gpio[19]'}
    - id: gpio_i
      type: pin_row
      label: GPIO_I (pin order from the pinmap)
      bank: gpio_i
      pins: {'[0]': 'gpio_i[0]', '[1]': 'gpio_i[1]', '[2]': 'gpio_i[2]', '[3]': 'gpio_i[3]'}
    - id: gpio_b
      type: pin_row
      label: GPIO_B (pin order from the pinmap)
      bank: gpio_b
      pins: {'[0]': 'gpio_b[0]', '[1]': 'gpio_b[1]', '[2]': 'gpio_b[2]', '[3]': 'gpio_b[3]', '[4]': 'gpio_b[4]', '[5]': 'gpio_b[5]', '[6]': 'gpio_b[6]', '[7]': 'gpio_b[7]', '[8]': 'gpio_b[8]', '[9]': 'gpio_b[9]', '[10]': 'gpio_b[10]'}
    - id: gpio_b_i
      type: pin_row
      label: GPIO_B_I (pin order from the pinmap)
      bank: gpio_b_i
      pins: {'[0]': 'gpio_b_i[0]', '[1]': 'gpio_b_i[1]', '[2]': 'gpio_b_i[2]'}

  onboard:
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 4, active: low, digits_active: high}, bind: {segments: [onboard_7seg.ca, onboard_7seg.cb, onboard_7seg.cc, onboard_7seg.cd, onboard_7seg.ce, onboard_7seg.cf, onboard_7seg.cg], dp: onboard_7seg.dp, digits: ['onboard_7seg.anodes[3]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[0]']}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds}}
