# Layout of tang_nano_20k generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (tang_nano_20k.yml); regenerate it with
# ./unifpga layout draft tang_nano_20k (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: tang_nano_20k
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]'}
    - id: header_j5
      type: pin_row
      label: HEADER_J5 (pin order from the pinmap)
      bank: header_j5
      pins: {'[0]': 'header_j5[0]', '[1]': 'header_j5[1]', '[2]': 'header_j5[2]', '[3]': 'header_j5[3]', '[4]': 'header_j5[4]', '[5]': 'header_j5[5]', '[6]': 'header_j5[6]', '[7]': 'header_j5[7]', '[8]': 'header_j5[8]', '[9]': 'header_j5[9]', '[10]': 'header_j5[10]', '[11]': 'header_j5[11]', '[12]': 'header_j5[12]', '[13]': 'header_j5[13]', '[14]': 'header_j5[14]', '[15]': 'header_j5[15]'}
    - id: header_j6
      type: pin_row
      label: HEADER_J6 (pin order from the pinmap)
      bank: header_j6
      pins: {'[0]': 'header_j6[0]', '[1]': 'header_j6[1]', '[2]': 'header_j6[2]', '[3]': 'header_j6[3]', '[4]': 'header_j6[4]', '[5]': 'header_j6[5]', '[6]': 'header_j6[6]', '[7]': 'header_j6[7]', '[8]': 'header_j6[8]', '[9]': 'header_j6[9]', '[10]': 'header_j6[10]', '[11]': 'header_j6[11]', '[12]': 'header_j6[12]', '[13]': 'header_j6[13]', '[14]': 'header_j6[14]', '[15]': 'header_j6[15]', '[16]': 'header_j6[16]', '[17]': 'header_j6[17]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {active: low, width: 2}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 6}, bind: {led: onboard_leds}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: hdmi
      label: hdmi
      attach: {peripheral: hdmi_tmds, params: {clock_serial_mhz: 249.75}, bind: {clk_p: onboard_hdmi.clk_p, d_p: onboard_hdmi.d_p, clk_n: onboard_hdmi.clk_n, d_n: onboard_hdmi.d_n}}
    - id: headphone
      label: headphone
      attach: {peripheral: i2s_audio_out, bind: {bclk: onboard_headphone.bck, lrclk: onboard_headphone.ws, sdata: onboard_headphone.din, pa_en: onboard_pa_enable}}
    - id: lcd
      label: lcd
      variants:
        - id: lcd_480_272
          label: lcd_480_272
          attach: {peripheral: lcd_480_272, params: {clock_pixel_pll: {idiv: 2, fbdiv: 0, odiv: 64, sdiv: 2, clkoutd: false}}, bind: {r: onboard_lcd.r, g: onboard_lcd.g, b: onboard_lcd.b, hs: onboard_lcd.hs, vs: onboard_lcd.vs, de: onboard_lcd.de, ck: onboard_lcd.ck, bl: onboard_lcd.bl}}
        - id: lcd_800_480
          label: 'lcd_800_480 (clock_pixel_pll={idiv: 8, fbdiv: 10, odiv: 16, sdiv: 2, clkoutd: false})'
          attach: {peripheral: lcd_800_480, params: {clock_pixel_pll: {idiv: 8, fbdiv: 10, odiv: 16, sdiv: 2, clkoutd: false}}, bind: {r: onboard_lcd.r, g: onboard_lcd.g, b: onboard_lcd.b, hs: onboard_lcd.hs, vs: onboard_lcd.vs, de: onboard_lcd.de, ck: onboard_lcd.ck, bl: onboard_lcd.bl}}
        - id: lcd_800_480_2
          label: 'lcd_800_480 (clock_pixel_pll={idiv: 1, fbdiv: 28, odiv: 2, sdiv: 8, clkoutd: true}; clock_pixel_mhz=48.9375)'
          attach: {peripheral: lcd_800_480, params: {clock_pixel_pll: {idiv: 1, fbdiv: 28, odiv: 2, sdiv: 8, clkoutd: true}, clock_pixel_mhz: 48.9375}, bind: {r: onboard_lcd.r, g: onboard_lcd.g, b: onboard_lcd.b, hs: onboard_lcd.hs, vs: onboard_lcd.vs, de: onboard_lcd.de, ck: onboard_lcd.ck}}
    - id: ms5351_clk
      label: MS5351M clock generator U12 (AUX_PLL, 3 outputs, configured by BL616 over I2C)
      device: {kind: clock, bank: onboard_ms5351_clk}   # no peripheral model yet
    - id: hdmi_ctrl
      label: HDMI HPD and CEC
      device: {kind: hdmi_tx, bank: onboard_hdmi_ctrl}   # no peripheral model yet
    - id: lcd_touch
      label: RGB LCD resistive-touch lines XR/YD/XL/YU (J2 pins 37-40, LCD_INIT0..3)
      device: {kind: lcd_rgb, bank: onboard_lcd_touch}   # no peripheral model yet
    - id: serial_flash
      label: XT25F64F 64 Mbit SPI flash U2 (bitstream + user, MSPI)
      device: {kind: flash, bank: onboard_serial_flash}   # no peripheral model yet
    - id: bl616_spi
      label: BL616 FPGA-link SPI (BL616 SPI slave; selected with the BL616 "choose spi" command)
      device: {kind: usb, bank: onboard_bl616_spi}   # no peripheral model yet
    - id: jtag
      label: FPGA JTAG (driven by BL616; test points TP3-TP6)
      device: {kind: other, bank: onboard_jtag}   # no peripheral model yet
    - id: reconfig
      label: RECONFIG_N test point TP1
      device: {kind: reset, bank: onboard_reconfig}   # no peripheral model yet
    - id: joystick1
      label: Joystick adapter 1 (SPI gamepad converter on J6 pins 15-20, silkscreen Joystick_*)
      device: {kind: joystick, bank: onboard_joystick1}   # no peripheral model yet
