# Layout of emooc_cc generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (emooc_cc.yml); regenerate it with
# ./unifpga layout draft emooc_cc (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: emooc_cc
  verified: false
  generated: true

  connectors:
