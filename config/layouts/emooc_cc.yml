      pins: {'[0]': 'gpio_j7[0]', '[1]': 'gpio_j7[1]', '[2]': 'gpio_j7[2]', '[3]': 'gpio_j7[3]', '[4]': 'gpio_j7[4]', '[5]': 'gpio_j7[5]', '[6]': 'gpio_j7[6]', '[7]': 'gpio_j7[7]', '[8]': 'gpio_j7[8]', '[9]': 'gpio_j7[9]', '[10]': 'gpio_j7[10]', '[11]': 'gpio_j7[11]', '[12]': 'gpio_j7[12]', '[13]': 'gpio_j7[13]', '[14]': 'gpio_j7[14]', '[15]': 'gpio_j7[15]', '[16]': 'gpio_j7[16]', '[17]': 'gpio_j7[17]', '[18]': 'gpio_j7[18]', '[19]': 'gpio_j7[19]', '[20]': 'gpio_j7[20]', '[21]': 'gpio_j7[21]', '[22]': 'gpio_j7[22]', '[23]': 'gpio_j7[23]', '[24]': 'gpio_j7[24]', '[25]': 'gpio_j7[25]', '[26]': 'gpio_j7[26]', '[27]': 'gpio_j7[27]', '[28]': 'gpio_j7[28]', '[29]': 'gpio_j7[29]', '[30]': 'gpio_j7[30]', '[31]': 'gpio_j7[31]', '[32]': 'gpio_j7[32]', '[33]': 'gpio_j7[33]'}
    - id: gpio_p1
      type: pin_row
      label: GPIO_P1 (pin order from the pinmap)
      bank: gpio_p1
      pins: {'[0]': 'gpio_p1[0]', '[1]': 'gpio_p1[1]', '[2]': 'gpio_p1[2]', '[3]': 'gpio_p1[3]', '[4]': 'gpio_p1[4]', '[5]': 'gpio_p1[5]', '[6]': 'gpio_p1[6]', '[7]': 'gpio_p1[7]', '[8]': 'gpio_p1[8]', '[9]': 'gpio_p1[9]', '[10]': 'gpio_p1[10]', '[11]': 'gpio_p1[11]', '[12]': 'gpio_p1[12]', '[13]': 'gpio_p1[13]', '[14]': 'gpio_p1[14]', '[15]': 'gpio_p1[15]', '[16]': 'gpio_p1[16]', '[17]': 'gpio_p1[17]', '[18]': 'gpio_p1[18]', '[19]': 'gpio_p1[19]', '[20]': 'gpio_p1[20]'}
