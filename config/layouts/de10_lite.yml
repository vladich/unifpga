# Layout of de10_lite generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/de10_lite.yml; regenerate it with
# ./unifpga layout draft de10_lite (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: de10_lite
  verified: false
  generated: true

  connectors:
    - id: arduino
      type: arduino_uno_r3
      label: Arduino Uno header
      bank: arduino_io
      pins: {IO0: 'arduino_io[0]', IO1: 'arduino_io[1]', IO2: 'arduino_io[2]', IO3: 'arduino_io[3]', IO4: 'arduino_io[4]', IO5: 'arduino_io[5]', IO6: 'arduino_io[6]', IO7: 'arduino_io[7]', IO8: 'arduino_io[8]', IO9: 'arduino_io[9]', IO10: 'arduino_io[10]', IO11: 'arduino_io[11]', IO12: 'arduino_io[12]', IO13: 'arduino_io[13]', IO14: 'arduino_io[14]', IO15: 'arduino_io[15]'}
    - id: gpio
      type: terasic_gpio_2x20
      label: GPIO header (40-pin)
      bank: gpio
      pins: {'1': 'gpio[0]', '2': 'gpio[1]', '3': 'gpio[2]', '4': 'gpio[3]', '5': 'gpio[4]', '6': 'gpio[5]', '7': 'gpio[6]', '8': 'gpio[7]', '9': 'gpio[8]', '10': 'gpio[9]', '13': 'gpio[10]', '14': 'gpio[11]', '15': 'gpio[12]', '16': 'gpio[13]', '17': 'gpio[14]', '18': 'gpio[15]', '19': 'gpio[16]', '20': 'gpio[17]', '21': 'gpio[18]', '22': 'gpio[19]', '23': 'gpio[20]', '24': 'gpio[21]', '25': 'gpio[22]', '26': 'gpio[23]', '27': 'gpio[24]', '28': 'gpio[25]', '31': 'gpio[26]', '32': 'gpio[27]', '33': 'gpio[28]', '34': 'gpio[29]', '35': 'gpio[30]', '36': 'gpio[31]', '37': 'gpio[32]', '38': 'gpio[33]', '39': 'gpio[34]', '40': 'gpio[35]'}

  onboard:
    - id: clk50mhz
      label: clk50mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk50mhz}}
    - id: buttons
      label: KEY0-KEY1
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: switches
      label: SW0-SW9
      attach: {peripheral: sw_bank, params: {width: 10}, bind: {sw: onboard_switches}}
    - id: leds
      label: LEDR0-LEDR9
      attach: {peripheral: led_bank, params: {width: 10}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_per_digit, params: {digits: 6, segs: 8}, bind: {hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5]}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
