# Layout of nexys4 generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (nexys4.yml); regenerate it with
# ./unifpga layout draft nexys4 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: nexys4
  verified: false
  generated: true

  connectors:
    - id: pmod_ja
      type: pin_row
      label: PMOD_JA
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_ja
      pins: {'[0]': 'pmod_ja[0]', '[1]': 'pmod_ja[1]', '[2]': 'pmod_ja[2]', '[3]': 'pmod_ja[3]', '[4]': 'pmod_ja[4]', '[5]': 'pmod_ja[5]', '[6]': 'pmod_ja[6]', '[7]': 'pmod_ja[7]'}
    - id: pmod_jb
      type: pin_row
      label: PMOD_JB
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jb
      pins: {'[0]': 'pmod_jb[0]', '[1]': 'pmod_jb[1]', '[2]': 'pmod_jb[2]', '[3]': 'pmod_jb[3]', '[4]': 'pmod_jb[4]', '[5]': 'pmod_jb[5]', '[6]': 'pmod_jb[6]', '[7]': 'pmod_jb[7]'}
    - id: pmod_jc
      type: pin_row
      label: PMOD_JC
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jc
      pins: {'[0]': 'pmod_jc[0]', '[1]': 'pmod_jc[1]', '[2]': 'pmod_jc[2]', '[3]': 'pmod_jc[3]', '[4]': 'pmod_jc[4]', '[5]': 'pmod_jc[5]', '[6]': 'pmod_jc[6]', '[7]': 'pmod_jc[7]'}
    - id: pmod_jd
      type: pin_row
      label: PMOD_JD
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jd
      pins: {'[0]': 'pmod_jd[0]', '[1]': 'pmod_jd[1]', '[2]': 'pmod_jd[2]', '[3]': 'pmod_jd[3]', '[4]': 'pmod_jd[4]', '[5]': 'pmod_jd[5]', '[6]': 'pmod_jd[6]', '[7]': 'pmod_jd[7]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 16}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 16}, bind: {led: onboard_leds}}
    - id: rgb_led_1
      label: rgb led 1
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_1.r, g: onboard_rgb_led_1.g, b: onboard_rgb_led_1.b}}
    - id: rgb_led_2
      label: rgb led 2
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_2.r, g: onboard_rgb_led_2.g, b: onboard_rgb_led_2.b}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 8, active: low, digits_active: low}, bind: {segments: ['onboard_7seg.segments[0]', 'onboard_7seg.segments[1]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[6]'], dp: onboard_7seg.dp, digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]', 'onboard_7seg.anodes[6]', 'onboard_7seg.anodes[7]']}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 5}, bind: {btn: onboard_buttons}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: pwm_amp
      label: pwm amp
      attach: {peripheral: pwm_amp, bind: {pwm: onboard_pwm_amp.pwm, sd: onboard_pwm_amp.sd}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {rx: onboard_uart.rx}}
    - id: usb_hid
      label: USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
      attach: {peripheral: ps2_keyboard, bind: {clk: onboard_usb_hid.clk, data: onboard_usb_hid.data}}
    - id: temp_sensor
      label: Temperature sensor (I2C)
      attach: {peripheral: i2c_temperature_sensor, params: {shift: 3}, bind: {scl: onboard_temp_sensor.scl, sda: onboard_temp_sensor.sda}}
    - id: accelerometer
      label: 3-axis accelerometer (SPI)
      attach: {peripheral: spi_accelerometer, bind: {miso: onboard_accelerometer.miso, mosi: onboard_accelerometer.mosi, sclk: onboard_accelerometer.sclk, csn: onboard_accelerometer.csn}}
    - id: pmod_jxadc
      label: 'Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)'
      attach: {peripheral: xadc_aux, params: {width: 4, channels: [3, 10, 2, 11]}, bind: {p: onboard_pmod_jxadc.xa_p, n: onboard_pmod_jxadc.xa_n}}
    - id: sdcard
      label: microSD card slot
      device: {kind: sdcard, bank: onboard_sdcard}   # no peripheral model yet
    - id: ethernet
      label: 10/100 Ethernet PHY (SMSC, RMII)
      device: {kind: ethernet, bank: onboard_ethernet}   # no peripheral model yet
    - id: qspi_flash
      label: Quad-SPI flash
      device: {kind: flash, bank: onboard_qspi_flash}   # no peripheral model yet
    - id: cellular_ram
      label: Cellular RAM (PSRAM, 16-bit data, 23-bit address)
      attach: {peripheral: async_sram, params: {addr_bits: 23, access_ns: 70}, bind: {a: onboard_cellular_ram.adr, d: onboard_cellular_ram.db, ce_n: onboard_cellular_ram.cen, oe_n: onboard_cellular_ram.oen, we_n: onboard_cellular_ram.wen, lb_n: onboard_cellular_ram.lbn, ub_n: onboard_cellular_ram.ubn, adv_n: onboard_cellular_ram.advn, cre: onboard_cellular_ram.cre, clk: onboard_cellular_ram.clk, wait: onboard_cellular_ram.wait}}
