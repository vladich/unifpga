# Layout of gatemate_evb_a1 generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/gatemate_evb_a1.yml; regenerate it with
# ./unifpga layout draft gatemate_evb_a1 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: gatemate_evb_a1
  verified: false
  generated: true

  connectors: []

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, params: {frequency_mhz: 10}, bind: {clk: clk}}
    - id: reset
      label: reset
      attach: {peripheral: reset_button, bind: {rst: onboard_reset}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {rx: onboard_uart.rx, tx: onboard_uart.tx}}
