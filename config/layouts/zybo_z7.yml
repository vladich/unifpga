# Layout of zybo_z7 generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/zybo_z7.yml; regenerate it with
# ./unifpga layout draft zybo_z7 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: zybo_z7
  verified: false
  generated: true

  connectors:
    - id: pmod_jb
      type: pin_row
      label: PMOD_JB (pin order from the pinmap)
      bank: pmod_jb
      pins: {'[0]': 'pmod_jb[0]', '[1]': 'pmod_jb[1]', '[2]': 'pmod_jb[2]', '[3]': 'pmod_jb[3]', '[4]': 'pmod_jb[4]', '[5]': 'pmod_jb[5]', '[6]': 'pmod_jb[6]', '[7]': 'pmod_jb[7]'}
    - id: pmod_jc
      type: pin_row
      label: PMOD_JC (pin order from the pinmap)
      bank: pmod_jc
      pins: {'[0]': 'pmod_jc[0]', '[1]': 'pmod_jc[1]', '[2]': 'pmod_jc[2]', '[3]': 'pmod_jc[3]', '[4]': 'pmod_jc[4]', '[5]': 'pmod_jc[5]', '[6]': 'pmod_jc[6]', '[7]': 'pmod_jc[7]'}
    - id: pmod_jd
      type: pin_row
      label: PMOD_JD (pin order from the pinmap)
      bank: pmod_jd
      pins: {'[0]': 'pmod_jd[0]', '[1]': 'pmod_jd[1]', '[2]': 'pmod_jd[2]', '[3]': 'pmod_jd[3]', '[4]': 'pmod_jd[4]', '[5]': 'pmod_jd[5]', '[6]': 'pmod_jd[6]', '[7]': 'pmod_jd[7]'}
    - id: pmod_je
      type: pin_row
      label: PMOD_JE (pin order from the pinmap)
      bank: pmod_je
      pins: {'[0]': 'pmod_je[0]', '[1]': 'pmod_je[1]', '[2]': 'pmod_je[2]', '[3]': 'pmod_je[3]', '[4]': 'pmod_je[4]', '[5]': 'pmod_je[5]', '[6]': 'pmod_je[6]', '[7]': 'pmod_je[7]'}

  onboard:
    - id: clk125mhz
      label: clk125mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 125}, bind: {clk: clk125mhz}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 4}, bind: {sw: onboard_switches}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4}, bind: {led: onboard_leds}}
