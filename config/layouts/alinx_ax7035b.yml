# Layout of alinx_ax7035b generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/alinx_ax7035b.yml; regenerate it with
# ./unifpga layout draft alinx_ax7035b (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: alinx_ax7035b
  verified: false
  generated: true

  connectors: []

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4, active: low}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 6, active: low, digits_active: low}, bind: {segments: ['onboard_7seg.segments[0]', 'onboard_7seg.segments[1]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[6]'], dp: 'onboard_7seg.segments[7]', digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]']}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
