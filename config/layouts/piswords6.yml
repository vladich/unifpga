# Layout of piswords6 generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (piswords6.yml); regenerate it with
# ./unifpga layout draft piswords6 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: piswords6
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]', '[13]': 'gpio[13]', '[14]': 'gpio[14]', '[15]': 'gpio[15]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 4}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 8, active: low, digits_active: low}, bind: {segments: ['onboard_7seg.segments[7]', 'onboard_7seg.segments[6]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[1]'], dp: 'onboard_7seg.segments[0]', digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]', 'onboard_7seg.anodes[6]', 'onboard_7seg.anodes[7]']}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 1, pin_bits_g: 1, pin_bits_b: 1, color_depth: 444}, bind: {r: ['onboard_vga.rgb[2]'], g: ['onboard_vga.rgb[1]'], b: ['onboard_vga.rgb[0]'], hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: buzzer
      label: BUZZER SP1 (S8550 Q1)
      device: {kind: buzzer, bank: onboard_buzzer}   # no peripheral model yet
    - id: eeprom
      label: EEPROM AT24C08 U3
      device: {kind: eeprom, bank: onboard_eeprom}   # no peripheral model yet
    - id: temperature
      label: DS18B20 temperature sensor U5
      device: {kind: temperature, bank: onboard_temperature}   # no peripheral model yet
    - id: sdram
      label: SDRAM HY57V641620 U2 (4M x16)
      device: {kind: sdram, bank: onboard_sdram}   # no peripheral model yet
    - id: lcd
      label: LCD1602 P2 (16-pin) and LCD12864 LCD1 (20-pin) sockets
      device: {kind: lcd, bank: onboard_lcd}   # no peripheral model yet
    - id: epcs4si8n_config_flash_u4
      label: EPCS4SI8N config flash U4
      device: {kind: flash, bank: onboard_epcs4si8n_config_flash_u4}   # no peripheral model yet
