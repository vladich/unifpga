# Layout of omdazz generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (omdazz.yml); regenerate it with
# ./unifpga layout draft omdazz (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: omdazz
  verified: false
  generated: true

  connectors:
    - id: gpio_pseudo_sdram
      type: pin_row
      label: GPIO_PSEUDO_SDRAM
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_pseudo_sdram
      pins: {'[0]': 'gpio_pseudo_sdram[0]', '[1]': 'gpio_pseudo_sdram[1]', '[2]': 'gpio_pseudo_sdram[2]', '[3]': 'gpio_pseudo_sdram[3]', '[4]': 'gpio_pseudo_sdram[4]', '[5]': 'gpio_pseudo_sdram[5]', '[6]': 'gpio_pseudo_sdram[6]', '[7]': 'gpio_pseudo_sdram[7]', '[8]': 'gpio_pseudo_sdram[8]', '[9]': 'gpio_pseudo_sdram[9]', '[10]': 'gpio_pseudo_sdram[10]', '[11]': 'gpio_pseudo_sdram[11]', '[12]': 'gpio_pseudo_sdram[12]', '[13]': 'gpio_pseudo_sdram[13]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: cpu_reset
      label: cpu reset
      attach: {peripheral: reset_button, bind: {rst: cpu_reset}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 4, active: low, digits_active: low}, bind: {segments: ['onboard_7seg.segments[7]', 'onboard_7seg.segments[6]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[1]'], dp: 'onboard_7seg.segments[0]', digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]']}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 1, pin_bits_g: 1, pin_bits_b: 1, color_depth: 444}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: uart
      label: uart
      variants:
        - id: uart_2wire
          label: uart_2wire (pins tx)
          attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
        - id: uart_2wire_2
          label: uart_2wire (pins fewer)
          attach: {peripheral: uart_2wire, bind: {rx: onboard_uart.rx}}
    - id: char_lcd
      label: char lcd
      variants:
        - id: gpio
          label: its pins as the design's gpio
          attach: {peripheral: gpio_header, params: {width: 11}, bind: {io: [onboard_char_lcd.d, onboard_char_lcd.e, onboard_char_lcd.rw, onboard_char_lcd.rs]}}
        - id: i2s_audio_out
          label: i2s_audio_out
          attach: {peripheral: i2s_audio_out, bind: {mclk: onboard_char_lcd.e, bclk: onboard_char_lcd.rs, lrclk: onboard_char_lcd.rw, sdata: 'onboard_char_lcd.d[0]'}}
        - id: inmp441_i2s_mic
          label: inmp441_i2s_mic
          attach: {peripheral: inmp441_i2s_mic, bind: {lr: 'onboard_char_lcd.d[5]', ws: 'onboard_char_lcd.d[3]', sck: 'onboard_char_lcd.d[1]', sd: 'onboard_char_lcd.d[2]'}}
    - id: buzzer
      label: Buzzer (BEEP, PNP driver)
      attach: {peripheral: buzzer, bind: {pwm: onboard_buzzer.beep}}
    - id: temp_sensor
      label: LM75(A) I2C temperature sensor
      attach: {peripheral: i2c_temperature_sensor, bind: {scl: onboard_temp_sensor.scl, sda: onboard_temp_sensor.sda}}
    - id: ps2
      label: PS/2 connector
      attach: {peripheral: ps2_keyboard, bind: {clk: onboard_ps2.clk, data: onboard_ps2.data}}
    - id: ir
      label: Infrared receiver
      device: {kind: ir, bank: onboard_ir}   # no peripheral model yet
    - id: eeprom
      label: AT24C08 I2C EEPROM
      device: {kind: eeprom, bank: onboard_eeprom}   # no peripheral model yet
    - id: sdram
      label: HY57V561620FTP-H SDRAM (x16)
      device: {kind: sdram, bank: onboard_sdram}   # no peripheral model yet
    - id: config_flash
      label: EPCS serial configuration flash (AS)
      device: {kind: flash, bank: onboard_config_flash}   # no peripheral model yet
    - id: gpio_p1
      label: P1 header (2x19)
      device: {kind: header, bank: gpio_p1}   # no peripheral model yet
    - id: gpio_p2
      label: P2 header (2x22)
      device: {kind: header, bank: gpio_p2}   # no peripheral model yet
    - id: gpio_p3
      label: P3 header (2x10)
      device: {kind: header, bank: gpio_p3}   # no peripheral model yet
    - id: jtag_and_as_10_pin_headers
      label: JTAG and AS 10-pin headers
      device: {kind: other, bank: onboard_jtag_and_as_10_pin_headers}   # no peripheral model yet
