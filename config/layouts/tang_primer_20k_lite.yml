# Layout of tang_primer_20k_lite generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/tang_primer_20k_lite.yml; regenerate it with
# ./unifpga layout draft tang_primer_20k_lite (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: tang_primer_20k_lite
  verified: false
  generated: true

  connectors:
    - id: gpio_3
      type: pin_row
      label: GPIO_3 (pin order from the pinmap)
      bank: gpio_3
      pins: {'[0]': 'gpio_3[0]', '[1]': 'gpio_3[1]', '[2]': 'gpio_3[2]', '[3]': 'gpio_3[3]', '[4]': 'gpio_3[4]', '[5]': 'gpio_3[5]', '[6]': 'gpio_3[6]', '[7]': 'gpio_3[7]'}
    - id: gpio_2
      type: pin_row
      label: GPIO_2 (pin order from the pinmap)
      bank: gpio_2
      pins: {'[0]': 'gpio_2[0]', '[1]': 'gpio_2[1]', '[2]': 'gpio_2[2]', '[3]': 'gpio_2[3]', '[4]': 'gpio_2[4]', '[5]': 'gpio_2[5]', '[6]': 'gpio_2[6]', '[7]': 'gpio_2[7]'}
    - id: gpio_1
      type: pin_row
      label: GPIO_1 (pin order from the pinmap)
      bank: gpio_1
      pins: {'[0]': 'gpio_1[0]', '[1]': 'gpio_1[1]', '[2]': 'gpio_1[2]', '[3]': 'gpio_1[3]', '[4]': 'gpio_1[4]', '[5]': 'gpio_1[5]', '[6]': 'gpio_1[6]', '[7]': 'gpio_1[7]'}
    - id: gpio_0
      type: pin_row
      label: GPIO_0 (pin order from the pinmap)
      bank: gpio_0
      pins: {'[0]': 'gpio_0[0]', '[1]': 'gpio_0[1]', '[2]': 'gpio_0[2]', '[3]': 'gpio_0[3]', '[4]': 'gpio_0[4]', '[5]': 'gpio_0[5]', '[6]': 'gpio_0[6]', '[7]': 'gpio_0[7]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 2}, bind: {sw: onboard_switches}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
