# Layout of fireant generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (fireant.yml); regenerate it with
# ./unifpga layout draft fireant (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: fireant
  verified: false
  generated: true

  connectors: []

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4, active: low}, bind: {led: onboard_leds}}
    - id: crst_button_configuration_reset
      label: CRST button (configuration reset)
      device: {kind: reset, bank: onboard_crst_button_configuration_reset}   # no peripheral model yet
    - id: other
      label: LED_CDN (green, CDONE) and LED_PWR (red)
      device: {kind: other, bank: onboard_other}   # no peripheral model yet
    - id: spi_flash
      label: U4 W25Q80DV SPI flash (configuration)
      device: {kind: flash, bank: onboard_spi_flash}   # no peripheral model yet
    - id: jtag_test_points_tp8_tp11
      label: JTAG test points TP8..TP11
      device: {kind: other, bank: onboard_jtag_test_points_tp8_tp11}   # no peripheral model yet
