# Layout of m2s025_starter generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (m2s025_starter.yml); regenerate it with
# ./unifpga layout draft m2s025_starter (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: m2s025_starter
  verified: false
  generated: true

  connectors:
    - id: breadboard_p7
      type: pin_row
      label: BREADBOARD_P7 (pin order from the pinmap)
      bank: breadboard_p7
      pins: {'[0]': 'breadboard_p7[0]', '[1]': 'breadboard_p7[1]', '[2]': 'breadboard_p7[2]', '[3]': 'breadboard_p7[3]', '[4]': 'breadboard_p7[4]', '[5]': 'breadboard_p7[5]', '[6]': 'breadboard_p7[6]', '[7]': 'breadboard_p7[7]', '[8]': 'breadboard_p7[8]', '[9]': 'breadboard_p7[9]', '[10]': 'breadboard_p7[10]'}
