# Layout of m2s025_starter generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/m2s025_starter.yml; regenerate it with
# ./unifpga layout draft m2s025_starter (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: m2s025_starter
  verified: false
  generated: true

  connectors: []

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk}}
    - id: reset
      label: reset
      attach: {peripheral: reset_button, bind: {rst: onboard_reset}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 3}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds}}
