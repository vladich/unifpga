# Layout of de2 generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (de2.yml); regenerate it with
# ./unifpga layout draft de2 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: de2
  verified: false
  generated: true

  connectors:
    - id: gpio_0
      type: pin_row
      label: GPIO_0 (pin order from the pinmap)
      bank: gpio_0
      pins: {'[0]': 'gpio_0[0]', '[1]': 'gpio_0[1]', '[2]': 'gpio_0[2]', '[3]': 'gpio_0[3]', '[4]': 'gpio_0[4]', '[5]': 'gpio_0[5]', '[6]': 'gpio_0[6]', '[7]': 'gpio_0[7]', '[8]': 'gpio_0[8]', '[9]': 'gpio_0[9]', '[10]': 'gpio_0[10]', '[11]': 'gpio_0[11]', '[12]': 'gpio_0[12]', '[13]': 'gpio_0[13]', '[14]': 'gpio_0[14]', '[15]': 'gpio_0[15]', '[16]': 'gpio_0[16]', '[17]': 'gpio_0[17]', '[18]': 'gpio_0[18]', '[19]': 'gpio_0[19]', '[20]': 'gpio_0[20]', '[21]': 'gpio_0[21]', '[22]': 'gpio_0[22]', '[23]': 'gpio_0[23]', '[24]': 'gpio_0[24]', '[25]': 'gpio_0[25]', '[26]': 'gpio_0[26]', '[27]': 'gpio_0[27]', '[28]': 'gpio_0[28]', '[29]': 'gpio_0[29]', '[30]': 'gpio_0[30]', '[31]': 'gpio_0[31]', '[32]': 'gpio_0[32]', '[33]': 'gpio_0[33]', '[34]': 'gpio_0[34]', '[35]': 'gpio_0[35]'}
    - id: gpio_1
      type: pin_row
      label: GPIO_1 (pin order from the pinmap)
      bank: gpio_1
      pins: {'[0]': 'gpio_1[0]', '[1]': 'gpio_1[1]', '[2]': 'gpio_1[2]', '[3]': 'gpio_1[3]', '[4]': 'gpio_1[4]', '[5]': 'gpio_1[5]', '[6]': 'gpio_1[6]', '[7]': 'gpio_1[7]', '[8]': 'gpio_1[8]', '[9]': 'gpio_1[9]', '[10]': 'gpio_1[10]', '[11]': 'gpio_1[11]', '[12]': 'gpio_1[12]', '[13]': 'gpio_1[13]', '[14]': 'gpio_1[14]', '[15]': 'gpio_1[15]', '[16]': 'gpio_1[16]', '[17]': 'gpio_1[17]', '[18]': 'gpio_1[18]', '[19]': 'gpio_1[19]', '[20]': 'gpio_1[20]', '[21]': 'gpio_1[21]', '[22]': 'gpio_1[22]', '[23]': 'gpio_1[23]', '[24]': 'gpio_1[24]', '[25]': 'gpio_1[25]', '[26]': 'gpio_1[26]', '[27]': 'gpio_1[27]', '[28]': 'gpio_1[28]', '[29]': 'gpio_1[29]', '[30]': 'gpio_1[30]', '[31]': 'gpio_1[31]', '[32]': 'gpio_1[32]', '[33]': 'gpio_1[33]', '[34]': 'gpio_1[34]', '[35]': 'gpio_1[35]'}

  onboard:
    - id: clk50mhz
      label: clk50mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk50mhz}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds_green
      label: leds green
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: ['onboard_leds_green[0]', 'onboard_leds_green[1]', 'onboard_leds_green[2]', 'onboard_leds_green[3]', 'onboard_leds_green[4]', 'onboard_leds_green[5]', 'onboard_leds_green[6]', 'onboard_leds_green[7]']}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 18}, bind: {led: onboard_leds}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 18}, bind: {sw: onboard_switches}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_per_digit, params: {digits: 8, segs: 7}, bind: {hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5, onboard_7seg.hex6, onboard_7seg.hex7]}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 10, bits_g: 10, bits_b: 10, pin_bits_r: 10, pin_bits_g: 10, pin_bits_b: 10, color_depth: 444, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs, clk: onboard_vga.clk, blank_n: onboard_vga.blank}}
    - id: audio_codec
      label: audio codec
      attach: {peripheral: wm8731_i2s_out, bind: {xck: onboard_audio_codec.xck, bclk: onboard_audio_codec.bclk, dac_lrck: onboard_audio_codec.dac_lrck, dac_dat: onboard_audio_codec.dac_dat, i2c_sclk: onboard_i2c.sclk, i2c_sdat: onboard_i2c.sdat}}
    - id: clk27mhz
      label: CLOCK_27 (27 MHz)
      device: {kind: clock, bank: onboard_clk27mhz}   # no peripheral model yet
    - id: ext_clock
      label: External clock input (SMA)
      device: {kind: clock, bank: onboard_ext_clock}   # no peripheral model yet
    - id: lcd
      label: Character LCD module (16x2)
      device: {kind: lcd_char, bank: onboard_lcd}   # no peripheral model yet
    - id: ps2
      label: PS/2 port
      device: {kind: ps2, bank: onboard_ps2}   # no peripheral model yet
    - id: ethernet
      label: Fast Ethernet (DM9000A)
      device: {kind: ethernet, bank: onboard_ethernet}   # no peripheral model yet
    - id: tv_decoder
      label: TV decoder (ADV7180 per manual)
      device: {kind: video_decoder, bank: onboard_tv_decoder}   # no peripheral model yet
    - id: usb
      label: USB host/device (ISP1362)
      device: {kind: usb, bank: onboard_usb}   # no peripheral model yet
    - id: irda
      label: IrDA transceiver
      device: {kind: ir, bank: onboard_irda}   # no peripheral model yet
    - id: sdram
      label: SDRAM (8 MB, 16-bit)
      device: {kind: sdram, bank: onboard_sdram}   # no peripheral model yet
    - id: sram
      label: SRAM (512 KB, 16-bit)
      device: {kind: other, bank: onboard_sram}   # no peripheral model yet
    - id: flash
      label: Flash memory (4 MB, 8-bit)
      device: {kind: flash, bank: onboard_flash}   # no peripheral model yet
    - id: usb_blaster_jtag
      label: USB-Blaster JTAG link to FPGA (Control Panel)
      device: {kind: other, bank: onboard_usb_blaster_jtag}   # no peripheral model yet
    - id: sdcard
      label: SD card socket
      device: {kind: sdcard, bank: onboard_sdcard}   # no peripheral model yet
