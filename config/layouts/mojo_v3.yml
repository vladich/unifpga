# Layout of mojo_v3 generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/mojo_v3.yml; regenerate it with
# ./unifpga layout draft mojo_v3 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: mojo_v3
  verified: false
  generated: true

  connectors: []

  onboard:
    - id: clk50mhz
      label: clk50mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk50mhz}}
    - id: reset
      label: reset
      attach: {peripheral: reset_button, bind: {rst: onboard_reset}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds}}
