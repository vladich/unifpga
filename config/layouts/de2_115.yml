# Layout of de2_115 generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (de2_115.yml); regenerate it with
# ./unifpga layout draft de2_115 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: de2_115
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]', '[13]': 'gpio[13]', '[14]': 'gpio[14]', '[15]': 'gpio[15]', '[16]': 'gpio[16]', '[17]': 'gpio[17]', '[18]': 'gpio[18]', '[19]': 'gpio[19]', '[20]': 'gpio[20]', '[21]': 'gpio[21]', '[22]': 'gpio[22]', '[23]': 'gpio[23]', '[24]': 'gpio[24]', '[25]': 'gpio[25]', '[26]': 'gpio[26]', '[27]': 'gpio[27]', '[28]': 'gpio[28]', '[29]': 'gpio[29]', '[30]': 'gpio[30]', '[31]': 'gpio[31]', '[32]': 'gpio[32]', '[33]': 'gpio[33]', '[34]': 'gpio[34]', '[35]': 'gpio[35]'}

  onboard:
    - id: clk50mhz
      label: clk50mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk50mhz}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 18}, bind: {sw: onboard_switches}}
    - id: leds_green
      label: leds green
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: ['onboard_leds_green[0]', 'onboard_leds_green[1]', 'onboard_leds_green[2]', 'onboard_leds_green[3]', 'onboard_leds_green[4]', 'onboard_leds_green[5]', 'onboard_leds_green[6]', 'onboard_leds_green[7]']}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 18}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_per_digit, params: {digits: 8, segs: 7}, bind: {hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5, onboard_7seg.hex6, onboard_7seg.hex7]}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 8, bits_g: 8, bits_b: 8, pin_bits_r: 8, pin_bits_g: 8, pin_bits_b: 8, color_depth: 888, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs, clk: onboard_vga.clk, blank_n: onboard_vga.blank_n}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: audio_codec
      label: audio codec
      attach: {peripheral: wm8731_i2s_out, bind: {xck: onboard_audio_codec.xck, bclk: onboard_audio_codec.bclk, dac_lrck: onboard_audio_codec.dac_lrck, dac_dat: onboard_audio_codec.dac_dat, i2c_sclk: onboard_i2c.sclk, i2c_sdat: onboard_i2c.sdat}}
    - id: clk2_50mhz
      label: CLOCK2_50 (50 MHz)
      device: {kind: clock, bank: onboard_clk2_50mhz}   # no peripheral model yet
    - id: clk3_50mhz
      label: CLOCK3_50 (50 MHz)
      device: {kind: clock, bank: onboard_clk3_50mhz}   # no peripheral model yet
    - id: sma_clkout
      label: SMA clock output
      device: {kind: clock, bank: onboard_sma_clkout}   # no peripheral model yet
    - id: sma_clkin
      label: SMA clock input
      device: {kind: clock, bank: onboard_sma_clkin}   # no peripheral model yet
    - id: lcd
      label: Character LCD module (16x2)
      device: {kind: lcd_char, bank: onboard_lcd}   # no peripheral model yet
    - id: hsmc
      label: HSMC connector
      device: {kind: header, bank: hsmc}   # no peripheral model yet
    - id: ex_io
      label: Extended I/O header (EX_IO, JP4 2x7)
      device: {kind: header, bank: ex_io}   # no peripheral model yet
    - id: ps2
      label: PS/2 port (primary)
      device: {kind: ps2, bank: onboard_ps2}   # no peripheral model yet
    - id: ps2_secondary
      label: PS/2 port (secondary, via Y-cable)
      device: {kind: ps2, bank: onboard_ps2_secondary}   # no peripheral model yet
    - id: ethernet0
      label: Gigabit Ethernet PHY 0 (88E1111)
      device: {kind: ethernet, bank: onboard_ethernet0}   # no peripheral model yet
    - id: ethernet1
      label: Gigabit Ethernet PHY 1 (88E1111)
      device: {kind: ethernet, bank: onboard_ethernet1}   # no peripheral model yet
    - id: enetclk_25mhz
      label: Ethernet 25 MHz clock (ENETCLK_25)
      device: {kind: clock, bank: onboard_enetclk_25mhz}   # no peripheral model yet
    - id: tv_decoder
      label: TV decoder (ADV7180)
      device: {kind: video_decoder, bank: onboard_tv_decoder}   # no peripheral model yet
    - id: usb
      label: USB host/device (CY7C67200)
      device: {kind: usb, bank: onboard_usb}   # no peripheral model yet
    - id: irda
      label: IR receiver
      device: {kind: ir, bank: onboard_irda}   # no peripheral model yet
    - id: sram
      label: SRAM (2 MB, 16-bit)
      device: {kind: other, bank: onboard_sram}   # no peripheral model yet
    - id: sdram
      label: SDRAM (128 MB, 32-bit)
      device: {kind: sdram, bank: onboard_sdram}   # no peripheral model yet
    - id: flash
      label: Flash memory (8 MB, 8-bit)
      device: {kind: flash, bank: onboard_flash}   # no peripheral model yet
    - id: eeprom
      label: EEPROM (I2C)
      device: {kind: other, bank: onboard_eeprom}   # no peripheral model yet
    - id: sdcard
      label: SD card socket
      device: {kind: sdcard, bank: onboard_sdcard}   # no peripheral model yet
