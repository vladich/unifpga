# Layout of tang_nano_4k generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (tang_nano_4k.yml); regenerate it with
# ./unifpga layout draft tang_nano_4k (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: tang_nano_4k
  verified: false
  generated: true

  connectors:
    - id: header_p6
      type: pin_row
      label: HEADER_P6
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: header_p6
      pins: {'[0]': 'header_p6[0]', '[1]': 'header_p6[1]', '[2]': 'header_p6[2]', '[3]': 'header_p6[3]', '[4]': 'header_p6[4]', '[5]': 'header_p6[5]', '[6]': 'header_p6[6]', '[7]': 'header_p6[7]', '[8]': 'header_p6[8]', '[9]': 'header_p6[9]', '[10]': 'header_p6[10]', '[11]': 'header_p6[11]', '[12]': 'header_p6[12]', '[13]': 'header_p6[13]', '[14]': 'header_p6[14]', '[15]': 'header_p6[15]', '[16]': 'header_p6[16]', '[17]': 'header_p6[17]'}
    - id: header_p7
      type: pin_row
      label: HEADER_P7
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: header_p7
      pins: {'[0]': 'header_p7[0]', '[1]': 'header_p7[1]', '[2]': 'header_p7[2]', '[3]': 'header_p7[3]', '[4]': 'header_p7[4]', '[5]': 'header_p7[5]', '[6]': 'header_p7[6]', '[7]': 'header_p7[7]', '[8]': 'header_p7[8]', '[9]': 'header_p7[9]', '[10]': 'header_p7[10]', '[11]': 'header_p7[11]', '[12]': 'header_p7[12]', '[13]': 'header_p7[13]', '[14]': 'header_p7[14]', '[15]': 'header_p7[15]', '[16]': 'header_p7[16]', '[17]': 'header_p7[17]', '[18]': 'header_p7[18]', '[19]': 'header_p7[19]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: hdmi
      label: hdmi
      attach: {peripheral: hdmi_tmds, params: {timing: lab, clock_serial_mhz: 270}, bind: {clk_p: onboard_hdmi.clk_p, d_p: onboard_hdmi.d_p, clk_n: onboard_hdmi.clk_n, d_n: onboard_hdmi.d_n}}
    - id: camera
      label: camera
      variants:
        - id: gpio
          label: its pins as the design's gpio
          attach: {peripheral: gpio_header, params: {width: 2}, bind: {io: [onboard_camera.scl, onboard_camera.sda]}}
        - id: i2s_audio_out
          label: i2s_audio_out
          attach: {peripheral: i2s_audio_out, bind: {mclk: 'onboard_camera.data[1]', bclk: onboard_camera.pclk, sdata: onboard_camera.hsync, lrclk: onboard_camera.vsync}}
        - id: inmp441_i2s_mic
          label: inmp441_i2s_mic
          attach: {peripheral: inmp441_i2s_mic, bind: {lr: onboard_serial_flash.hold, ws: onboard_serial_flash.wp, sck: onboard_serial_flash.cs, sd: 'onboard_camera.data[0]'}}
    - id: led
      label: led
      attach: {peripheral: led_bank, params: {width: 1}, bind: {led: onboard_led}}
    - id: serial_flash
      label: serial flash
      attach: {peripheral: tm1638_led_key, bind: {dio: onboard_serial_flash.do, clk: onboard_serial_flash.di, stb: onboard_serial_flash.clk}}
    - id: jtag
      label: JTAG (BL702 USB-JTAG through 0R R34/R41/R43/R44, ESD diodes)
      device: {kind: other, bank: onboard_jtag}   # no peripheral model yet
