# Layout of karnix_ecp5 generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (karnix_ecp5.yml); regenerate it with
# ./unifpga layout draft karnix_ecp5 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: karnix_ecp5
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]', '[13]': 'gpio[13]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4}, bind: {led: onboard_leds}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 2}, bind: {sw: onboard_switches}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: reset_button_sw5_fpga_reset
      label: RESET button SW5 (FPGA_RESET)
      device: {kind: reset, bank: onboard_reset_button_sw5_fpga_reset}   # no peripheral model yet
    - id: sram
      label: U21 K6R4016V1D-TC10 256Kx16 async SRAM (512 KB)
      device: {kind: other, bank: onboard_sram}   # no peripheral model yet
    - id: ethernet
      label: U8 LAN8710AI 10/100 Ethernet PHY (MII) + XS4 RJ45 (passive PoE)
      device: {kind: ethernet, bank: onboard_ethernet}   # no peripheral model yet
    - id: rs485
      label: U9 MAX487 RS-485 transceiver (XS3)
      device: {kind: other, bank: onboard_rs485}   # no peripheral model yet
    - id: hdmi
      label: J3 HDMI connector (direct from FPGA, series capacitors)
      device: {kind: hdmi_tx, bank: onboard_hdmi}   # no peripheral model yet
    - id: adc
      label: U10 ADC128S052 SPI ADC (XS6..XS9 inputs, mic via audio jack)
      device: {kind: other, bank: onboard_adc}   # no peripheral model yet
    - id: dac
      label: U11 AD5328 SPI DAC (XS10/XS11 outputs, XS12 audio L/R)
      device: {kind: audio, bank: onboard_dac}   # no peripheral model yet
    - id: eeprom
      label: U6 AT24C01C I2C EEPROM (1 kbit) + J2 EEPROM RESET jumper
      device: {kind: eeprom, bank: onboard_eeprom}   # no peripheral model yet
    - id: serial_flash
      label: U7 W25Q128JVPIQ SPI config flash (quad)
      device: {kind: flash, bank: onboard_serial_flash}   # no peripheral model yet
    - id: other
      label: U20 FT2232D channel A — JTAG (+ J4 external JTAG header)
      device: {kind: other, bank: onboard_other}   # no peripheral model yet
