# Layout of saylinx generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (saylinx.yml); regenerate it with
# ./unifpga layout draft saylinx (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: saylinx
  verified: false
  generated: true

  connectors:
    - id: gpio_0
      type: pin_row
      label: GPIO_0
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_0
      pins: {'[0]': 'gpio_0[0]', '[1]': 'gpio_0[1]', '[2]': 'gpio_0[2]', '[3]': 'gpio_0[3]', '[4]': 'gpio_0[4]', '[5]': 'gpio_0[5]', '[6]': 'gpio_0[6]', '[7]': 'gpio_0[7]', '[8]': 'gpio_0[8]', '[9]': 'gpio_0[9]', '[10]': 'gpio_0[10]', '[11]': 'gpio_0[11]', '[12]': 'gpio_0[12]', '[13]': 'gpio_0[13]', '[14]': 'gpio_0[14]', '[15]': 'gpio_0[15]', '[16]': 'gpio_0[16]', '[17]': 'gpio_0[17]', '[18]': 'gpio_0[18]', '[19]': 'gpio_0[19]', '[20]': 'gpio_0[20]', '[21]': 'gpio_0[21]', '[22]': 'gpio_0[22]', '[23]': 'gpio_0[23]', '[24]': 'gpio_0[24]', '[25]': 'gpio_0[25]', '[26]': 'gpio_0[26]', '[27]': 'gpio_0[27]', '[28]': 'gpio_0[28]', '[29]': 'gpio_0[29]', '[30]': 'gpio_0[30]', '[31]': 'gpio_0[31]', '[32]': 'gpio_0[32]', '[33]': 'gpio_0[33]'}
    - id: gpio_1
      type: pin_row
      label: GPIO_1
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_1
      pins: {'[0]': 'gpio_1[0]', '[1]': 'gpio_1[1]', '[2]': 'gpio_1[2]', '[3]': 'gpio_1[3]', '[4]': 'gpio_1[4]', '[5]': 'gpio_1[5]', '[6]': 'gpio_1[6]', '[7]': 'gpio_1[7]', '[8]': 'gpio_1[8]', '[9]': 'gpio_1[9]', '[10]': 'gpio_1[10]', '[11]': 'gpio_1[11]', '[12]': 'gpio_1[12]', '[13]': 'gpio_1[13]', '[14]': 'gpio_1[14]', '[15]': 'gpio_1[15]', '[16]': 'gpio_1[16]', '[17]': 'gpio_1[17]', '[18]': 'gpio_1[18]', '[19]': 'gpio_1[19]', '[20]': 'gpio_1[20]', '[21]': 'gpio_1[21]', '[22]': 'gpio_1[22]', '[23]': 'gpio_1[23]', '[24]': 'gpio_1[24]', '[25]': 'gpio_1[25]', '[26]': 'gpio_1[26]', '[27]': 'gpio_1[27]', '[28]': 'gpio_1[28]', '[29]': 'gpio_1[29]', '[30]': 'gpio_1[30]', '[31]': 'gpio_1[31]', '[32]': 'gpio_1[32]', '[33]': 'gpio_1[33]'}
    - id: camera
      type: pin_row
      label: CAMERA
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: camera
      pins: {'[0]': 'camera[0]', '[1]': 'camera[1]', '[2]': 'camera[2]', '[3]': 'camera[3]', '[4]': 'camera[4]', '[5]': 'camera[5]', '[6]': 'camera[6]', '[7]': 'camera[7]', '[8]': 'camera[8]', '[9]': 'camera[9]', '[10]': 'camera[10]', '[11]': 'camera[11]', '[12]': 'camera[12]', '[13]': 'camera[13]', '[14]': 'camera[14]', '[15]': 'camera[15]', '[16]': 'camera[16]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 3}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 8, active: low, digits_active: low}, bind: {segments: ['onboard_7seg.segments[7]', 'onboard_7seg.segments[6]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[1]'], dp: 'onboard_7seg.segments[0]', digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]', 'onboard_7seg.anodes[6]', 'onboard_7seg.anodes[7]']}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 5, bits_g: 6, bits_b: 5, pin_bits_r: 5, pin_bits_g: 6, pin_bits_b: 5, color_depth: 565}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: buzzer
      label: 蜂鸣器 LS1 (S8550 Q7)
      device: {kind: buzzer, bank: onboard_buzzer}   # no peripheral model yet
    - id: sdcard
      label: SD卡座 U14 (SPI mode)
      device: {kind: sdcard, bank: onboard_sdcard}   # no peripheral model yet
    - id: eeprom
      label: EEPROM 24LC04 U12
      device: {kind: eeprom, bank: onboard_eeprom}   # no peripheral model yet
    - id: rtc
      label: 实时时钟 DS1302 U11 (32.768 kHz, battery)
      device: {kind: other, bank: onboard_rtc}   # no peripheral model yet
    - id: sdram
      label: SDRAM HY57V2562GTR U9 (256 Mbit, 16M x16)
      device: {kind: sdram, bank: onboard_sdram}   # no peripheral model yet
    - id: flash
      label: M25P16 (EPCS16) serial configuration flash U8
      device: {kind: flash, bank: onboard_flash}   # no peripheral model yet
    - id: jtag_j3_10_pin
      label: JTAG J3 (10-pin)
      device: {kind: other, bank: onboard_jtag_j3_10_pin}   # no peripheral model yet
    - id: led5_config_conf_done_led6_power
      label: LED5 CONFIG (CONF_DONE) / LED6 power
      device: {kind: other, bank: onboard_led5_config_conf_done_led6_power}   # no peripheral model yet
