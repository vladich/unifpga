      label: fpga clk1 50mhz
      attach: {peripheral: clock_input, bind: {clk: fpga_clk1_50mhz}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
