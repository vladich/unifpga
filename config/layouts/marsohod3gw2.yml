# Layout of marsohod3gw2 generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (marsohod3gw2.yml); regenerate it with
# ./unifpga layout draft marsohod3gw2 (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: marsohod3gw2
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]', '[13]': 'gpio[13]', '[14]': 'gpio[14]', '[15]': 'gpio[15]', '[16]': 'gpio[16]', '[17]': 'gpio[17]', '[18]': 'gpio[18]', '[19]': 'gpio[19]'}

  onboard:
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: ft_bridge
      label: ft bridge
      attach: {peripheral: uart_2wire, bind: {tx: onboard_ft_bridge.b1, rx: onboard_ft_bridge.b0}}
    - id: adc
      label: adc
      attach: {peripheral: adc_8bit_mic, bind: {d: onboard_adc.d, clk: onboard_adc.clk}}
    - id: hdmi
      label: hdmi
      attach: {peripheral: hdmi_tmds, params: {timing: design, clock_serial_mhz: 250}, bind: {d_p: onboard_hdmi.d_p, clk_p: onboard_hdmi.clk_p, clk_n: onboard_hdmi.clk_n, d_n: onboard_hdmi.d_n}}
    - id: other
      label: JTAG (FPGA dedicated) + JTAG2 external header
      device: {kind: other, bank: onboard_other}   # no peripheral model yet
