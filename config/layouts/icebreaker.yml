# Layout of icebreaker generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/icebreaker.yml; regenerate it with
# ./unifpga layout draft icebreaker (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: icebreaker
  verified: false
  generated: true

  connectors:
    - id: pmod_p1a
      type: pin_row
      label: PMOD_P1A (pin order from the pinmap)
      bank: pmod_p1a
      pins: {'[0]': 'pmod_p1a[0]', '[1]': 'pmod_p1a[1]', '[2]': 'pmod_p1a[2]', '[3]': 'pmod_p1a[3]', '[4]': 'pmod_p1a[4]', '[5]': 'pmod_p1a[5]', '[6]': 'pmod_p1a[6]', '[7]': 'pmod_p1a[7]'}
    - id: pmod_p1b
      type: pin_row
      label: PMOD_P1B (pin order from the pinmap)
      bank: pmod_p1b
      pins: {'[0]': 'pmod_p1b[0]', '[1]': 'pmod_p1b[1]', '[2]': 'pmod_p1b[2]', '[3]': 'pmod_p1b[3]', '[4]': 'pmod_p1b[4]', '[5]': 'pmod_p1b[5]', '[6]': 'pmod_p1b[6]', '[7]': 'pmod_p1b[7]'}
    - id: pmod_p2
      type: pin_row
      label: PMOD_P2 (pin order from the pinmap)
      bank: pmod_p2
      pins: {'[0]': 'pmod_p2[0]', '[1]': 'pmod_p2[1]', '[2]': 'pmod_p2[2]', '[3]': 'pmod_p2[3]', '[4]': 'pmod_p2[4]', '[5]': 'pmod_p2[5]', '[6]': 'pmod_p2[6]', '[7]': 'pmod_p2[7]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: button
      label: button
      attach: {peripheral: button_array, params: {width: 1}, bind: {btn: onboard_button}}
    - id: rgb_led_0
      label: rgb led 0
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_0.r, g: onboard_rgb_led_0.g, b: onboard_rgb_led_0.b}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 5}, bind: {led: onboard_leds}}
    - id: led_green
      label: led green
      attach: {peripheral: led_bank, params: {width: 1, active: low}, bind: {led: onboard_led_green}}
    - id: led_red
      label: led red
      attach: {peripheral: led_bank, params: {width: 1, active: low}, bind: {led: onboard_led_red}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 3}, bind: {btn: onboard_buttons}}
