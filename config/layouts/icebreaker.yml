# Layout of icebreaker generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (icebreaker.yml); regenerate it with
# ./unifpga layout draft icebreaker (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: icebreaker
  verified: false
  generated: true

  connectors:
    - id: pmod_p1a
      type: pmod_2x6
      label: PMOD1A
      bank: pmod_p1a
      pins: {'1': 'pmod_p1a[0]', '2': 'pmod_p1a[1]', '3': 'pmod_p1a[2]', '4': 'pmod_p1a[3]', '7': 'pmod_p1a[4]', '8': 'pmod_p1a[5]', '9': 'pmod_p1a[6]', '10': 'pmod_p1a[7]'}
    - id: pmod_p1b
      type: pmod_2x6
      label: PMOD1B
      bank: pmod_p1b
      pins: {'1': 'pmod_p1b[0]', '2': 'pmod_p1b[1]', '3': 'pmod_p1b[2]', '4': 'pmod_p1b[3]', '7': 'pmod_p1b[4]', '8': 'pmod_p1b[5]', '9': 'pmod_p1b[6]', '10': 'pmod_p1b[7]'}
    - id: pmod_p2
      type: pmod_2x6
      label: PMOD2 (the break-off LED / button board's connector)
      bank: pmod_p2
      pins: {'1': 'pmod_p2[0]', '2': 'pmod_p2[1]', '3': 'pmod_p2[2]', '4': 'pmod_p2[3]', '7': 'pmod_p2[4]', '8': 'pmod_p2[5]', '9': 'pmod_p2[6]', '10': 'pmod_p2[7]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: button
      label: button
      attach: {peripheral: button_array, params: {width: 1}, bind: {btn: onboard_button}}
    - id: rgb_led_0
      label: rgb led 0
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_0.r, g: onboard_rgb_led_0.g, b: onboard_rgb_led_0.b}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 5}, bind: {led: onboard_leds}}
    - id: led_green
      label: led green
      attach: {peripheral: led_bank, params: {width: 1, active: low}, bind: {led: onboard_led_green}}
    - id: led_red
      label: led red
      attach: {peripheral: led_bank, params: {width: 1, active: low}, bind: {led: onboard_led_red}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 3}, bind: {btn: onboard_buttons}}
