      bank: pmod_2
      pins: {'[0]': 'pmod_2[0]', '[1]': 'pmod_2[1]', '[2]': 'pmod_2[2]', '[3]': 'pmod_2[3]', '[4]': 'pmod_2[4]', '[5]': 'pmod_2[5]', '[6]': 'pmod_2[6]', '[7]': 'pmod_2[7]'}
    - id: som_j1
      type: pin_row
      label: SOM_J1 (pin order from the pinmap)
      bank: som_j1
      pins: {'[0]': 'som_j1[0]', '[1]': 'som_j1[1]', '[2]': 'som_j1[2]', '[3]': 'som_j1[3]', '[4]': 'som_j1[4]', '[5]': 'som_j1[5]', '[6]': 'som_j1[6]', '[7]': 'som_j1[7]', '[8]': 'som_j1[8]', '[9]': 'som_j1[9]', '[10]': 'som_j1[10]', '[11]': 'som_j1[11]', '[12]': 'som_j1[12]', '[13]': 'som_j1[13]', '[14]': 'som_j1[14]', '[15]': 'som_j1[15]', '[16]': 'som_j1[16]', '[17]': 'som_j1[17]', '[18]': 'som_j1[18]', '[19]': 'som_j1[19]', '[20]': 'som_j1[20]', '[21]': 'som_j1[21]', '[22]': 'som_j1[22]', '[23]': 'som_j1[23]', '[24]': 'som_j1[24]', '[25]': 'som_j1[25]', '[26]': 'som_j1[26]', '[27]': 'som_j1[27]', '[28]': 'som_j1[28]', '[29]': 'som_j1[29]', '[30]': 'som_j1[30]', '[31]': 'som_j1[31]', '[32]': 'som_j1[32]', '[33]': 'som_j1[33]', '[34]': 'som_j1[34]', '[35]': 'som_j1[35]', '[36]': 'som_j1[36]', '[37]': 'som_j1[37]', '[38]': 'som_j1[38]', '[39]': 'som_j1[39]', '[40]': 'som_j1[40]', '[41]': 'som_j1[41]', '[42]': 'som_j1[42]', '[43]': 'som_j1[43]', '[44]': 'som_j1[44]', '[45]': 'som_j1[45]', '[46]': 'som_j1[46]'}
