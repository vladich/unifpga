# Layout of tang_primer_25k generated by tools/layout_draft.py from its pinmap, its
# configurations and config/board_sources/tang_primer_25k.yml; regenerate it with
# ./unifpga layout draft tang_primer_25k (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: tang_primer_25k
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]', '[13]': 'gpio[13]', '[14]': 'gpio[14]', '[15]': 'gpio[15]', '[16]': 'gpio[16]', '[17]': 'gpio[17]', '[18]': 'gpio[18]', '[19]': 'gpio[19]', '[20]': 'gpio[20]', '[21]': 'gpio[21]', '[22]': 'gpio[22]', '[23]': 'gpio[23]', '[24]': 'gpio[24]', '[25]': 'gpio[25]', '[26]': 'gpio[26]', '[27]': 'gpio[27]', '[28]': 'gpio[28]', '[29]': 'gpio[29]', '[30]': 'gpio[30]', '[31]': 'gpio[31]', '[32]': 'gpio[32]', '[33]': 'gpio[33]', '[34]': 'gpio[34]', '[35]': 'gpio[35]', '[36]': 'gpio[36]', '[37]': 'gpio[37]'}
    - id: pmod_0
      type: pin_row
      label: PMOD_0 (pin order from the pinmap)
      bank: pmod_0
      pins: {'[0]': 'pmod_0[0]', '[1]': 'pmod_0[1]', '[2]': 'pmod_0[2]', '[3]': 'pmod_0[3]', '[4]': 'pmod_0[4]', '[5]': 'pmod_0[5]', '[6]': 'pmod_0[6]', '[7]': 'pmod_0[7]'}
    - id: pmod_1
      type: pin_row
      label: PMOD_1 (pin order from the pinmap)
      bank: pmod_1
      pins: {'[0]': 'pmod_1[0]', '[1]': 'pmod_1[1]', '[2]': 'pmod_1[2]', '[3]': 'pmod_1[3]', '[4]': 'pmod_1[4]', '[5]': 'pmod_1[5]', '[6]': 'pmod_1[6]', '[7]': 'pmod_1[7]'}
    - id: pmod_2
      type: pin_row
      label: PMOD_2 (pin order from the pinmap)
      bank: pmod_2
      pins: {'[0]': 'pmod_2[0]', '[1]': 'pmod_2[1]', '[2]': 'pmod_2[2]', '[3]': 'pmod_2[3]', '[4]': 'pmod_2[4]', '[5]': 'pmod_2[5]', '[6]': 'pmod_2[6]', '[7]': 'pmod_2[7]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: hdmi_0
      label: hdmi 0
      attach: {peripheral: hdmi_tmds, params: {clock_serial_mhz: 250}, bind: {clk_p: onboard_hdmi_0.clk_p, d_p: onboard_hdmi_0.d_p, clk_n: onboard_hdmi_0.clk_n, d_n: onboard_hdmi_0.d_n}}
