# Layout of terasic_sockit generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (terasic_sockit.yml); regenerate it with
# ./unifpga layout draft terasic_sockit (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: terasic_sockit
  verified: false
  generated: true

  connectors: []

  onboard:
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4}, bind: {led: onboard_leds}}
    - id: osc_50_b3b
      label: osc 50 b3b
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: osc_50_b3b}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 4}, bind: {sw: onboard_switches}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 8, bits_g: 8, bits_b: 8, pin_bits_r: 8, pin_bits_g: 8, pin_bits_b: 8, color_depth: 888, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs, clk: onboard_vga.clk, blank_n: onboard_vga.blank_n}}
    - id: hps_ethernet
      label: HPS Gigabit Ethernet PHY (KSZ9021RN)
      device: {kind: ethernet, bank: onboard_hps_ethernet}   # no peripheral model yet
    - id: hps_uart
      label: HPS UART to USB (FT232R)
      device: {kind: uart, bank: onboard_hps_uart}   # no peripheral model yet
    - id: hps_ddr3
      label: HPS DDR3 SDRAM (1 GB, 32-bit)
      device: {kind: ddr3, bank: onboard_hps_ddr3}   # no peripheral model yet
    - id: hps_qspi_flash
      label: HPS QSPI flash (1 Gb)
      device: {kind: flash, bank: onboard_hps_qspi_flash}   # no peripheral model yet
    - id: hps_sdcard
      label: HPS micro SD card socket
      device: {kind: sdcard, bank: onboard_hps_sdcard}   # no peripheral model yet
    - id: hps_usb_otg
      label: HPS USB 2.0 OTG PHY (USB3300)
      device: {kind: usb, bank: onboard_hps_usb_otg}   # no peripheral model yet
    - id: hps_gsensor
      label: HPS accelerometer (ADXL345 G-sensor)
      device: {kind: other, bank: onboard_hps_gsensor}   # no peripheral model yet
    - id: hps_i2c
      label: HPS I2C bus (G-sensor, LTC connector)
      device: {kind: other, bank: onboard_hps_i2c}   # no peripheral model yet
    - id: hps_lcm
      label: HPS 128x64 graphic LCD module (SPI)
      device: {kind: other, bank: onboard_hps_lcm}   # no peripheral model yet
    - id: hps_ltc_header
      label: HPS LTC connector (2x7, SPI/I2C/GPIO)
      device: {kind: header, bank: hps_ltc_header}   # no peripheral model yet
    - id: osc_50_b4a
      label: OSC_50_B4A (50 MHz)
      device: {kind: clock, bank: onboard_osc_50_b4a}   # no peripheral model yet
    - id: osc_50_b5b
      label: OSC_50_B5B (50 MHz)
      device: {kind: clock, bank: onboard_osc_50_b5b}   # no peripheral model yet
