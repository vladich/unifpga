# Layout of tang_nano_9k generated by tools/layout_draft.py from its pinmap, its
# configurations and its board-sources registry entry (tang_nano_9k.yml); regenerate it with
# ./unifpga layout draft tang_nano_9k (edit the registry, not this file).
# A header whose facts do not verify is a logical row: its pins are named by
# their pinmap index, not by physical pin numbers.

Layout:
  board: tang_nano_9k
  verified: false
  generated: true

  connectors:
    - id: gpio
      type: pin_row
      label: GPIO (pin order from the pinmap)
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]'}
    - id: header_j5
      type: pin_row
      label: HEADER_J5 (pin order from the pinmap)
      bank: header_j5
      pins: {'[0]': 'header_j5[0]', '[1]': 'header_j5[1]', '[2]': 'header_j5[2]', '[3]': 'header_j5[3]', '[4]': 'header_j5[4]', '[5]': 'header_j5[5]', '[6]': 'header_j5[6]', '[7]': 'header_j5[7]', '[8]': 'header_j5[8]', '[9]': 'header_j5[9]', '[10]': 'header_j5[10]', '[11]': 'header_j5[11]', '[12]': 'header_j5[12]', '[13]': 'header_j5[13]', '[14]': 'header_j5[14]', '[15]': 'header_j5[15]', '[16]': 'header_j5[16]', '[17]': 'header_j5[17]', '[18]': 'header_j5[18]', '[19]': 'header_j5[19]', '[20]': 'header_j5[20]', '[21]': 'header_j5[21]', '[22]': 'header_j5[22]', '[23]': 'header_j5[23]'}
    - id: header_j6
      type: pin_row
      label: HEADER_J6 (pin order from the pinmap)
      bank: header_j6
      pins: {'[0]': 'header_j6[0]', '[1]': 'header_j6[1]', '[2]': 'header_j6[2]', '[3]': 'header_j6[3]', '[4]': 'header_j6[4]', '[5]': 'header_j6[5]', '[6]': 'header_j6[6]', '[7]': 'header_j6[7]', '[8]': 'header_j6[8]', '[9]': 'header_j6[9]', '[10]': 'header_j6[10]', '[11]': 'header_j6[11]', '[12]': 'header_j6[12]', '[13]': 'header_j6[13]', '[14]': 'header_j6[14]', '[15]': 'header_j6[15]', '[16]': 'header_j6[16]', '[17]': 'header_j6[17]', '[18]': 'header_j6[18]', '[19]': 'header_j6[19]', '[20]': 'header_j6[20]'}

  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 6}, bind: {led: onboard_leds}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: hdmi
      label: hdmi
      variants:
        - id: hdmi_tmds
          label: hdmi_tmds (pins listed in the order clk_p, clk_n, d_p, d_n)
          attach: {peripheral: hdmi_tmds, bind: {clk_p: onboard_hdmi.clk_p, clk_n: onboard_hdmi.clk_n, d_p: onboard_hdmi.d_p, d_n: onboard_hdmi.d_n}}
        - id: hdmi_tmds_2
          label: hdmi_tmds (pins listed in the order clk_p, d_p, clk_n, d_n)
          attach: {peripheral: hdmi_tmds, bind: {clk_p: onboard_hdmi.clk_p, d_p: onboard_hdmi.d_p, clk_n: onboard_hdmi.clk_n, d_n: onboard_hdmi.d_n}}
    - id: microsd
      label: microsd
      attach: {peripheral: inmp441_i2s_mic, bind: {lr: onboard_microsd.cs, ws: onboard_microsd.mosi, sck: onboard_microsd.sclk, sd: onboard_microsd.miso}}
    - id: lcd
      label: lcd
      variants:
        - id: i2s_audio_out
          label: i2s_audio_out
          attach: {peripheral: i2s_audio_out, bind: {bclk: onboard_lcd.vs, lrclk: onboard_lcd.hs, sdata: onboard_lcd.ck}}
        - id: lcd_480_272
          label: lcd_480_272
          attach: {peripheral: lcd_480_272, params: {clock_pixel_pll: {idiv: 2, fbdiv: 0, odiv: 48, sdiv: 2, clkoutd: false}, bl: const.0}, bind: {r: onboard_lcd.r, g: onboard_lcd.g, b: onboard_lcd.b, hs: onboard_lcd.hs, vs: onboard_lcd.vs, de: onboard_lcd.de, ck: onboard_lcd.ck, bl: onboard_lcd.bl, init: onboard_lcd.init}}
        - id: lcd_800_480
          label: lcd_800_480
          attach: {peripheral: lcd_800_480, params: {clock_pixel_pll: {idiv: 4, fbdiv: 23, odiv: 4, sdiv: 4, clkoutd: true}, bl: const.0, clock_pixel_mhz: 32.4}, bind: {r: onboard_lcd.r, g: onboard_lcd.g, b: onboard_lcd.b, hs: onboard_lcd.hs, vs: onboard_lcd.vs, de: onboard_lcd.de, ck: onboard_lcd.ck, bl: onboard_lcd.bl, init: onboard_lcd.init}}
        - id: lcd_ml6485
          label: lcd_ml6485
          attach: {peripheral: lcd_ml6485, params: {clock_pixel_pll: {idiv: 4, fbdiv: 23, odiv: 4, sdiv: 4, clkoutd: true}, bl: const.0}, bind: {r: onboard_lcd.r, g: onboard_lcd.g, b: onboard_lcd.b, hs: onboard_lcd.hs, vs: onboard_lcd.vs, de: onboard_lcd.de, ck: onboard_lcd.ck, bl: onboard_lcd.bl, init: onboard_lcd.init}}
    - id: fpga_jtag
      label: BL702 USB-JTAG to FPGA JTAG (and RECONFIG_N / MODE pins)
      device: {kind: other, bank: onboard_fpga_jtag}   # no peripheral model yet
    - id: fpga_unrouted
      label: Unconnected-by-name FPGA IO (balls 19, 20)
      device: {kind: other, bank: onboard_fpga_unrouted}   # no peripheral model yet
