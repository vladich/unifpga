  onboard:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 3}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 2}, bind: {led: onboard_leds}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 2}, bind: {sw: onboard_switches}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: sram
      label: SRAM U5 K6R4016V1D (256K x 16, 10 ns)
      device: {kind: sdram, bank: onboard_sram}   # no peripheral model yet
    - id: serial_flash
      label: SPI flash U1 (EN25Q16B or W25Q16JV, 2 MB, configuration)
      device: {kind: flash, bank: onboard_serial_flash}   # no peripheral model yet
    - id: pgm_uart
      label: PGM1 10-pin programming connector UART (RxD/TxD, for Olimex programmer)
      attach: {peripheral: uart_2wire, bind: {tx: onboard_pgm_uart.tx, rx: onboard_pgm_uart.rx}}
