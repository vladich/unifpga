# Configuration 'icebreaker_dvi_24b_tm1638_yosys'.
# Generated from config/setups/icebreaker_dvi_24b_tm1638_yosys.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: icebreaker_dvi_24b_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: dvi_pmod_ddr_24b
      bind:
        pmod_a: pmod_p1a
        pmod_b: pmod_p1b
    - peripheral: tm1638_led_key
      bind:
        clk: "pmod_p2[6]"
        stb: "pmod_p2[7]"
        dio: "pmod_p2[5]"
    - peripheral: gpio_header
      params:
        width: 5
      bind:
        io: ["pmod_p2[0]", "pmod_p2[1]", "pmod_p2[2]", "pmod_p2[3]", "pmod_p2[4]"]
