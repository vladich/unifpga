# Configuration for variant 'icebreaker_dvi_24b_tm1638_yosys'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/icebreaker_dvi_24b_tm1638_yosys/board_specific.pcf

Configuration:
  id: icebreaker_dvi_24b_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - power_up: true
      - key: msb

  # iCEBreaker P2 header: TM1638 + user gpio, LED/BTN break-off unused (BGM INSTANTIATE_TM1638 branch; see PLAN.md)
  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
    - peripheral: pmod_12pin
      bind:
        io: pmod_p1a
    - peripheral: pmod_12pin
      bind:
        io: pmod_p1b
    - peripheral: pmod_12pin
      bind:
        io: pmod_p2

  # External peripherals inferred from the variant directory name.
    - peripheral: dvi_pmod_ddr_24b
      bind:
        pmod_a: pmod_p1a
        pmod_b: pmod_p1b
    - peripheral: tm1638_led_key   # binds from BGM icebreaker_dvi_24b_tm1638_yosys/board_specific_top.sv
      bind:
        clk: "pmod_p2[6]"
        stb: "pmod_p2[7]"
        dio: "pmod_p2[5]"
