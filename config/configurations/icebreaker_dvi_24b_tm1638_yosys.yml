        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
    - peripheral: pmod_12pin
      bind:
        io: pmod_p1a
    - peripheral: pmod_12pin
      bind:
        io: pmod_p1b
    - peripheral: pmod_12pin
      bind:
        io: pmod_p2
    - peripheral: led_bank
      params:
        width: 5
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons

  # External peripherals inferred from the variant directory name.
    - peripheral: dvi_pmod_ddr_24b
      bind:
        pmod_a: pmod_p1a
        pmod_b: pmod_p1b
    - peripheral: tm1638_led_key
      bind:
        clk: "pmod_p2[6]"
        stb: "pmod_p2[7]"
        dio: "pmod_p2[5]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "pmod_p1a[0]"
        ws: "pmod_p1a[1]"
        sck: "pmod_p1a[2]"
        sd: "pmod_p1a[3]"
