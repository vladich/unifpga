# Configuration 'qmtech_kintex_7'.
# Generated from config/setups/qmtech_kintex_7.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: qmtech_kintex_7
  board: qmtech_kintex_7
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    qmtech_kintex_7_openxc7:
      toolchain: nextpnr_openxc7

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 4
        active: high
        digits_active: low
      bind:
        segments: [onboard_7seg.dp, onboard_7seg.cg, onboard_7seg.cf, onboard_7seg.ce, onboard_7seg.cd, onboard_7seg.cc, onboard_7seg.cb]
        dp: onboard_7seg.ca
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]"]
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: ["onboard_buttons[0]", "onboard_buttons[1]", "onboard_buttons[2]", "onboard_buttons[3]"]
    - peripheral: button_array
      params:
        width: 1
        active: low
      bind:
        btn: ["onboard_buttons[4]"]
    - peripheral: led_bank
      params:
        width: 5
      bind:
        led: onboard_db_leds.user_led
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_db_buttons.user_btn
    - peripheral: sdcard_spi
      bind:
        clk: onboard_db_sdcard.clk
        cmd: onboard_db_sdcard.cmd
        dat0: "onboard_db_sdcard.data[0]"
        dat3: "onboard_db_sdcard.data[3]"
