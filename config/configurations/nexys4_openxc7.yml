# nexys4_openxc7 retargeted to nextpnr_openxc7 (open-source flow).
# Mirrors nexys4 — only the toolchain differs.

Configuration:
  id: nexys4_openxc7
  board: nexys4
  toolchain: nextpnr_openxc7
  attach:
  - peripheral: clock_input
    bind:
      clk: clk
  - peripheral: sw_bank
    params:
      width: 16
    bind:
      sw: onboard_switches
  - peripheral: led_bank
    params:
      width: 16
    bind:
      led: onboard_leds
  - peripheral: rgb_led
    bind:
      r: onboard_rgb_led_1.r
      g: onboard_rgb_led_1.g
      b: onboard_rgb_led_1.b
  - peripheral: rgb_led
    bind:
      r: onboard_rgb_led_2.r
      g: onboard_rgb_led_2.g
      b: onboard_rgb_led_2.b
  - peripheral: seven_segment_8digit_shared   # bit order and polarity from BGM's assigns (sync --seven-seg)
    params:
      digits: 8
      active: low
      digits_active: low
    bind:
      segments: ["onboard_7seg.segments[0]", "onboard_7seg.segments[1]", "onboard_7seg.segments[2]", "onboard_7seg.segments[3]", "onboard_7seg.segments[4]", "onboard_7seg.segments[5]", "onboard_7seg.segments[6]"]
      dp: "onboard_7seg.dp"
      digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]", "onboard_7seg.anodes[6]", "onboard_7seg.anodes[7]"]
  - peripheral: reset_button
    bind:
      rst: cpu_resetn
  - peripheral: button_array
    params:
      width: 5
    bind:
      btn: onboard_buttons
  - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
    params:
      bits_r: 4
      bits_g: 4
      bits_b: 4
      pin_bits_r: 4
      pin_bits_g: 4
      pin_bits_b: 4
      color_depth: 444
    bind:
      r: onboard_vga.r
      g: onboard_vga.g
      b: onboard_vga.b
      hs: onboard_vga.hs
      vs: onboard_vga.vs
  - peripheral: pwm_amp
    bind:
      pwm: onboard_pwm_amp.pwm
      sd: onboard_pwm_amp.sd
  - peripheral: uart_2wire
    bind:
      rx: onboard_uart.rx
  - peripheral: inmp441_i2s_mic   # binds from BGM nexys4/board_specific_top.sv
    bind:
      lr: "pmod_jd[6]"
      ws: "pmod_jd[5]"
      sck: "pmod_jd[4]"
      sd: "pmod_jd[0]"
  - peripheral: i2s_audio_out   # from BGM nexys4/board_specific_top.sv
    bind:
      mclk: "pmod_jc[4]"
      bclk: "pmod_jc[5]"
      sdata: "pmod_jc[6]"
      lrclk: "pmod_jc[7]"
  - peripheral: i2s_audio_out   # from BGM nexys4/board_specific_top.sv
    bind:
      mclk: "pmod_jb[6]"
      bclk: "pmod_jb[3]"
      sdata: "pmod_jb[1]"
      lrclk: "pmod_jb[0]"

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    onboard_mic.clk: 0
    onboard_mic.lrsel: 0
    "pmod_jd[2]": 0
    "pmod_jd[1]": 1
