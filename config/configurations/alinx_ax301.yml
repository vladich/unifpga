# Configuration for variant 'alinx_ax301'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/alinx_ax301/board_specific.qsf

Configuration:
  id: alinx_ax301
  board: alinx_ax301
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: button_array
      params:
        as_switches: true
        width: 3
      bind:
        btn: onboard_buttons
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        switches: [0, 1, 2]
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared   # bit order and polarity from BGM's assigns (sync --seven-seg)
      params:
        digits: 6
        active: low
        digits_active: low
      bind:
        segments: ["onboard_7seg.segments[7]", "onboard_7seg.segments[6]", "onboard_7seg.segments[5]", "onboard_7seg.segments[4]", "onboard_7seg.segments[3]", "onboard_7seg.segments[2]", "onboard_7seg.segments[1]"]
        dp: "onboard_7seg.segments[0]"
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]"]
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 5
        bits_g: 6
        bits_b: 5
        pin_bits_r: 5
        pin_bits_g: 6
        pin_bits_b: 5
        color_depth: 565
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: inmp441_i2s_mic   # binds from BGM alinx_ax301/board_specific_top.sv
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
    - peripheral: i2s_audio_out   # from BGM alinx_ax301/board_specific_top.sv
      bind:
        mclk: "gpio_0[12]"
        bclk: "gpio_0[10]"
        lrclk: "gpio_0[6]"
        sdata: "gpio_0[8]"
    - peripheral: gpio_header   # from BGM alinx_ax301/board_specific_top.sv .gpio
      params:
        width: 34
      bind:
        io: gpio_1
    - peripheral: gpio_header   # from BGM alinx_ax301/board_specific_top.sv .gpio
      params:
        width: 34
      bind:
        io: gpio_0

  # External peripherals inferred from the variant directory name.

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    "gpio_0[1]": 0
    "gpio_0[3]": 1
