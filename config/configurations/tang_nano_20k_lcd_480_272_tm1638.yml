# Configuration for variant 'tang_nano_20k_lcd_480_272_tm1638'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_nano_20k_lcd_480_272_tm1638/board_specific.cst

Configuration:
  id: tang_nano_20k_lcd_480_272_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - power_up: true
      - any_key: true

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: lcd_480_272
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
        bl: onboard_lcd.bl
        init: onboard_lcd.init
    - peripheral: tm1638_led_key
      bind:
        dio: "gpio[0]"
        clk: onboard_joystick.cs
        stb: onboard_joystick.miso
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[1]"
        ws: "gpio[2]"
        sck: "gpio[3]"
        sd: "onboard_microsd.dat[1]"
