    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds

  # External peripherals inferred from the variant directory name.
    - peripheral: vga_4bit
      bind:
        r: ["gpio_1[11]", "gpio_1[17]", "gpio_1[3]", "gpio_1[1]"]
        g: ["gpio_1[5]", "gpio_1[19]", "gpio_1[15]", "gpio_1[13]"]
        b: ["gpio_1[21]", "gpio_1[7]", "gpio_1[9]", "gpio_1[23]"]
        hs: "gpio_1[31]"
        vs: "gpio_1[33]"
    - peripheral: tm1638_led_key
      bind:
        stb: "gpio_0[25]"
        clk: "gpio_0[27]"
        dio: "gpio_0[29]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio_0[2]"
        ws: "gpio_0[4]"
        sck: "gpio_0[6]"
        sd: "gpio_0[7]"
