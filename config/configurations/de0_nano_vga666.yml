# Configuration 'de0_nano_vga666'.
# Generated from config/setups/de0_nano_vga666.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de0_nano_vga666
  board: de0_nano
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        registered: true
      bind:
        r: ["gpio_1[11]", "gpio_1[17]", "gpio_1[3]", "gpio_1[1]"]
        g: ["gpio_1[5]", "gpio_1[19]", "gpio_1[15]", "gpio_1[13]"]
        b: ["gpio_1[21]", "gpio_1[7]", "gpio_1[9]", "gpio_1[23]"]
        hs: "gpio_1[31]"
        vs: "gpio_1[33]"
    - peripheral: tm1638_led_key
      bind:
        stb: "gpio_0[25]"
        clk: "gpio_0[27]"
        dio: "gpio_0[29]"
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_0[6]"
        ws: "gpio_0[4]"
        sd: "gpio_0[7]"
        lr: "gpio_0[2]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio_1[30]"
        bclk: "gpio_1[28]"
        lrclk: "gpio_1[24]"
        sdata: "gpio_1[26]"
    - peripheral: gpio_header
      params:
        width: 34
      bind:
        io: gpio_0
    - peripheral: adc128s022
      bind:
        cs_n: onboard_adc.ADC_CS_N
        sclk: onboard_adc.ADC_SCLK
        din: onboard_adc.ADC_SADDR
        dout: onboard_adc.ADC_SDAT
    - peripheral: adxl345_i2c
      bind:
        scl: onboard_accelerometer.I2C_SCLK
        sda: onboard_accelerometer.I2C_SDAT
        cs_n: onboard_accelerometer.G_SENSOR_CS_N

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio_0[3]": 0
    "gpio_0[5]": 1
