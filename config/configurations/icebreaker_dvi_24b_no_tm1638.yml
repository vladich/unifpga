# Configuration 'icebreaker_dvi_24b_no_tm1638'.
# Generated from config/setups/icebreaker_dvi_24b_no_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: icebreaker_dvi_24b_no_tm1638
  board: icebreaker
  toolchain: nextpnr_icestorm

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    icebreaker_dvi_24b_no_tm1638_yosys: {}

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: led_bank
      params:
        width: 5
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: dvi_pmod_ddr_24b
      bind:
        pmod_a: pmod_p1a
        pmod_b: pmod_p1b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
    - peripheral: led_bank
      params:
        width: 1
        active: low
      bind:
        led: onboard_led_green
    - peripheral: led_bank
      params:
        width: 1
        active: low
      bind:
        led: onboard_led_red
