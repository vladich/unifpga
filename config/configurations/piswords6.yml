# Configuration 'piswords6'.

Configuration:
  id: piswords6
  board: piswords6
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 8
        active: low
        digits_active: low
      bind:
        segments: ["onboard_7seg.segments[7]", "onboard_7seg.segments[6]", "onboard_7seg.segments[5]", "onboard_7seg.segments[4]", "onboard_7seg.segments[3]", "onboard_7seg.segments[2]", "onboard_7seg.segments[1]"]
        dp: "onboard_7seg.segments[0]"
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]", "onboard_7seg.anodes[6]", "onboard_7seg.anodes[7]"]
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from bits_r/bits_g/bits_b
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 1
        pin_bits_g: 1
        pin_bits_b: 1
        color_depth: 444
      bind:
        r: ["onboard_vga.rgb[2]"]
        g: ["onboard_vga.rgb[1]"]
        b: ["onboard_vga.rgb[0]"]
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio[12]"
        bclk: "gpio[10]"
        lrclk: "gpio[6]"
        sdata: "gpio[8]"
    - peripheral: gpio_header
      params:
        width: 16
      bind:
        io: gpio

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
