# Configuration for variant 'rzrd_pmod_mic3'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/rzrd_pmod_mic3/board_specific.qsf

Configuration:
  id: rzrd_pmod_mic3
  board: rzrd
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: cpu_reset
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared   # bit order and polarity from BGM's assigns (sync --seven-seg)
      params:
        digits: 4
        active: low
        digits_active: low
      bind:
        segments: ["onboard_7seg.segments[7]", "onboard_7seg.segments[6]", "onboard_7seg.segments[5]", "onboard_7seg.segments[4]", "onboard_7seg.segments[3]", "onboard_7seg.segments[2]", "onboard_7seg.segments[1]"]
        dp: "onboard_7seg.segments[0]"
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]"]
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 1
        pin_bits_g: 1
        pin_bits_b: 1
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: uart_2wire
      bind:
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: pmod_mic3   # binds from BGM rzrd_pmod_mic3/board_specific_top.sv
      bind:
        cs: "gpio_pseudo_sdram[0]"
        sclk: "gpio_pseudo_sdram[6]"
        miso: "gpio_pseudo_sdram[4]"
    - peripheral: i2s_audio_out   # from BGM rzrd_pmod_mic3/board_specific_top.sv
      bind:
        mclk: onboard_char_lcd.e
        bclk: onboard_char_lcd.rs
        lrclk: onboard_char_lcd.rw
        sdata: "onboard_char_lcd.d[0]"
    - peripheral: gpio_header   # from BGM rzrd_pmod_mic3/board_specific_top.sv .gpio
      params:
        width: 14
      bind:
        io: gpio_pseudo_sdram
