# Configuration 'de1'.
# Generated from config/setups/de1.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de1
  board: de1
  toolchain: quartus2

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds_green
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: seven_segment_per_digit
      params:
        digits: 4
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3]
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_1[4]"
        ws: "gpio_1[2]"
        sd: "gpio_1[5]"
        lr: "gpio_1[0]"
    - peripheral: wm8731_i2s_out
      bind:
        xck: onboard_audio_codec.xck
        bclk: onboard_audio_codec.bclk
        dac_lrck: onboard_audio_codec.dac_lrck
        dac_dat: onboard_audio_codec.dac_dat
        i2c_sclk: onboard_i2c.sclk
        i2c_sdat: onboard_i2c.sdat
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_1
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_0
    - peripheral: ps2_keyboard
      bind:
        clk: onboard_ps2.PS2_CLK
        data: onboard_ps2.PS2_DAT
    - peripheral: sdram_sdr
      params:
        row_bits: 12
        data_bits: 16
        col_bits: 8
      bind:
        clk: onboard_sdram.DRAM_CLK
        cke: onboard_sdram.DRAM_CKE
        cs_n: onboard_sdram.DRAM_CS_N
        ras_n: onboard_sdram.DRAM_RAS_N
        cas_n: onboard_sdram.DRAM_CAS_N
        we_n: onboard_sdram.DRAM_WE_N
        ba: onboard_sdram.DRAM_BA_
        a: onboard_sdram.DRAM_ADDR
        dq: onboard_sdram.DRAM_DQ
        dqm: [onboard_sdram.DRAM_LDQM, onboard_sdram.DRAM_UDQM]

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio_1[1]": 0
    "gpio_1[3]": 1
