# Configuration for variant 'de1'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/de1/board_specific.qsf

Configuration:
  id: de1
  board: de1
  toolchain: quartus2

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - switch_msb: true

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank   # from BGM de1/board_specific_top.sv
      params:
        width: 8
      bind:
        led: onboard_leds_green
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        switches: [0, 1, 2, 3, 4, 5, 6, 7, 8, ~]
    - peripheral: seven_segment_per_digit
      params:
        digits: 4
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3]
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM de1/board_specific_top.sv
      bind:
        lr: "gpio_1[0]"
        ws: "gpio_1[2]"
        sck: "gpio_1[4]"
        sd: "gpio_1[5]"
    - peripheral: wm8731_i2s_out   # from BGM de1/board_specific_top.sv
      bind:
        xck: onboard_audio_codec.xck
        bclk: onboard_audio_codec.bclk
        dac_lrck: onboard_audio_codec.dac_lrck
        dac_dat: onboard_audio_codec.dac_dat
        i2c_sclk: onboard_i2c.sclk
        i2c_sdat: onboard_i2c.sdat
    - peripheral: gpio_header   # from BGM de1/board_specific_top.sv .gpio
      params:
        width: 36
      bind:
        io: gpio_1
    - peripheral: gpio_header   # from BGM de1/board_specific_top.sv .gpio
      params:
        width: 36
      bind:
        io: gpio_0

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    "gpio_1[1]": 0
    "gpio_1[3]": 1
