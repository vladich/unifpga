# Configuration for variant 'tang_nano_9k_hdmi_tm1638'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_nano_9k_hdmi_tm1638/board_specific.cst

Configuration:
  id: tang_nano_9k_hdmi_tm1638
  board: tang_nano_9k
  toolchain: gowin_eda

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - power_up: true
      - any_key: true

  # Gowin IO_TYPE this BGM variant states beyond the board-wide ones (tools/sync_from_bgm.py --iotypes)
  io_overrides:
    clk: LVCMOS33

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: []
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        leds: [0, 1, 2, 3, 4, 5]
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: hdmi_tmds   # binds from BGM tang_nano_9k_hdmi_tm1638/board_specific_top.sv
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: tm1638_led_key   # binds from BGM tang_nano_9k_hdmi_tm1638/board_specific_top.sv
      bind:
        dio: "gpio[0]"
        clk: "gpio[1]"
        stb: "gpio[2]"
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: [0, 1, 2, 3, 4, 5, 6, 7]
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
        seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_nano_9k_hdmi_tm1638/board_specific_top.sv
      bind:
        lr: onboard_microsd.cs
        ws: onboard_microsd.mosi
        sck: onboard_microsd.sclk
        sd: onboard_microsd.miso
    - peripheral: i2s_audio_out   # from BGM tang_nano_9k_hdmi_tm1638/board_specific_top.sv
      bind:
        bclk: onboard_lcd.vs
        lrclk: onboard_lcd.hs
        sdata: onboard_lcd.ck
    - peripheral: gpio_header   # from BGM tang_nano_9k_hdmi_tm1638/board_specific_top.sv .gpio
      params:
        width: 6
      bind:
        io: gpio

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    onboard_lcd.de: 0
