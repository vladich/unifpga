# Configuration 'de0_nano_soc_vga666_mistral'.
# de0_nano_soc_vga666_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow).
# Mirrors de0_nano_soc_vga666 — only the toolchain differs.
# Generated from config/setups/de0_nano_soc_vga666_mistral.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de0_nano_soc_vga666_mistral
  board: de0_nano_soc
  toolchain: nextpnr_mistral

  attach:
    - peripheral: clock_input
      bind:
        clk: fpga_clk1_50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        gate: false
      bind:
        r: ["gpio_1[13]", "gpio_1[19]", "gpio_1[5]", "gpio_1[3]"]
        g: ["gpio_1[7]", "gpio_1[21]", "gpio_1[17]", "gpio_1[15]"]
        b: ["gpio_1[23]", "gpio_1[9]", "gpio_1[11]", "gpio_1[25]"]
        hs: "gpio_1[33]"
        vs: "gpio_1[35]"
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_0[4]"
        ws: "gpio_0[2]"
        sd: "gpio_0[5]"
        lr: "gpio_0[0]"
    - peripheral: tm1638_led_key
      bind:
        stb: "gpio_0[29]"
        clk: "gpio_0[27]"
        dio: "gpio_0[31]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio_1[32]"
        bclk: "gpio_1[30]"
        lrclk: "gpio_1[26]"
        sdata: "gpio_1[28]"
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_0

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio_0[1]": 0
    "gpio_0[3]": 1
