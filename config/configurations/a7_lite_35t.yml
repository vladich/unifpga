# Configuration for variant 'a7_lite_35t'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/a7_lite_35t/board_specific.xdc

Configuration:
  id: a7_lite_35t
  board: a7_lite_35t
  toolchain: vivado

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 2
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key   # binds from BGM a7_lite_35t/board_specific_top.sv
      bind:
        dio: "gpio[0]"
        clk: "gpio[1]"
        stb: "gpio[2]"
    - peripheral: inmp441_i2s_mic   # binds from BGM a7_lite_35t/board_specific_top.sv
      bind:
        lr: "gpio[4]"
        ws: "gpio[5]"
        sck: "gpio[6]"
        sd: "gpio[7]"
    - peripheral: hdmi_tmds   # binds from BGM a7_lite_35t/board_specific_top.sv
      params:
        clock_serial_mhz: 250
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: i2s_audio_out   # from BGM a7_lite_35t/board_specific_top.sv
      bind:
        mclk: "gpio[9]"
        bclk: "gpio[10]"
        lrclk: "gpio[11]"
        sdata: "gpio[12]"
    - peripheral: gpio_header   # from BGM a7_lite_35t/board_specific_top.sv .gpio
      params:
        width: 13
      bind:
        io: gpio
