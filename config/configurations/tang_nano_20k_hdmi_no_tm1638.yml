      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: hdmi_tmds   # binds from BGM tang_nano_20k_hdmi_no_tm1638/board_specific_top.sv
      params:
        clock_serial_mhz: 249.75
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_nano_20k_hdmi_no_tm1638/board_specific_top.sv
      bind:
        lr: "gpio[1]"
        ws: "gpio[2]"
        sck: "gpio[3]"
        sd: "onboard_microsd.dat[1]"
    - peripheral: i2s_audio_out   # from BGM tang_nano_20k_hdmi_no_tm1638/board_specific_top.sv
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: gpio_header   # from BGM tang_nano_20k_hdmi_no_tm1638/board_specific_top.sv .gpio
      params:
        width: 5
      bind:
        io: gpio
