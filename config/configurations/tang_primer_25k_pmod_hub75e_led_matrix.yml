# Configuration 'tang_primer_25k_pmod_hub75e_led_matrix'.

Configuration:
  id: tang_primer_25k_pmod_hub75e_led_matrix
  board: tang_primer_25k
  toolchain: gowin_standard

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: hub75e_led_matrix
      params:
        rows: 64
        brightness: 1
      bind:
        ck: "pmod_0[6]"
        oe: "pmod_0[7]"
        st: "pmod_0[2]"
        a: "pmod_0[4]"
        b: "pmod_0[0]"
        c: "pmod_0[5]"
        d: "pmod_0[1]"
        e: "pmod_1[3]"
        r1: "pmod_1[4]"
        r2: "pmod_1[6]"
        g1: "pmod_1[0]"
        g2: "pmod_1[2]"
        b1: "pmod_1[5]"
        b2: "pmod_1[7]"
    - peripheral: tm1638_led_key
      bind:
        dio: "pmod_2[1]"
        clk: "pmod_2[2]"
        stb: "pmod_2[3]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_2[4]"
        bclk: "pmod_2[5]"
        sdata: "pmod_2[6]"
        lrclk: "pmod_2[7]"
    - peripheral: gpio_header
      params:
        width: 38
      bind:
        io: gpio

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
