# Configuration 'tang_primer_20k_dock_hdmi_tm1638_gpio'.
# Generated from config/setups/tang_primer_20k_dock_hdmi_tm1638_gpio.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_primer_20k_dock_hdmi_tm1638_gpio
  board: tang_primer_20k_dock
  toolchain: gowin_eda

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    tang_primer_20k_dock_hdmi_tm1638_alt: {}

  # Gowin IO_TYPE this configuration states beyond the board-wide ones
  io_overrides:
    clk: LVCMOS33
    "gpio_1[2]": LVCMOS33
    "gpio_1[3]": LVCMOS33
    "gpio_1[6]": LVCMOS33
    "gpio_1[7]": LVCMOS33
    "gpio_2[0]": LVCMOS33
    "gpio_2[4]": LVCMOS33
    onboard_hdmi.clk_p: LVDS25
    "onboard_hdmi.d_p[0]": LVDS25
    "onboard_hdmi.d_p[1]": LVDS25
    "onboard_hdmi.d_p[2]": LVDS25
    onboard_headphone: LVCMOS33
    "onboard_leds[2]": LVCMOS33
    "onboard_leds[3]": LVCMOS33
    "onboard_leds[4]": LVCMOS33
    "onboard_leds[5]": LVCMOS33
    onboard_pa_enable: LVCMOS33

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        active: high
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons
    - peripheral: hdmi_tmds
      params:
        clock_serial_mhz: 249.75
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: tm1638_led_key
      bind:
        stb: "gpio_1[3]"
        clk: "gpio_1[2]"
        dio: "gpio_1[1]"
    - peripheral: i2s_audio_out
      params:
        align_right: 1
        offset_by_one_cycle: 0
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: i2s_audio_out
      params:
        align_right: 0
        offset_by_one_cycle: 1
      bind:
        mclk: "gpio_1[4]"
        bclk: "gpio_1[5]"
        lrclk: "gpio_1[7]"
        sdata: "gpio_1[6]"
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: gpio_0
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: gpio_1
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: gpio_2
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: gpio_3

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_lcd.bl: 0
