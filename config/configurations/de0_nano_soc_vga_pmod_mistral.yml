# de0_nano_soc_vga_pmod_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow).
# Mirrors de0_nano_soc_vga_pmod — only the toolchain differs.


Configuration:
  id: de0_nano_soc_vga_pmod_mistral
  board: de0_nano_soc
  toolchain: nextpnr_mistral

  attach:
    - peripheral: clock_input   # added by tools/sync_from_bgm.py --clock
      bind:
        clk: fpga_clk1_50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds

  # External peripherals inferred from the variant directory name.
    - peripheral: vga_4bit
      bind:
        r: ["gpio_1[35]", "gpio_1[33]", "gpio_1[31]", "gpio_1[29]"]
        g: ["gpio_1[25]", "gpio_1[23]", "gpio_1[21]", "gpio_1[19]"]
        b: ["gpio_1[17]", "gpio_1[15]", "gpio_1[13]", "gpio_1[11]"]
        hs: "gpio_1[5]"
        vs: "gpio_1[7]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
