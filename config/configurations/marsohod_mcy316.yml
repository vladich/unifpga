#   - basics-graphics-music/boards/marsohod_mcy316/board_specific.qsf

Configuration:
  id: marsohod_mcy316
  board: marsohod_mcy316
  toolchain: quartus2

  attach:
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: seven_segment_8digit_shared   # bit order and polarity from BGM's assigns (sync --seven-seg)
      params:
        digits: 4
        active: low
        digits_active: high
      bind:
        segments: ["onboard_7seg.ca", "onboard_7seg.cb", "onboard_7seg.cc", "onboard_7seg.cd", "onboard_7seg.ce", "onboard_7seg.cf", "onboard_7seg.cg"]
        dp: "onboard_7seg.dp"
        digits: ["onboard_7seg.anodes[3]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[0]"]
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds
