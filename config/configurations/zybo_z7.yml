# Configuration 'zybo_z7'.
# Generated from config/setups/zybo_z7.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: zybo_z7
  board: zybo_z7
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    zybo_z7_openxc7:
      toolchain: nextpnr_openxc7

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 125
      bind:
        clk: clk125mhz
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: tm1638_led_key
      bind:
        clk: "pmod_je[1]"
        stb: "pmod_je[0]"
        dio: "pmod_je[2]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_jb[0]"
        bclk: "pmod_jb[2]"
        lrclk: "pmod_jb[1]"
        sdata: "pmod_jb[3]"
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        gate: false
      bind:
        r: ["pmod_jc[0]", "pmod_jc[1]", "pmod_jc[2]", "pmod_jc[3]"]
        g: ["pmod_jc[4]", "pmod_jc[5]", "pmod_jc[6]", "pmod_jc[7]"]
        b: ["pmod_jd[0]", "pmod_jd[1]", "pmod_jd[2]", "pmod_jd[3]"]
        hs: "pmod_jd[4]"
        vs: "pmod_jd[5]"
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_5.r
        g: onboard_rgb_led_5.g
        b: onboard_rgb_led_5.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_6.r
        g: onboard_rgb_led_6.g
        b: onboard_rgb_led_6.b
