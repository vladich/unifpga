# Configuration for variant 'zybo_z7'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/zybo_z7/board_specific.xdc

Configuration:
  id: zybo_z7
  board: zybo_z7
  toolchain: vivado

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - switch_msb: true

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 125
      bind:
        clk: clk125mhz
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: pmod_12pin
      bind:
        io: pmod_jb
    - peripheral: pmod_12pin
      bind:
        io: pmod_jc
    - peripheral: pmod_12pin
      bind:
        io: pmod_jd
    - peripheral: pmod_12pin
      bind:
        io: pmod_je

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key
      bind:
        clk: "pmod_je[1]"
        stb: "pmod_je[0]"
        dio: "pmod_je[2]"
