# Configuration 'colorlight75b_tm1638_ecp5_yosys'.
# Generated from config/setups/colorlight75b_tm1638_ecp5_yosys.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: colorlight75b_tm1638_ecp5_yosys
  board: colorlight75b
  toolchain: nextpnr_trellis

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        width: 1
        active: low
        open_drain: true
      bind:
        led: onboard_leds
    - peripheral: tm1638_led_key
      bind:
        clk: "gpio[0]"
        stb: "gpio[1]"
        dio: "onboard_buttons[0]"
    - peripheral: hdmi_tmds
      params:
        timing: lab
        clock_serial_mhz: 250
      bind:
        d_p: onboard_hdmi.d_p
        d_n: onboard_hdmi.d_n
        clk_p: onboard_hdmi.clk_p
        clk_n: onboard_hdmi.clk_n
