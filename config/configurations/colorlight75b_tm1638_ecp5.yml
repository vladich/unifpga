# Configuration 'colorlight75b_tm1638_ecp5'.
# Generated from config/setups/colorlight75b_tm1638_ecp5.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: colorlight75b_tm1638_ecp5
  board: colorlight75b
  toolchain: nextpnr_trellis

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    colorlight75b_tm1638_ecp5_yosys: {}

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        width: 1
        active: low
        open_drain: true
      bind:
        led: onboard_leds
    - peripheral: tm1638_led_key
      bind:
        stb: "gpio[1]"
        clk: "gpio[0]"
        dio: "onboard_buttons[0]"
    - peripheral: hdmi_tmds
      params:
        timing: lab
        clock_serial_mhz: 250
      bind:
        d_p: onboard_hdmi.d_p
        d_n: onboard_hdmi.d_n
        clk_p: onboard_hdmi.clk_p
        clk_n: onboard_hdmi.clk_n
    - peripheral: sdram_sdr
      params:
        row_bits: 11
        data_bits: 32
        col_bits: 8
      bind:
        clk: onboard_sdram.clk
        ras_n: onboard_sdram.ras_n
        cas_n: onboard_sdram.cas_n
        we_n: onboard_sdram.we_n
        ba: onboard_sdram.ba
        a: onboard_sdram.a
        dq: onboard_sdram.dq
