# Configuration 'lattice_crosslink_nx_evn_oxide'.
# lattice_crosslink_nx_evn_oxide — CrossLink-NX EVN retargeted to the
# historical nextpnr_oxide toolchain id. Same flow as nextpnr_nexus
# (yosys synth_nexus → nextpnr-nexus → prjoxide pack); only the
# toolchain id differs.
# Generated from config/setups/lattice_crosslink_nx_evn_oxide.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: lattice_crosslink_nx_evn_oxide
  board: lattice_crosslink_nx_evn
  toolchain: nextpnr_oxide

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 12
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: onboard_reset
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 8
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 14
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        rx: onboard_uart.rx
        tx: onboard_uart.tx
