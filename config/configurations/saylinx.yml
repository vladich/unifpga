# Configuration 'saylinx'.
# Generated from config/setups/saylinx.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: saylinx
  board: saylinx
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 8
        active: low
        digits_active: low
      bind:
        segments: ["onboard_7seg.segments[7]", "onboard_7seg.segments[6]", "onboard_7seg.segments[5]", "onboard_7seg.segments[4]", "onboard_7seg.segments[3]", "onboard_7seg.segments[2]", "onboard_7seg.segments[1]"]
        dp: "onboard_7seg.segments[0]"
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]", "onboard_7seg.anodes[6]", "onboard_7seg.anodes[7]"]
    - peripheral: vga_4bit
      params:
        bits_r: 5
        bits_g: 6
        bits_b: 5
        pin_bits_r: 5
        pin_bits_g: 6
        pin_bits_b: 5
        color_depth: 565
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_0[4]"
        ws: "gpio_0[2]"
        sd: "gpio_0[5]"
        lr: "gpio_0[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio_0[12]"
        bclk: "gpio_0[10]"
        lrclk: "gpio_0[6]"
        sdata: "gpio_0[8]"
    - peripheral: gpio_header
      params:
        width: 34
      bind:
        io: gpio_1
    - peripheral: gpio_header
      params:
        width: 34
      bind:
        io: gpio_0

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio_0[1]": 0
    "gpio_0[3]": 1
