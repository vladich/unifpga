# Configuration for variant 'tang_nano_4k_hdmi_tm1638'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_nano_4k_hdmi_tm1638/board_specific.cst

Configuration:
  id: tang_nano_4k_hdmi_tm1638
  board: tang_nano_4k
  toolchain: gowin_eda

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - power_up: true
      - any_key: true

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons

  # External peripherals inferred from the variant directory name.
    - peripheral: hdmi_tmds
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
    - peripheral: tm1638_led_key   # binds from BGM tang_nano_4k_hdmi_tm1638/board_specific_top.sv
      bind:
        dio: onboard_serial_flash.do
        clk: onboard_serial_flash.di
        stb: onboard_serial_flash.clk
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_nano_4k_hdmi_tm1638/board_specific_top.sv
      bind:
        lr: onboard_serial_flash.hold
        ws: onboard_serial_flash.wp
        sck: onboard_serial_flash.cs
        sd: "onboard_camera.data[0]"
