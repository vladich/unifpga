# Configuration 'tang_nano_4k_hdmi_tm1638'.
# Generated from config/setups/tang_nano_4k_hdmi_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_nano_4k_hdmi_tm1638
  board: tang_nano_4k
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: hdmi_tmds
      params:
        timing: lab
        clock_serial_mhz: 270
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: tm1638_led_key
      bind:
        dio: onboard_serial_flash.do
        clk: onboard_serial_flash.di
        stb: onboard_serial_flash.clk
    - peripheral: inmp441_i2s_mic
      bind:
        lr: onboard_serial_flash.hold
        ws: onboard_serial_flash.wp
        sck: onboard_serial_flash.cs
        sd: "onboard_camera.data[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "onboard_camera.data[1]"
        bclk: onboard_camera.pclk
        sdata: onboard_camera.hsync
        lrclk: onboard_camera.vsync
    - peripheral: gpio_header
      params:
        width: 1
      bind:
        io: onboard_camera.scl
    - peripheral: gpio_header
      params:
        width: 1
      bind:
        io: onboard_camera.sda
    - peripheral: led_bank
      params:
        width: 1
      bind:
        led: onboard_led
