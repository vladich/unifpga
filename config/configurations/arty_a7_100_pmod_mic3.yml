        r: onboard_rgb_led_1.r
        g: onboard_rgb_led_1.g
        b: onboard_rgb_led_1.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_2.r
        g: onboard_rgb_led_2.g
        b: onboard_rgb_led_2.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_3.r
        g: onboard_rgb_led_3.g
        b: onboard_rgb_led_3.b
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: pmod_12pin
      bind:
        io: pmod_ja
