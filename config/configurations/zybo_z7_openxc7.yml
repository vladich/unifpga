# zybo_z7_openxc7 retargeted to nextpnr_openxc7 (open-source flow).
# Mirrors zybo_z7 — only the toolchain differs.

Configuration:
  id: zybo_z7_openxc7
  board: zybo_z7
  toolchain: nextpnr_openxc7

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - switch_msb: true
  attach:
  - peripheral: clock_input
    params:
      frequency_mhz: 125
    bind:
      clk: clk125mhz
  - peripheral: sw_bank
    params:
      width: 4
    bind:
      sw: onboard_switches
    lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
      switches: [0, 1, 2, ~]
  - peripheral: button_array
    params:
      width: 4
    bind:
      btn: onboard_buttons
    lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
      buttons: [0, 1, 2, 3]
  - peripheral: led_bank
    params:
      width: 4
    bind:
      led: onboard_leds
    lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
      leds: [0, 1, 2, 3]
  - peripheral: tm1638_led_key   # binds from BGM zybo_z7/board_specific_top.sv
    bind:
      clk: "pmod_je[1]"
      stb: "pmod_je[0]"
      dio: "pmod_je[2]"
    lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: []
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
  - peripheral: i2s_audio_out   # from BGM zybo_z7/board_specific_top.sv
    bind:
      mclk: "pmod_jb[0]"
      bclk: "pmod_jb[2]"
      lrclk: "pmod_jb[1]"
      sdata: "pmod_jb[3]"
  - peripheral: vga_4bit   # from BGM zybo_z7/board_specific_top.sv (VGA on header pins)
    params:
      bits_r: 4
      bits_g: 4
      bits_b: 4
      pin_bits_r: 4
      pin_bits_g: 4
      pin_bits_b: 4
    bind:
      r: ["pmod_jc[0]", "pmod_jc[1]", "pmod_jc[2]", "pmod_jc[3]"]
      g: ["pmod_jc[4]", "pmod_jc[5]", "pmod_jc[6]", "pmod_jc[7]"]
      b: ["pmod_jd[0]", "pmod_jd[1]", "pmod_jd[2]", "pmod_jd[3]"]
      hs: "pmod_jd[4]"
      vs: "pmod_jd[5]"
