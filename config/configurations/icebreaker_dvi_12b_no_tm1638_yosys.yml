# Configuration for variant 'icebreaker_dvi_12b_no_tm1638_yosys'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/icebreaker_dvi_12b_no_tm1638_yosys/board_specific.pcf

Configuration:
  id: icebreaker_dvi_12b_no_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm
  lab_clock: pixel   # BGM: `localparam lab_mhz = pixel_mhz` (tools/sync_from_bgm.py --clock-tree)

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - key: 0

  # iCEBreaker P2 header: LED/BTN break-off Pmod, no user gpio (BGM no-TM1638 branch; see PLAN.md)
  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [~]
    - peripheral: led_bank
      params:
        width: 5
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        as_switches: true
        width: 3
      bind:
        btn: onboard_buttons
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [0, 1, 2]
        switches: [0, 1, 2]

  # External peripherals inferred from the variant directory name.
    - peripheral: dvi_12bit
      bind:
        r: ["pmod_p1a[5]", "pmod_p1a[1]", "pmod_p1a[4]", "pmod_p1a[0]"]
        g: ["pmod_p1a[7]", "pmod_p1a[3]", "pmod_p1a[6]", "pmod_p1a[2]"]
        b: ["pmod_p1b[5]", "pmod_p1b[2]", "pmod_p1b[4]", "pmod_p1b[0]"]
        hs: "pmod_p1b[3]"
        vs: "pmod_p1b[7]"
        de: "pmod_p1b[6]"
        ck: "pmod_p1b[1]"
