# Configuration 'tang_primer_20k_dock_no_hdmi_no_tm1638'.
# Generated from config/setups/tang_primer_20k_dock_no_hdmi_no_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_primer_20k_dock_no_hdmi_no_tm1638
  board: tang_primer_20k_dock
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        active: low
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_0[1]"
        ws: "gpio_0[3]"
        sd: "gpio_0[0]"
        lr: "gpio_0[2]"
    - peripheral: i2s_audio_out
      params:
        align_right: 1
        offset_by_one_cycle: 0
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: i2s_audio_out
      params:
        align_right: 0
        offset_by_one_cycle: 1
      bind:
        mclk: "gpio_1[4]"
        bclk: "gpio_1[5]"
        lrclk: "gpio_1[7]"
        sdata: "gpio_1[6]"
