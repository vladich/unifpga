# Configuration 'icebreaker_no_dvi_no_tm1638_yosys'.
# Generated from config/setups/icebreaker_no_dvi_no_tm1638_yosys.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: icebreaker_no_dvi_no_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: led_bank
      params:
        width: 5
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "pmod_p1a[0]"
        ws: "pmod_p1a[1]"
        sck: "pmod_p1a[2]"
        sd: "pmod_p1a[3]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_p1b[0]"
        bclk: "pmod_p1b[1]"
        sdata: "pmod_p1b[2]"
        lrclk: "pmod_p1b[3]"
