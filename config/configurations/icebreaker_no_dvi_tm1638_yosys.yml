Configuration:
  id: icebreaker_no_dvi_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - power_up: true
      - key: msb

  # iCEBreaker P2 header: TM1638 + user gpio, LED/BTN break-off unused (BGM INSTANTIATE_TM1638 branch; see PLAN.md)
  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key   # binds from BGM icebreaker_no_dvi_tm1638_yosys/board_specific_top.sv
      bind:
        clk: "pmod_p2[6]"
        stb: "pmod_p2[7]"
        dio: "pmod_p2[5]"
    - peripheral: inmp441_i2s_mic   # binds from BGM icebreaker_no_dvi_tm1638_yosys/board_specific_top.sv
      bind:
        lr: "pmod_p1a[0]"
        ws: "pmod_p1a[1]"
        sck: "pmod_p1a[2]"
        sd: "pmod_p1a[3]"
    - peripheral: i2s_audio_out   # from BGM icebreaker_no_dvi_tm1638_yosys/board_specific_top.sv
      bind:
        mclk: "pmod_p1b[0]"
        bclk: "pmod_p1b[1]"
        sdata: "pmod_p1b[2]"
        lrclk: "pmod_p1b[3]"
    - peripheral: gpio_header   # from BGM icebreaker_no_dvi_tm1638_yosys/board_specific_top.sv .gpio
      params:
        width: 5
      bind:
        io: ["pmod_p2[0]", "pmod_p2[1]", "pmod_p2[2]", "pmod_p2[3]", "pmod_p2[4]"]
