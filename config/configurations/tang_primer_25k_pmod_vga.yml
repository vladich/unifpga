# Configuration for variant 'tang_primer_25k_pmod_vga'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_primer_25k_pmod_vga/board_specific.cst

Configuration:
  id: tang_primer_25k_pmod_vga
  board: tang_primer_25k
  toolchain: gowin_standard

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - key: msb

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [0, 1]
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: vga_4bit
      bind:
        r: ["pmod_1[4]", "pmod_1[5]", "pmod_1[6]", "pmod_1[7]"]
        g: ["pmod_0[4]", "pmod_0[5]", "pmod_0[6]", "pmod_0[7]"]
        b: ["pmod_1[0]", "pmod_1[1]", "pmod_1[2]", "pmod_1[3]"]
        hs: "pmod_0[0]"
        vs: "pmod_0[1]"
    - peripheral: tm1638_led_key   # binds from BGM tang_primer_25k_pmod_vga/board_specific_top.sv
      bind:
        dio: "pmod_2[1]"
        clk: "pmod_2[2]"
        stb: "pmod_2[3]"
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: [0, 1, 2, 3, 4, 5, 6, 7]
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_primer_25k_pmod_vga/board_specific_top.sv
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
    - peripheral: i2s_audio_out   # from BGM tang_primer_25k_pmod_vga/board_specific_top.sv
      bind:
        mclk: "pmod_2[4]"
        bclk: "pmod_2[5]"
        sdata: "pmod_2[6]"
        lrclk: "pmod_2[7]"
    - peripheral: gpio_header   # from BGM tang_primer_25k_pmod_vga/board_specific_top.sv .gpio
      params:
        width: 38
      bind:
        io: gpio

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
