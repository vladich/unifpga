# Configuration 'tang_primer_25k_pmod_vga'.
# Generated from config/setups/tang_primer_25k_pmod_vga.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_primer_25k_pmod_vga
  board: tang_primer_25k
  toolchain: gowin_standard

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: vga_4bit
      bind:
        r: ["pmod_1[4]", "pmod_1[5]", "pmod_1[6]", "pmod_1[7]"]
        g: ["pmod_0[4]", "pmod_0[5]", "pmod_0[6]", "pmod_0[7]"]
        b: ["pmod_1[0]", "pmod_1[1]", "pmod_1[2]", "pmod_1[3]"]
        hs: "pmod_0[0]"
        vs: "pmod_0[1]"
    - peripheral: tm1638_led_key
      bind:
        dio: "pmod_2[1]"
        clk: "pmod_2[2]"
        stb: "pmod_2[3]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_2[4]"
        bclk: "pmod_2[5]"
        sdata: "pmod_2[6]"
        lrclk: "pmod_2[7]"
    - peripheral: gpio_header
      params:
        width: 38
      bind:
        io: gpio

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
    "pmod_0[2]": 0
    "pmod_0[3]": 0
