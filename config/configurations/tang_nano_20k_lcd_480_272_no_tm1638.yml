# Configuration 'tang_nano_20k_lcd_480_272_no_tm1638'.
# Generated from config/setups/tang_nano_20k_lcd_480_272_no_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_nano_20k_lcd_480_272_no_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: lcd_480_272
      params:
        clock_pixel_pll: {idiv: 2, fbdiv: 0, odiv: 64, sdiv: 2, clkoutd: false}
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
        bl: onboard_lcd.bl
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio[3]"
        ws: "gpio[2]"
        sd: "onboard_microsd.dat[1]"
        lr: "gpio[1]"
    - peripheral: i2s_audio_out
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: gpio_header
      params:
        width: 5
      bind:
        io: gpio
