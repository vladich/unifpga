        vs: "gpio_1[5]"
    - peripheral: tm1638_led_key   # binds from BGM de0_nano_vga_pmod/board_specific_top.sv
      bind:
        stb: "gpio_0[25]"
        clk: "gpio_0[27]"
        dio: "gpio_0[29]"
    - peripheral: inmp441_i2s_mic   # binds from BGM de0_nano_vga_pmod/board_specific_top.sv
      bind:
        lr: "gpio_0[2]"
        ws: "gpio_0[4]"
