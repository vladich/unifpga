# alinx_ax7035b_openxc7 retargeted to nextpnr_openxc7 (open-source flow).
# Mirrors alinx_ax7035b — only the toolchain differs.

Configuration:
  id: alinx_ax7035b_openxc7
  board: alinx_ax7035b
  toolchain: nextpnr_openxc7
  attach:
  - peripheral: clock_input
    bind:
      clk: clk
  - peripheral: reset_button
    bind:
      rst: cpu_resetn
  - peripheral: button_array
    params:
      width: 4
    bind:
      btn: onboard_buttons
  - peripheral: led_bank   # from BGM alinx_ax7035b/board_specific_top.sv
    params:
      width: 4
      active: low
      mirror: true
    bind:
      led: onboard_leds
  - peripheral: seven_segment_8digit_shared   # bit order and polarity from BGM's assigns (sync --seven-seg)
    params:
      digits: 6
      active: low
      digits_active: low
    bind:
      segments: ["onboard_7seg.segments[0]", "onboard_7seg.segments[1]", "onboard_7seg.segments[2]", "onboard_7seg.segments[3]", "onboard_7seg.segments[4]", "onboard_7seg.segments[5]", "onboard_7seg.segments[6]"]
      dp: "onboard_7seg.segments[7]"
      digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]"]
  - peripheral: uart_2wire
    bind:
      tx: onboard_uart.tx
      rx: onboard_uart.rx
