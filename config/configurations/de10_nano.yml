# Configuration for variant 'de10_nano'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/de10_nano/board_specific.qsf

Configuration:
  id: de10_nano
  board: de10_nano
  toolchain: quartus_prime_lite

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - switch_msb: true

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: fpga_clk1_50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key   # binds from BGM de10_nano/board_specific_top.sv
      bind:
        stb: "gpio_0[27]"
        clk: "gpio_0[29]"
        dio: "gpio_0[31]"
    - peripheral: inmp441_i2s_mic   # binds from BGM de10_nano/board_specific_top.sv
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
