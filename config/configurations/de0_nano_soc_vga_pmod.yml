# Configuration 'de0_nano_soc_vga_pmod'.
# Generated from config/setups/de0_nano_soc_vga_pmod.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de0_nano_soc_vga_pmod
  board: de0_nano_soc
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    de0_nano_soc_vga_pmod_mistral:
      toolchain: nextpnr_mistral

  attach:
    - peripheral: clock_input
      bind:
        clk: fpga_clk1_50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        gate: false
      bind:
        r: ["gpio_1[35]", "gpio_1[33]", "gpio_1[31]", "gpio_1[29]"]
        g: ["gpio_1[25]", "gpio_1[23]", "gpio_1[21]", "gpio_1[19]"]
        b: ["gpio_1[17]", "gpio_1[15]", "gpio_1[13]", "gpio_1[11]"]
        hs: "gpio_1[5]"
        vs: "gpio_1[7]"
    - peripheral: tm1638_led_key
      bind:
        stb: "gpio_0[29]"
        clk: "gpio_0[27]"
        dio: "gpio_0[31]"
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_0[4]"
        ws: "gpio_0[2]"
        sd: "gpio_0[5]"
        lr: "gpio_0[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio_1[32]"
        bclk: "gpio_1[30]"
        lrclk: "gpio_1[26]"
        sdata: "gpio_1[28]"
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_0

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio_0[1]": 0
    "gpio_0[3]": 1
