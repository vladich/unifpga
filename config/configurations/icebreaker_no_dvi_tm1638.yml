# Configuration 'icebreaker_no_dvi_tm1638'.
# Generated from config/setups/icebreaker_no_dvi_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: icebreaker_no_dvi_tm1638
  board: icebreaker
  toolchain: nextpnr_icestorm

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    icebreaker_no_dvi_tm1638_yosys: {}

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: tm1638_led_key
      bind:
        stb: "pmod_p2[7]"
        clk: "pmod_p2[6]"
        dio: "pmod_p2[5]"
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "pmod_p1a[2]"
        ws: "pmod_p1a[1]"
        sd: "pmod_p1a[3]"
        lr: "pmod_p1a[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_p1b[0]"
        bclk: "pmod_p1b[1]"
        lrclk: "pmod_p1b[3]"
        sdata: "pmod_p1b[2]"
    - peripheral: gpio_header
      params:
        width: 5
      bind:
        io: ["pmod_p2[0]", "pmod_p2[1]", "pmod_p2[2]", "pmod_p2[3]", "pmod_p2[4]"]
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
