# Configuration 'de1_soc'.

Configuration:
  id: de1_soc
  board: de1_soc
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 6
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5]
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from bits_r/bits_g/bits_b
      params:
        bits_r: 8
        bits_g: 8
        bits_b: 8
        pin_bits_r: 8
        pin_bits_g: 8
        pin_bits_b: 8
        color_depth: 888
        gate: false        # colours ungated (a DAC blanked through BLANK_N)
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
        clk: onboard_vga.clk
        blank_n: onboard_vga.blank_n

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
    - peripheral: wm8731_i2s_out
      bind:
        xck: onboard_audio_codec.xck
        bclk: onboard_audio_codec.bclk
        dac_lrck: onboard_audio_codec.dac_lrck
        dac_dat: onboard_audio_codec.dac_dat
        i2c_sclk: onboard_fpga_i2c.sclk
        i2c_sdat: onboard_fpga_i2c.sdat
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_1
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_0

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_vga.sync_n: 0
    "gpio_0[1]": 0
    "gpio_0[3]": 1
