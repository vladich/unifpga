# Configuration for variant 'emooc_cc'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/emooc_cc/board_specific.qsf

Configuration:
  id: emooc_cc
  board: emooc_cc
  toolchain: quartus_prime_lite

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - key: msb

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 8
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 8
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 16
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 6
      bind:
        segments: ["onboard_7seg.segments[0]", "onboard_7seg.segments[1]", "onboard_7seg.segments[2]", "onboard_7seg.segments[3]", "onboard_7seg.segments[4]", "onboard_7seg.segments[5]", "onboard_7seg.segments[6]"]
        dp: "onboard_7seg.segments[7]"
        digits: onboard_7seg.anodes

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM emooc_cc/board_specific_top.sv
      bind:
        lr: "gpio_p1[14]"
        ws: "gpio_p1[15]"
        sck: "gpio_p1[16]"
        sd: "gpio_p1[17]"
