# Configuration for variant 'emooc_cc'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/emooc_cc/board_specific.qsf

Configuration:
  id: emooc_cc
  board: emooc_cc
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 8
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 8
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 16
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared   # bit order and polarity from BGM's assigns (sync --seven-seg)
      params:
        digits: 6
        active: high
        digits_active: low
      bind:
        segments: ["onboard_7seg.segments[7]", "onboard_7seg.segments[6]", "onboard_7seg.segments[5]", "onboard_7seg.segments[4]", "onboard_7seg.segments[3]", "onboard_7seg.segments[2]", "onboard_7seg.segments[1]"]
        dp: "onboard_7seg.segments[0]"
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]"]

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM emooc_cc/board_specific_top.sv
      bind:
        lr: "gpio_p1[14]"
        ws: "gpio_p1[15]"
        sck: "gpio_p1[16]"
        sd: "gpio_p1[17]"
    - peripheral: i2s_audio_out   # from BGM emooc_cc/board_specific_top.sv
      bind:
        mclk: "gpio_p2[0]"
        bclk: "gpio_p2[1]"
        lrclk: "gpio_p2[2]"
        sdata: "gpio_p2[3]"
    - peripheral: vga_4bit   # from BGM emooc_cc/board_specific_top.sv (VGA on header pins)
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        gate: False
      bind:
        r: ["gpio_p1[2]", "gpio_p1[3]", "gpio_p1[4]", "gpio_p1[5]"]
        g: ["gpio_p1[6]", "gpio_p1[7]", "gpio_p1[8]", "gpio_p1[9]"]
        b: ["gpio_p1[10]", "gpio_p1[11]", "gpio_p1[12]", "gpio_p1[13]"]
        hs: "gpio_p1[0]"
        vs: "gpio_p1[1]"
    - peripheral: gpio_header   # from BGM emooc_cc/board_specific_top.sv .gpio
      params:
        width: 8
      bind:
        io: ["gpio_p2[4]", "gpio_p2[5]", "gpio_p2[6]", "gpio_p2[7]", "gpio_p2[8]", "gpio_p2[9]", "gpio_p2[10]", "gpio_p2[11]"]
