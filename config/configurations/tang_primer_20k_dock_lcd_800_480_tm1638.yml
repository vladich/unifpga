# Configuration 'tang_primer_20k_dock_lcd_800_480_tm1638'.
# Generated from config/setups/tang_primer_20k_dock_lcd_800_480_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_primer_20k_dock_lcd_800_480_tm1638
  board: tang_primer_20k_dock
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        active: high
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons
    - peripheral: lcd_800_480
      params:
        clock_pixel_pll: {idiv: 8, fbdiv: 10, odiv: 16, sdiv: 2, clkoutd: false}
        bl: context.rst_n
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
        bl: onboard_lcd.bl
    - peripheral: tm1638_led_key
      bind:
        clk: "gpio_1[2]"
        stb: "gpio_1[3]"
        dio: "gpio_1[1]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio_0[2]"
        ws: "gpio_0[3]"
        sck: "gpio_0[1]"
        sd: "gpio_0[0]"
    - peripheral: i2s_audio_out
      params:
        align_right: 1
        offset_by_one_cycle: 0
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: i2s_audio_out
      params:
        align_right: 0
        offset_by_one_cycle: 1
      bind:
        mclk: "gpio_1[4]"
        bclk: "gpio_1[5]"
        lrclk: "gpio_1[7]"
        sdata: "gpio_1[6]"
