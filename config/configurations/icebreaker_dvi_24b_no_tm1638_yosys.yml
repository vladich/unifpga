Configuration:
  id: icebreaker_dvi_24b_no_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: led_bank
      params:
        width: 5
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: dvi_pmod_ddr_24b
      bind:
        pmod_a: pmod_p1a
        pmod_b: pmod_p1b
