# Configuration for variant 'icebreaker_dvi_24b_no_tm1638_yosys'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/icebreaker_dvi_24b_no_tm1638_yosys/board_specific.pcf

Configuration:
  id: icebreaker_dvi_24b_no_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm
  lab_clock: pixel   # BGM: `localparam lab_mhz = pixel_mhz` (tools/sync_from_bgm.py --clock-tree)

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - key: 0

  # iCEBreaker P2 header: LED/BTN break-off Pmod, no user gpio (BGM no-TM1638 branch; see PLAN.md)
  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
    - peripheral: pmod_12pin
      bind:
        io: pmod_p1a
    - peripheral: pmod_12pin
      bind:
        io: pmod_p1b
    - peripheral: led_bank
      params:
        width: 5
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons

  # External peripherals inferred from the variant directory name.
    - peripheral: dvi_pmod_ddr_24b
      bind:
        pmod_a: pmod_p1a
        pmod_b: pmod_p1b
