# arty_a7_35_pmod_mic3_openxc7 retargeted to nextpnr_openxc7 (open-source flow).
# Mirrors arty_a7_35_pmod_mic3 — only the toolchain differs.

Configuration:
  id: arty_a7_35_pmod_mic3_openxc7
  board: arty_a7
  toolchain: nextpnr_openxc7
  part: 35t   # which of the board's chips this configuration targets
  attach:
  - peripheral: clock_input
    params:
      frequency_mhz: 100
    bind:
      clk: clk100mhz
  - peripheral: sw_bank
    params:
      width: 4
    bind:
      sw: onboard_switches
  - peripheral: rgb_led
    bind:
      r: onboard_rgb_led_0.r
      g: onboard_rgb_led_0.g
      b: onboard_rgb_led_0.b
  - peripheral: rgb_led
    bind:
      r: onboard_rgb_led_1.r
      g: onboard_rgb_led_1.g
      b: onboard_rgb_led_1.b
  - peripheral: rgb_led
    bind:
      r: onboard_rgb_led_2.r
      g: onboard_rgb_led_2.g
      b: onboard_rgb_led_2.b
  - peripheral: rgb_led
    bind:
      r: onboard_rgb_led_3.r
      g: onboard_rgb_led_3.g
      b: onboard_rgb_led_3.b
  - peripheral: led_bank
    params:
      width: 4
    bind:
      led: onboard_leds
  - peripheral: button_array
    params:
      width: 4
    bind:
      btn: onboard_buttons
  - peripheral: pmod_12pin
    bind:
      io: pmod_ja
  - peripheral: pmod_12pin
    bind:
      io: pmod_jb
  - peripheral: pmod_12pin
    bind:
      io: pmod_jc
  - peripheral: pmod_12pin
    bind:
      io: pmod_jd
  - peripheral: uart_2wire
    bind:
      tx: onboard_uart.tx
      rx: onboard_uart.rx
  - peripheral: reset_button
    bind:
      rst: cpu_resetn
  - peripheral: pmod_mic3
    bind:
      cs: pmod_jd[3]
  - peripheral: tm1638_led_key
    bind:
      clk: arduino_io[40]
      stb: arduino_io[41]
      dio: arduino_io[39]
