# Configuration 'marsohod3gw2'.
# Generated from config/setups/marsohod3gw2.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: marsohod3gw2
  board: marsohod3gw2
  toolchain: gowin_eda

  attach:
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_ft_bridge.b1
        rx: onboard_ft_bridge.b0
    - peripheral: button_array
      params:
        width: 4
        active: low
      bind:
        btn: ["gpio[11]", "gpio[10]", "gpio[9]", "gpio[8]"]
    - peripheral: adc_8bit_mic
      bind:
        d: onboard_adc.d
        clk: onboard_adc.clk
    - peripheral: hdmi_tmds
      params:
        timing: lab
        clock_serial_mhz: 250
      bind:
        d_p: onboard_hdmi.d_p
        clk_p: onboard_hdmi.clk_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 4
        active: low
        digits_active: high
      bind:
        segments: ["gpio[6]", "gpio[7]", "gpio[4]", "gpio[2]", "gpio[0]", "gpio[5]", "gpio[3]"]
        dp: "gpio[1]"
        digits: ["gpio[14]", "gpio[12]", "gpio[13]", "gpio[15]"]

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio[16]": 0
    "gpio[17]": 0
    "gpio[18]": 0
    "gpio[19]": 0
