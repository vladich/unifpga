# Configuration 'tang_primer_20k_lite'.
# Generated from config/setups/tang_primer_20k_lite.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_primer_20k_lite
  board: tang_primer_20k_lite
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: sw_bank
      params:
        width: 2
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: tm1638_led_key
      bind:
        clk: "gpio_2[2]"
        stb: "gpio_2[3]"
        dio: "gpio_2[1]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio_3[1]"
        ws: "gpio_3[2]"
        sck: "gpio_3[3]"
        sd: "gpio_3[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio_3[4]"
        bclk: "gpio_3[5]"
        sdata: "gpio_3[6]"
        lrclk: "gpio_3[7]"
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
      bind:
        r: ["gpio_0[4]", "gpio_0[5]", "gpio_0[6]", "gpio_0[7]"]
        g: ["gpio_1[4]", "gpio_1[5]", "gpio_1[6]", "gpio_1[7]"]
        b: ["gpio_0[0]", "gpio_0[1]", "gpio_0[2]", "gpio_0[3]"]
        hs: "gpio_1[0]"
        vs: "gpio_1[1]"

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio_1[3]": 0
    "gpio_1[2]": 0
