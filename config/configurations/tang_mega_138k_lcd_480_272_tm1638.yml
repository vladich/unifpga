# Configuration 'tang_mega_138k_lcd_480_272_tm1638'.
# Generated from config/setups/tang_mega_138k_lcd_480_272_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_mega_138k_lcd_480_272_tm1638
  board: tang_mega_138k
  toolchain: gowin_standard

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: pmod_0
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: pmod_1
    - peripheral: lcd_480_272
      params:
        clock_pixel_mhz: 8
        bits_r: 6
        bits_g: 6
        bits_b: 6
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
    - peripheral: tm1638_led_key
      bind:
        stb: "pmod_1[2]"
        clk: "pmod_1[4]"
        dio: "pmod_1[6]"
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "pmod_0[0]"
        ws: "pmod_0[2]"
        sd: "pmod_1[0]"
        lr: "pmod_0[4]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_1[1]"
        bclk: "pmod_1[3]"
        lrclk: "pmod_1[7]"
        sdata: "pmod_1[5]"
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: i2s_audio_out
      params:
        align_right: 1
        offset_by_one_cycle: 0
      bind:
        bclk: onboard_audio.bck
        lrclk: onboard_audio.ws
        sdata: onboard_audio.din
        pa_en_n: onboard_audio.pa_en_n
    - peripheral: ws2812
      bind:
        din: onboard_ws2812.din
    - peripheral: fan_pwm
      bind:
        pwm: onboard_fan.pwm
        en: onboard_fan.en
        tach: onboard_fan.tacho
