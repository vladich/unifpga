# Configuration 'tang_mega_138k_lcd_480_272_tm1638'.
# Generated from config/setups/tang_mega_138k_lcd_480_272_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_mega_138k_lcd_480_272_tm1638
  board: tang_mega_138k
  toolchain: gowin_standard

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: pmod_12pin
      bind:
        io: pmod_0
    - peripheral: pmod_12pin
      bind:
        io: pmod_1
    - peripheral: lcd_480_272
      params:
        clock_pixel_mhz: 8
        bits_r: 6
        bits_g: 6
        bits_b: 6
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
    - peripheral: tm1638_led_key
      bind:
        dio: "pmod_1[6]"
        clk: "pmod_1[4]"
        stb: "pmod_1[2]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "pmod_0[4]"
        ws: "pmod_0[2]"
        sck: "pmod_0[0]"
        sd: "pmod_1[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_1[1]"
        bclk: "pmod_1[3]"
        sdata: "pmod_1[5]"
        lrclk: "pmod_1[7]"
