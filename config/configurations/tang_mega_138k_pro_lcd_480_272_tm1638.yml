# Configuration 'tang_mega_138k_pro_lcd_480_272_tm1638'.

Configuration:
  id: tang_mega_138k_pro_lcd_480_272_tm1638
  board: tang_mega_138k_pro
  toolchain: gowin_standard

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        active: high
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: pmod_12pin
      bind:
        io: pmod_0
    - peripheral: pmod_12pin
      bind:
        io: pmod_1
    - peripheral: pmod_12pin
      bind:
        io: pmod_2

  # External peripherals inferred from the variant directory name.
    - peripheral: lcd_480_272
      params:   # 6-6-6 bus
        clock_pixel_mhz: 8
        bits_r: 6
        bits_g: 6
        bits_b: 6
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        de: onboard_lcd.de
        ck: onboard_lcd.ck
    - peripheral: tm1638_led_key
      bind:
        dio: "pmod_2[5]"
        clk: "pmod_2[6]"
        stb: "pmod_2[7]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "pmod_0[0]"
        ws: "pmod_0[1]"
        sck: "pmod_0[2]"
        sd: "pmod_0[6]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_1[4]"
        bclk: "pmod_1[5]"
        sdata: "pmod_1[6]"
        lrclk: "pmod_1[7]"

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "pmod_0[4]": 0
    "pmod_0[5]": 1
