# Configuration for variant 'terasic_sockit'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/terasic_sockit/board_specific.qsf
#   - basics-graphics-music/boards/terasic_sockit/SoCKit_golden_top.qsf

Configuration:
  id: terasic_sockit
  board: terasic_sockit
  toolchain: quartus_prime_lite

  attach:
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: osc_50_b3b
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 8
        bits_g: 8
        bits_b: 8
        pin_bits_r: 8
        pin_bits_g: 8
        pin_bits_b: 8
        color_depth: 888
      bind:
        clk: onboard_vga.clk
        blank_n: onboard_vga.blank_n
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    onboard_vga.sync_n: 0
