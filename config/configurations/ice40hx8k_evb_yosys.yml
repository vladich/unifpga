# Configuration for variant 'ice40hx8k_evb_yosys'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/ice40hx8k_evb_yosys/board_specific.pcf

Configuration:
  id: ice40hx8k_evb_yosys
  board: ice40hx8k_evb
  toolchain: nextpnr_icestorm

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 2
      bind:
        led: onboard_leds
    - peripheral: sw_bank
      params:
        width: 2
      bind:
        sw: onboard_switches
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
        gate: false        # BGM drives the colours ungated (a DAC blanked through BLANK_N)
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key   # binds from BGM ice40hx8k_evb_yosys/board_specific_top.sv
      bind:
        clk: "gpio[0]"
        stb: "gpio[1]"
        dio: "gpio[2]"
    - peripheral: inmp441_i2s_mic   # binds from BGM ice40hx8k_evb_yosys/board_specific_top.sv
      bind:
        lr: "gpio[3]"
        ws: "gpio[4]"
        sck: "gpio[5]"
        sd: "gpio[6]"
    - peripheral: i2s_audio_out   # from BGM ice40hx8k_evb_yosys/board_specific_top.sv
      bind:
        mclk: "gpio[7]"
        bclk: "gpio[8]"
        sdata: "gpio[9]"
        lrclk: "gpio[10]"
