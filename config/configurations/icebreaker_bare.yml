# Configuration for variant 'icebreaker_bare'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/icebreaker_bare/icebreaker.pcf

Configuration:
  id: icebreaker_bare
  board: icebreaker
  toolchain: nextpnr_icestorm

  # iCEBreaker P2 header: LED/BTN break-off Pmod, no user gpio (BGM no-TM1638 branch)
  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
    - peripheral: led_bank   # from BGM icebreaker_bare/board_specific_top.sv
      params:
        width: 5
      bind:
        led: onboard_leds
    - peripheral: led_bank   # from BGM icebreaker_bare/board_specific_top.sv
      params:
        width: 1
        active: low
      bind:
        led: onboard_led_green
    - peripheral: led_bank   # from BGM icebreaker_bare/board_specific_top.sv
      params:
        width: 1
        active: low
      bind:
        led: onboard_led_red
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: pmod_12pin   # from BGM icebreaker_bare/board_specific_top.sv .gpio
      bind:
        io: pmod_p1b
    - peripheral: pmod_12pin   # from BGM icebreaker_bare/board_specific_top.sv .gpio
      bind:
        io: pmod_p1a
