# Configuration 'icebreaker_bare'.
# Generated from config/setups/icebreaker_bare.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: icebreaker_bare
  board: icebreaker
  toolchain: nextpnr_icestorm

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 1
      bind:
        btn: onboard_button
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
    - peripheral: led_bank
      params:
        width: 5
      bind:
        led: onboard_leds
    - peripheral: led_bank
      params:
        width: 1
        active: low
      bind:
        led: onboard_led_green
    - peripheral: led_bank
      params:
        width: 1
        active: low
      bind:
        led: onboard_led_red
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: pmod_12pin
      bind:
        io: pmod_p1b
    - peripheral: pmod_12pin
      bind:
        io: pmod_p1a
