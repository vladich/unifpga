# Configuration 'de2_115'.
# Generated from config/setups/de2_115.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de2_115
  board: de2_115
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 18
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 9
      bind:
        led: onboard_leds_green
    - peripheral: led_bank
      params:
        width: 18
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 8
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5, onboard_7seg.hex6, onboard_7seg.hex7]
    - peripheral: vga_4bit
      params:
        bits_r: 8
        bits_g: 8
        bits_b: 8
        pin_bits_r: 8
        pin_bits_g: 8
        pin_bits_b: 8
        color_depth: 888
        gate: false
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
        clk: onboard_vga.clk
        blank_n: onboard_vga.blank_n
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio[4]"
        ws: "gpio[2]"
        sd: "gpio[5]"
        lr: "gpio[0]"
    - peripheral: wm8731_i2s_out
      bind:
        xck: onboard_audio_codec.xck
        bclk: onboard_audio_codec.bclk
        dac_lrck: onboard_audio_codec.dac_lrck
        dac_dat: onboard_audio_codec.dac_dat
        i2c_sclk: onboard_i2c.sclk
        i2c_sdat: onboard_i2c.sdat
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio
    - peripheral: hd44780_lcd
      bind:
        rs: onboard_lcd.LCD_RS
        e: onboard_lcd.LCD_EN
        d: ["onboard_lcd.LCD_DATA[4]", "onboard_lcd.LCD_DATA[5]", "onboard_lcd.LCD_DATA[6]", "onboard_lcd.LCD_DATA[7]"]
        rw: onboard_lcd.LCD_RW
    - peripheral: ps2_keyboard
      bind:
        clk: onboard_ps2.PS2_CLK
        data: onboard_ps2.PS2_DAT
    - peripheral: ir_receiver
      bind:
        ir: onboard_irda.IRDA_RXD
    - peripheral: sdram_sdr
      params:
        row_bits: 13
        data_bits: 32
        col_bits: 10
      bind:
        clk: onboard_sdram.DRAM_CLK
        cke: onboard_sdram.DRAM_CKE
        cs_n: onboard_sdram.DRAM_CS_N
        ras_n: onboard_sdram.DRAM_RAS_N
        cas_n: onboard_sdram.DRAM_CAS_N
        we_n: onboard_sdram.DRAM_WE_N
        ba: onboard_sdram.DRAM_BA
        a: onboard_sdram.DRAM_ADDR
        dq: onboard_sdram.DRAM_DQ
        dqm: onboard_sdram.DRAM_DQM
    - peripheral: sdcard_spi
      bind:
        clk: onboard_sdcard.SD_CLK
        cmd: onboard_sdcard.SD_CMD
        dat0: "onboard_sdcard.SD_DAT[0]"
        dat3: "onboard_sdcard.SD_DAT[3]"

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_vga.sync_n: 0
    "gpio[1]": 0
    "gpio[3]": 1
    "onboard_leds_green[8]": 0
