# Configuration for variant 'orangecrab_ecp5_yosys'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/orangecrab_ecp5_yosys/board_specific.lpf

Configuration:
  id: orangecrab_ecp5_yosys
  board: orangecrab_ecp5
  toolchain: nextpnr_trellis
  part: 25F   # which of the board's chips this configuration targets

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        width: 3
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: sw_bank
      params:
        width: 2
      bind:
        sw: onboard_switches
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        switches: []
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM orangecrab_ecp5_yosys/board_specific_top.sv
      bind:
        lr: "gpio[3]"
        ws: "gpio[4]"
        sck: "gpio[5]"
        sd: "gpio[6]"
