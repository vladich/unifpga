# Configuration for variant 'orangecrab_ecp5_yosys'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/orangecrab_ecp5_yosys/board_specific.lpf

Configuration:
  id: orangecrab_ecp5_yosys
  board: orangecrab_ecp5
  toolchain: nextpnr_trellis
  part: 25F   # which of the board's chips this configuration targets

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        width: 3
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: vga_4bit
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: sw_bank
      params:
        width: 2
      bind:
        sw: onboard_switches
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key
      bind:
        clk: "gpio[0]"
        stb: "gpio[1]"
        dio: "gpio[2]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[3]"
        ws: "gpio[4]"
        sck: "gpio[5]"
        sd: "gpio[6]"
