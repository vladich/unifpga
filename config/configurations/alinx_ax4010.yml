# Configuration for variant 'alinx_ax4010'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/alinx_ax4010/board_specific.qsf

Configuration:
  id: alinx_ax4010
  board: alinx_ax4010
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      bind:
        clk: sys_clk
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared
      bind:
        segments: ['onboard_7seg.ca', 'onboard_7seg.cb', 'onboard_7seg.cc', 'onboard_7seg.cd', 'onboard_7seg.ce', 'onboard_7seg.cf', 'onboard_7seg.cg']
        digits: onboard_7seg.anodes
    - peripheral: vga_4bit
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
