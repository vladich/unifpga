# terasic_sockit_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow).
# Mirrors terasic_sockit — only the toolchain differs.


Configuration:
  id: terasic_sockit_mistral
  board: terasic_sockit
  toolchain: nextpnr_mistral

  attach:
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: osc_50_b3b
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from bits_r/bits_g/bits_b
      params:
        bits_r: 8
        bits_g: 8
        bits_b: 8
        pin_bits_r: 8
        pin_bits_g: 8
        pin_bits_b: 8
        color_depth: 888
        gate: false        # colours ungated (a DAC blanked through BLANK_N)
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
        clk: onboard_vga.clk
        blank_n: onboard_vga.blank_n

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_vga.sync_n: 0
