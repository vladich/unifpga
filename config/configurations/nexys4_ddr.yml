# Configuration for variant 'nexys4_ddr'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/nexys4_ddr/board_specific.xdc

Configuration:
  id: nexys4_ddr
  board: nexys4_ddr
  toolchain: vivado

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 100
      bind:
        clk: clk100mhz
    - peripheral: sw_bank
      params:
        width: 16
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 16
      bind:
        led: onboard_leds
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_16.r
        g: onboard_rgb_led_16.g
        b: onboard_rgb_led_16.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_17.r
        g: onboard_rgb_led_17.g
        b: onboard_rgb_led_17.b
    - peripheral: seven_segment_8digit_shared   # bit order and polarity from BGM's assigns (sync --seven-seg)
      params:
        digits: 8
        active: low
        digits_active: low
      bind:
        segments: ["onboard_7seg.ca", "onboard_7seg.cb", "onboard_7seg.cc", "onboard_7seg.cd", "onboard_7seg.ce", "onboard_7seg.cf", "onboard_7seg.cg"]
        dp: "onboard_7seg.dp"
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]", "onboard_7seg.anodes[6]", "onboard_7seg.anodes[7]"]
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons
    - peripheral: pmod_12pin
      bind:
        io: pmod_ja
    - peripheral: pmod_12pin
      bind:
        io: pmod_jb
    - peripheral: pmod_12pin
      bind:
        io: pmod_jc
    - peripheral: pmod_12pin
      bind:
        io: pmod_jd
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: pwm_amp
      bind:
        pwm: onboard_pwm_amp.pwm
        sd: onboard_pwm_amp.sd
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: inmp441_i2s_mic   # binds from BGM nexys4_ddr/board_specific_top.sv
      bind:
        lr: "pmod_jd[6]"
        ws: "pmod_jd[5]"
        sck: "pmod_jd[4]"
        sd: "pmod_jd[0]"
