# Configuration 'nexys4_ddr'.
# Generated from config/setups/nexys4_ddr.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: nexys4_ddr
  board: nexys4_ddr
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    nexys4_ddr_default: {}
    nexys4_ddr_default_openxc7:
      toolchain: nextpnr_openxc7
    nexys4_ddr_openxc7:
      toolchain: nextpnr_openxc7
    nexys4_ddr_tm1638_inmp441_jc: {}
    nexys4_ddr_tm1638_inmp441_jc_openxc7:
      toolchain: nextpnr_openxc7

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 100
      bind:
        clk: clk100mhz
    - peripheral: sw_bank
      params:
        width: 16
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 16
      bind:
        led: onboard_leds
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_16.r
        g: onboard_rgb_led_16.g
        b: onboard_rgb_led_16.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_17.r
        g: onboard_rgb_led_17.g
        b: onboard_rgb_led_17.b
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 8
        active: low
        digits_active: low
      bind:
        segments: [onboard_7seg.ca, onboard_7seg.cb, onboard_7seg.cc, onboard_7seg.cd, onboard_7seg.ce, onboard_7seg.cf, onboard_7seg.cg]
        dp: onboard_7seg.dp
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]", "onboard_7seg.anodes[6]", "onboard_7seg.anodes[7]"]
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: pwm_amp
      params:
        open_drain: true
      bind:
        pwm: onboard_pwm_amp.pwm
        sd: onboard_pwm_amp.sd
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "pmod_jd[4]"
        ws: "pmod_jd[5]"
        sd: "pmod_jd[0]"
        lr: "pmod_jd[6]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_jc[4]"
        bclk: "pmod_jc[5]"
        lrclk: "pmod_jc[7]"
        sdata: "pmod_jc[6]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_jb[6]"
        bclk: "pmod_jb[3]"
        lrclk: "pmod_jb[0]"
        sdata: "pmod_jb[1]"
    - peripheral: ps2_keyboard
      bind:
        clk: onboard_usb_hid.clk
        data: onboard_usb_hid.data

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_mic.clk: 0
    onboard_mic.lrsel: 0
    "pmod_jd[2]": 0
    "pmod_jd[1]": 1
