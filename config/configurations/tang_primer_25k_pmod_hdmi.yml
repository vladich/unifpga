# Configuration for variant 'tang_primer_25k_pmod_hdmi'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_primer_25k_pmod_hdmi/board_specific.cst

Configuration:
  id: tang_primer_25k_pmod_hdmi
  board: tang_primer_25k
  toolchain: gowin_standard

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - key: msb

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        as_switches: true
        width: 2
      bind:
        btn: onboard_buttons
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [0, 1]
        switches: [0, 1]
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: hdmi_tmds   # binds from BGM tang_primer_25k_pmod_hdmi/board_specific_top.sv
      params:
        clock_serial_mhz: 250
      bind:
        clk_p: onboard_hdmi_0.clk_p
        d_p: onboard_hdmi_0.d_p
        clk_n: onboard_hdmi_0.clk_n
        d_n: onboard_hdmi_0.d_n
    - peripheral: tm1638_led_key   # binds from BGM tang_primer_25k_pmod_hdmi/board_specific_top.sv
      bind:
        dio: "pmod_2[1]"
        clk: "pmod_2[2]"
        stb: "pmod_2[3]"
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: [0, 1, 2, 3, 4, 5, 6, 7]
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
        seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_primer_25k_pmod_hdmi/board_specific_top.sv
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
    - peripheral: i2s_audio_out   # from BGM tang_primer_25k_pmod_hdmi/board_specific_top.sv
      bind:
        mclk: "pmod_2[4]"
        bclk: "pmod_2[5]"
        sdata: "pmod_2[6]"
        lrclk: "pmod_2[7]"
    - peripheral: gpio_header   # from BGM tang_primer_25k_pmod_hdmi/board_specific_top.sv .gpio
      params:
        width: 32
      bind:
        io: ["gpio[0]", "gpio[1]", "gpio[2]", "gpio[3]", "gpio[4]", "gpio[5]", "gpio[6]", "gpio[7]", "gpio[8]", "gpio[9]", "gpio[10]", "gpio[11]", "gpio[12]", "gpio[13]", "gpio[14]", "gpio[15]", "gpio[16]", "gpio[17]", "gpio[18]", "gpio[19]", "gpio[20]", "gpio[21]", "gpio[22]", "gpio[23]", "gpio[24]", "gpio[25]", "gpio[26]", "gpio[27]", "gpio[28]", "gpio[29]", "gpio[36]", "gpio[37]"]

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
