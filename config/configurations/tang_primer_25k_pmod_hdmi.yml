# Configuration 'tang_primer_25k_pmod_hdmi'.
# Generated from config/setups/tang_primer_25k_pmod_hdmi.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_primer_25k_pmod_hdmi
  board: tang_primer_25k
  toolchain: gowin_standard

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: hdmi_tmds
      params:
        clock_serial_mhz: 250
      bind:
        clk_p: onboard_hdmi_0.clk_p
        d_p: onboard_hdmi_0.d_p
        clk_n: onboard_hdmi_0.clk_n
        d_n: onboard_hdmi_0.d_n
    - peripheral: tm1638_led_key
      bind:
        stb: "pmod_2[3]"
        clk: "pmod_2[2]"
        dio: "pmod_2[1]"
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio[4]"
        ws: "gpio[2]"
        sd: "gpio[5]"
        lr: "gpio[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_2[4]"
        bclk: "pmod_2[5]"
        lrclk: "pmod_2[7]"
        sdata: "pmod_2[6]"
    - peripheral: gpio_header
      params:
        width: 32
      bind:
        io: ["gpio[0]", "gpio[1]", "gpio[2]", "gpio[3]", "gpio[4]", "gpio[5]", "gpio[6]", "gpio[7]", "gpio[8]", "gpio[9]", "gpio[10]", "gpio[11]", "gpio[12]", "gpio[13]", "gpio[14]", "gpio[15]", "gpio[16]", "gpio[17]", "gpio[18]", "gpio[19]", "gpio[20]", "gpio[21]", "gpio[22]", "gpio[23]", "gpio[24]", "gpio[25]", "gpio[26]", "gpio[27]", "gpio[28]", "gpio[29]", "gpio[36]", "gpio[37]"]

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
