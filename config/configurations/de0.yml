# Configuration 'de0'.
# Generated from config/setups/de0.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de0
  board: de0
  toolchain: quartus2

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 3
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds_green
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: seven_segment_per_digit
      params:
        digits: 4
        segs: 8
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3]
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_0[6]"
        ws: "gpio_0[4]"
        sd: "gpio_0[7]"
        lr: "gpio_0[2]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio_0[29]"
        bclk: "gpio_0[27]"
        lrclk: "gpio_0[23]"
        sdata: "gpio_0[25]"
    - peripheral: gpio_header
      params:
        width: 32
      bind:
        io: gpio_1
    - peripheral: gpio_header
      params:
        width: 32
      bind:
        io: gpio_0
    - peripheral: hd44780_lcd
      bind:
        rs: onboard_lcd.LCD_RS
        e: onboard_lcd.LCD_EN
        d: ["onboard_lcd.LCD_DATA[4]", "onboard_lcd.LCD_DATA[5]", "onboard_lcd.LCD_DATA[6]", "onboard_lcd.LCD_DATA[7]"]
        rw: onboard_lcd.LCD_RW
    - peripheral: ps2_keyboard
      bind:
        clk: onboard_ps2.PS2_KBCLK
        data: onboard_ps2.PS2_KBDAT

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio_0[3]": 0
    "gpio_0[5]": 1
