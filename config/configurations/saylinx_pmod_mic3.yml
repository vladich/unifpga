# Configuration for variant 'saylinx_pmod_mic3'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/saylinx_pmod_mic3/board_specific.qsf

Configuration:
  id: saylinx_pmod_mic3
  board: saylinx
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: button_array
      params:
        as_switches: true
        width: 3
      bind:
        btn: onboard_buttons
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        switches: [0, 1, 2]
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared   # bit order and polarity from BGM's assigns (sync --seven-seg)
      params:
        digits: 8
        active: low
        digits_active: low
      bind:
        segments: ["onboard_7seg.segments[7]", "onboard_7seg.segments[6]", "onboard_7seg.segments[5]", "onboard_7seg.segments[4]", "onboard_7seg.segments[3]", "onboard_7seg.segments[2]", "onboard_7seg.segments[1]"]
        dp: "onboard_7seg.segments[0]"
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]", "onboard_7seg.anodes[6]", "onboard_7seg.anodes[7]"]
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 5
        bits_g: 6
        bits_b: 5
        pin_bits_r: 5
        pin_bits_g: 6
        pin_bits_b: 5
        color_depth: 565
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

  # External peripherals inferred from the variant directory name.
    - peripheral: pmod_mic3   # binds from BGM saylinx_pmod_mic3/board_specific_top.sv
      bind:
        cs: "gpio_1[26]"
        sclk: "gpio_1[32]"
        miso: "gpio_1[30]"
    - peripheral: i2s_audio_out   # from BGM saylinx_pmod_mic3/board_specific_top.sv
      bind:
        mclk: "gpio_0[12]"
        bclk: "gpio_0[10]"
        lrclk: "gpio_0[6]"
        sdata: "gpio_0[8]"
    - peripheral: gpio_header   # from BGM saylinx_pmod_mic3/board_specific_top.sv .gpio
      params:
        width: 34
      bind:
        io: gpio_1
    - peripheral: gpio_header   # from BGM saylinx_pmod_mic3/board_specific_top.sv .gpio
      params:
        width: 34
      bind:
        io: gpio_0
