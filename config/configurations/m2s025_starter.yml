# Configuration 'm2s025_starter'.
# m2s025_starter — SmartFusion2 Starter Kit (M2S025T).
# Drives Libero SoC's TCL batch flow.
# Generated from config/setups/m2s025_starter.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: m2s025_starter
  board: m2s025_starter
  toolchain: libero_soc

  manual: true

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: onboard_reset
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 3
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
