# Configuration 'orangepi_msoc'.
# Generated from config/setups/orangepi_msoc.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: orangepi_msoc
  board: orangepi_msoc
  toolchain: gowin_standard

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        width: 16
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: sw_bank
      params:
        width: 16
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 8
        active: low
        digits_active: high
      bind:
        segments: [onboard_7seg.ca, onboard_7seg.cb, onboard_7seg.cc, onboard_7seg.cd, onboard_7seg.ce, onboard_7seg.cf, onboard_7seg.cg]
        dp: onboard_7seg.dp
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]", "onboard_7seg.anodes[6]", "onboard_7seg.anodes[7]"]
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[13]"
        ws: "gpio[15]"
        sck: "gpio[11]"
        sd: "gpio[9]"
    - peripheral: i2s_audio_out
      params:
        align_right: 0
        offset_by_one_cycle: 1
      bind:
        mclk: "gpio[8]"
        bclk: "gpio[10]"
        lrclk: "gpio[14]"
        sdata: "gpio[12]"
