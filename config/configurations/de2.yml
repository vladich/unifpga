# Configuration 'de2'.
# Generated from config/setups/de2.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de2
  board: de2
  toolchain: quartus2

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: ["onboard_leds_green[0]", "onboard_leds_green[1]", "onboard_leds_green[2]", "onboard_leds_green[3]", "onboard_leds_green[4]", "onboard_leds_green[5]", "onboard_leds_green[6]", "onboard_leds_green[7]"]
    - peripheral: led_bank
      params:
        width: 18
      bind:
        led: onboard_leds
    - peripheral: sw_bank
      params:
        width: 18
      bind:
        sw: onboard_switches
    - peripheral: seven_segment_per_digit
      params:
        digits: 8
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5, onboard_7seg.hex6, onboard_7seg.hex7]
    - peripheral: vga_4bit
      params:
        bits_r: 10
        bits_g: 10
        bits_b: 10
        pin_bits_r: 10
        pin_bits_g: 10
        pin_bits_b: 10
        color_depth: 444
        gate: false
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
        clk: onboard_vga.clk
        blank_n: onboard_vga.blank
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_1[4]"
        ws: "gpio_1[2]"
        sd: "gpio_1[5]"
        lr: "gpio_1[0]"
    - peripheral: wm8731_i2s_out
      bind:
        xck: onboard_audio_codec.xck
        bclk: onboard_audio_codec.bclk
        dac_lrck: onboard_audio_codec.dac_lrck
        dac_dat: onboard_audio_codec.dac_dat
        i2c_sclk: onboard_i2c.sclk
        i2c_sdat: onboard_i2c.sdat
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_1
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_0
    - peripheral: hd44780_lcd
      bind:
        rs: onboard_lcd.LCD_RS
        e: onboard_lcd.LCD_EN
        d: ["onboard_lcd.LCD_DATA[4]", "onboard_lcd.LCD_DATA[5]", "onboard_lcd.LCD_DATA[6]", "onboard_lcd.LCD_DATA[7]"]
        rw: onboard_lcd.LCD_RW
    - peripheral: ps2_keyboard
      bind:
        clk: onboard_ps2.PS2_CLK
        data: onboard_ps2.PS2_DAT

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_vga.sync: 0
    "gpio_1[1]": 0
    "gpio_1[3]": 1
    "onboard_leds_green[8]": 0
