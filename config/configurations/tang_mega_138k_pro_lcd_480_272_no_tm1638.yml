# Configuration for variant 'tang_mega_138k_pro_lcd_480_272_no_tm1638'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_mega_138k_pro_lcd_480_272_no_tm1638/board_specific.cst

Configuration:
  id: tang_mega_138k_pro_lcd_480_272_no_tm1638
  board: tang_mega_138k_pro
  toolchain: gowin_standard

  # BGM's two Tang Mega 138K Pro variants disagree on PMOD_0[1]: the tm1638
  # variant's board_specific.cst says N26 (used by the board pinmap), this
  # variant's says L22. Kept per variant so each matches its BGM oracle;
  # the discrepancy should be reported upstream (PLAN.md).
  pin_overrides:
    pmod_0: [N18, L22, R16, R17, M26, N17, L24, T24]

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        active: low
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: pmod_12pin
      bind:
        io: pmod_0
    - peripheral: pmod_12pin
      bind:
        io: pmod_1
    - peripheral: pmod_12pin
      bind:
        io: pmod_2

  # External peripherals inferred from the variant directory name.
    - peripheral: lcd_480_272
      params:   # 6-6-6 bus, BGM w_red/w_green/w_blue = 6
        clock_pixel_mhz: 8
        bits_r: 6
        bits_g: 6
        bits_b: 6
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        de: onboard_lcd.de
        ck: onboard_lcd.ck
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_mega_138k_pro_lcd_480_272_no_tm1638/board_specific_top.sv
      bind:
        lr: "pmod_0[0]"
        ws: "pmod_0[1]"
        sck: "pmod_0[2]"
        sd: "pmod_0[6]"
    - peripheral: i2s_audio_out   # from BGM tang_mega_138k_pro_lcd_480_272_no_tm1638/board_specific_top.sv
      bind:
        mclk: "pmod_1[4]"
        bclk: "pmod_1[5]"
        sdata: "pmod_1[6]"
        lrclk: "pmod_1[7]"

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    "pmod_0[4]": 0
    "pmod_0[5]": 1
