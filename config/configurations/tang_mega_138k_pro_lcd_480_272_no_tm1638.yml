# Configuration 'tang_mega_138k_pro_lcd_480_272_no_tm1638'.
# Generated from config/setups/tang_mega_138k_pro_lcd_480_272_no_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_mega_138k_pro_lcd_480_272_no_tm1638
  board: tang_mega_138k_pro
  toolchain: gowin_standard

  pin_overrides:
    pmod_0: [N18, L22, R16, R17, M26, N17, L24, T24]

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        active: low
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: pmod_0
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: pmod_1
    - peripheral: gpio_header
      params:
        width: 8
      bind:
        io: pmod_2
    - peripheral: lcd_480_272
      params:
        clock_pixel_mhz: 8
        bits_r: 6
        bits_g: 6
        bits_b: 6
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        de: onboard_lcd.de
        ck: onboard_lcd.ck
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "pmod_0[2]"
        ws: "pmod_0[1]"
        sd: "pmod_0[6]"
        lr: "pmod_0[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_1[4]"
        bclk: "pmod_1[5]"
        lrclk: "pmod_1[7]"
        sdata: "pmod_1[6]"
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: i2s_audio_out
      params:
        align_right: 1
        offset_by_one_cycle: 0
      bind:
        bclk: onboard_audio_dac.bck
        lrclk: onboard_audio_dac.ws
        sdata: onboard_audio_dac.din
        pa_en: onboard_audio_dac.pa_en

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "pmod_0[4]": 0
    "pmod_0[5]": 1
