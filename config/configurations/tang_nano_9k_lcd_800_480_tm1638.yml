        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: lcd_800_480
      params:
        bl: const.0
        clock_pixel_mhz: 32.4
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
