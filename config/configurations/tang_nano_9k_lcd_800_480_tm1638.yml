        init: onboard_lcd.init
    - peripheral: tm1638_led_key   # binds from BGM tang_nano_9k_lcd_800_480_tm1638/board_specific_top.sv
      bind:
        dio: "gpio[0]"
        clk: "gpio[1]"
        stb: "gpio[2]"
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: [0, 1, 2, 3, 4, 5, 6, 7]
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
        seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_nano_9k_lcd_800_480_tm1638/board_specific_top.sv
      bind:
        lr: onboard_microsd.cs
        ws: onboard_microsd.mosi
        sck: onboard_microsd.sclk
        sd: onboard_microsd.miso
    - peripheral: i2s_audio_out   # from BGM tang_nano_9k_lcd_800_480_tm1638/board_specific_top.sv
      bind:
        bclk: "gpio[3]"
        sdata: "gpio[4]"
