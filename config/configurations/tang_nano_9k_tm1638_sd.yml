# Configuration 'tang_nano_9k_tm1638_sd'.
# Generated from config/setups/tang_nano_9k_tm1638_sd.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_nano_9k_tm1638_sd
  board: tang_nano_9k
  toolchain: gowin_eda

  # Gowin IO_TYPE this configuration states beyond the board-wide ones
  io_overrides:
    clk: LVCMOS33
    gpio: LVCMOS33
    onboard_hdmi.clk_p: LVCMOS33
    "onboard_hdmi.d_p[0]": LVCMOS33
    "onboard_hdmi.d_p[1]": LVCMOS33
    "onboard_hdmi.d_p[2]": LVCMOS33
    onboard_microsd: LVCMOS33
    onboard_uart: LVCMOS33

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: tm1638_led_key
      bind:
        stb: "gpio[2]"
        clk: "gpio[1]"
        dio: "gpio[0]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: onboard_microsd.cs
        ws: onboard_microsd.mosi
        sck: onboard_microsd.sclk
        sd: onboard_microsd.miso
    - peripheral: hdmi_tmds
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: gpio_header
      params:
        width: 6
      bind:
        io: gpio
