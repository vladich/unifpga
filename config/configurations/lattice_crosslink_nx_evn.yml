# Configuration 'lattice_crosslink_nx_evn'.
# lattice_crosslink_nx_evn — CrossLink-NX EVN (LIFCL-40-9BG400C)
# via the open-source flow: yosys synth_nexus → nextpnr-nexus → prjoxide pack.
# Generated from config/setups/lattice_crosslink_nx_evn.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: lattice_crosslink_nx_evn
  board: lattice_crosslink_nx_evn
  toolchain: nextpnr_nexus
  toolchains: [nextpnr_nexus, nextpnr_oxide]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    lattice_crosslink_nx_evn_oxide:
      toolchain: nextpnr_oxide

  manual: true

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 12
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: onboard_reset
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 8
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 14
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        rx: onboard_uart.rx
        tx: onboard_uart.tx

  # What a toolchain builds differently (config/overlay.py patches, from the setup)
  for_toolchain:
    nextpnr_oxide:
      manual: null
