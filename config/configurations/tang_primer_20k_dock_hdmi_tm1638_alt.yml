# Configuration for variant 'tang_primer_20k_dock_hdmi_tm1638_alt'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_primer_20k_dock_hdmi_tm1638_alt/board_specific.cst

Configuration:
  id: tang_primer_20k_dock_hdmi_tm1638_alt
  board: tang_primer_20k_dock
  toolchain: gowin_eda

  # Gowin IO_TYPE this BGM variant states beyond the board-wide ones (tools/sync_from_bgm.py --iotypes)
  io_overrides:
    clk: LVCMOS33
    "gpio_1[2]": LVCMOS33
    "gpio_1[3]": LVCMOS33
    "gpio_1[6]": LVCMOS33
    "gpio_1[7]": LVCMOS33
    "gpio_2[0]": LVCMOS33
    "gpio_2[4]": LVCMOS33
    onboard_hdmi.clk_p: LVDS25
    "onboard_hdmi.d_p[0]": LVDS25
    "onboard_hdmi.d_p[1]": LVDS25
    "onboard_hdmi.d_p[2]": LVDS25
    onboard_headphone: LVCMOS33
    "onboard_leds[2]": LVCMOS33
    "onboard_leds[3]": LVCMOS33
    "onboard_leds[4]": LVCMOS33
    "onboard_leds[5]": LVCMOS33
    onboard_pa_enable: LVCMOS33

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons

  # External peripherals inferred from the variant directory name.
    - peripheral: hdmi_tmds   # binds from BGM tang_primer_20k_dock_hdmi_tm1638_alt/board_specific_top.sv
      params:
        clock_serial_mhz: 249.75
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: tm1638_led_key   # binds from BGM tang_primer_20k_dock_hdmi_tm1638_alt/board_specific_top.sv
      bind:
        clk: "gpio_1[2]"
        stb: "gpio_1[3]"
        dio: "gpio_1[1]"
    - peripheral: i2s_audio_out   # from BGM tang_primer_20k_dock_hdmi_tm1638_alt/board_specific_top.sv
      params:
        align_right: 1
        offset_by_one_cycle: 0
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: i2s_audio_out   # from BGM tang_primer_20k_dock_hdmi_tm1638_alt/board_specific_top.sv
      params:
        align_right: 0
        offset_by_one_cycle: 1
      bind:
        mclk: "gpio_1[4]"
        bclk: "gpio_1[5]"
        lrclk: "gpio_1[7]"
        sdata: "gpio_1[6]"
    - peripheral: gpio_header   # from BGM tang_primer_20k_dock_hdmi_tm1638_alt/board_specific_top.sv .gpio
      params:
        width: 8
      bind:
        io: gpio_0
    - peripheral: gpio_header   # from BGM tang_primer_20k_dock_hdmi_tm1638_alt/board_specific_top.sv .gpio
      params:
        width: 8
      bind:
        io: gpio_1
    - peripheral: gpio_header   # from BGM tang_primer_20k_dock_hdmi_tm1638_alt/board_specific_top.sv .gpio
      params:
        width: 8
      bind:
        io: gpio_2
    - peripheral: gpio_header   # from BGM tang_primer_20k_dock_hdmi_tm1638_alt/board_specific_top.sv .gpio
      params:
        width: 8
      bind:
        io: gpio_3

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    onboard_lcd.bl: 0
