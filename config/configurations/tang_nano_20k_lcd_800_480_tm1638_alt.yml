# Configuration for variant 'tang_nano_20k_lcd_800_480_tm1638_alt'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_nano_20k_lcd_800_480_tm1638_alt/board_specific.cst

Configuration:
  id: tang_nano_20k_lcd_800_480_tm1638_alt
  board: tang_nano_20k
  toolchain: gowin_eda

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - tm_key: msb

  # This variant uses a different LCD adapter wiring (BGM
  # tang_nano_20k_lcd_800_480_tm1638_alt/board_specific.cst): LCD_R[2] sits on
  # pin 49, which the board's default bank uses for the backlight, and there
  # is no LCD_BL.
  pin_overrides:
    onboard_lcd.r: ["42", "41", "49", "39", "38"]
    onboard_lcd.bl: null

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: []
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        leds: [0, 1, 2, 3, 4, 5]
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: lcd_800_480
      params:
        clock_pixel_mhz: 48.9375
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
    - peripheral: tm1638_led_key   # binds from BGM tang_nano_20k_lcd_800_480_tm1638_alt/board_specific_top.sv
      bind:
        dio: "gpio[0]"
        clk: onboard_joystick.cs
        stb: onboard_joystick.miso
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: [0, 1, 2, 3, 4, 5, 6, 7]
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
        seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_nano_20k_lcd_800_480_tm1638_alt/board_specific_top.sv
      bind:
        lr: "gpio[1]"
        ws: "gpio[2]"
        sck: "gpio[3]"
        sd: "onboard_microsd.dat[1]"
    - peripheral: i2s_audio_out   # from BGM tang_nano_20k_lcd_800_480_tm1638_alt/board_specific_top.sv
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: gpio_header   # from BGM tang_nano_20k_lcd_800_480_tm1638_alt/board_specific_top.sv .gpio
      params:
        width: 5
      bind:
        io: gpio
