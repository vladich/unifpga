# Configuration 'tang_nano_20k_hdmi_tm1638'.
# Generated from config/setups/tang_nano_20k_hdmi_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_nano_20k_hdmi_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: hdmi_tmds
      params:
        clock_serial_mhz: 249.75
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
    - peripheral: tm1638_led_key
      bind:
        stb: onboard_joystick.miso
        clk: onboard_joystick.cs
        dio: "gpio[0]"
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio[3]"
        ws: "gpio[2]"
        sd: "onboard_microsd.dat[1]"
        lr: "gpio[1]"
    - peripheral: i2s_audio_out
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
