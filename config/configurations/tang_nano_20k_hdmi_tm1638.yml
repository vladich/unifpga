# Configuration for variant 'tang_nano_20k_hdmi_tm1638'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_nano_20k_hdmi_tm1638/board_specific.cst

Configuration:
  id: tang_nano_20k_hdmi_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - power_up: true
      - any_key: true

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        active: high
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: hdmi_tmds
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
    - peripheral: tm1638_led_key   # binds from BGM tang_nano_20k_hdmi_tm1638/board_specific_top.sv
      bind:
        dio: "gpio[0]"
        clk: onboard_joystick.cs
        stb: onboard_joystick.miso
    - peripheral: inmp441_i2s_mic   # binds from BGM tang_nano_20k_hdmi_tm1638/board_specific_top.sv
      bind:
        lr: "gpio[1]"
        ws: "gpio[2]"
        sck: "gpio[3]"
        sd: "onboard_microsd.dat[1]"
