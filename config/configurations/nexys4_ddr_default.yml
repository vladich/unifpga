# Default Nexys 4 DDR configuration: every on-board peripheral attached, no
# Pmod add-ons. Self-contained — every binding is listed explicitly.

Configuration:
  id: nexys4_ddr_default
  description: Nexys 4 DDR with all on-board peripherals (no Pmod add-ons)
  board: nexys4_ddr
  toolchain: vivado

  attach:
    # ---- Clock & reset ----
    - peripheral: clock_input
      params: { frequency_mhz: 100 }
      bind: { clk: clk100mhz }

    - peripheral: reset_button
      bind: { rst: cpu_resetn }

    # ---- User I/O ----
    - peripheral: sw_bank
      params: { width: 16 }
      bind: { sw: onboard_switches }

    - peripheral: led_bank
      params: { width: 16 }
      bind: { led: onboard_leds }

    - peripheral: button_array
      params: { width: 5 }
      bind: { btn: onboard_buttons }

    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_16.r
        g: onboard_rgb_led_16.g
        b: onboard_rgb_led_16.b

    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_17.r
        g: onboard_rgb_led_17.g
        b: onboard_rgb_led_17.b

    - peripheral: seven_segment_8digit_shared
      params:
        digits: 8
      bind:
        segments: [onboard_7seg.ca, onboard_7seg.cb, onboard_7seg.cc, onboard_7seg.cd, onboard_7seg.ce, onboard_7seg.cf, onboard_7seg.cg]
        dp: onboard_7seg.dp
        digits: onboard_7seg.anodes

    # ---- Display ----
    - peripheral: vga_4bit
      bind:
        r:  onboard_vga.r
        g:  onboard_vga.g
        b:  onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

    # ---- Audio ----
    - peripheral: pdm_mic
      bind:
        clk:   onboard_mic.clk
        data:  onboard_mic.data
        lrsel: onboard_mic.lrsel

    - peripheral: pwm_amp
      bind:
        pwm: onboard_pwm_amp.pwm
        sd:  onboard_pwm_amp.sd

    # ---- Communications ----
    - peripheral: uart_4wire
      bind:
        tx:  onboard_uart.tx
        rx:  onboard_uart.rx
        cts: onboard_uart.cts
        rts: onboard_uart.rts

    - peripheral: usb_hid_host
      bind:
        clk:  onboard_usb_hid.clk
        data: onboard_usb_hid.data

    - peripheral: ethernet_rmii_phy
      bind:
        mdc:    onboard_ethernet_phy.mdc
        mdio:   onboard_ethernet_phy.mdio
        rstn:   onboard_ethernet_phy.rstn
        crsdv:  onboard_ethernet_phy.crsdv
        rxerr:  onboard_ethernet_phy.rxerr
        rxd:    [onboard_ethernet_phy.rxd0, onboard_ethernet_phy.rxd1]
        txen:   onboard_ethernet_phy.txen
        txd:    [onboard_ethernet_phy.txd0, onboard_ethernet_phy.txd1]
        refclk: onboard_ethernet_phy.refclk
        intn:   onboard_ethernet_phy.intn

    # ---- Storage ----
    - peripheral: microsd_4bit
      bind:
        reset: onboard_microsd.reset
        cd:    onboard_microsd.cd
        sck:   onboard_microsd.sck
        cmd:   onboard_microsd.cmd
        dat:   [onboard_microsd.dat0, onboard_microsd.dat1, onboard_microsd.dat2, onboard_microsd.dat3]

    - peripheral: qspi_flash
      bind:
        dq:  [onboard_qspi_flash.dq0, onboard_qspi_flash.dq1, onboard_qspi_flash.dq2, onboard_qspi_flash.dq3]
        csn: onboard_qspi_flash.csn

    # ---- Sensors ----
    - peripheral: spi_accelerometer
      bind:
        miso: onboard_accelerometer.miso
        mosi: onboard_accelerometer.mosi
        sclk: onboard_accelerometer.sclk
        csn:  onboard_accelerometer.csn
        int1: onboard_accelerometer.int1
        int2: onboard_accelerometer.int2

    - peripheral: i2c_temperature_sensor
      bind:
        scl: onboard_temp_sensor.scl
        sda: onboard_temp_sensor.sda
        int: onboard_temp_sensor.int
        ct:  onboard_temp_sensor.ct

    # ---- Pluggable headers (exposed but unbound) ----
    - peripheral: pmod_12pin
      bind: { io: pmod_ja }
    - peripheral: pmod_12pin
      bind: { io: pmod_jb }
    - peripheral: pmod_12pin
      bind: { io: pmod_jc }
    - peripheral: pmod_12pin
      bind: { io: pmod_jd }

    - peripheral: pmod_diff
      bind:
        p: pmod_xadc.p
        n: pmod_xadc.n
