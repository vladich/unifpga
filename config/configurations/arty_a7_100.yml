# Configuration 'arty_a7_100'.

Configuration:
  id: arty_a7_100
  board: arty_a7
  toolchain: vivado
  part: 100t   # which of the board's chips this configuration targets

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 100
      bind:
        clk: clk100mhz
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_1.r
        g: onboard_rgb_led_1.g
        b: onboard_rgb_led_1.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_2.r
        g: onboard_rgb_led_2.g
        b: onboard_rgb_led_2.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_3.r
        g: onboard_rgb_led_3.g
        b: onboard_rgb_led_3.b
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: reset_button
      bind:
        rst: cpu_resetn

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key
      bind:
        clk: "arduino_io[28]"
        stb: "arduino_io[29]"
        dio: "arduino_io[27]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "pmod_jd[5]"
        ws: "pmod_jd[4]"
        sck: "pmod_jd[7]"
        sd: "pmod_jd[6]"
    - peripheral: gpio_header
      params:
        width: 30
      bind:
        io: arduino_io
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        gate: false
      bind:
        r: ["pmod_jb[4]", "pmod_jb[5]", "pmod_jb[6]", "pmod_jb[7]"]
        g: ["pmod_jc[4]", "pmod_jc[5]", "pmod_jc[6]", "pmod_jc[7]"]
        b: ["pmod_jb[0]", "pmod_jb[1]", "pmod_jb[2]", "pmod_jb[3]"]
        hs: "pmod_jc[0]"
        vs: "pmod_jc[1]"
