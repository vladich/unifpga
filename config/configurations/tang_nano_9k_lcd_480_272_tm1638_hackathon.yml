# Configuration 'tang_nano_9k_lcd_480_272_tm1638_hackathon'.

Configuration:
  id: tang_nano_9k_lcd_480_272_tm1638_hackathon
  board: tang_nano_9k
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds

  # External peripherals inferred from the variant directory name.
    - peripheral: lcd_480_272
      params:
        clock_pixel_pll: {idiv: 2, fbdiv: 0, odiv: 48, sdiv: 2, clkoutd: false}
        bl: const.0
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
        bl: onboard_lcd.bl
        init: onboard_lcd.init
    - peripheral: tm1638_led_key
      bind:
        dio: "gpio[0]"
        clk: "gpio[1]"
        stb: "gpio[2]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: onboard_microsd.cs
        ws: onboard_microsd.mosi
        sck: onboard_microsd.sclk
        sd: onboard_microsd.miso
    - peripheral: i2s_audio_out
      bind:
        bclk: "gpio[3]"
        sdata: "gpio[4]"
        lrclk: "gpio[5]"
