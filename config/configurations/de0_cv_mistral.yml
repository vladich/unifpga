# de0_cv_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow).
# Mirrors de0_cv — only the toolchain differs.


Configuration:
  id: de0_cv_mistral
  board: de0_cv
  toolchain: nextpnr_mistral

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 6
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5]
    - peripheral: vga_4bit
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
