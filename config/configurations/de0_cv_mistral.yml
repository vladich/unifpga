# de0_cv_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow).
# Mirrors de0_cv — only the toolchain differs.


Configuration:
  id: de0_cv_mistral
  board: de0_cv
  toolchain: nextpnr_mistral

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 6
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5]
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM de0_cv/board_specific_top.sv
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
    - peripheral: i2s_audio_out   # from BGM de0_cv/board_specific_top.sv
      bind:
        mclk: "gpio_0[33]"
        bclk: "gpio_0[31]"
        lrclk: "gpio_0[27]"
        sdata: "gpio_0[29]"
    - peripheral: gpio_header   # from BGM de0_cv/board_specific_top.sv .gpio
      params:
        width: 36
      bind:
        io: gpio_1
    - peripheral: gpio_header   # from BGM de0_cv/board_specific_top.sv .gpio
      params:
        width: 36
      bind:
        io: gpio_0

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    "gpio_0[1]": 0
    "gpio_0[3]": 1
