# Configuration 'de0_cv'.
# Generated from config/setups/de0_cv.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de0_cv
  board: de0_cv
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 6
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5]
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio_0[33]"
        bclk: "gpio_0[31]"
        lrclk: "gpio_0[27]"
        sdata: "gpio_0[29]"
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_1
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_0
    - peripheral: uart_2wire
      bind:
        tx: "gpio_1[35]"
        rx: "gpio_1[34]"

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio_0[1]": 0
    "gpio_0[3]": 1
