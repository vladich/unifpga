# Configuration 'tang_nano_9k_hdmi_no_ip_tm1638'.
# Generated from config/setups/tang_nano_9k_hdmi_no_ip_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_nano_9k_hdmi_no_ip_tm1638
  board: tang_nano_9k
  toolchain: gowin_eda

  # Gowin IO_TYPE this configuration states beyond the board-wide ones
  io_overrides:
    clk: LVCMOS33
    "onboard_lcd.g[0]": LVCMOS33
    "onboard_lcd.g[1]": LVCMOS33
    "onboard_lcd.g[2]": LVCMOS33
    "onboard_lcd.r[0]": LVCMOS33
    "onboard_lcd.r[1]": LVCMOS33
    "onboard_lcd.r[2]": LVCMOS33
    "onboard_lcd.r[3]": LVCMOS33
    "onboard_lcd.r[4]": LVCMOS33

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: hdmi_tmds
      bind:
        clk_p: onboard_hdmi.clk_p
        clk_n: onboard_hdmi.clk_n
        d_p: onboard_hdmi.d_p
        d_n: onboard_hdmi.d_n
    - peripheral: tm1638_led_key
      bind:
        dio: "gpio[0]"
        clk: "gpio[1]"
        stb: "gpio[2]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: onboard_microsd.cs
        ws: onboard_microsd.mosi
        sck: onboard_microsd.sclk
        sd: onboard_microsd.miso
    - peripheral: i2s_audio_out
      bind:
        bclk: onboard_lcd.vs
        lrclk: onboard_lcd.hs
        sdata: onboard_lcd.ck
    - peripheral: gpio_header
      params:
        width: 6
      bind:
        io: gpio

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_lcd.de: 0
