# Configuration 'dk_dev_3c120n'.

Configuration:
  id: dk_dev_3c120n
  board: dk_dev_3c120n
  toolchain: quartus2

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: led_bank
      params:
        width: 8
        active: low
      bind:
        led: onboard_leds
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 4
        active: low
        digits_active: high
      bind:
        segments: ["onboard_7seg.ca", "onboard_7seg.cb", "onboard_7seg.cc", "onboard_7seg.cd", "onboard_7seg.ce", "onboard_7seg.cf", "onboard_7seg.cg"]
        dp: "onboard_7seg.dp"
        digits: ["onboard_7seg.anodes[3]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[0]"]
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 8
      bind:
        sw: onboard_switches

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_7seg.minus: 0
    onboard_speaker: 0
