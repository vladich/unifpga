# Configuration 'basys3'.
# Generated from config/setups/basys3.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: basys3
  board: basys3
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    basys3_openxc7:
      toolchain: nextpnr_openxc7

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: sw_bank
      params:
        width: 16
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 16
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 4
        active: low
        digits_active: low
      bind:
        segments: ["onboard_7seg.segments[0]", "onboard_7seg.segments[1]", "onboard_7seg.segments[2]", "onboard_7seg.segments[3]", "onboard_7seg.segments[4]", "onboard_7seg.segments[5]", "onboard_7seg.segments[6]"]
        dp: onboard_7seg.dp
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]"]
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "pmod_ja[6]"
        ws: "pmod_ja[5]"
        sck: "pmod_ja[4]"
        sd: "pmod_ja[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_jc[4]"
        bclk: "pmod_jc[5]"
        sdata: "pmod_jc[6]"
        lrclk: "pmod_jc[7]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "pmod_jb[6]"
        bclk: "pmod_jb[3]"
        sdata: "pmod_jb[1]"
        lrclk: "pmod_jb[0]"

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "pmod_ja[2]": 0
    "pmod_ja[1]": 1
