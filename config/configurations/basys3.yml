# Configuration for variant 'basys3'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/basys3/board_specific.xdc

Configuration:
  id: basys3
  board: basys3
  toolchain: vivado

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - switch_msb: true

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: sw_bank
      params:
        width: 16
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 16
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 4
      bind:
        segments: onboard_7seg.segments
        dp: onboard_7seg.dp
        digits: onboard_7seg.anodes
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons
    - peripheral: pmod_12pin
      bind:
        io: pmod_ja
    - peripheral: pmod_12pin
      bind:
        io: pmod_jb
    - peripheral: pmod_12pin
      bind:
        io: pmod_jc
    - peripheral: vga_4bit
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "pmod_ja[6]"
        ws: "pmod_ja[5]"
        sck: "pmod_ja[3]"
        sd: "pmod_ja[0]"
