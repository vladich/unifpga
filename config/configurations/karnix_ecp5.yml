# Configuration 'karnix_ecp5'.
# Generated from config/setups/karnix_ecp5.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: karnix_ecp5
  board: karnix_ecp5
  toolchain: nextpnr_trellis

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    karnix_ecp5_yosys: {}

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
        gate: false
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: sw_bank
      params:
        width: 2
      bind:
        sw: onboard_switches
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio[5]"
        ws: "gpio[4]"
        sd: "gpio[6]"
        lr: "gpio[3]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio[7]"
        bclk: "gpio[8]"
        lrclk: "gpio[10]"
        sdata: "gpio[9]"
