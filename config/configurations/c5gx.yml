# Configuration 'c5gx'.
# Generated from config/setups/c5gx.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: c5gx
  board: c5gx
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    c5gx_mistral:
      toolchain: nextpnr_mistral

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: uart_2wire
      bind:
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds_green
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 4
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3]
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio[4]"
        ws: "gpio[2]"
        sd: "gpio[5]"
        lr: "gpio[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: onboard_audio_codec.xck
        bclk: onboard_audio_codec.bclk
        lrclk: onboard_audio_codec.dac_lrck
        sdata: onboard_audio_codec.dac_dat
    - peripheral: hdmi_adv7513
      params:
        bits_r: 8
        bits_g: 8
        bits_b: 8
        config_table: c5gx
      bind:
        clk: onboard_hdmi_tx.clk
        de: onboard_hdmi_tx.de
        hs: onboard_hdmi_tx.hs
        vs: onboard_hdmi_tx.vs
        d: onboard_hdmi_tx.d
        i2c_scl: onboard_i2c.scl
        i2c_sda: onboard_i2c.sda
        int: onboard_hdmi_tx.int
    - peripheral: gpio_header
      params:
        width: 22
      bind:
        io: gpio
    - peripheral: ltc2308
      bind:
        convst: onboard_adc.ADC_CONVST
        sck: onboard_adc.ADC_SCK
        sdi: onboard_adc.ADC_SDI
        sdo: onboard_adc.ADC_SDO
    - peripheral: async_sram
      params:
        addr_bits: 18
      bind:
        a: onboard_sram.SRAM_A
        d: onboard_sram.SRAM_D
        ce_n: onboard_sram.SRAM_CE_n
        oe_n: onboard_sram.SRAM_OE_n
        we_n: onboard_sram.SRAM_WE_n
        lb_n: onboard_sram.SRAM_LB_n
        ub_n: onboard_sram.SRAM_UB_n
    - peripheral: sdcard_spi
      bind:
        clk: onboard_sdcard.SD_CLK
        cmd: onboard_sdcard.SD_CMD
        dat0: "onboard_sdcard.SD_DAT[0]"
        dat3: "onboard_sdcard.SD_DAT[3]"

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
