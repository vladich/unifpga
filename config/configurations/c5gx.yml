# Configuration for variant 'c5gx'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/c5gx/board_specific.qsf

Configuration:
  id: c5gx
  board: c5gx
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: uart_2wire
      bind:
        rx: onboard_uart.rx
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: led_bank   # from BGM c5gx/board_specific_top.sv
      params:
        width: 8
      bind:
        led: onboard_leds_green
    - peripheral: led_bank   # from BGM c5gx/board_specific_top.sv
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 4
        segs: 7
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3]

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM c5gx/board_specific_top.sv
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
    - peripheral: i2s_audio_out   # from BGM c5gx/board_specific_top.sv
      bind:
        mclk: onboard_audio_codec.xck
        bclk: onboard_audio_codec.bclk
        lrclk: onboard_audio_codec.dac_lrck
        sdata: onboard_audio_codec.dac_dat
    - peripheral: hdmi_adv7513   # from BGM c5gx/board_specific_top.sv
      params:
        bits_r: 8
        bits_g: 8
        bits_b: 8
        config_table: c5gx
      bind:
        clk: onboard_hdmi_tx.clk
        de: onboard_hdmi_tx.de
        hs: onboard_hdmi_tx.hs
        vs: onboard_hdmi_tx.vs
        d: onboard_hdmi_tx.d
        i2c_scl: onboard_i2c.scl
        i2c_sda: onboard_i2c.sda
        int: onboard_hdmi_tx.int
    - peripheral: gpio_header   # from BGM c5gx/board_specific_top.sv .gpio
      params:
        width: 22
      bind:
        io: gpio

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
