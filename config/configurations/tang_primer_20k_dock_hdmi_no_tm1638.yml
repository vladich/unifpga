# Configuration 'tang_primer_20k_dock_hdmi_no_tm1638'.
# Generated from config/setups/tang_primer_20k_dock_hdmi_no_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_primer_20k_dock_hdmi_no_tm1638
  board: tang_primer_20k_dock
  toolchain: gowin_eda
  toolchains: [gowin_eda, nextpnr_apicula]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    tang_primer_20k_dock_hdmi_no_tm1638_yosys:
      toolchain: nextpnr_apicula

  # Gowin IO_TYPE this configuration states beyond the board-wide ones
  io_overrides:
    clk: LVCMOS33
    "gpio_1[2]": LVCMOS33
    "gpio_1[3]": LVCMOS33
    "gpio_1[6]": LVCMOS33
    "gpio_1[7]": LVCMOS33
    "gpio_2[0]": LVCMOS33
    "gpio_2[4]": LVCMOS33
    onboard_headphone: LVCMOS33
    "onboard_leds[2]": LVCMOS33
    "onboard_leds[3]": LVCMOS33
    "onboard_leds[4]": LVCMOS33
    "onboard_leds[5]": LVCMOS33
    onboard_pa_enable: LVCMOS33

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        active: low
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: button_array
      params:
        width: 5
      bind:
        btn: onboard_buttons
    - peripheral: hdmi_tmds
      bind:
        clk_p: onboard_hdmi.clk_p
        d_p: onboard_hdmi.d_p
        clk_n: onboard_hdmi.clk_n
        d_n: onboard_hdmi.d_n
      for_toolchain:
        nextpnr_apicula:
          "(replace)":
            peripheral: hdmi_tmds
            params: {timing: dvi}
            bind: {clk_p: onboard_hdmi.clk_p, d_p: onboard_hdmi.d_p, clk_n: onboard_hdmi.clk_n, d_n: onboard_hdmi.d_n}
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_0[1]"
        ws: "gpio_0[3]"
        sd: "gpio_0[0]"
        lr: "gpio_0[2]"
    - peripheral: i2s_audio_out
      params:
        align_right: 1
        offset_by_one_cycle: 0
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: i2s_audio_out
      params:
        align_right: 0
        offset_by_one_cycle: 1
      bind:
        mclk: "gpio_1[4]"
        bclk: "gpio_1[5]"
        lrclk: "gpio_1[7]"
        sdata: "gpio_1[6]"

  # What a toolchain builds differently (config/overlay.py patches, from the setup)
  for_toolchain:
    nextpnr_apicula:
      io_overrides:
        clk: null
