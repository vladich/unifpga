# Configuration for variant 'eclypse_z7'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/eclypse_z7/board_specific.xdc

Configuration:
  id: eclypse_z7
  board: eclypse_z7
  toolchain: vivado

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - key: 0

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_0.r
        g: onboard_rgb_led_0.g
        b: onboard_rgb_led_0.b
    - peripheral: rgb_led
      bind:
        r: onboard_rgb_led_1.r
        g: onboard_rgb_led_1.g
        b: onboard_rgb_led_1.b
    - peripheral: pmod_12pin
      bind:
        io: pmod_jb

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key
      bind:
        dio: "pmod_jb[5]"
        clk: "pmod_jb[6]"
        stb: "pmod_jb[4]"
