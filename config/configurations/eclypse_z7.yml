# Configuration 'eclypse_z7'.
# Generated from config/setups/eclypse_z7.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: eclypse_z7
  board: eclypse_z7
  toolchain: vivado

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: tm1638_led_key
      bind:
        dio: "pmod_jb[5]"
        clk: "pmod_jb[6]"
        stb: "pmod_jb[7]"
    - peripheral: led_bank
      params:
        width: 1
      bind:
        led: onboard_rgb_led_1.r
    - peripheral: led_bank
      params:
        width: 1
      bind:
        led: onboard_rgb_led_1.g
    - peripheral: led_bank
      params:
        width: 1
      bind:
        led: onboard_rgb_led_1.b
    - peripheral: led_bank
      params:
        width: 1
      bind:
        led: onboard_rgb_led_0.r
    - peripheral: led_bank
      params:
        width: 1
      bind:
        led: onboard_rgb_led_0.g
    - peripheral: led_bank
      params:
        width: 1
      bind:
        led: onboard_rgb_led_0.b
