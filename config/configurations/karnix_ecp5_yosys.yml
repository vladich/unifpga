# Configuration for variant 'karnix_ecp5_yosys'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/karnix_ecp5_yosys/board_specific.lpf

Configuration:
  id: karnix_ecp5_yosys
  board: karnix_ecp5
  toolchain: nextpnr_trellis

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - key: msb

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: led_bank
      params:
        width: 4
      bind:
        led: onboard_leds
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: sw_bank
      params:
        width: 2
      bind:
        sw: onboard_switches
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM karnix_ecp5_yosys/board_specific_top.sv
      bind:
        lr: "gpio[3]"
        ws: "gpio[4]"
        sck: "gpio[5]"
        sd: "gpio[6]"
    - peripheral: i2s_audio_out   # from BGM karnix_ecp5_yosys/board_specific_top.sv
      bind:
        mclk: "gpio[7]"
        bclk: "gpio[8]"
        sdata: "gpio[9]"
        lrclk: "gpio[10]"
