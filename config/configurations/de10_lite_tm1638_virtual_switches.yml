# Configuration for variant 'de10_lite_tm1638_virtual_switches'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/de10_lite_tm1638_virtual_switches/board_specific.qsf

Configuration:
  id: de10_lite_tm1638_virtual_switches
  board: de10_lite
  toolchain: quartus_prime_lite

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - switch_msb: true

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 6
        segs: 8
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5]
    - peripheral: vga_4bit
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
