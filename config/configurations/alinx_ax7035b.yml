# Configuration 'alinx_ax7035b'.
# Generated from config/setups/alinx_ax7035b.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: alinx_ax7035b
  board: alinx_ax7035b
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    alinx_ax7035b_openxc7:
      toolchain: nextpnr_openxc7

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: reset_button
      bind:
        rst: cpu_resetn
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
        active: low
      bind:
        led: onboard_leds
    - peripheral: seven_segment_8digit_shared
      params:
        digits: 6
        active: low
        digits_active: low
      bind:
        segments: ["onboard_7seg.segments[0]", "onboard_7seg.segments[1]", "onboard_7seg.segments[2]", "onboard_7seg.segments[3]", "onboard_7seg.segments[4]", "onboard_7seg.segments[5]", "onboard_7seg.segments[6]"]
        dp: "onboard_7seg.segments[7]"
        digits: ["onboard_7seg.anodes[0]", "onboard_7seg.anodes[1]", "onboard_7seg.anodes[2]", "onboard_7seg.anodes[3]", "onboard_7seg.anodes[4]", "onboard_7seg.anodes[5]"]
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: i2c_temperature_sensor
      bind:
        scl: onboard_temp_sensor.scl
        sda: onboard_temp_sensor.sda
    - peripheral: sdcard_spi
      bind:
        clk: onboard_sdcard.clk
        cmd: onboard_sdcard.cmd
        dat0: "onboard_sdcard.data[0]"
        dat3: "onboard_sdcard.data[3]"
