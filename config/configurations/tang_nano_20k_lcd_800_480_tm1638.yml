# Configuration 'tang_nano_20k_lcd_800_480_tm1638'.

Configuration:
  id: tang_nano_20k_lcd_800_480_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        active: high
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: lcd_800_480
      params:
        clock_pixel_pll: {idiv: 8, fbdiv: 10, odiv: 16, sdiv: 2, clkoutd: false}
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
        bl: onboard_lcd.bl
    - peripheral: tm1638_led_key
      bind:
        dio: "gpio[0]"
        clk: onboard_joystick.cs
        stb: onboard_joystick.miso
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[1]"
        ws: "gpio[2]"
        sck: "gpio[3]"
        sd: "onboard_microsd.dat[1]"
    - peripheral: i2s_audio_out
      bind:
        bclk: onboard_headphone.bck
        lrclk: onboard_headphone.ws
        sdata: onboard_headphone.din
        pa_en: onboard_pa_enable
    - peripheral: gpio_header
      params:
        width: 5
      bind:
        io: gpio
