# de10_nano_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow).
# Mirrors de10_nano — only the toolchain differs.

Configuration:
  id: de10_nano_mistral
  board: de10_nano
  toolchain: nextpnr_mistral

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: fpga_clk1_50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM de10_nano/board_specific_top.sv
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
    - peripheral: tm1638_led_key   # binds from BGM de10_nano/board_specific_top.sv
      bind:
        stb: "gpio_0[27]"
        clk: "gpio_0[29]"
        dio: "gpio_0[31]"
    - peripheral: i2s_audio_out   # from BGM de10_nano/board_specific_top.sv
      bind:
        mclk: "gpio_0[17]"
        bclk: "gpio_0[15]"
        lrclk: "gpio_0[11]"
        sdata: "gpio_0[13]"
    - peripheral: hdmi_adv7513   # from BGM de10_nano/board_specific_top.sv
      bind:
        clk: onboard_hdmi_tx.clk
        de: onboard_hdmi_tx.de
        hs: onboard_hdmi_tx.hs
        vs: onboard_hdmi_tx.vs
        d: onboard_hdmi_tx.d
        i2c_scl: onboard_hdmi_tx.i2c_scl
        i2c_sda: onboard_hdmi_tx.i2c_sda
        int: onboard_hdmi_tx.int
    - peripheral: gpio_header   # from BGM de10_nano/board_specific_top.sv .gpio
      params:
        width: 36
      bind:
        io: gpio_0

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    onboard_hdmi_tx.i2s: 0
    onboard_hdmi_tx.lrclk: 0
    onboard_hdmi_tx.mclk: 0
    onboard_hdmi_tx.sclk: 0
    "gpio_0[1]": 0
    "gpio_0[3]": 1
