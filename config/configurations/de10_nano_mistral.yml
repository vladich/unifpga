# Configuration 'de10_nano_mistral'.
# de10_nano_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow).
# Mirrors de10_nano — only the toolchain differs.
# Generated from config/setups/de10_nano_mistral.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de10_nano_mistral
  board: de10_nano
  toolchain: nextpnr_mistral

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: fpga_clk1_50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio_0[4]"
        ws: "gpio_0[2]"
        sd: "gpio_0[5]"
        lr: "gpio_0[0]"
    - peripheral: tm1638_led_key
      bind:
        stb: "gpio_0[27]"
        clk: "gpio_0[29]"
        dio: "gpio_0[31]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio_0[17]"
        bclk: "gpio_0[15]"
        lrclk: "gpio_0[11]"
        sdata: "gpio_0[13]"
    - peripheral: hdmi_adv7513
      params:
        bits_r: 8
        bits_g: 8
        bits_b: 8
      bind:
        clk: onboard_hdmi_tx.clk
        de: onboard_hdmi_tx.de
        hs: onboard_hdmi_tx.hs
        vs: onboard_hdmi_tx.vs
        d: onboard_hdmi_tx.d
        i2c_scl: onboard_hdmi_tx.i2c_scl
        i2c_sda: onboard_hdmi_tx.i2c_sda
        int: onboard_hdmi_tx.int
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio_0

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    onboard_hdmi_tx.i2s: 0
    onboard_hdmi_tx.lrclk: 0
    onboard_hdmi_tx.mclk: 0
    onboard_hdmi_tx.sclk: 0
    "gpio_0[1]": 0
    "gpio_0[3]": 1
