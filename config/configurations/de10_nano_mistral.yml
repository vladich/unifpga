# de10_nano_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow).
# Mirrors de10_nano — only the toolchain differs.


Configuration:
  id: de10_nano_mistral
  board: de10_nano
  toolchain: nextpnr_mistral

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - switch_msb: true

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: fpga_clk1_50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 4
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 8
      bind:
        led: onboard_leds

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio_0[0]"
        ws: "gpio_0[2]"
        sck: "gpio_0[4]"
        sd: "gpio_0[5]"
