# Configuration 'tang_nano_9k_lcd_800_480_no_tm1638'.
# Generated from config/setups/tang_nano_9k_lcd_800_480_no_tm1638.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: tang_nano_9k_lcd_800_480_no_tm1638
  board: tang_nano_9k
  toolchain: gowin_eda
  toolchains: [gowin_eda, nextpnr_apicula]   # every toolchain it is checked with, the default first

  # The ids of the per-toolchain / per-chip copies this rig replaced (still accepted)
  aliases:
    tang_nano_9k_lcd_800_480_no_tm1638_yosys:
      toolchain: nextpnr_apicula

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx
    - peripheral: lcd_800_480
      params:
        clock_pixel_pll: {idiv: 4, fbdiv: 23, odiv: 4, sdiv: 4, clkoutd: true}
        bl: const.0
        clock_pixel_mhz: 32.4
      bind:
        r: onboard_lcd.r
        g: onboard_lcd.g
        b: onboard_lcd.b
        hs: onboard_lcd.hs
        vs: onboard_lcd.vs
        de: onboard_lcd.de
        ck: onboard_lcd.ck
        bl: onboard_lcd.bl
        init: onboard_lcd.init
    - peripheral: inmp441_i2s_mic
      bind:
        lr: onboard_microsd.cs
        ws: onboard_microsd.mosi
        sck: onboard_microsd.sclk
        sd: onboard_microsd.miso
    - peripheral: i2s_audio_out
      bind:
        bclk: "gpio[3]"
        sdata: "gpio[4]"
        lrclk: "gpio[5]"
    - peripheral: gpio_header
      params:
        width: 1
      bind:
        io: onboard_small_lcd.data
    - peripheral: gpio_header
      params:
        width: 1
      bind:
        io: onboard_small_lcd.clk
    - peripheral: gpio_header
      params:
        width: 1
      bind:
        io: onboard_small_lcd.cs
    - peripheral: gpio_header
      params:
        width: 1
      bind:
        io: onboard_small_lcd.rs
