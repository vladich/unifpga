# Configuration 'fireant'.
# Hand-curated (Efinity XML constraints).

Configuration:
  id: fireant
  board: fireant
  toolchain: efinity
  manual: true   # pinout from the Efinix Xyloni/Fireant schematic

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 4
        active: low
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        rx: onboard_uart.rx
        tx: onboard_uart.tx
