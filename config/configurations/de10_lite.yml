# Configuration for variant 'de10_lite'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/de10_lite/board_specific.qsf

Configuration:
  id: de10_lite
  board: de10_lite
  toolchain: quartus_prime_lite

  # Reset policy derived from BGM's board_specific_top.sv (tools/sync_from_bgm.py --reset)
  reset:
    sources:
      - switch_msb: true

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
      lab_bits:   # bits of the lab bus this component carries (BGM's board top; tools/sync_from_bgm.py --lab-bits)
        switches: [0, 1, 2, 3, 4, 5, 6, 7, 8, ~]
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 6
        segs: 8
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5]
    - peripheral: vga_4bit   # widths: pins from the pinmap, bits from BGM w_red/w_green/w_blue
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic   # binds from BGM de10_lite/board_specific_top.sv
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
    - peripheral: i2s_audio_out   # from BGM de10_lite/board_specific_top.sv
      bind:
        mclk: "gpio[33]"
        bclk: "gpio[31]"
        lrclk: "gpio[27]"
        sdata: "gpio[29]"
    - peripheral: gpio_header   # from BGM de10_lite/board_specific_top.sv .gpio
      params:
        width: 36
      bind:
        io: gpio
    - peripheral: gpio_header   # from BGM de10_lite/board_specific_top.sv .gpio
      params:
        width: 16
      bind:
        io: arduino_io

  # Pins BGM's top drives with a constant or the reset — `assign PIN = 1'b0` / `~ rst` (tools/sync_from_bgm.py --components)
  tie:
    arduino_reset_n: ~rst
    "gpio[1]": 0
    "gpio[3]": 1
