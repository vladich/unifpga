# Configuration 'de10_lite'.
# Generated from config/setups/de10_lite.yml (./unifpga setup generate); edit the setup.

Configuration:
  id: de10_lite
  board: de10_lite
  toolchain: quartus_prime_lite

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 10
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 10
      bind:
        led: onboard_leds
    - peripheral: seven_segment_per_digit
      params:
        digits: 6
        segs: 8
      bind:
        hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5]
    - peripheral: vga_4bit
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
        color_depth: 444
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: inmp441_i2s_mic
      bind:
        sck: "gpio[4]"
        ws: "gpio[2]"
        sd: "gpio[5]"
        lr: "gpio[0]"
    - peripheral: i2s_audio_out
      bind:
        mclk: "gpio[33]"
        bclk: "gpio[31]"
        lrclk: "gpio[27]"
        sdata: "gpio[29]"
    - peripheral: gpio_header
      params:
        width: 36
      bind:
        io: gpio
    - peripheral: gpio_header
      params:
        width: 16
      bind:
        io: arduino_io
    - peripheral: adxl345_spi
      bind:
        mosi: onboard_accelerometer.GSENSOR_SDI
        miso: onboard_accelerometer.GSENSOR_SDO
        sclk: onboard_accelerometer.GSENSOR_SCLK
        cs_n: onboard_accelerometer.GSENSOR_CS_n
    - peripheral: sdram_sdr
      params:
        row_bits: 13
        data_bits: 16
        col_bits: 10
      bind:
        clk: onboard_sdram.DRAM_CLK
        cke: onboard_sdram.DRAM_CKE
        cs_n: onboard_sdram.DRAM_CS_N
        ras_n: onboard_sdram.DRAM_RAS_N
        cas_n: onboard_sdram.DRAM_CAS_N
        we_n: onboard_sdram.DRAM_WE_N
        ba: onboard_sdram.DRAM_BA
        a: onboard_sdram.DRAM_ADDR
        dq: onboard_sdram.DRAM_DQ
        dqm: [onboard_sdram.DRAM_LDQM, onboard_sdram.DRAM_UDQM]

  # Pins held at a constant or driven from the reset — `assign PIN = 1'b0` / `~ rst`
  tie:
    "gpio[1]": 0
    "gpio[3]": 1
