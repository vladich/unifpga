---
# Registry of synthesis toolchains (schema: config/schema/toolchain.schema.json).
#
#   id:              the toolchain's id, as chip families (config/chips/) and
#                    rigs (config/setups/) name it
#   name:            display name
#   operations:      the executable driver methods; [] marks a catalogue-only
#                    toolchain. A found installation does not imply support.
#   known_versions:  versions seen in the wild; lets a chip family constrain
#                    a range like `vivado[2017.4+]` or
#                    `quartus_prime_lite[18.1-23.1std]`
#   version:         optional configured version pin. When an installation is
#                    found, its path-derived version must agree with this pin;
#                    chip version constraints are checked at build/program
#                    admission. A binary version probe is not yet available.
#   install_dir:     optional pin for where the toolchain lives locally; `~`
#                    and `$VAR` expand at read time. When the pin is empty or
#                    does not exist, tools/toolchain_detect.py finds the
#                    install: the vendor environment variable (XILINX_VIVADO,
#                    QUARTUS_ROOTDIR, GOWIN_VERSION_DIR, EFINITY_HOME,
#                    OSS_CAD_SUITE), the tool on $PATH, then the
#                    default install parents ($HOME, /opt, /tools; /Applications
#                    on macOS; /c /d /e on Windows) with the newest version.
#                    `./unifpga tools` shows the result.
#
# Editions: where a vendor ships separate binaries per edition (Quartus
# Prime Lite vs Standard vs Pro; Gowin EDA vs Gowin EDA Standard NODELOCK),
# we encode each as a distinct id. Editions that only differ by license
# (Vivado WebPACK / Design / Enterprise; Lattice Diamond Free / Subscription)
# share a single id — they all run the same on-disk binary.

Toolchains:
#
#  ----------------- Proprietary toolchains ------------------
#
  - id: vivado
    name: Vivado
    operations: [synthesize, program]
    known_versions: [2014.4, 2015.4, 2016.4, 2017.4, 2018.3, 2019.2, 2020.2, 2021.2, 2022.2, 2023.2, 2024.2]
    version: "2023.2"
    install_dir: "~/Xilinx/Vivado/2023.2/"

  - id: ise
    name: XilinxISE
    operations: [synthesize]
    known_versions: [14.7]
    version: "14.7"
    install_dir:

  - id: quartus_prime_lite
    name: "Quartus Prime Lite Edition"
    operations: [synthesize, program]
    # Free edition. Covers MAX 10, Cyclone IV / V / 10 LP, Cyclone V SoC,
    # Arria II GX, MAX V / II CPLDs. Anything beyond needs Standard or Pro.
    known_versions: ['18.1', '19.1', '20.1', '21.1', 22.1std, 23.1std, 24.1std]
    version: "23.1std"
    install_dir: "~/intelFPGA_lite/23.1std/quartus/"

  - id: quartus_prime_standard
    name: "Quartus Prime Standard Edition"
    operations: [synthesize, program]
    # Paid edition. Adds Stratix V, Arria V, Cyclone 10 GX support.
    known_versions: ['18.1', '19.1', '20.1', '21.1', '22.1', '23.1', '24.1']
    version:
    install_dir:

  - id: quartus_prime_pro
    name: "Quartus Prime Pro Edition"
    operations: [synthesize, program]
    # Required for Stratix 10, Agilex 3/5/7/9, Arria 10.
    known_versions: ['18.1', '19.3', '20.4', '21.4', '22.4', '23.4', '24.3']
    version:
    install_dir:

  - id: quartus2
    name: Quartus2
    operations: [synthesize, program]
    # Quartus II 13.0sp1 is the last version that supports Cyclone II/III
    # (used by DE0/DE1/DE2/dk_dev_3c120n/marsohod_mcy316). Cyclone IV/V/MAX 10
    # still go through quartus_prime_lite.
    known_versions: [13.0sp1, '13.1']
    version: "13.0sp1"
    install_dir: "~/altera/13.0sp1/quartus/"

  - id: libero_soc
    name: LiberoSoC
    operations: [synthesize]
    known_versions: ['2021.3', '2022.2', '2022.3', '2023.1', '2023.2', '2024.1', '2024.2']
    version: "2024.1"
    install_dir: "/usr/local/microchip/Libero_SoC_v2024.1/Libero/"

  - id: libero_ide
    name: LiberoIDE
    operations: []
    # Final Libero IDE release was v9.2 (~2014). Covers Actel-era flash:
    # ProASIC3 / IGLOO / SmartFusion / Fusion / Axcelerator.
    known_versions: ['9.1', '9.2']
    version:
    install_dir:

  - id: efinity
    name: Efinity
    operations: [synthesize, program]
    known_versions: ['2022.1', '2022.2', '2023.1', '2023.2', '2024.1', '2024.2']
    version: "2023.2"
    install_dir: "~/efinity/2023.2/"

  - id: gowin_eda
    name: GowinEDA
    operations: [synthesize, program]
    # Educational license (free). Covers GW1N* / GW2A* parts.
    known_versions: [1.9.9.03.Education, 1.9.10.02.Educational, 1.9.11.01.Educational, 1.9.11.03.Educational]
    version: "1.9.11.03.Educational"
    install_dir: "~/Gowin/1.9.11.03.Educational/"

  - id: gowin_standard
    name: GowinStandard
    operations: [synthesize, program]
    # NODELOCK Standard license required (for AroraV/GW5* parts).
    known_versions: [1.9.8.11, 1.9.9.02, 1.9.10]
    version: "1.9.9.02"
    install_dir: "~/Gowin/1.9.9.02/"

  - id: pango_ds
    name: PangoDS
    operations: []
    known_versions: ['2024.1']
    version:
    install_dir:

  - id: lattice_radiant
    name: LatticeRadiant
    operations: []
    known_versions: ['2.2', '3.0', '3.1', '3.2', '2023.1', '2023.2', '2024.1']
    version:
    install_dir:

  - id: lattice_diamond
    name: LatticeDiamond
    operations: []
    # ECP3 / ECP5, MachXO / XO2 / XO3.
    known_versions: ['3.10', '3.11', '3.12', '3.13']
    version:
    install_dir:

  - id: icecube2
    name: iCEcube2
    operations: []
    # SiliconBlue-heritage flow for original iCE40 LP/HX/LM. Last public
    # release ~2020.12; maintained but not actively developed.
    known_versions: ['2017.08', '2020.12']
    version:
    install_dir:

  - id: isplever
    name: ispLEVER
    operations: []
    # EOL FPGA flow. Covers ECP/ECP2/ECP3 (alt path), XP/XP2, MachXO,
    # ispLSI, LatticeSC/SCM, ORCA.
    known_versions: ['8.0', '8.1']
    version: "8.1"
    install_dir:

  - id: isplever_classic
    name: ispLEVER-Classic
    operations: []
    # Still-distributed CPLD-only build. ispMACH 4000 / 5000.
    known_versions: ['2.0', '2.1']
    version: "2.1"
    install_dir:

  - id: max_plus_2
    name: MAX+PLUS-II
    operations: []
    # Altera's pre-Quartus flow. Covers FLEX, APEX 20K, ACEX, MAX 7000.
    known_versions: [10.2-BL2]
    version: "10.2-BL2"
    install_dir:

  - id: actel_designer
    name: ActelDesigner
    operations: []
    # Pre-Libero Actel flow. ACT 1/2/3, eX, SX, MX, RTSX.
    known_versions: ['6.2', '7.0']
    version:
    install_dir:

  - id: ace
    name: AchronixACE
    operations: []
    known_versions: ['9.1', '10.0', '10.1', '11.0']
    version:
    install_dir:

  - id: td
    name: TangDynasty
    operations: []
    known_versions: ['4.6', '5.0', '5.6']
    version:
    install_dir:

  - id: forge_fpga
    name: ForgeFPGA
    operations: []
    known_versions: ['5.0', '6.0']
    version:
    install_dir:

  - id: nanoxmap
    name: NanoXmap
    operations: []
    known_versions: ['3.5', '4.0', '4.5']
    version:
    install_dir:

  - id: quickworks
    name: QuickWorks
    operations: []
    # Legacy QuickLogic IDE for pre-EOS-S3 parts.
    known_versions: ['10.0', '11.0', '14.4']
    version:
    install_dir:

#
