  - id: nextpnr_trellis
    name: Trellis
    operations: [synthesize, program]
    # yosys/nextpnr-ecp5: ECP5; yosys/nextpnr-machxo2: MachXO2/3L/LF.
    known_versions: [git-master]
    version:
    install_dir:

  - id: nextpnr_nexus
    name: Nexus
    operations: [synthesize, program]
    # yosys/nextpnr-nexus: Lattice CrossLink-NX, Certus-NX, CertusPro-NX,
    # MachXO5-NX (preliminary).
    known_versions: [git-master]
    version:
    install_dir:

  - id: nextpnr_oxide
    name: Oxide
    operations: [synthesize, program]
    # Historical name for the Nexus open flow — thin re-export of nextpnr_nexus.
    known_versions: [git-master]
    version:
    install_dir:

  - id: nextpnr_mistral
    name: Mistral
    operations: [synthesize, program]
    # yosys/nextpnr-mistral: Cyclone V (bitstream OK; programmer needs Quartus
    # JIC or openOCD).
    known_versions: [git-master-d6bd02c]   # last commit with both pos_t and rnode_t typedefs
    version:
    install_dir:

  - id: nextpnr_apicula
    name: Apicula
    operations: [synthesize, program]
    # yosys/nextpnr-himbaechel + Apicula: Gowin LittleBee/Arora.
    known_versions: [git-master]
    version:
    install_dir:

  - id: nextpnr_gatemate
    name: Gatemate
    operations: [synthesize, program]
    # yosys/nextpnr-himbaechel + prjpeppercorn: Cologne Chip GateMate.
    known_versions: [git-master]
    version:
    install_dir:

  - id: qorc_sdk
    name: QORC-SDK
    operations: []
    # QuickLogic open flow for EOS S3 (yosys + VPR via ql-symbiflow).
    known_versions: [git-master]
    version:
    install_dir:
