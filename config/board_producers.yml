# Registry of board producers (board makers, not chip vendors per se —
# though several entries are both, since e.g. AMD/Xilinx and Intel/Altera
# also ship their own dev kits).
#
# Each board in config/boards/<chip_producer>/<family>.yml has a
# `BoardProducer:` field that must reference an `Id:` from this registry
# (validated like Programmer → programmers.yml).
#
# Slug rules:
#   - lowercase, spaces/punct → underscore
#   - parentheses dropped (e.g. "Xilinx (AMD)" → xilinx_amd)
#   - leading-digit slugs avoided (e.g. "1BitSquared" → onebitsquared)
#   - chip-vendor producers prefer a `<vendor>_semi` or vendor-line suffix
#     to disambiguate corporate-rename history
#     (e.g. Gowin Semiconductor → gowin_semi; Intel/Altera → intel_altera)
#
# Categories vocabulary:
#   chip_vendor    — designs FPGA silicon
#   edu            — primarily educational dev boards
#   industrial     — commercial / industrial-grade dev kits, accelerators
#   hobby          — community / hobbyist boards
#   som_vendor     — primarily ships system-on-modules
#   academic       — affiliated with / spun out of a university lab
#   foss_friendly  — explicitly supports open-source toolchains
#   defunct        — no longer in business (combined with DefunctSince:)
#
# Per-entry schema:
#   Id, Name, AKA (list or null), URL, Country, FoundedYear (int or null),
#   Categories (list), Description, DefunctSince (year or null),
#   Notes (string or null)

