# The entities of the configuration: where each one's records are stored, the
# schema its files satisfy (config/schema/<entity>.schema.json) and its
# relationships to the other entities. ./unifpga check (tools/check.py) reads
# this file: every file against its schema, every `from` reference resolved to
# an id of `to`, every `rule` run. An entity with `schema: null` is one whose
# files are still being reshaped (the board catalogue); its identities and
# references are checked, its shape is not yet.
#
# Paths in `from`: dotted, `*` every item of a list or value of a mapping,
# `*keys` every key of a mapping. `format`: how a value names its target
# (plain id, versioned `<id>[<constraint>]`, record_id `x` or `{id: x}`).

Entities:

  rig:
    why: >-
      One system, config/setups/<id>.yml: a board, what is on it and how the
      design sees it. The build expands it into the rig's configuration
      (tools/setup.py generate), codegen makes the top from that, the editor
      edits it; ./unifpga setup check expands and resolves every rig.
    files: config/setups/*.yml
    root: Setup
    id: id
    file_named_after_id: true
    schema: rig.schema.json
    relations:
      - {from: board, to: board, why: "the board it is built on"}
      - {from: toolchain, to: toolchain, why: "the default build"}
      - {from: toolchains.*, to: toolchain, why: "every build the rig is checked with"}
      - {from: aliases.*.toolchain, to: toolchain, why: "an alias is a toolchain / chip choice"}
      - {from: for_toolchain.*keys, to: toolchain, why: "a per-toolchain patch"}
      - {from: use.*.for_toolchain.*keys, to: toolchain, why: "a per-toolchain patch of one use"}
      - {from: use.*.module, to: module, why: "a module plugged in or wired"}
      - {from: use.*.raw.peripheral, to: peripheral, why: "a raw attach names its driver"}
      - {from: design.width.*keys, to: capability, why: "the bus width the design declares"}
      - {from: use.*.design_bits.*keys, to: capability, why: "which design bit each pin is"}
      - {rule: rig_expands, why: "on-board parts, connectors, plugs, wires, variants and pins resolve on the board's layout and the rig expands to a configuration (tools/setup.py validate + generate)"}
      - {rule: rig_chip_variant, why: "part / parts / alias parts are chips of the board"}
      - {rule: rig_reset_sources, why: "reset sources are the reset capability's (plus power_up, pll_lock, bank, pin)"}

  peripheral:
    why: >-
      A driver contract, config/peripherals/<id>.yml: pins, parameters, the
      capabilities provided, clocks needed, RTL. Codegen instantiates it and
      aggregates its capability signals; requirements check what a rig provides.
    files: config/peripherals/*.yml
    root: Peripheral
    id: id
    file_named_after_id: true
    schema: peripheral.schema.json
    relations:
      - {from: provides.*.capability, to: capability, why: "the design-facing contract each provider fills"}
      - {rule: peripheral_refs, why: "port map, pin assigns, provides, signal widths, serves, pin_fit and models name this peripheral's signals, parameters and clocks and the provided capabilities' signals and parameters; the models' kinds are of config/kinds.yml"}
      - {rule: peripheral_driver_files, why: "the driver's RTL files exist"}

  capability:
    why: >-
      The design-facing contract, config/capabilities/<id>.yml: signals,
      aggregation, the parameters and ports on the design top. Codegen builds
      a plan per capability; rtl/peripherals/design_top_interface.sv mirrors
      the design block; the editor shows the summary.
    files: config/capabilities/*.yml
    root: Capability
    id: id
    file_named_after_id: true
    schema: capability.schema.json
    relations:
      - {from: passthrough, to: peripheral, why: "the peripheral a gpio use attaches"}
      - {from: sources.*.capability, to: capability, why: "a reset source reads another capability's signal"}
      - {rule: capability_refs, why: "ports name its signals; primary / size / depth / extent / design values name its parameters; port widths and derived operands name design parameters; a reset source names a signal of its capability"}

  module:
    why: >-
      A pluggable board, config/modules/<id>.yml: its pins by label, the
      peripheral that drives it, parameters it fixes. Setup expansion wires it
      through a connector (plug) or pin by pin (wires); the editor lists modules
      by connector type.
    files: config/modules/*.yml
    root: Module
    id: id
    file_named_after_id: true
    schema: module.schema.json
    relations:
      - {from: peripheral, to: peripheral, why: "the driver of the module"}
      - {rule: module_pins, why: "pins carry the peripheral's signals, params are its parameters, unwired notes name the module's pins"}

  connector_type:
    why: >-
      A physical connector type, config/connectors.yml: numbering, power pins,
      voltage. A board's header is of one type, a module plugs in by its numbers,
      gpio wires name its pins, the editor draws it.
    files: config/connectors.yml
    root: Connectors
    records: map
    schema: connector_type.schema.json

  family:
    why: >-
      A chip family of a producer, config/chips/<producer>/<family>.yml (the
      file named after the family's id, the directory grouping the producer's
      families as config/boards/ does): its chips, the toolchains that build
      for them, its name as the vendor's tools want it. Toolchain compatibility
      of a rig (config.init toolchain_constraints), programmer resolution,
      build targets, the vendor layer codegen emits.
    files: config/chips/*/*.yml
    root: Family
    id: id
    file_named_after_id: true
    schema: family.schema.json
    relations:
      - {from: producer, to: producer, why: "whose family"}
      - {from: default_toolchains.*, to: toolchain, format: versioned, why: "the builds every chip of the family accepts"}
      - {rule: family_directory, why: "the file sits in the directory named after its producer's id"}

  chip:
    why: >-
      One chip of a family (a record of the chips list of the family file): the
      part a board carries and a rig's `part` selects; its toolchains gate the
      builds. Its own table: chip.schema.json is applied to every record.
    files: config/chips/*/*.yml
    root: Family.chips
    records: list
    id: id
    record_schema: chip.schema.json
    relations:
      - {from: toolchains.*, to: toolchain, format: versioned, why: "a chip's own builds"}

  producer:
    why: >-
      Who makes boards, chips and modules, config/producers.yml.
      Grouping, file placement, catalogue browsing.
    files: config/producers.yml
    root: Producers
    records: list
    id: id
    schema: producer.schema.json
    relations:
      - {rule: producer_names_unique, why: "a name or an aka names one producer"}

  toolchain:
    why: >-
      A synthesis toolchain, config/toolchains.yml: its driver
      (toolchains/<id>/<id>.py), versions, install. Builds, target ids, the
      vendor layer codegen emits.
    files: config/toolchains.yml
    root: Toolchains
    records: list
    id: id
    schema: toolchain.schema.json
    relations:
      - {rule: toolchain_driver, why: "a toolchain with operations has its driver module"}

  programmer:
    why: >-
      A tool that loads a bitstream, config/programmers.yml. ./unifpga program
      picks one through the board's toolchain, chip family and bridge, or
      bootloader (config.init programmers_for_board).
    files: config/programmers.yml
    root: Programmers
    records: list
    id: id
    schema: programmer.schema.json
    relations:
      - {from: bundled, to: toolchain, why: "applies wherever the toolchain does"}
      - {from: families.*, to: family, why: "the chip families a third-party tool loads"}

  design:
    why: >-
      A design's file set, designs/<design>/fileset.yml, when it keeps
      alternative implementations side by side; the build's source set
      (tools/source_set.py) reads it.
    files: designs/*/fileset.yml
    schema: design.schema.json
    relations:
      - {rule: design_fileset, why: "the files exist, design_top.sv once among the sources, tb.sv in simulation"}

  design_top:
    why: >-
      The virtual device (config/design_top.yml): the order and headings under
      which the capabilities put their parameters and ports on design_top.
      Codegen's contract follows it; rtl/peripherals/design_top_interface.sv
      is rendered from it (./unifpga interface).
    files: config/design_top.yml
    root: DesignTop
    schema: design_top.schema.json
    relations:
      - {from: sections.*.capabilities.*, to: capability, why: "the capabilities on the device, in order"}
      - {rule: design_top_sections, why: "every capability with a design block is in exactly one section"}
      - {rule: design_top_interface, why: "rtl/peripherals/design_top_interface.sv is what the capabilities render to, and every design takes its module header from the include rendered beside it (design_top_interface.svh: the device without the optional capabilities its // requires: does not name), never from a copy"}

  entity_registry:
    why: This file.
    files: config/schema/entities.yml
    root: Entities
    records: map
    schema: entities.schema.json

  # ---- the board catalogue: reshaped next (one file per board); identities
  # ---- and references are checked already, shapes not yet

  board:
    why: >-
      One board, config/boards/<producer>/<family>/<id>.yml: identity and
      catalogue fields, chip or chip variants, programmer, bridges, features
      and devices; its banks of pins (codegen's constraints, the drafter, the
      hardware-readiness gate); and as drawn its headers and parts (setup
      expansion resolves on-board parts and connectors there; the editor draws
      it). The chip family is the file's directory (config/chips/).
    files: config/boards/*/*/*.yml
    root: Board
    id: id
    file_named_after_id: true
    schema: board.schema.json
    relations:
      - {from: chip, to: chip, why: "the part"}
      - {from: chips.*, to: chip, format: record_id, why: "the part variants"}
      - {from: producer, to: producer, why: "whose board"}
      - {from: programmer, to: programmer, why: "the default programmer"}
      - {from: extra_programmers.*, to: programmer, format: versioned, why: "programmers the board explicitly accepts"}
      - {from: features.*, to: feature, why: "catalogue browsing"}
      - {from: devices.*, to: device, why: "catalogue browsing"}
      - {rule: board_kinds, why: "every bank's device kind is one of config/kinds.yml, and the board lists a feature the kind implies"}
      - {from: banks.*.device.id, to: device, why: "the catalogued part on the bank"}
      - {rule: bank_devices, why: "a bank's catalogued device has a feature its kind implies"}
      - {rule: board_family, why: "the board's directory is the chip family of its chip (its first variant when the variants span families)"}
      - {from: parts.*.attach.peripheral, to: peripheral, why: "the driver of a part"}
      - {from: parts.*.variants.*.attach.peripheral, to: peripheral, why: "the driver of a part variant"}
      - {rule: board_drawn, why: "headers are of a connector type of config/connectors.yml or the board's own and sit on its banks; parts bind its banks"}
      - {rule: board_provenance, why: "the documents listed are fetched (a digest each); every source of a bank, header or part names one of them and where; a header read from a document puts every bank pin at one position of a known connector type"}

  feature:
    why: >-
      A browsable class of hardware (config/features.yml) and the capabilities
      a device of the class can provide. Catalogue browsing and filters; what
      a board's banks imply through their kinds.
    files: config/features.yml
    root: Features
    records: list
    id: id
    schema: feature.schema.json
    relations:
      - {from: capabilities.*, to: capability, why: "what a device of this class can provide"}

  kind:
    why: >-
      A kind a board's banks give their devices (config/kinds.yml, the
      inventory's taxonomy) and the features a board with such a bank lists
      one of. The link between banks and the feature vocabulary; the drafter's
      peripheral models name kinds too.
    files: config/kinds.yml
    root: Kinds
    records: list
    id: kind
    schema: kind.schema.json
    relations:
      - {from: features.*, to: feature, why: "the classes such a bank means"}

  device:
    why: >-
      A named chip or module (config/devices.yml): its feature class and the
      peripherals that drive it. Catalogue and drafter suggestions.
    files: config/devices.yml
    root: Devices
    records: list
    id: id
    schema: device.schema.json
    relations:
      - {from: feature, to: feature, why: "its class"}
      - {from: peripherals.*, to: peripheral, why: "the drivers that run it"}

  mezzanine:
    why: >-
      A SoM or daughtercard (config/mezzanines/<producer>/<family>.yml):
      connector, chip, default carrier. Catalogue only today.
    files: config/mezzanines/*/*.yml
    root: Mezzanines
    records: list
    id: id
    schema: mezzanine.schema.json
    relations:
      - {from: producer, to: producer, why: "whose module"}
      - {from: chip, to: chip, why: "the part on a SoM"}
      - {from: features.*, to: feature, why: "catalogue browsing"}
      - {from: devices.*, to: device, why: "catalogue browsing"}
      - {from: compatible_boards.*, to: board, why: "carriers it fits"}
      - {from: default_carrier, to: board, why: "the carrier it is sold with"}
