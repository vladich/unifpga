    Description: "Small serial EEPROM (AT24C-class) — board ID, MAC address, calibration constants."
    Capabilities: []
  - Id: microsd_socket
    Name: "microSD socket"
    Category: storage
    Description: "microSD card socket — often used as boot media on SoC FPGAs."
    Capabilities: []
  - Id: sd_card_socket
    Name: "SD card socket (full-size)"
