# The browsable classes of hardware a board may list under `features:`
# (config/schema/feature.schema.json; `./unifpga check`): a class, not a chip
# (the chips are config/devices.yml). `capabilities` names what a device of the
# class can provide to a design (config/capabilities/); `category` groups the
# catalogue. A board's banks imply features through their kinds (config/kinds.yml).

Features:
  - id: user_leds
    name: User LEDs
    category: io
    description: Discrete user LEDs driven directly by FPGA IOBs.
    capabilities: [leds]
  - id: rgb_leds
    name: RGB LEDs
    category: io
    description: User RGB LEDs (typically common-cathode, 3 IOBs per LED).
    capabilities: [rgb_leds]
  - id: addressable_leds
    name: Addressable LED string
    category: io
    description: WS2812 / SK6812 / APA102 string driven by a single IOB.
    capabilities: [rgb_leds]
  - id: user_buttons
    name: User push-buttons
    category: io
    description: Momentary push-buttons for user input (excluding RESET).
    capabilities: [buttons]
  - id: dip_switches
    name: DIP / slide switches
    category: io
    description: DIP or slide switches for user configuration.
    capabilities: [switches]
  - id: rotary_encoder
    name: Rotary encoder
    category: io
    description: Quadrature rotary encoder, optionally with push-button.
    capabilities: [buttons]
  - id: seven_segment_display
    name: 7-segment display
    category: io
    description: Multi-digit 7-segment LED display (shared or per-digit drive).
    capabilities: [seven_segment]
  - id: alphanumeric_display
    name: Alphanumeric display
    category: io
    description: 14- or 16-segment alphanumeric LED display.
    capabilities: [seven_segment]
  - id: tm1638_module
    name: TM1638 LED+key module
    category: io
    description: 'Pre-built TM1638 module: 8× 7-seg digits + 8 LEDs + 8 buttons over a 3-wire serial bus.'
    capabilities: [seven_segment, leds, buttons]
  - id: hdmi_output
    name: HDMI output
    category: display
    description: HDMI Type-A output connector (usually 1080p@60 capable).
    capabilities: [screen]
  - id: hdmi_input
    name: HDMI input
    category: display
    description: HDMI Type-A input connector.
    capabilities: []
  - id: displayport_output
    name: DisplayPort output
    category: display
    description: DisplayPort 1.x or 2.x output.
    capabilities: [screen]
  - id: vga_output
    name: VGA output
    category: display
    description: VGA DE-15 output (typically 4-bit-per-channel resistor DAC).
    capabilities: [screen]
  - id: tmds_pmod
    name: TMDS Pmod (DVI/HDMI)
    category: display
    description: TMDS differential pairs routed to Pmod connector for an HDMI/DVI adapter board.
    capabilities: [screen]
  - id: parallel_lcd
    name: Parallel RGB LCD
    category: display
    description: Parallel RGB LCD connector / on-board panel.
    capabilities: [screen]
  - id: mipi_dsi_output
    name: MIPI DSI output
    category: display
    description: MIPI DSI display interface (smartphone-style panel).
    capabilities: [screen]
  - id: composite_video_output
    name: Composite video output
    category: display
    description: NTSC/PAL composite video output (resistor DAC or AD725 encoder).
    capabilities: [screen]
  - id: audio_codec
    name: Audio codec
    category: audio
    description: Stereo audio ADC+DAC codec (line-in/out, sometimes mic/speaker drivers). Typically I2S data + I2C config.
    capabilities: [audio_in, audio_out]
  - id: audio_dac
    name: Audio DAC
    category: audio
    description: Audio DAC only (line-out / headphone-out). Often I2S.
    capabilities: [audio_out]
  - id: audio_amp_class_d
    name: Class-D audio amplifier
    category: audio
    description: On-board Class-D amplifier driving an external speaker via PWM.
    capabilities: [audio_out]
  - id: digital_mic_i2s
    name: I2S digital microphone
    category: audio
    description: MEMS digital microphone with I2S output (e.g. INMP441).
    capabilities: [audio_in]
  - id: digital_mic_pdm
    name: PDM digital microphone
    category: audio
    description: MEMS digital microphone with PDM output.
    capabilities: [audio_in]
  - id: analog_mic_jack
    name: Analog microphone jack
    category: audio
    description: 3.5 mm analog microphone jack feeding an external codec.
    capabilities: [audio_in]
  - id: headphone_jack
    name: Headphone jack
    category: audio
    description: 3.5 mm headphone jack (output from a codec or DAC).
    capabilities: [audio_out]
  - id: ddr2_memory
    name: DDR2 SDRAM
    category: memory
    description: DDR2 SDRAM chip(s) on-board.
    capabilities: []
  - id: ddr3_memory
    name: DDR3 SDRAM
    category: memory
    description: DDR3 / DDR3L SDRAM chip(s) on-board.
    capabilities: []
  - id: ddr4_memory
    name: DDR4 SDRAM
    category: memory
    description: DDR4 SDRAM chip(s) on-board.
    capabilities: []
  - id: ddr5_memory
    name: DDR5 SDRAM
    category: memory
    description: DDR5 SDRAM chip(s) on-board (Agilex 7 M-series and Versal Premium-class).
    capabilities: []
  - id: lpddr2_memory
    name: LPDDR2 SDRAM
    category: memory
    description: Low-power DDR2 (mobile-class). Used on Precursor and similar low-power boards.
    capabilities: []
  - id: lpddr3_memory
    name: LPDDR3 SDRAM
    category: memory
    description: Low-power DDR3 (mobile-class).
    capabilities: []
  - id: lpddr4_memory
    name: LPDDR4 SDRAM
    category: memory
    description: Low-power DDR4 (Zynq UltraScale+ MPSoC class).
    capabilities: []
  - id: sdr_sdram
    name: SDR SDRAM
    category: memory
    description: Legacy single-data-rate SDRAM (PC100/PC133 class). Common on cheap Cyclone boards.
    capabilities: []
  - id: hyperram
    name: HyperRAM / PSRAM
    category: memory
    description: Octal- or quad-line PSRAM (HyperRAM).
    capabilities: []
  - id: hbm2e_in_package
    name: HBM2e in-package
    category: memory
    description: High-bandwidth memory stacked in-package with the FPGA (Stratix 10 MX, Versal HBM).
    capabilities: []
  - id: sram
    name: SRAM
    category: memory
    description: Asynchronous SRAM (legacy boards).
    capabilities: []
  - id: ddr1_memory
    name: DDR1 SDRAM
    category: memory
    description: Original DDR (DDR1) SDRAM — legacy Virtex-4 / Stratix-II class boards.
    capabilities: []
  - id: qdrii_sram
    name: QDR-II/II+ SRAM
    category: memory
    description: Quad-data-rate SRAM (separate read/write busses) — typical of high-end packet-processing / NIC FPGA boards.
    capabilities: []
  - id: qspi_flash
    name: QSPI configuration flash
    category: storage
    description: Quad SPI flash for FPGA configuration and/or general-purpose data.
    capabilities: []
  - id: spi_flash
    name: SPI flash
    category: storage
    description: Single-line SPI flash.
    capabilities: []
  - id: nor_flash
    name: Parallel NOR flash
    category: storage
    description: Parallel NOR flash (legacy).
    capabilities: []
  - id: nand_flash
    name: NAND flash
    category: storage
    description: Raw NAND flash chip (eMMC-class density).
    capabilities: []
  - id: eeprom_chip
    name: I2C/SPI EEPROM
    category: storage
    description: Small serial EEPROM (AT24C-class) — board ID, MAC address, calibration constants.
    capabilities: []
  - id: microsd_socket
    name: microSD socket
    category: storage
    description: microSD card socket — often used as boot media on SoC FPGAs.
    capabilities: []
  - id: sd_card_socket
    name: SD card socket (full-size)
    category: storage
    description: Full-size SD card slot.
    capabilities: []
  - id: emmc_flash
    name: eMMC
    category: storage
    description: Soldered eMMC chip for bulk storage.
    capabilities: []
  - id: nvme_socket
    name: M.2 NVMe socket
    category: storage
    description: M.2 M-key socket for NVMe SSD via PCIe.
    capabilities: []
  - id: ethernet_phy_10_100
    name: 10/100 Ethernet PHY
    category: connectivity
    description: 10/100BASE-T Ethernet PHY with RJ-45 magjack.
    capabilities: []
  - id: ethernet_phy_gigabit
    name: Gigabit Ethernet PHY
    category: connectivity
    description: 10/100/1000BASE-T PHY with RJ-45 magjack (RGMII/SGMII/RMII MAC interface).
    capabilities: []
  - id: ethernet_phy_2_5gbe
    name: 2.5GbE Ethernet PHY
    category: connectivity
    description: 2.5GBASE-T PHY (newer industrial boards).
    capabilities: []
  - id: ethernet_10gbe_sfp
    name: 10G Ethernet (SFP+)
    category: connectivity
    description: 10GBASE-* via SFP+ cage and transceiver lanes.
    capabilities: []
  - id: ethernet_25gbe_sfp28
    name: 25G Ethernet (SFP28)
    category: connectivity
    description: 25GBASE-* via SFP28 cage.
    capabilities: []
  - id: usb_2_device
    name: USB 2.0 device
    category: connectivity
    description: USB 2.0 device port (typically the FPGA-config / UART bridge).
    capabilities: []
  - id: usb_2_host
    name: USB 2.0 host
    category: connectivity
    description: USB 2.0 host port (driven by FPGA / SoC USB controller).
    capabilities: []
  - id: usb_2_otg
    name: USB 2.0 OTG
    category: connectivity
    description: USB 2.0 host/device OTG port (typical of Zynq-based boards).
    capabilities: []
  - id: usb_3_host
    name: USB 3.0 host
    category: connectivity
    description: USB 3.0 / SuperSpeed host port via FPGA transceivers + ULPI/UTMI PHY.
    capabilities: []
  - id: usb_3_device
    name: USB 3.0 device
    category: connectivity
    description: USB 3.0 / SuperSpeed device port (through a bridge such as the CH569 or FPGA transceivers).
    capabilities: []
  - id: usb_uart_bridge
    name: USB-UART bridge
    category: connectivity
    description: FTDI / CP210x / CH340 USB-serial bridge for stdio + (sometimes) JTAG.
    capabilities: [serial_console]
  - id: rs232_transceiver
    name: RS-232 transceiver
    category: connectivity
    description: MAX3232-class transceiver behind a DE-9 connector.
    capabilities: [serial_console]
  - id: rs485_transceiver
    name: RS-485 transceiver
    category: connectivity
    description: Half/full-duplex RS-485 transceiver for industrial bus.
    capabilities: []
  - id: can_transceiver
    name: CAN transceiver
    category: connectivity
    description: CAN 2.0 / CAN FD transceiver chip.
    capabilities: []
  - id: wifi_radio
    name: Wi-Fi radio
    category: connectivity
    description: On-board Wi-Fi module (typically SDIO / SPI / UART AT).
    capabilities: []
  - id: bluetooth_le_radio
    name: Bluetooth LE radio
    category: connectivity
    description: On-board Bluetooth Low Energy radio.
    capabilities: []
  - id: zigbee_radio
    name: Zigbee radio
    category: connectivity
    description: On-board IEEE 802.15.4 / Zigbee radio.
    capabilities: []
  - id: pcie_endpoint
    name: PCIe endpoint
    category: connectivity
    description: PCIe endpoint (Gen2/Gen3/Gen4/Gen5) via FPGA transceivers.
    capabilities: []
  - id: pcie_edge_connector
    name: PCIe edge connector
    category: connectivity
    description: Card-edge PCIe finger for plugging the board into a host slot.
    capabilities: []
  - id: sata_host
    name: SATA host
    category: connectivity
    description: SATA III host port via FPGA transceivers.
    capabilities: []
  - id: sfp_cage
    name: SFP cage
    category: connectivity
    description: SFP / SFP+ cage (≤10 Gbps).
    capabilities: []
  - id: qsfp_cage
    name: QSFP cage
    category: connectivity
    description: QSFP+ / QSFP28 cage (40/100 Gbps).
    capabilities: []
  - id: qsfp_dd_cage
    name: QSFP-DD cage
    category: connectivity
    description: QSFP-DD cage (200/400 Gbps, eight transceiver lanes).
    capabilities: []
  - id: pmod_connector
    name: Pmod connector
    category: expansion
    description: Digilent Pmod (12-pin, 3.3 V) expansion connector. Boards often have multiples.
    capabilities: [gpio]
  - id: pmod_diff
    name: Pmod with differential pairs
    category: expansion
    description: Pmod with differential-pair routing for high-speed signals (e.g. HDMI Pmod).
    capabilities: [gpio]
  - id: fmc_lpc
    name: FMC LPC
    category: expansion
    description: VITA-57.1 FMC Low-Pin-Count connector.
    capabilities: [gpio]
  - id: fmc_hpc
    name: FMC HPC
    category: expansion
    description: VITA-57.1 FMC High-Pin-Count connector.
    capabilities: [gpio]
  - id: fmc_plus
    name: FMC+
    category: expansion
    description: VITA-57.4 FMC+ (28 Gb/s) connector.
    capabilities: [gpio]
  - id: syzygy_standard
    name: SYZYGY Standard
    category: expansion
    description: Opal Kelly SYZYGY Standard expansion connector.
    capabilities: [gpio]
  - id: syzygy_txr4
    name: SYZYGY TXR4
    category: expansion
    description: Opal Kelly SYZYGY TXR4 transceiver expansion connector.
    capabilities: [gpio]
  - id: arduino_shield_header
    name: Arduino shield header
    category: expansion
    description: Arduino R3-style shield connector header.
    capabilities: [gpio]
  - id: raspi_hat_header
    name: Raspberry Pi HAT header
    category: expansion
    description: Raspberry Pi 40-pin HAT-compatible header.
    capabilities: [gpio]
  - id: mikrobus_socket
    name: mikroBUS socket
    category: expansion
    description: MikroElektronika mikroBUS click-board socket.
    capabilities: [gpio]
  - id: gpio_header_generic
    name: Generic GPIO header
    category: expansion
    description: Bare 0.1" / 2 mm GPIO header without a standard pinout.
    capabilities: [gpio]
  - id: imu_chip
    name: IMU
    category: sensor
    description: Inertial measurement unit (accel + gyro, maybe magnetometer).
    capabilities: []
  - id: accelerometer
    name: Accelerometer
    category: sensor
    description: 3-axis accelerometer chip.
    capabilities: []
  - id: temperature_sensor_external
    name: External temperature sensor
    category: sensor
    description: On-board temperature sensor (board-level, not the FPGA die-temp).
    capabilities: []
  - id: barometric_pressure_sensor
    name: Barometric pressure sensor
    category: sensor
    description: Pressure / altitude sensor.
    capabilities: []
  - id: ambient_light_sensor
    name: Ambient light sensor
    category: sensor
    description: Phototransistor or digital light sensor.
    capabilities: []
  - id: mipi_csi2_input
    name: MIPI CSI-2 camera input
    category: sensor
    description: MIPI CSI-2 camera connector.
    capabilities: []
  - id: pcam_connector
    name: Digilent Pcam connector
    category: sensor
    description: Digilent Pcam-compatible MIPI CSI-2 camera connector.
    capabilities: []
  - id: parallel_camera_input
    name: Parallel camera input
    category: sensor
    description: Parallel CMOS image-sensor interface (OV5640 / OV7670 style 8/10-bit data + HSYNC/VSYNC).
    capabilities: []
  - id: analog_video_decoder
    name: Analog video decoder
    category: sensor
    description: Composite / component / S-Video → digital decoder chip (ADV7180-class).
    capabilities: []
  - id: adc_chip
    name: ADC chip
    category: sensor
    description: General-purpose external ADC (parallel / SPI / LVDS interface).
    capabilities: []
  - id: dac_chip
    name: DAC chip
    category: sensor
    description: General-purpose external DAC.
    capabilities: []
  - id: rf_adc_dac_high_speed
    name: High-speed RF ADC/DAC
    category: sensor
    description: High-rate (≥100 MSPS) ADC and/or DAC for RF / instrumentation.
    capabilities: []
  - id: sma_io_pair
    name: SMA I/O
    category: sensor
    description: SMA-connectored analog input/output ports (test-and-measurement).
    capabilities: []
  - id: jtag_header
    name: JTAG header
    category: programming
    description: Generic JTAG header (Xilinx 14-pin / Altera 10-pin / etc.).
    capabilities: []
  - id: usb_jtag_bridge
    name: USB-JTAG bridge
    category: programming
    description: On-board USB-to-JTAG bridge (FT2232H / FT232H / vendor-specific).
    capabilities: []
  - id: dfu_bootloader
    name: USB DFU bootloader
    category: programming
    description: USB-DFU bootloader pre-flashed in the FPGA (Fomu, OrangeCrab style).
    capabilities: []
  - id: avr_bridge
    name: On-board AVR bridge
    category: programming
    description: AVR microcontroller acting as USB-to-FPGA-config bridge (Mojo v3 style).
    capabilities: []
  - id: stlink_onboard
    name: ST-LINK on-board
    category: programming
    description: ST-LINK debugger / programmer on-board (rare, for SoC bring-up).
    capabilities: []
  - id: ftdi_usb_bridge
    name: FTDI USB bridge
    category: programming
    description: FTDI FT2232H / FT232H / FT4232H bridge providing JTAG + UART over USB.
    capabilities: [serial_console]
  - id: usb_powered
    name: USB-powered
    category: power
    description: Board runs from USB 5 V — no external supply needed.
    capabilities: []
  - id: barrel_jack_input
    name: Barrel jack DC input
    category: power
    description: External barrel jack DC input.
    capabilities: []
  - id: poe_input
    name: Power over Ethernet
    category: power
    description: Power-over-Ethernet input (802.3af/at).
    capabilities: []
  - id: battery_input
    name: Battery input
    category: power
    description: Coin-cell or LiPo battery input for low-power operation.
    capabilities: []
  - id: atx_power
    name: ATX power connector
    category: power
    description: PC ATX 4/8-pin power connector for high-current boards (Alveo-class).
    capabilities: []
  - id: aux_pcie_power
    name: Aux PCIe power
    category: power
    description: 6 or 8-pin PCIe auxiliary power input (Alveo / BittWare accelerators).
    capabilities: []
  - id: power_monitor_i2c
    name: I2C power monitor
    category: power
    description: On-board power / current monitor accessible over I2C (INA226 / PMBus).
    capabilities: []
  - id: clock_generator
    name: Programmable clock generator
    category: io
    description: Programmable clock generator / synthesizer (Si5324, Si570, Si5341/5345, LMK04xxx) providing reference clocks to FPGA transceivers.
    capabilities: []
  - id: ps2_port
    name: PS/2 port
    category: connectivity
    description: PS/2 keyboard / mouse connector.
    capabilities: [keyboard]
  - id: character_lcd
    name: Character LCD
    category: display
    description: HD44780-class character LCD (16x2, 20x4).
    capabilities: [text_display]
  - id: spi_lcd
    name: SPI LCD
    category: display
    description: Small TFT / OLED display on SPI.
    capabilities: [small_display]
  - id: buzzer
    name: Buzzer
    category: audio
    description: Piezo or magnetic buzzer.
    capabilities: [actuators]
  - id: fan_header
    name: Fan header
    category: io
    description: Header for a PWM fan (tachometer optional).
    capabilities: [actuators]
  - id: ir_receiver
    name: IR receiver
    category: io
    description: Infrared remote-control receiver.
    capabilities: [ir_remote]
  - id: irda_transceiver
    name: IrDA transceiver
    category: connectivity
    description: IrDA infrared transceiver.
    capabilities: []
  - id: joystick
    name: Joystick / gamepad port
    category: io
    description: Joystick or game controller connector.
    capabilities: []
