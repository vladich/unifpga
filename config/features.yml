    Capabilities: []
  - Id: nand_flash
    Name: "NAND flash"
    Category: storage
    Description: "Raw NAND flash chip (eMMC-class density)."
    Capabilities: []
  - Id: eeprom_chip
    Name: "I2C/SPI EEPROM"
