# Setup tang_nano_9k_lcd_800_480_tm1638: the rig config/configurations/tang_nano_9k_lcd_800_480_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_nano_9k_lcd_800_480_tm1638
  board: tang_nano_9k
  toolchain: gowin_eda
  toolchains: [gowin_eda, nextpnr_apicula]
  aliases: {tang_nano_9k_lcd_800_480_tm1638_yosys: {toolchain: nextpnr_apicula}}
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: leds
    - onboard: uart
    - onboard: lcd
      variant: lcd_800_480
    - module: tm1638_led_key
      wires: {DIO: 'gpio.[0]', CLK: 'gpio.[1]', STB: 'gpio.[2]'}
    - onboard: microsd
    - module: i2s_dac_breakout
      wires: {BCK: 'gpio.[3]', DIN: 'gpio.[4]', LCK: 'gpio.[5]'}
    - onboard: small_lcd
