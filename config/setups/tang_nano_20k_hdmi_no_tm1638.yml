# Rig tang_nano_20k_hdmi_no_tm1638: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_nano_20k_hdmi_no_tm1638).

Setup:
  id: tang_nano_20k_hdmi_no_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: buttons
      params:
        as_switches: true
      design_bits:
        switches: [0, 1]
    - onboard: leds
    - onboard: uart
    - onboard: hdmi
    - module: inmp441_breakout
      wires:
        L/R: header_j6.1
        WS: header_j6.2
        SCK: header_j6.3
        SD: header_j6.4
    - onboard: headphone
    - onboard: ws2812
  design:
    reset:
      sources:
      - power_up: true
    width:
      gpio: 5
