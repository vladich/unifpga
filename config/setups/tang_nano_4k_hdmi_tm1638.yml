# Rig tang_nano_4k_hdmi_tm1638: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_nano_4k_hdmi_tm1638).

Setup:
  id: tang_nano_4k_hdmi_tm1638
  board: tang_nano_4k
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: buttons
      design_bits:
        buttons: []
    - onboard: hdmi
    - onboard: serial_flash
      design_bits:
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: [0, 1, 2, 3, 4, 5, 6, 7]
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
        seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    - onboard: camera
      variant: inmp441_i2s_mic
    - onboard: camera
      variant: i2s_audio_out
    - onboard: camera
      variant: gpio
    - onboard: led
      design_bits:
        leds: [0]
  design:
    reset:
      sources:
      - power_up: true
      - any_key: true
    uart_rx: 0
