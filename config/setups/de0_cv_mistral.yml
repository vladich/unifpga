# Setup de0_cv_mistral: the rig config/configurations/de0_cv_mistral.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: de0_cv_mistral
  board: de0_cv
  toolchain: nextpnr_mistral
  notes:
    - "de0_cv_mistral retargeted to nextpnr_mistral (open-source Cyclone V flow)."
    - "Mirrors de0_cv — only the toolchain differs."
  use:
    - onboard: clk50mhz
    - onboard: buttons
    - onboard: cpu_resetn
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - module: inmp441_breakout
      wires: {SCK: 'gpio_0.[4]', WS: 'gpio_0.[2]', SD: 'gpio_0.[5]', L/R: 'gpio_0.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio_0.[33]', BCK: 'gpio_0.[31]', LCK: 'gpio_0.[27]', DIN: 'gpio_0.[29]'}
    - gpio: gpio_1
      params: {width: 36}
    - gpio: gpio_0
      params: {width: 36}
    - raw: {peripheral: uart_2wire, bind: {tx: 'gpio_1[35]', rx: 'gpio_1[34]'}}
  extra:
    tie:
      gpio_0[1]: 0
      gpio_0[3]: 1
