# Setup icebreaker_dvi_12b_no_tm1638: the rig config/configurations/icebreaker_dvi_12b_no_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: icebreaker_dvi_12b_no_tm1638
  board: icebreaker
  toolchain: nextpnr_icestorm
  aliases: {icebreaker_dvi_12b_no_tm1638_yosys: {}}
  use:
    - onboard: clk
    - onboard: uart
    - onboard: button
    - onboard: leds
    - onboard: buttons
    - module: 1bitsquared_dvi_pmod_12b
      wires: {A8: pmod_p1a.8, A2: pmod_p1a.2, A7: pmod_p1a.7, A1: pmod_p1a.1, A10: pmod_p1a.10, A4: pmod_p1a.4, A9: pmod_p1a.9, A3: pmod_p1a.3, B3: pmod_p1b.3, B8: pmod_p1b.8, B7: pmod_p1b.7, B1: pmod_p1b.1, B4: pmod_p1b.4, B10: pmod_p1b.10, B9: pmod_p1b.9, B2: pmod_p1b.2}
    - onboard: rgb_led_0
    - onboard: led_green
    - onboard: led_red
