# Setup tang_nano_20k_lcd_800_480_49mhz_tm1638: the rig config/configurations/tang_nano_20k_lcd_800_480_49mhz_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_nano_20k_lcd_800_480_49mhz_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda
  aliases: {tang_nano_20k_lcd_800_480_tm1638_alt: {}}
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: leds
    - onboard: uart
    - onboard: lcd
      variant: lcd_800_480_2
    - module: tm1638_led_key
      wires: {DIO: header_j5.13, CLK: header_j5.17, STB: header_j5.18}
    - module: inmp441_breakout
      wires: {L/R: header_j6.1, WS: header_j6.2, SCK: header_j6.3, SD: header_j6.4}
    - onboard: headphone
    - onboard: ws2812
  extra:
    pin_overrides:
      onboard_lcd.r:
      - '42'
      - '41'
      - '49'
      - '39'
      - '38'
      onboard_lcd.bl: null
