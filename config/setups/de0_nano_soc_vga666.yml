# Rig de0_nano_soc_vga666: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show de0_nano_soc_vga666).

Setup:
  id: de0_nano_soc_vga666
  board: de0_nano_soc
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]
  aliases: {de0_nano_soc_vga666_mistral: {toolchain: nextpnr_mistral}}
  use:
    - onboard: fpga_clk1_50mhz
    - onboard: buttons
      design_bits: {buttons: [0, 1]}
    - onboard: switches
      design_bits: {switches: [0, 1, 2, null]}
    - onboard: leds
      design_bits: {leds: [0, 1, 2, 3, 4, 5, 6, 7]}
    - module: digilent_pmod_vga
      wires: {R0: 'gpio_1.[13]', R1: 'gpio_1.[19]', R2: 'gpio_1.[5]', R3: 'gpio_1.[3]', G0: 'gpio_1.[7]', G1: 'gpio_1.[21]', G2: 'gpio_1.[17]', G3: 'gpio_1.[15]', B0: 'gpio_1.[23]', B1: 'gpio_1.[9]', B2: 'gpio_1.[11]', B3: 'gpio_1.[25]', HS: 'gpio_1.[33]', VS: 'gpio_1.[35]'}
      params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, gate: false}
    - module: tm1638_led_key
      wires: {STB: 'gpio_0.[29]', CLK: 'gpio_0.[27]', DIO: 'gpio_0.[31]'}
      design_bits: {buttons: [0, 1, 2, 3, 4, 5, 6, 7], switches: [], leds: [0, 1, 2, 3, 4, 5, 6, 7], seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]}
    - module: inmp441_breakout
      wires: {SCK: 'gpio_0.[4]', WS: 'gpio_0.[2]', SD: 'gpio_0.[5]', L/R: 'gpio_0.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio_1.[32]', BCK: 'gpio_1.[30]', LCK: 'gpio_1.[26]', DIN: 'gpio_1.[28]'}
    - gpio: gpio_0
      params: {width: 36}
    - onboard: adc
  design:
    reset:
      sources:
      - {switch_msb: true}
    uart_rx: 1
  extra:
    tie: {'gpio_0[1]': 0, 'gpio_0[3]': 1}
