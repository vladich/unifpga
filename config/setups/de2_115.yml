# Setup de2_115: the rig config/configurations/de2_115.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: de2_115
  board: de2_115
  toolchain: quartus_prime_lite
  use:
    - onboard: clk50mhz
    - onboard: buttons
    - onboard: switches
    - onboard: leds_green
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - onboard: uart
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[0]', WS: 'gpio.[2]', SCK: 'gpio.[4]', SD: 'gpio.[5]'}
    - onboard: audio_codec
    - gpio: gpio
      params: {width: 36}
  extra:
    tie:
      onboard_vga.sync_n: 0
      gpio[1]: 0
      gpio[3]: 1
      onboard_leds_green[8]: 0
