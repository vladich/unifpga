# Rig tang_nano_9k_hdmi_no_tm1638: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_nano_9k_hdmi_no_tm1638).

Setup:
  id: tang_nano_9k_hdmi_no_tm1638
  board: tang_nano_9k
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: buttons
      params:
        as_switches: true
      design_bits:
        buttons: [1, 0]
        switches: [1, 0]
    - onboard: leds
    - onboard: uart
    - onboard: hdmi
      variant: hdmi_tmds_2
    - onboard: microsd
    - onboard: lcd
      variant: i2s_audio_out
    - gpio: gpio
      params:
        width: 6
  design:
    reset:
      sources:
      - power_up: true
    width:
      gpio: 10
  extra:
    io_overrides:
      clk: LVCMOS33
    tie:
      onboard_lcd.de: 0
