# Rig tang_primer_20k_dock_lcd_800_480_tm1638_gpio: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_primer_20k_dock_lcd_800_480_tm1638_gpio).

Setup:
  id: tang_primer_20k_dock_lcd_800_480_tm1638_gpio
  board: tang_primer_20k_dock
  toolchain: gowin_eda
  aliases:
    tang_primer_20k_dock_lcd_800_480_tm1638_alt: {}
  use:
    - onboard: clock
    - onboard: leds
      params:
        active: high
      design_bits:
        leds: [null, null, null, null, null, null]
    - onboard: uart
    - onboard: switches
      design_bits:
        switches: [0, 1, 2, 3]
    - onboard: buttons
      design_bits:
        buttons: []
    - onboard: lcd
    - module: tm1638_led_key
      wires:
        STB: j12.6
        CLK: j12.8
        DIO: j12.10
      design_bits:
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: []
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
        seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    - onboard: headphone
    - module: i2s_dac_breakout
      wires:
        SCK: j12.11
        BCK: j12.9
        LCK: j12.5
        DIN: j12.7
      params:
        align_right: 0
        offset_by_one_cycle: 1
    - gpio: j14
      params:
        width: 8
    - gpio: j12
      params:
        width: 8
    - onboard: sdcard
  design:
    reset:
      sources:
      - key: msb
    clock: pixel
    width:
      switches: 8
      gpio: 32
