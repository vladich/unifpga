# Setup tang_primer_20k_dock_lcd_800_480_tm1638_gpio: the rig config/configurations/tang_primer_20k_dock_lcd_800_480_tm1638_gpio.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_primer_20k_dock_lcd_800_480_tm1638_gpio
  board: tang_primer_20k_dock
  toolchain: gowin_eda
  aliases: {tang_primer_20k_dock_lcd_800_480_tm1638_alt: {}}
  use:
    - onboard: clock
    - onboard: leds
      params: {active: high}
    - onboard: uart
    - onboard: switches
    - onboard: buttons
    - onboard: lcd
    - module: tm1638_led_key
      wires: {STB: j12.6, CLK: j12.8, DIO: j12.10}
    - onboard: headphone
    - module: i2s_dac_breakout
      wires: {SCK: j12.11, BCK: j12.9, LCK: j12.5, DIN: j12.7}
      params: {align_right: 0, offset_by_one_cycle: 1}
    - gpio: j14
      params: {width: 8}
    - gpio: j12
      params: {width: 8}
    - onboard: sdcard
