# Rig m2s025_starter: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show m2s025_starter).

Setup:
  id: m2s025_starter
  board: m2s025_starter
  toolchain: libero_soc
  notes:
    - m2s025_starter — SmartFusion2 Starter Kit (M2S025T).
    - Drives Libero SoC's TCL batch flow.
  use:
    - onboard: clk
    - onboard: reset
    - onboard: buttons
    - onboard: switches
    - onboard: leds
    - onboard: uart
  extra:
    manual: true
