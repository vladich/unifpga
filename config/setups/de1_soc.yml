# Setup de1_soc: the rig config/configurations/de1_soc.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: de1_soc
  board: de1_soc
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]
  aliases: {de1_soc_mistral: {toolchain: nextpnr_mistral}}
  use:
    - onboard: clk50mhz
    - onboard: buttons
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - module: inmp441_breakout
      wires: {SCK: 'gpio_0.[4]', WS: 'gpio_0.[2]', SD: 'gpio_0.[5]', L/R: 'gpio_0.[0]'}
    - onboard: audio_codec
    - gpio: gpio_1
      params: {width: 36}
    - gpio: gpio_0
      params: {width: 36}
  extra:
    tie:
      onboard_vga.sync_n: 0
      gpio_0[1]: 0
      gpio_0[3]: 1
