# Setup tang_nano_20k_lcd_480_272_no_tm1638: the rig config/configurations/tang_nano_20k_lcd_480_272_no_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_nano_20k_lcd_480_272_no_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: leds
    - onboard: uart
    - onboard: lcd
      variant: lcd_480_272
    - module: inmp441_breakout
      wires: {L/R: header_j6.1, WS: header_j6.2, SCK: header_j6.3, SD: header_j6.4}
    - onboard: headphone
    - gpio: gpio
      params: {width: 5}
    - onboard: ws2812
