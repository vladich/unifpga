# Setup de10_nano: the rig config/configurations/de10_nano.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: de10_nano
  board: de10_nano
  toolchain: quartus_prime_lite
  use:
    - onboard: fpga_clk1_50mhz
    - onboard: buttons
    - onboard: switches
    - onboard: leds
    - module: tm1638_led_key
      wires: {STB: 'gpio_0.[27]', CLK: 'gpio_0.[29]', DIO: 'gpio_0.[31]'}
    - module: inmp441_breakout
      wires: {SCK: 'gpio_0.[4]', WS: 'gpio_0.[2]', SD: 'gpio_0.[5]', L/R: 'gpio_0.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio_0.[17]', BCK: 'gpio_0.[15]', LCK: 'gpio_0.[11]', DIN: 'gpio_0.[13]'}
    - onboard: hdmi_tx
    - gpio: gpio_0
      params: {width: 36}
  extra:
    tie:
      onboard_hdmi_tx.i2s: 0
      onboard_hdmi_tx.lrclk: 0
      onboard_hdmi_tx.mclk: 0
      onboard_hdmi_tx.sclk: 0
      gpio_0[1]: 0
      gpio_0[3]: 1
