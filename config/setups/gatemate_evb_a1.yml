# Rig gatemate_evb_a1: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show gatemate_evb_a1).

Setup:
  id: gatemate_evb_a1
  board: gatemate_evb_a1
  toolchain: nextpnr_gatemate
  notes:
    - gatemate_evb_a1 — Cologne Chip EVB-A1 (CCGM1A1) via the open-source flow.
    - yosys synth_gatemate → nextpnr-himbaechel (gatemate uarch) → gmpack.
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: leds
  extra:
    manual: true
