# Rig nexys_a7: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show nexys_a7).

Setup:
  id: nexys_a7
  board: nexys_a7
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]
  part: "100t"
  parts: [100t, 50t]
  aliases: {nexys_a7_100: {part: 100t}, nexys_a7_100_openxc7: {toolchain: nextpnr_openxc7, part: 100t}, nexys_a7_50: {part: 50t}, nexys_a7_50_openxc7: {toolchain: nextpnr_openxc7, part: 50t}, nexys_a7_openxc7: {toolchain: nextpnr_openxc7, part: 100t}}
  use:
    - onboard: clk100mhz
    - onboard: switches
    - onboard: leds
    - onboard: rgb_led_16
    - onboard: rgb_led_17
    - onboard: 7seg
    - onboard: cpu_resetn
    - onboard: buttons
      design_bits: {buttons: [1, 3, 2, 0, 4]}
    - onboard: vga
    - onboard: pwm_amp
    - onboard: uart
    - module: inmp441_breakout
      wires: {SCK: 'pmod_jd.[4]', WS: 'pmod_jd.[5]', SD: 'pmod_jd.[0]', L/R: 'pmod_jd.[6]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_jc.[4]', BCK: 'pmod_jc.[5]', LCK: 'pmod_jc.[7]', DIN: 'pmod_jc.[6]'}
    - module: digilent_pmod_amp3
      wires: {'9': 'pmod_jb.[6]', '4': 'pmod_jb.[3]', '1': 'pmod_jb.[0]', '2': 'pmod_jb.[1]'}
    - onboard: usb_hid
    - onboard: temp_sensor
    - onboard: accelerometer
    - onboard: pmod_jxadc
    - onboard: sdcard
  design:
    width: {gpio: 32}
  extra:
    tie: {onboard_mic.clk: 0, onboard_mic.lrsel: 0, 'pmod_jd[2]': 0, 'pmod_jd[1]': 1}
