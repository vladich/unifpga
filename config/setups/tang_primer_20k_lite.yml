# Rig tang_primer_20k_lite: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_primer_20k_lite).

Setup:
  id: tang_primer_20k_lite
  board: tang_primer_20k_lite
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: switches
      design_bits:
        switches: [0, 1]
    - onboard: buttons
      design_bits:
        buttons: []
    - module: tm1638_led_key
      wires:
        STB: gpio_2.[3]
        CLK: gpio_2.[2]
        DIO: gpio_2.[1]
      design_bits:
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: []
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
        seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    - module: inmp441_breakout
      wires:
        SCK: gpio_3.[3]
        WS: gpio_3.[2]
        SD: gpio_3.[0]
        L/R: gpio_3.[1]
    - module: i2s_dac_breakout
      wires:
        SCK: gpio_3.[4]
        BCK: gpio_3.[5]
        LCK: gpio_3.[7]
        DIN: gpio_3.[6]
    - module: digilent_pmod_vga
      wires:
        R0: gpio_0.[4]
        R1: gpio_0.[5]
        R2: gpio_0.[6]
        R3: gpio_0.[7]
        G0: gpio_1.[4]
        G1: gpio_1.[5]
        G2: gpio_1.[6]
        G3: gpio_1.[7]
        B0: gpio_0.[0]
        B1: gpio_0.[1]
        B2: gpio_0.[2]
        B3: gpio_0.[3]
        HS: gpio_1.[0]
        VS: gpio_1.[1]
      params:
        bits_r: 4
        bits_g: 4
        bits_b: 4
        pin_bits_r: 4
        pin_bits_g: 4
        pin_bits_b: 4
    - onboard: sdcard
  design:
    reset:
      sources:
      - tm_key: msb
    uart_rx: 0
    width:
      gpio: 32
  extra:
    tie:
      gpio_1[3]: 0
      gpio_1[2]: 0
