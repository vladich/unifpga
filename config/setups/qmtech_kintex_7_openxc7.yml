# Setup qmtech_kintex_7_openxc7: the rig config/configurations/qmtech_kintex_7_openxc7.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: qmtech_kintex_7_openxc7
  board: qmtech_kintex_7
  toolchain: nextpnr_openxc7
  notes:
    - "qmtech_kintex_7_openxc7 retargeted to nextpnr_openxc7 (open-source flow)."
    - "Mirrors qmtech_kintex_7 — only the toolchain differs."
  use:
    - onboard: clk
    - onboard: cpu_resetn
    - onboard: leds
    - onboard: 7seg
    - onboard: buttons
      variant: button_array
    - onboard: buttons
      variant: button_array_2
