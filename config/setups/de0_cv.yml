# Setup de0_cv: the rig config/configurations/de0_cv.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: de0_cv
  board: de0_cv
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]
  aliases: {de0_cv_mistral: {toolchain: nextpnr_mistral}}
  use:
    - onboard: clk50mhz
    - onboard: buttons
    - onboard: cpu_resetn
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - module: inmp441_breakout
      wires: {SCK: 'gpio_0.[4]', WS: 'gpio_0.[2]', SD: 'gpio_0.[5]', L/R: 'gpio_0.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio_0.[33]', BCK: 'gpio_0.[31]', LCK: 'gpio_0.[27]', DIN: 'gpio_0.[29]'}
    - gpio: gpio_1
      params: {width: 36}
    - gpio: gpio_0
      params: {width: 36}
    - module: usb_uart_adapter
      wires: {RXD: 'gpio_1.[35]', TXD: 'gpio_1.[34]'}
    - onboard: ps2
  extra:
    tie:
      gpio_0[1]: 0
      gpio_0[3]: 1
