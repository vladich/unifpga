# Setup zeowaa_wo_dig_0: the rig config/configurations/zeowaa_wo_dig_0.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: zeowaa_wo_dig_0
  board: zeowaa
  toolchain: quartus_prime_lite
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
      variant: seven_segment_8digit_shared_2
    - onboard: vga
    - onboard: uart
    - module: inmp441_breakout
      wires: {SCK: 'gpio.[1]', WS: 'gpio.[3]', SD: 'gpio.[0]', L/R: 'gpio.[5]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio.[14]', BCK: 'gpio.[12]', LCK: 'gpio.[8]', DIN: 'gpio.[10]'}
    - gpio: gpio
      params: {width: 19}
    - onboard: buzzer
  extra:
    tie:
      gpio[4]: 0
      gpio[2]: 1
      onboard_7seg.anodes[0]: 1
