# Setup a7_lite_35t_openxc7: the rig config/configurations/a7_lite_35t_openxc7.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: a7_lite_35t_openxc7
  board: a7_lite_35t
  toolchain: nextpnr_openxc7
  notes:
    - "a7_lite_35t_openxc7 retargeted to nextpnr_openxc7 (open-source flow)."
    - "Mirrors a7_lite_35t — only the toolchain differs."
  use:
    - onboard: clk50mhz
    - onboard: cpu_resetn
    - onboard: buttons
    - onboard: leds
    - onboard: uart
    - module: tm1638_led_key
      wires: {DIO: 'gpio.[0]', CLK: 'gpio.[1]', STB: 'gpio.[2]'}
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[4]', WS: 'gpio.[5]', SCK: 'gpio.[6]', SD: 'gpio.[7]'}
    - onboard: hdmi
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio.[9]', BCK: 'gpio.[10]', LCK: 'gpio.[11]', DIN: 'gpio.[12]'}
    - gpio: gpio
      params: {width: 13}
