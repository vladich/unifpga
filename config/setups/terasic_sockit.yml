# Rig terasic_sockit: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show terasic_sockit).

Setup:
  id: terasic_sockit
  board: terasic_sockit
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]
  aliases:
    terasic_sockit_mistral:
      toolchain: nextpnr_mistral
  use:
    - onboard: buttons
    - onboard: leds
    - onboard: osc_50_b3b
    - onboard: cpu_resetn
    - onboard: switches
    - onboard: vga
  design:
    uart_rx: 0
    width:
      gpio: 2
  extra:
    tie:
      onboard_vga.sync_n: 0
