# Setup terasic_sockit: the rig config/configurations/terasic_sockit.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: terasic_sockit
  board: terasic_sockit
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]
  aliases: {terasic_sockit_mistral: {toolchain: nextpnr_mistral}}
  use:
    - onboard: buttons
    - onboard: leds
    - onboard: osc_50_b3b
    - onboard: cpu_resetn
    - onboard: switches
    - onboard: vga
  extra:
    tie:
      onboard_vga.sync_n: 0
