# Setup basys3: the rig config/configurations/basys3.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: basys3
  board: basys3
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]
  aliases: {basys3_openxc7: {toolchain: nextpnr_openxc7}}
  use:
    - onboard: clk
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
    - onboard: buttons
    - onboard: vga
    - onboard: uart
    - module: inmp441_breakout
      wires: {L/R: 'pmod_ja.[6]', WS: 'pmod_ja.[5]', SCK: 'pmod_ja.[4]', SD: 'pmod_ja.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_jc.[4]', BCK: 'pmod_jc.[5]', DIN: 'pmod_jc.[6]', LCK: 'pmod_jc.[7]'}
    - module: digilent_pmod_amp3
      wires: {'9': 'pmod_jb.[6]', '4': 'pmod_jb.[3]', '2': 'pmod_jb.[1]', '1': 'pmod_jb.[0]'}
  extra:
    tie:
      pmod_ja[2]: 0
      pmod_ja[1]: 1
