# Rig qmtech_kintex_7: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show qmtech_kintex_7).

Setup:
  id: qmtech_kintex_7
  board: qmtech_kintex_7
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]
  aliases:
    qmtech_kintex_7_openxc7:
      toolchain: nextpnr_openxc7
  use:
    - onboard: clk
    - onboard: cpu_resetn
    - onboard: leds
    - onboard: 7seg
    - onboard: buttons
      variant: button_array
    - onboard: buttons
      variant: button_array_2
    - onboard: db_leds
    - onboard: db_buttons
    - onboard: db_sdcard
  design:
    uart_rx: 0
