# Setup qmtech_kintex_7: the rig config/configurations/qmtech_kintex_7.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: qmtech_kintex_7
  board: qmtech_kintex_7
  toolchain: vivado
  use:
    - onboard: clk
    - onboard: cpu_resetn
    - onboard: leds
    - onboard: 7seg
    - onboard: buttons
      variant: button_array
    - onboard: buttons
      variant: button_array_2
