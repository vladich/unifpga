# Setup icebreaker_dvi_24b_tm1638: the rig config/configurations/icebreaker_dvi_24b_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: icebreaker_dvi_24b_tm1638
  board: icebreaker
  toolchain: nextpnr_icestorm
  aliases: {icebreaker_dvi_24b_tm1638_yosys: {}}
  use:
    - onboard: clk
    - onboard: uart
    - onboard: button
    - module: 1bitsquared_dvi_pmod_24b
      wires: {A1: pmod_p1a.1, A2: pmod_p1a.2, A3: pmod_p1a.3, A4: pmod_p1a.4, A7: pmod_p1a.7, A8: pmod_p1a.8, A9: pmod_p1a.9, A10: pmod_p1a.10, B1: pmod_p1b.1, B2: pmod_p1b.2, B3: pmod_p1b.3, B4: pmod_p1b.4, B7: pmod_p1b.7, B8: pmod_p1b.8, B9: pmod_p1b.9, B10: pmod_p1b.10}
    - module: tm1638_led_key
      wires: {STB: pmod_p2.10, CLK: pmod_p2.9, DIO: pmod_p2.8}
    - gpio: pmod_p2
      pins: ['1', '2', '3', '4', '7']
      params: {width: 5}
    - onboard: rgb_led_0
