# Setup icebreaker_dvi_24b_tm1638_yosys: the rig config/configurations/icebreaker_dvi_24b_tm1638_yosys.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: icebreaker_dvi_24b_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm
  use:
    - onboard: clk
    - onboard: uart
    - onboard: button
    - raw: {peripheral: dvi_pmod_ddr_24b, bind: {pmod_a: pmod_p1a, pmod_b: pmod_p1b}}
    - module: tm1638_led_key
      wires: {CLK: 'pmod_p2.[6]', STB: 'pmod_p2.[7]', DIO: 'pmod_p2.[5]'}
    - raw: {peripheral: gpio_header, params: {width: 5}, bind: {io: ['pmod_p2[0]', 'pmod_p2[1]', 'pmod_p2[2]', 'pmod_p2[3]', 'pmod_p2[4]']}}
