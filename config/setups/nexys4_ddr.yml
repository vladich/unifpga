# Setup nexys4_ddr: the rig config/configurations/nexys4_ddr.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: nexys4_ddr
  board: nexys4_ddr
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]
  aliases: {nexys4_ddr_default: {}, nexys4_ddr_default_openxc7: {toolchain: nextpnr_openxc7}, nexys4_ddr_openxc7: {toolchain: nextpnr_openxc7}, nexys4_ddr_tm1638_inmp441_jc: {}, nexys4_ddr_tm1638_inmp441_jc_openxc7: {toolchain: nextpnr_openxc7}}
  use:
    - onboard: clk100mhz
    - onboard: switches
    - onboard: leds
    - onboard: rgb_led_16
    - onboard: rgb_led_17
    - onboard: 7seg
    - onboard: cpu_resetn
    - onboard: buttons
    - onboard: vga
    - onboard: pwm_amp
    - onboard: uart
      variant: uart_2wire
    - module: inmp441_breakout
      wires: {L/R: 'pmod_jd.[6]', WS: 'pmod_jd.[5]', SCK: 'pmod_jd.[4]', SD: 'pmod_jd.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_jc.[4]', BCK: 'pmod_jc.[5]', DIN: 'pmod_jc.[6]', LCK: 'pmod_jc.[7]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_jb.[6]', BCK: 'pmod_jb.[3]', DIN: 'pmod_jb.[1]', LCK: 'pmod_jb.[0]'}
  extra:
    tie:
      onboard_mic.clk: 0
      onboard_mic.lrsel: 0
      pmod_jd[2]: 0
      pmod_jd[1]: 1
