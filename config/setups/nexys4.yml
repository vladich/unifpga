# Setup nexys4: the rig config/configurations/nexys4.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: nexys4
  board: nexys4
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]
  aliases: {nexys4_openxc7: {toolchain: nextpnr_openxc7}}
  use:
    - onboard: clk
    - onboard: switches
    - onboard: leds
    - onboard: rgb_led_1
    - onboard: rgb_led_2
    - onboard: 7seg
    - onboard: cpu_resetn
    - onboard: buttons
    - onboard: vga
    - onboard: pwm_amp
    - onboard: uart
    - module: inmp441_breakout
      wires: {SCK: 'pmod_jd.[4]', WS: 'pmod_jd.[5]', SD: 'pmod_jd.[0]', L/R: 'pmod_jd.[6]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_jc.[4]', BCK: 'pmod_jc.[5]', LCK: 'pmod_jc.[7]', DIN: 'pmod_jc.[6]'}
    - module: digilent_pmod_amp3
      wires: {'9': 'pmod_jb.[6]', '4': 'pmod_jb.[3]', '1': 'pmod_jb.[0]', '2': 'pmod_jb.[1]'}
    - onboard: usb_hid
    - onboard: temp_sensor
  extra:
    tie:
      onboard_mic.clk: 0
      onboard_mic.lrsel: 0
      pmod_jd[2]: 0
      pmod_jd[1]: 1
