# Setup c5gx: the rig config/configurations/c5gx.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: c5gx
  board: c5gx
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]
  aliases: {c5gx_mistral: {toolchain: nextpnr_mistral}}
  use:
    - onboard: clk50mhz
    - onboard: uart
    - onboard: buttons
    - onboard: cpu_resetn
    - onboard: switches
    - onboard: leds_green
    - onboard: leds
    - onboard: 7seg
    - module: inmp441_breakout
      wires: {SCK: 'gpio.[4]', WS: 'gpio.[2]', SD: 'gpio.[5]', L/R: 'gpio.[0]'}
    - onboard: audio_codec
    - onboard: hdmi_tx
    - gpio: gpio
      params: {width: 22}
    - onboard: adc
  extra:
    tie:
      gpio[1]: 0
      gpio[3]: 1
