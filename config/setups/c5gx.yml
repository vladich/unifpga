# Rig c5gx: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show c5gx).

Setup:
  id: c5gx
  board: c5gx
  toolchain: quartus_prime_lite
  toolchains: [quartus_prime_lite, nextpnr_mistral]
  aliases:
    c5gx_mistral:
      toolchain: nextpnr_mistral
  use:
    - onboard: clk50mhz
    - onboard: uart
    - onboard: buttons
    - onboard: cpu_resetn
    - onboard: switches
      design_bits:
        switches: [0, 1, 2, 3, 4, 5, 6, 7, 8, null]
    - onboard: leds_green
      design_bits:
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
    - onboard: leds
      design_bits:
        leds: [null, null, null, null, null, null, null, null, null, null]
    - onboard: 7seg
      bind:
        dp: ['onboard_leds[6]', 'onboard_leds[7]', 'onboard_leds[8]', 'onboard_leds[9]']
    - module: inmp441_breakout
      wires:
        SCK: gpio.[4]
        WS: gpio.[2]
        SD: gpio.[5]
        L/R: gpio.[0]
    - onboard: audio_codec
    - onboard: hdmi_tx
    - gpio: gpio
      params:
        width: 22
    - onboard: adc
    - onboard: sram
    - onboard: sdcard
  design:
    reset:
      sync: 2
    tie:
      onboard_leds[0]: 0
      onboard_leds[1]: 0
      onboard_leds[2]: 0
      onboard_leds[3]: 0
      onboard_leds[4]: 0
      onboard_leds[5]: 0
  extra:
    tie:
      gpio[1]: 0
      gpio[3]: 1
