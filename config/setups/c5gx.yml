# Setup c5gx: the rig config/configurations/c5gx.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: c5gx
  board: c5gx
  toolchain: quartus_prime_lite
  use:
    - onboard: clk50mhz
    - onboard: uart
    - onboard: buttons
    - onboard: cpu_resetn
    - onboard: switches
    - onboard: leds_green
    - onboard: leds
    - onboard: 7seg
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[0]', WS: 'gpio.[2]', SCK: 'gpio.[4]', SD: 'gpio.[5]'}
    - onboard: audio_codec
    - onboard: hdmi_tx
    - gpio: gpio
      params: {width: 22}
  extra:
    tie:
      gpio[1]: 0
      gpio[3]: 1
