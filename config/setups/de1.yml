# Setup de1: the rig config/configurations/de1.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: de1
  board: de1
  toolchain: quartus2
  use:
    - onboard: clk50mhz
    - onboard: uart
    - onboard: buttons
    - onboard: leds_green
    - onboard: switches
    - onboard: 7seg
    - onboard: vga
    - module: inmp441_breakout
      wires: {SCK: 'gpio_1.[4]', WS: 'gpio_1.[2]', SD: 'gpio_1.[5]', L/R: 'gpio_1.[0]'}
    - onboard: audio_codec
    - gpio: gpio_1
      params: {width: 36}
    - gpio: gpio_0
      params: {width: 36}
    - onboard: ps2
    - onboard: sdram
    - onboard: sdcard
  extra:
    tie:
      gpio_1[1]: 0
      gpio_1[3]: 1
