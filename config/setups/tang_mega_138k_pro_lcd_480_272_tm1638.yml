# Setup tang_mega_138k_pro_lcd_480_272_tm1638: the rig config/configurations/tang_mega_138k_pro_lcd_480_272_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_mega_138k_pro_lcd_480_272_tm1638
  board: tang_mega_138k_pro
  toolchain: gowin_standard
  use:
    - onboard: clk
    - onboard: buttons
      params: {active: high}
    - onboard: leds
    - gpio: pmod_0
      params: {width: 8}
    - gpio: pmod_1
      params: {width: 8}
    - gpio: pmod_2
      params: {width: 8}
    - onboard: lcd
    - module: tm1638_led_key
      wires: {STB: 'pmod_2.[7]', CLK: 'pmod_2.[6]', DIO: 'pmod_2.[5]'}
    - module: inmp441_breakout
      wires: {SCK: 'pmod_0.[2]', WS: 'pmod_0.[1]', SD: 'pmod_0.[6]', L/R: 'pmod_0.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_1.[4]', BCK: 'pmod_1.[5]', LCK: 'pmod_1.[7]', DIN: 'pmod_1.[6]'}
    - onboard: uart
    - onboard: audio_dac
    - onboard: ws2812
    - onboard: fan
    - onboard: sdcard
  extra:
    tie:
      pmod_0[4]: 0
      pmod_0[5]: 1
