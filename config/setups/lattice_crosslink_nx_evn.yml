# Rig lattice_crosslink_nx_evn: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show lattice_crosslink_nx_evn).

Setup:
  id: lattice_crosslink_nx_evn
  board: lattice_crosslink_nx_evn
  toolchain: nextpnr_nexus
  toolchains: [nextpnr_nexus, nextpnr_oxide]
  aliases: {lattice_crosslink_nx_evn_oxide: {toolchain: nextpnr_oxide}}
  notes:
    - "lattice_crosslink_nx_evn — CrossLink-NX EVN (LIFCL-40-9BG400C)"
    - "via the open-source flow: yosys synth_nexus → nextpnr-nexus → prjoxide pack."
  use:
    - onboard: clk
    - onboard: reset
    - onboard: buttons
    - onboard: switches
    - onboard: leds
    - onboard: uart
  extra:
    {manual: true}
  for_toolchain:
    nextpnr_oxide: {extra: null}
