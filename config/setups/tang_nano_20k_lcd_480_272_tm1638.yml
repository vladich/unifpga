# Setup tang_nano_20k_lcd_480_272_tm1638: the rig config/configurations/tang_nano_20k_lcd_480_272_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_nano_20k_lcd_480_272_tm1638
  board: tang_nano_20k
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: buttons
      params: {active: high}
    - onboard: leds
    - onboard: uart
    - onboard: lcd
      variant: lcd_480_272
    - raw: {peripheral: tm1638_led_key, bind: {dio: 'gpio[0]', clk: onboard_joystick.cs, stb: onboard_joystick.miso}}
    - raw: {peripheral: inmp441_i2s_mic, bind: {lr: 'gpio[1]', ws: 'gpio[2]', sck: 'gpio[3]', sd: 'onboard_microsd.dat[1]'}}
    - onboard: headphone
    - gpio: gpio
      params: {width: 5}
