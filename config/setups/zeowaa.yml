# Setup zeowaa: the rig config/configurations/zeowaa.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: zeowaa
  board: zeowaa
  toolchain: quartus_prime_lite
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
      variant: seven_segment_8digit_shared
    - onboard: vga
    - onboard: uart
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[5]', WS: 'gpio.[3]', SCK: 'gpio.[1]', SD: 'gpio.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio.[14]', BCK: 'gpio.[12]', LCK: 'gpio.[8]', DIN: 'gpio.[10]'}
    - gpio: gpio
      params: {width: 19}
  extra:
    tie:
      gpio[4]: 0
      gpio[2]: 1
