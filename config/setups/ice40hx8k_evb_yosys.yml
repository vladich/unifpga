# Setup ice40hx8k_evb_yosys: the rig config/configurations/ice40hx8k_evb_yosys.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: ice40hx8k_evb_yosys
  board: ice40hx8k_evb
  toolchain: nextpnr_icestorm
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: leds
    - onboard: switches
    - onboard: uart
    - onboard: vga
    - module: tm1638_led_key
      wires: {CLK: 'gpio.[0]', STB: 'gpio.[1]', DIO: 'gpio.[2]'}
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[3]', WS: 'gpio.[4]', SCK: 'gpio.[5]', SD: 'gpio.[6]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio.[7]', BCK: 'gpio.[8]', DIN: 'gpio.[9]', LCK: 'gpio.[10]'}
