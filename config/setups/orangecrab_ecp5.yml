# Setup orangecrab_ecp5: the rig config/configurations/orangecrab_ecp5.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: orangecrab_ecp5
  board: orangecrab_ecp5
  toolchain: nextpnr_trellis
  part: "25F"
  aliases: {orangecrab_ecp5_yosys: {}}
  use:
    - onboard: clk
    - onboard: leds
    - onboard: buttons
    - onboard: vga
    - onboard: switches
    - onboard: uart
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[3]', WS: 'gpio.[4]', SCK: 'gpio.[5]', SD: 'gpio.[6]'}
