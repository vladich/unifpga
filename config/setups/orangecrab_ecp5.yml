# Rig orangecrab_ecp5: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show orangecrab_ecp5).

Setup:
  id: orangecrab_ecp5
  board: orangecrab_ecp5
  toolchain: nextpnr_trellis
  part: "25F"
  aliases: {orangecrab_ecp5_yosys: {}}
  use:
    - onboard: clk
    - onboard: leds
    - onboard: buttons
    - onboard: vga
    - onboard: switches
      design_bits: {switches: []}
    - onboard: uart
    - module: inmp441_breakout
      wires: {SCK: 'gpio.[5]', WS: 'gpio.[4]', SD: 'gpio.[6]', L/R: 'gpio.[3]'}
  design:
    width: {gpio: 8}
