# Rig tang_nano_9k_hdmi_no_ip_tm1638: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_nano_9k_hdmi_no_ip_tm1638).

Setup:
  id: tang_nano_9k_hdmi_no_ip_tm1638
  board: tang_nano_9k
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: buttons
      design_bits: {buttons: []}
    - onboard: leds
      design_bits: {leds: [0, 1, 2, 3, 4, 5]}
    - onboard: uart
    - onboard: hdmi
      variant: hdmi_tmds
    - module: tm1638_led_key
      wires: {STB: 'gpio.[2]', CLK: 'gpio.[1]', DIO: 'gpio.[0]'}
      design_bits: {buttons: [0, 1, 2, 3, 4, 5, 6, 7], switches: [0, 1, 2, 3, 4, 5, 6, 7], leds: [0, 1, 2, 3, 4, 5, 6, 7], seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]}
    - onboard: microsd
    - onboard: lcd
      variant: i2s_audio_out
    - gpio: gpio
      params: {width: 6}
  design:
    reset:
      sources:
      - {power_up: true}
      - {any_key: true}
    width: {gpio: 10}
  extra:
    io_overrides: {clk: LVCMOS33, 'onboard_lcd.g[0]': LVCMOS33, 'onboard_lcd.g[1]': LVCMOS33, 'onboard_lcd.g[2]': LVCMOS33,
      'onboard_lcd.r[0]': LVCMOS33, 'onboard_lcd.r[1]': LVCMOS33, 'onboard_lcd.r[2]': LVCMOS33, 'onboard_lcd.r[3]': LVCMOS33,
      'onboard_lcd.r[4]': LVCMOS33}
    tie: {onboard_lcd.de: 0}
