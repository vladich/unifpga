# Rig dk_dev_3c120n: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show dk_dev_3c120n).

Setup:
  id: dk_dev_3c120n
  board: dk_dev_3c120n
  toolchain: quartus2
  use:
    - onboard: clk50mhz
    - onboard: leds
    - onboard: cpu_resetn
    - onboard: 7seg
    - onboard: buttons
    - onboard: switches
  design:
    uart_rx: 1
    width: {gpio: 1}
  extra:
    tie: {onboard_7seg.minus: 0, onboard_speaker: 0}
