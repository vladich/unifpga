# Setup omdazz_epm570: the rig config/configurations/omdazz_epm570.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: omdazz_epm570
  board: omdazz_epm570
  toolchain: quartus2
  aliases: {omdazz_epm570_quartus_13_1_or_older: {}}
  use:
    - onboard: clk
    - onboard: cpu_resetn
    - onboard: leds
    - onboard: buttons
    - onboard: switches
    - onboard: 7seg
    - onboard: uart
    - onboard: vga
    - onboard: char_lcd
    - onboard: buzzer
