# Rig omdazz_epm570: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show omdazz_epm570).

Setup:
  id: omdazz_epm570
  board: omdazz_epm570
  toolchain: quartus2
  aliases: {omdazz_epm570_quartus_13_1_or_older: {}}
  use:
    - onboard: clk
    - onboard: cpu_resetn
    - onboard: leds
    - onboard: buttons
    - onboard: switches
    - onboard: 7seg
    - onboard: uart
    - onboard: vga
    - onboard: char_lcd
    - onboard: buzzer
