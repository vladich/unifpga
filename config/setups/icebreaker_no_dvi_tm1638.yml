# Rig icebreaker_no_dvi_tm1638: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show icebreaker_no_dvi_tm1638).

Setup:
  id: icebreaker_no_dvi_tm1638
  board: icebreaker
  toolchain: nextpnr_icestorm
  aliases: {icebreaker_no_dvi_tm1638_yosys: {}}
  use:
    - onboard: clk
    - onboard: uart
    - onboard: button
      design_bits: {buttons: []}
    - module: tm1638_led_key
      wires: {STB: pmod_p2.10, CLK: pmod_p2.9, DIO: pmod_p2.8}
      design_bits: {buttons: [0, 1, 2, 3, 4, 5, 6, 7], switches: [0, 1, 2, 3, 4, 5, 6, 7], leds: [0, 1, 2, 3, 4, 5, 6, 7], seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]}
    - module: inmp441_breakout
      wires: {SCK: pmod_p1a.3, WS: pmod_p1a.2, SD: pmod_p1a.4, L/R: pmod_p1a.1}
    - module: i2s_dac_breakout
      wires: {SCK: pmod_p1b.1, BCK: pmod_p1b.2, LCK: pmod_p1b.4, DIN: pmod_p1b.3}
    - gpio: pmod_p2
      pins: ['1', '2', '3', '4', '7']
      params: {width: 5}
    - onboard: rgb_led_0
  design:
    reset:
      sources:
      - {power_up: true}
      - {tm_key: msb}
