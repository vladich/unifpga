# Setup icebreaker_no_dvi_no_tm1638: the rig config/configurations/icebreaker_no_dvi_no_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: icebreaker_no_dvi_no_tm1638
  board: icebreaker
  toolchain: nextpnr_icestorm
  aliases: {icebreaker_no_dvi_no_tm1638_yosys: {}}
  use:
    - onboard: clk
    - onboard: uart
    - onboard: button
    - onboard: leds
    - onboard: buttons
    - module: inmp441_breakout
      wires: {SCK: pmod_p1a.3, WS: pmod_p1a.2, SD: pmod_p1a.4, L/R: pmod_p1a.1}
    - module: i2s_dac_breakout
      wires: {SCK: pmod_p1b.1, BCK: pmod_p1b.2, LCK: pmod_p1b.4, DIN: pmod_p1b.3}
    - onboard: rgb_led_0
    - onboard: led_green
    - onboard: led_red
