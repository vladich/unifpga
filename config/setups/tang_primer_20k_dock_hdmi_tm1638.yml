# Rig tang_primer_20k_dock_hdmi_tm1638: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_primer_20k_dock_hdmi_tm1638).

Setup:
  id: tang_primer_20k_dock_hdmi_tm1638
  board: tang_primer_20k_dock
  toolchain: gowin_eda
  toolchains: [gowin_eda, nextpnr_apicula]
  aliases: {tang_primer_20k_dock_hdmi_tm1638_yosys: {toolchain: nextpnr_apicula}}
  use:
    - onboard: clock
    - onboard: leds
      params: {active: high}
      design_bits: {leds: [null, null, null, null, null, null]}
    - onboard: uart
    - onboard: switches
      design_bits: {switches: [0, 1, 2, 3]}
    - onboard: buttons
      design_bits: {buttons: []}
    - onboard: hdmi
      for_toolchain: {nextpnr_apicula: {params: {timing: dvi}}}
    - module: tm1638_led_key
      wires: {STB: j12.6, CLK: j12.8, DIO: j12.10}
      design_bits: {buttons: [0, 1, 2, 3, 4, 5, 6, 7], switches: [], leds: [0, 1, 2, 3, 4, 5, 6, 7], seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]}
    - module: inmp441_breakout
      wires: {SCK: j14.10, WS: j14.6, SD: j14.12, L/R: j14.8}
    - onboard: headphone
    - module: i2s_dac_breakout
      wires: {SCK: j12.11, BCK: j12.9, LCK: j12.5, DIN: j12.7}
      params: {align_right: 0, offset_by_one_cycle: 1}
    - onboard: sdcard
  design:
    reset:
      sources:
      - {key: msb}
    clock: pixel
    width: {switches: 8, gpio: 32}
  extra:
    io_overrides: {clk: LVCMOS33, 'gpio_1[2]': LVCMOS33, 'gpio_1[3]': LVCMOS33, 'gpio_1[6]': LVCMOS33, 'gpio_1[7]': LVCMOS33,
      'gpio_2[0]': LVCMOS33, 'gpio_2[4]': LVCMOS33, onboard_headphone: LVCMOS33, 'onboard_leds[2]': LVCMOS33,
      'onboard_leds[3]': LVCMOS33, 'onboard_leds[4]': LVCMOS33, 'onboard_leds[5]': LVCMOS33, onboard_pa_enable: LVCMOS33}
  for_toolchain:
    nextpnr_apicula:
      extra:
        io_overrides: {clk: null}
