# Setup tang_primer_25k_pmod_hub75e_led_matrix: the rig config/configurations/tang_primer_25k_pmod_hub75e_led_matrix.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_primer_25k_pmod_hub75e_led_matrix
  board: tang_primer_25k
  toolchain: gowin_standard
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: uart
    - raw: {peripheral: hub75e_led_matrix, params: {rows: 64, brightness: 1}, bind: {ck: 'pmod_0[6]', oe: 'pmod_0[7]', st: 'pmod_0[2]', a: 'pmod_0[4]', b: 'pmod_0[0]', c: 'pmod_0[5]', d: 'pmod_0[1]', e: 'pmod_1[3]', r1: 'pmod_1[4]', r2: 'pmod_1[6]', g1: 'pmod_1[0]', g2: 'pmod_1[2]', b1: 'pmod_1[5]', b2: 'pmod_1[7]'}}
    - module: tm1638_led_key
      wires: {DIO: 'pmod_2.[1]', CLK: 'pmod_2.[2]', STB: 'pmod_2.[3]'}
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[0]', WS: 'gpio.[2]', SCK: 'gpio.[4]', SD: 'gpio.[5]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_2.[4]', BCK: 'pmod_2.[5]', DIN: 'pmod_2.[6]', LCK: 'pmod_2.[7]'}
    - gpio: gpio
      params: {width: 38}
  extra:
    tie:
      gpio[1]: 0
      gpio[3]: 1
