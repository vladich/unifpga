# Rig piswords6: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show piswords6).

Setup:
  id: piswords6
  board: piswords6
  toolchain: quartus_prime_lite
  use:
    - onboard: clk
    - onboard: buttons
      design_bits:
        buttons: [0, 1, 2, null]
    - onboard: switches
    - onboard: leds
      pins: [0, 1, 2, 4, 5, 6, 7]   # LED 4 (pin 44) is the DS18B20's data line
    - onboard: 7seg
    - onboard: vga
    - onboard: uart
    - module: inmp441_breakout
      wires:
        SCK: gpio.[4]
        WS: gpio.[2]
        SD: gpio.[5]
        L/R: gpio.[0]
    - module: i2s_dac_breakout
      wires:
        SCK: gpio.[12]
        BCK: gpio.[10]
        LCK: gpio.[6]
        DIN: gpio.[8]
    - gpio: gpio
      params:
        width: 16
    - onboard: buzzer
    - onboard: temperature
  design:
    reset:
      sources:
      - key: msb
  extra:
    tie:
      gpio[1]: 0
      gpio[3]: 1
