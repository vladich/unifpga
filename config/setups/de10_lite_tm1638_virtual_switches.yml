# Setup de10_lite_tm1638_virtual_switches: the rig config/configurations/de10_lite_tm1638_virtual_switches.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: de10_lite_tm1638_virtual_switches
  board: de10_lite
  toolchain: quartus_prime_lite
  use:
    - onboard: clk50mhz
    - onboard: buttons
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
      params: {gate: false}
    - module: inmp441_breakout
      wires: {SCK: gpio.5, WS: gpio.3, SD: gpio.6, L/R: gpio.1}
    - module: i2s_dac_breakout
      wires: {SCK: gpio.37, BCK: gpio.35, LCK: gpio.31, DIN: gpio.33}
    - gpio: gpio
      params: {width: 36}
    - gpio: arduino
      params: {width: 16}
    - onboard: accelerometer
  extra:
    tie:
      gpio[1]: 0
      gpio[3]: 1
