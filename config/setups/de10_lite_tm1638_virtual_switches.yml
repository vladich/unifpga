# Rig de10_lite_tm1638_virtual_switches: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show de10_lite_tm1638_virtual_switches).

Setup:
  id: de10_lite_tm1638_virtual_switches
  board: de10_lite
  toolchain: quartus_prime_lite
  use:
    - onboard: clk50mhz
    - onboard: buttons
      design_bits: {buttons: [0, 1]}
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
      params: {gate: false}
    - module: inmp441_breakout
      wires: {SCK: gpio.5, WS: gpio.3, SD: gpio.6, L/R: gpio.1}
    - module: i2s_dac_breakout
      wires: {SCK: gpio.37, BCK: gpio.35, LCK: gpio.31, DIN: gpio.33}
    - gpio: gpio
      params: {width: 36}
    - gpio: arduino
      params: {width: 16}
    - onboard: accelerometer
    - onboard: sdram
  design:
    reset:
      sources:
      - {switch_msb: true}
    uart_rx: 0
    tie: {arduino_reset_n: ~rst}
  extra:
    tie: {'gpio[1]': 0, 'gpio[3]': 1}
