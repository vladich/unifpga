# Setup ice40hx8k_evb: the rig config/configurations/ice40hx8k_evb.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: ice40hx8k_evb
  board: ice40hx8k_evb
  toolchain: nextpnr_icestorm
  aliases: {ice40hx8k_evb_yosys: {}}
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: leds
    - onboard: switches
    - onboard: uart
    - onboard: vga
    - module: tm1638_led_key
      wires: {STB: 'gpio.[1]', CLK: 'gpio.[0]', DIO: 'gpio.[2]'}
    - module: inmp441_breakout
      wires: {SCK: 'gpio.[5]', WS: 'gpio.[4]', SD: 'gpio.[6]', L/R: 'gpio.[3]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio.[7]', BCK: 'gpio.[8]', LCK: 'gpio.[10]', DIN: 'gpio.[9]'}
    - onboard: sram
