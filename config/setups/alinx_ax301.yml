# Rig alinx_ax301: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show alinx_ax301).

Setup:
  id: alinx_ax301
  board: alinx_ax301
  toolchain: quartus_prime_lite
  use:
    - onboard: clk
    - onboard: cpu_resetn
    - onboard: buttons
      params: {as_switches: true}
      design_bits: {switches: [0, 1, 2]}
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - module: inmp441_breakout
      wires: {SCK: 'gpio_0.[4]', WS: 'gpio_0.[2]', SD: 'gpio_0.[5]', L/R: 'gpio_0.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio_0.[12]', BCK: 'gpio_0.[10]', LCK: 'gpio_0.[6]', DIN: 'gpio_0.[8]'}
    - gpio: gpio_1
      params: {width: 34}
    - gpio: gpio_0
      params: {width: 34}
    - onboard: buzzer
    - onboard: sdram
    - onboard: sdcard
  design:
    {uart_rx: 0}
  extra:
    tie: {'gpio_0[1]': 0, 'gpio_0[3]': 1}
