# Rig tang_nano_9k_lcd_800_480_tm1638_hackathon: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_nano_9k_lcd_800_480_tm1638_hackathon).

Setup:
  id: tang_nano_9k_lcd_800_480_tm1638_hackathon
  board: tang_nano_9k
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: leds
    - onboard: lcd
      variant: lcd_800_480
    - module: tm1638_led_key
      wires: {STB: 'gpio.[2]', CLK: 'gpio.[1]', DIO: 'gpio.[0]'}
    - onboard: microsd
    - module: i2s_dac_breakout
      wires: {BCK: 'gpio.[3]', LCK: 'gpio.[5]', DIN: 'gpio.[4]'}
    - onboard: uart
  design:
    reset:
      sources:
      - {power_up: true}
      - {any_key: true}
