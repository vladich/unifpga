# Setup de10_lite: the rig config/configurations/de10_lite.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: de10_lite
  board: de10_lite
  toolchain: quartus_prime_lite
  use:
    - onboard: clk50mhz
    - onboard: buttons
    - onboard: switches
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - module: inmp441_breakout
      wires: {L/R: gpio.1, WS: gpio.3, SCK: gpio.5, SD: gpio.6}
    - module: i2s_dac_breakout
      wires: {SCK: gpio.38, BCK: gpio.36, LCK: gpio.32, DIN: gpio.34}
    - gpio: gpio
      params: {width: 36}
    - gpio: arduino
      params: {width: 16}
  extra:
    tie:
      gpio[1]: 0
      gpio[3]: 1
