# Setup alinx_ax7035b: the rig config/configurations/alinx_ax7035b.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: alinx_ax7035b
  board: alinx_ax7035b
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]
  aliases: {alinx_ax7035b_openxc7: {toolchain: nextpnr_openxc7}}
  use:
    - onboard: clk
    - onboard: cpu_resetn
    - onboard: buttons
    - onboard: leds
    - onboard: 7seg
    - onboard: uart
    - onboard: temp_sensor
    - onboard: sdcard
