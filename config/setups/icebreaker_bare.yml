# Setup icebreaker_bare: the rig config/configurations/icebreaker_bare.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: icebreaker_bare
  board: icebreaker
  toolchain: nextpnr_icestorm
  use:
    - onboard: clk
    - onboard: uart
    - onboard: button
    - onboard: rgb_led_0
    - onboard: leds
    - onboard: led_green
    - onboard: led_red
    - onboard: buttons
    - gpio: pmod_p1b
      params: {width: 8}
    - gpio: pmod_p1a
      params: {width: 8}
