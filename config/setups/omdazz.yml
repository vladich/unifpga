# Setup omdazz: the rig config/configurations/omdazz.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: omdazz
  board: omdazz
  toolchain: quartus_prime_lite
  use:
    - onboard: clk
    - onboard: cpu_reset
    - onboard: buttons
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - onboard: uart
      variant: uart_2wire
    - onboard: char_lcd
      variant: inmp441_i2s_mic
    - onboard: char_lcd
      variant: i2s_audio_out
    - onboard: char_lcd
      variant: gpio
    - onboard: buzzer
    - onboard: temp_sensor
  extra:
    tie:
      onboard_char_lcd.d[6]: 0
      onboard_char_lcd.d[4]: 1
