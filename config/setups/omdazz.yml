# Rig omdazz: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show omdazz).

Setup:
  id: omdazz
  board: omdazz
  toolchain: quartus_prime_lite
  use:
    - onboard: clk
    - onboard: cpu_reset
    - onboard: buttons
      params: {as_switches: true}
      design_bits: {switches: [0, 1, 2, 3]}
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - onboard: uart
      variant: uart_2wire
    - onboard: char_lcd
      variant: inmp441_i2s_mic
    - onboard: char_lcd
      variant: i2s_audio_out
    - onboard: char_lcd
      variant: gpio
    - onboard: buzzer
    - onboard: temp_sensor
    - onboard: ps2
    - onboard: ir
    - onboard: sdram
  extra:
    tie: {'onboard_char_lcd.d[6]': 0, 'onboard_char_lcd.d[4]': 1}
