# Setup tang_mega_138k_lcd_480_272_tm1638: the rig config/configurations/tang_mega_138k_lcd_480_272_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_mega_138k_lcd_480_272_tm1638
  board: tang_mega_138k
  toolchain: gowin_standard
  use:
    - onboard: clk
    - onboard: buttons
    - gpio: pmod_0
      params: {width: 8}
    - gpio: pmod_1
      params: {width: 8}
    - onboard: lcd
    - module: tm1638_led_key
      wires: {DIO: 'pmod_1.[6]', CLK: 'pmod_1.[4]', STB: 'pmod_1.[2]'}
    - module: inmp441_breakout
      wires: {L/R: 'pmod_0.[4]', WS: 'pmod_0.[2]', SCK: 'pmod_0.[0]', SD: 'pmod_1.[0]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_1.[1]', BCK: 'pmod_1.[3]', DIN: 'pmod_1.[5]', LCK: 'pmod_1.[7]'}
