# Setup icebreaker_dvi_24b_no_tm1638_yosys: the rig config/configurations/icebreaker_dvi_24b_no_tm1638_yosys.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: icebreaker_dvi_24b_no_tm1638_yosys
  board: icebreaker
  toolchain: nextpnr_icestorm
  use:
    - onboard: clk
    - onboard: uart
    - onboard: button
    - onboard: leds
    - onboard: buttons
    - raw: {peripheral: dvi_pmod_ddr_24b, bind: {pmod_a: pmod_p1a, pmod_b: pmod_p1b}}
