# Rig tang_primer_20k_dock_no_hdmi_no_tm1638: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_primer_20k_dock_no_hdmi_no_tm1638).

Setup:
  id: tang_primer_20k_dock_no_hdmi_no_tm1638
  board: tang_primer_20k_dock
  toolchain: gowin_eda
  use:
    - onboard: clock
    - onboard: leds
    - onboard: uart
    - onboard: switches
    - onboard: buttons
    - module: inmp441_breakout
      wires:
        SCK: j14.10
        WS: j14.6
        SD: j14.12
        L/R: j14.8
    - onboard: headphone
    - module: i2s_dac_breakout
      wires:
        SCK: j12.11
        BCK: j12.9
        LCK: j12.5
        DIN: j12.7
      params:
        align_right: 0
        offset_by_one_cycle: 1
    - onboard: sdcard
  design:
    reset:
      sources:
      - key: msb
    width:
      gpio: 32
