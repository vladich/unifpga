# Setup karnix_ecp5: the rig config/configurations/karnix_ecp5.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: karnix_ecp5
  board: karnix_ecp5
  toolchain: nextpnr_trellis
  aliases: {karnix_ecp5_yosys: {}}
  use:
    - onboard: clk
    - onboard: leds
    - onboard: buttons
    - onboard: vga
    - onboard: switches
    - onboard: uart
    - module: inmp441_breakout
      wires: {SCK: 'gpio.[5]', WS: 'gpio.[4]', SD: 'gpio.[6]', L/R: 'gpio.[3]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio.[7]', BCK: 'gpio.[8]', LCK: 'gpio.[10]', DIN: 'gpio.[9]'}
