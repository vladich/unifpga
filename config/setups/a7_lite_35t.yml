# Setup a7_lite_35t: the rig config/configurations/a7_lite_35t.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: a7_lite_35t
  board: a7_lite_35t
  toolchain: vivado
  toolchains: [vivado, nextpnr_openxc7]
  aliases: {a7_lite_35t_openxc7: {toolchain: nextpnr_openxc7}}
  use:
    - onboard: clk50mhz
    - onboard: cpu_resetn
    - onboard: buttons
    - onboard: leds
    - onboard: uart
    - module: tm1638_led_key
      wires: {DIO: 'gpio.[0]', CLK: 'gpio.[1]', STB: 'gpio.[2]'}
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[4]', WS: 'gpio.[5]', SCK: 'gpio.[6]', SD: 'gpio.[7]'}
    - onboard: hdmi
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio.[9]', BCK: 'gpio.[10]', LCK: 'gpio.[11]', DIN: 'gpio.[12]'}
    - gpio: gpio
      params: {width: 13}
