# Rig tang_nano_9k_tm1638_sd: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show tang_nano_9k_tm1638_sd).

Setup:
  id: tang_nano_9k_tm1638_sd
  board: tang_nano_9k
  toolchain: gowin_eda
  use:
    - onboard: clk
    - onboard: buttons
      design_bits:
        buttons: []
    - onboard: leds
      design_bits:
        leds: [0, 1, 2, 3, 4, 5]
    - onboard: uart
    - module: tm1638_led_key
      wires:
        STB: gpio.[2]
        CLK: gpio.[1]
        DIO: gpio.[0]
      design_bits:
        buttons: [0, 1, 2, 3, 4, 5, 6, 7]
        switches: [0, 1, 2, 3, 4, 5, 6, 7]
        leds: [0, 1, 2, 3, 4, 5, 6, 7]
        seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    - onboard: microsd
    - onboard: hdmi
      variant: hdmi_tmds_2
    - gpio: gpio
      params:
        width: 6
  design:
    reset:
      sources:
      - power_up: true
      - any_key: true
    width:
      gpio: 10
  extra:
    io_overrides:
      clk: LVCMOS33
      gpio: LVCMOS33
      onboard_hdmi.clk_p: LVCMOS33
      onboard_hdmi.d_p[0]: LVCMOS33
      onboard_hdmi.d_p[1]: LVCMOS33
      onboard_hdmi.d_p[2]: LVCMOS33
      onboard_microsd: LVCMOS33
      onboard_uart: LVCMOS33
