# Setup tang_nano_9k_lcd_ml6485_tm1638: the rig config/configurations/tang_nano_9k_lcd_ml6485_tm1638.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_nano_9k_lcd_ml6485_tm1638
  board: tang_nano_9k
  toolchain: nextpnr_apicula
  aliases: {tang_nano_9k_lcd_ml6485_tm1638_yosys: {}}
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: leds
    - onboard: uart
    - onboard: lcd
      variant: lcd_ml6485
    - module: tm1638_led_key
      wires: {STB: 'gpio.[2]', CLK: 'gpio.[1]', DIO: 'gpio.[0]'}
    - onboard: microsd
    - module: i2s_dac_breakout
      wires: {BCK: 'gpio.[3]', LCK: 'gpio.[5]', DIN: 'gpio.[4]'}
    - onboard: small_lcd
