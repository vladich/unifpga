# Rig orangepi_msoc: its board, what is on it and how the design sees it.
# The build expands it into the rig's configuration (./unifpga setup show orangepi_msoc).

Setup:
  id: orangepi_msoc
  board: orangepi_msoc
  toolchain: gowin_standard
  use:
    - onboard: clk
    - onboard: leds
    - onboard: uart
    - onboard: switches
    - onboard: buttons
    - onboard: 7seg
    - module: inmp441_breakout
      wires:
        SCK: gpio.[11]
        WS: gpio.[15]
        SD: gpio.[9]
        L/R: gpio.[13]
    - module: i2s_dac_breakout
      wires:
        SCK: gpio.[8]
        BCK: gpio.[10]
        LCK: gpio.[14]
        DIN: gpio.[12]
      params:
        align_right: 0
        offset_by_one_cycle: 1
  design:
    reset:
      sources:
      - key: msb
    width:
      gpio: 20
