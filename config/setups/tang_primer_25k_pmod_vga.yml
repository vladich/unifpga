# Setup tang_primer_25k_pmod_vga: the rig config/configurations/tang_primer_25k_pmod_vga.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: tang_primer_25k_pmod_vga
  board: tang_primer_25k
  toolchain: gowin_standard
  use:
    - onboard: clk
    - onboard: buttons
    - onboard: uart
    - module: digilent_pmod_vga
      wires: {R0: 'pmod_1.[4]', R1: 'pmod_1.[5]', R2: 'pmod_1.[6]', R3: 'pmod_1.[7]', G0: 'pmod_0.[4]', G1: 'pmod_0.[5]', G2: 'pmod_0.[6]', G3: 'pmod_0.[7]', B0: 'pmod_1.[0]', B1: 'pmod_1.[1]', B2: 'pmod_1.[2]', B3: 'pmod_1.[3]', HS: 'pmod_0.[0]', VS: 'pmod_0.[1]'}
    - module: tm1638_led_key
      wires: {DIO: 'pmod_2.[1]', CLK: 'pmod_2.[2]', STB: 'pmod_2.[3]'}
    - module: inmp441_breakout
      wires: {L/R: 'gpio.[0]', WS: 'gpio.[2]', SCK: 'gpio.[4]', SD: 'gpio.[5]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'pmod_2.[4]', BCK: 'pmod_2.[5]', DIN: 'pmod_2.[6]', LCK: 'pmod_2.[7]'}
    - gpio: gpio
      params: {width: 38}
  extra:
    tie:
      gpio[1]: 0
      gpio[3]: 1
      pmod_0[2]: 0
      pmod_0[3]: 0
