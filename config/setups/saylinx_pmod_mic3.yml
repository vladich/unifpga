# Setup saylinx_pmod_mic3: the rig config/configurations/saylinx_pmod_mic3.yml describes.
# tools/setup.py generates that configuration from it (./unifpga setup check).

Setup:
  id: saylinx_pmod_mic3
  board: saylinx
  toolchain: quartus_prime_lite
  use:
    - onboard: clk
    - onboard: cpu_resetn
    - onboard: buttons
    - onboard: leds
    - onboard: 7seg
    - onboard: vga
    - module: digilent_pmod_mic3
      wires: {'1': 'gpio_1.[26]', '4': 'gpio_1.[32]', '3': 'gpio_1.[30]'}
    - module: i2s_dac_breakout
      wires: {SCK: 'gpio_0.[12]', BCK: 'gpio_0.[10]', LCK: 'gpio_0.[6]', DIN: 'gpio_0.[8]'}
    - gpio: gpio_1
      params: {width: 34}
    - gpio: gpio_0
      params: {width: 34}
    - onboard: uart
    - onboard: buzzer
    - onboard: sdram
    - onboard: sdcard
