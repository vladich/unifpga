# BGM parity overlay for nexys4_ddr_openxc7: how basics-graphics-music's boards/nexys4_ddr/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/nexys4_ddr_openxc7.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: nexys4_ddr_openxc7
  variant: nexys4_ddr
  tie:
    onboard_rgb_led_16.b: 0
    onboard_rgb_led_16.g: 0
    onboard_rgb_led_16.r: 0
    onboard_rgb_led_17.b: 0
    onboard_rgb_led_17.g: 0
    onboard_rgb_led_17.r: 0
  attach:
  - peripheral: rgb_led
    index: 0
    drop: true
  - peripheral: rgb_led
    index: 1
    drop: true
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [1, 3, 2, 0, 4]
