# BGM parity overlay for de0_cv_mistral: how basics-graphics-music's boards/de0_cv/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/de0_cv_mistral.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: de0_cv_mistral
  variant: de0_cv
  attach:
  - peripheral: seven_segment_per_digit
    index: 0
    bind:
      dp: ['onboard_leds[4]', 'onboard_leds[5]', 'onboard_leds[6]', 'onboard_leds[7]', 'onboard_leds[8]',
        'onboard_leds[9]']
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0, 1, 2, 3, null, null, null, null, null, null]
