# BGM parity overlay for tang_primer_25k_pmod_hub75e_led_matrix_bright: how basics-graphics-music's boards/tang_primer_25k_pmod_hub75e_led_matrix_bright/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/tang_primer_25k_pmod_hub75e_led_matrix_bright.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: tang_primer_25k_pmod_hub75e_led_matrix_bright
  variant: tang_primer_25k_pmod_hub75e_led_matrix_bright
  reset:
    sources:
    - power_up: true
    - tm_key: msb
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [0, 1]
      switches: [0, 1]
    params:
      as_switches: true
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: [0, 1, 2, 3, 4, 5, 6, 7]
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
    params:
      rst: context.rst_on_power_up
