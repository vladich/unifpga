# BGM parity overlay for dk_dev_3c120n: how basics-graphics-music's boards/dk_dev_3c120n/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/dk_dev_3c120n.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: dk_dev_3c120n
  variant: dk_dev_3c120n
  uart_rx: 1
  lab_width:
    gpio: 1
