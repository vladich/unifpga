# BGM parity overlay for orangepi_msoc: how basics-graphics-music's boards/orangepi_msoc/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/orangepi_msoc.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: orangepi_msoc
  variant: orangepi_msoc
  reset:
    sources:
    - key: msb
  lab_width:
    gpio: 20
