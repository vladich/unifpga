# BGM parity overlay for eclypse_z7: how basics-graphics-music's boards/eclypse_z7/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/eclypse_z7.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: eclypse_z7
  variant: eclypse_z7
  reset:
    sources:
    - key: 0
  uart_rx: 0
  lab_width:
    gpio: 1
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: []
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: [0, 1, 2, 3, 4, 5, 6, 7]
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0]
  - peripheral: led_bank
    index: 1
    lab_bits:
      leds: [1]
  - peripheral: led_bank
    index: 2
    lab_bits:
      leds: [2]
  - peripheral: led_bank
    index: 3
    lab_bits:
      leds: [3]
  - peripheral: led_bank
    index: 4
    lab_bits:
      leds: [4]
  - peripheral: led_bank
    index: 5
    lab_bits:
      leds: [5]
