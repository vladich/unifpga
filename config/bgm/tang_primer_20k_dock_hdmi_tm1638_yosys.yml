# BGM parity overlay for tang_primer_20k_dock_hdmi_tm1638_yosys: how basics-graphics-music's boards/tang_primer_20k_dock_hdmi_tm1638_yosys/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/tang_primer_20k_dock_hdmi_tm1638_yosys.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: tang_primer_20k_dock_hdmi_tm1638_yosys
  variant: tang_primer_20k_dock_hdmi_tm1638_yosys
  reset:
    sources:
    - key: msb
  lab_clock: pixel
  lab_width:
    switches: 8
  attach:
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [null, null, null, null, null, null]
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: [0, 1, 2, 3]
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: []
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: []
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
