# BGM parity overlay for nexys4: how basics-graphics-music's boards/nexys4/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/nexys4.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: nexys4
  variant: nexys4
  tie:
    onboard_rgb_led_1.r: 0
    onboard_rgb_led_1.g: 0
    onboard_rgb_led_1.b: 0
    onboard_rgb_led_2.r: 0
    onboard_rgb_led_2.g: 0
    onboard_rgb_led_2.b: 0
    onboard_pwm_amp.pwm: 0
    onboard_pwm_amp.sd: 0
  lab_width:
    gpio: 32
  attach:
  - peripheral: pwm_amp
    index: 0
    drop: true
  - peripheral: rgb_led
    index: 0
    drop: true
  - peripheral: rgb_led
    index: 1
    drop: true
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [1, 3, 2, 0, 4]
  bgm_bugs:
    vga_colour_swap: the top drives the green VGA pins from blue and the blue pins from green; unifpga
      keeps them straight
