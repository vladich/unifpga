# BGM parity overlay for rzrd_pmod_mic3: how basics-graphics-music's boards/rzrd_pmod_mic3/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/rzrd_pmod_mic3.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: rzrd_pmod_mic3
  variant: rzrd_pmod_mic3
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      switches: [0, 1, 2, 3]
    params:
      as_switches: true
