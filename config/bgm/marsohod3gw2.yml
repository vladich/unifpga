# BGM parity overlay for marsohod3gw2: how basics-graphics-music's boards/marsohod3gw2/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/marsohod3gw2.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: marsohod3gw2
  variant: marsohod3gw2
  reset:
    sources:
    - any_key: true
      bank: onboard_buttons
    - pll_lock: serial
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [null, null]
  - peripheral: button_array
    index: 1
    lab_bits:
      buttons: [0, 1, 2, 3]
  - peripheral: adc_8bit_mic
    index: 0
    params:
      clock: clock.pixel
