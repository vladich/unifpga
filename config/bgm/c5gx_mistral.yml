# BGM parity overlay for c5gx_mistral: how basics-graphics-music's boards/c5gx/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/c5gx_mistral.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: c5gx_mistral
  variant: c5gx
  reset:
    sync: 2
  tie:
    onboard_leds[0]: 0
    onboard_leds[1]: 0
    onboard_leds[2]: 0
    onboard_leds[3]: 0
    onboard_leds[4]: 0
    onboard_leds[5]: 0
  attach:
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: [0, 1, 2, 3, 4, 5, 6, 7, 8, null]
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
  - peripheral: led_bank
    index: 1
    lab_bits:
      leds: [null, null, null, null, null, null, null, null, null, null]
  - peripheral: seven_segment_per_digit
    index: 0
    bind:
      dp: ['onboard_leds[6]', 'onboard_leds[7]', 'onboard_leds[8]', 'onboard_leds[9]']
