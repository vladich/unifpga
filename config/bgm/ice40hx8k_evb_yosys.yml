# BGM parity overlay for ice40hx8k_evb_yosys: how basics-graphics-music's boards/ice40hx8k_evb_yosys/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/ice40hx8k_evb_yosys.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: ice40hx8k_evb_yosys
  variant: ice40hx8k_evb_yosys
  reset:
    sources:
    - tm_key: msb
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: []
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [null, null]
  - peripheral: sw_bank
    index: 0
    lab_bits:
      switches: []
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: []
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
