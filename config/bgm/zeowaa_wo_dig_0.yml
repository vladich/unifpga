# BGM parity overlay for zeowaa_wo_dig_0: how basics-graphics-music's boards/zeowaa_wo_dig_0/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/zeowaa_wo_dig_0.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: zeowaa_wo_dig_0
  variant: zeowaa_wo_dig_0
  reset:
    sources:
    - key: msb
  attach:
  - peripheral: button_array
    index: 0
    lab_bits:
      buttons: [0, 1, 2, null]
