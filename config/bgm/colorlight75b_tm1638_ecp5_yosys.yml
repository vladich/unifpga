# BGM parity overlay for colorlight75b_tm1638_ecp5_yosys: how basics-graphics-music's boards/colorlight75b_tm1638_ecp5_yosys/board_specific_top.sv
# derives its reset and composes lab_top's buses on this board. BGM's lab conventions, not
# facts about the hardware; config/configurations/colorlight75b_tm1638_ecp5_yosys.yml stays generic and config/init.py
# applies this on top of it (synthesize.py --no-bgm-overlay turns it off).
# Written by tools/sync_from_bgm.py, proved by tools/equiv_check.py; do not edit by hand.
BGM:
  configuration: colorlight75b_tm1638_ecp5_yosys
  variant: colorlight75b_tm1638_ecp5_yosys
  reset:
    sources:
    - tm_key: msb
  attach:
  - peripheral: led_bank
    index: 0
    lab_bits:
      leds: [0]
  - peripheral: tm1638_led_key
    index: 0
    lab_bits:
      buttons: [0, 1, 2, 3, 4, 5, 6, 7]
      switches: []
      leds: [0, 1, 2, 3, 4, 5, 6, 7]
      seven_segment: [0, 1, 2, 3, 4, 5, 6, 7]
