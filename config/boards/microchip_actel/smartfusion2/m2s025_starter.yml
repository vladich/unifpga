      label: clk
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk}}
    - id: reset
      label: reset
      attach: {peripheral: reset_button, bind: {rst: onboard_reset}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 3}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds}}
    - id: uart
      label: FT232RL USB-UART on P1 mini-USB (serial console, MMUART_0)
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: ds1_reset_out_led_nreset_out
      label: DS1 reset-out LED (nRESET_OUT)
      device: {kind: other, bank: onboard_ds1_reset_out_led_nreset_out}   # no peripheral model yet
    - id: usb_ulpi
      label: USB3300 ULPI USB OTG PHY on P19 mini-USB
      device: {kind: usb, bank: onboard_usb_ulpi}   # no peripheral model yet
    - id: flash
      label: S25FL128S 16 MB SPI flash (SOM, SPI0)
      device: {kind: flash, bank: onboard_flash}   # no peripheral model yet
    - id: other
      label: P5 FlashPro JTAG (10-pin) and P3 ARM JTAG (20-pin)
      device: {kind: other, bank: onboard_other}   # no peripheral model yet
