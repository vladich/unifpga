      pins: {"txd": ["K21", "J21", "L19", "K18"], "tx_ctl": "J24", "tx_clk": "H24", "rxd": ["B26", "C26", "D26", "E26"], "rx_ctl": "C22", "rx_clk": "C23", "mdc": "K23", "mdio": "K22", "rst_n": "E17", "phy_clk": "E18"}
