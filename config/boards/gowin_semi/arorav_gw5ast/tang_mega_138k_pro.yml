# tang_mega_138k_pro pin map.


Board:
  id: tang_mega_138k_pro
  name: Tang Mega 138k Pro
  product: Tang Mega 138K Pro Dock (Tang MEGA 138K Pro SOM on TANG MEGA-138K Pro Dock)
  summary: Gowin GW5AST-LV138FPG676A (138,240 LUT4, 8 SerDes to 12.5 Gb/s, hard PCIe, 2x MIPI D-PHY RX) SOM with 2x
    4 Gbit DDR3 (32-bit), 2x 128 Mbit SPI NOR; dock with PCIe x4 edge, 2x SFP+, M.2 B-key, RTL8211F RGMII, 2x HDMI/DVI
    (TX + RX), RGB LCD, DVP + 2x MIPI CSI, microSD, PT8211 audio, soft USB 2.0, BL616 USB-JTAG/UART, 3 Pmods, 40-pin
    SDRAM header, WS2812, 6 LEDs, 4 keys.
  aliases:
  - tang_mega_138k_pro_dock
  url: https://wiki.sipeed.com/hardware/en/tang/tang-mega-138k/mega-138k-pro.html
  producer: sipeed
  chip: GW5AST-LV138FPG676AES
  bridges:
  - jtag
  programmer: openFPGALoader
  features:
  - microsd_socket
  - hdmi_input
  - ddr3_memory
  - spi_flash
  - user_leds
  - user_buttons
  - adc_chip
  - addressable_leds
  - pcie_edge_connector
  - ethernet_phy_gigabit
  - audio_dac
  - parallel_camera_input
  - fan_header
  devices:
  - microsd_socket_generic
