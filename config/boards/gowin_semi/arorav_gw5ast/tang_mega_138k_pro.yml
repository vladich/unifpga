      device: {"name": "MS5351M clock synthesizers PLL0/PLL1 (25 MHz crystals; SerDes refclks, user clock)", "kind": "clock"}
      shares: ["onboard_m2", "onboard_sfp_0", "onboard_sfp_1"]   # the board multiplexes these pins
      pins: {"q1_refclk1_pll0": "AA13,AB13", "q1_refclk0_pll1": "AA11,AB11", "usr_clk_in_pll1_clk2": "N22"}
    onboard_ethernet:   # RTL8211FI-CG Gigabit Ethernet PHY (RGMII) + RJ45
