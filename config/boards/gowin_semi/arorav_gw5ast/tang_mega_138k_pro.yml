    onboard_sfp_1:   # SFP+ cage 1 (SerDes Q1 lane 1)
      device: {"name": "SFP+ cage 1 (SerDes Q1 lane 1)", "kind": "serdes"}
      shares: ["onboard_clocks_2", "onboard_sfp_0"]   # the board multiplexes these pins
