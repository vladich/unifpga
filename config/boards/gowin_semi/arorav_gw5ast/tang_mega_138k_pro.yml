    onboard_pcie:   # PCIe x4 edge connector (golden finger, SerDes Q0 lanes 0-3)
      device: {"name": "PCIe x4 edge connector (golden finger, SerDes Q0 lanes 0-3)", "kind": "pcie"}
      shares: ["header_40p", "onboard_m2"]   # the board multiplexes these pins
      pins: {"tx": ["D10,C10", "D8,C8", "B9,A9", "B7,A7"], "rx": ["D12,C12", "D14,C14", "B13,A13", "B11,A11"], "refclk": "F11,E11", "perst_n": "L23", "wake_n": "L22"}
