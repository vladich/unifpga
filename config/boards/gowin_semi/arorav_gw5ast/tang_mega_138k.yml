        vsync: Y21
        href: AB21
        rst_n: Y22
        pwdn: AB22
        d: [P14, P15, R16, R14, N15, T20, AA19, AA20]
        sda: Y13
        scl: AA14
    header_j13:   # 2x20 header J13 (SDRAM0 connector: a MiSTer-style SDRAM module, or anything else)
      device:
        name: '2x20 header J13 (SDRAM0 connector: a MiSTer-style SDRAM module, or anything else)'
        kind: header
