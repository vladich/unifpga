        cmd_mosi: Y16
        d0_miso: AA15
        d1: AB15
        d2: W14
        d3_cs: W15
    sdio_header:   # SDIO header J10 (2x4 2.54 mm)
      source:
        doc: dock31005
        where: 'p16 J10 PinHeader_2x04: 1 FPGA_SDIO_D0|SPI_MISO, 2 CMD|SPI_MOSI, 3 D1, 4 CLK|SPI_SCK, 5 D3|SPI_CS, 6 D2, 7 GND, 8 5V'
      device:
        name: SDIO header J10 (2x4 2.54 mm)
        kind: header
      shares: [onboard_sdcard]   # the board multiplexes these pins
      pins: [AA15, Y16, AB15, V15, W15, W14]   # header pins 1-6: D0/MISO, CMD/MOSI, D1, CLK, D3/CS, D2
