  toolchain_options:
    yosys:
      loader_board: "tangmega138k"          # openFPGALoader -b
    gowin:
      set_device: "GW5AST-LV138PG484AC1/I0"
      set_device_reason: tool-required
      options: [use_sspi_as_gpio, use_cpu_as_gpio]
      gprj_device: '<Device name="GW5AST-138C" pn="GW5AST-LV138PG484AC1/I0">gw5ast138c-007</Device>'
  banks:
    clk:
      pins: V22
      frequency_mhz: 50
      iostandard: LVCMOS33
      source:
        doc: som138_30353
        where: SOM "Crystal oscillator" Y1100 50MHz -> BANK4_V22_EMCCLK_50Mhz
    onboard_buttons:
      source:
        doc: dock31005
        where: 'p9 BUTTON: EX_KEY.0 S4 USER_BUTTON0, EX_KEY.1 S2, EX_KEY.2 S1 to GND, "requires enable internal pull-up"; BTB J2.60/62/64 = BANK5_AA13/AB13/Y12'
      iostandard: LVCMOS33
      pins: [AA13, AB13, Y12]
    onboard_lcd:
      source:
        doc: dock31005
        where: 'p12 RGB LCD Display J5: R2 HRVLD, R3 HD0, R4 HD1, R5 HTRDY, R6 HD3, R7 HD4, G2-G7 HD5-HD10, B2-B6 HD11-HD15, B7 HCTS, CLK HTACK, HSYNC HTREQ, VSYNC HTVLD, DEN HD2 (R0/R1/G0/G1/B0/B1 grounded, DISP tied +3V3); balls from BTB J0'
      iostandard: LVCMOS33
      pins:
        ck: L19
        de: L14
        vs: L15
        hs: N20
        r: [G18, G17, H22, J22, K22, K21]
        g: [K18, L21, M21, M22, N22, L18]
        b: [M18, N19, N18, K16, L16, M20]
    onboard_hdmi_0:
      source:
        doc: dock31005
        where: 'p15 FPGA_TMDS (DVI): TMDS via 100nF to J29; DVI-A_HPD via R169; DVI_TWI1 SCL/SDA via 2N7002 to EDID; DVI-A_ALT -> DVI_DIR_SEL (1=TX, 0=RX, pulled up); BTB J1.50-64 (J17/K17 D2, H15/J15 D1, H14/J14 D0, G16/G15 CK), J2.61 K14 DVI-A_ALT, J2.63 K13 DVI-A_HPD, J2.32/34 M13/L13'
      iostandard: LVCMOS33D
      pins:
        clk_p: "G15,G16"
        d_p: ['J14,H14', 'J15,H15', 'K17,J17']
    pmod_0:
      source:
        doc: dock31005
        where: 'p19 EX CONN. J9: 11 PMOD0_IO0, 12 IO1, 9 IO2, 10 IO3, 7 IO4, 8 IO5, 5 IO6, 6 IO7, 3/4 GND, 1/2 +3V3; BTB J0.25/23/15/13/20/18/14/12 = P19/R19/T21/U21/P16/R17/R18/T18'
      iostandard: LVCMOS33
      pins: [P19, R19, T21, U21, P16, R17, R18, T18]
    pmod_1:
      source:
        doc: dock31005
        where: 'p19 EX CONN. J8: 11 PMOD1_IO0 ... 6 PMOD1_IO7 (same layout as J9); BTB J2.5/3/9/7/13/11/17/15 = Y21/Y22/AB21/AB22/AA20/AA21/AA19/AB20'
      iostandard: LVCMOS33
      pins: [Y21, Y22, AB21, AB22, AA20, AA21, AA19, AB20]
    onboard_spi_flash:   # SPI NOR flash W25Q64 (SOM U1200, MSPI config flash)
      device:
        name: SPI NOR flash W25Q64 (SOM U1200, MSPI config flash)
        kind: flash
        id: winbond_w25q64
      pins:
        cs_n: T19
        clk: L12
        d0_mosi: P22
        d1_miso: R22
        d2_wp: P21
        d3_hold: R21
    onboard_som_leds:   # SOM status LEDs DONE / READY (D2206, D2207)
      device:
        name: SOM status LEDs DONE / READY (D2206, D2207)
        kind: leds
      active: "high"
      pins:
        done: G11
        ready: U12
    onboard_som_keys:   # SOM keys: CPU_RESET (U1304) and RECONFIG (U1303, also dock SW7)
      device:
        name: 'SOM keys: CPU_RESET (U1304) and RECONFIG (U1303, also dock SW7)'
        kind: reset
      pins:
        cpu_reset: F4
        reconfig_n: N12
    som_debug:   # SOM debug connector U1201 (JST SH1.0 8-pin: JTAG + UART)
      source:
        doc: som138_30353
        where: 'SOM "JTAG Connector" U1201: 1 5V0, 2 TMS BANK10_T13, 3 TDO U13, 4 TCK V12, 5 TDI R13, 6 RX BANK5_V14, 7 TX BANK5_U15, 8 GND'
      device:
        name: 'SOM debug connector U1201 (JST SH1.0 8-pin: JTAG + UART)'
        kind: header
      shares: [onboard_uart]   # the board multiplexes these pins
      pins:
        2_tms: T13
        3_tdo: U13
        4_tck: V12
        5_tdi: R13
        6_rx: V14
        7_tx: U15
    onboard_ddr3:   # DDR3 SDRAM 2x x16 (SOM DDR1/DDR2: H5TQ4G63EFR on SOM 30354 = 1 GB; MT41J128M16JT on SOM 30353 = 512 MB)
      device:
        name: 'DDR3 SDRAM 2x x16 (SOM DDR1/DDR2: H5TQ4G63EFR on SOM 30354 = 1 GB; MT41J128M16JT on SOM 30353 = 512 MB)'
        kind: ddr3
      iostandard: "SSTL15 / SSTL15D (BANK_VCCIO=1.5)"
      pins:
        a: [M1, K2, G2, J4, J2, H2, G3, J1, J5, H5, L1, H3, K4, K1, D1, R1]
        ba: [P5, P2, M6]
        ras_n: L5
        cas_n: L4
        we_n: M5
        cs_n: P4
        cke: K6
        odt: M2
        reset_n: L6
        clk: L3,K3
        dq: [Y4, AB3, AA5, V4, AA1, AB2, AB5, AB1, AA8, Y8, AB7, Y7, AB8, W9, AB6, Y9, U5, R6, U6, R4, Y6, T4, V5, T5, W2, Y1, T1, U3, U2, V2, U1, Y2]
        dm: [AA4, V7, T6, W1]
        dqs: ['Y3,AA3', 'V9,V8', 'W6,W5', 'R3,R2']
    onboard_serdes_q0:   # SerDes quad Q0 (4 lanes + 2 reference clocks), balls of the FPGA transceiver
      device:
        name: SerDes quad Q0 (4 lanes + 2 reference clocks), balls of the FPGA transceiver
        kind: serdes
      shares: [onboard_pcie, onboard_usr_clk]   # the board multiplexes these pins
      pins:
        lane0_tx: B4,A4
        lane0_rx: B8,A8
        lane1_tx: D7,C7
        lane1_rx: D9,C9
        lane2_tx: B6,A6
        lane2_rx: B10,A10
        lane3_tx: D5,C5
        lane3_rx: D11,C11
        refclk0: F6,E6
        refclk1: F10,E10
    onboard_pcie:   # PCIe x4 edge connector J4 (PCIe add-in card, board is the endpoint)
      device:
        name: PCIe x4 edge connector J4 (PCIe add-in card, board is the endpoint)
        kind: pcie
      active: "low"
      shares: [onboard_serdes_q0]   # the board multiplexes these pins
      pins:
        perst_n: W11
        refclk: F6,E6
        rx0: B8,A8
        tx0: B4,A4
        rx1: D9,C9
        tx1: D7,C7
        rx2: B10,A10
        tx2: B6,A6
        rx3: D11,C11
        tx3: D5,C5
    onboard_adc:   # ADC input connector J11 (2 differential channels, dedicated ADC balls)
      device:
        name: ADC input connector J11 (2 differential channels, dedicated ADC balls)
        kind: adc
      pins:
        adcv_n: M9
        adcv_p: L10
        adct_n: N9
        adct_p: N10
    onboard_sma_gpio:   # SMA_GPIO net pair on SOM (IOL2A)
      device:
        name: SMA_GPIO net pair on SOM (IOL2A)
        kind: other
      pins:
        p: B1
        n: A1
    onboard_dip_switch:   # DIP switch SW2 position 4 (DIP_Switch_0)
      device:
        name: DIP switch SW2 position 4 (DIP_Switch_0)
        kind: switches
      active: "low"
      pins:
        sw0: AB12
    onboard_usr_clk:   # MS5351M clock generator (USR_CLK_IN to fabric, SerDes refclk1)
      device:
        name: MS5351M clock generator (USR_CLK_IN to fabric, SerDes refclk1)
        kind: clock
        id: ruimeng_ms5351m
      shares: [onboard_serdes_q0]   # the board multiplexes these pins
      pins:
        usr_clk_in: V13
        refclk1: F10,E10
    onboard_uart:   # BL616 USB-JTAG & UART debugger (USB-C J7 "USB-DEBUG")
      device:
        name: BL616 USB-JTAG & UART debugger (USB-C J7 "USB-DEBUG")
        kind: uart
        id: bouffalo_bl616
      iostandard: "LVCMOS33"
      shares: [som_debug]   # the board multiplexes these pins
      pins:
        tx: U15
        rx: V14
        jtag_tms: T13
        jtag_tck: V12
        jtag_tdi: R13
        jtag_tdo: U13
    onboard_hdmi_rx:   # HDMI (DVI) connector J29, receive (same connector, DVI_DIR_SEL=0)
      device:
        name: HDMI (DVI) connector J29, receive (same connector, DVI_DIR_SEL=0)
        kind: hdmi_rx
      shares: [onboard_hdmi_0]   # the board multiplexes these pins
      pins:
        clk: G15,G16
        d0: J14,H14
        d1: J15,H15
        d2: K17,J17
        hpd: K13
        ddc_scl: M13
        ddc_sda: L13
        dir_sel: K14
    onboard_ethernet:   # Gigabit Ethernet RTL8211F-CG (U10, RJ45 J12), RGMII
      device:
        name: Gigabit Ethernet RTL8211F-CG (U10, RJ45 J12), RGMII
        kind: ethernet_rgmii
        id: realtek_rtl8211f
      active: "low"
      iostandard: "LVCMOS33"
      pins:
        txc: F20
        tx_ctl: F21
        txd: [D21, E21, D22, E22]
        rxc: G21
        rx_ctl: G22
        rxd: [F18, E18, C22, B22]
        mdc: V18
        mdio: U22
        rst_n: W20
        phy_clk_25m: V19
    onboard_sdcard:   # microSD slot J31 (TF-101A)
      device:
        name: microSD slot J31 (TF-101A)
        kind: sdcard
      iostandard: "LVCMOS33"
      shares: [sdio_header]   # the board multiplexes these pins
      pins:
