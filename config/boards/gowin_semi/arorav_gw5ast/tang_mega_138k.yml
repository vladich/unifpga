        kind: audio_i2s
        id: princeton_pt8211
      model_params:   # PT8211: LSB-justified input
        align_right: 1
        offset_by_one_cycle: 0
      active: "low"
      iostandard: "LVCMOS33"
      pins:
        bck: Y17
        ws: AB17
        din: AA16
        pa_en_n: AB16
    onboard_ws2812:   # WS2812B-2020 RGB LED (U15) + aRGB strip connector J24
      device:
        name: WS2812B-2020 RGB LED (U15) + aRGB strip connector J24
        kind: ws2812
        id: worldsemi_ws2812
      pins:
        din: J16
    onboard_camera:   # OV5640 camera FPC J15 (DVP, 24-pin 0.5 mm)
      device:
        name: OV5640 camera FPC J15 (DVP, 24-pin 0.5 mm)
        kind: camera_dvp
        id: omnivision_ov5640
