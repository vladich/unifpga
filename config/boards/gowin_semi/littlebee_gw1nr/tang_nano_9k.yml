# tang_nano_9k pin map.


Board:
  id: tang_nano_9k
  name: Tang Nano 9k
  product: Sipeed Tang Nano 9K
  summary: Gowin GW1NR-LV9QN88PC6/I5 (8640 LUT4, 64 Mbit PSRAM in package, 608 Kbit user flash), 32 Mbit P25Q32U SPI
    flash, BL702 USB-JTAG + UART, HDMI (TMDS from LVCMOS pins, shared with RGB LCD), 40-pin RGB LCD FPC, 8-pin 1.14"
    SPI LCD FPC, microSD (SPI wiring), 6 LEDs, 2 buttons, 27 MHz, 2x24 2.54 mm pads
  url: https://wiki.sipeed.com/hardware/en/tang/Tang-Nano-9K/Nano-9K.html
  producer: sipeed
