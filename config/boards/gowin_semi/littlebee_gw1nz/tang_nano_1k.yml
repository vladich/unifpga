  name: Tang Nano 1K
  product: Tang Nano 1K
  summary: Gowin GW1NZ-LV1QN48C6/I5 (GW1NZ-1, 1152 LUT4, 72 kbit BSRAM, 64 kbit user flash, 1 PLL) on board 6100;
    27 MHz oscillator, BL702 USB-JTAG, RGB LED, 2 buttons, 40-pin RGB LCD FPC, IPS6404L QSPI PSRAM footprint, two
    20-pin headers
