  - usb_3_device
  - usb_uart_bridge
  - usb_jtag_bridge
  - pmod_connector
  - rgb_leds
  - user_buttons
  - user_leds
  - adc_chip
  - dip_switches
  - addressable_leds
  - sdr_sdram
  - joystick
  - fan_header
  devices:
  - microsd_socket_generic
  - winbond_w25q64
