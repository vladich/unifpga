  toolchain_options:
    yosys:
      synth_options: []
      loader_board: "tangprimer20k"
      device_part: "GW2A-LV18PG256C8/I7"
      device_family: "GW2A-18"
      device_pack: "GW2A-18"
    gowin:
      set_device: "GW2A-LV18PG256C8/I7 -name GW2A-18C -device_version C"
      options: [use_sspi_as_gpio, use_ready_as_gpio, use_done_as_gpio]
      gprj_device: '<Device name="GW2A-18C" pn="GW2A-LV18PG256C8/I7">gw2a18c-011</Device>'
    # nextpnr-gowin (apicula) names this family GW2A-18 and rejects an rPLL
    # whose DEVICE parameter says otherwise (leave the primitive default).
    apicula:
      rpll_device: GW2A-18
  banks:
    clk: { pins: H11, frequency_mhz: 27, source: {doc: som, where: U10 27MHz Oscillator OUT -> R20 22R -> H11_IOT27A_OSC_CK (IOT27A/GCLKT_0)} }
    onboard_leds:
      source: {doc: dock3714, where: 'sheet 1 P007_Things: Orange_LED0 C13 (DONE), LED1 A13 (READY), LED2 N16, LED3 N14, LED4 L14, LED5 L16; sheet 9 "LED x 6": +3V3 -> LED -> 510R -> Orange_LEDx'}
      active: low
      pins: [C13, A13, N16, N14, L14, L16]
    onboard_uart:
      source: {doc: dock3714, where: 'sheet 1 P001_Bl702: BL702_UART1_RX <- M11_IOR27B_FPGA_TXO, BL702_UART1_TX -> T13_IOR8B_FPGA_RXO; sheet 2 RN1 0R'}
      pins:
        tx: M11
        rx: T13
    onboard_switches:
      source: {doc: dock3714, where: 'sheet 1 P007_Things: SW0 C7_1V5, SW1 E9_1V5, SW2 E8_1V5, SW3 T4_1V5, SW4 T5_1V5; sheet 9: switch to +1V5 via 1.5K, 13K to GND'}
      active: high    # ON pulls the pin to +1V5 (schematic 3713); BGM's ~SW inverted them
      pins: [E9, E8, T4, T5]
    onboard_buttons:
      source: {doc: dock3714, where: 'sheet 1 P007_Things: Key_0 T10_FPGA_~RST, Key_1 T3_1V5, Key_2 T2_1V5, Key_3 D7_1V5, Key_4 B10_~RECFG; sheet 9: 10K pull-ups (+3V3 on Key_0/Key_4, +1V5 on Key_1..3), key to GND'}
      active: low
      pins: [T10, T3, T2, D7, C7]
    gpio_3:
      source: {doc: dock3714, where: 'sheet 4 J5 Conn_02x06: 5 RGB_LCD_R0, 6 R1, 7 R2, 8 R3, 9 R4, 10 G0, 11 G1, 12 G2'}
      pins: [A11, N6, N9, L9, B11, D11, N7, N8]
    gpio_2:
      source: {doc: dock3714, where: 'sheet 4 J6 Conn_02x06: 5 RGB_LCD_B0, 6 B1, 7 B2, 8 B3, 9 B4, 10 HSYNC, 11 VSYNC, 12 DE'}
      pins: [D14, B14, B13, B12, E15, A15, A14, C12]
    gpio_1:
      source: {doc: dock3714, where: 'sheet 8 J12 Conn_02x06: 5 DVP_D7, 6 D6, 7 D5, 8 D4, 9 D0, 10 D3, 11 D1, 12 D2'}
      pins: [P11, R11, M15, J16, T11, T12, M14, J14]
    gpio_0:
      source: {doc: dock3714, where: 'sheet 9 J14 Conn_02x06: 1/2 +3V3, 3/4 GND, 5 MIC_LED_CLK, 6 MIC_LED_DAT, 7 MIC_DAT1, 8 MIC_DAT0, 9 MIC_DAT2, 10 MIC_DAT3, 11 MIC_BCK, 12 MIC_WS'}
      pins: [P6, T7, P8, T9, T6, R8, T8, P9]
    onboard_pa_enable: { pins: R16, source: {doc: dock3714, where: sheet 1 003_Audio PA_EN R16; sheet 7 U13 EN} }
    onboard_headphone:
      source: {doc: dock3714, where: 'sheet 1 003_Audio: HP_BCK N15, HP_DIN P15, HP_WS P16; sheet 7 U10 PT8211-S, LMV321 filters'}
      pins:
        din: P15
        ws: P16
        bck: N15
    onboard_hdmi:
      source: {doc: dock3714, where: 'sheet 1 P004_HDMI: TX0 H14/H16, TX1 J15/K16, TX2 K14/K15, TXC G16/H15, HPD J11, CEC L12, SDA F14, SCL F16; sheet 3 RCLAMP0524P, 100nF series caps, 499R pull-downs, 2N7002 DDC/CEC level shifters'}
      pins:
        clk_p: "G16,H15"
        d_p: ["H14,H16", "J15,K16", "K14,K15"]
        clk_n: H15
        d_n: [H16, K16, K15]
    onboard_lcd:
      source: {doc: dock3714, where: 'sheet 1 P006_LCD: RGB_LCD_R0..R4, G0..G5, B0..B4, CLK R9, HSYNC A15, VSYNC D14, DE E15, BL E10; sheet 4 J7 FPC 40P'}
      pins:
        bl: E10
        ck: R9
        de: E15
        hs: A15
        vs: D14
        r: [L9, N8, N9, N7, N6]
        g: [D11, A11, B11, P7, R7, D10]
        b: [B12, C12, B13, A14, B14]
    onboard_ddr3:   # DDR3 SDRAM UD1 (H5TQ1G63EFR-PBC, 64M x16, 128 MB)
      source: {doc: som, where: 'FPGA banks 4/5/6 symbol: DDR3_A0..A13, DDR3_BA0..2, DDR3_~RAS/~CAS/~WE/~CS0, DDR3_LDM/UDM, DDR3_DQ0..15, DDR3_DQSL_P/N, DDR3_DQSU_P/N, DDR3_CK_P/N, DDR3_CKEN, DDR3_ODT0, DDR3_~RST'}
      device: {"name": "DDR3 SDRAM UD1 (H5TQ1G63EFR-PBC, 64M x16, 128 MB)", "kind": "ddr3"}
      iostandard: "SSTL15 (SSTL15D for dqs/ck; LiteX)"
      pins: {"a": ["F7", "A4", "D6", "F8", "C4", "E6", "B1", "D8", "A5", "F9", "K3", "B7", "A3", "C8"], "ba": ["H4", "D3", "H5"], "ras_n": "R4", "cas_n": "R6", "we_n": "L2", "cs_n": "P5", "dm": ["G1", "K5"], "dq": ["G5", "F5", "F4", "F3", "E2", "C1", "E1", "B3", "M3", "K4", "N2", "L1", "P4", "H3", "R1", "M2"], "dqs": ["G2,G3", "J5,K6"], "ck": "J1,J3", "cke": "J2", "odt": "R3", "reset_n": "B9"}
    onboard_flash:   # SPI NOR flash U9 (XT25B32-S, 32 Mbit; configuration flash)
      source: {doc: som, where: 'U9 XT25B32: ~CS <- M9_IOR34A_FLASH_SPI_~CS (MCS_N), CLK <- L10_IOR34B (MCLK), IO1/DO -> P10_IOR33A (MI), IO0/DI <- R10_IOR33B (MO); WP/HOLD pulled up 4.7K'}
      device: {"name": "SPI NOR flash U9 (XT25B32-S, 32 Mbit; configuration flash)", "kind": "flash", "id": "xtx_xt25b32"}
      iostandard: "LVCMOS33"
      pins: {"cs_n": "M9", "clk": "L10", "miso": "P10", "mosi": "R10"}
    onboard_sdcard:   # microSD card slot J2 (SDIO, push-pull)
      source: {doc: som, where: 'J2 MOLEX 1040310811: DAT0 M8_IOR36A_SDIO_D0, DAT1 M7_IOR47A_SDIO_D1, DAT2 M10_IOR22A_SDIO_D2, DAT3/CD N11_IOR22B_SDIO_D3, CMD R14_IOR7B_SDIO_CMD, CLK N10_IOR27A_SDIO_CLK, DET_A D15_IOR5B_SDIO_DET (4.7K pull-up)'}
      device: {"name": "microSD card slot J2 (SDIO, push-pull)", "kind": "sdcard"}
      iostandard: "LVCMOS33"
      pins: {"clk": "N10", "cmd": "R14", "d": ["M8", "M7", "M10", "N11"], "cd": "D15"}
    onboard_spi_lcd:   # SPI LCD FPC connector J3 (8P 0.5 mm, e.g. 1.14" ST7789)
      source: {doc: som, where: 'J3 Conn_FPC_8P: LEDA via Q1 Si2301 gate P12_IOR8A_LCD_~BL, RESET G13_IOT12B_LCD_~RST, RS J13_IOT27B_LCD_RS, SDA L15_IOT2A_LCD_SDA, SCL F12_IOT12A_LCD_SCL (R26 22R), CS C16_IOT5A_LCD_~CS'}
      device: {"name": "SPI LCD FPC connector J3 (8P 0.5 mm, e.g. 1.14\" ST7789)", "kind": "lcd_spi"}
      iostandard: "LVCMOS33"
      pins: {"bl_n": "P12", "rst_n": "G13", "rs": "J13", "sda": "L15", "scl": "F12", "cs_n": "C16"}
    onboard_reset:   # Reset supervisor U4 (SGM803, 2.93 V) on FPGA_RST
      source: {doc: som, where: U4 SGM803 ~RESET -> T10_IOR35B_FPGA_~RST (150K pull-up); T10 also on CARD1 pin 15}
      device: {"name": "Reset supervisor U4 (SGM803, 2.93 V) on FPGA_RST", "kind": "reset"}
      active: "low"
      iostandard: "LVCMOS33"
      shares: ["onboard_buttons"]   # the board multiplexes these pins
      pins: {"rst_n": "T10"}
    onboard_jtag:   # JTAG + UART JST SH 1.0 8-pin connector J1 (SOM)
      source: {doc: som, where: 'J1 JST_SHL_SM08B: 1 +5V, 2 B8_IOR25B_JTAG_TMS, 3 C6_IOR25A_JTAG_TDO, 4 A7_IOR26A_JTAG_TCK, 5 A6_IOR26B_JTAG_TDI, 6 T13_IOR8B_FPGA_RXO (FPGA RX), 7 M11_IOR27B_FPGA_TXO (FPGA TX), 8 GND'}
      device: {"name": "JTAG + UART JST SH 1.0 8-pin connector J1 (SOM)", "kind": "header"}
      shares: ["onboard_other_2", "onboard_uart"]   # the board multiplexes these pins
      pins: ["B8", "C6", "A7", "A6", "T13", "M11"]
    onboard_configuration_mode_pins_mode0_2:   # Configuration mode pins MODE0..2
      device: {"name": "Configuration mode pins MODE0..2", "kind": "other"}
      pins: {"mode0": "M16", "mode1": "B16", "mode2": "C15"}
    onboard_other:   # Configuration status/control pins RECONFIG_N, READY, DONE
      device: {"name": "Configuration status/control pins RECONFIG_N, READY, DONE", "kind": "other"}
      shares: ["onboard_leds"]   # the board multiplexes these pins
      pins: {"reconfig_n": "B10", "ready": "A13", "done": "C13"}
    onboard_other_2:   # BL702 USB-JTAG (FPGA configuration JTAG)
      device: {"name": "BL702 USB-JTAG (FPGA configuration JTAG)", "kind": "other", "id": "bouffalo_bl702"}
      shares: ["onboard_jtag"]   # the board multiplexes these pins
      pins: {"tck": "A7", "tms": "B8", "tdi": "A6", "tdo": "C6"}
    onboard_ws2812:   # WS2812B RGB LED U17
      source: {doc: dock3714, where: sheet 1 P007_Things WS2812-DAT <- T9 (DFP_IOR38_P); sheet 9 U17 DIN via R91 100R}
      device: {"name": "WS2812B RGB LED U17", "kind": "ws2812", "id": "worldsemi_ws2812"}
      iostandard: "LVCMOS33"
      shares: ["gpio_0"]   # the board multiplexes these pins
      pins: {"din": "T9"}
    onboard_touch:   # Capacitive touch panel FPC J4 (6P)
      source: {doc: dock3714, where: 'sheet 1 P006_LCD: TP_SDA F14, TP_SCK F16, TP_INT C11, TP_RST A12; sheet 4 J4'}
      device: {"name": "Capacitive touch panel FPC J4 (6P)", "kind": "other"}
      iostandard: "LVCMOS33"
      shares: ["onboard_camera", "onboard_ethernet"]   # the board multiplexes these pins
      pins: {"sda": "F14", "scl": "F16", "int": "C11", "rst": "A12"}
    onboard_camera:   # DVP camera FPC J11 (24P, e.g. OV5640/OV2640)
      source: {doc: dock3714, where: 'sheet 1 P008_Carmera: DVP_D0..D7, SCL F14, SDA F16, PCLK F13, XCLK G12, RST L13, VSYNC G15, PWDN C10, HSYNC G14; sheet 8 J11, Q4 2N7002KD SCCB level converter, U20 74LVC1T45 XCLK buffer'}
      device: {"name": "DVP camera FPC J11 (24P, e.g. OV5640/OV2640)", "kind": "camera_dvp"}
      iostandard: "LVCMOS33"
      shares: ["gpio_1", "onboard_ethernet", "onboard_touch"]   # the board multiplexes these pins
      pins: {"d": ["T12", "T11", "P11", "R11", "M15", "M14", "J16", "J14"], "pclk": "F13", "xclk": "G12", "vsync": "G15", "hsync": "G14", "rst_n": "L13", "pwdn": "C10", "scl": "F14", "sda": "F16"}
    onboard_ethernet:   # Ethernet PHY RTL8201F-VB-CG (10/100, RMII, RJ45)
      source: {doc: dock3714, where: 'sheet 1 P005 Ethernet: RTL_PHY_TXD0 D16, TXD1 E14, TXEN E16, ~RST F10, MDC F14, MDIO F16, RXD0 F15, RXD1 C9, CRS M6, RXER L8, TXCLK A9; sheet 6 RTL8201F'}
      device: {"name": "Ethernet PHY RTL8201F-VB-CG (10/100, RMII, RJ45)", "kind": "ethernet", "id": "realtek_rtl8201f"}
      iostandard: "LVCMOS33"
      shares: ["onboard_camera", "onboard_touch", "onboard_usb_ulpi"]   # the board multiplexes these pins
      pins: {"ref_clk": "A9", "tx_en": "E16", "txd": ["D16", "E14"], "rxd": ["F15", "C9"], "crs_dv": "M6", "rx_er": "L8", "mdc": "F14", "mdio": "F16", "rst_n": "F10"}
    onboard_usb_ulpi:   # USB 2.0 ULPI PHY U6 USB3317 (USB-C "OTG" J8, SW2 selects device/host)
      source: {doc: dock3714, where: 'sheet 1 P002_USB PHY: USB_DATA0..7, USB_RESET F10, USB_NXT K13, USB_DIR K12, USB_STP K11, USB_CLKOUT T15; sheet 5 U6 USB3317 (RN3..RN5 22R), 26 MHz U7'}
      device: {"name": "USB 2.0 ULPI PHY U6 USB3317 (USB-C \"OTG\" J8, SW2 selects device/host)", "kind": "usb", "id": "microchip_usb3317"}
      iostandard: "LVCMOS33"
      shares: ["onboard_ethernet"]   # the board multiplexes these pins
      pins: {"data": ["G11", "H12", "J12", "H13", "T14", "R13", "P13", "R12"], "clk": "T15", "dir": "K12", "nxt": "K13", "stp": "K11", "rst": "F10"}
  # ---- drawn: headers and parts; ./unifpga layout draft tang_primer_20k_dock regenerates from here on ----
  # Physical layout of the Tang Primer 20K Dock (with the 20K SOM).
  # Header pins: Sipeed's Dock schematic 3713 (J5, J6, J12, J14 are Conn_02x06
  # with pins 1 / 2 = 3V3, 3 / 4 = GND, 5-12 signals; nets traced to FPGA balls
  # through the SO-DIMM page). Our pinmap's gpio_0 / gpio_1 list the even row
  # first, gpio_2 / gpio_3 the odd row first: the pins below are by schematic
  # number, so both read correctly. Which row faces the board edge (the Pmod
  # pin 1-6 row) is not visible in the schematic and is not assumed here.
  layout: {verified: true, generated: false}

  headers:
    - id: j14
      type: sipeed_2x6
      label: J14 (mic array)
      bank: gpio_0
      pins: {12: "gpio_0[0]", 10: "gpio_0[1]", 8: "gpio_0[2]", 6: "gpio_0[3]",
             11: "gpio_0[4]", 9: "gpio_0[5]", 7: "gpio_0[6]", 5: "gpio_0[7]"}
    - id: j12
      type: sipeed_2x6
      label: J12 (camera)
      bank: gpio_1
      pins: {12: "gpio_1[0]", 10: "gpio_1[1]", 8: "gpio_1[2]", 6: "gpio_1[3]",
             11: "gpio_1[4]", 9: "gpio_1[5]", 7: "gpio_1[6]", 5: "gpio_1[7]"}
    - id: j6
      type: sipeed_2x6
      label: J6 (LCD B / sync)
      bank: gpio_2
      pins: {11: "gpio_2[0]", 9: "gpio_2[1]", 7: "gpio_2[2]", 5: "gpio_2[3]",
             12: "gpio_2[4]", 10: "gpio_2[5]", 8: "gpio_2[6]", 6: "gpio_2[7]"}
    - id: j5
      type: sipeed_2x6
      label: J5 (LCD R / G)
      bank: gpio_3
      pins: {11: "gpio_3[0]", 9: "gpio_3[1]", 7: "gpio_3[2]", 5: "gpio_3[3]",
             12: "gpio_3[4]", 10: "gpio_3[5]", 8: "gpio_3[6]", 6: "gpio_3[7]"}

  parts:
    - id: clock
      label: 27 MHz oscillator
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: leds
      label: LED0-LED5
      attach: {peripheral: led_bank, params: {active: low, width: 6}, bind: {led: onboard_leds}}
    - id: uart
      label: USB-UART (BL702)
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: switches
      label: SW1-SW4
      attach: {peripheral: sw_bank, params: {width: 4}, bind: {sw: onboard_switches}}
    - id: buttons
      label: KEY1-KEY5
      attach: {peripheral: button_array, params: {width: 5}, bind: {btn: onboard_buttons}}
    - id: hdmi
      label: HDMI out
      attach: {peripheral: hdmi_tmds, bind: {clk_p: onboard_hdmi.clk_p, d_p: onboard_hdmi.d_p,
                                             clk_n: onboard_hdmi.clk_n, d_n: onboard_hdmi.d_n}}
    - id: ws2812
      label: WS2812B RGB LED U17
      attach: {peripheral: ws2812, bind: {din: onboard_ws2812.din}}
    - id: headphone
      label: Headphone DAC + speaker amplifier
      attach: {peripheral: i2s_audio_out, params: {align_right: 1, offset_by_one_cycle: 0},
               bind: {bclk: onboard_headphone.bck, lrclk: onboard_headphone.ws,
                      sdata: onboard_headphone.din, pa_en: onboard_pa_enable}}
    - id: lcd
      label: 40-pin RGB LCD connector (5" 800x480 panel)
      shares: [j5, j6]
      attach: {peripheral: lcd_800_480,
               params: {clock_pixel_pll: {idiv: 8, fbdiv: 10, odiv: 16, sdiv: 2, clkoutd: false}, bl: context.rst_n},
               bind: {r: onboard_lcd.r, g: onboard_lcd.g, b: onboard_lcd.b, hs: onboard_lcd.hs,
                      vs: onboard_lcd.vs, de: onboard_lcd.de, ck: onboard_lcd.ck, bl: onboard_lcd.bl}}
    - id: sdcard
      label: microSD card slot J2
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_sdcard.clk, cmd: onboard_sdcard.cmd, dat0: 'onboard_sdcard.d[0]', dat3: 'onboard_sdcard.d[3]'}}
