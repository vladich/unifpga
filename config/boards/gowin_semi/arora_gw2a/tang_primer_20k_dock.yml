# tang_primer_20k_dock pin map.


Board:
  id: tang_primer_20k_dock
  name: Tang Primer 20k Dock
  product: Tang Primer 20K Dock
  summary: 'Tang Primer 20K SOM (Gowin GW2A-LV18PG256C8/I7, 20736 LUT4, 128 MB DDR3, 32 Mbit flash, microSD, SPI-LCD
    FPC) on the Dock: BL702 USB-JTAG/UART, 6 LEDs, 5 keys, 5-way DIP, WS2812, HDMI (DVI), 40P RGB LCD + touch, DVP
    camera, PT8211 audio, RTL8201F RMII Ethernet, USB3317 ULPI, mic-array FPC, 4 Pmods'
  url: https://wiki.sipeed.com/hardware/en/tang/tang-primer-20k/primer-20k.html
  producer: sipeed
  chip: GW2A-LV18PG256C8/I7
  bridges:
  - jtag
  programmer: openFPGALoader
  features:
  - microsd_socket
  - ddr3_memory
  - spi_flash
  - spi_lcd
  - addressable_leds
  - parallel_camera_input
  - ethernet_phy_10_100
  devices:
  - microsd_socket_generic
  - xtx_xt25b32
  - bouffalo_bl702
  - worldsemi_ws2812
  - microchip_usb3317
  - realtek_rtl8201f
