  toolchain_options:
    yosys:
      loader_board: "tangprimer20k"          # openFPGALoader -b
    gowin:
      set_device: "GW2A-LV18PG256C8/I7 -name GW2A-18 -device_version C"
      options: [use_sspi_as_gpio, use_ready_as_gpio, use_done_as_gpio]
      gprj_device: '<Device name="GW2A-18C" pn="GW2A-LV18PG256C8/I7">gw2a18c-011</Device>'
  banks:
    clk:
      pins: H11
      frequency_mhz: 27
      iostandard: LVCMOS33
      source:
        doc: som
        where: U10 27MHz Oscillator OUT -> R20 22R -> H11_IOT27A_OSC_CK (IOT27A/GCLKT_0)
    onboard_switches:
      source:
        doc: lite3711
        where: SW6 common -> D7_IOL53B_1V5, SW7 common -> C7_IOL40B_1V5; throws to +1V5 via 10K (R3/R5) or GND via 10K (R4/R102)
      iostandard: LVCMOS33
      active: low
      pins: [C7, D7]
    onboard_buttons:
      source:
        doc: lite3711
        where: SW1 to GND on T10_IOR35B_FPGA_~RST (R1 10K to +3V3), SW2 to GND on T2_IOB48B_1V5 (R2 10K to +1V5)
      iostandard: LVCMOS33
      active: low
      pins: [T10, T2]
    gpio_3:
      source:
        doc: lite3711
        where: 'J6 Conn_02x06: 5 D11, 6 F10, 7 E10, 8 D10, 9 P7, 10 R7, 11 L8, 12 M6 (1/2 +3V3, 3/4 GND)'
      iostandard: LVCMOS33
      pins: [L8, P7, E10, D11, M6, R7, D10, F10]
    gpio_2:
      source:
        doc: lite3711
        where: 'J2 Conn_02x06: 5 L12, 6 J11, 7 C9, 8 A9, 9 D16, 10 E14, 11 F15, 12 E16 (LVDS_TX2_P, 0/IOT6A/E16)'
      iostandard: LVCMOS33
      pins: [F15, D16, C9, L12, E16, E14, A9, J11]   # [4]: E16 (schematic 3711 J2 pin 12; BGM's cst had E15)
    gpio_1:
      source:
        doc: lite3711
        where: 'J8 Conn_02x06: 5 L16, 6 L14, 7 N16, 8 N14, 9 P16, 10 N15, 11 R16, 12 P15'
      iostandard: LVCMOS33
      pins: [R16, P16, N16, L16, P15, N15, N14, L14]
    gpio_0:
      source:
        doc: lite3711
        where: 'J7 Conn_02x06: 5 T9, 6 P9, 7 T8, 8 P8, 9 T7, 10 R8, 11 T6, 12 P6'
      iostandard: LVCMOS33
      pins: [T6, T7, T8, T9, P6, R8, P8, P9]
    onboard_ddr3:   # DDR3 SDRAM UD1 (H5TQ1G63EFR-PBC, 64M x16, 128 MB)
      source:
        doc: som
        where: 'FPGA banks 4/5/6 symbol: DDR3_A0..A13, DDR3_BA0..2, DDR3_~RAS/~CAS/~WE/~CS0, DDR3_LDM/UDM, DDR3_DQ0..15, DDR3_DQSL_P/N, DDR3_DQSU_P/N, DDR3_CK_P/N, DDR3_CKEN, DDR3_ODT0, DDR3_~RST'
      device:
        name: DDR3 SDRAM UD1 (H5TQ1G63EFR-PBC, 64M x16, 128 MB)
        kind: ddr3
      iostandard: "SSTL15 (SSTL15D for dqs/ck; LiteX)"
      pins:
        a: [F7, A4, D6, F8, C4, E6, B1, D8, A5, F9, K3, B7, A3, C8]
        ba: [H4, D3, H5]
        ras_n: R4
        cas_n: R6
        we_n: L2
        cs_n: P5
        dm: [G1, K5]
        dq: [G5, F5, F4, F3, E2, C1, E1, B3, M3, K4, N2, L1, P4, H3, R1, M2]
        dqs: ['G2,G3', 'J5,K6']
        ck: J1,J3
        cke: J2
        odt: R3
        reset_n: B9
    onboard_flash:   # SPI NOR flash U9 (XT25B32-S, 32 Mbit; configuration flash)
      source:
        doc: som
        where: 'U9 XT25B32: ~CS <- M9_IOR34A_FLASH_SPI_~CS (MCS_N), CLK <- L10_IOR34B (MCLK), IO1/DO -> P10_IOR33A (MI), IO0/DI <- R10_IOR33B (MO); WP/HOLD pulled up 4.7K'
      device:
        name: SPI NOR flash U9 (XT25B32-S, 32 Mbit; configuration flash)
        kind: flash
        id: xtx_xt25b32
      iostandard: "LVCMOS33"
      pins:
        cs_n: M9
        clk: L10
        miso: P10
        mosi: R10
    onboard_sdcard:   # microSD card slot J2 (SDIO, push-pull)
      source:
        doc: som
        where: 'J2 MOLEX 1040310811: DAT0 M8_IOR36A_SDIO_D0, DAT1 M7_IOR47A_SDIO_D1, DAT2 M10_IOR22A_SDIO_D2, DAT3/CD N11_IOR22B_SDIO_D3, CMD R14_IOR7B_SDIO_CMD, CLK N10_IOR27A_SDIO_CLK, DET_A D15_IOR5B_SDIO_DET (4.7K pull-up)'
      device:
        name: microSD card slot J2 (SDIO, push-pull)
        kind: sdcard
      iostandard: "LVCMOS33"
      pins:
        clk: N10
        cmd: R14
        d: [M8, M7, M10, N11]
        cd: D15
    onboard_spi_lcd:   # SPI LCD FPC connector J3 (8P 0.5 mm, e.g. 1.14" ST7789)
      source:
        doc: som
        where: 'J3 Conn_FPC_8P: LEDA via Q1 Si2301 gate P12_IOR8A_LCD_~BL, RESET G13_IOT12B_LCD_~RST, RS J13_IOT27B_LCD_RS, SDA L15_IOT2A_LCD_SDA, SCL F12_IOT12A_LCD_SCL (R26 22R), CS C16_IOT5A_LCD_~CS'
      device:
        name: SPI LCD FPC connector J3 (8P 0.5 mm, e.g. 1.14" ST7789)
        kind: lcd_spi
      iostandard: "LVCMOS33"
      pins:
        bl_n: P12
        rst_n: G13
        rs: J13
        sda: L15
        scl: F12
        cs_n: C16
    onboard_reset:   # Reset supervisor U4 (SGM803, 2.93 V) on FPGA_RST
      source:
        doc: som
        where: U4 SGM803 ~RESET -> T10_IOR35B_FPGA_~RST (150K pull-up); T10 also on CARD1 pin 15
      device:
        name: Reset supervisor U4 (SGM803, 2.93 V) on FPGA_RST
        kind: reset
      active: "low"
      iostandard: "LVCMOS33"
      shares: [onboard_buttons]   # the board multiplexes these pins
      pins:
        rst_n: T10
    onboard_jtag:   # JTAG + UART JST SH 1.0 8-pin connector J1 (SOM)
      source:
        doc: som
        where: 'J1 JST_SHL_SM08B: 1 +5V, 2 B8_IOR25B_JTAG_TMS, 3 C6_IOR25A_JTAG_TDO, 4 A7_IOR26A_JTAG_TCK, 5 A6_IOR26B_JTAG_TDI, 6 T13_IOR8B_FPGA_RXO (FPGA RX), 7 M11_IOR27B_FPGA_TXO (FPGA TX), 8 GND'
      device:
        name: JTAG + UART JST SH 1.0 8-pin connector J1 (SOM)
        kind: header
      shares: [gpio_j1, gpio_j3]   # the board multiplexes these pins
      pins: [B8, C6, A7, A6, T13, M11]
    onboard_configuration_mode_pins_mode0_2:   # Configuration mode pins MODE0..2
      device:
        name: Configuration mode pins MODE0..2
        kind: other
      pins:
        mode0: M16
        mode1: B16
        mode2: C15
    onboard_other:   # Configuration status/control pins RECONFIG_N, READY, DONE
      device:
        name: Configuration status/control pins RECONFIG_N, READY, DONE
        kind: other
      shares: [gpio_j1]   # the board multiplexes these pins
      pins:
        reconfig_n: B10
        ready: A13
        done: C13
    gpio_j1:   # 40-pin header J1 (2x20)
      source:
        doc: lite3711
        where: 'J1 Conn_02x20: 1/2 +3V3, 3/4 +5V, 5/6/8 GND, 7 T5, 9 T3, 10 T4, 11 F_VCCO0&1, 12 F_VCCO7, 13 E9, 14 E8, 15 T15, 16 C13 (DONE), 17 T13 (FPGA_RXO), 18 M11 (FPGA_TXO), 19 B10 (RECFG), 20 A13 (READY), 21-40 as listed'
      device:
        name: 40-pin header J1 (2x20)
        kind: header
      shares: [onboard_jtag, onboard_other]   # the board multiplexes these pins
      pins: [T5, T3, T4, E9, E8, T15, C13, T13, M11, B10, A13, H12, G11, H13, J12, K12, K13, L13, K11, R11, T12, P11, T11, G16, H15, H16, H14, K16, J15, K15, K14]
    gpio_j3:   # 40-pin header J3 (2x20)
      source:
        doc: lite3711
        where: 'J3 Conn_02x20: 1 +3V3, 2 GND, 16 GND, others as listed (11-14 = JTAG TDI/TCK/TDO/TMS)'
      device:
        name: 40-pin header J3 (2x20)
        kind: header
      shares: [gpio_2, onboard_jtag]   # the board multiplexes these pins
      pins: [N6, N7, B11, A12, L9, N8, R9, N9, A6, A7, C6, B8, C10, A11, C11, B12, C12, B13, A14, B14, A15, D14, E15, F16, F14, G15, G14, J14, J16, G12, F13, M14, M15, T14, R13, P13, R12]
