# microchip_iglooicicle: PolarFire SoC Icicle Kit.

Board:
  id: microchip_iglooicicle
  name: PolarFire SoC Icicle Kit
  url: https://www.microchip.com/en-us/development-tool/MPFS-ICICLE-KIT-ES
  producer: microchip
  chip: MPFS250T-FCVG484EES
  bridges:
  - jtag
  programmer: libero_fpexpress
  features:
  - ethernet_phy_gigabit
  - microsd_socket
  - spi_flash
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - ftdi_ft4232h
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - winbond_w25q128
  - microchip_ksz9031rnx
