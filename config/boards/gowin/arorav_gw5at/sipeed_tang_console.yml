# sipeed_tang_console pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/sipeed_tang_console.py

Board:
  id: sipeed_tang_console
  pinBanks:
    sys_clk:
      pins: V22
    onboard_leds:
      pins: [G11, U12]
    onboard_uart:
      pins:
        rx: V14
        tx: U15
    pcie_rst_n:
      pins:
        pin: W11
    pcie_wake_n:
      pins:
        pin: T14
    qspi_flash_clk:
      pins:
        pin: L12
    qspi_flash_cs_n:
      pins:
        pin: T19
    qspi_flash_dq:
      pins: [P22, R22, P21, R21]
    qspi_flash_hold:
      pins:
        pin: R21
    qspi_flash_miso:
      pins:
        pin: R22
    qspi_flash_mosi:
      pins:
        pin: P22
    qspi_flash_wp:
      pins:
        pin: P21
    onboard_clk_gen:   # MS5351M programmable clock generator (25 MHz crystal)
      device: {"name": "MS5351M programmable clock generator (25 MHz crystal)", "kind": "clock"}
      shares: ["onboard_hdmi", "onboard_serdes_q0"]   # the board multiplexes these pins
      pins: {"usr_clk_in": "V10", "q0_refclk1": "F10,E10", "i2c_scl": "M13", "i2c_sda": "L13"}
    onboard_serdes_q0:   # SerDes quad Q0 (GW5AT transceiver lanes on BTB J1)
      device: {"name": "SerDes quad Q0 (GW5AT transceiver lanes on BTB J1)", "kind": "serdes"}
      shares: ["onboard_clk_gen", "onboard_pcie", "onboard_usb_a1", "onboard_usb_a2"]   # the board multiplexes these pins
      pins: {"refclk0": "F6,E6", "refclk1": "F10,E10", "l0_tx": "A4,B4", "l0_rx": "B8,A8", "l1_tx": "D5,C5", "l1_rx": "D11,C11", "l2_tx": "B6,A6", "l2_rx": "B10,A10", "l3_tx": "D7,C7", "l3_rx": "D9,C9"}
    onboard_pcie:   # PCIe x1 FPC connector J4 (Raspberry Pi 5 PCIe HAT+ pinout, 16-pin)
      device: {"name": "PCIe x1 FPC connector J4 (Raspberry Pi 5 PCIe HAT+ pinout, 16-pin)", "kind": "pcie"}
      shares: ["onboard_serdes_q0", "pcie_rst_n", "pcie_wake_n"]   # the board multiplexes these pins
      pins: {"refclk": "F6,E6", "tx0": "A4,B4", "rx0": "B8,A8", "clkreq_n": "AA14", "wake_n": "T14", "perst_n": "W11"}
    onboard_ddr3:   # DDR3 SDRAM on the SOM (60K: one MT41J256M16 16-bit; 138K: two chips, 32-bit)
      device: {"name": "DDR3 SDRAM on the SOM (60K: one MT41J256M16 16-bit; 138K: two chips, 32-bit)", "kind": "ddr3"}
      iostandard: "SSTL15 (cst60: SSTL15_I, BANK_VCCIO=1.5)"
      pins: {"a": ["M1", "K2", "G2", "J4", "J2", "H2", "G3", "J1", "J5", "H5", "L1", "H3", "K4", "K1", "D1", "R1"], "ba": ["P5", "P2", "M6"], "cs_n": "P4", "ras_n": "L5", "cas_n": "L4", "we_n": "M5", "cke": "K6", "odt": "M2", "reset_n": "L6", "ck": "L3,K3", "dq": ["Y4", "AB3", "AA5", "V4", "AA1", "AB2", "AB5", "AB1", "AA8", "Y8", "AB7", "Y7", "AB8", "W9", "AB6", "Y9"], "dm": ["AA4", "V7"], "dqs": ["Y3,AA3", "V9,V8"]}
