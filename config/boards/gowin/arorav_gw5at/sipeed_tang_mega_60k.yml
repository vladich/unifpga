# sipeed_tang_mega_60k pin map.
# Aggregated from Sipeed official Tang examples:
#   https://github.com/sipeed/TangMega-60K-example/blob/main/cam_dvi/src/NEO_DOCK.cst
#   https://github.com/sipeed/TangMega-60K-example/blob/main/ch569_hspi2cdc/CH569_HSPI_FPGA_60K/src/CH569_HSPI_FPGA.cst
#   https://github.com/sipeed/TangMega-60K-example/blob/main/pcie_dma_demo/src/Pins.cst
#   (+4 more)

Board:
  id: sipeed_tang_mega_60k
  pinBanks:
    sys_clk:
      pins: V22
    onboard_buttons:    # S4, S2, S1 = EX_KEY.0/1/2 (Y12 is key S1, not the reset: the SOM's reset key is F4)
      active: low
      iostandard: LVCMOS15   # bank 9 is 1.5 V on the 60K SOM
      pins: [AA13, AB13, Y12]
    onboard_leds:
      pins: [T18, R17, U21, R19]
    pcie_perst:
      pins: W11
    onboard_spi_flash:   # SPI NOR flash W25Q64 (SOM U1200, MSPI config flash)
      device: {"name": "SPI NOR flash W25Q64 (SOM U1200, MSPI config flash)", "kind": "flash"}
      pins: {"cs_n": "T19", "clk": "L12", "d0_mosi": "P22", "d1_miso": "R22", "d2_wp": "P21", "d3_hold": "R21"}
    onboard_som_leds:   # SOM status LEDs DONE / READY (D2206, D2207)
      device: {"name": "SOM status LEDs DONE / READY (D2206, D2207)", "kind": "leds"}
      active: "high"
      pins: {"done": "G11", "ready": "U12"}
    onboard_som_keys:   # SOM keys: CPU_RESET (U1304) and RECONFIG (U1303, also dock SW7)
      device: {"name": "SOM keys: CPU_RESET (U1304) and RECONFIG (U1303, also dock SW7)", "kind": "reset"}
      pins: {"cpu_reset": "F4", "reconfig_n": "N12"}
    som_debug:   # SOM debug connector U1201 (JST SH1.0 8-pin: JTAG + UART)
      device: {"name": "SOM debug connector U1201 (JST SH1.0 8-pin: JTAG + UART)", "kind": "header"}
      shares: ["onboard_uart"]   # the board multiplexes these pins
      pins: {"2_tms": "T13", "3_tdo": "U13", "4_tck": "V12", "5_tdi": "R13", "6_rx": "V14", "7_tx": "U15"}
    onboard_ddr3:   # DDR3 SDRAM x16, lower chip (SOM DDR1, H5TQ4G63EFR 4 Gbit = 512 MB)
      device: {"name": "DDR3 SDRAM x16, lower chip (SOM DDR1, H5TQ4G63EFR 4 Gbit = 512 MB)", "kind": "ddr3"}
      iostandard: "SSTL15_I / SSTL15D_I (BANK_VCCIO=1.5)"
      pins: {"a": ["M1", "K2", "G2", "J4", "J2", "H2", "G3", "J1", "J5", "H5", "L1", "H3", "K4", "K1", "D1", "R1"], "ba": ["P5", "P2", "M6"], "ras_n": "L5", "cas_n": "L4", "we_n": "M5", "cs_n": "P4", "cke": "K6", "odt": "M2", "reset_n": "L6", "clk": "L3,K3", "dq": ["Y4", "AB3", "AA5", "V4", "AA1", "AB2", "AB5", "AB1", "AA8", "Y8", "AB7", "Y7", "AB8", "W9", "AB6", "Y9"], "dm": ["AA4", "V7"], "dqs": ["Y3,AA3", "V9,V8"]}
    onboard_serdes_q0:   # SerDes quad Q0 (4 lanes + 2 reference clocks), balls of the FPGA transceiver
      device: {"name": "SerDes quad Q0 (4 lanes + 2 reference clocks), balls of the FPGA transceiver", "kind": "serdes"}
      shares: ["onboard_pcie", "onboard_usr_clk"]   # the board multiplexes these pins
      pins: {"lane0_tx": "B4,A4", "lane0_rx": "B8,A8", "lane1_tx": "D7,C7", "lane1_rx": "D9,C9", "lane2_tx": "B6,A6", "lane2_rx": "B10,A10", "lane3_tx": "D5,C5", "lane3_rx": "D11,C11", "refclk0": "F6,E6", "refclk1": "F10,E10"}
    onboard_pcie:   # PCIe x4 edge connector J4 (PCIe add-in card, board is the endpoint)
      device: {"name": "PCIe x4 edge connector J4 (PCIe add-in card, board is the endpoint)", "kind": "pcie"}
      active: "low"
      shares: ["onboard_serdes_q0", "pcie_perst"]   # the board multiplexes these pins
      pins: {"perst_n": "W11", "refclk": "F6,E6", "rx0": "B8,A8", "tx0": "B4,A4", "rx1": "D9,C9", "tx1": "D7,C7", "rx2": "B10,A10", "tx2": "B6,A6", "rx3": "D11,C11", "tx3": "D5,C5"}
    onboard_adc:   # ADC input connector J11 (2 differential channels, dedicated ADC balls)
      device: {"name": "ADC input connector J11 (2 differential channels, dedicated ADC balls)", "kind": "adc"}
      pins: {"adcv_n": "M9", "adcv_p": "L10", "adct_n": "N9", "adct_p": "N10"}
    onboard_sma_gpio:   # SMA_GPIO net pair on SOM (IOL2A)
      device: {"name": "SMA_GPIO net pair on SOM (IOL2A)", "kind": "other"}
      pins: {"p": "B1", "n": "A1"}
    onboard_dip_switch:   # DIP switch SW2 position 4 (DIP_Switch_0)
      device: {"name": "DIP switch SW2 position 4 (DIP_Switch_0)", "kind": "switches"}
      active: "low"
      pins: {"sw0": "AB12"}
    onboard_usr_clk:   # MS5351M clock generator (USR_CLK_IN to fabric, SerDes refclk1)
      device: {"name": "MS5351M clock generator (USR_CLK_IN to fabric, SerDes refclk1)", "kind": "clock"}
      shares: ["onboard_serdes_q0"]   # the board multiplexes these pins
      pins: {"usr_clk_in": "V13", "refclk1": "F10,E10"}
    onboard_uart:   # BL616 USB-JTAG & UART debugger (USB-C J7 "USB-DEBUG")
      device: {"name": "BL616 USB-JTAG & UART debugger (USB-C J7 \"USB-DEBUG\")", "kind": "uart"}
      iostandard: "tx LVCMOS33; rx on 31002 (Y14) is 1.5 V bank 9"
      shares: ["som_debug"]   # the board multiplexes these pins
      pins: {"tx": "U15", "rx": "V14", "jtag_tms": "T13", "jtag_tck": "V12", "jtag_tdi": "R13", "jtag_tdo": "U13"}
    onboard_hdmi_0:   # HDMI (DVI) connector J29, transmit
      device: {"name": "HDMI (DVI) connector J29, transmit", "kind": "hdmi_tx"}
      iostandard: "LVCMOS33D (TMDS emulated; vendor CST DRIVE=3.5)"
      shares: ["onboard_hdmi_rx"]   # the board multiplexes these pins
      pins: {"clk": "G15,G16", "d0": "J14,H14", "d1": "J15,H15", "d2": "K17,J17", "hpd": "K13", "ddc_scl": "M13", "ddc_sda": "L13", "dir_sel": "K14"}
    onboard_hdmi_rx:   # HDMI (DVI) connector J29, receive (same connector, DVI_DIR_SEL=0)
      device: {"name": "HDMI (DVI) connector J29, receive (same connector, DVI_DIR_SEL=0)", "kind": "hdmi_rx"}
      shares: ["onboard_hdmi_0"]   # the board multiplexes these pins
      pins: {"clk": "G15,G16", "d0": "J14,H14", "d1": "J15,H15", "d2": "K17,J17", "hpd": "K13", "ddc_scl": "M13", "ddc_sda": "L13", "dir_sel": "K14"}
    onboard_ethernet:   # Gigabit Ethernet RTL8211F-CG (U10, RJ45 J12), RGMII
      device: {"name": "Gigabit Ethernet RTL8211F-CG (U10, RJ45 J12), RGMII", "kind": "ethernet_rgmii"}
      active: "low"
      iostandard: "LVCMOS33"
      pins: {"txc": "F20", "tx_ctl": "F21", "txd": ["D21", "E21", "D22", "E22"], "rxc": "G21", "rx_ctl": "G22", "rxd": ["F18", "E18", "C22", "B22"], "mdc": "V18", "mdio": "U22", "rst_n": "W20", "phy_clk_25m": "V19"}
    onboard_sdcard:   # microSD slot J31 (TF-101A)
      device: {"name": "microSD slot J31 (TF-101A)", "kind": "sdcard"}
      iostandard: "LVCMOS33"
      shares: ["sdio_header"]   # the board multiplexes these pins
      pins: {"clk": "V15", "cmd_mosi": "Y16", "d0_miso": "AA15", "d1": "AB15", "d2": "W14", "d3_cs": "W15"}
    sdio_header:   # SDIO header J10 (2x4 2.54 mm)
      device: {"name": "SDIO header J10 (2x4 2.54 mm)", "kind": "header"}
      shares: ["onboard_sdcard"]   # the board multiplexes these pins
      pins: {"1_d0_miso": "AA15", "2_cmd_mosi": "Y16", "3_d1": "AB15", "4_clk": "V15", "5_d3_cs": "W15", "6_d2": "W14"}
    onboard_audio:   # Stereo I2S DAC PT8211 (U16) + NS4263 class-D amplifier (speakers J27/J28, 3.5 mm jack J25)
      device: {"name": "Stereo I2S DAC PT8211 (U16) + NS4263 class-D amplifier (speakers J27/J28, 3.5 mm jack J25)", "kind": "audio_i2s"}
      active: "low"
      iostandard: "LVCMOS33"
      pins: {"bck": "Y17", "ws": "AB17", "din": "AA16", "pa_en_n": "AB16"}
    onboard_ws2812:   # WS2812B-2020 RGB LED (U15) + aRGB strip connector J24
      device: {"name": "WS2812B-2020 RGB LED (U15) + aRGB strip connector J24", "kind": "ws2812"}
      pins: {"din": "J16"}
    pmod_0:   # PMOD0 socket J9 (2x6 horizontal)
      device: {"name": "PMOD0 socket J9 (2x6 horizontal)", "kind": "pmod"}
      shares: ["onboard_leds", "onboard_sdram_1"]   # the board multiplexes these pins
      pins: {"io0": "P19", "io1": "R19", "io2": "T21", "io3": "U21", "io4": "P16", "io5": "R17", "io6": "R18", "io7": "T18"}
    pmod_1:   # PMOD1 socket J8 (2x6 horizontal)
      device: {"name": "PMOD1 socket J8 (2x6 horizontal)", "kind": "pmod"}
      shares: ["onboard_camera", "onboard_sdram_1"]   # the board multiplexes these pins
      pins: {"io0": "Y21", "io1": "Y22", "io2": "AB21", "io3": "AB22", "io4": "AA20", "io5": "AA21", "io6": "AA19", "io7": "AB20"}
    onboard_camera:   # OV5640 camera FPC J15 (DVP, 24-pin 0.5 mm)
      device: {"name": "OV5640 camera FPC J15 (DVP, 24-pin 0.5 mm)", "kind": "camera_dvp"}
      iostandard: "LVCMOS33, sda (Y13) LVCMOS15 - 60K bank 9 is 1.5 V (vendor CST)"
      shares: ["onboard_sdram_1", "pmod_1"]   # the board multiplexes these pins
      pins: {"xclk": "AA21", "pclk": "AB20", "vsync": "Y21", "href": "AB21", "rst_n": "Y22", "pwdn": "AB22", "d": ["P14", "P15", "R16", "R14", "N15", "T20", "AA19", "AA20"], "sda": "Y13", "scl": "AA14"}
    onboard_sdram_0:   # 2x20 header J13 (SDRAM0 connector, MiSTer-style SDRAM module)
      device: {"name": "2x20 header J13 (SDRAM0 connector, MiSTer-style SDRAM module)", "kind": "sdram"}
      iostandard: "LVCMOS33"
      pins: {"dq": ["E14", "E13", "C15", "C14", "B13", "C13", "A14", "A13", "B21", "A21", "B20", "A20", "A15", "A16", "B15", "B16"], "a": ["D19", "E19", "C19", "C18", "E16", "D15", "D14", "A19", "A18", "C17", "D20", "D17", "B18"], "ba": ["F15", "C20"], "clk": "B17", "cs_n": "F19", "ras_n": "F16", "cas_n": "E17", "we_n": "D16", "dqm": ["F14", "F13"]}
    onboard_sdram_1:   # 2x20 header J14 (SDRAM1 connector)
      device: {"name": "2x20 header J14 (SDRAM1 connector)", "kind": "sdram"}
      iostandard: "LVCMOS33"
      shares: ["onboard_camera", "onboard_leds", "pmod_0", "pmod_1"]   # the board multiplexes these pins
      pins: {"dq": ["R19", "P19", "U21", "T21", "R17", "P16", "T18", "R18", "N13", "N14", "N17", "P17", "W21", "W22", "V17", "W17"], "a": ["R16", "P15", "R14", "P14", "AA19", "AA21", "AA20", "AB22", "AB21", "Y22", "U17", "Y21", "V20"], "ba": ["N15", "U18"], "clk": "U20", "cs_n": "T20", "ras_n": "Y18", "cas_n": "Y19", "we_n": "AB20", "dqm": ["AA18", "AB18"]}
    onboard_lcd:   # RGB LCD FPC J5 (40-pin 0.5 mm, RGB666 on R2-R7/G2-G7/B2-B7)
      device: {"name": "RGB LCD FPC J5 (40-pin 0.5 mm, RGB666 on R2-R7/G2-G7/B2-B7)", "kind": "lcd_rgb"}
      iostandard: "LVCMOS33"
      shares: ["onboard_ch569_hspi"]   # the board multiplexes these pins
      pins: {"clk": "L19", "de": "L14", "hsync": "N20", "vsync": "L15", "r": ["G18", "G17", "H22", "J22", "K22", "K21"], "g": ["K18", "L21", "M21", "M22", "N22", "L18"], "b": ["M18", "N19", "N18", "K16", "L16", "M20"]}
    onboard_lcd_touch:   # LCD capacitive-touch FPC J6 (6-pin)
      device: {"name": "LCD capacitive-touch FPC J6 (6-pin)", "kind": "other"}
      iostandard: "LVCMOS33"
      pins: {"scl": "W16", "sda": "U16", "int": "T16", "rst": "T15"}
    onboard_lcd_backlight:   # LCD backlight driver enable (LP3320 U8)
      device: {"name": "LCD backlight driver enable (LP3320 U8)", "kind": "other"}
      active: "high"
      pins: {"bl": "P20"}
    onboard_ch569_hspi:   # CH569W USB3 bridge, 16-bit HSPI (USB-C J/P1 "USB-3.0" via VL162 mux)
      device: {"name": "CH569W USB3 bridge, 16-bit HSPI (USB-C J/P1 \"USB-3.0\" via VL162 mux)", "kind": "usb"}
      iostandard: "LVCMOS33"
      shares: ["onboard_lcd"]   # the board multiplexes these pins
      pins: {"hd": ["G17", "H22", "L14", "K22", "K21", "K18", "L21", "M21", "M22", "N22", "L18", "M18", "N19", "N18", "K16", "L16"], "htclk": "L20", "htvld": "L15", "htreq": "N20", "htack": "L19", "htrdy": "J22", "hrclk": "J20", "hrvld": "G18", "hrack": "J21", "hrts": "K19", "hcts": "M20"}
    onboard_usb_host_1:   # USB-A host port 1 (J18 D1, FPGA soft USB 1.1/2.0 FS)
      device: {"name": "USB-A host port 1 (J18 D1, FPGA soft USB 1.1/2.0 FS)", "kind": "usb"}
      iostandard: "LVCMOS33"
      pins: {"dp": "M15", "dn": "M16"}
    onboard_usb_host_2:   # USB 2nd port (FPGA_USB2, via slide switch SW4 to J18 D2 pads)
      device: {"name": "USB 2nd port (FPGA_USB2, via slide switch SW4 to J18 D2 pads)", "kind": "usb"}
      iostandard: "LVCMOS33"
      pins: {"dp": "H13", "dn": "G13"}
    onboard_joycon_a:   # Joy-Con connector A (J19, FH35C 11-pin, 1.8 V via TXS0108E U50)
      device: {"name": "Joy-Con connector A (J19, FH35C 11-pin, 1.8 V via TXS0108E U50)", "kind": "joystick"}
      iostandard: "LVCMOS33"
      pins: {"fc": "H19", "txd": "H20", "rxd": "G20", "rst": "M17"}
    onboard_joycon_b:   # Joy-Con connector B (J21, FH35C 11-pin, 1.8 V via TXS0108E U50)
      device: {"name": "Joy-Con connector B (J21, FH35C 11-pin, 1.8 V via TXS0108E U50)", "kind": "joystick"}
      iostandard: "LVCMOS33"
      pins: {"fc": "H17", "txd": "H18", "rxd": "J19", "rst": "U8"}
    onboard_mic_array:   # Microphone-array FPC J32 (10-pin 0.5 mm, Sipeed 6+1 mic array with SK9822 LEDs)
      device: {"name": "Microphone-array FPC J32 (10-pin 0.5 mm, Sipeed 6+1 mic array with SK9822 LEDs)", "kind": "mic"}
      iostandard: "LVCMOS15 (60K bank 9 is 1.5 V)"
      pins: {"sk9822_ck": "W12", "sk9822_da": "AA9", "mic_d0": "AA10", "mic_d1": "AB10", "mic_d2": "AA11", "mic_d3": "AB11", "mic_ws": "W10", "mic_bck": "Y11"}
    onboard_fan:   # PWM fan connector J23 (4-pin)
      device: {"name": "PWM fan connector J23 (4-pin)", "kind": "other"}
      iostandard: "en LVCMOS15 (bank 9), pwm/tacho LVCMOS33"
      pins: {"en": "V10", "pwm": "W19", "tacho": "T14"}
