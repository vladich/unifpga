# gowin_gw5at60_devkit: GW5AT-60 Video Dev Kit.

Board:
  id: gowin_gw5at60_devkit
  name: GW5AT-60 Video Dev Kit
  url: https://www.gowinsemi.com/en/support/devkits_detail/73/
  status: active
  producer: gowin_semi
  chip: GW5AT-LV60PG484AC1/I0
  bridges:
  - usb-jtag
  programmer: gowin_pgm_standard
  extra_programmers:
  - openFPGALoader[*]
  features:
  - ddr3_memory
  - ethernet_phy_gigabit
  - hdmi_output
  - jtag_header
  - microsd_socket
  - mipi_csi2_input
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt41k128m16
  - tmds_direct
  - microsd_socket_generic
  - ftdi_ft2232h
  - led_discrete_generic
  - pushbutton_smd_generic
