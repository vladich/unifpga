  parts:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 3}, bind: {btn: onboard_buttons}}
    - id: lcd
      label: lcd
      attach: {peripheral: lcd_480_272, params: {clock_pixel_mhz: 8, bits_r: 6, bits_g: 6, bits_b: 6}, bind: {r: onboard_lcd.r, g: onboard_lcd.g, b: onboard_lcd.b, hs: onboard_lcd.hs, vs: onboard_lcd.vs, de: onboard_lcd.de, ck: onboard_lcd.ck}}
    - id: uart
      label: BL616 USB-JTAG & UART debugger (USB-C J7 "USB-DEBUG")
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: audio
      label: Stereo I2S DAC PT8211 (U16) + NS4263 class-D amplifier (speakers J27/J28, 3.5 mm jack J25)
      attach: {peripheral: i2s_audio_out, params: {align_right: 1, offset_by_one_cycle: 0}, bind: {bclk: onboard_audio.bck, lrclk: onboard_audio.ws, sdata: onboard_audio.din, pa_en_n: onboard_audio.pa_en_n}}
    - id: ws2812
      label: WS2812B-2020 RGB LED (U15) + aRGB strip connector J24
      attach: {peripheral: ws2812, bind: {din: onboard_ws2812.din}}
    - id: fan
      label: PWM fan connector J23 (4-pin)
      attach: {peripheral: fan_pwm, bind: {pwm: onboard_fan.pwm, en: onboard_fan.en, tach: onboard_fan.tacho}}
    - id: spi_flash
      label: SPI NOR flash W25Q64 (SOM U1200, MSPI config flash)
      device: {kind: flash, bank: onboard_spi_flash}   # no peripheral model yet
    - id: som_leds
      label: SOM status LEDs DONE / READY (D2206, D2207)
      attach: {peripheral: led_bank, params: {width: 2}, bind: {led: [onboard_som_leds.done, onboard_som_leds.ready]}}
    - id: som_keys
      label: 'SOM keys: CPU_RESET (U1304) and RECONFIG (U1303, also dock SW7)'
      device: {kind: reset, bank: onboard_som_keys}   # no peripheral model yet
    - id: som_debug
      label: 'SOM debug connector U1201 (JST SH1.0 8-pin: JTAG + UART)'
      device: {kind: header, bank: som_debug}   # no peripheral model yet
    - id: ddr3
      label: 'DDR3 SDRAM 2x x16 (SOM DDR1/DDR2: H5TQ4G63EFR on SOM 30354 = 1 GB; MT41J128M16JT on SOM 30353 = 512 MB)'
      device: {kind: ddr3, bank: onboard_ddr3}   # no peripheral model yet
    - id: serdes_q0
      label: SerDes quad Q0 (4 lanes + 2 reference clocks), balls of the FPGA transceiver
      device: {kind: serdes, bank: onboard_serdes_q0}   # no peripheral model yet
    - id: pcie
      label: PCIe x4 edge connector J4 (PCIe add-in card, board is the endpoint)
      device: {kind: pcie, bank: onboard_pcie}   # no peripheral model yet
    - id: adc
      label: ADC input connector J11 (2 differential channels, dedicated ADC balls)
      device: {kind: adc, bank: onboard_adc}   # no peripheral model yet
    - id: sma_gpio
      label: SMA_GPIO net pair on SOM (IOL2A)
      device: {kind: other, bank: onboard_sma_gpio}   # no peripheral model yet
    - id: dip_switch
      label: DIP switch SW2 position 4 (DIP_Switch_0)
      attach: {peripheral: sw_bank, params: {width: 1}, bind: {sw: onboard_dip_switch.sw0}}
    - id: usr_clk
      label: MS5351M clock generator (USR_CLK_IN to fabric, SerDes refclk1)
      device: {kind: clock, bank: onboard_usr_clk}   # no peripheral model yet
    - id: hdmi_rx
      label: HDMI (DVI) connector J29, receive (same connector, DVI_DIR_SEL=0)
      device: {kind: hdmi_rx, bank: onboard_hdmi_rx}   # no peripheral model yet
    - id: ethernet
      label: Gigabit Ethernet RTL8211F-CG (U10, RJ45 J12), RGMII
      device: {kind: ethernet_rgmii, bank: onboard_ethernet}   # no peripheral model yet
    - id: sdcard
      label: microSD slot J31 (TF-101A)
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_sdcard.clk, cmd: onboard_sdcard.cmd_mosi, dat0: onboard_sdcard.d0_miso, dat3: onboard_sdcard.d3_cs}}
    - id: camera
      label: OV5640 camera FPC J15 (DVP, 24-pin 0.5 mm)
      device: {kind: camera_dvp, bank: onboard_camera}   # no peripheral model yet
    - id: sdram_0
      label: 2x20 header J13 (SDRAM0 connector, MiSTer-style SDRAM module)
      attach: {peripheral: sdram_sdr, params: {row_bits: 13, data_bits: 16, col_bits: 9}, bind: {clk: onboard_sdram_0.clk, cs_n: onboard_sdram_0.cs_n, ras_n: onboard_sdram_0.ras_n, cas_n: onboard_sdram_0.cas_n, we_n: onboard_sdram_0.we_n, ba: onboard_sdram_0.ba, a: onboard_sdram_0.a, dq: onboard_sdram_0.dq, dqm: onboard_sdram_0.dqm}}
    - id: sdram_1
      label: 2x20 header J14 (SDRAM1 connector)
      attach: {peripheral: sdram_sdr, params: {row_bits: 13, data_bits: 16, col_bits: 9}, bind: {clk: onboard_sdram_1.clk, cs_n: onboard_sdram_1.cs_n, ras_n: onboard_sdram_1.ras_n, cas_n: onboard_sdram_1.cas_n, we_n: onboard_sdram_1.we_n, ba: onboard_sdram_1.ba, a: onboard_sdram_1.a, dq: onboard_sdram_1.dq, dqm: onboard_sdram_1.dqm}}
    - id: lcd_touch
      label: LCD capacitive-touch FPC J6 (6-pin)
      device: {kind: other, bank: onboard_lcd_touch}   # no peripheral model yet
    - id: lcd_backlight
      label: LCD backlight driver enable (LP3320 U8)
      device: {kind: other, bank: onboard_lcd_backlight}   # no peripheral model yet
    - id: ch569_hspi
      label: CH569W USB3 bridge, 16-bit HSPI (USB-C J/P1 "USB-3.0" via VL162 mux)
      device: {kind: usb, bank: onboard_ch569_hspi}   # no peripheral model yet
    - id: usb_host_1
      label: USB-A host port 1 (J18 D1, FPGA soft USB 1.1/2.0 FS)
      device: {kind: usb, bank: onboard_usb_host_1}   # no peripheral model yet
    - id: usb_host_2
      label: USB 2nd port (FPGA_USB2, via slide switch SW4 to J18 D2 pads)
      device: {kind: usb, bank: onboard_usb_host_2}   # no peripheral model yet
    - id: joycon_a
      label: Joy-Con connector A (J19, FH35C 11-pin, 1.8 V via TXS0108E U50)
      device: {kind: joystick, bank: onboard_joycon_a}   # no peripheral model yet
    - id: joycon_b
      label: Joy-Con connector B (J21, FH35C 11-pin, 1.8 V via TXS0108E U50)
      device: {kind: joystick, bank: onboard_joycon_b}   # no peripheral model yet
    - id: mic_array
      label: Microphone-array FPC J32 (10-pin 0.5 mm, Sipeed 6+1 mic array with SK9822 LEDs)
      device: {kind: mic, bank: onboard_mic_array}   # no peripheral model yet
