    header_j13:   # 2x20 header J13 (SDRAM0 connector: a MiSTer-style SDRAM module, or anything else)
      device: {"name": "2x20 header J13 (SDRAM0 connector: a MiSTer-style SDRAM module, or anything else)", "kind": "header"}
      iostandard: "LVCMOS33"
