# tang_mega_138k pin map.

Board:
  id: tang_mega_138k
  fpga:
    producer: Gowin
    family: AroraV/GW5AST
    part: GW5AST-LV138PG484AC1/I0

  # Gowin tool settings:
  # set_device args verbatim (part, -name, -device_version) and the
  # set_option -use_*_as_gpio flags that free configuration pins for I/O.
  toolchain_options:
    yosys:
      loader_board: "tangmega138k"          # openFPGALoader -b
    gowin:
      set_device: "GW5AST-LV138PG484AC1/I0"
      set_device_reason: tool-required
      options: [use_sspi_as_gpio, use_cpu_as_gpio]
      gprj_device: '<Device name="GW5AST-138C" pn="GW5AST-LV138PG484AC1/I0">gw5ast138c-007</Device>'
  pinBanks:
    clk: { pins: V22, frequency_mhz: 50, iostandard: LVCMOS33 }
    onboard_buttons:
      iostandard: LVCMOS33
      pins: [AA13, AB13, Y12]
    onboard_lcd:
      iostandard: LVCMOS33
      pins:
        ck: L19
        de: L14
        vs: L15
        hs: N20
        r: [G18, G17, H22, J22, K22, K21]
        g: [K18, L21, M21, M22, N22, L18]
        b: [M18, N19, N18, K16, L16, M20]
    onboard_hdmi_0:
      iostandard: LVCMOS33D
      pins:
        clk_p: "G15,G16"
        d_p: ["J14,H14", "J15,H15", "K17,J17"]
    pmod_0:
      iostandard: LVCMOS33
      pins: [P19, R19, T21, U21, P16, R17, R18, T18]
    pmod_1:
      iostandard: LVCMOS33
      pins: [Y21, Y22, AB21, AB22, AA20, AA21, AA19, AB20]
    onboard_spi_flash:   # SPI NOR flash W25Q64 (SOM U1200, MSPI config flash)
      device: {"name": "SPI NOR flash W25Q64 (SOM U1200, MSPI config flash)", "kind": "flash"}
      pins: {"cs_n": "T19", "clk": "L12", "d0_mosi": "P22", "d1_miso": "R22", "d2_wp": "P21", "d3_hold": "R21"}
    onboard_som_leds:   # SOM status LEDs DONE / READY (D2206, D2207)
      device: {"name": "SOM status LEDs DONE / READY (D2206, D2207)", "kind": "leds"}
      active: "high"
      pins: {"done": "G11", "ready": "U12"}
    onboard_som_keys:   # SOM keys: CPU_RESET (U1304) and RECONFIG (U1303, also dock SW7)
      device: {"name": "SOM keys: CPU_RESET (U1304) and RECONFIG (U1303, also dock SW7)", "kind": "reset"}
      pins: {"cpu_reset": "F4", "reconfig_n": "N12"}
    som_debug:   # SOM debug connector U1201 (JST SH1.0 8-pin: JTAG + UART)
      device: {"name": "SOM debug connector U1201 (JST SH1.0 8-pin: JTAG + UART)", "kind": "header"}
      shares: ["onboard_uart"]   # the board multiplexes these pins
      pins: {"2_tms": "T13", "3_tdo": "U13", "4_tck": "V12", "5_tdi": "R13", "6_rx": "V14", "7_tx": "U15"}
    onboard_ddr3:   # DDR3 SDRAM 2x x16 (SOM DDR1/DDR2: H5TQ4G63EFR on SOM 30354 = 1 GB; MT41J128M16JT on SOM 30353 = 512 MB)
      device: {"name": "DDR3 SDRAM 2x x16 (SOM DDR1/DDR2: H5TQ4G63EFR on SOM 30354 = 1 GB; MT41J128M16JT on SOM 30353 = 512 MB)", "kind": "ddr3"}
      iostandard: "SSTL15 / SSTL15D (BANK_VCCIO=1.5)"
      pins: {"a": ["M1", "K2", "G2", "J4", "J2", "H2", "G3", "J1", "J5", "H5", "L1", "H3", "K4", "K1", "D1", "R1"], "ba": ["P5", "P2", "M6"], "ras_n": "L5", "cas_n": "L4", "we_n": "M5", "cs_n": "P4", "cke": "K6", "odt": "M2", "reset_n": "L6", "clk": "L3,K3", "dq": ["Y4", "AB3", "AA5", "V4", "AA1", "AB2", "AB5", "AB1", "AA8", "Y8", "AB7", "Y7", "AB8", "W9", "AB6", "Y9", "U5", "R6", "U6", "R4", "Y6", "T4", "V5", "T5", "W2", "Y1", "T1", "U3", "U2", "V2", "U1", "Y2"], "dm": ["AA4", "V7", "T6", "W1"], "dqs": ["Y3,AA3", "V9,V8", "W6,W5", "R3,R2"]}
    onboard_serdes_q0:   # SerDes quad Q0 (4 lanes + 2 reference clocks), balls of the FPGA transceiver
      device: {"name": "SerDes quad Q0 (4 lanes + 2 reference clocks), balls of the FPGA transceiver", "kind": "serdes"}
      shares: ["onboard_pcie", "onboard_usr_clk"]   # the board multiplexes these pins
