# tang_mega_138k pin map.

Board:
  id: tang_mega_138k
  fpga:
    producer: Gowin
    family: AroraV/GW5AST
    part: GW5AST-LV138PG484AC1/I0

  # Gowin tool settings:
  # set_device args verbatim (part, -name, -device_version) and the
  # set_option -use_*_as_gpio flags that free configuration pins for I/O.
  toolchain_options:
    yosys:
      loader_board: "tangmega138k"          # openFPGALoader -b
    gowin:
      set_device: "GW5AST-LV138PG484AC1/I0"
      set_device_reason: tool-required
      options: [use_sspi_as_gpio, use_cpu_as_gpio]
      gprj_device: '<Device name="GW5AST-138C" pn="GW5AST-LV138PG484AC1/I0">gw5ast138c-007</Device>'
  pinBanks:
    clk: { pins: V22, frequency_mhz: 50, iostandard: LVCMOS33 }
    onboard_buttons:
      iostandard: LVCMOS33
      pins: [AA13, AB13, Y12]
    onboard_lcd:
      iostandard: LVCMOS33
      pins:
        ck: L19
        de: L14
        vs: L15
        hs: N20
        r: [G18, G17, H22, J22, K22, K21]
        g: [K18, L21, M21, M22, N22, L18]
        b: [M18, N19, N18, K16, L16, M20]
    onboard_hdmi_0:
      iostandard: LVCMOS33D
      pins:
        clk_p: "G15,G16"
        d_p: ["J14,H14", "J15,H15", "K17,J17"]
    pmod_0:
      iostandard: LVCMOS33
      pins: [P19, R19, T21, U21, P16, R17, R18, T18]
    pmod_1:
      iostandard: LVCMOS33
      pins: [Y21, Y22, AB21, AB22, AA20, AA21, AA19, AB20]
