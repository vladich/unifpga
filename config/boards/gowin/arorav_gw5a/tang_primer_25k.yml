  parts:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: hdmi_0
      label: hdmi 0
      attach: {peripheral: hdmi_tmds, params: {clock_serial_mhz: 250}, bind: {clk_p: onboard_hdmi_0.clk_p, d_p: onboard_hdmi_0.d_p, clk_n: onboard_hdmi_0.clk_n, d_n: onboard_hdmi_0.d_n}}
    - id: flash
      label: U1200 W25Q64 64 Mbit SPI NOR flash (bitstream + user)
      device: {kind: flash, bank: onboard_flash}   # no peripheral model yet
    - id: som_mipi
      label: MIPI D-PHY hard core M0 (4 data lanes + clock) on core-board J2
      device: {kind: other, bank: onboard_som_mipi}   # no peripheral model yet
    - id: jtag
      label: JTAG (to the Dock's BL616 debugger and the J7 2x4 JTAG header)
      device: {kind: other, bank: onboard_jtag}   # no peripheral model yet
    - id: leds
      label: READY / DONE LEDs (LED3, LED4) on configuration pins
      attach: {peripheral: led_bank, params: {width: 2}, bind: {led: [onboard_leds.ready, onboard_leds.done]}}
    - id: usb
      label: USB-A host port J13 (USB 1.1, direct FPGA D+/D-)
      device: {kind: usb, bank: onboard_usb}   # no peripheral model yet
