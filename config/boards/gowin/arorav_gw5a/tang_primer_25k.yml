# tang_primer_25k pin map.

Board:
  id: tang_primer_25k
  fpga:
    producer: Gowin
    family: AroraV/GW5A
    part: GW5A-LV25MG121

  # Gowin tool settings:
  # set_device args verbatim (part, -name, -device_version) and the
  # set_option -use_*_as_gpio flags that free configuration pins for I/O.
  toolchain_options:
    yosys:
      loader_board: "tangprimer25k"          # openFPGALoader -b
    gowin:
      set_device: "GW5A-LV25MG121NC1/I0 -device_version A"
      options: [use_cpu_as_gpio, use_i2c_as_gpio]
      gprj_device: '<Device name="GW5A-25A" pn="GW5A-LV25MG121NC1/I0">gw5a25a-002</Device>'
  pinBanks:
    clk: { pins: E2, frequency_mhz: 50 }
    onboard_buttons:
      pins: [H11, H10]
    onboard_uart:
      pins:
        rx: B3
        tx: C3
    gpio:
      pins: [K2, K1, L1, L2, K4, J4, G1, G2, L3, L4, C2, B2, F1, F2, A1, E1, D1, E3, J2, J1, H4, G4, H2, H1, J7, K7, L8, L7, K10, L10, K9, L9, K8, J8, F6, F7, J10, J11]
    pmod_0:
      pins: [F5, G7, H8, H5, G5, G8, H7, J5]
    pmod_1:
      pins: [A11, E11, K11, L5, A10, E10, L11, K5]
    pmod_2:
      pins: [G11, D11, B11, C11, G10, D10, B10, C10]
    onboard_hdmi_0:
      pins:
        clk_p: "H5,J5"
        clk_n: J5
        d_p: ["H8,H7", "G7,G8", "F5,G5"]
        d_n: [H7, G8, G5]
    onboard_flash:   # U1200 W25Q64 64 Mbit SPI NOR flash (bitstream + user)
      device: {"name": "U1200 W25Q64 64 Mbit SPI NOR flash (bitstream + user)", "kind": "flash"}
      iostandard: "LVCMOS33"
      pins: {"cs_n": "E6", "clk": "E7", "mosi": "D6", "miso": "E5", "wp_n": "D5", "hold_n": "E4"}
    som_j1:   # Core-board BTB connector J1 (DF40C-60DP, 60 pins) — module side
      device: {"name": "Core-board BTB connector J1 (DF40C-60DP, 60 pins) — module side", "kind": "header"}
      shares: ["gpio", "onboard_buttons", "onboard_hdmi_0", "onboard_leds", "onboard_uart", "onboard_usb", "pmod_0", "pmod_1", "pmod_2"]   # the board multiplexes these pins
      pins: ["L9", "H5", "K9", "J5", "J8", "L5", "K8", "K5", "F7", "H8", "F6", "H7", "G7", "E8", "G8", "B3", "F5", "C3", "G5", "E3", "D7", "L6", "K6", "J11", "K7", "J10", "J7", "H11", "L7", "H10", "L8", "G11", "L10", "G10", "K10", "K11", "D11", "L11", "D10", "C11", "E11", "C10", "E10", "B11", "A11", "B10", "A10"]
    som_j2:   # Core-board BTB connector J2 (DF40C-60DP, 60 pins) — module side
      device: {"name": "Core-board BTB connector J2 (DF40C-60DP, 60 pins) — module side", "kind": "header"}
      shares: ["gpio", "onboard_jtag", "onboard_som_mipi"]   # the board multiplexes these pins
      pins: ["B2", "C2", "L2", "F2", "L1", "F1", "K1", "A1", "K2", "D8", "J4", "E1", "K4", "D1", "G2", "G1", "C1", "L4", "B1", "L3", "A2", "J1", "A3", "J2", "G4", "A5", "H4", "B5", "H1", "H2", "A6", "B6", "A7", "B7", "A8", "B8", "A9", "B9"]
    onboard_som_mipi:   # MIPI D-PHY hard core M0 (4 data lanes + clock) on core-board J2
      device: {"name": "MIPI D-PHY hard core M0 (4 data lanes + clock) on core-board J2", "kind": "other"}
      shares: ["som_j2"]   # the board multiplexes these pins
      pins: {"ck": "A7,B7", "d0": "A9,B9", "d1": "A8,B8", "d2": "A6,B6", "d3": "A5,B5"}
    onboard_jtag:   # JTAG (to the Dock's BL616 debugger and the J7 2x4 JTAG header)
      device: {"name": "JTAG (to the Dock's BL616 debugger and the J7 2x4 JTAG header)", "kind": "other"}
      shares: ["som_j2"]   # the board multiplexes these pins
      pins: {"tck": "C1", "tms": "B1", "tdo": "A2", "tdi": "A3"}
    onboard_leds:   # READY / DONE LEDs (LED3, LED4) on configuration pins
      device: {"name": "READY / DONE LEDs (LED3, LED4) on configuration pins", "kind": "leds"}
      active: "high"
      shares: ["som_j1"]   # the board multiplexes these pins
      pins: {"ready": "E8", "done": "D7"}
    onboard_usb:   # USB-A host port J13 (USB 1.1, direct FPGA D+/D-)
      device: {"name": "USB-A host port J13 (USB 1.1, direct FPGA D+/D-)", "kind": "usb"}
      iostandard: "LVCMOS33"
      shares: ["som_j1"]   # the board multiplexes these pins
      pins: {"d_p": "L6", "d_n": "K6"}
