# tang_nano_20k pin map.

Board:
  id: tang_nano_20k
  fpga:
    producer: Gowin
    family: Arora/GW2A
    part: GW2A-LV18QN88C8/I7

  # Gowin tool settings:
  # set_device args verbatim (part, -name, -device_version) and the
  # set_option -use_*_as_gpio flags that free configuration pins for I/O.
  toolchain_options:
    yosys:
      loader_board: "tangnano20k"          # openFPGALoader -b
    gowin:
      set_device: "GW2AR-LV18QN88C8/I7 -name GW2AR-18 -device_version C"
      options: [use_sspi_as_gpio]
      gprj_device: '<Device name="GW2AR-18C" pn="GW2AR-LV18QN88C8/I7">gw2ar18c-000</Device>'
  defaults:
    # Gowin EDA locks banks 3, 6 and 7 of the GW2AR-18C at 3.3 V ("locked by
    # other constraint or embedded port", CT1136) and types unconstrained pins
    # LVCMOS18, so a CST without IO_TYPE does not build with gw_sh;
    # Sipeed's examples type every pin LVCMOS33. Verified on mercury 2026-09-22.
    iostandard: LVCMOS33
    iostandard_reason: tool-required
  pinBanks:
    clk: { pins: "4", frequency_mhz: 27 }
    onboard_buttons:
      pins: ["88", "87"]
    onboard_leds:
      active: low
      pins: ["15", "16", "17", "18", "19", "20"]
    onboard_lcd:
      pins:
        ck: "77"
        de: "48"
        hs: "25"
        vs: "26"
        bl: "49"
        # 5-6-5 bus
        # (LCD_R[7:3], LCD_G[7:2], LCD_B[7:3]); the `_lcd_800_480_tm1638_alt`
        # variant's different adapter is expressed with pin_overrides in its
        # configuration, not merged into this bank.
        r: ["42", "41", "40", "39", "38"]
        g: ["37", "36", "35", "34", "33", "32"]
        b: ["31", "30", "29", "28", "27"]
      index_origin: {r: 3, g: 2, b: 3}
    onboard_hdmi_edid:
      pins:
        clk: "53"
        dat: "52"
    onboard_uart:
      pins:
        tx: "70"
        rx: "69"
    onboard_microsd:
      pins:
        sck: "83"
        cmd: "82"
        dat: ["84", "85", "80", "81"]
    onboard_headphone:
      pins:
        bck: "56"
        din: "54"
        ws: "55"
    onboard_pa_enable: { pins: "51" }
    onboard_ws2812: { pins: "79" }
    onboard_joystick:
      pins:
        miso: "71"
        cs: "72"
    gpio:
      pins: ["86", "73", "74", "75", "76"]
    onboard_hdmi:
      pins:
        clk_p: "33,34"
        clk_n: "34"
        d_p: ["35,36", "37,38", "39,40"]
        d_n: ["36", "38", "40"]
