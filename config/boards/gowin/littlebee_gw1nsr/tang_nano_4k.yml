    producer: Gowin
    family: LittleBee/GW1NSR
    part: GW1NSR-LV4C

  # Gowin tool settings from BGM's board_specific.tcl (tools/sync_from_bgm.py --gowin-options):
  # set_device args verbatim (part, -name, -device_version) and the
  # set_option -use_*_as_gpio flags that free configuration pins for I/O.
  toolchain_options:
    gowin:
      set_device: "GW1NSR-LV4CQN48PC6/I5 -name GW1NSR-4 -device_version \"\""
      options: [use_done_as_gpio, use_mspi_as_gpio]
  pinBanks:
    clk: { pins: "45", frequency_mhz: 27 }
    onboard_buttons:
      active: low
      pins: ["15", "14"]
    onboard_led: { pins: "10" }
    onboard_serial_flash:
      pins:
        clk: "1"
        di: "48"
        do: "47"
        cs: "2"
        wp: "8"
        hold: "9"
    onboard_hdmi:
      pins:
        clk_p: "28,27"
        d_p: ["30,29", "32,31", "35,34"]
    onboard_camera:
      index_origin: {data: 8}
      pins:
        scl: "44"
        sda: "46"
        vsync: "43"
        hsync: "42"
        pclk: "41"
        data: ["39", "40"]
