Board:
  id: marsohod3gw2
  name: Marsohod3 GW
  product: Марсоход3GW2 (Marsohod3GW2)
  summary: Gowin GW1NR-LV9QN88PC6/I5 (8640 LUT4, 8 MB in-package PSRAM), 100 MHz osc, FT2232H (JTAG + sync FIFO /
    UART), ADC1175 8-bit ADC, HDMI out, 8 LEDs, 2 keys, 2x 2x7 expansion headers (20 IO)
  producer: marsohod
  chip: GW1NR-LV9QN88PC6/I5
  bridges:
