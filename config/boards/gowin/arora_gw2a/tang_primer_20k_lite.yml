# tang_primer_20k_lite pin map.

Board:
  id: tang_primer_20k_lite
  fpga:
    producer: Gowin
    family: Arora/GW2A
    part: GW2A-LV18PG256C8/I7

  # Gowin tool settings:
  # set_device args verbatim (part, -name, -device_version) and the
  # set_option -use_*_as_gpio flags that free configuration pins for I/O.
  toolchain_options:
    yosys:
      loader_board: "tangprimer20k"          # openFPGALoader -b
    gowin:
      set_device: "GW2A-LV18PG256C8/I7 -name GW2A-18 -device_version C"
      options: [use_sspi_as_gpio, use_ready_as_gpio, use_done_as_gpio]
      gprj_device: '<Device name="GW2A-18C" pn="GW2A-LV18PG256C8/I7">gw2a18c-011</Device>'
  pinBanks:
    clk: { pins: H11, frequency_mhz: 27, iostandard: LVCMOS33 }
    onboard_switches:
      iostandard: LVCMOS33
      active: low
      pins: [C7, D7]
    onboard_buttons:
      iostandard: LVCMOS33
      active: low
      pins: [T10, T2]
    gpio_3:
      iostandard: LVCMOS33
      pins: [L8, P7, E10, D11, M6, R7, D10, F10]
    gpio_2:
      iostandard: LVCMOS33
      pins: [F15, D16, C9, L12, E16, E14, A9, J11]   # [4]: E16 (schematic 3711 J2 pin 12; BGM's cst had E15)
    gpio_1:
      iostandard: LVCMOS33
      pins: [R16, P16, N16, L16, P15, N15, N14, L14]
    gpio_0:
      iostandard: LVCMOS33
      pins: [T6, T7, T8, T9, P6, R8, P8, P9]
    onboard_ddr3:   # DDR3 SDRAM UD1 (H5TQ1G63EFR-PBC, 64M x16, 128 MB)
      device: {"name": "DDR3 SDRAM UD1 (H5TQ1G63EFR-PBC, 64M x16, 128 MB)", "kind": "ddr3"}
      iostandard: "SSTL15 (SSTL15D for dqs/ck; LiteX)"
      pins: {"a": ["F7", "A4", "D6", "F8", "C4", "E6", "B1", "D8", "A5", "F9", "K3", "B7", "A3", "C8"], "ba": ["H4", "D3", "H5"], "ras_n": "R4", "cas_n": "R6", "we_n": "L2", "cs_n": "P5", "dm": ["G1", "K5"], "dq": ["G5", "F5", "F4", "F3", "E2", "C1", "E1", "B3", "M3", "K4", "N2", "L1", "P4", "H3", "R1", "M2"], "dqs": ["G2,G3", "J5,K6"], "ck": "J1,J3", "cke": "J2", "odt": "R3", "reset_n": "B9"}
    onboard_flash:   # SPI NOR flash U9 (XT25B32-S, 32 Mbit; configuration flash)
      device: {"name": "SPI NOR flash U9 (XT25B32-S, 32 Mbit; configuration flash)", "kind": "flash"}
      iostandard: "LVCMOS33"
      pins: {"cs_n": "M9", "clk": "L10", "miso": "P10", "mosi": "R10"}
    onboard_sdcard:   # microSD card slot J2 (SDIO, push-pull)
      device: {"name": "microSD card slot J2 (SDIO, push-pull)", "kind": "sdcard"}
      iostandard: "LVCMOS33"
      pins: {"clk": "N10", "cmd": "R14", "d": ["M8", "M7", "M10", "N11"], "cd": "D15"}
    onboard_spi_lcd:   # SPI LCD FPC connector J3 (8P 0.5 mm, e.g. 1.14" ST7789)
      device: {"name": "SPI LCD FPC connector J3 (8P 0.5 mm, e.g. 1.14\" ST7789)", "kind": "lcd_spi"}
      iostandard: "LVCMOS33"
      pins: {"bl_n": "P12", "rst_n": "G13", "rs": "J13", "sda": "L15", "scl": "F12", "cs_n": "C16"}
    onboard_reset:   # Reset supervisor U4 (SGM803, 2.93 V) on FPGA_RST
      device: {"name": "Reset supervisor U4 (SGM803, 2.93 V) on FPGA_RST", "kind": "reset"}
      active: "low"
      iostandard: "LVCMOS33"
      shares: ["onboard_buttons"]   # the board multiplexes these pins
      pins: {"rst_n": "T10"}
    onboard_jtag:   # JTAG + UART JST SH 1.0 8-pin connector J1 (SOM)
      device: {"name": "JTAG + UART JST SH 1.0 8-pin connector J1 (SOM)", "kind": "header"}
      shares: ["gpio_j1", "gpio_j3"]   # the board multiplexes these pins
      pins: ["B8", "C6", "A7", "A6", "T13", "M11"]
    onboard_configuration_mode_pins_mode0_2:   # Configuration mode pins MODE0..2
      device: {"name": "Configuration mode pins MODE0..2", "kind": "other"}
      pins: {"mode0": "M16", "mode1": "B16", "mode2": "C15"}
    onboard_other:   # Configuration status/control pins RECONFIG_N, READY, DONE
      device: {"name": "Configuration status/control pins RECONFIG_N, READY, DONE", "kind": "other"}
      shares: ["gpio_j1"]   # the board multiplexes these pins
      pins: {"reconfig_n": "B10", "ready": "A13", "done": "C13"}
    gpio_j1:   # 40-pin header J1 (2x20)
      device: {"name": "40-pin header J1 (2x20)", "kind": "header"}
      shares: ["onboard_jtag", "onboard_other"]   # the board multiplexes these pins
      pins: ["T5", "T3", "T4", "E9", "E8", "T15", "C13", "T13", "M11", "B10", "A13", "H12", "G11", "H13", "J12", "K12", "K13", "L13", "K11", "R11", "T12", "P11", "T11", "G16", "H15", "H16", "H14", "K16", "J15", "K15", "K14"]
    gpio_j3:   # 40-pin header J3 (2x20)
      device: {"name": "40-pin header J3 (2x20)", "kind": "header"}
      shares: ["gpio_2", "onboard_jtag"]   # the board multiplexes these pins
      pins: ["N6", "N7", "B11", "A12", "L9", "N8", "R9", "N9", "A6", "A7", "C6", "B8", "C10", "A11", "C11", "B12", "C12", "B13", "A14", "B14", "A15", "D14", "E15", "F16", "F14", "G15", "G14", "J14", "J16", "G12", "F13", "M14", "M15", "T14", "R13", "P13", "R12"]
