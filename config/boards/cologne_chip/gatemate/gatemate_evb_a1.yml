# gatemate_evb_a1 pin map.
#
# **Placeholder pinmap** — the GateMate Evaluation Board A1 (Cologne Chip's
# reference dev board) hosts a CCGM1A1 in BGA324, with 8 user LEDs, 4 push
# buttons, and dual UART/JTAG over an FT2232. The pad assignments below come
# from valid CCGM1A1 LOC names but have NOT been cross-checked against the
# official Cologne Chip schematic — they're enough to round-trip the
# toolchain (yosys synth → nextpnr-himbaechel → gmpack), but a real bitstream
# for a physical board needs the actual schematic-derived pinout.
#
# TODO: replace with verified pinmap from Cologne Chip's official EVB-A1
# user guide / schematic when targeting hardware.
#
# Pad name format (from chipdb-CCGM1A1.bin):
#   IO_<NSEW><AB>_<AB><0..8>     # bank + side + index
# e.g. IO_SB_A8 = South-B bank, A side, pin 8.

Board:
  id: gatemate_evb_a1
  verification:
    status: placeholder
  fpga:
    producer: Cologne Chip
    family: GateMate
    part: CCGM1A1
  defaults:
    iostandard: "LVCMOS33"

  pinBanks:
    # Cologne Chip DS1003 (GateMate A1 Evaluation Board), Table 3.3. The
    # reset button SW2 drives RST_N, not a GPIO, and the FT2232HQ carries
    # JTAG / SPI only: a UART needs a Pmod adapter.
    clk:              { pins: "IO_SB_A8", frequency_mhz: 10 }   # X1 10.000 MHz
    onboard_buttons:                          # user button SW3
      active: low
      pins: ["IO_EB_B0"]
    onboard_leds:                             # D1..D8, enabled by JP4, lit when driven low
      active: low
      pins: ["IO_EB_B1", "IO_EB_B2", "IO_EB_B3", "IO_EB_B4",
             "IO_EB_B5", "IO_EB_B6", "IO_EB_B7", "IO_EB_B8"]
    onboard_clock:   # Optional clock inputs CLOCK1..3 (X2 osc / SMA J8, and CLK2/CLK3 from the GPIO connectors via JP1/JP2) — not populated
      device: {"name": "Optional clock inputs CLOCK1..3 (X2 osc / SMA J8, and CLK2/CLK3 from the GPIO connectors via JP1/JP2) — not populated", "kind": "clock"}
      shares: ["io_sb"]   # the board multiplexes these pins
      pins: {"clock1_in": "IO_SB_A7", "clock2_in": "IO_SB_A6", "clock3_in": "IO_SB_A5"}
    onboard_hyperram:   # U10 HyperRAM S27KS0641 (64 Mbit, bank WB, 1.8 V)
      device: {"name": "U10 HyperRAM S27KS0641 (64 Mbit, bank WB, 1.8 V)", "kind": "other"}
      iostandard: "1.8 V"
      pins: {"cs_n": "IO_WB_B0", "rst_n": "IO_WB_A2", "ck": "IO_WB_A3", "ck_n": "IO_WB_B3", "rwds": "IO_WB_B4", "dq": ["IO_WB_A5", "IO_WB_B5", "IO_WB_A6", "IO_WB_B6", "IO_WB_A7", "IO_WB_B7", "IO_WB_A8", "IO_WB_B8"]}
    onboard_serial_flash:   # U5 MX25R6435F SPI flash (config bank WA)
      device: {"name": "U5 MX25R6435F SPI flash (config bank WA)", "kind": "flash"}
      iostandard: "2.5 V (VDD_WA)"
      pins: {"cs_n": "IO_WA_A8", "clk": "IO_WA_B8", "d0_mosi": "IO_WA_B7", "d1_miso": "IO_WA_A7", "d2_wp": "IO_WA_B6", "d3_hold": "IO_WA_A6"}
    onboard_usb:   # U7 FT2232HQ USB bridge (J7 mini-USB): channel A JTAG, channel B SPI
      device: {"name": "U7 FT2232HQ USB bridge (J7 mini-USB): channel A JTAG, channel B SPI", "kind": "usb"}
      pins: {"jtag_tdo": "IO_WA_B3", "jtag_tdi": "IO_WA_A4", "jtag_tms": "IO_WA_B4", "jtag_tck": "IO_WA_A5", "spi_fwd": "IO_WA_B5"}
    pmod_a:   # Pmod A J17A (bank NB via SN74CB3T3245 level shifter)
      device: {"name": "Pmod A J17A (bank NB via SN74CB3T3245 level shifter)", "kind": "pmod"}
      shares: ["onboard_buttons", "onboard_reset"]   # the board multiplexes these pins
      pins: ["IO_NB_A0", "IO_NB_A1", "IO_NB_A2", "IO_NB_A3", "IO_NB_B0", "IO_NB_B1", "IO_NB_B2", "IO_NB_B3"]
    pmod_b:   # Pmod B J17B (bank NB via SN74CB3T3245 level shifter)
      device: {"name": "Pmod B J17B (bank NB via SN74CB3T3245 level shifter)", "kind": "pmod"}
      shares: ["onboard_buttons"]   # the board multiplexes these pins
      pins: ["IO_NB_A4", "IO_NB_A5", "IO_NB_A6", "IO_NB_A7", "IO_NB_B4", "IO_NB_B5", "IO_NB_B6", "IO_NB_B7"]
    io_ea:   # J1 GPIO bank EA connector (2x23, 1.27 mm)
      device: {"name": "J1 GPIO bank EA connector (2x23, 1.27 mm)", "kind": "header"}
      shares: ["io_eb", "io_na", "io_sa", "io_sb", "io_wc"]   # the board multiplexes these pins
      pins: ["IO_EA_A8", "IO_EA_B8", "IO_EA_A7", "IO_EA_B7", "IO_EA_A6", "IO_EA_B6", "IO_EA_A5", "IO_EA_B5", "IO_EA_A4", "IO_EA_B4", "IO_EA_A3", "IO_EA_B3", "IO_EA_A2", "IO_EA_B2", "IO_EA_A1", "IO_EA_B1", "IO_EA_A0", "IO_EA_B0", "CLK3out", "CLK2out", "APP_RESET_OUT", "APP_RESET_IN", "CFG_FAILED", "CFG_DONE"]
    io_eb:   # J2 GPIO bank EB connector (2x23, 1.27 mm)
      device: {"name": "J2 GPIO bank EB connector (2x23, 1.27 mm)", "kind": "header"}
      shares: ["io_ea", "io_na", "io_sa", "io_sb", "io_wc", "onboard_leds"]   # the board multiplexes these pins
      pins: ["IO_EB_A8", "IO_EB_B8", "IO_EB_A7", "IO_EB_B7", "IO_EB_A6", "IO_EB_B6", "IO_EB_A5", "IO_EB_B5", "IO_EB_A4", "IO_EB_B4", "IO_EB_A3", "IO_EB_B3", "IO_EB_A2", "IO_EB_B2", "IO_EB_A1", "IO_EB_B1", "IO_EB_A0", "IO_EB_B0", "CLK3out", "CLK2out", "APP_RESET_OUT", "APP_RESET_IN", "CFG_FAILED", "CFG_DONE"]
    io_sa:   # J9 GPIO bank SA connector (2x23, 1.27 mm)
      device: {"name": "J9 GPIO bank SA connector (2x23, 1.27 mm)", "kind": "header"}
      shares: ["io_ea", "io_eb", "io_na", "io_sb", "io_wc"]   # the board multiplexes these pins
      pins: ["IO_SA_A8", "IO_SA_B8", "IO_SA_A7", "IO_SA_B7", "IO_SA_A6", "IO_SA_B6", "IO_SA_A5", "IO_SA_B5", "IO_SA_A4", "IO_SA_B4", "IO_SA_A3", "IO_SA_B3", "IO_SA_A2", "IO_SA_B2", "IO_SA_A1", "IO_SA_B1", "IO_SA_A0", "IO_SA_B0", "CLK3out", "CLK2out", "APP_RESET_OUT", "APP_RESET_IN", "CFG_FAILED", "CFG_DONE"]
    io_sb:   # J10 GPIO bank SB connector (2x23, 1.27 mm)
      device: {"name": "J10 GPIO bank SB connector (2x23, 1.27 mm)", "kind": "header"}
      shares: ["clk", "io_ea", "io_eb", "io_na", "io_sa", "io_wc", "onboard_clock"]   # the board multiplexes these pins
      pins: ["IO_SB_A8", "IO_SB_B8", "IO_SB_A7", "IO_SB_B7", "IO_SB_A6", "IO_SB_B6", "IO_SB_A5", "IO_SB_B5", "IO_SB_A4", "IO_SB_B4", "IO_SB_A3", "IO_SB_B3", "IO_SB_A2", "IO_SB_B2", "IO_SB_A1", "IO_SB_B1", "IO_SB_A0", "IO_SB_B0", "CLK3out", "CLK2out", "APP_RESET_OUT", "APP_RESET_IN", "CFG_FAILED", "CFG_DONE"]
    io_wc:   # J18 GPIO bank WC connector (2x23, 1.27 mm)
      device: {"name": "J18 GPIO bank WC connector (2x23, 1.27 mm)", "kind": "header"}
      shares: ["io_ea", "io_eb", "io_na", "io_sa", "io_sb"]   # the board multiplexes these pins
      pins: ["IO_WC_A0", "IO_WC_B0", "IO_WC_A1", "IO_WC_B1", "IO_WC_A2", "IO_WC_B2", "IO_WC_A3", "IO_WC_B3", "IO_WC_A4", "IO_WC_B4", "IO_WC_A5", "IO_WC_B5", "IO_WC_A6", "IO_WC_B6", "IO_WC_A7", "IO_WC_B7", "IO_WC_A8", "IO_WC_B8", "CLK3out", "CLK2out", "APP_RESET_OUT", "APP_RESET_IN", "CFG_FAILED", "CFG_DONE"]
    io_na:   # J19 GPIO bank NA connector (2x23, 1.27 mm)
      device: {"name": "J19 GPIO bank NA connector (2x23, 1.27 mm)", "kind": "header"}
      shares: ["io_ea", "io_eb", "io_sa", "io_sb", "io_wc"]   # the board multiplexes these pins
      pins: ["IO_NA_A0", "IO_NA_B0", "IO_NA_A1", "IO_NA_B1", "IO_NA_A2", "IO_NA_B2", "IO_NA_A3", "IO_NA_B3", "IO_NA_A4", "IO_NA_B4", "IO_NA_A5", "IO_NA_B5", "IO_NA_A6", "IO_NA_B6", "IO_NA_A7", "IO_NA_B7", "IO_NA_A8", "IO_NA_B8", "CLK3out", "CLK2out", "APP_RESET_OUT", "APP_RESET_IN", "CFG_FAILED", "CFG_DONE"]
