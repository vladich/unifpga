# digilent_basys2: Basys 2.

Board:
  id: digilent_basys2
  name: Basys 2
  url: https://digilent.com/reference/programmable-logic/basys-2/start
  producer: digilent
  chip: XC3S250E-CP132
  bridges:
  - jtag
  programmer: ise_impact
  features:
