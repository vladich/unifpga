# xilinx_kcu1500: AMD Kintex UltraScale FPGA KCU1500 Acceleration Development Kit.

Board:
  id: xilinx_kcu1500
  name: AMD Kintex UltraScale FPGA KCU1500 Acceleration Development Kit
  url: https://www.amd.com/en/products/adaptive-socs-and-fpgas/evaluation-boards/dk-u1-kcu1500-g.html
  status: eol
  producer: xilinx_amd
  chip: XCKU115-2FLVB2104E
  bridges:
