# alinx_axku115: Alinx AXKU115.

Board:
  id: alinx_axku115
  name: Alinx AXKU115
  url: https://www.en.alinx.com/Product/FPGA-Development-Boards/Kintex-UltraScale.html
  status: active
  producer: alinx
  chip: XCKU115-2FLVA1517I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
