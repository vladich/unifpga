# xilinx_kcu105 pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/xilinx_kcu105.py


Board:
  id: xilinx_kcu105
  name: KCU105
  url: https://www.xilinx.com/products/boards-and-kits/kcu105.html
  producer: xilinx_amd
  chip: XCKU040-2FFVA1156E
  bridges:
  - jtag
  programmer: vivado_hw
  features:
