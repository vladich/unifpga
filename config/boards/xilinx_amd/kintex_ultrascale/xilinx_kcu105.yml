        pin: G26
    qspi_flash_dq:
      pins: [M20, L20, R21, R22]
    sfp_rxn:
      pins:
        pin: V1
    sfp_rxp:
      pins:
        pin: V2
    sfp_txn:
      pins:
        pin: W3
    sfp_txp:
      pins:
        pin: W4
