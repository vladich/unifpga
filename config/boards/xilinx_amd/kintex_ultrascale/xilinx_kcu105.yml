    hdmi_spdif:
      pins:
        pin: AE12
    hdmi_spdif_out:
      pins:
        pin: AF12
    hdmi_vsync:
      pins:
        pin: AH13
    i2c_scl:
      pins:
        pin: J24
    i2c_sda:
      pins:
        pin: J25
    microsd_clk:
      pins:
        pin: AL10
    microsd_cmd:
      pins:
        pin: AD9
    microsd_data:
      pins: [AP9, AN9, AH9, AH8]
    pcie_clk_n:
      pins:
        pin: AB5
    pcie_clk_p:
      pins:
        pin: AB6
    pcie_rst_n:
