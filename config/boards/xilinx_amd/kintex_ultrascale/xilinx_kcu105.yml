  - dip_switches
  - ethernet_phy_gigabit
  - microsd_socket
  - pcie_endpoint
  - qspi_flash
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt40a256m16
  - micron_n25q256a
  - marvell_88e1111
  - silabs_cp2105
  - ftdi_ft4232h
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - ddr4_sodimm_socket
