# alinx_axku041: Alinx AXKU041.

Board:
  id: alinx_axku041
  name: Alinx AXKU041
  url: https://coderobin.com/products/alinx-axku041-xilinx-kintex-ultrascale-xcku040-fpga-development-board
  status: active
  notes: Sibling of AXKU040 (in catalog); 1xHPC + 2xLPC FMC carrier.
  producer: alinx
  chip: XCKU040-2FFVA1156I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - ethernet_10gbe_sfp
  - ethernet_phy_gigabit
  - fmc_hpc
  - fmc_lpc
  - microsd_socket
  - pcie_endpoint
  - qspi_flash
  - sd_card_socket
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
