# avnet_aes_ku040_db pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/avnet_aesku40.py


Board:
  id: avnet_aes_ku040_db
  name: Kintex UltraScale KU040 Development Board
  status: eol
  producer: avnet
  chip: XCKU040-1FBVA676C
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - qspi_flash
  - ethernet_phy_gigabit
  - usb_uart_bridge
  - usb_jtag_bridge
  - hdmi_output
  - sfp_cage
  - fmc_hpc
  - pmod_connector
  - barrel_jack_input
  devices:
  - micron_mt40a256m16
  - ddr4_sodimm_socket
  - silabs_si570
  - ftdi_ft2232h
  banks:
    cpu_resetn:
      pins: N24
    onboard_uart:
      pins:
        tx: D20
        rx: C19
    ethernet_rx:
      pins:
        pin: E11
    ethernet_tx:
      pins:
        pin: G10
    ethernet_mdio:
      pins:
        pin: C8
    ethernet_int_n:
      pins:
        pin: Y14
    ethernet_mdc:
      pins:
        pin: C9
    ethernet_rst_n:
      pins:
        pin: D9
    ethernet_rx_ctl:
      pins:
        pin: D11
    ethernet_rx_data:
      pins: [A10, B10, B11, C11]
    ethernet_tx_ctl:
      pins:
        pin: G9
    ethernet_tx_data:
      pins: [H8, H9, J9, J10]
