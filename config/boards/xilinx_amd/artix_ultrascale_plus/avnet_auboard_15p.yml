# avnet_auboard_15p: AUBoard 15P.

Board:
  id: avnet_auboard_15p
  name: AUBoard 15P
  url: https://www.avnet.com/americas/products/avnet-boards/avnet-board-families/auboard-15p-fpga-development-kit/
  status: active
  producer: avnet
  chip: XCAU15P-2FFVB676E
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - barrel_jack_input
  - ddr4_memory
  - ethernet_phy_10_100
  - ethernet_phy_gigabit
  - fmc_lpc
  - hdmi_output
  - microsd_socket
  - mikrobus_socket
  - pcie_endpoint
  - qspi_flash
  - sfp_cage
  - usb_jtag_bridge
  - usb_uart_bridge
  devices:
  - micron_mt40a256m16
  - micron_n25q256a
  - marvell_88e1512
  - ftdi_ft2232h
  - microsd_socket_generic
