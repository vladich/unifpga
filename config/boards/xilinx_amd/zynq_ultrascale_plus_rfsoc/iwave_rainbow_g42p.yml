# iwave_rainbow_g42p: iW-RainboW-G42P Zynq UltraScale+ RFSoC PCIe Dev Kit.

Board:
  id: iwave_rainbow_g42p
  name: iW-RainboW-G42P Zynq UltraScale+ RFSoC PCIe Dev Kit
  url: https://www.iwavesystems.com/product/zynq-ultrascale-rfsoc-zu49-zu39-zu29dr/
  status: active
  producer: iwave
  chip: XCZU49DR-2FFVF1760I
  bridges:
  - pcie-jtag
  programmer: vivado_hw
  extra_programmers:
  - openFPGALoader[*]
  features:
  - ddr4_memory
  - displayport_output
  - emmc_flash
  - ethernet_phy_gigabit
  - jtag_header
  - microsd_socket
  - pcie_endpoint
  - qsfp_cage
  - qspi_flash
  - usb_3_host
  - usb_uart_bridge
  devices:
  - ftdi_ft4232h
  - micron_mt40a256m16
  - macronix_mx25l25645g
  - microsd_socket_generic
