# alinx_axrf47: Alinx AXRF47.

Board:
  id: alinx_axrf47
  name: Alinx AXRF47
  url: https://docs.alinx.com/wiki/AMD-Dev-Board/RFSoC/AXRF47/AXRF47-User-Manual.html
  status: active
  producer: alinx
  chip: XCZU47DR-2FFVE1156I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - emmc_flash
  - ethernet_phy_gigabit
  - microsd_socket
  - pcie_endpoint
  - qspi_flash
  - usb_3_host
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
