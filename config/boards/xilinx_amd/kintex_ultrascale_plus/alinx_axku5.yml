# alinx_axku5: Alinx AXKU5.

Board:
  id: alinx_axku5
  name: Alinx AXKU5
  url: https://coderobin.com/products/alinx-axku5-xilinx-kintex-ultrascale-xcku5p-fpga-development-board
  status: active
  notes: Industrial-grade XCKU5P-2FFVB676I per product page; mapped to registry XCKU5P-2FFVB676E.
  producer: alinx
  chip: XCKU5P-2FFVB676I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - qspi_flash
  - sd_card_socket
  - pcie_endpoint
  - fmc_hpc
  - ethernet_phy_gigabit
  - usb_uart_bridge
  - user_leds
  - user_buttons
  devices:
  - silabs_cp2102
  - led_discrete_generic
  - pushbutton_smd_generic
