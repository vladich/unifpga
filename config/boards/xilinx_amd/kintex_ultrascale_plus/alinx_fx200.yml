# alinx_fx200 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/FX200/FX200.zip → FX200/2 FX200-管脚约束/FX200_Board.xdc


Board:
  id: alinx_fx200
  name: Alinx FX200 Accelerator Card
  url: https://www.en.alinx.com
  status: active
  producer: alinx
  chip: XCKU15P-2FFVE1517I-CIV
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - clock_generator
  - ddr4_memory
  - jtag_header
  - pcie_edge_connector
  - qsfp_cage
  - qspi_flash
  - rgb_leds
  - user_leds
  devices:
  - led_discrete_generic
  banks:
    sys_clk:
      pins: C4
      frequency_mhz: 50
    status_led_rgb:
      pins: [F13, E11, F11]
    lmk_spi:
      pins:
        sclk: K11
        mosi: L11
        cs: L12
        sync: M10
