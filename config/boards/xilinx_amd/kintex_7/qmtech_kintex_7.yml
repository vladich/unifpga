  parts:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 6}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 4, active: high, digits_active: low}, bind: {segments: [onboard_7seg.dp, onboard_7seg.cg, onboard_7seg.cf, onboard_7seg.ce, onboard_7seg.cd, onboard_7seg.cc, onboard_7seg.cb], dp: onboard_7seg.ca, digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]']}}
    - id: buttons
      label: buttons
      variants:
        - id: button_array
          label: button_array (width=4)
          attach: {peripheral: button_array, params: {width: 4}, bind: {btn: ['onboard_buttons[0]', 'onboard_buttons[1]', 'onboard_buttons[2]', 'onboard_buttons[3]']}}
        - id: button_array_2
          label: button_array (width=1; active=low)
          attach: {peripheral: button_array, params: {width: 1, active: low}, bind: {btn: ['onboard_buttons[4]']}}
    - id: db_leds
      label: Daughterboard LEDs (5)
      attach: {peripheral: led_bank, params: {width: 5}, bind: {led: onboard_db_leds.user_led}}
    - id: db_buttons
      label: Daughterboard keys (5)
      attach: {peripheral: button_array, params: {width: 5}, bind: {btn: onboard_db_buttons.user_btn}}
    - id: core_keys
      label: Core-board user keys SW2, SW3
      attach: {peripheral: button_array, params: {width: 2, active: low}, bind: {btn: [onboard_core_keys.sw2, onboard_core_keys.sw3]}}
    - id: core_leds
      label: Core-board user LEDs D2 (LED2), D3 (LED3)
      attach: {peripheral: led_bank, params: {width: 2, active: low}, bind: {led: onboard_core_leds.led}}
    - id: spi_flash
      label: SPI flash S25FL256L (32 MB, quad)
      device: {kind: flash, bank: onboard_spi_flash}   # no peripheral model yet
    - id: ddr3
      label: DDR3 SDRAM MT41K128M16JT-125:K (256 MB, 16-bit)
      device: {kind: ddr, bank: onboard_ddr3}   # no peripheral model yet
    - id: db_uart
      label: Daughterboard USB-UART (CP2102N, J4 mini-USB)
      attach: {peripheral: uart_2wire, bind: {tx: onboard_db_uart.tx, rx: onboard_db_uart.rx}}
    - id: db_ethernet_clocks
      label: Daughterboard Gigabit Ethernet RTL8211EG clocks (GMII)
      device: {kind: ethernet, bank: onboard_db_ethernet_clocks}   # no peripheral model yet
    - id: db_ethernet
      label: Daughterboard Gigabit Ethernet RTL8211EG (GMII, PHY address 001b)
      device: {kind: ethernet, bank: onboard_db_ethernet}   # no peripheral model yet
    - id: db_7seg
      label: Daughterboard 3-digit 7-segment display (U3, 2352B-type)
      device: {kind: seven_segment, bank: onboard_db_7seg}   # no peripheral model yet
    - id: db_vga
      label: Daughterboard VGA (RGB 5-6-5)
      device: {kind: vga, bank: onboard_db_vga}   # no peripheral model yet
    - id: db_sdcard
      label: Daughterboard microSD slot
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_db_sdcard.clk, cmd: onboard_db_sdcard.cmd, dat0: 'onboard_db_sdcard.data[0]', dat3: 'onboard_db_sdcard.data[3]'}}
