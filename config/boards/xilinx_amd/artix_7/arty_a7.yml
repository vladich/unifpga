# arty_a7 pin map.


Board:
  id: arty_a7
  name: Arty A7
  product: Arty A7 (Arty A7-35T / Arty A7-100T)
  summary: Xilinx Artix-7 XC7A35TICSG324-1L (33,280 logic cells) or XC7A100TCSG324-1 (101,440); 256 MB DDR3L, Quad-SPI
    flash, 10/100 Ethernet (MII PHY), 4 switches, 4 buttons, 4 LEDs + 4 RGB LEDs, 4 Pmods, chipKIT/Arduino shield
    header, USB-UART
  url: https://digilent.com/reference/programmable-logic/arty-a7/start
  producer: digilent
  chips:
  - id: xc7a35ticsg324-1l
    name: 35t
  - id: xc7a100tcsg324-1
    name: 100t
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr3_memory
  - dip_switches
  - ethernet_phy_10_100
  - qspi_flash
  - rgb_leds
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_n25q128a
  - micron_mt41k128m16
  - ti_dp83848j
  - ftdi_ft2232h
  - digilent_hs2
  - pushbutton_smd_generic
  - dip_switch_generic
  - led_discrete_generic
  - rgb_led_common_anode
  documents:
  - id: xdc
    title: Arty-A7-100-Master.xdc (Digilent master XDC, Arty A7-100T)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/digilent-xdc/00a3404901f35aa9567b01ecb3f2c233b6efe9f4/Arty-A7-100-Master.xdc
    sha256: 5c0c84302cbce49ac85f4812e8f1f7371e686964ec2eb29fd67307da9ed6835f
    bytes: 21223
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/arty_a7/xdc_100.xdc
  - id: xdc35
    title: Arty-A7-35-Master.xdc (Digilent master XDC, Arty A7-35T)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/digilent-xdc/00a3404901f35aa9567b01ecb3f2c233b6efe9f4/Arty-A7-35-Master.xdc
    sha256: 3884f49d657924e2903e7cc275ee6d4acc6e5b17a55b818ed742fc59a0818492
    bytes: 21595
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/arty_a7/xdc_35.xdc
  - id: mig
    title: Digilent Vivado board files arty-a7-100 E.0/1.1 mig.prj (DDR3 pin selection)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/vivado-boards/36f34ab687b7fa9c778b779d027f3bce63b3ace9/new/board_files/arty-a7-100/E.0/1.1/mig.prj
    sha256: 3f72593b115e717bbc9a2e219cc321b36c2b7a5786ec32d9c6178390560862ec
    bytes: 9202
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/arty_a7/mig.prj
  - id: litex
    title: LiteX-Boards platform digilent_arty.py
    kind: platform
    url: https://raw.githubusercontent.com/litex-hub/litex-boards/a05e31e6ff99fd9a1c5c96ee91e35d77e65f2397/litex_boards/platforms/digilent_arty.py
    sha256: 48c6254ca01fbe0f698ac95a27c665e45a574eff163cca7640d9188225186634
    bytes: 12658
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/arty_a7/litex.py
  defaults:
    iostandard: LVCMOS33

  banks:
    clk100mhz: { pins: E3, frequency_mhz: 100, source: {doc: xdc, where: '"Clock signal", line 7'} }
    onboard_switches:
      source: {doc: xdc, where: '"Switches", lines 11-14'}
      pins: [A8, C11, C10, A10]
    onboard_rgb_led_0:
      source: {doc: xdc, where: '"RGB LEDs", lines 17-19'}
      pins:
        b: E1
        g: F6
        r: G6
    onboard_rgb_led_1:
      source: {doc: xdc, where: '"RGB LEDs", lines 20-22'}
      pins:
        b: G4
        g: J4
        r: G3
    onboard_rgb_led_2:
      source: {doc: xdc, where: '"RGB LEDs", lines 23-25'}
      pins:
        b: H4
        g: J2
        r: J3
    onboard_rgb_led_3:
      source: {doc: xdc, where: '"RGB LEDs", lines 26-28'}
      pins:
        b: K2
        g: H6
        r: K1
    onboard_leds:
      source: {doc: xdc, where: '"LEDs", lines 31-34'}
      pins: [H5, J5, T9, T10]
    onboard_buttons:
      source: {doc: xdc, where: '"Buttons", lines 37-40'}
      pins: [D9, C9, B9, B8]
    pmod_ja:
      source: {doc: xdc, where: '"Pmod Header JA", lines 43-50; pins keyed by Pmod pin number (ports ja[0..7] = pins 1-4, 7-10)'}
      pins: [G13, B11, A11, D12, D13, B18, A18, K16]
    pmod_jb:
      source: {doc: xdc, where: '"Pmod Header JB", lines 53-60; pins keyed by Pmod pin number (ports jb[0..7] = pins 1-4, 7-10)'}
      pins: [E15, E16, D15, C15, J17, J18, K15, J15]
    pmod_jc:
      source: {doc: xdc, where: '"Pmod Header JC", lines 63-70; pins keyed by Pmod pin number (ports jc[0..7] = pins 1-4, 7-10)'}
      pins: [U12, V12, V10, V11, U14, V14, T13, U13]
    pmod_jd:
      source: {doc: xdc, where: '"Pmod Header JD", lines 73-80; pins keyed by Pmod pin number (ports jd[0..7] = pins 1-4, 7-10)'}
      pins: [D4, D3, F4, F3, E2, D2, H2, G2]
    onboard_uart:
      source: {doc: xdc, where: '"USB-UART Interface", lines 83-84; tx = uart_rxd_out (FPGA output), rx = uart_txd_in (FPGA input)'}
      pins:
        tx: D10
        rx: A9
    arduino_io:
      source: {doc: xdc, where: '"ChipKit Outer Digital Header", lines 87-118'}
      index_origin: 0
      pins: [V15, U16, P14, T11, R12, T14, T15, T16, N15, M16, V17, U18, R17, P17, U11, V16, M13, R10, R11, R13, R15, P15, R16, N16, N14, U17, T18, R18, P18, N17]
    cpu_resetn: { pins: C2, active: low, source: {doc: xdc, where: '"Misc. ChipKit Ports", line 178'} }
    arduino_analog:   # chipKIT shield analog header A0-A11 used as digital IO
      source: {doc: xdc, where: '"ChipKit Outer Analog Header - as Digital I/O", lines 138-162'}
      device: {"name": "chipKIT shield analog header A0-A11 used as digital IO", "kind": "header"}
      iostandard: "LVCMOS33"
      shares: ["onboard_xadc_shield_diff"]   # the board multiplexes these pins (A6-A11)
      pins: {"a0": "F5", "a1": "D8", "a2": "C7", "a3": "E7", "a4": "D7", "a5": "D5", "a6": "B7", "a7": "B6", "a8": "E6", "a9": "E5", "a10": "A4", "a11": "A3"}
    onboard_xadc_shield:   # XADC analog inputs A0-A5 of the shield header, single-ended: 0-3.3 V at the pin, divided 2.32k / 1k to the XADC's 0-1 V (VAUX 4, 5, 6, 7, 15, 0)
      device: {"name": "XADC analog inputs A0-A5 of the shield header, single-ended: 0-3.3 V at the pin, divided 2.32k / 1k to the XADC's 0-1 V (VAUX 4, 5, 6, 7, 15, 0)", "kind": "xadc"}
      iostandard: "LVCMOS33"
      model_params: {channels: [4, 5, 6, 7, 15, 0], full_scale_mv: 3300}
      pins: {"vaux_p": ["C6", "A6", "C4", "B1", "B3", "D14"], "vaux_n": ["C5", "A5", "B4", "A1", "B2", "C14"]}
    onboard_xadc_shield_diff:   # XADC analog inputs A6/A7, A8/A9, A10/A11 of the shield header as differential pairs, 0-1 V (VAUX 12, 13, 14); the same pins as the header's digital A6-A11
      device: {"name": "XADC analog inputs A6/A7, A8/A9, A10/A11 of the shield header as differential pairs, 0-1 V (VAUX 12, 13, 14); the same pins as the header's digital A6-A11", "kind": "xadc"}
      iostandard: "LVCMOS33"
      shares: ["arduino_analog"]   # the board multiplexes these pins
      model_params: {channels: [12, 13, 14]}
      pins: {"vaux_p": ["B7", "E6", "A4"], "vaux_n": ["B6", "E5", "A3"]}
    arduino_spi:   # chipKIT shield SPI header (J6)
      source: {doc: xdc, where: '"ChipKit SPI", lines 165-168'}
      device: {"name": "chipKIT shield SPI header (J6)", "kind": "header"}
      iostandard: "LVCMOS33"
      pins: {"miso": "G1", "mosi": "H1", "sck": "F1", "ss": "C1"}
    arduino_i2c:   # chipKIT shield I2C (SCL/SDA + pull-up enables)
      source: {doc: xdc, where: '"ChipKit I2C", lines 171-174'}
      device: {"name": "chipKIT shield I2C (SCL/SDA + pull-up enables)", "kind": "header"}
      iostandard: "LVCMOS33"
      pins: {"scl": "L18", "sda": "M18", "scl_pup": "A14", "sda_pup": "A13"}
    arduino_ioa:   # chipKIT shield IOA pin
      source: {doc: xdc, where: '"Misc. ChipKit Ports", line 177'}
      device: {"name": "chipKIT shield IOA pin", "kind": "header"}
      iostandard: "LVCMOS33"
      pins: {"ioa": "M17"}
    onboard_ethernet:   # 10/100 Ethernet PHY (MII)
      source: {doc: xdc, where: '"SMSC Ethernet PHY", lines 181-199'}
      device: {"name": "10/100 Ethernet PHY (MII)", "kind": "ethernet"}
      iostandard: "LVCMOS33"
      pins: {"col": "D17", "crs": "G14", "mdc": "F16", "mdio": "K13", "ref_clk": "G18", "rstn": "C16", "rx_clk": "F15", "rx_dv": "G16", "rxd": ["D18", "E17", "E18", "G17"], "rxerr": "C17", "tx_clk": "H16", "tx_en": "H15", "txd": ["H14", "J14", "J13", "H17"]}
    onboard_qspi_flash:   # Quad-SPI flash
      source: {doc: xdc, where: '"Quad SPI Flash", lines 202-206; sck (L16) from litex resource ("spiflash4x", 0) line 98 (the XDC omits the clock; CCLK_0 is reached via STARTUPE2)'}
      device: {"name": "Quad-SPI flash", "kind": "flash"}
      iostandard: "LVCMOS33"
      pins: {"cs": "L13", "dq": ["K17", "K18", "L14", "M14"], "sck": "L16"}
    onboard_power_sense:   # Power measurement on XADC pairs: VU voltage, 5V0 voltage, 5V0 current, 0V95 current (VAUX 2, 1, 9, 10)
      device: {"name": "Power measurement on XADC pairs: VU voltage, 5V0 voltage, 5V0 current, 0V95 current (VAUX 2, 1, 9, 10)", "kind": "xadc"}
      iostandard: "LVCMOS33"
      model_params: {channels: [2, 1, 9, 10]}
      pins: {"sense_p": ["B16", "C12", "F13", "A15"], "sense_n": ["B17", "B12", "F14", "A16"]}
    onboard_ddr3:   # DDR3L SDRAM 256 MB (MT41K128M16XX-15E)
      source: {doc: mig, where: '<PinSelection>, lines 68-115'}
      device: {"name": "DDR3L SDRAM 256 MB (MT41K128M16XX-15E)", "kind": "ddr"}
      iostandard: ["DIFF_SSTL135", "SSTL135"]
      pins: {"addr": ["R2", "M6", "N4", "T1", "N6", "R7", "V6", "U7", "R8", "V7", "R6", "U6", "T6", "T8"], "ba": ["R1", "P4", "P2"], "cas_n": "M4", "ck_n": "V9", "ck_p": "U9", "cke": "N5", "cs_n": "U8", "dm": ["L1", "U1"], "dq": ["K5", "L3", "K3", "L6", "M3", "M1", "L4", "M2", "V4", "T5", "U4", "V5", "V1", "T3", "U3", "R3"], "dqs_n": ["N1", "V2"], "dqs_p": ["N2", "U2"], "odt": "R5", "ras_n": "P3", "reset_n": "K6", "we_n": "P5"}
  # ---- drawn: headers and parts; ./unifpga layout draft arty_a7 regenerates from here on ----
  # Physical layout of the Arty A7: its connectors, which pinmap entry each
  # connector pin is, and the on-board devices as attaches.
  # Pin numbering: Digilent Arty-A7-35-Master.xdc (`Sch=ja[1]` .. `ja[10]`,
  # `Sch=ck_io[n]`), checked against config/boards/xilinx_amd/artix_7/arty_a7.yml.
  layout: {verified: true, generated: false}

  headers:
    - id: ja
      type: pmod_2x6
      label: JA
      bank: pmod_ja
      pins: {1: "pmod_ja[0]", 2: "pmod_ja[1]", 3: "pmod_ja[2]", 4: "pmod_ja[3]",
             7: "pmod_ja[4]", 8: "pmod_ja[5]", 9: "pmod_ja[6]", 10: "pmod_ja[7]"}
    - id: jb
      type: pmod_2x6
      label: JB
      bank: pmod_jb
      pins: {1: "pmod_jb[0]", 2: "pmod_jb[1]", 3: "pmod_jb[2]", 4: "pmod_jb[3]",
             7: "pmod_jb[4]", 8: "pmod_jb[5]", 9: "pmod_jb[6]", 10: "pmod_jb[7]"}
    - id: jc
      type: pmod_2x6
      label: JC
      bank: pmod_jc
      pins: {1: "pmod_jc[0]", 2: "pmod_jc[1]", 3: "pmod_jc[2]", 4: "pmod_jc[3]",
             7: "pmod_jc[4]", 8: "pmod_jc[5]", 9: "pmod_jc[6]", 10: "pmod_jc[7]"}
    - id: jd
      type: pmod_2x6
      label: JD
      bank: pmod_jd
      pins: {1: "pmod_jd[0]", 2: "pmod_jd[1]", 3: "pmod_jd[2]", 4: "pmod_jd[3]",
             7: "pmod_jd[4]", 8: "pmod_jd[5]", 9: "pmod_jd[6]", 10: "pmod_jd[7]"}
    - id: ck
      type: chipkit_shield
      label: Shield header
      bank: arduino_io
      pins: {IO0: "arduino_io[0]", IO1: "arduino_io[1]", IO2: "arduino_io[2]", IO3: "arduino_io[3]",
             IO4: "arduino_io[4]", IO5: "arduino_io[5]", IO6: "arduino_io[6]", IO7: "arduino_io[7]",
             IO8: "arduino_io[8]", IO9: "arduino_io[9]", IO10: "arduino_io[10]", IO11: "arduino_io[11]",
             IO12: "arduino_io[12]", IO13: "arduino_io[13]", IO26: "arduino_io[14]", IO27: "arduino_io[15]",
             IO28: "arduino_io[16]", IO29: "arduino_io[17]", IO30: "arduino_io[18]", IO31: "arduino_io[19]",
             IO32: "arduino_io[20]", IO33: "arduino_io[21]", IO34: "arduino_io[22]", IO35: "arduino_io[23]",
             IO36: "arduino_io[24]", IO37: "arduino_io[25]", IO38: "arduino_io[26]", IO39: "arduino_io[27]",
             IO40: "arduino_io[28]", IO41: "arduino_io[29]"}

  parts:
    - id: clock
      label: 100 MHz oscillator
      attach: {peripheral: clock_input, params: {frequency_mhz: 100}, bind: {clk: clk100mhz}}
    - id: switches
      label: SW0-SW3
      attach: {peripheral: sw_bank, params: {width: 4}, bind: {sw: onboard_switches}}
    - id: rgb_led_0
      label: LD0 (RGB)
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_0.r, g: onboard_rgb_led_0.g, b: onboard_rgb_led_0.b}}
    - id: rgb_led_1
      label: LD1 (RGB)
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_1.r, g: onboard_rgb_led_1.g, b: onboard_rgb_led_1.b}}
    - id: rgb_led_2
      label: LD2 (RGB)
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_2.r, g: onboard_rgb_led_2.g, b: onboard_rgb_led_2.b}}
    - id: rgb_led_3
      label: LD3 (RGB)
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_3.r, g: onboard_rgb_led_3.g, b: onboard_rgb_led_3.b}}
    - id: leds
      label: LD4-LD7
      attach: {peripheral: led_bank, params: {width: 4}, bind: {led: onboard_leds}}
    - id: buttons
      label: BTN0-BTN3
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: uart
      label: USB-UART (FT2232)
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: reset
      label: RESET button
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: xadc_shield
      label: XADC analog inputs A0-A5 of the shield header (0-3.3 V, single-ended)
      attach: {peripheral: xadc_aux, params: {width: 6, channels: [4, 5, 6, 7, 15, 0], full_scale_mv: 3300},
               bind: {p: onboard_xadc_shield.vaux_p, n: onboard_xadc_shield.vaux_n}}
    - id: xadc_shield_diff
      label: XADC analog pairs A6/A7, A8/A9, A10/A11 of the shield header (0-1 V)
      attach: {peripheral: xadc_aux, params: {width: 3, channels: [12, 13, 14]},
               bind: {p: onboard_xadc_shield_diff.vaux_p, n: onboard_xadc_shield_diff.vaux_n}}
    - id: power_sense
      label: Power monitor on XADC pairs (VU / 16, 5V0 / 5.99, 250 mV per A, 500 mV per A)
      attach: {peripheral: xadc_aux, params: {width: 4, channels: [2, 1, 9, 10]},
               bind: {p: onboard_power_sense.sense_p, n: onboard_power_sense.sense_n}}
