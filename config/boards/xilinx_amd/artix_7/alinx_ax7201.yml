# alinx_ax7201: Alinx AX7201.

Board:
  id: alinx_ax7201
  name: Alinx AX7201
  url: https://coderobin.com/products/alinx-ax7201-xilinx-artix-7-xc7a200t-fpga-development-board
  status: active
  notes: Companion of AX7202/AX7203 — minimum-feature variant. Same chip family as AC7200 SOM.
  producer: alinx
  chip: XC7A200T-2FBG484I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr3_memory
  - microsd_socket
  - qspi_flash
  - sd_card_socket
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - ftdi_ft2232h
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
