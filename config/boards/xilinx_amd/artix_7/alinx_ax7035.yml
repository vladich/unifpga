Board:
  id: alinx_ax7035
  pinBanks:
    sys_clk:
      pins: Y18
      frequency_mhz: 50
    cpu_resetn:
      pins: F20
    onboard_leds:
      pins:
      - F19
      - E21
      - D20
      - C20
    onboard_buttons:
      pins:
      - M13
      - K14
      - K13
      - L13
    onboard_uart:
      pins:
        tx: G16
        rx: G15
