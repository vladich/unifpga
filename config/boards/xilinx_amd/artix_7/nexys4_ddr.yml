# nexys4_ddr pin map.


Board:
  id: nexys4_ddr
  name: Nexys 4 DDR
  product: Nexys 4 DDR
  summary: Xilinx Artix-7 XC7A100T-1CSG324C (101,440 logic cells); 128 MB DDR2, Quad-SPI flash, 10/100 Ethernet (RMII),
    16 switches, 16 LEDs, 2 RGB LEDs, 8-digit 7-segment, 5 buttons + CPU reset, 12-bit VGA, PWM audio, PDM microphone,
    accelerometer, temperature sensor, microSD, USB HID host (PS/2), 4 Pmods + XADC Pmod, USB-UART
  url: https://digilent.com/reference/programmable-logic/nexys-4-ddr/start
  producer: digilent
  chip: xc7a100tcsg324-1
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - accelerometer
  - audio_amp_class_d
  - ddr2_memory
  - digital_mic_pdm
  - dip_switches
  - ethernet_phy_10_100
  - microsd_socket
  - qspi_flash
  - rgb_leds
  - seven_segment_display
  - temperature_sensor_external
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  - usb_2_host
  devices:
  - cypress_s25fl128s
  - ftdi_ft2232h
  - microchip_lan8720a
  - microsd_socket_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - led_discrete_generic
  - rgb_led_common_anode
  - seven_seg_module_shared
  - vga666_resistor_dac
  - pwm_audio_inline
  - micron_mt47h64m16
  - adi_adxl362
  - adi_admp421
  - adi_adt7420
  documents:
  - id: xdc
    title: Nexys-4-DDR-Master.xdc (Digilent master XDC)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/digilent-xdc/00a3404901f35aa9567b01ecb3f2c233b6efe9f4/Nexys-4-DDR-Master.xdc
    sha256: 36b0dd2332991699f478f430f0f01add968ff375c65c6d76a301e864ffb70572
    bytes: 19641
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys4_ddr/xdc.xdc
  - id: mig
    title: Digilent Vivado board files nexys4_ddr C.1 mig.prj (DDR2 pin selection)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/vivado-boards/36f34ab687b7fa9c778b779d027f3bce63b3ace9/new/board_files/nexys4_ddr/C.1/mig.prj
    sha256: 9dc1d22f93016d75a2a0fc81a688b4a26ae72263b3e0d240e50b613b40361425
    bytes: 9082
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys4_ddr/mig.prj
  - id: board_pins
    title: Digilent Vivado board files nexys4_ddr C.1 part0_pins.xml
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/vivado-boards/36f34ab687b7fa9c778b779d027f3bce63b3ace9/new/board_files/nexys4_ddr/C.1/part0_pins.xml
    sha256: 36dedd0599a57fc3834bd08ad394332f3530f11858d96a0129d253f85ccc2f50
    bytes: 11152
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys4_ddr/part0_pins.xml
  - id: litex
    title: LiteX-Boards platform digilent_nexys4ddr.py
    kind: platform
    url: https://raw.githubusercontent.com/litex-hub/litex-boards/a05e31e6ff99fd9a1c5c96ee91e35d77e65f2397/litex_boards/platforms/digilent_nexys4ddr.py
    sha256: fc148d0516f000cfe0ef52b31499b02edda0a65e556b9b46b3c8ce8df665f5d7
    bytes: 10239
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys4_ddr/litex.py
  defaults:
    iostandard: LVCMOS33

  banks:
    clk100mhz: { pins: E3, frequency_mhz: 100, source: {doc: xdc, where: '"Clock signal", line 7'} }
    onboard_switches:
      source: {doc: xdc, where: '"Switches", lines 13-28'}
      pins: [J15, L16, M13, R15, R17, T18, U18, R13, T8, U8, R16, T13, H6, U12, U11, V10]
      overrides:
        T8: LVCMOS18
        U8: LVCMOS18
    onboard_leds:
      source: {doc: xdc, where: '"LEDs", lines 33-48'}
      pins: [H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11]
    onboard_rgb_led_16:
      source: {doc: xdc, where: '"LEDs", lines 50-52'}
      pins:
        b: R12
        g: M16
        r: N15
    onboard_rgb_led_17:
      source: {doc: xdc, where: '"LEDs", lines 53-55'}
      pins:
        b: G14
        g: R11
        r: N16
    onboard_7seg:
      source: {doc: xdc, where: '"7 segment display", lines 60-77; segments/dp/anodes all active-low per Digilent convention (inference, not in the XDC)'}
      pins:
        ca: T10
        cb: R10
        cc: K16
        cd: K13
        ce: P15
        cf: T11
        cg: L18
        dp: H15
        anodes: [J17, J18, T9, J14, P14, T14, K2, U13]
    cpu_resetn: { pins: C12, active: low, source: {doc: xdc, where: '"Buttons", line 82'} }
    onboard_buttons:
      source: {doc: xdc, where: '"Buttons", lines 84-88'}
      pins: [N17, M18, P17, M17, P18]
    pmod_ja:
      source: {doc: xdc, where: '"Pmod Header JA", lines 96-103; pins keyed by Pmod pin number (ports JA[0..7] = JA1-4, JA7-10)'}
      pins: [C17, D18, E18, G17, D17, E17, F18, G18]
    pmod_jb:
      source: {doc: xdc, where: '"Pmod Header JB", lines 108-115; pins keyed by Pmod pin number (ports JB[0..7] = JB1-4, JB7-10)'}
      pins: [D14, F16, G16, H14, E16, F13, G13, H16]
    pmod_jc:
      source: {doc: xdc, where: '"Pmod Header JC", lines 120-127; pins keyed by Pmod pin number (ports JC[0..7] = JC1-4, JC7-10)'}
      pins: [K1, F6, J2, G6, E7, J3, J4, E6]
    pmod_jd:
      source: {doc: xdc, where: '"Pmod Header JD", lines 132-139; pins keyed by Pmod pin number (ports JD[0..7] = JD1-4, JD7-10)'}
      pins: [H4, H1, G1, G3, H2, G4, G2, F3]
    onboard_vga:
      source: {doc: xdc, where: '"VGA Connector", lines 156-172'}
      pins:
        r: [A3, B4, C5, A4]
        g: [C6, A5, B6, A6]
        b: [B7, C7, D7, D8]
        hs: B11
        vs: B12
    onboard_mic:
      source: {doc: xdc, where: '"Omnidirectional Microphone", lines 206-208'}
      pins:
        clk: J5
        data: H5
        lrsel: F5
    onboard_pwm_amp:
      device: {name: "PWM audio amplifier (Digilent)", kind: audio_amp}
      model_params: {open_drain: true}   # AUD_PWM: 1'b0 for 0 V, high-Z for 3.3 V (Digilent)
      source: {doc: xdc, where: '"PWM Audio Amplifier", lines 213-214'}
      pins:
        pwm: A11
        sd: D12
    onboard_uart:
      source: {doc: xdc, where: '"USB-RS232 Interface", lines 219-222; rx = UART_TXD_IN (FPGA input), tx = UART_RXD_OUT (FPGA output); cts/rts as the XDC names them'}
      pins:
        rx: C4
        tx: D4
    onboard_pmod_jxadc:   # Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)
      device: {"name": "Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)", "kind": "xadc"}
      iostandard: "LVDS"
      model_params: {channels: [3, 10, 2, 11]}
      pins: {"xa_p": ["A13", "A15", "B16", "B18"], "xa_n": ["A14", "A16", "B17", "A18"]}
    onboard_sdcard:   # microSD card slot
      source: {doc: xdc, where: '"Micro SD Connector", lines 177-184'}
      device: {"name": "microSD card slot", "kind": "sdcard"}
      iostandard: "LVCMOS33"
      pins: {"reset": "E2", "cd": "A1", "sck": "B1", "cmd": "C1", "dat": ["C2", "E1", "F1", "D2"]}
    onboard_accelerometer:   # 3-axis accelerometer (SPI)
      source: {doc: xdc, where: '"Accelerometer", lines 189-194'}
      device: {"name": "3-axis accelerometer (SPI)", "kind": "accelerometer"}
      iostandard: "LVCMOS33"
      pins: {"miso": "E15", "mosi": "F14", "sclk": "F15", "csn": "D15", "int": ["B13", "C16"]}
    onboard_temp_sensor:   # Temperature sensor (I2C)
      source: {doc: xdc, where: '"Temperature Sensor", lines 199-202'}
      device: {"name": "Temperature sensor (I2C)", "kind": "temperature"}
      iostandard: "LVCMOS33"
      model_params: {shift: 3}   # an ADT7420 (Digilent reference manual): 13-bit reading, 1/16 C at bit 3
      pins: {"scl": "C14", "sda": "C15", "int": "D13", "ct": "B14"}
    onboard_usb_hid:   # USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
      source: {doc: xdc, where: '"USB HID (PS/2)", lines 226-227'}
      device: {"name": "USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)", "kind": "usb_hid"}
      iostandard: "LVCMOS33"
      pins: {"clk": "F4", "data": "B2"}
    onboard_ethernet:   # 10/100 Ethernet PHY (SMSC, RMII)
      source: {doc: xdc, where: '"SMSC Ethernet PHY", lines 232-243; the XDC section is titled "SMSC Ethernet PHY"; exact part number not in the sources read; RMII inferred from the signal set (crsdv, rxd[1:0], txd[1:0], refclk)'}
      device: {"name": "10/100 Ethernet PHY (SMSC, RMII)", "kind": "ethernet"}
      iostandard: "LVCMOS33"
      pins: {"mdc": "C9", "mdio": "A9", "rstn": "B3", "crsdv": "D9", "rxerr": "C10", "rxd": ["C11", "D10"], "txen": "B9", "txd": ["A10", "A8"], "refclk": "D5", "intn": "B8"}
    onboard_qspi_flash:   # Quad-SPI flash
      source: {doc: xdc, where: '"Quad SPI Flash", lines 248-252; QSPI clock is CCLK_0 (E9), reachable only through STARTUPE2'}
      device: {"name": "Quad-SPI flash", "kind": "flash"}
      iostandard: "LVCMOS33"
      pins: {"dq": ["K17", "K18", "L14", "M14"], "csn": "L13"}
    onboard_ddr2:   # DDR2 SDRAM 128 MB (MT47H64M16HR-25E)
      source: {doc: mig, where: '<PinSelection>, lines 46-91'}
      device: {"name": "DDR2 SDRAM 128 MB (MT47H64M16HR-25E)", "kind": "ddr"}
      iostandard: ["DIFF_SSTL18_II", "SSTL18_II"]
      pins: {"addr": ["M4", "P4", "M6", "T1", "L3", "P5", "M2", "N1", "L4", "N5", "R2", "K5", "N6"], "ba": ["P2", "P3", "R1"], "cas_n": "L1", "ck_n": "L5", "ck_p": "L6", "cke": "M1", "cs_n": "K6", "dm": ["T6", "U1"], "dq": ["R7", "V6", "R8", "U7", "V7", "R6", "U6", "R5", "T5", "U3", "V5", "U4", "V4", "T4", "V1", "T3"], "dqs_n": ["V9", "V2"], "dqs_p": ["U9", "U2"], "odt": "M3", "ras_n": "N4", "we_n": "N2"}
  # ---- drawn: headers and parts; ./unifpga layout draft nexys4_ddr regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: pmod_ja
      type: pin_row
      label: PMOD_JA
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_ja
      pins: {'[0]': 'pmod_ja[0]', '[1]': 'pmod_ja[1]', '[2]': 'pmod_ja[2]', '[3]': 'pmod_ja[3]', '[4]': 'pmod_ja[4]', '[5]': 'pmod_ja[5]', '[6]': 'pmod_ja[6]', '[7]': 'pmod_ja[7]'}
    - id: pmod_jb
      type: pin_row
      label: PMOD_JB
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jb
      pins: {'[0]': 'pmod_jb[0]', '[1]': 'pmod_jb[1]', '[2]': 'pmod_jb[2]', '[3]': 'pmod_jb[3]', '[4]': 'pmod_jb[4]', '[5]': 'pmod_jb[5]', '[6]': 'pmod_jb[6]', '[7]': 'pmod_jb[7]'}
    - id: pmod_jc
      type: pin_row
      label: PMOD_JC
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jc
      pins: {'[0]': 'pmod_jc[0]', '[1]': 'pmod_jc[1]', '[2]': 'pmod_jc[2]', '[3]': 'pmod_jc[3]', '[4]': 'pmod_jc[4]', '[5]': 'pmod_jc[5]', '[6]': 'pmod_jc[6]', '[7]': 'pmod_jc[7]'}
    - id: pmod_jd
      type: pin_row
      label: PMOD_JD
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jd
      pins: {'[0]': 'pmod_jd[0]', '[1]': 'pmod_jd[1]', '[2]': 'pmod_jd[2]', '[3]': 'pmod_jd[3]', '[4]': 'pmod_jd[4]', '[5]': 'pmod_jd[5]', '[6]': 'pmod_jd[6]', '[7]': 'pmod_jd[7]'}
  parts:
    - id: clk100mhz
      label: clk100mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 100}, bind: {clk: clk100mhz}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 16}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 16}, bind: {led: onboard_leds}}
    - id: rgb_led_16
      label: rgb led 16
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_16.r, g: onboard_rgb_led_16.g, b: onboard_rgb_led_16.b}}
    - id: rgb_led_17
      label: rgb led 17
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_17.r, g: onboard_rgb_led_17.g, b: onboard_rgb_led_17.b}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 8, active: low, digits_active: low}, bind: {segments: [onboard_7seg.ca, onboard_7seg.cb, onboard_7seg.cc, onboard_7seg.cd, onboard_7seg.ce, onboard_7seg.cf, onboard_7seg.cg], dp: onboard_7seg.dp, digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]', 'onboard_7seg.anodes[6]', 'onboard_7seg.anodes[7]']}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 5}, bind: {btn: onboard_buttons}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: pwm_amp
      label: PWM audio amplifier (Digilent)
      attach: {peripheral: pwm_amp, params: {open_drain: true}, bind: {pwm: onboard_pwm_amp.pwm, sd: onboard_pwm_amp.sd}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: usb_hid
      label: USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
      attach: {peripheral: ps2_keyboard, bind: {clk: onboard_usb_hid.clk, data: onboard_usb_hid.data}}
    - id: temp_sensor
      label: Temperature sensor (I2C)
      attach: {peripheral: i2c_temperature_sensor, params: {shift: 3}, bind: {scl: onboard_temp_sensor.scl, sda: onboard_temp_sensor.sda}}
    - id: accelerometer
      label: 3-axis accelerometer (SPI)
      attach: {peripheral: spi_accelerometer, bind: {miso: onboard_accelerometer.miso, mosi: onboard_accelerometer.mosi, sclk: onboard_accelerometer.sclk, csn: onboard_accelerometer.csn}}
    - id: pmod_jxadc
      label: 'Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)'
      attach: {peripheral: xadc_aux, params: {width: 4, channels: [3, 10, 2, 11]}, bind: {p: onboard_pmod_jxadc.xa_p, n: onboard_pmod_jxadc.xa_n}}
    - id: sdcard
      label: microSD card slot
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_sdcard.sck, cmd: onboard_sdcard.cmd, dat0: 'onboard_sdcard.dat[0]', dat3: 'onboard_sdcard.dat[3]', reset: onboard_sdcard.reset}}
    - id: ethernet
      label: 10/100 Ethernet PHY (SMSC, RMII)
      device: {kind: ethernet, bank: onboard_ethernet}   # no peripheral model yet
    - id: qspi_flash
      label: Quad-SPI flash
      device: {kind: flash, bank: onboard_qspi_flash}   # no peripheral model yet
    - id: ddr2
      label: DDR2 SDRAM 128 MB (MT47H64M16HR-25E)
      device: {kind: ddr, bank: onboard_ddr2}   # no peripheral model yet
