Board:
  id: alchitry_au
  name: Alchitry Au
  url: https://alchitry.com/boards/au
  producer: alchitry
  chip: XC7A35T-1FTG256C
  bridges:
  - jtag
  programmer: vivado_hw
  banks:
    sys_clk:
      pins: N14
    cpu_resetn:
      pins: P6
    onboard_leds:
      pins: [K13, K12, L14, L13, M15, M14, M12, P14]
    onboard_uart:
      pins:
        tx: P16
        rx: P15
    qspi_flash_cs_n:
      pins:
        pin: L12
    qspi_flash_dq:
      pins: [J13, J14, K15, K16]
    qspi_flash_hold:
      pins:
        pin: K16
    qspi_flash_miso:
      pins:
        pin: J14
    qspi_flash_mosi:
      pins:
        pin: J13
    qspi_flash_wp:
      pins:
        pin: K15
