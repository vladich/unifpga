# nexys4 pin map.

Board:
  id: nexys4
  fpga:
    producer: "Xilinx (AMD)"
    family: "Artix 7"
    part: XC7A100T-1CSG324C
  defaults:
    iostandard: LVCMOS33

  pinBanks:
    clk: { pins: E3, frequency_mhz: 100 }
    onboard_switches:
      pins: [U9, U8, R7, R6, R5, V7, V6, V5, U4, V2, U2, T3, T1, R3, P3, P4]
    onboard_leds:
      pins: [T8, V9, R8, T6, T5, T4, U7, U6, V4, U3, V1, R1, P5, U1, R2, P2]
    onboard_rgb_led_1:
      pins:
        r: K5
        g: F13
        b: F6
    onboard_rgb_led_2:
      pins:
        r: K6
        g: H6
        b: L16
    onboard_7seg:
      pins:
        segments: [L3, N1, L5, L4, K3, M2, L6]
        dp: M4
        anodes: [N6, M6, M3, N5, N2, N4, L1, M1]
    cpu_resetn: { pins: C12, active: low }
    onboard_buttons:
      pins: [E16, F15, T16, R10, V10]
    # Pmod banks re-derived from the board's XDC (JA[0..7]);
    # the earlier curation had lost JA[0] and shifted the rest.
    pmod_ja:
      pins: [B13, F14, D17, E17, G13, C17, D18, E18]
    pmod_jb:
      pins: [G14, P15, V11, V15, K16, R16, T9, U11]
    pmod_jc:
      pins: [K2, E7, J3, J4, K1, E6, J2, G6]
    pmod_jd:
      pins: [H4, H1, G1, G3, H2, G4, G2, F3]
    onboard_vga:
      pins:
        r: [A3, B4, C5, A4]
        b: [B7, C7, D7, D8]
        g: [C6, A5, B6, A6]
        hs: B11
        vs: B12
    onboard_mic:
      pins:
        clk: J5
        data: H5
        lrsel: F5
    onboard_pwm_amp:
      pins:
        pwm: A11
        sd: D12
    onboard_uart:
      pins:
        rx: C4
    onboard_pmod_jxadc:   # Pmod header JXADC (XADC analog pairs; usable as digital IO)
      device: {"name": "Pmod header JXADC (XADC analog pairs; usable as digital IO)", "kind": "xadc"}
      iostandard: "LVCMOS33"
      pins: {"xadc1_p": "A13", "xadc2_p": "A15", "xadc3_p": "B16", "xadc4_p": "B18", "xadc1_n": "A14", "xadc2_n": "A16", "xadc3_n": "B17", "xadc4_n": "A18"}
    onboard_sdcard:   # microSD card slot
      device: {"name": "microSD card slot", "kind": "sdcard"}
      iostandard: "LVCMOS33"
      pins: {"reset": "E2", "cd": "A1", "sck": "B1", "cmd": "C1", "dat": ["C2", "E1", "F1", "D2"]}
    onboard_accelerometer:   # 3-axis accelerometer (SPI)
      device: {"name": "3-axis accelerometer (SPI)", "kind": "accelerometer"}
      iostandard: "LVCMOS33"
      pins: {"miso": "D13", "mosi": "B14", "sclk": "D15", "csn": "C15", "int1": "C16", "int2": "E15"}
    onboard_temp_sensor:   # Temperature sensor (I2C)
      device: {"name": "Temperature sensor (I2C)", "kind": "temperature"}
      iostandard: "LVCMOS33"
      pins: {"scl": "F16", "sda": "G16", "int": "D14", "ct": "C14"}
    onboard_usb_hid:   # USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
      device: {"name": "USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)", "kind": "usb_hid"}
      iostandard: "LVCMOS33"
      pins: {"clk": "F4", "data": "B2"}
    onboard_ethernet:   # 10/100 Ethernet PHY (SMSC, RMII)
      device: {"name": "10/100 Ethernet PHY (SMSC, RMII)", "kind": "ethernet"}
      iostandard: "LVCMOS33"
      pins: {"mdc": "C9", "mdio": "A9", "rstn": "B3", "crsdv": "D9", "rxerr": "C10", "rxd": ["D10", "C11"], "txen": "B9", "txd": ["A10", "A8"], "refclk": "D5", "intn": "B8"}
    onboard_qspi_flash:   # Quad-SPI flash
      device: {"name": "Quad-SPI flash", "kind": "flash"}
      iostandard: "LVCMOS33"
      pins: {"sck": "E9", "dq": ["K17", "K18", "L14", "M14"], "csn": "L13"}
    onboard_cellular_ram:   # Cellular RAM (PSRAM, 16-bit data, 23-bit address)
      device: {"name": "Cellular RAM (PSRAM, 16-bit data, 23-bit address)", "kind": "sdram"}
      iostandard: "LVCMOS33"
      pins: {"clk": "T15", "advn": "T13", "cen": "L18", "cre": "J14", "oen": "H14", "wen": "R11", "lbn": "J15", "ubn": "J13", "wait": "T14", "db": ["R12", "T11", "U12", "R13", "U18", "R17", "T18", "R18", "F18", "G18", "G17", "M18", "M17", "P18", "N17", "P17"], "adr": ["J18", "H17", "H15", "J17", "H16", "K15", "K13", "N15", "V16", "U14", "V14", "V12", "P14", "U16", "R15", "N14", "N16", "M13", "V17", "U17", "T10", "M16", "U13"]}
