# nexys4 pin map.


Board:
  id: nexys4
  name: Nexys 4
  product: Nexys 4 (Nexys4, rev. B)
  summary: Xilinx Artix-7 XC7A100T-1CSG324C (101,440 logic cells); 16 MB Cellular RAM (PSRAM), Quad-SPI flash, 10/100
    Ethernet (RMII), 16 switches, 16 LEDs, 2 RGB LEDs, 8-digit 7-segment, 5 buttons + CPU reset, 12-bit VGA, PWM audio,
    PDM microphone, accelerometer, temperature sensor, microSD, USB HID host (PS/2), 4 Pmods + XADC Pmod, USB-UART
  url: https://digilent.com/reference/programmable-logic/nexys-4/start
  producer: digilent
  chip: xc7a100tcsg324-1
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - accelerometer
  - audio_amp_class_d
  - digital_mic_pdm
  - dip_switches
  - ethernet_phy_10_100
  - microsd_socket
  - qspi_flash
  - rgb_leds
  - sdr_sdram
  - seven_segment_display
  - temperature_sensor_external
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  - usb_2_host
  - sram
  devices:
  - cypress_s25fl128s
  - ftdi_ft2232h
  - microchip_lan8720a
  - microsd_socket_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - led_discrete_generic
  - rgb_led_common_anode
  - seven_seg_module_shared
  - vga666_resistor_dac
  - pwm_audio_inline
  - micron_mt45w8mw16
  - adi_adxl362
  - adi_admp421
  - adi_adt7420
  documents:
  - id: xdc
    title: Nexys-4-Master.xdc (Digilent master XDC, Nexys4 rev B)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/digilent-xdc/00a3404901f35aa9567b01ecb3f2c233b6efe9f4/Nexys-4-Master.xdc
    sha256: b587f232b2187d5068611a5599964ff31ee3bb5a6652219c645b65586970b8db
    bytes: 38038
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys4/xdc.xdc
  - id: board_pins
    title: Digilent Vivado board files nexys4 B.1 part0_pins.xml
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/vivado-boards/36f34ab687b7fa9c778b779d027f3bce63b3ace9/new/board_files/nexys4/B.1/part0_pins.xml
    sha256: 98f518d80d06d2bc1722f6ea2a912f9883b6482c7f0d4f7546e10d46e920c3a7
    bytes: 14837
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys4/part0_pins.xml
  - id: litex
    title: LiteX-Boards platform digilent_nexys4.py
    kind: platform
    url: https://raw.githubusercontent.com/litex-hub/litex-boards/a05e31e6ff99fd9a1c5c96ee91e35d77e65f2397/litex_boards/platforms/digilent_nexys4.py
    sha256: 88cbdc8e11438f476bf286510d9ea17760b805d2c264f77b3badc8f4bc8c5225
    bytes: 10554
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys4/litex.py
  defaults:
    iostandard: LVCMOS33

  banks:
    clk:
      pins: E3
      frequency_mhz: 100
      source:
        doc: xdc
        where: '"Clock signal", line 8'
    onboard_switches:
      source:
        doc: xdc
        where: '"Switches", lines 14-59'
      pins: [U9, U8, R7, R6, R5, V7, V6, V5, U4, V2, U2, T3, T1, R3, P3, P4]
    onboard_leds:
      source:
        doc: xdc
        where: '"LEDs", lines 66-111'
      pins: [T8, V9, R8, T6, T5, T4, U7, U6, V4, U3, V1, R1, P5, U1, R2, P2]
    onboard_rgb_led_1:
      source:
        doc: xdc
        where: '"LEDs", lines 115-121; ports RGB1_Red/Green/Blue, Sch names LED16_R/G/B'
      pins:
        r: K5
        g: F13
        b: F6
    onboard_rgb_led_2:
      source:
        doc: xdc
        where: '"LEDs", lines 124-130; ports RGB2_Red/Green/Blue, Sch names LED17_R/G/B'
      pins:
        r: K6
        g: H6
        b: L16
    onboard_7seg:
      source:
        doc: xdc
        where: '"7 segment display", lines 137-184; segments/dp/anodes all active-low per Digilent convention (inference, not in the XDC)'
      pins:
        segments: [L3, N1, L5, L4, K3, M2, L6]
        dp: M4
        anodes: [N6, M6, M3, N5, N2, N4, L1, M1]
    cpu_resetn:
      pins: C12
      active: low
      source:
        doc: xdc
        where: '"Buttons", line 191'
    onboard_buttons:
      source:
        doc: xdc
        where: '"Buttons", lines 194-206'
      pins: [E16, F15, T16, R10, V10]
    # Pmod banks re-derived from the board's XDC (JA[0..7]);
    # the earlier curation had lost JA[0] and shifted the rest.
    pmod_ja:
      source:
        doc: xdc
        where: '"Pmod Header JA", lines 213-234; pins keyed by Pmod pin number (ports JA[0..7] = JA1-4, JA7-10)'
      pins: [B13, F14, D17, E17, G13, C17, D18, E18]
    pmod_jb:
      source:
        doc: xdc
        where: '"Pmod Header JB", lines 241-262; pins keyed by Pmod pin number (ports JB[0..7] = JB1-4, JB7-10)'
      pins: [G14, P15, V11, V15, K16, R16, T9, U11]
    pmod_jc:
      source:
        doc: xdc
        where: '"Pmod Header JC", lines 269-290; pins keyed by Pmod pin number (ports JC[0..7] = JC1-4, JC7-10)'
      pins: [K2, E7, J3, J4, K1, E6, J2, G6]
    pmod_jd:
      source:
        doc: xdc
        where: '"Pmod Header JD", lines 297-318; pins keyed by Pmod pin number (ports JD[0..7] = JD1-4, JD7-10)'
      pins: [H4, H1, G1, G3, H2, G4, G2, F3]
    onboard_vga:
      source:
        doc: xdc
        where: '"VGA Connector", lines 353-392'
      pins:
        r: [A3, B4, C5, A4]
        b: [B7, C7, D7, D8]
        g: [C6, A5, B6, A6]
        hs: B11
        vs: B12
    onboard_mic:
      source:
        doc: xdc
        where: '"Omnidirectional Microphone", lines 465-471'
      pins:
        clk: J5
        data: H5
        lrsel: F5
    onboard_pwm_amp:
      device:
        name: PWM audio amplifier (Digilent)
        kind: audio_amp
      model_params:   # AUD_PWM: 1'b0 for 0 V, high-Z for 3.3 V (Digilent)
        open_drain: true
      source:
        doc: xdc
        where: '"PWM Audio Amplifier", lines 478-481'
      pins:
        pwm: A11
        sd: D12
    onboard_uart:
      source:
        doc: xdc
        where: '"USB-RS232 Interface", lines 487-496; rx = UART_TXD_IN (FPGA input), tx = UART_RXD_OUT (FPGA output); cts/rts as the XDC names them'
      pins:
        rx: C4
    onboard_pmod_jxadc:   # Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)
      device:
        name: 'Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)'
        kind: xadc
      iostandard: "LVCMOS33"
      model_params:
        channels: [3, 10, 2, 11]
      pins:
        xa_p: [A13, A15, B16, B18]
        xa_n: [A14, A16, B17, A18]
    onboard_sdcard:   # microSD card slot
      source:
        doc: xdc
        where: '"Micro SD Connector", lines 399-420'
      device:
        name: microSD card slot
        kind: sdcard
      iostandard: "LVCMOS33"
      pins:
        reset: E2
        cd: A1
        sck: B1
        cmd: C1
        dat: [C2, E1, F1, D2]
    onboard_accelerometer:   # 3-axis accelerometer (SPI)
      source:
        doc: xdc
        where: '"Accelerometer", lines 427-442'
      device:
        name: 3-axis accelerometer (SPI)
        kind: accelerometer
      iostandard: "LVCMOS33"
      pins:
        miso: D13
        mosi: B14
        sclk: D15
        csn: C15
        int1: C16
        int2: E15
    onboard_temp_sensor:   # Temperature sensor (I2C)
      source:
        doc: xdc
        where: '"Temperature Sensor", lines 449-458'
      device:
        name: Temperature sensor (I2C)
        kind: temperature
      iostandard: "LVCMOS33"
      model_params:   # an ADT7420 (Digilent reference manual): 13-bit reading, 1/16 C at bit 3
        shift: 3
      pins:
        scl: F16
        sda: G16
        int: D14
        ct: C14
    onboard_usb_hid:   # USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
      source:
        doc: xdc
        where: '"USB HID (PS/2)", lines 503-507'
      device:
        name: USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
        kind: usb_hid
      iostandard: "LVCMOS33"
      pull: "up"   # the PIC24 bridge leaves the pair to the FPGA's pull-ups (Digilent master XDC: PULLUP true)
      pins:
        clk: F4
        data: B2
    onboard_ethernet:   # 10/100 Ethernet PHY (SMSC, RMII)
      source:
        doc: xdc
        where: '"SMSC Ethernet PHY", lines 515-548; the XDC section is titled "SMSC Ethernet PHY"; exact part number not in the sources read; RMII inferred from the signal set (crsdv, rxd[1:0], txd[1:0], refclk)'
      device:
        name: 10/100 Ethernet PHY (SMSC, RMII)
        kind: ethernet
      iostandard: "LVCMOS33"
      pins:
        mdc: C9
        mdio: A9
        rstn: B3
        crsdv: D9
        rxerr: C10
        rxd: [D10, C11]
        txen: B9
        txd: [A10, A8]
        refclk: D5
        intn: B8
    onboard_qspi_flash:   # Quad-SPI flash
      source:
        doc: xdc
        where: '"Quad SPI Flash", lines 555-570'
      device:
        name: Quad-SPI flash
        kind: flash
      iostandard: "LVCMOS33"
      pins:
        sck: E9
        dq: [K17, K18, L14, M14]
        csn: L13
    onboard_cellular_ram:   # Cellular RAM (PSRAM, 16-bit data, 23-bit address)
      source:
        doc: xdc
        where: '"Cellular RAM", lines 577-720'
      device:
        name: Cellular RAM (PSRAM, 16-bit data, 23-bit address)
        kind: sram
      iostandard: "LVCMOS33"
      model_params:
        access_ns: 70
      pins:
        clk: T15
        advn: T13
        cen: L18
        cre: J14
        oen: H14
        wen: R11
        lbn: J15
        ubn: J13
        wait: T14
        db: [R12, T11, U12, R13, U18, R17, T18, R18, F18, G18, G17, M18, M17, P18, N17, P17]
        adr: [J18, H17, H15, J17, H16, K15, K13, N15, V16, U14, V14, V12, P14, U16, R15, N14, N16, M13, V17, U17, T10, M16, U13]
  # ---- drawn: headers and parts; ./unifpga layout draft nexys4 regenerates from here on ----
  layout:
    verified: false
    generated: true
  headers:
    - id: pmod_ja
      type: pin_row
      label: PMOD_JA
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_ja
      pins:
        '[0]': pmod_ja[0]
        '[1]': pmod_ja[1]
        '[2]': pmod_ja[2]
        '[3]': pmod_ja[3]
        '[4]': pmod_ja[4]
        '[5]': pmod_ja[5]
        '[6]': pmod_ja[6]
        '[7]': pmod_ja[7]
    - id: pmod_jb
      type: pin_row
      label: PMOD_JB
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jb
      pins:
        '[0]': pmod_jb[0]
        '[1]': pmod_jb[1]
        '[2]': pmod_jb[2]
        '[3]': pmod_jb[3]
        '[4]': pmod_jb[4]
        '[5]': pmod_jb[5]
        '[6]': pmod_jb[6]
        '[7]': pmod_jb[7]
    - id: pmod_jc
      type: pin_row
      label: PMOD_JC
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jc
      pins:
        '[0]': pmod_jc[0]
        '[1]': pmod_jc[1]
        '[2]': pmod_jc[2]
        '[3]': pmod_jc[3]
        '[4]': pmod_jc[4]
        '[5]': pmod_jc[5]
        '[6]': pmod_jc[6]
        '[7]': pmod_jc[7]
    - id: pmod_jd
      type: pin_row
      label: PMOD_JD
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jd
      pins:
        '[0]': pmod_jd[0]
        '[1]': pmod_jd[1]
        '[2]': pmod_jd[2]
        '[3]': pmod_jd[3]
        '[4]': pmod_jd[4]
        '[5]': pmod_jd[5]
        '[6]': pmod_jd[6]
        '[7]': pmod_jd[7]
  parts:
    - id: clk
      label: clk
      attach:
        peripheral: clock_input
        bind:
          clk: clk
    - id: switches
      label: switches
      attach:
        peripheral: sw_bank
        params:
          width: 16
        bind:
          sw: onboard_switches
    - id: leds
      label: leds
      attach:
        peripheral: led_bank
        params:
          width: 16
        bind:
          led: onboard_leds
    - id: rgb_led_1
      label: rgb led 1
      attach:
        peripheral: rgb_led
        bind:
          r: onboard_rgb_led_1.r
          g: onboard_rgb_led_1.g
          b: onboard_rgb_led_1.b
    - id: rgb_led_2
      label: rgb led 2
      attach:
        peripheral: rgb_led
        bind:
          r: onboard_rgb_led_2.r
          g: onboard_rgb_led_2.g
          b: onboard_rgb_led_2.b
    - id: 7seg
      label: 7seg
      attach:
        peripheral: seven_segment_8digit_shared
        params:
          digits: 8
          active: low
          digits_active: low
        bind:
          segments: ['onboard_7seg.segments[0]', 'onboard_7seg.segments[1]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[6]']
          dp: onboard_7seg.dp
          digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]', 'onboard_7seg.anodes[6]', 'onboard_7seg.anodes[7]']
    - id: cpu_resetn
      label: cpu resetn
      attach:
        peripheral: reset_button
        bind:
          rst: cpu_resetn
    - id: buttons
      label: buttons
      attach:
        peripheral: button_array
        params:
          width: 5
        bind:
          btn: onboard_buttons
    - id: vga
      label: vga
      attach:
        peripheral: vga_4bit
        params:
          bits_r: 4
          bits_g: 4
          bits_b: 4
          pin_bits_r: 4
          pin_bits_g: 4
          pin_bits_b: 4
          color_depth: 444
        bind:
          r: onboard_vga.r
          g: onboard_vga.g
          b: onboard_vga.b
          hs: onboard_vga.hs
          vs: onboard_vga.vs
    - id: uart
      label: uart
      attach:
        peripheral: uart_2wire
        bind:
          rx: onboard_uart.rx
    - id: usb_hid
      label: USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
      attach:
        peripheral: ps2_keyboard
        bind:
          clk: onboard_usb_hid.clk
          data: onboard_usb_hid.data
    - id: temp_sensor
      label: Temperature sensor (I2C)
      attach:
        peripheral: i2c_temperature_sensor
        params:
          shift: 3
        bind:
          scl: onboard_temp_sensor.scl
          sda: onboard_temp_sensor.sda
    - id: accelerometer
      label: 3-axis accelerometer (SPI)
      attach:
        peripheral: spi_accelerometer
        bind:
          miso: onboard_accelerometer.miso
          mosi: onboard_accelerometer.mosi
          sclk: onboard_accelerometer.sclk
          csn: onboard_accelerometer.csn
    - id: pmod_jxadc
      label: 'Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)'
      attach:
        peripheral: xadc_aux
        params:
          width: 4
          channels: [3, 10, 2, 11]
        bind:
          p: onboard_pmod_jxadc.xa_p
          n: onboard_pmod_jxadc.xa_n
    - id: cellular_ram
      label: Cellular RAM (PSRAM, 16-bit data, 23-bit address)
      attach:
        peripheral: async_sram
        params:
          addr_bits: 23
          access_ns: 70
        bind:
          a: onboard_cellular_ram.adr
          d: onboard_cellular_ram.db
          ce_n: onboard_cellular_ram.cen
          oe_n: onboard_cellular_ram.oen
          we_n: onboard_cellular_ram.wen
          lb_n: onboard_cellular_ram.lbn
          ub_n: onboard_cellular_ram.ubn
          adv_n: onboard_cellular_ram.advn
          cre: onboard_cellular_ram.cre
          clk: onboard_cellular_ram.clk
          wait: onboard_cellular_ram.wait
    - id: sdcard
      label: microSD card slot
      attach:
        peripheral: sdcard_spi
        bind:
          clk: onboard_sdcard.sck
          cmd: onboard_sdcard.cmd
          dat0: onboard_sdcard.dat[0]
          dat3: onboard_sdcard.dat[3]
          reset: onboard_sdcard.reset
    - id: pwm_amp
      label: PWM audio amplifier (Digilent)
      attach:
        peripheral: pwm_amp
        params:
          open_drain: true
        bind:
          pwm: onboard_pwm_amp.pwm
          sd: onboard_pwm_amp.sd
    - id: ethernet
      label: 10/100 Ethernet PHY (SMSC, RMII)
      device:   # no peripheral model yet
        kind: ethernet
        bank: onboard_ethernet
    - id: qspi_flash
      label: Quad-SPI flash
      device:   # no peripheral model yet
        kind: flash
        bank: onboard_qspi_flash
