  defaults:
    iostandard: LVCMOS33

  banks:
    clk50mhz: { pins: J19, frequency_mhz: 50, source: {doc: xdc, where: line 59} }
    cpu_resetn: { pins: L18, active: low, source: {doc: xdc, where: line 76} }
    onboard_buttons:
      source: {doc: xdc, where: lines 70-71}
      pins: [AA1, W1]
    onboard_leds:
      source: {doc: xdc, where: lines 66-67}
      active: low
      pins: [M18, N18]
    onboard_uart:
      source: {doc: xdc, where: lines 83-84}
      pins:
        rx: U2
        tx: V2
    onboard_hdmi:
      source: {doc: xdc, where: lines 103-115}
      # TMDS pairs from the FGG484 package (IO_L14P/N_T2_SRCC_15, L9P/N, L11P/N,
      # L4P/N); the XDC constrains the P pins only, Vivado places the N halves.
      iostandard: TMDS_33
      pins:
        clk_p: "L19,L20"
        clk_n: L20
        d_p: ["K21,K22", "J20,J21", "G17,G18"]
        d_n: [K22, J21, G18]
    gpio:
      source: {doc: xdc, where: lines 232-275}
      pins: [F13, F14, E13, E14, D14, D15, E16, D16, D17, D21, G21, C22, B22]
    onboard_qspi_flash:   # QSPI flash
      source: {doc: xdc, where: lines 91-96}
