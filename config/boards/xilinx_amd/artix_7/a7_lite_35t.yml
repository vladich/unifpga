  # ---- drawn: headers and parts; ./unifpga layout draft a7_lite_35t regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: gpio
      type: pin_row
      label: GPIO
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]'}
  parts:
    - id: clk50mhz
      label: clk50mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk50mhz}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 2}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 2}, bind: {led: onboard_leds}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: hdmi
      label: hdmi
      attach: {peripheral: hdmi_tmds, params: {timing: dvi, clock_serial_mhz: 250}, bind: {clk_p: onboard_hdmi.clk_p, d_p: onboard_hdmi.d_p, clk_n: onboard_hdmi.clk_n, d_n: onboard_hdmi.d_n}}
    - id: qspi_flash
      label: QSPI flash
      device: {kind: flash, bank: onboard_qspi_flash}   # no peripheral model yet
    - id: eeprom
      label: I2C EEPROM
      device: {kind: other, bank: onboard_eeprom}   # no peripheral model yet
    - id: sdcard
      label: microSD card slot
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_sdcard.clk, cmd: onboard_sdcard.cmd, dat0: onboard_sdcard.data0, dat3: onboard_sdcard.data3}}
    - id: ddr3
      label: DDR3 SDRAM (MT41K256M16, 512 MB, 16-bit)
      device: {kind: ddr, bank: onboard_ddr3}   # no peripheral model yet
    - id: ethernet
      label: Gigabit Ethernet PHY (RTL8211, RGMII)
      device: {kind: ethernet, bank: onboard_ethernet}   # no peripheral model yet
    - id: gpio_jp2
      label: GPIO header JP2 (50-pin, 22 differential pairs GPIO2_0P/N..21P/N)
      device: {kind: header, bank: gpio_jp2}   # no peripheral model yet
