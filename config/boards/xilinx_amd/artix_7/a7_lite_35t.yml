# a7_lite_35t pin map.

Board:
  id: a7_lite_35t
  fpga:
    producer: "Xilinx (AMD)"
    family: "Artix 7"
    part: XC7A35TFGG484-1
  defaults:
    iostandard: LVCMOS33

  pinBanks:
    clk50mhz: { pins: J19, frequency_mhz: 50 }
    cpu_resetn: { pins: L18, active: low }
    onboard_buttons:
      pins: [AA1, W1]
    onboard_leds:
      active: low
      pins: [M18, N18]
    onboard_uart:
      pins:
        rx: U2
        tx: V2
    onboard_hdmi:
      # TMDS pairs from the FGG484 package (IO_L14P/N_T2_SRCC_15, L9P/N, L11P/N,
      # L4P/N); the XDC constrains the P pins only, Vivado places the N halves.
      iostandard: TMDS_33
      pins:
        clk_p: "L19,L20"
        clk_n: L20
        d_p: ["K21,K22", "J20,J21", "G17,G18"]
        d_n: [K22, J21, G18]
    gpio:
      pins: [F13, F14, E13, E14, D14, D15, E16, D16, D17, D21, G21, C22, B22]
    onboard_qspi_flash:   # QSPI flash
      device: {"name": "QSPI flash", "kind": "flash"}
      pins: {"clk": "L12", "cs": "P20", "dq0": "P22", "dq1": "R22", "dq2": "P21", "dq3": "R21"}
    onboard_eeprom:   # I2C EEPROM
      device: {"name": "I2C EEPROM", "kind": "other"}
      pins: {"scl": "H15", "sda": "H17"}
    onboard_sdcard:   # microSD card slot
      device: {"name": "microSD card slot", "kind": "sdcard"}
      pins: {"clk": "U7", "cmd": "AA8", "data0": "Y7", "data1": "W9", "data2": "Y8", "data3": "AB8"}
    onboard_ddr3:   # DDR3 SDRAM (MT41K256M16, 512 MB, 16-bit)
      device: {"name": "DDR3 SDRAM (MT41K256M16, 512 MB, 16-bit)", "kind": "ddr"}
      iostandard: "SSTL15 / DIFF_SSTL15 (XDC)"
      pins: {"A0": "P1", "A1": "M6", "A2": "K3", "A3": "K4", "A4": "M5", "A5": "J6", "A6": "N2", "A7": "K6", "A8": "P2", "A9": "L1", "A10": "M2", "A11": "P6", "A12": "L4", "A13": "L5", "A14": "N5", "BA0": "J4", "BA1": "R1", "BA2": "M1", "nCAS": "N3", "nRAS": "M3", "nWE": "L6", "CKE": "N4", "ODT": "L3", "nRST": "F4", "CK_P": "P5", "CK_N": "P4", "D0": "B2", "D1": "F1", "D2": "B1", "D3": "D2", "D4": "C2", "D5": "F3", "D6": "A1", "D7": "G1", "D8": "J5", "D9": "G2", "D10": "K1", "D11": "G3", "D12": "H2", "D13": "H5", "D14": "J1", "D15": "H4", "DM0": "E2", "DM1": "H3", "DQS_P0": "E1", "DQS_N0": "D1", "DQS_P1": "K2", "DQS_N1": "J2"}
    onboard_ethernet:   # Gigabit Ethernet PHY (RTL8211, RGMII)
      device: {"name": "Gigabit Ethernet PHY (RTL8211, RGMII)", "kind": "ethernet"}
      iostandard: "LVCMOS33"
      pins: {"rst_n": "N22", "mdc": "M22", "mdio": "M20", "rx_clk": "K18", "rx_ctl": "K19", "rxd": ["L14", "M15", "L16", "M16"], "tx_clk": "K17", "tx_ctl": "N20", "txd": ["K16", "L15", "L13", "M13"]}
    gpio_jp2:   # GPIO header JP2 (50-pin, 22 differential pairs GPIO2_0P/N..21P/N)
      device: {"name": "GPIO header JP2 (50-pin, 22 differential pairs GPIO2_0P/N..21P/N)", "kind": "header"}
      pins: {"GPIO2_0P": "W21", "GPIO2_0N": "W22", "GPIO2_1P": "N17", "GPIO2_1N": "P17", "GPIO2_2P": "P19", "GPIO2_2N": "R19", "GPIO2_3P": "R18", "GPIO2_3N": "T18", "GPIO2_4P": "T21", "GPIO2_4N": "U21", "GPIO2_5P": "U22", "GPIO2_5N": "V22", "GPIO2_6P": "Y21", "GPIO2_6N": "Y22", "GPIO2_7P": "AA20", "GPIO2_7N": "AA21", "GPIO2_8P": "AB21", "GPIO2_8N": "AB22", "GPIO2_9P": "AA19", "GPIO2_9N": "AB20", "GPIO2_10P": "U20", "GPIO2_10N": "V20", "GPIO2_11P": "Y18", "GPIO2_11N": "Y19", "GPIO2_12P": "W19", "GPIO2_12N": "W20", "GPIO2_13P": "AA18", "GPIO2_13N": "AB18", "GPIO2_14P": "V18", "GPIO2_14N": "V19", "GPIO2_15P": "V17", "GPIO2_15N": "W17", "GPIO2_16P": "U17", "GPIO2_16N": "U18", "GPIO2_17P": "P14", "GPIO2_17N": "R14", "GPIO2_18P": "P16", "GPIO2_18N": "R17", "GPIO2_19P": "N13", "GPIO2_19N": "N14", "GPIO2_20P": "P15", "GPIO2_20N": "R16", "GPIO2_21P": "AB7", "GPIO2_21N": "AB6"}
