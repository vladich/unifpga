# nexys_a7 pin map.


Board:
  id: nexys_a7
  name: Nexys A7
  product: Nexys A7 (Nexys A7-100T / Nexys A7-50T)
  summary: Xilinx Artix-7 XC7A100T-1CSG324C (101,440 logic cells) or XC7A50T-1CSG324I (52,160); 128 MB DDR2, Quad-SPI
    flash, 10/100 Ethernet (RMII), 16 switches, 16 LEDs, 2 RGB LEDs, 8-digit 7-segment, 5 buttons + CPU reset, 12-bit
    VGA, PWM audio, PDM microphone, accelerometer, temperature sensor, microSD, USB HID host (PS/2), 4 Pmods + XADC
    Pmod, USB-UART
  url: https://digilent.com/reference/programmable-logic/nexys-a7/start
  producer: digilent
  chips:
  - id: xc7a50ticsg324-1L
    name: 50t
  - id: xc7a100tcsg324-1
    name: 100t
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - accelerometer
  - audio_amp_class_d
  - ddr2_memory
  - digital_mic_pdm
  - dip_switches
  - ethernet_phy_10_100
  - microsd_socket
  - qspi_flash
  - rgb_leds
  - seven_segment_display
  - temperature_sensor_external
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  - usb_2_host
  devices:
  - cypress_s25fl128s
  - ftdi_ft2232h
  - microchip_lan8720a
  - microsd_socket_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - led_discrete_generic
  - rgb_led_common_anode
  - seven_seg_module_shared
  - vga666_resistor_dac
  - pwm_audio_inline
  - micron_mt47h64m16
  - adi_adxl362
  - adi_admp421
  - adi_adt7420
  documents:
  - id: xdc
    title: Nexys-A7-100T-Master.xdc (Digilent master XDC)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/digilent-xdc/00a3404901f35aa9567b01ecb3f2c233b6efe9f4/Nexys-A7-100T-Master.xdc
    sha256: 40b8d2b557673d90fbb20018210e4e3460c52e071696edaebd4b6ad5b00599e2
    bytes: 19751
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys_a7/xdc_100t.xdc
  - id: xdc50
    title: Nexys-A7-50T-Master.xdc (Digilent master XDC)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/digilent-xdc/00a3404901f35aa9567b01ecb3f2c233b6efe9f4/Nexys-A7-50T-Master.xdc
    sha256: 7c395ac9bb104fdbd805d805d8e3cf7f2b7674cd4aa02dcc511a64ad831677f4
    bytes: 19613
    retrieved: '2026-09-24'
    cache: ~/.cache/unifpga/board_sources/nexys_a7/xdc_50t.xdc
