  defaults:
    iostandard: LVCMOS33

  banks:
    clk100mhz: { pins: E3, frequency_mhz: 100, source: {doc: xdc, where: '"Clock signal", line 8'} }
    onboard_switches:
      source: {doc: xdc, where: '"Switches", lines 13-28'}
      pins: [J15, L16, M13, R15, R17, T18, U18, R13, T8, U8, R16, T13, H6, U12, U11, V10]
      overrides:
        T8: LVCMOS18
        U8: LVCMOS18
    onboard_leds:
      source: {doc: xdc, where: '"LEDs", lines 31-46'}
      pins: [H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11]
    onboard_rgb_led_16:
      source: {doc: xdc, where: '"RGB LEDs", lines 49-51'}
      pins:
        b: R12
        g: M16
        r: N15
    onboard_rgb_led_17:
      source: {doc: xdc, where: '"RGB LEDs", lines 52-54'}
      pins:
        b: G14
        g: R11
        r: N16
    onboard_7seg:
      source: {doc: xdc, where: '"7 segment display", lines 57-72; segments/dp/anodes all active-low per Digilent convention (inference, not in the XDC)'}
      pins:
        ca: T10
        cb: R10
        cc: K16
        cd: K13
        ce: P15
        cf: T11
        cg: L18
        dp: H15
        anodes: [J17, J18, T9, J14, P14, T14, K2, U13]
    cpu_resetn: { pins: C12, active: low, source: {doc: xdc, where: '"CPU Reset Button", line 75'} }
    onboard_buttons:
      source: {doc: xdc, where: '"Buttons", lines 78-82'}
      pins: [N17, M18, P17, M17, P18]
    pmod_ja:
      source: {doc: xdc, where: '"Pmod Header JA", lines 87-94; pins keyed by Pmod pin number (ports JA[0..7] = JA1-4, JA7-10)'}
      pins: [C17, D18, E18, G17, D17, E17, F18, G18]
    pmod_jb:
      source: {doc: xdc, where: '"Pmod Header JB", lines 97-104; pins keyed by Pmod pin number (ports JB[0..7] = JB1-4, JB7-10)'}
      pins: [D14, F16, G16, H14, E16, F13, G13, H16]
    pmod_jc:
      source: {doc: xdc, where: '"Pmod Header JC", lines 107-114; pins keyed by Pmod pin number (ports JC[0..7] = JC1-4, JC7-10)'}
      pins: [K1, F6, J2, G6, E7, J3, J4, E6]
    pmod_jd:
      source: {doc: xdc, where: '"Pmod Header JD", lines 117-124; pins keyed by Pmod pin number (ports JD[0..7] = JD1-4, JD7-10)'}
      pins: [H4, H1, G1, G3, H2, G4, G2, F3]
    onboard_vga:
      source: {doc: xdc, where: '"VGA Connector", lines 137-150'}
      pins:
        r: [A3, B4, C5, A4]
        g: [C6, A5, B6, A6]
        b: [B7, C7, D7, D8]
        hs: B11
        vs: B12
    onboard_mic:
      source: {doc: xdc, where: '"Omnidirectional Microphone", lines 177-179'}
      pins:
        clk: J5
        data: H5
        lrsel: F5
    onboard_pwm_amp:
      device: {name: "PWM audio amplifier (Digilent)", kind: audio_amp}
      model_params: {open_drain: true}   # AUD_PWM: 1'b0 for 0 V, high-Z for 3.3 V (Digilent)
      source: {doc: xdc, where: '"PWM Audio Amplifier", lines 182-183'}
      pins:
        pwm: A11
        sd: D12
    onboard_uart:
      source: {doc: xdc, where: '"USB-RS232 Interface", lines 186-189; rx = UART_TXD_IN (FPGA input), tx = UART_RXD_OUT (FPGA output); cts/rts as the XDC names them'}
      pins:
        rx: C4
        tx: D4
    onboard_pmod_jxadc:   # Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)
      device: {"name": "Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)", "kind": "xadc"}
      iostandard: "LVCMOS33"
      model_params: {channels: [3, 10, 2, 11]}
      pins: {"xa_p": ["A13", "A15", "B16", "B18"], "xa_n": ["A14", "A16", "B17", "A18"]}
    onboard_sdcard:   # microSD card slot
      source: {doc: xdc, where: '"Micro SD Connector", lines 153-160'}
      device: {"name": "microSD card slot", "kind": "sdcard"}
      iostandard: "LVCMOS33"
      pins: {"reset": "E2", "cd": "A1", "sck": "B1", "cmd": "C1", "dat": ["C2", "E1", "F1", "D2"]}
    onboard_accelerometer:   # 3-axis accelerometer (SPI)
      source: {doc: xdc, where: '"Accelerometer", lines 163-168'}
      device: {"name": "3-axis accelerometer (SPI)", "kind": "accelerometer"}
      iostandard: "LVCMOS33"
      pins: {"miso": "E15", "mosi": "F14", "sclk": "F15", "csn": "D15", "int": ["B13", "C16"]}
    onboard_temp_sensor:   # Temperature sensor (I2C)
      source: {doc: xdc, where: '"Temperature Sensor", lines 171-174'}
      device: {"name": "Temperature sensor (I2C)", "kind": "temperature"}
      iostandard: "LVCMOS33"
      model_params: {shift: 3}   # an ADT7420 (Digilent reference manual): 13-bit reading, 1/16 C at bit 3
      pins: {"scl": "C14", "sda": "C15", "int": "D13", "ct": "B14"}
    onboard_usb_hid:   # USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
      source: {doc: xdc, where: '"USB HID (PS/2)", lines 192-193'}
      device: {"name": "USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)", "kind": "usb_hid"}
      iostandard: "LVCMOS33"
      pins: {"clk": "F4", "data": "B2"}
    onboard_ethernet:   # 10/100 Ethernet PHY (SMSC, RMII)
      source: {doc: xdc, where: '"SMSC Ethernet PHY", lines 196-207; the XDC section is titled "SMSC Ethernet PHY"; exact part number not in the sources read; RMII inferred from the signal set (crsdv, rxd[1:0], txd[1:0], refclk)'}
      device: {"name": "10/100 Ethernet PHY (SMSC, RMII)", "kind": "ethernet"}
      iostandard: "LVCMOS33"
      pins: {"mdc": "C9", "mdio": "A9", "rstn": "B3", "crsdv": "D9", "rxerr": "C10", "rxd": ["C11", "D10"], "txen": "B9", "txd": ["A10", "A8"], "refclk": "D5", "intn": "B8"}
    onboard_qspi_flash:   # Quad-SPI flash
      source: {doc: xdc, where: '"Quad SPI Flash", lines 210-214; QSPI clock is CCLK_0 (E9), reachable only through STARTUPE2'}
      device: {"name": "Quad-SPI flash", "kind": "flash"}
      iostandard: "LVCMOS33"
      pins: {"dq": ["K17", "K18", "L14", "M14"], "csn": "L13"}
    onboard_ddr2:   # DDR2 SDRAM 128 MB (MT47H64M16HR-25E)
      source: {doc: mig, where: '<PinSelection>, lines 71-116'}
      device: {"name": "DDR2 SDRAM 128 MB (MT47H64M16HR-25E)", "kind": "ddr", "id": "micron_mt47h64m16"}
      iostandard: ["DIFF_SSTL18_II", "SSTL18_II"]
      pins: {"addr": ["M4", "P4", "M6", "T1", "L3", "P5", "M2", "N1", "L4", "N5", "R2", "K5", "N6"], "ba": ["P2", "P3", "R1"], "cas_n": "L1", "ck_n": "L5", "ck_p": "L6", "cke": "M1", "cs_n": "K6", "dm": ["T6", "U1"], "dq": ["R7", "V6", "R8", "U7", "V7", "R6", "U6", "R5", "T5", "U3", "V5", "U4", "V4", "T4", "V1", "T3"], "dqs_n": ["V9", "V2"], "dqs_p": ["U9", "U2"], "odt": "M3", "ras_n": "N4", "we_n": "N2"}
  # ---- drawn: headers and parts; ./unifpga layout draft nexys_a7 regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: pmod_ja
      type: pin_row
      label: PMOD_JA
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_ja
      pins: {'[0]': 'pmod_ja[0]', '[1]': 'pmod_ja[1]', '[2]': 'pmod_ja[2]', '[3]': 'pmod_ja[3]', '[4]': 'pmod_ja[4]', '[5]': 'pmod_ja[5]', '[6]': 'pmod_ja[6]', '[7]': 'pmod_ja[7]'}
    - id: pmod_jb
      type: pin_row
      label: PMOD_JB
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jb
      pins: {'[0]': 'pmod_jb[0]', '[1]': 'pmod_jb[1]', '[2]': 'pmod_jb[2]', '[3]': 'pmod_jb[3]', '[4]': 'pmod_jb[4]', '[5]': 'pmod_jb[5]', '[6]': 'pmod_jb[6]', '[7]': 'pmod_jb[7]'}
    - id: pmod_jc
      type: pin_row
      label: PMOD_JC
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jc
      pins: {'[0]': 'pmod_jc[0]', '[1]': 'pmod_jc[1]', '[2]': 'pmod_jc[2]', '[3]': 'pmod_jc[3]', '[4]': 'pmod_jc[4]', '[5]': 'pmod_jc[5]', '[6]': 'pmod_jc[6]', '[7]': 'pmod_jc[7]'}
    - id: pmod_jd
      type: pin_row
      label: PMOD_JD
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: pmod_jd
      pins: {'[0]': 'pmod_jd[0]', '[1]': 'pmod_jd[1]', '[2]': 'pmod_jd[2]', '[3]': 'pmod_jd[3]', '[4]': 'pmod_jd[4]', '[5]': 'pmod_jd[5]', '[6]': 'pmod_jd[6]', '[7]': 'pmod_jd[7]'}
  parts:
    - id: clk100mhz
      label: clk100mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 100}, bind: {clk: clk100mhz}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 16}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 16}, bind: {led: onboard_leds}}
    - id: rgb_led_16
      label: rgb led 16
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_16.r, g: onboard_rgb_led_16.g, b: onboard_rgb_led_16.b}}
    - id: rgb_led_17
      label: rgb led 17
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_17.r, g: onboard_rgb_led_17.g, b: onboard_rgb_led_17.b}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 8, active: low, digits_active: low}, bind: {segments: [onboard_7seg.ca, onboard_7seg.cb, onboard_7seg.cc, onboard_7seg.cd, onboard_7seg.ce, onboard_7seg.cf, onboard_7seg.cg], dp: onboard_7seg.dp, digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]', 'onboard_7seg.anodes[6]', 'onboard_7seg.anodes[7]']}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 5}, bind: {btn: onboard_buttons}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: pwm_amp
      label: PWM audio amplifier (Digilent)
      attach: {peripheral: pwm_amp, params: {open_drain: true}, bind: {pwm: onboard_pwm_amp.pwm, sd: onboard_pwm_amp.sd}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: usb_hid
      label: USB HID host port (keyboard/mouse bridged to a PS/2-style clock/data pair)
      attach: {peripheral: ps2_keyboard, bind: {clk: onboard_usb_hid.clk, data: onboard_usb_hid.data}}
    - id: temp_sensor
      label: Temperature sensor (I2C)
      attach: {peripheral: i2c_temperature_sensor, params: {shift: 3}, bind: {scl: onboard_temp_sensor.scl, sda: onboard_temp_sensor.sda}}
    - id: accelerometer
      label: 3-axis accelerometer (SPI)
      attach: {peripheral: spi_accelerometer, bind: {miso: onboard_accelerometer.miso, mosi: onboard_accelerometer.mosi, sclk: onboard_accelerometer.sclk, csn: onboard_accelerometer.csn}}
    - id: pmod_jxadc
      label: 'Pmod header JXADC: XADC analog pairs XA1-XA4 (VAUX 3, 10, 2, 11; usable as digital IO)'
      attach: {peripheral: xadc_aux, params: {width: 4, channels: [3, 10, 2, 11]}, bind: {p: onboard_pmod_jxadc.xa_p, n: onboard_pmod_jxadc.xa_n}}
    - id: sdcard
      label: microSD card slot
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_sdcard.sck, cmd: onboard_sdcard.cmd, dat0: 'onboard_sdcard.dat[0]', dat3: 'onboard_sdcard.dat[3]', reset: onboard_sdcard.reset}}
    - id: ethernet
      label: 10/100 Ethernet PHY (SMSC, RMII)
      device: {kind: ethernet, bank: onboard_ethernet}   # no peripheral model yet
    - id: qspi_flash
      label: Quad-SPI flash
      device: {kind: flash, bank: onboard_qspi_flash}   # no peripheral model yet
    - id: ddr2
      label: DDR2 SDRAM 128 MB (MT47H64M16HR-25E)
      device: {kind: ddr, bank: onboard_ddr2}   # no peripheral model yet
