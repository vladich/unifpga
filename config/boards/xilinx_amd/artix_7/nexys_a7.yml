    title: Digilent Vivado board files nexys-a7-100t D.0/1.3 mig.prj (DDR2 pin selection)
    kind: constraints
    url: https://raw.githubusercontent.com/Digilent/vivado-boards/36f34ab687b7fa9c778b779d027f3bce63b3ace9/new/board_files/nexys-a7-100t/D.0/1.3/mig.prj
    sha256: b3bd26e09a9dfcb47de33fe70343c42b5ef7600849ac759c41ca3c1578707770
    bytes: 8693
