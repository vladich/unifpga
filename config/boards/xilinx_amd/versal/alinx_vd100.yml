# alinx_vd100 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/VD100/ (aggregated XDC files; 187 unique signals)


Board:
  id: alinx_vd100
  name: Alinx VD100
  url: https://coderobin.com/products/alinx-vd100-xilinx-versal-ai-edge-ve2302-fpga-development-board
  status: active
  notes: Versal AI Edge VE2302; PCIe x4 card with V100 SoM. Chip on board is XCVE2302-SFVA784-1LP-E-S (low-power -1
    variant) — maps to registry entry XCVE2302-1LSESFVA784.
  producer: alinx
  chip: XCVE2302-1LSESFVA784
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - can_transceiver
  - ddr4_memory
  - emmc_flash
  - ethernet_10gbe_sfp
  - microsd_socket
  - mipi_csi2_input
  - pcie_endpoint
  - qspi_flash
  - sd_card_socket
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk_p:
      pins: AB23
    sys_clk_n:
      pins: AC23
    cpu_resetn:
      pins: F21
    onboard_leds:
      pins: [E20]
    ethernet_mdio:
      pins:
        mdc: C13
    ethernet_rgmii:
      pins:
        rxc: D10
        rx_ctl: C10
        rd[0]: C12
        rd[1]: D11
        rd[2]: A14
        rd[3]: B13
        txc: A13
        tx_ctl: B12
        td[0]: A11
        td[1]: B11
        td[2]: A10
        td[3]: B10
