# alinx_axu15eg pin map.
# Source type: github_xdc
#   https://github.com/alinxalinx/AXU9EG_AXU15EG/blob/master/vivado/auto_create_project/src/constraints/gpio.xdc
#   https://github.com/alinxalinx/AXU9EG_AXU15EG/blob/master/vivado/auto_create_project/src/constraints/system.xdc
#   https://github.com/alinxalinx/AXU9EG_AXU15EG/blob/master/vivado/auto_create_project/src/constraints/uart.xdc


Board:
  id: alinx_axu15eg
  name: Alinx AXU15EG
  url: https://www.en.alinx.com/detail/261
  status: active
  producer: alinx
  chip: XCZU15EG-2FFVB1156I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - emmc_flash
  - ethernet_phy_gigabit
  - fmc_hpc
  - hdmi_output
  - microsd_socket
  - pcie_endpoint
  - qspi_flash
  - sata_host
  - usb_3_host
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - realtek_rtl8211fd
  - silabs_cp2102
  - microsd_socket_generic
  - tmds_direct
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk_diff:
      pins:
        p: AL8
        n: AL7
      frequency_mhz: 200
    onboard_leds:
      pins:
      - AM13
      - AP12
    onboard_buttons:
      pins:
      - AN12
    onboard_uart:
      pins:
        tx: D10
        rx: D11
    fan_pwm:
      pins: J10
