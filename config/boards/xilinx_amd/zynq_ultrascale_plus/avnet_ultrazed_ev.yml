# avnet_ultrazed_ev: UltraZed-EV PCIe Carrier.

Board:
  id: avnet_ultrazed_ev
  name: UltraZed-EV PCIe Carrier
  url: https://www.avnet.com/wps/portal/us/products/avnet-boards/avnet-board-families/ultrazed-ev/
  producer: avnet
  chip: XCZU7EV-1FBVB900I
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - emmc_flash
  - ethernet_phy_gigabit
  - hdmi_input
  - hdmi_output
  - microsd_socket
  - usb_uart_bridge
  devices:
  - micron_mt40a256m16
  - marvell_88e1512
  - adi_adv7611
  - adi_adv7511
  - ti_tmds141
  - ftdi_ft4232h
  - emmc_chip_generic
  - microsd_socket_generic
