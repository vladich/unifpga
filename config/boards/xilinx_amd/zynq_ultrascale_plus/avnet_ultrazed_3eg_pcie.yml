# avnet_ultrazed_3eg_pcie: UltraZed-EG PCIe Carrier.

Board:
  id: avnet_ultrazed_3eg_pcie
  name: UltraZed-EG PCIe Carrier
  url: https://www.avnet.com/wps/portal/us/products/avnet-boards/avnet-board-families/ultrazed-eg/
  producer: avnet
  chip: XCZU3EG-1SFVA625I
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - emmc_flash
  - ethernet_phy_gigabit
  - microsd_socket
  - usb_2_otg
  - usb_uart_bridge
  devices:
  - micron_mt40a256m16
  - marvell_88e1512
  - microchip_usb3343
  - ftdi_ft4232h
  - emmc_chip_generic
  - microsd_socket_generic
