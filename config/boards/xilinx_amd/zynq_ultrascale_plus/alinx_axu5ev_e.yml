# alinx_axu5ev_e: Alinx AXU5EV-E.

Board:
  id: alinx_axu5ev_e
  name: Alinx AXU5EV-E
  url: https://coderobin.com/products/alinx-axu5ev-e-xilinx-zynq-ultrascale-mpsoc-xczu5ev-fpga-development-board
  status: active
  notes: -E sibling of AXU5EV-P; based on same chip as AXU5EV in catalog.
  producer: alinx
  chip: XCZU5EV-2SFVC784I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - displayport_output
  - emmc_flash
  - ethernet_phy_gigabit
  - hdmi_input
  - hdmi_output
  - microsd_socket
  - qspi_flash
  - sd_card_socket
  - usb_3_host
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - tmds_direct
  - led_discrete_generic
  - pushbutton_smd_generic
