  name: iW-RainboW-G36D Zynq UltraScale+ MPSoC (ZU5/4/3T/3/2/1) Dev Kit
  url: https://www.iwavesystems.com/product/zynq-ultrascale-mpsoc-zu5-zu4-zu3t-zu3-zu2-zu1/
  status: active
  producer: iwave
  chip: XCZU3EG-1SFVC784I
  bridges:
