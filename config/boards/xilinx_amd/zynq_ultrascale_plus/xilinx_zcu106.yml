# xilinx_zcu106 pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/xilinx_zcu106.py


Board:
  id: xilinx_zcu106
  name: ZCU106
  url: https://www.xilinx.com/products/boards-and-kits/zcu106.html
  producer: xilinx_amd
  chip: XCZU7EV-2FFVC1156E
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - dip_switches
  - emmc_flash
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - pcie_endpoint
  - qspi_flash
  - usb_2_host
  - usb_2_otg
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt40a256m16
  - ddr4_sodimm_socket
  - adi_adv7511
  - microchip_usb3343
  - microchip_usb2514b
  - silabs_cp2108
  - ftdi_ft4232h
  - microsd_socket_generic
  - emmc_chip_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - marvell_88e1512
  - spansion_s25fl256s
  banks:
    onboard_leds:
      pins: [AL11, AL13, AK13, AE15, AM8, AM9, AM10, AM11]
    onboard_uart:
      pins:
        cts: AP17
        rts: AM15
        tx: AL17
        rx: AH17
    pcie_clk_n:
      pins:
        pin: AB7
    pcie_clk_p:
      pins:
        pin: AB8
    pcie_rst_n:
      pins:
        pin: L8
    pcie_rx_n:
      pins: [AE1, AF3, AG1, AJ1]
    pcie_rx_p:
      pins: [AE2, AF4, AG2, AJ2]
    pcie_tx_n:
      pins: [AD3, AE5, AG5, AH3]
    pcie_tx_p:
      pins: [AD4, AE6, AG6, AH4]
