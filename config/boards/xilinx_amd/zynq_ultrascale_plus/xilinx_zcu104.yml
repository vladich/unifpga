# xilinx_zcu104 pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/xilinx_zcu104.py


Board:
  id: xilinx_zcu104
  name: ZCU104
  url: https://www.xilinx.com/products/boards-and-kits/zcu104.html
  producer: xilinx_amd
  chip: XCZU7EV-2FFVC1156E
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - dip_switches
  - emmc_flash
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - qspi_flash
  - usb_2_host
  - usb_2_otg
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt40a256m16
  - adi_adv7511
  - microchip_usb3343
  - microchip_usb2514b
  - silabs_cp2108
  - ftdi_ft4232h
  - microsd_socket_generic
  - emmc_chip_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - marvell_88e1512
  - spansion_s25fl256s
  banks:
    cpu_resetn:
      pins: M11
    onboard_buttons:
      pins: [B4, C4, B3, C3]
    onboard_leds:
      pins: [D5, D6, A5, B5]
    onboard_uart:
      pins:
        cts: A19
        rts: C18
        tx: C19
        rx: A20
    i2c_scl:
      pins:
        pin: N12
    i2c_sda:
      pins:
        pin: P12
