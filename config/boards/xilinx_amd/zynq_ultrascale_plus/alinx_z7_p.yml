# alinx_z7_p pin map.
# Source type: github_xdc
#   https://github.com/alinxalinx/Z7_P/blob/master/vivado/auto_create_project/src/constraints/gpio.xdc
#   https://github.com/alinxalinx/Z7_P/blob/master/vivado/auto_create_project/src/constraints/uart.xdc


Board:
  id: alinx_z7_p
  name: Alinx Z7-P
  url: https://coderobin.com/products/alinx-z7-p-xilinx-zynq-ultrascale-mpsoc-xczu7ev-fpga-development-board
  status: active
  notes: Premium top-tier ZU7EV with full HPC FMC and dual gigE.
  producer: alinx
  chip: XCZU7EV-2FFVC1156I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - displayport_output
  - emmc_flash
  - ethernet_phy_gigabit
  - fmc_hpc
  - microsd_socket
  - pcie_endpoint
  - qspi_flash
  - sd_card_socket
  - usb_3_host
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    onboard_leds:
      pins:
      - M9
      - K8
      - L8
    onboard_buttons:
      pins:
      - J9
    onboard_uart:
      pins:
        tx: N9
        rx: N8
