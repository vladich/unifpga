# alinx_axu2cga pin map.
# Source type: github_xdc
#   https://github.com/alinxalinx/AXU2CGA_AXU2CGB/blob/master/vivado/auto_create_project/src/constraints/gpio.xdc
#   https://github.com/alinxalinx/AXU2CGA_AXU2CGB/blob/master/vivado/auto_create_project/src/constraints/system.xdc


Board:
  id: alinx_axu2cga
  name: AXU2CGA
  url: https://alinx.com/en/detail/11
  producer: alinx
  chip: XCZU2CG-1SFVC784E
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - hdmi_output
  - microsd_socket
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - tmds_direct
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk:
      pins: AB11
      frequency_mhz: 25
    onboard_leds:
      pins:
      - W13
      - Y12
      - AA12
      - AB13
    onboard_buttons:
      pins:
      - AA13
      - AE14
      - AE15
      - AG14
    fan_pwm:
      pins: W12
