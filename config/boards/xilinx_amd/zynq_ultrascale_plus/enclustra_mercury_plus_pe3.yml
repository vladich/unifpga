# enclustra_mercury_plus_pe3: Enclustra Mercury+ PE3 PCIe Base Board.

Board:
  id: enclustra_mercury_plus_pe3
  name: Enclustra Mercury+ PE3 PCIe Base Board
  url: https://www.enclustra.com/en/products/base-boards/mercury-pe3/
  status: active
  producer: enclustra
  chip: XCZU15EG-1FFVC900I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ethernet_phy_gigabit
  - fmc_hpc
  - microsd_socket
  - pcie_edge_connector
  - qsfp_cage
  - qspi_flash
  - sata_host
  - sfp_cage
  - usb_3_host
  - usb_uart_bridge
  devices:
  - marvell_88e1512
  - silabs_si5342
  - ftdi_ft4232h
  - microsd_socket_generic
