# xilinx_zcu102 pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/xilinx_zcu102.py


Board:
  id: xilinx_zcu102
  name: ZCU102
  url: https://www.xilinx.com/products/boards-and-kits/ek-u1-zcu102-g.html
  producer: xilinx_amd
  chip: XCZU9EG-2FFVB1156E
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - dip_switches
  - emmc_flash
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - qspi_flash
  - usb_2_host
  - usb_2_otg
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt40a256m16
  - ddr4_sodimm_socket
  - adi_adv7511
  - microchip_usb3343
  - microchip_usb2514b
  - silabs_cp2108
  - ftdi_ft4232h
  - microsd_socket_generic
  - emmc_chip_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - marvell_88e1512
  - silabs_si570
  - spansion_s25fl256s
  banks:
    cpu_resetn:
      pins: AM13
    onboard_buttons:
      pins: [AG15, AE14, AF15, AG13]
    onboard_leds:
      pins: [AG14, AF13, AE13, AJ14, AJ15, AH13, AH14, AL12]
    onboard_uart:
      pins:
        cts: E12
        rts: D12
        rx: E13
        tx: F13
    i2c_scl:
      pins:
        pin: J10
    i2c_sda:
      pins:
        pin: J11
    sfp_rxn:
      pins:
        pin: A3
    sfp_rxp:
      pins:
        pin: A4
    sfp_txn:
      pins:
        pin: A7
    sfp_txp:
      pins:
        pin: A8
