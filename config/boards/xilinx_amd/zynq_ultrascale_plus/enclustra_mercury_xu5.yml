# enclustra_mercury_xu5 pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/enclustra_mercury_xu5.py


Board:
  id: enclustra_mercury_xu5
  name: Enclustra Mercury XU5 SoM (legacy, pre-Mercury+)
  url: https://www.enclustra.com/en/products/system-on-chip-modules/mercury-xu5/
  status: eol
  producer: enclustra
  chip: XCZU5EV-2SFVC784I
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - qspi_flash
  - emmc_flash
  - ethernet_phy_gigabit
  devices:
  - micron_mt40a256m16
  - macronix_mx25l25645g
  - marvell_88e1512
  - emmc_chip_generic
  banks:
    cpu_resetn:
      pins: N19
    onboard_leds:
      pins: [H2, P9, K5]
    onboard_uart:
      pins:
        rx: AA10
        tx: AA11
    i2c_scl:
      pins:
        pin: D12
    i2c_sda:
      pins:
        pin: C12
    sys_clk_n:
      pins:
        pin: AD4
    sys_clk_p:
      pins:
        pin: AD5
