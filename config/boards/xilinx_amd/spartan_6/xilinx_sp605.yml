        pin: N15
    ethernet_gtx:
      pins:
        pin: AB7
    ethernet_int_n:
      pins:
        pin: J20
    ethernet_mdc:
      pins:
        pin: R19
    ethernet_rst_n:
      pins:
        pin: J22
    ethernet_rx_data:
      pins: [P19, Y22, Y21, W22, W20, V22, V21, U22]
    ethernet_rx_dv:
      pins:
        pin: T22
    ethernet_rx_er:
      pins:
        pin: U20
    ethernet_tx_data:
      pins: [U10, T10, AB8, AA8, AB9, Y9, Y12, W12]
    ethernet_tx_en:
