# numato_galatea: Numato Galatea Spartan-6 FPGA Module.

Board:
  id: numato_galatea
  name: Numato Galatea Spartan-6 FPGA Module
  status: eol
  producer: numato_lab
  chip: XC6SLX9-2TQG144C
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - qspi_flash
  - usb_jtag_bridge
  - usb_powered
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - ftdi_ft2232h
  - micron_n25q032a
  - led_discrete_generic
  - pushbutton_smd_generic
