# mojo_v3 pin map.
# Hand-curated from the Mojo v3 schematic (Embedded Micro, later sold as
# Alchitry-rebadged). The Mojo has a Spartan-6 XC6SLX9 (TQ144 package),
# 50 MHz clock, 8 LEDs, and one dedicated RST line to the AVR. There are
# no user push-buttons on the board itself — the design has to handle
# `btn` via a shield, so we only expose what the bare board has.
#
# Pin map source: Embedded Micro Mojo v3 schematic + user manual.


Board:
  id: mojo_v3
  name: Mojo v3
  product: Mojo V3
  summary: Xilinx Spartan-6 XC6SLX9-2TQG144C (9,152 logic cells); 50 MHz oscillator; ATmega32U4 USB microcontroller
    that configures the FPGA from an SST25VF040B flash and bridges USB serial + 8 ADC channels to the FPGA over SPI/UART;
    8 LEDs, reset button; 76 FPGA I/O on two 2x25 headers.
  url: https://alchitry.com/boards/au/
  producer: embedded_micro
  chip: XC6SLX9-2TQG144C
  bridges:
  - avr-mojo
  programmer: mojoload
  extra_programmers:
  - mojoload[*]
  documents:
  - id: mojo_sch
    title: Mojo V3 schematic (3 sheets, Embedded Micro) — Wayback snapshot 2015-04-13 of embeddedmicro.com/media/wysiwyg/mojo/v3-sch.pdf
    kind: schematic
    url: http://web.archive.org/web/20150413133431id_/https://embeddedmicro.com/media/wysiwyg/mojo/v3-sch.pdf
    sha256: 645c3ca50a5df5b57b7e1f646049d3d678bd07821f0afd72c3890f6f4fca8fb3
    bytes: 61450
    retrieved: '2026-09-24'
  - id: mojo_ucf
    title: mojo-base-project src/mojo.ucf (Embedded Micro)
    kind: constraints
    url: https://raw.githubusercontent.com/embmicro/mojo-base-project/469b6ee60b143c5f4fca25f63be0f18cee15e5c1/src/mojo.ucf
    sha256: dbe1147337db8f8f1f8ec06621825f12566bde7a411859a8c189dfa41af015c9
    bytes: 1220
    retrieved: '2026-09-24'
  - id: mojo_top
    title: mojo-base-project src/mojo_top.v (port directions and comments)
    kind: constraints
    url: https://raw.githubusercontent.com/embmicro/mojo-base-project/469b6ee60b143c5f4fca25f63be0f18cee15e5c1/src/mojo_top.v
    sha256: 2762eeae124b051b485249856043c7d112fc2a43e21958878e8eda06cfa48405
    bytes: 764
    retrieved: '2026-09-24'
  - id: litex_mojo
    title: LiteX-Boards alchitry_mojo.py (litex-boards a05e31e6)
    kind: platform
    url: https://github.com/litex-hub/litex-boards/blob/a05e31e6ff99fd9a1c5c96ee91e35d77e65f2397/litex_boards/platforms/alchitry_mojo.py
    sha256: dd1e9ea960e9cc513ce5d6c89a507e0a7e9e1e467f526a23aaaa4a1c05abb714
    bytes: 4424
    retrieved: '2026-09-24'
  defaults:
    iostandard: LVCMOS33

  banks:
    clk50mhz:
      pins: P56
      source:
        doc: mojo_ucf
        where: NET clk LOC=P56, TIMESPEC 50 MHz; mojo_sch sheet 3 oscillator -> CLK, sheet 2 P56 = IO_L30P_GCLK1_D13_2
    # The reset button S1 (10K pull-up), active low.
    onboard_reset:
      pins: P38
      active: low
      source:
        doc: mojo_top
        where: port rst_n comment; mojo_ucf NET rst_n LOC=P38; mojo_sch sheet 3 Reset Button
    # Eight user LEDs (LED0 ... LED7). LED0 is closest to the AVR side.
    onboard_leds:
      source:
        doc: mojo_ucf
        where: NET led<0..7>; mojo_sch sheet 3 LED2..LED9 nets L34P_0..L37N_0 = P134,P133,P132,P131,P127,P126,P124,P123
      pins: [P134, P133, P132, P131, P127, P126, P124, P123]   # LED6 P124, LED7 P123 (P125 is VCCO_0; Mojo V3 ucf / schematic)
    # AVR <-> FPGA UART, FPGA-side names (valid once cclk is high): the FPGA
    # receives on P55 and transmits on P59 (Mojo V3 ucf, schematic)
    onboard_uart:
      source:
        doc: mojo_top
        where: ports avr_tx/avr_rx/avr_rx_busy comments; mojo_ucf LOCs
      pins:
        rx: P55
        tx: P59
    onboard_avr_spi:   # AVR SPI link (ADC samples) and cclk
      source:
        doc: mojo_ucf
        where: spi_* / spi_channel / cclk LOCs; mojo_top.v directions
      device:
        name: AVR SPI link (ADC samples) and cclk
        kind: other
      iostandard: "LVTTL"
      pins:
        spi_sck: P43
        spi_mosi: P44
        spi_miso: P45
        spi_ss: P48
        spi_channel: [P46, P61, P62, P65]
        cclk: P70
    header_io:   # SV1 / SV2 2x25 I/O headers (76 FPGA I/O total)
