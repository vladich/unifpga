# mojo_v3 pin map.
# Hand-curated from the Mojo v3 schematic (Embedded Micro, later sold as
# Alchitry-rebadged). The Mojo has a Spartan-6 XC6SLX9 (TQ144 package),
# 50 MHz clock, 8 LEDs, and one dedicated RST line to the AVR. There are
# no user push-buttons on the board itself — the design has to handle
# `btn` via a shield, so we only expose what the bare board has.
#
# Pin map source: Embedded Micro Mojo v3 schematic + user manual.

Board:
  id: mojo_v3
  fpga:
    producer: Xilinx (AMD)
    family: Spartan 6
    part: XC6SLX9-2TQG144C

  defaults:
    iostandard: LVCMOS33

  pinBanks:
    clk50mhz: { pins: P56 }
    # The reset button S1 (10K pull-up), active low.
    onboard_reset: { pins: P38, active: low }
    # Eight user LEDs (LED0 ... LED7). LED0 is closest to the AVR side.
    onboard_leds:
      pins: [P134, P133, P132, P131, P127, P126, P124, P123]   # LED6 P124, LED7 P123 (P125 is VCCO_0; Mojo V3 ucf / schematic)
    # AVR <-> FPGA UART, FPGA-side names (valid once cclk is high): the FPGA
    # receives on P55 and transmits on P59 (Mojo V3 ucf, schematic)
    onboard_uart:
      pins:
        rx: P55
        tx: P59
    onboard_avr_spi:   # AVR SPI link (ADC samples) and cclk
      device: {"name": "AVR SPI link (ADC samples) and cclk", "kind": "other"}
      iostandard: "LVTTL"
      pins: {"spi_sck": "P43", "spi_mosi": "P44", "spi_miso": "P45", "spi_ss": "P48", "spi_channel": ["P46", "P61", "P62", "P65"], "cclk": "P70"}
    header_io:   # SV1 / SV2 2x25 I/O headers (76 FPGA I/O total)
      device: {"name": "SV1 / SV2 2x25 I/O headers (76 FPGA I/O total)", "kind": "header"}
      iostandard: "LVTTL / LVCMOS33 (bank VCCO 3.3 V)"
      pins: {"L83N_3": "P1", "L83P_3": "P2", "L52N_3": "P5", "L52P_3": "P6", "L51N_3": "P7", "L51P_3": "P8", "L50N_3": "P9", "L50P_3": "P10", "L49N_3": "P11", "L49P_3": "P12", "L44N_3": "P14", "L44P_3": "P15", "L43N_3": "P16", "L43P_3": "P17", "L42N_3": "P21", "L42P_3": "P22", "L41N_3": "P23", "L41P_3": "P24", "L37N_3": "P26", "L37P_3": "P27", "L36N_3": "P29", "L36P_3": "P30", "L2N_3": "P32", "L2P_3": "P33", "L1N_3": "P34", "L1P_3": "P35", "L64N_2": "P40", "L64P_2": "P41", "L31N_2": "P50", "L31P_2": "P51", "L14N_2": "P57", "L14P_2": "P58", "L2N_2": "P66", "L2P_2": "P67", "L74N_1": "P74", "L74P_1": "P75", "L47N_1": "P78", "L47P_1": "P79", "L46N_1": "P80", "L46P_1": "P81", "L45N_1": "P82", "L45P_1": "P83", "L43N_1": "P84", "L43P_1": "P85", "L42N_1": "P87", "L42P_1": "P88", "L41N_1": "P92", "L41P_1": "P93", "L40N_1": "P94", "L40P_1": "P95", "L34N_1": "P97", "L34P_1": "P98", "L33N_1": "P99", "L33P_1": "P100", "L32N_1": "P101", "L32P_1": "P102", "L1N_1": "P104", "L1P_1": "P105", "L66N_0": "P111", "L66P_0": "P112", "L65N_0": "P114", "L65P_0": "P115", "L64N_0": "P116", "L64P_0": "P117", "L63N_0": "P118", "L63P_0": "P119", "L62N_0": "P120", "L62P_0": "P121", "L4N_0": "P137", "L4P_0": "P138", "L3N_0": "P139", "L3P_0": "P140", "L2N_0": "P141", "L2P_0": "P142", "L1N_0": "P143", "L1P_0": "P144"}
