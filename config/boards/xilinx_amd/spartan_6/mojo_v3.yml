        tdi: P110
        tdo: P106
        tms: P107
  # ---- drawn: headers and parts; ./unifpga layout draft mojo_v3 regenerates from here on ----
  layout:
    verified: false
    generated: true
  headers: []
  parts:
    - id: clk50mhz
      label: clk50mhz
      attach:
        peripheral: clock_input
        params:
          frequency_mhz: 50
        bind:
          clk: clk50mhz
    - id: reset
      label: reset
      attach:
        peripheral: reset_button
        bind:
          rst: onboard_reset
    - id: leds
      label: leds
      attach:
        peripheral: led_bank
        params:
          width: 8
        bind:
          led: onboard_leds
    - id: avr_spi
      label: AVR SPI link (ADC samples) and cclk
      device:   # no peripheral model yet
        kind: other
        bank: onboard_avr_spi
    - id: header_io
      label: SV1 / SV2 2x25 I/O headers (76 FPGA I/O total)
      device:   # no peripheral model yet
        kind: header
        bank: header_io
    - id: jtag_header_jp2_2x5
