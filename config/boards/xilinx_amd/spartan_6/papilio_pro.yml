  name: Papilio Pro
  url: https://papilio.cc/index.php?n=Papilio.PapilioPro
  producer: papilio
  chip: XC6SLX9-2TQG144C
  bridges:
  - papilio-ft2232
  programmer: papilio_loader
  extra_programmers:
