    onboard_uart:
      pins:
        tx: P105
        rx: P101
    qspi_flash_clk:
      pins:
        pin: P70
    qspi_flash_cs_n:
      pins:
        pin: P38
    qspi_flash_miso:
      pins:
        pin: P65
    qspi_flash_mosi:
      pins:
        pin: P64
