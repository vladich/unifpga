# alinx_ax7050 pin map.
# Source type: pdf_user_manual
#   https://www.manualslib.com/manual/2238745/Alinx-Ax7050.html?page=15
#   https://www.manualslib.com/manual/2238745/Alinx-Ax7050.html?page=41
#   https://www.manualslib.com/manual/2238745/Alinx-Ax7050.html?page=49
#   https://www.manualslib.com/manual/2238745/Alinx-Ax7050.html?page=50


Board:
  id: alinx_ax7050
  name: AX7050
  url: https://alinx.com/en/detail/6
  status: active
  notes: Alinx revised the AX7050 from Zynq-7000 (legacy) to Spartan-7 XC7S50; this entry reflects the current shipping
    product.
  producer: alinx
  chip: XC7S50FGGA484
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - qspi_flash
  - sdr_sdram
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - realtek_rtl8211e
  - ftdi_ft232h
  - silabs_cp2102
  - microsd_socket_generic
  - tmds_direct
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk_diff:
      pins:
        p: AA6
        n: AB6
      frequency_mhz: 200
    onboard_leds:
      pins:
      - H16
      - G16
      - K15
      - J15
    onboard_buttons:
      pins:
      - M15
      - L15
      - AB19
      - AA21
    onboard_uart:
      pins:
        tx: D11
        rx: B16
