# arty_s7_50 pin map.
#
# Source: Digilent Arty-S7-50-Master.xdc (github.com/Digilent/digilent-xdc, MIT-licensed)
# Imported via tools/verify_pinmap_against_vendor.py.


Board:
  id: arty_s7_50
  name: Arty S7-50
  producer: digilent
  chip: XC7S50CSGA324-1
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr3_memory
  - dip_switches
  - qspi_flash
  - rgb_leds
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  devices:
  - cypress_s25fl128s
  - micron_mt41k128m16
  - ftdi_ft2232h
  - pushbutton_smd_generic
  - dip_switch_generic
  - led_discrete_generic
  - rgb_led_common_anode
  defaults:
    iostandard: LVCMOS33

  banks:
    clk100mhz: { pins: "R2" }
    onboard_buttons:
      pins: ["G15", "K16", "J16", "H13"]
    onboard_leds:
      pins: ["E18", "F13", "E13", "H15"]
    onboard_rgb_led_0:
      pins:
        b: "F15"
        g: "G17"
        r: "J15"
    onboard_rgb_led_1:
      pins:
        b: "E14"
        g: "F18"
        r: "E15"
    onboard_switches:
      pins: ["H14", "H18", "G18", "M5"]
    onboard_uart:
      pins:
        rx: "V12"
        tx: "R12"
    pmod_ja:
      pins: ["L17", "L18", "M14", "N14", "M16", "M17", "M18", "N18"]
    pmod_jb:
      pins: ["P17", "P18", "R18", "T18", "P14", "P15", "N15", "P16"]
    pmod_jc:
      pins: ["U15", "V16", "U17", "U18", "U16", "P13", "R13", "V14"]
    pmod_jd:
      pins: ["V15", "U12", "V13", "T12", "T13", "R11", "T11", "U11"]
