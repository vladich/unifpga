# alinx_ax7015 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/AX7015B/ (aggregated XDC files; 363 unique signals)


Board:
  id: alinx_ax7015
  name: Alinx AX7015
  aliases:
  - alinx_ax7z015
  url: https://coderobin.com/products/alinx-ax7015-xilinx-zynq-7000-xc7z015-fpga-development-board
  status: active
  notes: Variant alongside AX7Z015 (already in catalog) — pairs SoM+carrier.
  producer: alinx
  chip: XC7Z015-2CLG485I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr3_memory
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - qspi_flash
  - sd_card_socket
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - realtek_rtl8211e
  - silabs_cp2102
  - microsd_socket_generic
  - tmds_direct
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk:
      pins: Y14
    onboard_leds:
      pins: [A5, A7, A6, B8]
    hdmi_clk:
      pins: H1
    hdmi_data_p:
      pins: [G3, H3, H4, G7, G8, G1, H5, H6, G4, F4, F5, E5, G6, F6, E7, F7, D3, C3, C4, D5, C5, C6, E8, D8]
    hdmi_i2c:
      pins:
        scl: J8
        sda: K8
    ethernet_mdio:
      pins:
        mdc: C8
    ethernet_rgmii:
      pins:
        rxc: B4
        rx_ctl: B3
        rd[0]: A2
        rd[1]: A1
        rd[2]: B2
        rd[3]: B1
        txc: D1
        tx_ctl: C1
        td[0]: F2
        td[1]: F1
        td[2]: E2
        td[3]: D2
