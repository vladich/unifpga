# alinx_ax7021 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/AX7021B/ (aggregated XDC files; 256 unique signals)


Board:
  id: alinx_ax7021
  name: Alinx AX7021
  url: https://coderobin.com/products/alinx-ax7021-xilinx-zynq-7000-xc7z020-fpga-development-board
  status: active
  notes: 484-pin variant of AX7020 (which uses CLG400 package).
  producer: alinx
  chip: XC7Z020-2CLG484I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr3_memory
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - qspi_flash
  - sd_card_socket
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - realtek_rtl8211e
  - silabs_cp2102
  - microsd_socket_generic
  - tmds_direct
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk:
      pins: Y9
    onboard_leds:
      pins: [R7, A16]
    hdmi_clk:
      pins: G16
    hdmi_data_p:
      pins: [H22, G22, G17, F17, G15, D15, E15, F18, E18, H17, H18, H19, H20, G19, F19, G20, G21, F21, F22, E21, D21, D22, C22, B21]
    hdmi_i2c:
      pins:
        scl: B22
        sda: A22
    ethernet_mdio:
      pins:
        mdc: J17
    ethernet_rgmii:
      pins:
        rxc: K19
        rx_ctl: K20
        rd[0]: J18
        rd[1]: K18
        rd[2]: J15
        rd[3]: K15
        txc: R21
        tx_ctl: R20
        td[0]: N17
        td[1]: N18
        td[2]: N19
        td[3]: N20
