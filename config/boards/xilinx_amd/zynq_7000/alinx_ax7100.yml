Board:
  id: alinx_ax7100
  name: AX7100
  url: https://www.en.alinx.com/Product/SoC-development-Boards/Zynq-7000-SoC/AX7Z100B.html
  producer: alinx
  chip: XC7Z100-2FFG900I
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - microsd_socket
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk:
      pins: F9
      frequency_mhz: 200
    cpu_resetn:
      pins: AF18
    onboard_leds:
      pins:
      - AJ16
      - AK16
      - AE16
      - AE15
    onboard_buttons:
      pins:
      - AF18
      - AF17
      - AH17
      - AH16
    onboard_uart:
      pins:
        tx: AJ14
        rx: AJ13
