# zybo_z7 pin map.


Board:
  id: zybo_z7
  name: Zybo Z7
  product: Zybo Z7 (Zybo Z7-10 / Zybo Z7-20)
  summary: 'Xilinx Zynq-7000 XC7Z010-1CLG400C (Z7-10, 28K logic cells) or XC7Z020-1CLG400C (Z7-20, 85K); 1 GB DDR3L
    on the PS (2 x MT41K256M16, 32-bit), PS Gigabit Ethernet, USB OTG, microSD, QSPI flash, UART; PL: HDMI in + HDMI
    out, audio codec, Pcam MIPI CSI-2 camera connector, 4 switches, 4 buttons, 4 LEDs, RGB LEDs, 5-6 Pmods'
  url: https://digilent.com/reference/programmable-logic/zybo-z7/start
  producer: digilent
  chip: xc7z020clg400-1
