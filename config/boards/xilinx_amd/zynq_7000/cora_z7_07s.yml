  programmer: vivado_hw
  features:
  - ddr3_memory
  - ethernet_phy_gigabit
  - microsd_socket
  - rgb_leds
  - usb_2_otg
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt41k256m16
  - ftdi_ft2232h
  - realtek_rtl8211e
  - microchip_usb3343
  - microsd_socket_generic
  - pushbutton_smd_generic
  - led_discrete_generic
  - rgb_led_common_anode
