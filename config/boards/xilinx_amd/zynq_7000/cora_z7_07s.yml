        g: "G17"
        r: "N15"
    onboard_rgb_led_1:
      pins:
        b: "G14"
        g: "L14"
        r: "M15"
    pmod_ja:
      pins: ["Y18", "Y19", "Y16", "Y17", "U18", "U19", "W18", "W19"]
    pmod_jb:
      pins: ["W14", "Y14", "T11", "T10", "V16", "W16", "V12", "W13"]
