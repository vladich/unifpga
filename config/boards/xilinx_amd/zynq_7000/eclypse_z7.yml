# eclypse_z7 pin map.

Board:
  id: eclypse_z7
  fpga:
    producer: "Xilinx (AMD)"
    family: "Zynq 7000"
    part: xc7z020clg484-1
  defaults:
    iostandard: LVCMOS33

  pinBanks:
    clk: { pins: D18, frequency_mhz: 125 }
    onboard_buttons:
      pins: [C17, C18]
    onboard_rgb_led_0:
      pins:
        b: A17
        g: B16
        r: B17
    onboard_rgb_led_1:
      pins:
        b: A16
        g: A18
        r: A19
    pmod_jb:
      pins: [G15, D16, D17, E18, F18, G17, H18, H17]
    pmod_ja:   # Pmod header JA
      device: {"name": "Pmod header JA", "kind": "pmod"}
      iostandard: "LVCMOS33"
      pins: ["B15", "C15", "D15", "E16", "E15", "F17", "F16", "G16"]
    syzygy_a:   # SYZYGY port A (Zmod port A; 8 differential pairs, 2 clock pairs, 12 single-ended)
      device: {"name": "SYZYGY port A (Zmod port A; 8 differential pairs, 2 clock pairs, 12 single-ended)", "kind": "header"}
      pins: {"c2p_clk_n": "N20", "c2p_clk_p": "N19", "d_n": ["T17", "T19", "T18", "P18", "R16", "P15", "K18", "K21"], "d_p": ["T16", "R19", "R18", "P17", "P16", "N15", "J18", "J20"], "p2c_clk_n": "M20", "p2c_clk_p": "M19", "s": ["L19", "K20", "L18", "K19", "L22", "J22", "L21", "J21", "N22", "P22", "M21", "M22"]}
    syzygy_b:   # SYZYGY port B (Zmod port B; 8 differential pairs, 2 clock pairs, 12 single-ended)
      device: {"name": "SYZYGY port B (Zmod port B; 8 differential pairs, 2 clock pairs, 12 single-ended)", "kind": "header"}
      pins: {"c2p_clk_n": "Y16", "c2p_clk_p": "W16", "d_n": ["Y15", "W13", "AA13", "AB15", "AA14", "V15", "AB22", "Y21"], "d_p": ["W15", "V13", "Y13", "AB14", "Y14", "V14", "AA22", "Y20"], "p2c_clk_n": "W18", "p2c_clk_p": "W17", "s": ["AA18", "AA19", "Y18", "Y19", "AB20", "AB21", "AB19", "AA21", "U16", "U15", "V17", "U17"]}
    onboard_crypto:   # Crypto authentication chip SDA
      device: {"name": "Crypto authentication chip SDA", "kind": "other"}
      iostandard: "LVCMOS33"
      pins: {"sda": "D22"}
    onboard_mcu_rsvd:   # Reserved lines to the platform MCU (mcu_rsvd)
      device: {"name": "Reserved lines to the platform MCU (mcu_rsvd)", "kind": "other"}
      iostandard: "LVCMOS33"
      pins: {"rsvd": ["B22", "B21"]}
    onboard_ps_ethernet:   # PS Gigabit Ethernet (GEM0, RGMII PHY)
      device: {"name": "PS Gigabit Ethernet (GEM0, RGMII PHY)", "kind": "ethernet"}
      pins: {"rgmii": ["MIO16", "MIO17", "MIO18", "MIO19", "MIO20", "MIO21", "MIO22", "MIO23", "MIO24", "MIO25", "MIO26", "MIO27"], "mdio": ["MIO52", "MIO53"], "reset": "MIO9"}
    onboard_ps_usb:   # PS USB 2.0 OTG (USB0, ULPI PHY)
      device: {"name": "PS USB 2.0 OTG (USB0, ULPI PHY)", "kind": "other"}
      pins: {"ulpi": ["MIO28", "MIO29", "MIO30", "MIO31", "MIO32", "MIO33", "MIO34", "MIO35", "MIO36", "MIO37", "MIO38", "MIO39"], "reset": "MIO46"}
    onboard_ps_sdcard:   # PS microSD slot (SD0)
      device: {"name": "PS microSD slot (SD0)", "kind": "sdcard"}
      pins: {"sd": ["MIO40", "MIO41", "MIO42", "MIO43", "MIO44", "MIO45"], "cd": "MIO47"}
    onboard_ps_qspi_flash:   # PS Quad-SPI flash (boot)
      device: {"name": "PS Quad-SPI flash (boot)", "kind": "flash"}
      pins: {"qspi": ["MIO1", "MIO2", "MIO3", "MIO4", "MIO5", "MIO6"], "fbclk": "MIO8"}
    onboard_ps_uart:   # PS UART0 (the board USB-UART; the bridge is not named in the preset)
      device: {"name": "PS UART0 (the board USB-UART; the bridge is not named in the preset)", "kind": "uart"}
      pins: {"rxtx": ["MIO14", "MIO15"]}
    onboard_ps_i2c1:   # PS I2C1
      device: {"name": "PS I2C1", "kind": "other"}
      pins: {"scl_sda": ["MIO12", "MIO13"]}
