# numato_styx: Numato Styx Zynq-7020 Module.

Board:
  id: numato_styx
  name: Numato Styx Zynq-7020 Module
  status: eol
  producer: numato_lab
  chip: XC7Z020-1CLG484C
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr3_memory
  - ethernet_phy_gigabit
  - microsd_socket
  - qspi_flash
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - micron_n25q128a
  - micron_mt41k256m16
  - led_discrete_generic
  - pushbutton_smd_generic
