# digilent_zedboard pin map.
# Source: Digilent Zedboard-Master.xdc (commented-out menu form;
#         parser uncommented all assignments to extract the full pin map)
#   https://raw.githubusercontent.com/Digilent/digilent-xdc/master/Zedboard-Master.xdc


Board:
  id: digilent_zedboard
  name: ZedBoard
  url: https://digilent.com/shop/zedboard-zynq-7000-arm-fpga-soc-development-board/
  status: active
  producer: digilent
  chip: XC7Z020-CLG484-1
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - audio_codec
  - barrel_jack_input
  - ddr3_memory
  - dip_switches
  - ethernet_phy_gigabit
  - fmc_lpc
  - hdmi_output
  - microsd_socket
  - pmod_connector
  - qspi_flash
  - usb_2_otg
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  - vga_output
  devices:
  - cypress_s25fl128s
  - microchip_ksz9031rnx
  - adi_adv7511
  - adi_ssm2603
  - microchip_usb3343
  - microsd_socket_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - led_discrete_generic
  - micron_mt41k128m16
  banks:
    sys_clk:
      pins: Y9
    onboard_buttons:
      pins: [T18]
    onboard_switches:
      pins: [F22, G22, H22, F21, H19, H18, H17, M15]
    vga_r:
      pins: [V20, U20, V19, V18]
    vga_g:
      pins: [AB22, AA22, AB21, AA21]
    vga_b:
      pins: [Y21, Y20, AB20, AB19]
    vga_sync:
      pins:
        hs: AA19
        vs: Y19
    hdmi_clk:
      pins: W18
    hdmi_d0:
      pins: Y13
    hdmi_d1:
      pins: AA13
    hdmi_d10:
      pins: W13
    hdmi_d11:
      pins: W15
    hdmi_d12:
      pins: V15
    hdmi_d13:
      pins: U17
    hdmi_d14:
      pins: V14
    hdmi_d2:
      pins: AA14
    hdmi_d3:
      pins: Y14
    hdmi_d4:
      pins: AB15
    hdmi_d5:
      pins: AB16
    hdmi_d6:
      pins: AA16
    hdmi_d7:
      pins: AB17
    hdmi_d8:
      pins: AA17
    hdmi_d9:
      pins: Y15
    hdmi_de:
      pins: U16
    hdmi_hsync:
      pins: V17
    hdmi_int:
      pins: W16
    hdmi_scl:
      pins: AA18
    hdmi_sda:
      pins: Y16
    hdmi_spdif:
      pins: U15
    hdmi_spdifo:
      pins: Y18
    hdmi_vsync:
