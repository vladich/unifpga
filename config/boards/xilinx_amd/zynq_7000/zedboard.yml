# zedboard pin map.
#
# Source: Digilent Zedboard-Master.xdc (github.com/Digilent/digilent-xdc, MIT-licensed)
# Imported via tools/verify_pinmap_against_vendor.py.


Board:
  id: zedboard
  name: ZedBoard
  url: https://www.avnet.com/wps/portal/us/products/avnet-boards/avnet-board-families/zedboard/
  producer: avnet
  chip: XC7Z020CLG484-1
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - audio_codec
  - ddr3_memory
  - dip_switches
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - qspi_flash
  - sdr_sdram
  - usb_2_otg
  - user_buttons
  - user_leds
  - vga_output
  devices:
  - micron_mt41k128m16
  - spansion_s25fl256s
  - microchip_ksz9031rnx
  - adi_adv7511
  - adi_ssm2603
  - microchip_usb3343
  - cypress_cy7c1061dv33
  - vga666_resistor_dac
  - microsd_socket_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - led_discrete_generic
  defaults:
    iostandard: LVCMOS33
