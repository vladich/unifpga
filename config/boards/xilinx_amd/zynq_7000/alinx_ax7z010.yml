# alinx_ax7z010 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/.../course_s1_fpga.zip (streamed 21 constraint files; 44 signals)


Board:
  id: alinx_ax7z010
  name: Alinx AX7Z010
  url: https://coderobin.com/products/alinx-ax7z010-xilinx-zynq-7000-xc7z010-fpga-development-board
  status: active
  notes: B revision; pairs with AC7Z010 SOM (also new). 5V input.
  producer: alinx
  chip: XC7Z010-1CLG400I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - can_transceiver
  - ddr3_memory
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - qspi_flash
  - rs485_transceiver
  - sd_card_socket
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt41k128m16
  - silabs_cp2102
  - microsd_socket_generic
  - tmds_direct
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk:
      pins: U18
    cpu_resetn:
      pins: M15
    onboard_leds:
      pins: [J14, K14, J18, H18]
    ethernet_mdio:
      pins:
        mdc: J17
    ethernet_rgmii:
      pins:
        rxc: K19
        rx_ctl: K20
        rd[0]: J18
        rd[1]: K18
        rd[2]: J15
        rd[3]: K15
        txc: R21
        tx_ctl: R20
        td[0]: N17
        td[1]: N18
        td[2]: N19
        td[3]: N20
