# xilinx_zc706 pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/xilinx_zc706.py


Board:
  id: xilinx_zc706
  name: ZC706
  url: https://www.xilinx.com/products/boards-and-kits/ek-z7-zc706-g.html
  producer: xilinx_amd
  chip: XC7Z045-2FFG900C
  bridges:
