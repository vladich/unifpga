    cpu_resetn:
      pins: A8
    onboard_leds:
      pins: [Y21, G2, W21, A17]
    i2c_scl:
      pins:
        pin: AJ14
    i2c_sda:
      pins:
        pin: AJ18
    pcie_clk_n:
      pins:
        pin: N7
    pcie_clk_p:
      pins:
        pin: N8
    pcie_rst_n:
      pins:
        pin: AK23
    pcie_rx_n:
      pins: [P5, T5, U3, V5]
    pcie_rx_p:
      pins: [P6, T6, U4, V6]
    pcie_tx_n:
      pins: [N3, P1, R3, T1]
    pcie_tx_p:
      pins: [N4, P2, R4, T2]
    pcie_wake_n:
      pins:
        pin: AK22
    sfp_rxn:
      pins:
        pin: Y5
    sfp_rxp:
      pins:
        pin: Y6
    sfp_txn:
      pins:
        pin: W3
    sfp_txp:
      pins:
        pin: W4
