# iwave_rainbow_g28d: iW-RainboW-G28D Zynq-7000 SODIMM Dev Kit.

Board:
  id: iwave_rainbow_g28d
  name: iW-RainboW-G28D Zynq-7000 SODIMM Dev Kit
  url: https://iwave-global.com/product/zynq-7000-soc-sodimm-system-on-module/
  status: active
  producer: iwave
  chip: XC7Z020-1CLG484C
  bridges:
  - jtag
  programmer: vivado_hw
  extra_programmers:
