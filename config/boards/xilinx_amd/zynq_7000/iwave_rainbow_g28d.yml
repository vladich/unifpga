  - qspi_flash
  - usb_2_otg
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  - wifi_radio
  devices:
  - ftdi_ft2232h
  - micron_mt41k256m16
  - macronix_mx25l25645g
  - marvell_88e1512
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
