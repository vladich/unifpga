# alinx_ax7350 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/AX7350B/ (aggregated XDC files; 117 unique signals)


Board:
  id: alinx_ax7350
  name: Alinx AX7350
  url: https://coderobin.com/products/alinx-ax7350-xilinx-zynq-7000-xc7z035-fpga-development-board
  status: active
  notes: B revision of older AX7Z035 (in catalog) — distinct PCB.
  producer: alinx
  chip: XC7Z035-2FFG676I
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr3_memory
  - ethernet_phy_gigabit
  - hdmi_output
  - microsd_socket
  - pcie_endpoint
  - qspi_flash
  - sd_card_socket
  - sfp_cage
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - tmds_direct
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk:
      pins: J14
    cpu_resetn:
      pins: AF15
    onboard_leds:
      pins: [F5, E5, G5, G6]
    hdmi_clk:
      pins: K13
    hdmi_data_p:
      pins: [G16, E16, J15, E15, F15, G15, F14, H14, J13, K12, B11, C12, D13, A12, C13, A13, D14, D15, A14, B14, A15, B15, D16, B16]
    hdmi_i2c:
      pins:
        scl: A17
        sda: C16
    ethernet_mdio:
      pins:
        mdc: H16
    ethernet_rgmii:
      pins:
        rxc: G14
        rx_ctl: E13
        rd[0]: F13
        rd[1]: F12
        rd[2]: E12
        rd[3]: G11
        txc: D11
        tx_ctl: E11
        td[0]: F10
        td[1]: G10
        td[2]: D10
        td[3]: E10
