# alinx_axvu13f pin map.
# Source (local Alinx docs):
#   ~/Alinx/AXVU13F/01_demo_document.rar -> 01_demo_document/demo/led_test/led_test.srcs/constrs_1/new/led_test.xdc


Board:
  id: alinx_axvu13f
  name: Alinx AXVU13F
  url: https://coderobin.com/products/alinx-axvu13f-xilinx-virtex-ultrascale-xcvu13p-fpga-heterogeneous-computing-development-board
  status: active
  notes: 'Heterogeneous: VU13P + NVIDIA Jetson Orin NX. Industrial-grade XCVU13P-2FHGB2104I per product page; mapped
    to existing registry XCVU13P-2FHGB2104E.'
  producer: alinx
  chip: XCVU13P-2FHGB2104E
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - qspi_flash
  - qsfp_cage
  - qsfp_dd_cage
  - pcie_endpoint
  - fmc_plus
  - fmc_hpc
  - usb_uart_bridge
  - user_leds
  - user_buttons
  devices:
  - silabs_cp2102
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk_p:
      pins: AV18
      frequency_mhz: 200
    cpu_resetn:
      pins: BF35
    onboard_leds:
      pins: [BA17, BA18, BC18, BB19]
