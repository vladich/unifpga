# xilinx_vcu128 pin map.
# Source: LiteX-Boards platform file
#   https://raw.githubusercontent.com/litex-hub/litex-boards/master/litex_boards/platforms/xilinx_vcu128.py


Board:
  id: xilinx_vcu128
  name: VCU128
  url: https://www.xilinx.com/products/boards-and-kits/vcu128.html
  producer: xilinx_amd
  chip: XCVU37P-L2FSVH2892E
  bridges:
  - jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - dip_switches
  - microsd_socket
  - qspi_flash
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_n25q256a
  - silabs_cp2105
  - ftdi_ft4232h
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - ddr4_sodimm_socket
  - silabs_si570
  banks:
    cpu_resetn:
      pins: BM29
    onboard_leds:
      pins: [BH24, BG24, BG25, BF25, BF26, BF27, BG27, BG28]
    onboard_uart:
      pins:
        rx: BK28
        rts: BL26
        tx: BJ28
        cts: BL27
    ethernet_mdio:
      pins:
        pin: BG23
    ethernet_int_n:
      pins:
        pin: BF22
    ethernet_mdc:
      pins:
        pin: BN27
    ethernet_n:
      pins:
        pin: BJ27
    ethernet_p:
      pins:
        pin: BH27
    ethernet_rx_n:
      pins:
        pin: BK21
    ethernet_rx_p:
      pins:
        pin: BJ22
    ethernet_tx_n:
      pins:
        pin: BH22
    ethernet_tx_p:
      pins:
        pin: BG22
