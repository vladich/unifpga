# xilinx_vcu110: AMD Virtex UltraScale FPGA VCU110 Development Kit.

Board:
  id: xilinx_vcu110
  name: AMD Virtex UltraScale FPGA VCU110 Development Kit
  url: https://www.amd.com/en/products/adaptive-socs-and-fpgas/evaluation-boards/dk-u1-vcu110-g.html
  status: eol
  producer: xilinx_amd
  chip: XCVU190-2FLGC2104E
  bridges:
  - usb-jtag
  programmer: vivado_hw
  features:
  - ddr4_memory
  - dip_switches
  - fmc_hpc
  - fmc_plus
  - jtag_header
  - microsd_socket
  - pcie_endpoint
  - qsfp_cage
  - qspi_flash
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt40a256m16
  - micron_n25q256a
  - silabs_cp2105
  - ftdi_ft4232h
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - ddr4_sodimm_socket
  - silabs_si570
