# intel_stratix10_sx_devkit: Stratix 10 SX SoC Development Kit.

Board:
  id: intel_stratix10_sx_devkit
  name: Stratix 10 SX SoC Development Kit
  status: eol
  producer: intel_altera
  chip: 1SX280LU2F50E2VG
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - ddr4_memory
  - dip_switches
  - emmc_flash
  - ethernet_phy_gigabit
  - microsd_socket
  - qspi_flash
  - usb_2_host
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - ddr4_sodimm_socket
  - micron_mt40a256m16
  - micron_n25q256a
  - microchip_ksz9031rnx
  - usb_blaster_ii_built_in
  - silabs_cp2102
  - microsd_socket_generic
  - emmc_chip_generic
  - microchip_usb2514b
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
