# de10_lite pin map.

Board:
  id: de10_lite
  fpga:
    producer: "Altera (Intel)"
    family: "MAX 10"
    part: 10M50DAF484C7G
  defaults:
    iostandard: 3.3-V LVTTL

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
  pinBanks:
    clk50mhz: { pins: P11, frequency_mhz: 50 }
    onboard_buttons:
      iostandard: 3.3 V Schmitt Trigger
      active: low
      pins: [B8, A7]
    onboard_switches:
      pins: [C10, C11, D12, C12, A12, B12, A13, A14, B14, F15]
    onboard_leds:
      pins: [A8, A9, A10, B10, D13, C13, E14, D14, A11, B11]
    onboard_7seg:
      pins:
        hex0: [C14, E15, C15, C16, E16, D17, C17, D15]
        hex1: [C18, D18, E18, B16, A17, A18, B17, A16]
        hex2: [B20, A20, B19, A21, B21, C22, B22, A19]
        hex3: [F21, E22, E21, C19, C20, D19, E17, D22]
        hex4: [F18, E20, E19, J18, H19, F19, F20, F17]
        hex5: [J20, K20, L18, N18, M20, N19, N20, L19]
    onboard_vga:
      pins:
        hs: N3
        vs: N1
        r: [AA1, V1, Y2, Y1]
        g: [W1, T2, R2, R1]
        b: [P1, T1, P4, N2]
    arduino_reset_n: { pins: F16 }
    arduino_io:
      pins: [AB5, AB6, AB7, AB8, AB9, Y10, AA11, AA12, AB17, AA17, AB19, AA19, Y19, AB20, AB21, AA20]
    gpio:
      pins: [V10, W10, V9, W9, V8, W8, V7, W7, W6, V5, W5, AA15, AA14, W13, W12, AB13, AB12, Y11, AB11, W11, AB10, AA10, AA9, Y8, AA8, Y7, AA7, Y6, AA6, Y5, AA5, Y4, AB3, Y3, AB2, AA2]
    onboard_adc_clk_10mhz:   # ADC_CLK_10 (10 MHz, MAX 10 ADC PLL)
      device: {"name": "ADC_CLK_10 (10 MHz, MAX 10 ADC PLL)", "kind": "clock"}
      iostandard: "3.3-V LVTTL"
      pins: {"ADC_CLK_10": "N5"}
    onboard_clk2_50mhz:   # MAX10_CLK2_50 (50 MHz)
      device: {"name": "MAX10_CLK2_50 (50 MHz)", "kind": "clock"}
      iostandard: "3.3-V LVTTL"
      pins: {"MAX10_CLK2_50": "N14"}
    onboard_sdram:   # SDRAM (64 MB, 16-bit)
      device: {"name": "SDRAM (64 MB, 16-bit)", "kind": "sdram"}
      iostandard: "3.3-V LVTTL"
      model_params: {col_bits: 10}
      pins: {"DRAM_ADDR": ["U17", "W19", "V18", "U18", "U19", "T18", "T19", "R18", "P18", "P19", "T20", "P20", "R20"], "DRAM_DQ": ["Y21", "Y20", "AA22", "AA21", "Y22", "W22", "W20", "V21", "P21", "J22", "H21", "H22", "G22", "G20", "G19", "F22"], "DRAM_BA": ["T21", "T22"], "DRAM_LDQM": "V22", "DRAM_UDQM": "J21", "DRAM_RAS_N": "U22", "DRAM_CAS_N": "U21", "DRAM_CKE": "N22", "DRAM_CLK": "L14", "DRAM_WE_N": "V20", "DRAM_CS_N": "U20"}
    onboard_accelerometer:   # Accelerometer (ADXL345, SPI/I2C)
      device: {"name": "Accelerometer (ADXL345, SPI/I2C)", "kind": "accelerometer"}
      iostandard: "3.3-V LVTTL"
      pins: {"GSENSOR_SDI": "V11", "GSENSOR_SDO": "V12", "GSENSOR_CS_n": "AB16", "GSENSOR_SCLK": "AB15", "GSENSOR_INT1": "Y14", "GSENSOR_INT2": "Y13"}
