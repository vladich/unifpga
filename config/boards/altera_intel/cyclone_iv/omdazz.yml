# omdazz pin map.

Board:
  id: omdazz
  fpga:
    producer: "Altera (Intel)"
    family: "Cyclone IV"
    part: EP4CE6E22C8
  defaults:
    iostandard: 3.3-V LVTTL

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  pinBanks:
    clk: { pins: "23", frequency_mhz: 50 }
    cpu_reset: { pins: "25", active: low }
    onboard_buttons:
      active: low
      pins: ["91", "90", "89", "88"]
    onboard_leds:
      active: low
      pins: ["87", "86", "85", "84"]
    onboard_7seg:
      pins:
        segments: ["127", "124", "126", "132", "129", "125", "121", "128"]
        anodes: ["133", "135", "136", "137"]
    onboard_vga:
      pins:
        hs: "101"
        vs: "103"
        r: "106"
        g: "105"
        b: "104"
    onboard_uart:
      pins:
        tx: "114"
        rx: "115"
    gpio_pseudo_sdram:
      pins: ["64", "65", "66", "67", "68", "69", "70", "71", "72", "73", "74", "75", "76", "77"]
    onboard_char_lcd:
      pins:
        rs: "141"
        rw: "138"
        e: "143"
        d: ["142", "1", "144", "3", "2", "10", "7", "11"]
    onboard_buzzer:   # Buzzer (BEEP, PNP driver)
      device: {"name": "Buzzer (BEEP, PNP driver)", "kind": "buzzer"}
      active: "low (PNP transistor, inferred)"
      shares: ["gpio_p1"]   # the board multiplexes these pins
      pins: {"beep": "110"}
    onboard_ps2:   # PS/2 connector
      device: {"name": "PS/2 connector", "kind": "ps2"}
      shares: ["gpio_p1"]   # the board multiplexes these pins
      pins: {"clk": "119", "data": "120"}
    onboard_ir:   # Infrared receiver
      device: {"name": "Infrared receiver", "kind": "ir"}
      shares: ["gpio_p3"]   # the board multiplexes these pins
      pins: {"ir": "100"}
    onboard_eeprom:   # AT24C08 I2C EEPROM
      device: {"name": "AT24C08 I2C EEPROM", "kind": "eeprom"}
      shares: ["gpio_p3"]   # the board multiplexes these pins
      pins: {"scl": "99", "sda": "98"}
    onboard_temp_sensor:   # LM75(A) I2C temperature sensor
      device: {"name": "LM75(A) I2C temperature sensor", "kind": "temperature"}
      shares: ["gpio_p1"]   # the board multiplexes these pins
      pins: {"scl": "112", "sda": "113"}
    onboard_sdram:   # HY57V561620FTP-H SDRAM (x16)
      device: {"name": "HY57V561620FTP-H SDRAM (x16)", "kind": "sdram"}
      shares: ["gpio_p2", "gpio_pseudo_sdram"]   # the board multiplexes these pins
      model_params: {col_bits: 8}
      pins: {"clk": "43", "cke": "58", "cs_n": "72", "ras_n": "71", "cas_n": "70", "we_n": "69", "ba": ["73", "74"], "a": ["76", "77", "80", "83", "68", "67", "66", "65", "64", "60", "75", "59"], "dq": ["28", "30", "31", "32", "33", "34", "38", "39", "54", "53", "52", "51", "50", "49", "46", "44"], "dqm": ["42", "55"]}
    onboard_config_flash:   # EPCS serial configuration flash (AS)
      device: {"name": "EPCS serial configuration flash (AS)", "kind": "flash"}
      pins: {"dclk": "12", "data0": "13", "asdo": "6", "ncso": "8"}
    gpio_p1:   # P1 header (2x19)
      device: {"name": "P1 header (2x19)", "kind": "header"}
      shares: ["onboard_7seg", "onboard_buzzer", "onboard_char_lcd", "onboard_ps2", "onboard_temp_sensor", "onboard_uart"]   # the board multiplexes these pins
      pins: {"p3": "110", "p4": "111", "p5": "112", "p6": "113", "p7": "114", "p8": "115", "p9": "119", "p10": "120", "p11": "121", "p12": "124", "p13": "125", "p14": "126", "p15": "127", "p16": "128", "p17": "129", "p18": "132", "p19": "133", "p20": "135", "p21": "136", "p22": "137", "p23": "138", "p24": "141", "p25": "142", "p26": "143", "p27": "144", "p28": "1", "p29": "2", "p30": "3", "p31": "7", "p32": "10", "p33": "11", "p34": "24"}
    gpio_p2:   # P2 header (2x22)
      device: {"name": "P2 header (2x22)", "kind": "header"}
      shares: ["gpio_pseudo_sdram", "onboard_sdram"]   # the board multiplexes these pins
      pins: {"p7": "83", "p8": "80", "p9": "77", "p10": "76", "p11": "75", "p12": "74", "p13": "73", "p14": "72", "p15": "71", "p16": "70", "p17": "69", "p18": "68", "p19": "67", "p20": "66", "p21": "65", "p22": "64", "p23": "60", "p24": "59", "p25": "58", "p26": "55", "p27": "54", "p28": "53", "p29": "52", "p30": "51", "p31": "50", "p32": "49", "p33": "46", "p34": "44", "p35": "43", "p36": "42", "p37": "39", "p38": "38", "p39": "34", "p40": "33", "p41": "32", "p42": "31", "p43": "30", "p44": "28"}
    gpio_p3:   # P3 header (2x10)
      device: {"name": "P3 header (2x10)", "kind": "header"}
      shares: ["onboard_buttons", "onboard_eeprom", "onboard_ir", "onboard_leds", "onboard_vga"]   # the board multiplexes these pins
      pins: {"p3": "84", "p4": "85", "p5": "86", "p6": "87", "p7": "88", "p8": "89", "p9": "90", "p10": "91", "p11": "98", "p12": "99", "p13": "100", "p14": "101", "p15": "103", "p16": "104", "p17": "105", "p18": "106"}
    onboard_jtag_and_as_10_pin_headers:   # JTAG and AS 10-pin headers
      device: {"name": "JTAG and AS 10-pin headers", "kind": "other"}
      pins: {"tck": "16", "tdo": "20", "tms": "18", "tdi": "15"}
