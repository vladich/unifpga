# de2_115 pin map.

Board:
  id: de2_115
  fpga:
    producer: "Altera (Intel)"
    family: "Cyclone IV"
    part: EP4CE115F29C7

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  pinBanks:
    clk50mhz: { pins: Y2, frequency_mhz: 50, iostandard: 3.3-V LVTTL }
    onboard_buttons:
      iostandard: 2.5 V
      active: low
      pins: [M23, M21, N21, R24]
