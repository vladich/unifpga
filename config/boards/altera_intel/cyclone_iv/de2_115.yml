    - id: sram
      label: SRAM (2 MB, 16-bit)
      attach: {peripheral: async_sram, params: {addr_bits: 20}, bind: {a: onboard_sram.SRAM_ADDR, d: onboard_sram.SRAM_DQ, ce_n: onboard_sram.SRAM_CE_N, oe_n: onboard_sram.SRAM_OE_N, we_n: onboard_sram.SRAM_WE_N, lb_n: onboard_sram.SRAM_LB_N, ub_n: onboard_sram.SRAM_UB_N}}
    - id: flash
      label: Flash memory (8 MB, 8-bit)
      device: {kind: flash, bank: onboard_flash}   # no peripheral model yet
    - id: eeprom
      label: EEPROM (I2C)
      device: {kind: other, bank: onboard_eeprom}   # no peripheral model yet
    - id: sdcard
      label: SD card socket
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_sdcard.SD_CLK, cmd: onboard_sdcard.SD_CMD, dat0: 'onboard_sdcard.SD_DAT[0]', dat3: 'onboard_sdcard.SD_DAT[3]'}}
