# de2_115 pin map.


Board:
  id: de2_115
  name: DE2-115
  product: DE2-115 Development and Education Board
  summary: Cyclone IV E EP4CE115F29C7 (114,480 LEs); 128 MB SDRAM, 2 MB SRAM, 8 MB flash, I2C EEPROM; VGA (ADV7123),
    WM8731 audio, ADV7180 TV decoder, 2x Gigabit Ethernet, CY7C67200 USB, IR, RS-232, PS/2, SD, 16x2 LCD, HSMC, 2x20
    GPIO, 8x 7-seg, 18 SW, 4 KEY, 27 LEDs
  url: https://www.terasic.com.tw/cgi-bin/page/archive.pl?Language=English&CategoryNo=139&No=502
  producer: terasic
  chip: EP4CE115F29C7
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - audio_codec
  - dip_switches
  - ethernet_phy_gigabit
  - hdmi_input
  - sdr_sdram
  - seven_segment_display
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  - character_lcd
  - ps2_port
  - analog_video_decoder
  - ir_receiver
  - sram
  - nor_flash
  - sd_card_socket
  devices:
  - winbond_w9825g6kh
  - wolfson_wm8731
  - adi_adv7123
  - adi_adv7611
  - marvell_88e1111
  - usb_blaster_ii_built_in
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - seven_seg_module_shared
  - adi_adv7180
  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  banks:
    clk50mhz: { pins: Y2, frequency_mhz: 50, iostandard: 3.3-V LVTTL }
    onboard_buttons:
      iostandard: 2.5 V
      active: low
      pins: [M23, M21, N21, R24]
    onboard_switches:
      iostandard: 2.5 V
      pins: [AB28, AC28, AC27, AD27, AB27, AC26, AD26, AB26, AC25, AB25, AC24, AB24, AB23, AA24, AA23, AA22, Y24, Y23]
    onboard_leds:
      iostandard: 2.5 V
      pins: [G19, F19, E19, F21, F18, E18, J19, H19, J17, G17, J15, H16, J16, H17, F15, G15, G16, H15]
    onboard_leds_green:
      iostandard: 2.5 V
      pins: [E21, E22, E25, E24, H21, G20, G22, G21, F17]
    onboard_7seg:
      pins:
        hex0: [G18, F22, E17, L26, L25, J22, H22]
        hex1: [M24, Y22, W21, W22, W25, U23, U24]
        hex2: [AA25, AA26, Y25, W26, Y26, W27, W28]
