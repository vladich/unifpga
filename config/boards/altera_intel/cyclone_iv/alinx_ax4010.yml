# alinx_ax4010 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/.../AX4010_CD_20211224.rar (streamed 47 constraint files; 261 signals)

Board:
  id: alinx_ax4010
  pinBanks:
    sys_clk:
      frequency_mhz: 50
      pins: PIN_E1
    cpu_resetn:
      pins: PIN_N13
    onboard_buttons:
      pins: [PIN_N13, PIN_M15, PIN_M16, PIN_E16]
    onboard_leds:
      pins: [PIN_E10, PIN_F9, PIN_C9, PIN_D9]
    onboard_uart:
      pins:
        tx: PIN_N1
        rx: PIN_M2
    microsd:
      pins:
        dclk: PIN_D12
        miso: PIN_E15
        mosi: PIN_F10
        ncs: PIN_D11
