# alinx_ax4010 pin map.


Board:
  id: alinx_ax4010
  name: Alinx AX4010
  product: AX4010 (ALINX / Heijin Cyclone IV development board)
  summary: Intel/Altera Cyclone IV E EP4CE10F17C8 (10,320 LEs, 256-ball FBGA) on the AX301 PCB; 256 Mbit SDRAM, 16
    Mbit SPI flash, 24LC04 EEPROM, DS1302 RTC, CP2102 USB-UART, 16-bit (5-6-5) VGA, microSD (SPI), camera port, 6-digit
    7-segment, 4 LEDs, 3 keys + reset, buzzer, two 40-pin expansion headers
  url: https://alinx.com/en/detail/42
  producer: alinx
  chip: EP4CE10F17C8
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - microsd_socket
  - sdr_sdram
  - seven_segment_display
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  - vga_output
  - spi_flash
  - audio_codec
  devices:
