  defaults:
    iostandard: 3.3-V LVTTL

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  banks:
    clk: { pins: E1, frequency_mhz: 50, source: {doc: ug, where: 'section 4, p. 10, "Clock pin assignment"'} }
    cpu_resetn: { pins: N13, active: low, source: {doc: ug, where: 'section 13, p. 18, "Key pin assignment"'} }
    onboard_buttons:
      source: {doc: ug, where: 'section 13, p. 18, "Key pin assignment"'}
      active: low
      # key = ~{KEY2, KEY3, KEY4}: key[0] = KEY4
      pins: [E16, M16, M15]
    onboard_leds:
      source: {doc: ug, where: 'section 12, p. 18, "LED pin assignment"'}
      pins: [D9, C9, F9, E10]
    onboard_7seg:
      source: {doc: ug, where: 'section 15, p. 21, "Digital Tube pin assignment"'}
      pins:
        segments: [R16, N15, N12, P15, T15, P16, N16, R14]
        anodes: [M11, P11, N11, M10, P9, N9]
    onboard_vga:
      source: {doc: ug, where: 'section 10, pp. 16-17, "VGA pin assignment" (VGA_D[0..4]=blue, [5..10]=green, [11..15]=red)'}
      pins:
        hs: L6
        vs: N3
        r: [K6, K5, L7, L3, L4]
        g: [F5, G5, F7, K8, L8, J6]
        b: [C3, D4, D3, E5, F6]
    onboard_uart:
      source: {doc: ug, where: 'section 9, p. 15, "UART pin assignment"'}
      pins:
        rx: M2
        tx: N1
    gpio_0:
      source: {doc: ug, where: 'section 17, pp. 22-23, "J1 pin assignment" (keyed by header pin)'}
      pins: [N2, P1, P2, R1, P8, K9, L9, L10, M9, T2, P3, T3, R3, T4, R4, T5, R5, T6, R6, T7, R7, T8, R8, T9, R9, T10, R10, T11, R11, T12, R12, T13, R13, T14]
    gpio_1:
      source: {doc: ug, where: 'section 17, pp. 22-23, "J2 pin assignment" (keyed by header pin)'}
      pins: [B1, C2, B3, A2, B4, A3, B5, A4, B6, A5, B7, A6, B8, A7, B9, A8, B10, A9, B11, A10, B12, A11, B13, A12, D5, A13, C6, D6, F8, E7, D8, C8, E9, E8]
    onboard_i2c:
      source: {doc: ug, where: 'section 7, p. 13, "EEPROM pin assignment"'}
      pins:
        scl: D1
        sda: E6
    onboard_sdcard:   # Micro SD card slot (SPI mode)
      source: {doc: ug, where: 'section 11, p. 17, "SD card slot pin assignment"'}
      device: {"name": "Micro SD card slot (SPI mode)", "kind": "sdcard"}
      pins: {"cs_n": "D11", "mosi": "F10", "sclk": "D12", "miso": "E15"}
    onboard_sdram:   # SDRAM HY57V2562GTR (256 Mbit, 16M x 16)
      source: {doc: ug, where: 'section 6, pp. 11-12, "SDRAM pin assignment"'}
      device: {"name": "SDRAM HY57V2562GTR (256 Mbit, 16M x 16)", "kind": "sdram"}
      model_params: {col_bits: 9}
      pins: {"clk": "B14", "cke": "F16", "cs_n": "K10", "we_n": "J13", "cas_n": "J12", "ras_n": "K11", "dqm": ["J14", "G15"], "ba": ["G11", "F13"], "a": ["F11", "E11", "D14", "C14", "A14", "A15", "B16", "C15", "C16", "D15", "F14", "D16", "F15"], "dq": ["P14", "M12", "N14", "L12", "L13", "L14", "L11", "K12", "G16", "J11", "J16", "J15", "K16", "K15", "L16", "L15"]}
    onboard_spi_flash:   # SPI configuration flash M25P16 (16 Mbit, EPCS16-compatible)
      source: {doc: ug, where: 'section 5, p. 11, "Configure chip pin assignment"'}
      device: {"name": "SPI configuration flash M25P16 (16 Mbit, EPCS16-compatible)", "kind": "flash"}
      pins: {"dclk": "H1", "ncso": "D2", "data0": "H2", "asdo": "C1"}
    onboard_rtc:   # Real-time clock DS1302 (CR1220 backup battery)
      source: {doc: qsf_rtc, where: 'set_location_assignment lines 16, 18, 17'}
      device: {"name": "Real-time clock DS1302 (CR1220 backup battery)", "kind": "other"}
      pins: {"sclk": "P6", "ce": "N8", "data": "M8"}
    onboard_buzzer:   # Buzzer (transistor-driven, jumper CB1)
      source: {doc: ug, where: 'section 16, p. 22, "Buzzer pin assignment"'}
      device: {"name": "Buzzer (transistor-driven, jumper CB1)", "kind": "audio"}
      active: "low (UG section 16)"
      pins: {"buzzer": "C11"}
    camera_port:   # Camera port (18-pin CMOS camera interface; UG: for an OV5640 module)
      source: {doc: ug, where: 'section 14, p. 19, "Camera port pin assignment" (keyed by connector pin; 1 = +3.3V, 2 = GND)'}
      device: {"name": "Camera port (18-pin CMOS camera interface; UG: for an OV5640 module)", "kind": "header"}
      pins: ["F1", "F3", "G1", "F2", "M1", "G2", "J2", "J1", "K2", "K1", "L2", "L1", "N5", "M6", "N6", "M7"]
  # ---- drawn: headers and parts; ./unifpga layout draft alinx_ax4010 regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: gpio_0
      type: pin_row
      label: GPIO_0
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_0
