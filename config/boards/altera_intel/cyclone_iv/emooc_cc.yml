# emooc_cc pin map.


Board:
  id: emooc_cc
  name: EPI-MiniCY4 Cyclone IV board (EP4CE6)
  product: unresolved - catalogue says "EPI-MiniCY4 Cyclone IV board (EP4CE6)" (producer emoocc); community projects
    call it "MiniFPGA"
  summary: Altera Cyclone IV E EP4CE6F17C8 (6272 LE, FBGA256); 16 LEDs, 8 keys, 8 DIP switches, 6-digit 7-seg, buzzer,
    UART and I2C EEPROM (BGM only), J7/P1/P2 I/O headers
  producer: emoocc
  chip: EP4CE6F17C8
  bridges:
  - jtag
  programmer: quartus_pgm
  defaults:
    iostandard: 3.3-V LVTTL

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  banks:
    clk: { pins: E1, frequency_mhz: 50 }
    onboard_buzzer: { pins: L3 }
    onboard_uart:
      pins:
        rx: F14
        tx: F13
    onboard_eeprom:
      pins:
        scl: R14
        sda: T15
    onboard_buttons:
      active: low
      pins: [J14, J16, J15, K16, K15, L15, L16, J13]
    onboard_switches:
      active: low
      pins: [R16, P15, P16, N15, N16, M12, N14, N13]
    onboard_leds:
      active: low
      pins: [A5, B5, A4, B4, A3, B3, A2, C3, D15, D16, F15, F16, G15, G16, L13, L14]
    onboard_7seg:
      pins:
        segments: [C9, E9, D8, C8, D11, E8, E10, D9]
        anodes: [C14, D14, G11, F11, C11, D12]
    gpio_j7:
      index_origin: 4
      pins: [N5, P3, N3, T7, R7, T6, R6, T5, R5, T4, R4, T3, R3, T2, R1, P2, P1, N2, N1, L2, L1, J2, K1, G1, J1, G2, F1, F2, C2, B1, D3, D4, E5, D5]
    gpio_p1:
      index_origin: 2
      pins: [C6, B6, A6, B7, A7, B8, A8, A9, B9, A11, B11, A12, B12, A13, B13, A14, B14, A15, B16, C15, C16]
    gpio_p2:
      index_origin: 2
      pins: [N6, R8, T8, T9, R9, T10, R10, T11, M11, N12, P8, N8, M8, M9, N9, P9, M10, R11, T13, R13, T14]
  # ---- drawn: headers and parts; ./unifpga layout draft emooc_cc regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: gpio_j7
      type: pin_row
      label: GPIO_J7
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_j7
      pins: {'[0]': 'gpio_j7[0]', '[1]': 'gpio_j7[1]', '[2]': 'gpio_j7[2]', '[3]': 'gpio_j7[3]', '[4]': 'gpio_j7[4]', '[5]': 'gpio_j7[5]', '[6]': 'gpio_j7[6]', '[7]': 'gpio_j7[7]', '[8]': 'gpio_j7[8]', '[9]': 'gpio_j7[9]', '[10]': 'gpio_j7[10]', '[11]': 'gpio_j7[11]', '[12]': 'gpio_j7[12]', '[13]': 'gpio_j7[13]', '[14]': 'gpio_j7[14]', '[15]': 'gpio_j7[15]', '[16]': 'gpio_j7[16]', '[17]': 'gpio_j7[17]', '[18]': 'gpio_j7[18]', '[19]': 'gpio_j7[19]', '[20]': 'gpio_j7[20]', '[21]': 'gpio_j7[21]', '[22]': 'gpio_j7[22]', '[23]': 'gpio_j7[23]', '[24]': 'gpio_j7[24]', '[25]': 'gpio_j7[25]', '[26]': 'gpio_j7[26]', '[27]': 'gpio_j7[27]', '[28]': 'gpio_j7[28]', '[29]': 'gpio_j7[29]', '[30]': 'gpio_j7[30]', '[31]': 'gpio_j7[31]', '[32]': 'gpio_j7[32]', '[33]': 'gpio_j7[33]'}
    - id: gpio_p1
      type: pin_row
      label: GPIO_P1
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_p1
      pins: {'[0]': 'gpio_p1[0]', '[1]': 'gpio_p1[1]', '[2]': 'gpio_p1[2]', '[3]': 'gpio_p1[3]', '[4]': 'gpio_p1[4]', '[5]': 'gpio_p1[5]', '[6]': 'gpio_p1[6]', '[7]': 'gpio_p1[7]', '[8]': 'gpio_p1[8]', '[9]': 'gpio_p1[9]', '[10]': 'gpio_p1[10]', '[11]': 'gpio_p1[11]', '[12]': 'gpio_p1[12]', '[13]': 'gpio_p1[13]', '[14]': 'gpio_p1[14]', '[15]': 'gpio_p1[15]', '[16]': 'gpio_p1[16]', '[17]': 'gpio_p1[17]', '[18]': 'gpio_p1[18]', '[19]': 'gpio_p1[19]', '[20]': 'gpio_p1[20]'}
    - id: gpio_p2
      type: pin_row
      label: GPIO_P2
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_p2
      pins: {'[0]': 'gpio_p2[0]', '[1]': 'gpio_p2[1]', '[2]': 'gpio_p2[2]', '[3]': 'gpio_p2[3]', '[4]': 'gpio_p2[4]', '[5]': 'gpio_p2[5]', '[6]': 'gpio_p2[6]', '[7]': 'gpio_p2[7]', '[8]': 'gpio_p2[8]', '[9]': 'gpio_p2[9]', '[10]': 'gpio_p2[10]', '[11]': 'gpio_p2[11]', '[12]': 'gpio_p2[12]', '[13]': 'gpio_p2[13]', '[14]': 'gpio_p2[14]', '[15]': 'gpio_p2[15]', '[16]': 'gpio_p2[16]', '[17]': 'gpio_p2[17]', '[18]': 'gpio_p2[18]', '[19]': 'gpio_p2[19]', '[20]': 'gpio_p2[20]'}
  parts:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 8}, bind: {btn: onboard_buttons}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 8}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 16}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 6, active: high, digits_active: low}, bind: {segments: ['onboard_7seg.segments[7]', 'onboard_7seg.segments[6]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[1]'], dp: 'onboard_7seg.segments[0]', digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]']}}
