# intel_agilex7_devkit_iseries: Agilex 7 I-Series FPGA Development Kit.

Board:
  id: intel_agilex7_devkit_iseries
  name: Agilex 7 I-Series FPGA Development Kit
  status: eol
  producer: intel_altera
  chip: AGIB027R29A1E2VR0
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - ddr4_memory
  - dip_switches
  - ethernet_phy_gigabit
  - microsd_socket
  - qspi_flash
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - ddr4_sodimm_socket
  - micron_n25q256a
  - microchip_ksz9031rnx
  - usb_blaster_ii_built_in
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
