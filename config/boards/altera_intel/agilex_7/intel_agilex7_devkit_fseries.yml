# intel_agilex7_devkit_fseries: Agilex 7 F-Series FPGA Development Kit.

Board:
  id: intel_agilex7_devkit_fseries
  name: Agilex 7 F-Series FPGA Development Kit
  aliases:
  - terasic_agilex7_f_series_devkit
  url: https://www.altera.com/products/devkit/po-3202/agilex-7-fpga-f-series-development-kit-p-tile-and-e-tile
  producer: intel_altera
  chip: AGFB014R24B2E2V
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
