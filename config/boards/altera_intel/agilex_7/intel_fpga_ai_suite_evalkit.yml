# intel_fpga_ai_suite_evalkit: FPGA AI Suite Evaluation Kit.

Board:
  id: intel_fpga_ai_suite_evalkit
  name: FPGA AI Suite Evaluation Kit
  status: eol
  producer: intel_altera
  chip: AGFB014R24B2E2V
  bridges:
  - usb-jtag
  programmer: quartus_pgm
  features:
  - ddr4_memory
  - pcie_endpoint
  - qsfp_cage
  - qspi_flash
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - ddr4_sodimm_socket
  - micron_n25q256a
  - usb_blaster_ii_built_in
  - silabs_cp2102
  - led_discrete_generic
  - pushbutton_smd_generic
