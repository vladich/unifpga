# de0 pin map.


Board:
  id: de0
  name: DE0
  product: Altera DE0 Board
  summary: Cyclone III EP3C16F484C6N (15,408 LEs); 8 MB SDRAM + 4 MB flash; VGA (4-bit), RS-232, PS/2, SD, 16x2 LCD,
    2x 2x20 GPIO, 4x 7-seg, 10 SW, 3 buttons, 10 LEDs
  url: https://www.terasic.com.tw/cgi-bin/page/archive.pl?Language=English&CategoryNo=56&No=364
  producer: terasic
  chip: EP3C16F484C6N
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - nor_flash
  - dip_switches
  - sdr_sdram
  - seven_segment_display
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  - character_lcd
  - ps2_port
  - sd_card_socket
  devices:
  - hynix_hy57v641620
  - usb_blaster_ii_built_in
  - vga666_resistor_dac
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - seven_seg_module_shared
  documents:
  - id: manual
    title: DE0 User Manual (Terasic, 2012)
    kind: manual
    url: https://www.terasic.com.tw/cgi-bin/page/archive_download.pl?Language=English&No=364&FID=0c266381d75ef92a8291c5bbdd5b07eb
