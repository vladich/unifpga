  defaults:
    iostandard: 3.3-V LVTTL

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  banks:
    clk50mhz: { pins: G21, frequency_mhz: 50, source: {doc: manual, where: 'Table 4.5, p. 32'} }
    onboard_uart:
      source: {doc: manual, where: 'Table 4.12, p. 41'}
      pins:
        rts: V22
        rx: U22
        cts: V21
        tx: U21
    onboard_buttons:
      source: {doc: manual, where: 'Table 4.2, p. 28'}
      active: low
      pins: [H2, G3, F1]
    onboard_leds_green:
      source: {doc: manual, where: 'Table 4.3, p. 29'}
      pins: [J1, J2, J3, H1, F2, E1, C1, C2, B2, B1]
    onboard_switches:
      source: {doc: manual, where: 'Table 4.1, p. 28'}
      pins: [J6, H5, H6, G4, G5, J7, H7, E3, E4, D2]
    onboard_7seg:
      source: {doc: manual, where: 'Table 4.4, p. 30-31'}
      pins:
        hex0: [E11, F11, H12, H13, G12, F12, F13, D13]
        hex1: [A13, B13, C13, A14, B14, E14, A15, B15]
        hex2: [D15, A16, B16, E15, A17, B17, F14, A18]
        hex3: [B18, F15, A19, B19, C19, D19, G15, G16]
    onboard_vga:
      source: {doc: manual, where: 'Table 4.11, p. 39'}
      pins:
        hs: L21
        vs: L22
        r: [H19, H17, H20, H21]
        g: [H22, J17, K17, J21]
        b: [K22, K21, J22, K18]
    gpio_0:
      source: {doc: manual, where: 'Table 4.8, p. 35-36'}
      pins: [AB16, AA16, AA15, AB15, AA14, AB14, AB13, AA13, AB10, AA10, AB8, AA8, AB5, AA5, AB4, AA4, V14, U14, Y13, W13, U13, V12, R10, V11, Y10, W10, T8, V8, W7, W6, V5, U7]
    gpio_1:
