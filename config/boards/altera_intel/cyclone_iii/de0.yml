    onboard_clk2_50mhz:   # CLOCK_50_2 (50 MHz)
      device: {"name": "CLOCK_50_2 (50 MHz)", "kind": "clock"}
      pins: {"CLOCK_50_2": "B12"}
    onboard_lcd:   # Character LCD module (16x2, HD44780 compatible)
      source: {doc: manual, where: 'Table 4.7, p. 34'}
      device: {"name": "Character LCD module (16x2, HD44780 compatible)", "kind": "lcd_char"}
      pins: {"LCD_DATA": ["D22", "D21", "C22", "C21", "B22", "B21", "D20", "C20"], "LCD_RW": "E22", "LCD_EN": "E21", "LCD_RS": "F22", "LCD_BLON": "F21"}
    onboard_ps2:   # PS/2 port (keyboard + mouse via Y-cable)
      source: {doc: manual, where: 'Table 4.13, p. 41'}
      device: {"name": "PS/2 port (keyboard + mouse via Y-cable)", "kind": "ps2"}
      pins: {"PS2_KBCLK": "P22", "PS2_KBDAT": "P21", "PS2_MSCLK": "R21", "PS2_MSDAT": "R22"}
    onboard_sdcard:   # SD card socket
      source: {doc: manual, where: 'Table 4.14, p. 42'}
      device: {"name": "SD card socket", "kind": "sdcard"}
      pins: {"SD_CLK": "Y21", "SD_CMD": "Y22", "SD_DAT0": "AA22", "SD_DAT3": "W21", "SD_WP_N": "W20"}
    onboard_sdram:   # SDRAM (8 MB, 16-bit)
      source: {doc: manual, where: 'Table 4.15, p. 44-45'}
      device: {"name": "SDRAM (8 MB, 16-bit)", "kind": "sdram"}
      model_params: {row_bits: 12, col_bits: 8}
      pins: {"DRAM_ADDR": ["C4", "A3", "B3", "C3", "A5", "C6", "B6", "A6", "C7", "B7", "B4", "A7", "C8"], "DRAM_DQ": ["D10", "G10", "H10", "E9", "F9", "G9", "H9", "F8", "A8", "B9", "A9", "C10", "B10", "A10", "E10", "F10"], "DRAM_BA_": ["B5", "A4"], "DRAM_LDQM": "E7", "DRAM_UDQM": "B8", "DRAM_RAS_N": "F7", "DRAM_CAS_N": "G8", "DRAM_CKE": "E6", "DRAM_CLK": "E5", "DRAM_WE_N": "D6", "DRAM_CS_N": "G7"}
    onboard_flash:   # Flash memory (4 MB)
      source: {doc: manual, where: 'Table 4.16, p. 45-46'}
      device: {"name": "Flash memory (4 MB)", "kind": "flash"}
      pins: {"FL_ADDR": ["P7", "P5", "P6", "N7", "N5", "N6", "M8", "M4", "P2", "N2", "N1", "M3", "M2", "M1", "L7", "L6", "AA2", "M5", "M6", "P1", "P3", "R2"], "FL_DQ": ["R7", "P8", "R8", "U1", "V2", "V3", "W1", "Y1", "T5", "T7", "T4", "U2", "V1", "V4", "W2"], "FL_DQ15_AM1": "Y2", "FL_BYTE_N": "AA1", "FL_CE_N": "N8", "FL_OE_N": "R6", "FL_RST_N": "R1", "FL_RY": "M7", "FL_WE_N": "P4", "FL_WP_N": "T3"}
