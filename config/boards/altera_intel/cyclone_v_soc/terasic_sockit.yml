# terasic_sockit pin map.


Board:
  id: terasic_sockit
  name: Terasic SoCKit
  product: SoCKit (Cyclone V SoC Development Kit)
  summary: Cyclone V SX SoC 5CSXFC6D6F31C6 (110K LEs, dual Cortex-A9 HPS, transceivers); 1 GB DDR3 FPGA + 1 GB DDR3
    HPS; VGA (ADV7123), SSM2603 audio, HSMC, IR, temperature sensor; HPS Ethernet, USB OTG, micro SD, QSPI flash,
    128x64 LCD, G-sensor; 4 SW, 4 KEY, 4 LEDs
  url: https://www.terasic.com.tw/cgi-bin/page/archive.pl?Language=English&No=816
  producer: terasic
  chip: 5CSXFC6D6F31C6
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - accelerometer
  - adc_chip
  - audio_codec
  - ddr3_memory
  - dip_switches
  - ethernet_phy_gigabit
  - microsd_socket
  - seven_segment_display
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  - qspi_flash
  devices:
  - micron_mt41k256m16
  - adi_ssm2603
  - adi_adv7123
  - microchip_ksz9031rnx
  - microsd_socket_generic
  - usb_blaster_ii_built_in
  - adi_adxl345
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - seven_seg_module_shared
  - lt_ltc2308
