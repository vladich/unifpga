  # ---- drawn: headers and parts; ./unifpga layout draft terasic_sockit regenerates from here on ----
  layout: {verified: false, generated: true}
  headers: []
  parts:
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4}, bind: {led: onboard_leds}}
    - id: osc_50_b3b
      label: osc 50 b3b
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: osc_50_b3b}}
    - id: cpu_resetn
      label: cpu resetn
      attach: {peripheral: reset_button, bind: {rst: cpu_resetn}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 4}, bind: {sw: onboard_switches}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 8, bits_g: 8, bits_b: 8, pin_bits_r: 8, pin_bits_g: 8, pin_bits_b: 8, color_depth: 888, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs, clk: onboard_vga.clk, blank_n: onboard_vga.blank_n}}
    - id: hps_ethernet
      label: HPS Gigabit Ethernet PHY (KSZ9021RN)
      device: {kind: ethernet, bank: onboard_hps_ethernet}   # no peripheral model yet
    - id: hps_uart
      label: HPS UART to USB (FT232R)
      device: {kind: uart, bank: onboard_hps_uart}   # no peripheral model yet
    - id: hps_ddr3
