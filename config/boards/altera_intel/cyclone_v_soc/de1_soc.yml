      iostandard: "3.3V"
      pins: {"HPS_UART_RX": "B25", "HPS_UART_TX": "C25", "HPS_CONV_USB_N": "B15"}
    onboard_hps_ddr3:   # HPS DDR3 SDRAM (1 GB, 32-bit)
      device: {"name": "HPS DDR3 SDRAM (1 GB, 32-bit)", "kind": "ddr3"}
      iostandard: "SSTL-15 Class I"
      pins: {"HPS_DDR3_A": ["F26", "G30", "F28", "F30", "J25", "J27", "F29", "E28", "H27", "G26", "D29", "C30", "B30", "C29", "H25"], "HPS_DDR3_BA": ["E29", "J24", "J23"], "HPS_DDR3_CAS_n": "E27", "HPS_DDR3_CKE": "L29", "HPS_DDR3_CK_n": "L23", "HPS_DDR3_CK_p": "M23", "HPS_DDR3_CS_n": "H24", "HPS_DDR3_DM": ["K28", "M28", "R28", "W30"], "HPS_DDR3_DQ": ["K23", "K22", "H30", "G28", "L25", "L24", "J30", "J29", "K26", "L26", "K29", "K27", "M26", "M27", "L28", "M30", "U26", "T26", "N29", "N28", "P26", "P27", "N27", "R29", "P24", "P25", "T29", "T28", "R27", "R26", "V30", "W29"], "HPS_DDR3_DQS_n": ["M19", "N24", "R18", "R21"], "HPS_DDR3_DQS_p": ["N18", "N25", "R19", "R22"], "HPS_DDR3_ODT": "H28", "HPS_DDR3_RAS_n": "D30", "HPS_DDR3_RESET_n": "P30", "HPS_DDR3_WE_n": "C28", "HPS_DDR3_RZQ": "D27"}
    onboard_hps_sdcard:   # HPS micro SD card socket
      device: {"name": "HPS micro SD card socket", "kind": "sdcard"}
      iostandard: "3.3V"
      pins: {"HPS_SD_CLK": "A16", "HPS_SD_CMD": "F18", "HPS_SD_DATA": ["G18", "C17", "D17", "B16"]}
    onboard_hps_usb_otg:   # HPS USB 2.0 OTG PHY (USB3300)
      device: {"name": "HPS USB 2.0 OTG PHY (USB3300)", "kind": "usb"}
      iostandard: "3.3V"
      pins: {"HPS_USB_CLKOUT": "N16", "HPS_USB_DATA": ["E16", "G16", "D16", "D14", "A15", "C14", "D15", "M17"], "HPS_USB_DIR": "E14", "HPS_USB_NXT": "A14", "HPS_USB_RESET": "G17", "HPS_USB_STP": "C15"}
