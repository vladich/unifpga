# de1_soc pin map.


Board:
  id: de1_soc
  name: DE1-SoC
  product: DE1-SoC Board
  summary: Cyclone V SE SoC 5CSEMA5F31C6N (85K LEs, dual Cortex-A9 HPS); 64 MB SDRAM (FPGA) + 1 GB DDR3 (HPS); VGA
    (ADV7123), WM8731 audio, ADV7180 TV decoder, PS/2, IR, LTC2308 ADC (AD7928 before rev. F), 2x 2x20 GPIO, 6x 7-seg,
    10 SW, 4 KEY, 10 LEDs; HPS Ethernet, USB OTG, micro SD
  url: https://www.terasic.com.tw/cgi-bin/page/archive.pl?Language=English&CategoryNo=165&No=836
  producer: terasic
  chip: 5CSEMA5F31C6N
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - accelerometer
  - adc_chip
  - audio_codec
  - ddr3_memory
  - dip_switches
  - ethernet_phy_gigabit
  - microsd_socket
  - sdr_sdram
  - seven_segment_display
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  devices:
  - micron_mt41k128m16
  - winbond_w9825g6kh
  - wolfson_wm8731
  - adi_adv7123
  - microchip_ksz9031rnx
  - microsd_socket_generic
  - usb_blaster_ii_built_in
  - adi_adxl345
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - seven_seg_module_shared
  - ti_adc128s022
