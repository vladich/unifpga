# de1 pin map.


Board:
  id: de1
  name: DE1
  product: Altera DE1 Board
  summary: Cyclone II EP2C20F484C7 (18,752 LEs); 8 MB SDRAM, 512 KB SRAM, 4 MB flash; VGA (4-bit), WM8731 audio, RS-232,
    PS/2, SD, 2x 2x20 GPIO, 4x 7-seg, 10 SW, 4 KEY, 18 LEDs
  url: https://www.terasic.com.tw/cgi-bin/page/archive.pl?Language=English&CategoryNo=53&No=83
  producer: terasic
  chip: EP2C20F484C7
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - audio_codec
  - dip_switches
  - sdr_sdram
  - seven_segment_display
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  - ps2_port
  - sram
  - nor_flash
  - sd_card_socket
  devices:
  - hynix_hy57v641620
  - wolfson_wm8731
  - adi_adv7123
  - usb_blaster_ii_built_in
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - seven_seg_module_shared
  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  banks:
    clk50mhz: { pins: L1, frequency_mhz: 50 }
    onboard_uart:
      pins:
        tx: G12
        rx: F14
    onboard_buttons:
      active: low
      pins: [R22, R21, T22, T21]
    onboard_leds:
      pins: [R20, R19, U19, Y19, T18, V19, Y18, U18, R18, R17]
    onboard_leds_green:
      pins: [U22, U21, V22, V21, W22, W21, Y22, Y21]
    onboard_switches:
      pins: [L22, L21, M22, V12, W12, U12, U11, M2, M1, L2]
    onboard_7seg:
      pins:
        hex0: [J2, J1, H2, H1, F2, F1, E2]
        hex1: [E1, H6, H5, H4, G3, D2, D1]
        hex2: [G5, G6, C2, C1, E3, E4, D3]
        hex3: [F4, D5, D6, J4, L8, F3, D4]
    onboard_vga:
      pins:
        hs: A11
        vs: B11
        r: [D9, C9, A7, B7]
        g: [B8, C10, B9, A8]
        b: [A9, D11, A10, B10]
    onboard_audio_codec:
      pins:
        adc_lrck: A6
        adc_dat: B6
        dac_lrck: A5
        dac_dat: B5
        xck: B4
        bclk: A4
    onboard_i2c:
      pins:
        sclk: A3
        sdat: B3
    gpio_0:
      pins: [A13, B13, A14, B14, A15, B15, A16, B16, A17, B17, A18, B18, A19, B19, A20, B20, C21, C22, D21, D22, E21, E22, F21, F22, G21, G22, J21, J22, K21, K22, J19, J20, J18, K20, L19, L18]
    gpio_1:
      pins: [H12, H13, H14, G15, E14, E15, F15, G16, F12, F13, C14, D14, D15, D16, C17, C18, C19, C20, D19, D20, E20, F20, E19, E18, G20, G18, G17, H17, J15, H18, N22, N21, P15, N15, P17, P18]
    onboard_clk27mhz:   # CLOCK_27 (27 MHz)
      device: {"name": "CLOCK_27 (27 MHz)", "kind": "clock"}
      pins: {"CLOCK_27": "D12"}
    onboard_clk24mhz:   # CLOCK_24 (24 MHz, from USB-Blaster)
      device: {"name": "CLOCK_24 (24 MHz, from USB-Blaster)", "kind": "clock"}
      pins: {"CLOCK_24": "A12"}
    onboard_ext_clock:   # External clock input (SMA)
      device: {"name": "External clock input (SMA)", "kind": "clock"}
      pins: {"EXT_CLOCK": "M21"}
    onboard_ps2:   # PS/2 port
      device: {"name": "PS/2 port", "kind": "ps2"}
      pins: {"PS2_CLK": "H15", "PS2_DAT": "J14"}
    onboard_sdram:   # SDRAM (8 MB, 16-bit)
      device: {"name": "SDRAM (8 MB, 16-bit)", "kind": "sdram"}
      model_params: {col_bits: 8}
      pins: {"DRAM_ADDR": ["W4", "W5", "Y3", "Y4", "R6", "R5", "P6", "P5", "P3", "N4", "W3", "N6"], "DRAM_DQ": ["U1", "U2", "V1", "V2", "W1", "W2", "Y1", "Y2", "N1", "N2", "P1", "P2", "R1", "R2", "T1", "T2"], "DRAM_BA_": ["U3", "V4"], "DRAM_LDQM": "R7", "DRAM_UDQM": "M5", "DRAM_RAS_N": "T5", "DRAM_CAS_N": "T3", "DRAM_CKE": "N3", "DRAM_CLK": "U4", "DRAM_WE_N": "R8", "DRAM_CS_N": "T6"}
    onboard_sram:   # SRAM (512 KB, 16-bit)
      device: {"name": "SRAM (512 KB, 16-bit)", "kind": "sram"}
      pins: {"SRAM_ADDR": ["AA3", "AB3", "AA4", "AB4", "AA5", "AB10", "AA11", "AB11", "V11", "W11", "R11", "T11", "Y10", "U10", "R10", "T7", "Y6", "Y5"], "SRAM_DQ": ["AA6", "AB6", "AA7", "AB7", "AA8", "AB8", "AA9", "AB9", "Y9", "W9", "V9", "U9", "R9", "W8", "V8", "U8"], "SRAM_WE_N": "AA10", "SRAM_OE_N": "T8", "SRAM_UB_N": "W7", "SRAM_LB_N": "Y7", "SRAM_CE_N": "AB5"}
    onboard_flash:   # Flash memory (4 MB, 8-bit)
      device: {"name": "Flash memory (4 MB, 8-bit)", "kind": "flash"}
      pins: {"FL_ADDR": ["AB20", "AA14", "Y16", "R15", "T15", "U15", "V15", "W15", "R14", "Y13", "R12", "T12", "AB14", "AA13", "AB13", "AA12", "AB12", "AA20", "U14", "V14", "U13", "R13"], "FL_DQ": ["AB16", "AA16", "AB17", "AA17", "AB18", "AA18", "AB19", "AA19"], "FL_OE_N": "AA15", "FL_RST_N": "W14", "FL_WE_N": "Y14"}
    onboard_usb_blaster_jtag:   # USB-Blaster JTAG link to FPGA (Control Panel)
      device: {"name": "USB-Blaster JTAG link to FPGA (Control Panel)", "kind": "other"}
      pins: {"TDI": "E8", "TCS": "D8", "TCK": "C7", "TDO": "D7"}
    onboard_sdcard:   # SD card socket
      device: {"name": "SD card socket", "kind": "sdcard"}
      pins: {"SD_CLK": "V20", "SD_CMD": "Y20", "SD_DAT": "W20", "SD_DAT3": "U20"}
  # ---- drawn: headers and parts; ./unifpga layout draft de1 regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: gpio_0
      type: pin_row
      label: GPIO_0
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_0
      pins: {'[0]': 'gpio_0[0]', '[1]': 'gpio_0[1]', '[2]': 'gpio_0[2]', '[3]': 'gpio_0[3]', '[4]': 'gpio_0[4]', '[5]': 'gpio_0[5]', '[6]': 'gpio_0[6]', '[7]': 'gpio_0[7]', '[8]': 'gpio_0[8]', '[9]': 'gpio_0[9]', '[10]': 'gpio_0[10]', '[11]': 'gpio_0[11]', '[12]': 'gpio_0[12]', '[13]': 'gpio_0[13]', '[14]': 'gpio_0[14]', '[15]': 'gpio_0[15]', '[16]': 'gpio_0[16]', '[17]': 'gpio_0[17]', '[18]': 'gpio_0[18]', '[19]': 'gpio_0[19]', '[20]': 'gpio_0[20]', '[21]': 'gpio_0[21]', '[22]': 'gpio_0[22]', '[23]': 'gpio_0[23]', '[24]': 'gpio_0[24]', '[25]': 'gpio_0[25]', '[26]': 'gpio_0[26]', '[27]': 'gpio_0[27]', '[28]': 'gpio_0[28]', '[29]': 'gpio_0[29]', '[30]': 'gpio_0[30]', '[31]': 'gpio_0[31]', '[32]': 'gpio_0[32]', '[33]': 'gpio_0[33]', '[34]': 'gpio_0[34]', '[35]': 'gpio_0[35]'}
    - id: gpio_1
      type: pin_row
      label: GPIO_1
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_1
      pins: {'[0]': 'gpio_1[0]', '[1]': 'gpio_1[1]', '[2]': 'gpio_1[2]', '[3]': 'gpio_1[3]', '[4]': 'gpio_1[4]', '[5]': 'gpio_1[5]', '[6]': 'gpio_1[6]', '[7]': 'gpio_1[7]', '[8]': 'gpio_1[8]', '[9]': 'gpio_1[9]', '[10]': 'gpio_1[10]', '[11]': 'gpio_1[11]', '[12]': 'gpio_1[12]', '[13]': 'gpio_1[13]', '[14]': 'gpio_1[14]', '[15]': 'gpio_1[15]', '[16]': 'gpio_1[16]', '[17]': 'gpio_1[17]', '[18]': 'gpio_1[18]', '[19]': 'gpio_1[19]', '[20]': 'gpio_1[20]', '[21]': 'gpio_1[21]', '[22]': 'gpio_1[22]', '[23]': 'gpio_1[23]', '[24]': 'gpio_1[24]', '[25]': 'gpio_1[25]', '[26]': 'gpio_1[26]', '[27]': 'gpio_1[27]', '[28]': 'gpio_1[28]', '[29]': 'gpio_1[29]', '[30]': 'gpio_1[30]', '[31]': 'gpio_1[31]', '[32]': 'gpio_1[32]', '[33]': 'gpio_1[33]', '[34]': 'gpio_1[34]', '[35]': 'gpio_1[35]'}
  parts:
    - id: clk50mhz
      label: clk50mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk50mhz}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds_green
      label: leds green
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds_green}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 10}, bind: {sw: onboard_switches}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_per_digit, params: {digits: 4, segs: 7}, bind: {hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3]}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: audio_codec
      label: audio codec
      attach: {peripheral: wm8731_i2s_out, bind: {xck: onboard_audio_codec.xck, bclk: onboard_audio_codec.bclk, dac_lrck: onboard_audio_codec.dac_lrck, dac_dat: onboard_audio_codec.dac_dat, i2c_sclk: onboard_i2c.sclk, i2c_sdat: onboard_i2c.sdat}}
    - id: ps2
      label: PS/2 port
      attach: {peripheral: ps2_keyboard, bind: {clk: onboard_ps2.PS2_CLK, data: onboard_ps2.PS2_DAT}}
    - id: sdram
      label: SDRAM (8 MB, 16-bit)
      attach: {peripheral: sdram_sdr, params: {row_bits: 12, data_bits: 16, col_bits: 8}, bind: {clk: onboard_sdram.DRAM_CLK, cke: onboard_sdram.DRAM_CKE, cs_n: onboard_sdram.DRAM_CS_N, ras_n: onboard_sdram.DRAM_RAS_N, cas_n: onboard_sdram.DRAM_CAS_N, we_n: onboard_sdram.DRAM_WE_N, ba: onboard_sdram.DRAM_BA_, a: onboard_sdram.DRAM_ADDR, dq: onboard_sdram.DRAM_DQ, dqm: [onboard_sdram.DRAM_LDQM, onboard_sdram.DRAM_UDQM]}}
    - id: clk27mhz
      label: CLOCK_27 (27 MHz)
      device: {kind: clock, bank: onboard_clk27mhz}   # no peripheral model yet
    - id: clk24mhz
      label: CLOCK_24 (24 MHz, from USB-Blaster)
      device: {kind: clock, bank: onboard_clk24mhz}   # no peripheral model yet
    - id: ext_clock
      label: External clock input (SMA)
      device: {kind: clock, bank: onboard_ext_clock}   # no peripheral model yet
    - id: sram
      label: SRAM (512 KB, 16-bit)
      attach: {peripheral: async_sram, params: {addr_bits: 18}, bind: {a: onboard_sram.SRAM_ADDR, d: onboard_sram.SRAM_DQ, ce_n: onboard_sram.SRAM_CE_N, oe_n: onboard_sram.SRAM_OE_N, we_n: onboard_sram.SRAM_WE_N, lb_n: onboard_sram.SRAM_LB_N, ub_n: onboard_sram.SRAM_UB_N}}
    - id: flash
      label: Flash memory (4 MB, 8-bit)
      device: {kind: flash, bank: onboard_flash}   # no peripheral model yet
    - id: usb_blaster_jtag
      label: USB-Blaster JTAG link to FPGA (Control Panel)
      device: {kind: other, bank: onboard_usb_blaster_jtag}   # no peripheral model yet
    - id: sdcard
      label: SD card socket
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_sdcard.SD_CLK, cmd: onboard_sdcard.SD_CMD, dat0: onboard_sdcard.SD_DAT, dat3: onboard_sdcard.SD_DAT3}}
