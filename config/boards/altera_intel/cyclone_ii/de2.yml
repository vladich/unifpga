# de2 pin map.


Board:
  id: de2
  name: DE2
  product: Altera DE2 Board
  summary: Cyclone II EP2C35F672C6 (33,216 LEs); 8 MB SDRAM, 512 KB SRAM, 4 MB flash; VGA (ADV7123 10-bit), WM8731
    audio, ADV7180 TV decoder (as the manual names it), DM9000A Ethernet, ISP1362 USB, IrDA, RS-232, PS/2, SD, 16x2
    LCD, 2x 2x20 GPIO, 8x 7-seg, 18 SW, 4 KEY, 27 LEDs
  url: https://www.terasic.com.tw/cgi-bin/page/archive.pl?Language=English&CategoryNo=53&No=30
  producer: terasic
  chip: EP2C35F672C6
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - audio_codec
  - dip_switches
  - sdr_sdram
  - seven_segment_display
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  - vga_output
  - character_lcd
  - ps2_port
  - ethernet_phy_10_100
  - analog_video_decoder
  - irda_transceiver
  - sram
  - nor_flash
  - sd_card_socket
  devices:
  - hynix_hy57v641620
  - wolfson_wm8731
  - adi_adv7123
  - usb_blaster_ii_built_in
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - seven_seg_module_shared
  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  banks:
    clk50mhz: { pins: N2, frequency_mhz: 50 }
    onboard_uart:
      pins:
        tx: B25
        rx: C25
    onboard_buttons:
      active: low
      pins: [G26, N23, P23, W26]
    onboard_leds:
      pins: [AE23, AF23, AB21, AC22, AD22, AD23, AD21, AC21, AA14, Y13, AA13, AC14, AD15, AE15, AF13, AE13, AE12, AD12]
    onboard_leds_green:
      pins: [AE22, AF22, W19, V18, U18, U17, AA20, Y18, Y12]
    onboard_switches:
      pins: [N25, N26, P25, AE14, AF14, AD13, AC13, C13, B13, A13, N1, P1, P2, T7, U3, U4, V1, V2]
    onboard_7seg:
      pins:
        hex0: [AF10, AB12, AC12, AD11, AE11, V14, V13]
        hex1: [V20, V21, W21, Y22, AA24, AA23, AB24]
        hex2: [AB23, V22, AC25, AC26, AB26, AB25, Y24]
        hex3: [Y23, AA25, AA26, Y26, Y25, U22, W24]
        hex4: [U9, U1, U2, T4, R7, R6, T3]
        hex5: [T2, P6, P7, T9, R5, R4, R3]
        hex6: [R2, P4, P3, M2, M3, M5, M4]
        hex7: [L3, L2, L9, L6, L7, P9, N9]
    onboard_vga:
      pins:
        clk: B8
        blank: D6
        sync: B7
        hs: A7
        vs: D8
        r: [C8, F10, G10, D9, C9, A8, H11, H12, F11, E10]
        g: [B9, A9, C10, D10, B10, A10, G11, D11, E12, D12]
        b: [J13, J14, F12, G12, J10, J11, C11, B11, C12, B12]
    onboard_audio_codec:
      pins:
        adc_lrck: C5
        adc_dat: B5
        bclk: B4
        dac_lrck: C6
        dac_dat: A4
        xck: A5
    onboard_i2c:
      pins:
        sclk: A6
        sdat: B6
    gpio_0:
      pins: [D25, J22, E26, E25, F24, F23, J21, J20, F25, F26, N18, P18, G23, G24, K22, G25, H23, H24, J23, J24, H25, H26, H19, K18, K19, K21, K23, K24, L21, L20, J25, J26, L23, L24, L25, L19]
    gpio_1:
      pins: [K25, K26, M22, M23, M19, M20, N20, M21, M24, M25, N24, P24, R25, R24, R20, T22, T23, T24, T25, T18, T21, T20, U26, U25, U23, U24, R19, T19, U20, U21, V26, V25, V24, V23, W25, W23]
    onboard_clk27mhz:   # CLOCK_27 (27 MHz)
      device: {"name": "CLOCK_27 (27 MHz)", "kind": "clock"}
      pins: {"CLOCK_27": "D13"}
    onboard_ext_clock:   # External clock input (SMA)
      device: {"name": "External clock input (SMA)", "kind": "clock"}
      pins: {"EXT_CLOCK": "P26"}
    onboard_lcd:   # Character LCD module (16x2)
      device: {"name": "Character LCD module (16x2)", "kind": "lcd_char"}
      pins: {"LCD_DATA": ["J1", "J2", "H1", "H2", "J4", "J3", "H4", "H3"], "LCD_RW": "K4", "LCD_EN": "K3", "LCD_RS": "K1", "LCD_ON": "L4", "LCD_BLON": "K2"}
    onboard_ps2:   # PS/2 port
      device: {"name": "PS/2 port", "kind": "ps2"}
      pins: {"PS2_CLK": "D26", "PS2_DAT": "C24"}
    onboard_ethernet:   # Fast Ethernet (DM9000A)
      device: {"name": "Fast Ethernet (DM9000A)", "kind": "ethernet"}
      pins: {"ENET_DATA": ["D17", "C17", "B18", "A18", "B17", "A17", "B16", "B15", "B20", "A20", "C19", "D19", "B19", "A19", "E18", "D18"], "ENET_CLK": "B24", "ENET_CMD": "A21", "ENET_CS_N": "A23", "ENET_INT": "B21", "ENET_RD_N": "A22", "ENET_WR_N": "B22", "ENET_RST_N": "B23"}
    onboard_tv_decoder:   # TV decoder (ADV7180 per manual)
      device: {"name": "TV decoder (ADV7180 per manual)", "kind": "video_decoder"}
      pins: {"TD_DATA": ["J9", "E8", "H8", "H10", "G9", "F9", "D7", "C7"], "TD_HS": "D5", "TD_VS": "K9", "TD_CLK27": "C16", "TD_RESET": "C4"}
    onboard_usb:   # USB host/device (ISP1362)
      device: {"name": "USB host/device (ISP1362)", "kind": "usb"}
      pins: {"OTG_ADDR": ["K7", "F2"], "OTG_DATA": ["F4", "D2", "D1", "F7", "J5", "J8", "J7", "H6", "E2", "E1", "K6", "K5", "G4", "G3", "J6", "K8"], "OTG_CS_N": "F1", "OTG_RD_N": "G2", "OTG_WR_N": "G1", "OTG_RST_N": "G5", "OTG_INT": ["B3", "C3"], "OTG_DACK0_N": "C2", "OTG_DACK1_N": "B2", "OTG_DREQ": ["F6", "E5"], "OTG_FSPEED": "F3", "OTG_LSPEED": "G6"}
    onboard_irda:   # IrDA transceiver
      device: {"name": "IrDA transceiver", "kind": "irda"}
      pins: {"IRDA_TXD": "AE24", "IRDA_RXD": "AE25"}
    onboard_sdram:   # SDRAM (8 MB, 16-bit)
      device: {"name": "SDRAM (8 MB, 16-bit)", "kind": "sdram"}
      model_params: {col_bits: 8}
      pins: {"DRAM_ADDR": ["T6", "V4", "V3", "W2", "W1", "U6", "U7", "U5", "W4", "W3", "Y1", "V5"], "DRAM_DQ": ["V6", "AA2", "AA1", "Y3", "Y4", "R8", "T8", "V7", "W6", "AB2", "AB1", "AA4", "AA3", "AC2", "AC1", "AA5"], "DRAM_BA_": ["AE2", "AE3"], "DRAM_LDQM": "AD2", "DRAM_UDQM": "Y5", "DRAM_RAS_N": "AB4", "DRAM_CAS_N": "AB3", "DRAM_CKE": "AA6", "DRAM_CLK": "AA7", "DRAM_WE_N": "AD3", "DRAM_CS_N": "AC3"}
    onboard_sram:   # SRAM (512 KB, 16-bit)
      device: {"name": "SRAM (512 KB, 16-bit)", "kind": "sram"}
      pins: {"SRAM_ADDR": ["AE4", "AF4", "AC5", "AC6", "AD4", "AD5", "AE5", "AF5", "AD6", "AD7", "V10", "V9", "AC7", "W8", "W10", "Y10", "AB8", "AC8"], "SRAM_DQ": ["AD8", "AE6", "AF6", "AA9", "AA10", "AB10", "AA11", "Y11", "AE7", "AF7", "AE8", "AF8", "W11", "W12", "AC9", "AC10"], "SRAM_WE_N": "AE10", "SRAM_OE_N": "AD10", "SRAM_UB_N": "AF9", "SRAM_LB_N": "AE9", "SRAM_CE_N": "AC11"}
    onboard_flash:   # Flash memory (4 MB, 8-bit)
      device: {"name": "Flash memory (4 MB, 8-bit)", "kind": "flash"}
      pins: {"FL_ADDR": ["AC18", "AB18", "AE19", "AF19", "AE18", "AF18", "Y16", "AA16", "AD17", "AC17", "AE17", "AF17", "W16", "W15", "AC16", "AD16", "AE16", "AC15", "AB15", "AA15", "Y15", "Y14"], "FL_DQ": ["AD19", "AC19", "AF20", "AE20", "AB20", "AC20", "AF21", "AE21"], "FL_CE_N": "V17", "FL_OE_N": "W17", "FL_RST_N": "AA18", "FL_WE_N": "AA17"}
    onboard_usb_blaster_jtag:   # USB-Blaster JTAG link to FPGA (Control Panel)
      device: {"name": "USB-Blaster JTAG link to FPGA (Control Panel)", "kind": "other"}
      pins: {"TDI": "B14", "TCS": "A14", "TCK": "D14", "TDO": "F14"}
    onboard_sdcard:   # SD card socket
      device: {"name": "SD card socket", "kind": "sdcard"}
      pins: {"SD_DAT": "AD24", "SD_DAT3": "AC23", "SD_CMD": "Y21", "SD_CLK": "AD25"}
  # ---- drawn: headers and parts; ./unifpga layout draft de2 regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: gpio_0
      type: pin_row
      label: GPIO_0
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_0
      pins: {'[0]': 'gpio_0[0]', '[1]': 'gpio_0[1]', '[2]': 'gpio_0[2]', '[3]': 'gpio_0[3]', '[4]': 'gpio_0[4]', '[5]': 'gpio_0[5]', '[6]': 'gpio_0[6]', '[7]': 'gpio_0[7]', '[8]': 'gpio_0[8]', '[9]': 'gpio_0[9]', '[10]': 'gpio_0[10]', '[11]': 'gpio_0[11]', '[12]': 'gpio_0[12]', '[13]': 'gpio_0[13]', '[14]': 'gpio_0[14]', '[15]': 'gpio_0[15]', '[16]': 'gpio_0[16]', '[17]': 'gpio_0[17]', '[18]': 'gpio_0[18]', '[19]': 'gpio_0[19]', '[20]': 'gpio_0[20]', '[21]': 'gpio_0[21]', '[22]': 'gpio_0[22]', '[23]': 'gpio_0[23]', '[24]': 'gpio_0[24]', '[25]': 'gpio_0[25]', '[26]': 'gpio_0[26]', '[27]': 'gpio_0[27]', '[28]': 'gpio_0[28]', '[29]': 'gpio_0[29]', '[30]': 'gpio_0[30]', '[31]': 'gpio_0[31]', '[32]': 'gpio_0[32]', '[33]': 'gpio_0[33]', '[34]': 'gpio_0[34]', '[35]': 'gpio_0[35]'}
    - id: gpio_1
      type: pin_row
      label: GPIO_1
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio_1
      pins: {'[0]': 'gpio_1[0]', '[1]': 'gpio_1[1]', '[2]': 'gpio_1[2]', '[3]': 'gpio_1[3]', '[4]': 'gpio_1[4]', '[5]': 'gpio_1[5]', '[6]': 'gpio_1[6]', '[7]': 'gpio_1[7]', '[8]': 'gpio_1[8]', '[9]': 'gpio_1[9]', '[10]': 'gpio_1[10]', '[11]': 'gpio_1[11]', '[12]': 'gpio_1[12]', '[13]': 'gpio_1[13]', '[14]': 'gpio_1[14]', '[15]': 'gpio_1[15]', '[16]': 'gpio_1[16]', '[17]': 'gpio_1[17]', '[18]': 'gpio_1[18]', '[19]': 'gpio_1[19]', '[20]': 'gpio_1[20]', '[21]': 'gpio_1[21]', '[22]': 'gpio_1[22]', '[23]': 'gpio_1[23]', '[24]': 'gpio_1[24]', '[25]': 'gpio_1[25]', '[26]': 'gpio_1[26]', '[27]': 'gpio_1[27]', '[28]': 'gpio_1[28]', '[29]': 'gpio_1[29]', '[30]': 'gpio_1[30]', '[31]': 'gpio_1[31]', '[32]': 'gpio_1[32]', '[33]': 'gpio_1[33]', '[34]': 'gpio_1[34]', '[35]': 'gpio_1[35]'}
  parts:
    - id: clk50mhz
      label: clk50mhz
      attach: {peripheral: clock_input, params: {frequency_mhz: 50}, bind: {clk: clk50mhz}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: leds_green
      label: leds green
      attach: {peripheral: led_bank, params: {width: 9}, bind: {led: onboard_leds_green}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 18}, bind: {led: onboard_leds}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 18}, bind: {sw: onboard_switches}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_per_digit, params: {digits: 8, segs: 7}, bind: {hex: [onboard_7seg.hex0, onboard_7seg.hex1, onboard_7seg.hex2, onboard_7seg.hex3, onboard_7seg.hex4, onboard_7seg.hex5, onboard_7seg.hex6, onboard_7seg.hex7]}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 10, bits_g: 10, bits_b: 10, pin_bits_r: 10, pin_bits_g: 10, pin_bits_b: 10, color_depth: 444, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs, clk: onboard_vga.clk, blank_n: onboard_vga.blank}}
    - id: audio_codec
      label: audio codec
      attach: {peripheral: wm8731_i2s_out, bind: {xck: onboard_audio_codec.xck, bclk: onboard_audio_codec.bclk, dac_lrck: onboard_audio_codec.dac_lrck, dac_dat: onboard_audio_codec.dac_dat, i2c_sclk: onboard_i2c.sclk, i2c_sdat: onboard_i2c.sdat}}
    - id: lcd
      label: Character LCD module (16x2)
      attach: {peripheral: hd44780_lcd, bind: {rs: onboard_lcd.LCD_RS, e: onboard_lcd.LCD_EN, d: ['onboard_lcd.LCD_DATA[4]', 'onboard_lcd.LCD_DATA[5]', 'onboard_lcd.LCD_DATA[6]', 'onboard_lcd.LCD_DATA[7]'], rw: onboard_lcd.LCD_RW}}
    - id: ps2
      label: PS/2 port
      attach: {peripheral: ps2_keyboard, bind: {clk: onboard_ps2.PS2_CLK, data: onboard_ps2.PS2_DAT}}
    - id: sdram
      label: SDRAM (8 MB, 16-bit)
      attach: {peripheral: sdram_sdr, params: {row_bits: 12, data_bits: 16, col_bits: 8}, bind: {clk: onboard_sdram.DRAM_CLK, cke: onboard_sdram.DRAM_CKE, cs_n: onboard_sdram.DRAM_CS_N, ras_n: onboard_sdram.DRAM_RAS_N, cas_n: onboard_sdram.DRAM_CAS_N, we_n: onboard_sdram.DRAM_WE_N, ba: onboard_sdram.DRAM_BA_, a: onboard_sdram.DRAM_ADDR, dq: onboard_sdram.DRAM_DQ, dqm: [onboard_sdram.DRAM_LDQM, onboard_sdram.DRAM_UDQM]}}
    - id: clk27mhz
      label: CLOCK_27 (27 MHz)
      device: {kind: clock, bank: onboard_clk27mhz}   # no peripheral model yet
    - id: ext_clock
      label: External clock input (SMA)
      device: {kind: clock, bank: onboard_ext_clock}   # no peripheral model yet
    - id: ethernet
      label: Fast Ethernet (DM9000A)
      device: {kind: ethernet, bank: onboard_ethernet}   # no peripheral model yet
    - id: tv_decoder
      label: TV decoder (ADV7180 per manual)
      device: {kind: video_decoder, bank: onboard_tv_decoder}   # no peripheral model yet
    - id: usb
      label: USB host/device (ISP1362)
      device: {kind: usb, bank: onboard_usb}   # no peripheral model yet
    - id: irda
      label: IrDA transceiver
      device: {kind: irda, bank: onboard_irda}   # no peripheral model yet
    - id: sram
      label: SRAM (512 KB, 16-bit)
      attach: {peripheral: async_sram, params: {addr_bits: 18}, bind: {a: onboard_sram.SRAM_ADDR, d: onboard_sram.SRAM_DQ, ce_n: onboard_sram.SRAM_CE_N, oe_n: onboard_sram.SRAM_OE_N, we_n: onboard_sram.SRAM_WE_N, lb_n: onboard_sram.SRAM_LB_N, ub_n: onboard_sram.SRAM_UB_N}}
    - id: flash
      label: Flash memory (4 MB, 8-bit)
      device: {kind: flash, bank: onboard_flash}   # no peripheral model yet
    - id: usb_blaster_jtag
      label: USB-Blaster JTAG link to FPGA (Control Panel)
      device: {kind: other, bank: onboard_usb_blaster_jtag}   # no peripheral model yet
    - id: sdcard
      label: SD card socket
      attach: {peripheral: sdcard_spi, bind: {clk: onboard_sdcard.SD_CLK, cmd: onboard_sdcard.SD_CMD, dat0: onboard_sdcard.SD_DAT, dat3: onboard_sdcard.SD_DAT3}}
