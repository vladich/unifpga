# de2 pin map.

Board:
  id: de2
  fpga:
    producer: "Altera (Intel)"
    family: "Cyclone II"
    part: EP2C35F672C6

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  pinBanks:
    clk50mhz: { pins: N2, frequency_mhz: 50 }
    onboard_uart:
      pins:
        tx: B25
        rx: C25
    onboard_buttons:
      active: low
      pins: [G26, N23, P23, W26]
    onboard_leds:
      pins: [AE23, AF23, AB21, AC22, AD22, AD23, AD21, AC21, AA14, Y13, AA13, AC14, AD15, AE15, AF13, AE13, AE12, AD12]
    onboard_leds_green:
      pins: [AE22, AF22, W19, V18, U18, U17, AA20, Y18, Y12]
    onboard_switches:
      pins: [N25, N26, P25, AE14, AF14, AD13, AC13, C13, B13, A13, N1, P1, P2, T7, U3, U4, V1, V2]
    onboard_7seg:
      pins:
        hex0: [AF10, AB12, AC12, AD11, AE11, V14, V13]
        hex1: [V20, V21, W21, Y22, AA24, AA23, AB24]
        hex2: [AB23, V22, AC25, AC26, AB26, AB25, Y24]
        hex3: [Y23, AA25, AA26, Y26, Y25, U22, W24]
        hex4: [U9, U1, U2, T4, R7, R6, T3]
        hex5: [T2, P6, P7, T9, R5, R4, R3]
        hex6: [R2, P4, P3, M2, M3, M5, M4]
        hex7: [L3, L2, L9, L6, L7, P9, N9]
    onboard_vga:
      pins:
        clk: B8
        blank: D6
        sync: B7
        hs: A7
        vs: D8
        r: [C8, F10, G10, D9, C9, A8, H11, H12, F11, E10]
        g: [B9, A9, C10, D10, B10, A10, G11, D11, E12, D12]
        b: [J13, J14, F12, G12, J10, J11, C11, B11, C12, B12]
