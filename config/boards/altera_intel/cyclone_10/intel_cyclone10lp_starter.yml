# intel_cyclone10lp_starter: Cyclone 10 LP FPGA Starter Kit.

Board:
  id: intel_cyclone10lp_starter
  name: Cyclone 10 LP FPGA Starter Kit
  status: eol
  producer: intel_altera
  chip: 10CL025YU256C8G
  bridges:
  - usb-jtag
  programmer: quartus_pgm
  features:
  - arduino_shield_header
  - ddr3_memory
  - dip_switches
  - seven_segment_display
  - usb_jtag_bridge
  - usb_powered
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt41k256m16
  - usb_blaster_ii_built_in
  - silabs_cp2102
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - seven_seg_module_shared
