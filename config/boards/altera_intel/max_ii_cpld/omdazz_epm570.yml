# omdazz_epm570 pin map.

Board:
  id: omdazz_epm570
  fpga:
    producer: "Altera (Intel)"
    family: "MAX II CPLD"
    part: EPM570T100C5

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS \"AS INPUT TRI-STATED\""
  pinBanks:
    clk: { pins: "12", frequency_mhz: 50 }
    cpu_resetn: { pins: "41", active: low }
    onboard_leds:
      active: low
      index_origin: 1
      pins: ["67", "66", "61", "58", "57", "56", "55", "54"]
    onboard_buttons:              # KEY[6:1] (key = ~ KEY): KEY[1] first
      active: low
      index_origin: 1
      pins: ["49", "48", "47", "44", "43", "42"]
    onboard_switches:             # CKEY[4:1] (sw = ~ CKEY): four more keys used as switches
      active: low
      index_origin: 1
      pins: ["53", "52", "51", "50"]
    onboard_7seg:
      pins:
        anodes: ["87", "86", "85", "84", "95", "92", "91", "89"]
        segments: ["76", "83", "81", "75", "74", "78", "82", "77"]
    onboard_uart:
      pins:
        rx: "68"
        tx: "69"
    onboard_char_lcd:
      index_origin: {d: 1}
      pins:
        d: ["6", "5", "4", "3", "2", "1", "100", "99", "98", "97", "96"]
    onboard_vga:
      pins:
        hs: "7"
        vs: "8"
        b: "15"
        r: "17"
        g: "16"
    onboard_buzzer:   # Buzzer
      device: {"name": "Buzzer", "kind": "buzzer"}
      pins: {"beep": "73"}
