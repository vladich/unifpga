# terasic_de25_nano pin map.
# Source: Terasic user manual PDF
#   ~/Terasic/DE25-Nano_User_manual_revB.pdf


Board:
  id: terasic_de25_nano
  name: DE25-Nano Development and Education Board
  url: https://www.terasic.com.tw/cgi-bin/page/archive.pl?Language=English&No=1384
  status: active
  producer: terasic
  chip: A5EB013BB23BE4SCS
  bridges:
  - usb-jtag
  programmer: quartus_pgm
  features:
  - ddr4_memory
  - ethernet_phy_gigabit
  - hdmi_output
  - lpddr4_memory
  - microsd_socket
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  devices:
  - ddr4_sodimm_socket
  - microchip_ksz9031rnx
  - microsd_socket_generic
  - usb_blaster_ii_built_in
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    sys_clk:
      pins: PIN_N72
    cpu_resetn:
      pins: PIN_DN55
    onboard_buttons:
      pins: [PIN_C8, PIN_C11]
    onboard_switches:
      pins: [PIN_DK24, PIN_DD24, PIN_DD27, PIN_DF27]
    onboard_leds:
      pins: [PIN_DF35, PIN_DJ32, PIN_DN22, PIN_DP23, PIN_DN25, PIN_DP25, PIN_DJ27, PIN_DP30]
    hdmi_clk:
      pins: PIN_DJ24
    hdmi_data_p:
      pins: [PIN_AV19, PIN_AT11, PIN_BE11, PIN_AV14, PIN_AT19, PIN_AT14, PIN_AV16, PIN_AV11, PIN_BH11, PIN_BE14, PIN_BE19, PIN_BH14, PIN_BV6, PIN_BJ23, PIN_BV4, PIN_BU23, PIN_BH16, PIN_DA1, PIN_BH19, PIN_CP2, PIN_CM1, PIN_DA2, PIN_CP1, PIN_CU2]
