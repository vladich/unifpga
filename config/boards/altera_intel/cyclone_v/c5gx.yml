# c5gx pin map.


Board:
  id: c5gx
  name: Cyclone V GX Starter Kit
  product: Cyclone V GX Starter Kit (C5G)
  summary: Cyclone V GX 5CGXFC5C6F27C7N (77K LEs, transceivers on HSMC); 512 MB LPDDR2 + 4 Mb (512 KB) SRAM; HDMI
    TX, audio CODEC, SD, UART-USB, HSMC, 2x20 GPIO, Arduino header, LTC2308 ADC, 4x 7-seg, 10 SW, 4 KEY, 18 LEDs
  aliases:
  - intel_cyclonev_gx_starter
  producer: terasic
  chip: 5CGXFC5C6F27C7N
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - audio_codec
  - ddr3_memory
  - dip_switches
  - microsd_socket
  - qspi_flash
  - seven_segment_display
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  - vga_output
  - sram
  - adc_chip
  devices:
  - wolfson_wm8731
  - adi_adv7123
  - micron_mt41k128m16
  - micron_n25q128a
  - microsd_socket_generic
  - usb_blaster_ii_built_in
  - ftdi_ft232r
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - seven_seg_module_shared
