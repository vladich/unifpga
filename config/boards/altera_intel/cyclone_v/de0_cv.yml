# de0_cv pin map.

Board:
  id: de0_cv
  fpga:
    producer: "Altera (Intel)"
    family: "Cyclone V"
    part: 5CEBA4F23C7N
  defaults:
    iostandard: 3.3-V LVTTL

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  pinBanks:
    clk50mhz: { pins: M9, frequency_mhz: 50 }
    onboard_buttons:
      active: low
      pins: [U7, W9, M7, M6]
    cpu_resetn: { pins: P22, active: low }
    onboard_switches:
      pins: [U13, V13, T13, T12, AA15, AB15, AA14, AA13, AB13, AB12]
    onboard_leds:
      pins: [AA2, AA1, W2, Y3, N2, N1, U2, U1, L2, L1]
    onboard_7seg:
      pins:
        hex0: [U21, V21, W22, W21, Y22, Y21, AA22]
        hex1: [AA20, AB20, AA19, AA18, AB18, AA17, U22]
        hex2: [Y19, AB17, AA10, Y14, V14, AB22, AB21]
        hex3: [Y16, W16, Y17, V16, U17, V18, V19]
        hex4: [U20, Y20, V20, U16, U15, Y15, P9]
        hex5: [N9, M8, T14, P14, C1, C2, W19]
    onboard_vga:
      pins:
        hs: H8
        vs: G8
        b: [B6, B7, A8, A7]
        g: [L7, K7, J7, J8]
        r: [A9, B10, C9, A5]
    gpio_0:
      pins: [N16, B16, M16, C16, D17, K20, K21, K22, M20, M21, N21, R22, R21, T22, N20, N19, M22, P19, L22, P17, P16, M18, L18, L17, L19, K17, K19, P18, R15, R17, R16, T20, T19, T18, T17, T15]
    gpio_1:
      pins: [H16, A12, H15, B12, A13, B13, C13, D13, G18, G17, H18, J18, J19, G11, H10, J11, H14, A15, J13, L8, A14, B15, C15, E14, E15, E16, F14, F15, F13, F12, G16, G15, G13, G12, J17, K16]
    onboard_clk2_50mhz:   # CLOCK2_50 (50 MHz)
      device: {"name": "CLOCK2_50 (50 MHz)", "kind": "clock"}
      pins: {"CLOCK2_50": "H13"}
    onboard_clk3_50mhz:   # CLOCK3_50 (50 MHz)
      device: {"name": "CLOCK3_50 (50 MHz)", "kind": "clock"}
      pins: {"CLOCK3_50": "E10"}
    onboard_clk4_50mhz:   # CLOCK4_50 (50 MHz)
      device: {"name": "CLOCK4_50 (50 MHz)", "kind": "clock"}
      pins: {"CLOCK4_50": "V15"}
    onboard_ps2:   # PS/2 port (primary)
      device: {"name": "PS/2 port (primary)", "kind": "ps2"}
      pins: {"PS2_CLK": "D3", "PS2_DAT": "G2"}
    onboard_ps2_secondary:   # PS/2 port (secondary, via Y-cable)
      device: {"name": "PS/2 port (secondary, via Y-cable)", "kind": "ps2"}
      pins: {"PS2_CLK2": "E2", "PS2_DAT2": "G1"}
    onboard_sdcard:   # Micro SD card socket
      device: {"name": "Micro SD card socket", "kind": "sdcard"}
      pins: {"SD_CLK": "H11", "SD_CMD": "B11", "SD_DATA": ["K9", "D12", "E12", "C11"]}
    onboard_sdram:   # SDRAM (64 MB, 16-bit)
      device: {"name": "SDRAM (64 MB, 16-bit)", "kind": "sdram"}
      model_params: {col_bits: 10}
      pins: {"DRAM_ADDR": ["W8", "T8", "U11", "Y10", "N6", "AB10", "P12", "P7", "P8", "R5", "U8", "P6", "R7"], "DRAM_DQ": ["Y9", "T10", "R9", "Y11", "R10", "R11", "R12", "AA12", "AA9", "AB8", "AA8", "AA7", "V10", "V9", "U10", "T9"], "DRAM_BA": ["T7", "AB7"], "DRAM_LDQM": "U12", "DRAM_UDQM": "N8", "DRAM_RAS_N": "AB6", "DRAM_CAS_N": "V6", "DRAM_CKE": "R6", "DRAM_CLK": "AB11", "DRAM_WE_N": "AB5", "DRAM_CS_N": "U6"}
