# pangomicro_pangu_eu22k_devkit: PGL22G Development Board (Pangu EU-22K).

Board:
  id: pangomicro_pangu_eu22k_devkit
  name: PGL22G Development Board (Pangu EU-22K)
  url: https://www.pangomicro.com/open/4260.html
  status: active
  producer: pangomicro
  chip: PGL22G-MBG324
  bridges:
  - usb-jtag
  programmer: pango_pgm
  features:
  - ddr3_memory
  - ethernet_phy_gigabit
  - hdmi_input
  - hdmi_output
  - usb_uart_bridge
  - usb_jtag_bridge
  - microsd_socket
  - pmod_connector
  - user_leds
  - user_buttons
  - dip_switches
  - seven_segment_display
  - gpio_header_generic
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
