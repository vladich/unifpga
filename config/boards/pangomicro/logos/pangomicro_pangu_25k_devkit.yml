Board:
  id: pangomicro_pangu_25k_devkit
  name: Pangu 25K Development Board (DFPGL25G_DevKit, 盘古25K核心板)
  url: https://www.pangomicro.com/open/4264.html
  status: active
  notes: 'Manual: DFPGL25G_DevKit--UserManual.CHINESE-v1.0.pdf at chili-chips-ba/tango-with-pango.'
  producer: pangomicro
  chip: PGL25G2-6CMBG324
  bridges:
  - usb-jtag
  programmer: pango_pgm
  features:
  - ddr3_memory
  - usb_uart_bridge
  - usb_jtag_bridge
  - ethernet_phy_gigabit
  - microsd_socket
  - rs485_transceiver
  - user_leds
  - user_buttons
  - dip_switches
  - seven_segment_display
  - parallel_lcd
  - eeprom_chip
  - spi_flash
  - gpio_header_generic
  devices:
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  banks:
    clk:
      pins: V9
      frequency_mhz: 50
    onboard_leds:
      pins:
      - M14
      - L14
      - P15
      - P16
    onboard_buttons:
      pins:
      - N5
      - P6
      - R7
      - T7
    onboard_reset:
      pins: C4
    onboard_uart:
      pins:
        tx: C1
        rx: C2
    microsd:
      pins:
        clk: N10
        cs: N9
        mosi: P11
        miso: M8
    spi_flash:
      pins:
        clk: R15
        cs: V3
        mosi: T13
        miso: R13
    ethernet_mdio:
      pins:
        mdio: B9
        mdc: A9
        rst_n: B6
    touch_key:
      pins: D9
