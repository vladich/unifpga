# pangomicro_pgc1k_pgc2k_devkit: Pangu 1K/2K Development Board (PGC1KG/PGC2KG).

Board:
  id: pangomicro_pgc1k_pgc2k_devkit
  name: Pangu 1K/2K Development Board (PGC1KG/PGC2KG)
  url: https://www.pangomicro.com/open/4251.html
  status: active
  notes: Type-C powered; 4-digit 7-seg; 4 RGB; 54 GPIO.
  producer: pangomicro
  chip: PGC1KG-LPG100
  bridges:
  - jtag
  programmer: pango_pgm
  features:
  - dip_switches
  - gpio_header_generic
  - rgb_leds
  - seven_segment_display
  - usb_powered
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - silabs_cp2102
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
