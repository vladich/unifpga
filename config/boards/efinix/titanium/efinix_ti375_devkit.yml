Board:
  id: efinix_ti375_devkit
  name: Titanium Ti375 Development Kit
  url: https://www.efinixinc.com/products-devkits-titaniumti375c529.html
  producer: efinix
  chip: Ti375C529C4
  bridges:
  - jtag
  programmer: efinity_pgm
  features:
