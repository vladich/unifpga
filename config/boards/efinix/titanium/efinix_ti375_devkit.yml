      pins:
        pin: H18
    ethernet_rx_data:
      pins: [A18, A19, D16, D17]
    ethernet_tx_ctl:
      pins:
        pin: B20
    ethernet_tx_data:
      pins: [B17, A16, A17, C19]
    microsd_clk:
      pins:
        pin: C9
    microsd_cmd:
      pins:
        pin: C10
    microsd_data:
      pins: [B9, B10, A8, A9]
