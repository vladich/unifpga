# efinix_t20_bga169_devkit pin map.
# Source: Efinix's T20F169 dev-kit example in Efinity 2023.2
#   (ipm/ip/efx_spi_loader/fpga/T20F169_devkit/jtag_spi_flash_loader.peri.xml).
# Pins are GPIO def names, as Efinity references them (see fireant.yml). Only
# the pins that example uses are listed; the kit has more LEDs and buttons.

Board:
  id: efinix_t20_bga169_devkit
  fpga:
    producer: Efinix
    family: Trion
    part: T20F169
  defaults:
    iostandard: "3.3 V LVTTL / LVCMOS"

  pinBanks:
    # ext_clkin: the 50 MHz reference of PLL_TR1 (conn_type alternate); it
    # reaches the fabric only through that PLL.
    clk:              { pins: "GPIOR_76", frequency_mhz: 50 }
    onboard_reset:    { pins: "GPIOL_12", active: low }     # rstn
    onboard_leds:                                           # led[0..3]
      pins: ["GPIOB_TXP06", "GPIOB_TXN09", "GPIOB_TXP08", "GPIOB_RXN04"]
    spi_flash:
      pins:
        sclk: "GPIOL_01"
        nss:  "GPIOL_00"
        mosi: "GPIOL_08"
        miso: "GPIOL_09"
