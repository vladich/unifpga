# intel_agilex7_mseries_devkit: Agilex 7 M-Series FPGA Development Kit.

Board:
  id: intel_agilex7_mseries_devkit
  name: Agilex 7 M-Series FPGA Development Kit
  status: eol
  producer: intel_altera
  chip: AGMF039R47A1E2VR0
  bridges:
  - usb-jtag
  programmer: quartus_pgm
  features:
  - ddr4_memory
  - dip_switches
  - ethernet_10gbe_sfp
  - ethernet_phy_gigabit
  - lpddr4_memory
  - microsd_socket
  - pcie_endpoint
  - qsfp_cage
  - qspi_flash
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt53d512m32
  - micron_n25q256a
  - microchip_ksz9031rnx
  - usb_blaster_ii_built_in
  - silabs_cp2102
  - microsd_socket_generic
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
