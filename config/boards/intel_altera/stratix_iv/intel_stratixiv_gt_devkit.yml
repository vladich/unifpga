# intel_stratixiv_gt_devkit: Stratix IV GT FPGA Development Kit.

Board:
  id: intel_stratixiv_gt_devkit
  name: Stratix IV GT FPGA Development Kit
  status: eol
  producer: intel_altera
  chip: EP4S100G2F40C2
  bridges:
  - usb-jtag
  programmer: quartus_pgm
  features:
  - ddr3_memory
  - dip_switches
  - ethernet_10gbe_sfp
  - ethernet_phy_gigabit
  - fmc_hpc
  - pcie_endpoint
  - sfp_cage
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt41k256m16
  - ddr3_sodimm_socket
  - usb_blaster_ii_built_in
  - silabs_cp2102
  - marvell_88e1116r
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
