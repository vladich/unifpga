# piswords6 pin map.


Board:
  id: piswords6
  name: Altera FPGA Core Board (EP4CE6)
  product: PiSwords Altera FPGA development board RFB-D V2.0 (EP4CE6E22C8), schematic file PS06
  summary: Cyclone IV E EP4CE6E22C8 (6272 LE), EQFP-144; HY57V641620 64 Mbit x16 SDRAM, EPCS4 config flash, AT24C08
    EEPROM, DS18B20; 8 LEDs, 4 keys + nCONFIG key, 4-way DIP switch, 8-digit 7-segment, 3-bit VGA, RS232 (MAX3232,
    DB9), LCD1602/12864 sockets, buzzer, 28-pin GPIO header; most peripherals share pins with the SDRAM
  producer: piswords
  chip: EP4CE6E22C8
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - buzzer
  - eeprom_chip
  - temperature_sensor_external
  - sdr_sdram
  - spi_flash
  devices:
  - hynix_hy57v641620
  documents:
  - id: sch
    title: PS06.pdf — RFB-D V2.0 schematic (p1), PCB outline (p2), bill of materials (p3)
    kind: schematic
    url: https://github.com/yuri-panchul/basics-graphics-music/blob/57ff8336dd67a557a03b6866d978e90d354f57a4/boards/piswords6/PS06.pdf
    sha256: 72aa716a9d54553d9e88cc8e661506a763b91c44a82dd1ee0c978932ff3bd014
    bytes: 1690043
    retrieved: '2026-09-24'
  - id: bgm_qsf
    title: BGM boards/piswords6/board_specific.qsf
    kind: constraints
    url: https://github.com/yuri-panchul/basics-graphics-music/blob/57ff8336dd67a557a03b6866d978e90d354f57a4/boards/piswords6/board_specific.qsf
    sha256: b208b3fc22b73ed4bb96215621767fff8950ce1e3b11ee093fb371f753d8d5d2
    bytes: 3458
    retrieved: '2026-09-24'
  defaults:
    iostandard: 3.3-V LVTTL

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP \"AS INPUT TRI-STATED\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
  banks:
    clk: { pins: "23", frequency_mhz: 50, source: {doc: sch, where: 'p1 centre-left, Y1 OUT -> net 23 (schematic rule: a pure-number net = FPGA pin)'} }
    onboard_buttons:
      source: {doc: sch, where: 'p1 独立按键 block: RP8 4.7K pull-ups, key to GND (active low)'}
      active: low
      pins: ["3", "7", "10", "11"]
    onboard_switches:
      source: {doc: sch, where: 'p1 拨码开关 block: RP4 4.7K pull-ups, switch to GND (ON = low); nets 31..34'}
      active: low
      pins: ["34", "33", "32", "31"]
    onboard_leds:
      source: {doc: sch, where: 'p1 独立LED block: anodes to +3.3V, cathodes via RP9/RP12 220R to nets 38..50 (active low)'}
      active: low
      pins: ["50", "49", "46", "44", "43", "42", "39", "38"]
    onboard_7seg:
      source: {doc: sch, where: 'p1 数码管 block: RP3/RP5 220R segment resistors (a=98 traced; order per BGM qsf), RP6/RP7 4.7K to PNP bases; 114 -> Q3 -> DP1.D1 traced; other digit order per BGM qsf (active low)'}
      pins:
        segments: ["80", "72", "71", "70", "101", "100", "99", "98"]
        anodes: ["86", "85", "84", "83", "120", "119", "115", "114"]
    onboard_vga:
      source: {doc: sch, where: 'p1 VGA block: RP10 220R: 55 -> VSYNC, 1 -> HSYNC; RP11: 54 VGA_R, 53 VGA_G, 52 VGA_B'}
      pins:
        hs: "1"
        vs: "55"
        rgb: ["52", "53", "54"]
    onboard_uart:
      source: {doc: sch, where: 'p1 RS232 block: UART_TXD 68 -> T1IN, R1OUT -> UART_RXD 69'}
      pins:
        tx: "68"
        rx: "69"
    gpio:
      source: {doc: sch, where: p1 扩展GPIO block}
      pins: ["144", "143", "142", "141", "138", "137", "136", "135", "133", "132", "129", "128", "127", "126", "125", "124"]
    onboard_buzzer:   # BUZZER SP1 (S8550 Q1)
      device: {"name": "BUZZER SP1 (S8550 Q1)", "kind": "buzzer"}
      shares: ["onboard_eeprom"]   # the board multiplexes these pins
      pins: {"beep": "2"}
    onboard_eeprom:   # EEPROM AT24C08 U3
      device: {"name": "EEPROM AT24C08 U3", "kind": "eeprom"}
      shares: ["onboard_buzzer", "onboard_vga"]   # the board multiplexes these pins
      pins: {"scl": "1", "sda": "2"}
    onboard_temperature:   # DS18B20 temperature sensor U5
      device: {"name": "DS18B20 temperature sensor U5", "kind": "temperature"}
      shares: ["onboard_leds"]   # the board multiplexes these pins
      pins: {"dq": "44"}
    onboard_sdram:   # SDRAM HY57V641620 U2 (4M x16)
      device: {"name": "SDRAM HY57V641620 U2 (4M x16)", "kind": "sdram", "id": "hynix_hy57v641620"}
      shares: ["onboard_7seg", "onboard_lcd", "onboard_switches", "onboard_uart"]   # the board multiplexes these pins
      model_params: {col_bits: 8}
      pins: {"a": ["76", "75", "74", "73", "34", "33", "32", "31", "30", "28", "77", "58"], "ba": ["83", "80"], "dq": ["110", "106", "105", "104", "103", "101", "100", "99", "65", "66", "67", "68", "69", "70", "71", "72"], "clk": "60", "cke": "59", "cs_n": "84", "ras_n": "85", "cas_n": "86", "we_n": "87", "dqm": ["98", "64"]}
    onboard_lcd:   # LCD1602 P2 (16-pin) and LCD12864 LCD1 (20-pin) sockets
      device: {"name": "LCD1602 P2 (16-pin) and LCD12864 LCD1 (20-pin) sockets", "kind": "lcd"}
      shares: ["onboard_sdram", "onboard_switches"]   # the board multiplexes these pins
      pins: {"rs": "34", "rw": "33", "en": "32", "d": ["31", "30", "28", "58", "59", "60", "64", "65"], "psb_12864": "66", "rst_12864": "67"}
    onboard_epcs4si8n_config_flash_u4:   # EPCS4SI8N config flash U4
      device: {"name": "EPCS4SI8N config flash U4", "kind": "flash"}
      pins: {"dclk": "12", "data0": "13", "asdo": "6", "ncso": "8"}
  # ---- drawn: headers and parts; ./unifpga layout draft piswords6 regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: gpio
      type: pin_row
      label: GPIO
      note: 'pins in the bank''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]', '[13]': 'gpio[13]', '[14]': 'gpio[14]', '[15]': 'gpio[15]'}
  parts:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 4}, bind: {sw: onboard_switches}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 8}, bind: {led: onboard_leds}}
    - id: 7seg
      label: 7seg
      attach: {peripheral: seven_segment_8digit_shared, params: {digits: 8, active: low, digits_active: low}, bind: {segments: ['onboard_7seg.segments[7]', 'onboard_7seg.segments[6]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[1]'], dp: 'onboard_7seg.segments[0]', digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]', 'onboard_7seg.anodes[6]', 'onboard_7seg.anodes[7]']}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 1, pin_bits_g: 1, pin_bits_b: 1, color_depth: 444}, bind: {r: ['onboard_vga.rgb[2]'], g: ['onboard_vga.rgb[1]'], b: ['onboard_vga.rgb[0]'], hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: buzzer
      label: BUZZER SP1 (S8550 Q1)
      attach: {peripheral: buzzer, bind: {pwm: onboard_buzzer.beep}}
    - id: temperature
      label: DS18B20 temperature sensor U5
      attach: {peripheral: ds18b20, bind: {dq: onboard_temperature.dq}}
    - id: eeprom
      label: EEPROM AT24C08 U3
      device: {kind: eeprom, bank: onboard_eeprom}   # no peripheral model yet
    - id: sdram
      label: SDRAM HY57V641620 U2 (4M x16)
      attach: {peripheral: sdram_sdr, params: {row_bits: 12, data_bits: 16, col_bits: 8}, bind: {clk: onboard_sdram.clk, cke: onboard_sdram.cke, cs_n: onboard_sdram.cs_n, ras_n: onboard_sdram.ras_n, cas_n: onboard_sdram.cas_n, we_n: onboard_sdram.we_n, ba: onboard_sdram.ba, a: onboard_sdram.a, dq: onboard_sdram.dq, dqm: onboard_sdram.dqm}}
    - id: lcd
      label: LCD1602 P2 (16-pin) and LCD12864 LCD1 (20-pin) sockets
      attach: {peripheral: hd44780_lcd, bind: {rs: onboard_lcd.rs, e: onboard_lcd.en, d: ['onboard_lcd.d[4]', 'onboard_lcd.d[5]', 'onboard_lcd.d[6]', 'onboard_lcd.d[7]'], rw: onboard_lcd.rw}}
    - id: epcs4si8n_config_flash_u4
      label: EPCS4SI8N config flash U4
      device: {kind: flash, bank: onboard_epcs4si8n_config_flash_u4}   # no peripheral model yet
