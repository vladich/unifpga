  parts:
    - id: clk
      label: clk
      attach:
        peripheral: clock_input
        bind:
          clk: clk
    - id: cpu_resetn
      label: cpu resetn
      attach:
        peripheral: reset_button
        bind:
          rst: cpu_resetn
    - id: buttons
      label: buttons
      attach:
        peripheral: button_array
        params:
          width: 3
        bind:
          btn: onboard_buttons
    - id: leds
      label: leds
      attach:
        peripheral: led_bank
        params:
          width: 4
        bind:
          led: onboard_leds
    - id: 7seg
      label: 7seg
      attach:
        peripheral: seven_segment_8digit_shared
        params:
          digits: 8
          active: low
          digits_active: low
        bind:
          segments: ['onboard_7seg.segments[7]', 'onboard_7seg.segments[6]', 'onboard_7seg.segments[5]', 'onboard_7seg.segments[4]', 'onboard_7seg.segments[3]', 'onboard_7seg.segments[2]', 'onboard_7seg.segments[1]']
          dp: onboard_7seg.segments[0]
          digits: ['onboard_7seg.anodes[0]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[3]', 'onboard_7seg.anodes[4]', 'onboard_7seg.anodes[5]', 'onboard_7seg.anodes[6]', 'onboard_7seg.anodes[7]']
    - id: vga
      label: vga
      attach:
        peripheral: vga_4bit
        params:
          bits_r: 5
          bits_g: 6
          bits_b: 5
          pin_bits_r: 5
          pin_bits_g: 6
          pin_bits_b: 5
          color_depth: 565
        bind:
          r: onboard_vga.r
          g: onboard_vga.g
          b: onboard_vga.b
          hs: onboard_vga.hs
          vs: onboard_vga.vs
    - id: uart
      label: uart
      attach:
        peripheral: uart_2wire
        bind:
          tx: onboard_uart.tx
          rx: onboard_uart.rx
    - id: buzzer
      label: 蜂鸣器 LS1 (S8550 Q7)
      attach:
        peripheral: buzzer
        bind:
          pwm: onboard_buzzer.buzzer
    - id: sdram
      label: SDRAM HY57V2562GTR U9 (256 Mbit, 16M x16)
      attach:
        peripheral: sdram_sdr
        params:
          row_bits: 13
          data_bits: 16
          col_bits: 9
        bind:
          clk: onboard_sdram.clk
          cke: onboard_sdram.cke
          cs_n: onboard_sdram.cs_n
          ras_n: onboard_sdram.ras_n
          cas_n: onboard_sdram.cas_n
          we_n: onboard_sdram.we_n
          ba: onboard_sdram.ba
          a: onboard_sdram.a
          dq: onboard_sdram.dq
          dqm: onboard_sdram.dqm
    - id: sdcard
      label: SD卡座 U14 (SPI mode)
      attach:
        peripheral: sdcard_spi
        bind:
          clk: onboard_sdcard.clk
          cmd: onboard_sdcard.mosi
          dat0: onboard_sdcard.miso
          dat3: onboard_sdcard.cs_n
    - id: eeprom
      label: EEPROM 24LC04 U12
      device:   # no peripheral model yet
        kind: eeprom
        bank: onboard_eeprom
    - id: rtc
      label: 实时时钟 DS1302 U11 (32.768 kHz, battery)
      device:   # no peripheral model yet
        kind: other
        bank: onboard_rtc
    - id: flash
      label: M25P16 (EPCS16) serial configuration flash U8
      device:   # no peripheral model yet
        kind: flash
        bank: onboard_flash
    - id: jtag_j3_10_pin
      label: JTAG J3 (10-pin)
      device:   # no peripheral model yet
        kind: other
        bank: onboard_jtag_j3_10_pin
    - id: led5_config_conf_done_led6_power
      label: LED5 CONFIG (CONF_DONE) / LED6 power
      device:   # no peripheral model yet
        kind: other
        bank: onboard_led5_config_conf_done_led6_power
