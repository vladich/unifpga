    gpio_p3:   # P3 header (2x10)
      source:
        doc: sch_v25
        where: IO interface block, P3 HEADER_2X10
      device:
        name: P3 header (2x10)
        kind: header
      shares: [onboard_buttons, onboard_eeprom, onboard_ir, onboard_leds, onboard_vga]   # the board multiplexes these pins
      pins:
        p3: '84'
        p4: '85'
        p5: '86'
        p6: '87'
        p7: '88'
        p8: '89'
        p9: '90'
        p10: '91'
