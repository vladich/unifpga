# omdazz pin map.


Board:
  id: omdazz
  name: Omdazz Cyclone IV
  product: Development board (Altera Cyclone IV EP4CE6), schematic "Development board schematic diagram V2.5" - sold
    under the OMDAZZ brand
  summary: Altera Cyclone IV EP4CE6E22C8 (6272 LE, TQFP144); 8 MB (64 Mbit usable) SDRAM, EPCS4 config flash; 4 LEDs,
    4 keys + 4 DIP, 4-digit 7-seg, RS232, VGA (3-bit), 1602/12864 LCD port, PS/2, IR, buzzer, AT24C08, LM75A; P1 2x19,
    P2 2x22, P3 2x10 headers
  url: https://www.aliexpress.com/wholesale?SearchText=omdazz+fpga
  producer: omdazz
  chip: EP4CE6E22C8
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - buzzer
  - ps2_port
  - ir_receiver
  - eeprom_chip
  - temperature_sensor_external
  - sdr_sdram
  - spi_flash
  devices:
  - microchip_at24c08
  - lm75_generic
  - hynix_hy57v561620
  documents:
  - id: sch_v25
    title: Development board schematic diagram V2.5 (Omdazz Cyclone IV board)
    kind: schematic
    url: https://raw.githubusercontent.com/andrsonin/Omdazz_Cyclon_IV_DevBoard/58fefa383b9ae5831108bcdce09777cfffbf1f6f/doc/Development%20board%20schematic%20diagram%20V2.5.pdf
    sha256: 06b313f7a407132c2d9b2eb8bd2ebc61bd91a3480f76aa209a5c89400f4ceee1
    bytes: 168899
    retrieved: '2026-09-24'
  - id: pininfo
    title: Development board pin information (vendor pin allocation table)
    kind: manual
    url: https://raw.githubusercontent.com/microCore-VHDL/uCore-for-Cyclone-IV/3c407bbdcbaa8cb3e8a038d512943dfa7d86b1d3/documents/board/Development%20board%20pin%20information.pdf
    sha256: 065733ba6093c2a15d8befcac728e28919f77e848c418ada21c475c247e239f1
    bytes: 359963
    retrieved: '2026-09-24'
  - id: sch_v21
    title: Development board schematic diagram V2.1 (OurFPGA.com 助学FPGA开发板, dated 2014/12/9)
    kind: schematic
    url: https://raw.githubusercontent.com/microCore-VHDL/uCore-for-Cyclone-IV/3c407bbdcbaa8cb3e8a038d512943dfa7d86b1d3/documents/board/Development%20board%20schematic%20diagram%20V2.1.pdf
    sha256: 2c922a654eee2fc98327e82aaf2ea5fab46c42412edacbca6f288e19b54e2c3e
    bytes: 1168493
    retrieved: '2026-09-24'
  - id: litex
    title: LiteX-Boards platform rz_easyfpga.py (commit a05e31e6)
    kind: platform
    url: https://github.com/litex-hub/litex-boards/blob/a05e31e6ff99fd9a1c5c96ee91e35d77e65f2397/litex_boards/platforms/rz_easyfpga.py
    sha256: 06565b02bfe73ac9a9e90d5de9295a33f88d22eb32712fd734cacea1217caf02
    bytes: 4304
    retrieved: '2026-09-24'
