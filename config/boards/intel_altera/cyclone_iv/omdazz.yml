    title: amaranth-boards rz_easyfpga_a2_2.py (commit f270d210)
    kind: platform
    url: https://github.com/amaranth-lang/amaranth-boards/blob/f270d210e36b0787d62db77176c7b0e8032178d3/amaranth_boards/rz_easyfpga_a2_2.py
