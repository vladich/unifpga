# marsohod_mcy316 pin map.


Board:
  id: marsohod_mcy316
  name: Marsohod MCY316
  product: MCY316 (Марсоход MCY316, Cyclone III)
  summary: Altera Cyclone III EP3C16Q240C8 (15408 LE, 516 kbit RAM), 100 MHz osc, 32-bit SDR SDRAM MT48LC4M32B2 (16
    MB), PCM1801 stereo audio ADC, 2 delta-sigma audio outs, SPI flash W25Q32 (user) + EPCS4 (config), 8 LEDs, 4-digit
    7-seg, 2 keys, 3x Raspberry-Pi-style 40-pin headers, serial header
  producer: marsohod
  chip: EP3C16Q240C8
  bridges:
  - jtag
  programmer: quartus2_pgm
  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  features:
  - spi_flash
