# dk_dev_3c120n pin map.


Board:
  id: dk_dev_3c120n
  name: Altera Cyclone III FPGA Development Kit
  product: Cyclone III FPGA Development Kit (DK-DEV-3C120N)
  summary: Cyclone III EP3C120F780C6 (119,088 LEs); 256 MB dual-channel DDR2 (72-bit), 8 MB SRAM, 64 MB flash; Gigabit
    Ethernet (88E1111), FTDI FT245BL USB, graphics/character LCD, 2x HSMC, user 7-seg display, speaker header, 8 DIP
    SW, 4 PB, 8 LEDs
  producer: terasic
  chip: EP3C120F780C6
  bridges:
  - jtag
  programmer: quartus2_pgm
  features:
  - ddr2_memory
  - dip_switches
  - ethernet_phy_gigabit
  - nor_flash
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  devices:
  - usb_blaster_ii_built_in
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - micron_mt47h64m16
  - marvell_88e1111
  - intel_strataflash_p30
  documents:
  - id: manual
    title: Cyclone III Development Board Reference Manual (Altera; copy of the kit installation in mopplayer/Cyclone-III-Embedded-Kit-Dev-Board)
    kind: manual
    url: https://raw.githubusercontent.com/mopplayer/Cyclone-III-Embedded-Kit-Dev-Board/2883c75bb99e498533d86c6672a4e0a3ad29e639/cycloneIII_3c120_dev/documents/cycloneIII_3c120_dev_reference_manual.pdf
    sha256: bc0d926a9ad1b1c4abf454673cc9b998ad8b4d027c27ef579956fd2f13920d97
    bytes: 2145932
    retrieved: '2026-09-24'
  - id: golden_qsf
    title: cycloneIII_3c120_dev_golden_top.qsf (Altera kit golden top, same repository)
    kind: constraints
    url: https://raw.githubusercontent.com/mopplayer/Cyclone-III-Embedded-Kit-Dev-Board/2883c75bb99e498533d86c6672a4e0a3ad29e639/cycloneIII_3c120_dev/examples/cycloneIII_3c120_dev_golden_top/cycloneIII_3c120_dev_golden_top.qsf
    sha256: 7dad1b91e43478dab78ca88496e16f47e483a032240b9e293e76c437eb765ac3
    bytes: 36095
    retrieved: '2026-09-24'
  defaults:
    iostandard: 2.5 V

  # Quartus project settings:
  # dual-purpose pin reservation, unused-pin state, device I/O default.
  toolchain_options:
    quartus:
      global_assignments:
        - "NOMINAL_CORE_SUPPLY_VOLTAGE 1.2V"
        - "CYCLONEIII_CONFIGURATION_SCHEME \"PASSIVE SERIAL\""
        - "ON_CHIP_BITSTREAM_DECOMPRESSION OFF"
        - "USE_CONFIGURATION_DEVICE OFF"
        - "FORCE_CONFIGURATION_VCCIO ON"
        - "STRATIX_DEVICE_IO_STANDARD \"2.5 V\""
        - "RESERVE_DATA0_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
        - "CYCLONEII_RESERVE_NCEO_AFTER_CONFIGURATION \"USE AS REGULAR IO\""
        - "RESERVE_DATA0_AFTER_CONFIGURATION \"AS INPUT TRI-STATED\""
