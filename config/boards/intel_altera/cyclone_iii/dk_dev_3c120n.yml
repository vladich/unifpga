  # ---- drawn: headers and parts; ./unifpga layout draft dk_dev_3c120n regenerates from here on ----
  layout:
    verified: false
    generated: true
  headers: []
  parts:
    - id: clk50mhz
      label: clk50mhz
      attach:
        peripheral: clock_input
        params:
          frequency_mhz: 50
        bind:
          clk: clk50mhz
    - id: leds
      label: leds
      attach:
        peripheral: led_bank
        params:
          width: 8
          active: low
        bind:
          led: onboard_leds
    - id: cpu_resetn
      label: cpu resetn
      attach:
        peripheral: reset_button
        bind:
          rst: cpu_resetn
    - id: 7seg
      label: 7seg
      attach:
        peripheral: seven_segment_8digit_shared
        params:
          digits: 4
          active: low
          digits_active: high
        bind:
          segments: [onboard_7seg.ca, onboard_7seg.cb, onboard_7seg.cc, onboard_7seg.cd, onboard_7seg.ce, onboard_7seg.cf, onboard_7seg.cg]
          dp: onboard_7seg.dp
          digits: ['onboard_7seg.anodes[3]', 'onboard_7seg.anodes[2]', 'onboard_7seg.anodes[1]', 'onboard_7seg.anodes[0]']
    - id: buttons
      label: buttons
      attach:
        peripheral: button_array
        params:
          width: 4
        bind:
          btn: onboard_buttons
    - id: switches
      label: switches
      attach:
        peripheral: sw_bank
        params:
          width: 8
        bind:
          sw: onboard_switches
    - id: fpga_jtag
      label: FPGA JTAG (routed to HSMC ports)
      device:   # no peripheral model yet
        kind: other
        bank: onboard_fpga_jtag
