# intel_stratixv_gt_devkit: Stratix V GT FPGA Development Kit.

Board:
  id: intel_stratixv_gt_devkit
  name: Stratix V GT FPGA Development Kit
  status: eol
  producer: intel_altera
  chip: 5SGTMC7K3F40C2N
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - ddr3_memory
  - dip_switches
  - ethernet_phy_gigabit
  - usb_jtag_bridge
  - usb_uart_bridge
  - user_buttons
  - user_leds
  devices:
  - ddr3_sodimm_socket
  - micron_mt41k256m16
  - usb_blaster_ii_built_in
  - silabs_cp2102
  - marvell_88e1116r
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
