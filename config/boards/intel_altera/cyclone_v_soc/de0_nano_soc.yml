# de0_nano_soc pin map.


Board:
  id: de0_nano_soc
  name: DE0-Nano-SoC
  product: DE0-Nano-SoC Kit (Atlas-SoC Kit)
  summary: 'Cyclone V SE SoC 5CSEMA4U23C6N (40K LEs, dual Cortex-A9 HPS); 1 GB HPS DDR3; HPS Gigabit Ethernet, USB
    OTG, micro SD, UART-USB, G-sensor, LTC header; FPGA: LTC2308 ADC, 2x 2x20 GPIO, Arduino header, 4 SW, 2 KEY, 8
    LEDs'
  aliases:
  - terasic_atlas_soc
  url: https://www.terasic.com.tw/cgi-bin/page/archive.pl?Language=English&CategoryNo=165&No=941
  producer: terasic
  chip: 5CSEMA4U23C6N
  bridges:
  - jtag
  programmer: quartus_pgm
  features:
  - accelerometer
  - adc_chip
  - ddr3_memory
  - dip_switches
  - ethernet_phy_gigabit
  - microsd_socket
  - usb_jtag_bridge
  - user_buttons
  - user_leds
  devices:
  - micron_mt41k256m16
  - microsd_socket_generic
  - microchip_ksz9031rnx
  - usb_blaster_ii_built_in
  - led_discrete_generic
  - pushbutton_smd_generic
  - dip_switch_generic
  - adi_adxl345
  - ti_adc128s022
  - lt_ltc2308
  - ftdi_ft232r
  - microchip_usb3300
  documents:
