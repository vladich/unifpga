# ice40hx8k_evb pin map.


Board:
  id: ice40hx8k_evb
  name: iCE40HX8K-EVB
  product: iCE40HX8K-EVB (Rev B1)
  summary: Lattice iCE40HX8K-CT256 (7680 LCs, 128 kbit EBR), 512 KB SRAM (256Kx16), 2 MB SPI flash, 100 MHz oscillator,
    2 LEDs, 2 buttons, 34-pin GPIO1 + four 40-pin EXT headers, PGM connector with UART
  url: https://www.olimex.com/Products/FPGA/iCE40/iCE40HX8K-EVB/
  producer: olimex
  chip: iCE40HX8K-CT256
  bridges:
  - ft2232h-spi
  - jtag
  programmer: iceprog
  # yosys synth flags.
  features:
  - sram
  - spi_flash
  devices:
  - samsung_k6r4016v1d
