# lattice_certuspro_nx_pcieb: CertusPro-NX PCIe Bridge Board.

Board:
  id: lattice_certuspro_nx_pcieb
  name: CertusPro-NX PCIe Bridge Board
  url: https://www.latticesemi.com/products/developmentboardsandkits/certuspro-nx-pcie-bridge-board
  status: active
  producer: lattice
  chip: LFCPNX-100-9LFG672I
  bridges:
