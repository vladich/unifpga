# icebreaker pin map.


Board:
  id: icebreaker
  name: iCEBreaker
  product: iCEBreaker FPGA
  summary: Lattice iCE40UP5K-SG48 (5280 LCs, 128 kbit EBR + 1 Mbit SPRAM), 16 MB QSPI flash, FT2232H JTAG/UART, 3
    PMODs (PMOD2 = break-off 5 LED + 3 button board), RGB LED, 2 LEDs, 1 button, 12 MHz
  url: https://1bitsquared.com/products/icebreaker
  producer: onebitsquared
  chip: iCE40UP5K-SG48
  bridges:
  - ft2232h-spi
  - jtag
  programmer: iceprog
  # yosys synth flags.
  toolchain_options:
    yosys:
      synth_options: [dsp, noabc9]
      loader_board: "ice40_generic"
      device_part: "up5k"
      device_pack: "sg48"
  banks:
    clk: { pins: "35", frequency_mhz: 12 }
    onboard_uart:
      pins:
        rx: "6"
        tx: "9"
    onboard_button: { pins: "10", active: low }
    onboard_led_red: { pins: "11", active: low }
    onboard_led_green: { pins: "37", active: low }
    onboard_rgb_led_0:
      pins:
        r: "39"
        g: "40"
        b: "41"
    onboard_serial_flash:
      pins:
        sck: "15"
        ssb: "16"
        io: ["14", "17", "12", "13"]
    pmod_p1a:
      pins: ["4", "2", "47", "45", "3", "48", "46", "44"]
    pmod_p1b:
      pins: ["43", "38", "34", "31", "42", "36", "32", "28"]
    pmod_p2:
      pins: ["27", "25", "21", "19", "26", "23", "20", "18"]
    onboard_leds:
      pins: ["26", "27", "25", "23", "21"]
    onboard_buttons:
      pins: ["20", "19", "18"]
  # ---- drawn: headers and parts; ./unifpga layout draft icebreaker regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: pmod_p1a
      type: pmod_2x6
      label: PMOD1A
      bank: pmod_p1a
      pins: {'1': 'pmod_p1a[0]', '2': 'pmod_p1a[1]', '3': 'pmod_p1a[2]', '4': 'pmod_p1a[3]', '7': 'pmod_p1a[4]', '8': 'pmod_p1a[5]', '9': 'pmod_p1a[6]', '10': 'pmod_p1a[7]'}
    - id: pmod_p1b
      type: pmod_2x6
      label: PMOD1B
      bank: pmod_p1b
      pins: {'1': 'pmod_p1b[0]', '2': 'pmod_p1b[1]', '3': 'pmod_p1b[2]', '4': 'pmod_p1b[3]', '7': 'pmod_p1b[4]', '8': 'pmod_p1b[5]', '9': 'pmod_p1b[6]', '10': 'pmod_p1b[7]'}
    - id: pmod_p2
      type: pmod_2x6
      label: PMOD2 (the break-off LED / button board's connector)
      bank: pmod_p2
      pins: {'1': 'pmod_p2[0]', '2': 'pmod_p2[1]', '3': 'pmod_p2[2]', '4': 'pmod_p2[3]', '7': 'pmod_p2[4]', '8': 'pmod_p2[5]', '9': 'pmod_p2[6]', '10': 'pmod_p2[7]'}
  parts:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: button
      label: button
      attach: {peripheral: button_array, params: {width: 1}, bind: {btn: onboard_button}}
    - id: rgb_led_0
      label: rgb led 0
      attach: {peripheral: rgb_led, bind: {r: onboard_rgb_led_0.r, g: onboard_rgb_led_0.g, b: onboard_rgb_led_0.b}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 5}, bind: {led: onboard_leds}}
    - id: led_green
      label: led green
      attach: {peripheral: led_bank, params: {width: 1, active: low}, bind: {led: onboard_led_green}}
    - id: led_red
      label: led red
      attach: {peripheral: led_bank, params: {width: 1, active: low}, bind: {led: onboard_led_red}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 3}, bind: {btn: onboard_buttons}}
