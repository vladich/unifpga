# colorlight75b pin map.

Board:
  id: colorlight75b
  fpga:
    producer: Lattice
    family: ECP5
    part: LFE5U-25F-6BG256C   # 5A-75B V8.0 (BG256); V6.1 had the BG381
  defaults:
    iostandard: LVCMOS33

  # yosys synth flags.
  toolchain_options:
    yosys:
      synth_options: [noabc9]
      device_part: "25k"
      device_pack: "CABGA256"
      speed: "6"
  pinBanks:
    clk: { pins: P6, frequency_mhz: 25 }
    onboard_leds:
      active: low
      pins: [T6]
    onboard_buttons:
      pins: [R7]
    gpio:
      pins: [R12, T14]
    onboard_hdmi:
      pins:
        d_p: [R15, P13, N14]
        clk_p: G16
        d_n: [T15, P14, H15]
        clk_n: H14
    onboard_sdram:   # ESMT M12L64322A SDRAM (2M x 32, 8 MB)
      device: {"name": "ESMT M12L64322A SDRAM (2M x 32, 8 MB)", "kind": "sdram"}
      iostandard: "LVCMOS33"
      model_params: {col_bits: 8}
      pins: {"clk": "C8", "a": ["A9", "B9", "B10", "C10", "D9", "C9", "E9", "D8", "E8", "C7", "B8"], "ba": ["B7", "A8"], "we_n": "B5", "cas_n": "A6", "ras_n": "B6", "dq": ["B2", "A2", "C3", "A3", "B3", "A4", "B4", "A5", "E7", "C6", "D7", "D6", "E6", "D5", "C5", "E5", "A11", "B11", "B12", "A13", "B13", "A14", "B14", "D14", "D13", "E11", "C13", "D11", "C12", "E10", "C11", "D10"]}
    onboard_eth0:   # Ethernet PHY U11 (RTL8211FD, RGMII, port 0)
      device: {"name": "Ethernet PHY U11 (RTL8211FD, RGMII, port 0)", "kind": "ethernet"}
      shares: ["onboard_eth1"]   # the board multiplexes these pins
      pins: {"rst_n": "R6", "mdc": "R5", "mdio": "T4", "txc": "L1", "tx_ctl": "L2", "txd": ["M2", "M1", "P1", "R1"], "rxc": "J1", "rx_ctl": "J2", "rxd": ["K2", "J3", "K1", "K3"]}
    onboard_eth1:   # Ethernet PHY U13 (RTL8211FD, RGMII, port 1)
      device: {"name": "Ethernet PHY U13 (RTL8211FD, RGMII, port 1)", "kind": "ethernet"}
      shares: ["onboard_eth0"]   # the board multiplexes these pins
      pins: {"rst_n": "R6", "mdc": "R5", "mdio": "T4", "txc": "J16", "tx_ctl": "K14", "txd": ["K16", "J15", "J14", "K15"], "rxc": "M16", "rx_ctl": "P16", "rxd": ["M15", "R16", "L15", "L16"]}
    onboard_config:   # sysCONFIG resistor pads (PROGRAMN R9, CFG_1 P10, INITN T9, DONE P9)
      device: {"name": "sysCONFIG resistor pads (PROGRAMN R9, CFG_1 P10, INITN T9, DONE P9)", "kind": "other"}
      pins: {"programn": "R9", "cfg_1": "P10", "initn": "T9", "done": "P9"}
    onboard_spare_pads:   # Spare pads R26 (N16), R107 (D12), R109 (A12)
      device: {"name": "Spare pads R26 (N16), R107 (D12), R109 (A12)", "kind": "other"}
      pins: {"r26": "N16", "r107": "D12", "r109": "A12"}
    hub75_j1:   # HUB75 connector J1 (outputs through 74HC245T 5 V buffers)
      device: {"name": "HUB75 connector J1 (outputs through 74HC245T 5 V buffers)", "kind": "header"}
      shares: ["hub75_j2", "hub75_j3", "hub75_j4", "hub75_j5", "hub75_j6", "hub75_j7", "hub75_j8"]   # the board multiplexes these pins
      pins: {"r0": "C4", "g0": "D4", "b0": "E4", "r1": "D3", "g1": "F5", "b1": "E3", "e": "N4", "a": "N5", "b": "N3", "c": "P3", "d": "P4", "clk": "M3", "stb": "N1", "oe": "M4"}
    hub75_j2:   # HUB75 connector J2 (outputs through 74HC245T 5 V buffers)
      device: {"name": "HUB75 connector J2 (outputs through 74HC245T 5 V buffers)", "kind": "header"}
      shares: ["hub75_j1", "hub75_j3", "hub75_j4", "hub75_j5", "hub75_j6", "hub75_j7", "hub75_j8"]   # the board multiplexes these pins
      pins: {"r0": "F1", "g0": "F2", "b0": "G2", "r1": "G1", "g1": "H2", "b1": "H3", "e": "N4", "a": "N5", "b": "N3", "c": "P3", "d": "P4", "clk": "M3", "stb": "N1", "oe": "M4"}
    hub75_j3:   # HUB75 connector J3 (outputs through 74HC245T 5 V buffers)
      device: {"name": "HUB75 connector J3 (outputs through 74HC245T 5 V buffers)", "kind": "header"}
      shares: ["hub75_j1", "hub75_j2", "hub75_j4", "hub75_j5", "hub75_j6", "hub75_j7", "hub75_j8"]   # the board multiplexes these pins
      pins: {"r0": "B1", "g0": "C2", "b0": "C1", "r1": "D1", "g1": "E2", "b1": "E1", "e": "N4", "a": "N5", "b": "N3", "c": "P3", "d": "P4", "clk": "M3", "stb": "N1", "oe": "M4"}
    hub75_j4:   # HUB75 connector J4 (outputs through 74HC245T 5 V buffers)
      device: {"name": "HUB75 connector J4 (outputs through 74HC245T 5 V buffers)", "kind": "header"}
      shares: ["hub75_j1", "hub75_j2", "hub75_j3", "hub75_j5", "hub75_j6", "hub75_j7", "hub75_j8"]   # the board multiplexes these pins
      pins: {"r0": "P5", "g0": "R3", "b0": "P2", "r1": "R2", "g1": "T2", "b1": "N6", "e": "N4", "a": "N5", "b": "N3", "c": "P3", "d": "P4", "clk": "M3", "stb": "N1", "oe": "M4"}
    hub75_j5:   # HUB75 connector J5 (outputs through 74HC245T 5 V buffers)
      device: {"name": "HUB75 connector J5 (outputs through 74HC245T 5 V buffers)", "kind": "header"}
      shares: ["gpio", "hub75_j1", "hub75_j2", "hub75_j3", "hub75_j4", "hub75_j6", "hub75_j7", "hub75_j8"]   # the board multiplexes these pins
      pins: {"r0": "T13", "g0": "R12", "b0": "R13", "r1": "R14", "g1": "T14", "b1": "P12", "e": "N4", "a": "N5", "b": "N3", "c": "P3", "d": "P4", "clk": "M3", "stb": "N1", "oe": "M4"}
    hub75_j6:   # HUB75 connector J6 (outputs through 74HC245T 5 V buffers)
      device: {"name": "HUB75 connector J6 (outputs through 74HC245T 5 V buffers)", "kind": "header"}
      shares: ["hub75_j1", "hub75_j2", "hub75_j3", "hub75_j4", "hub75_j5", "hub75_j7", "hub75_j8", "onboard_hdmi"]   # the board multiplexes these pins
      pins: {"r0": "R15", "g0": "T15", "b0": "P13", "r1": "P14", "g1": "N14", "b1": "H15", "e": "N4", "a": "N5", "b": "N3", "c": "P3", "d": "P4", "clk": "M3", "stb": "N1", "oe": "M4"}
    hub75_j7:   # HUB75 connector J7 (outputs through 74HC245T 5 V buffers)
      device: {"name": "HUB75 connector J7 (outputs through 74HC245T 5 V buffers)", "kind": "header"}
      shares: ["hub75_j1", "hub75_j2", "hub75_j3", "hub75_j4", "hub75_j5", "hub75_j6", "hub75_j8", "onboard_hdmi"]   # the board multiplexes these pins
      pins: {"r0": "G16", "g0": "H14", "b0": "G15", "r1": "F15", "g1": "F16", "b1": "E16", "e": "N4", "a": "N5", "b": "N3", "c": "P3", "d": "P4", "clk": "M3", "stb": "N1", "oe": "M4"}
    hub75_j8:   # HUB75 connector J8 (outputs through 74HC245T 5 V buffers)
      device: {"name": "HUB75 connector J8 (outputs through 74HC245T 5 V buffers)", "kind": "header"}
      shares: ["hub75_j1", "hub75_j2", "hub75_j3", "hub75_j4", "hub75_j5", "hub75_j6", "hub75_j7"]   # the board multiplexes these pins
      pins: {"r0": "D16", "g0": "E15", "b0": "C16", "r1": "B16", "g1": "C15", "b1": "B15", "e": "N4", "a": "N5", "b": "N3", "c": "P3", "d": "P4", "clk": "M3", "stb": "N1", "oe": "M4"}
