# karnix_ecp5 pin map.


Board:
  id: karnix_ecp5
  name: Karnix ASB-254
  product: Karnix ASB-254 (Karnaugh Interactive Extendable ASIC Simulation Board; ПИР СЦХ-254 «Карно»)
  summary: Lattice ECP5 LFE5U-25F-BG256C (24K LUT), 25 MHz osc, 512 KB async SRAM (K6R4016V1D), 128 Mbit W25Q128 config
    flash, 10/100 Ethernet (LAN8710 MII), RS-485, HDMI, SPI ADC (ADC128S052) + SPI DAC (AD5328) with audio jack, AT24C01
    EEPROM, 4 keys, 4 LEDs, RPi-style 40-pin header (28 GPIO), FT2232D JTAG+UART
  status: eol
  producer: fabmicro
  chip: LFE5U-25F-8BG256C
  bridges:
  - ft2232h-jtag
  programmer: ecpprog
  features:
  - sram
  - ethernet_phy_10_100
  - hdmi_output
  - adc_chip
  - audio_codec
  - eeprom_chip
  - spi_flash
  defaults:
    iostandard: LVCMOS33

  # yosys synth flags.
  toolchain_options:
    yosys:
      synth_options: [noabc9]
      loader_ftdi_channel: "0"
      device_part: "25k"
      device_pack: "CABGA256"
      speed: "6"
  banks:
    clk: { pins: B9, frequency_mhz: 25 }
    onboard_leds:
      pins: [A13, A14, A15, B14]
    onboard_buttons:
      pins: [B13, C13, D13, E13]
    gpio:
      pins: [L1, L2, M1, M2, K4, K5, L4, L5, N1, P2, L3, M3, P1, R1]
    onboard_vga:
      pins:
        r: [M4, N3, N4, D16]
        g: [R2, T2, P4, R3]
        b: [R4, T3, R5, T4]
        hs: M5
        vs: N5
    onboard_switches:
      pins: [A7, A8]
    onboard_uart:
      pins:
        rx: D12
        tx: E12
    onboard_reset_button_sw5_fpga_reset:   # RESET button SW5 (FPGA_RESET)
      device: {"name": "RESET button SW5 (FPGA_RESET)", "kind": "reset"}
      pins: {"fpga_reset": ["R8", "R9"]}
    onboard_sram:   # U21 K6R4016V1D-TC10 256Kx16 async SRAM (512 KB)
      device: {"name": "U21 K6R4016V1D-TC10 256Kx16 async SRAM (512 KB)", "kind": "sram"}
      pins: {"a": ["N13", "P14", "R15", "T15", "P13", "R14", "R13", "T14", "R12", "T13", "M12", "N12", "M11", "N11", "P11", "P12", "K16", "K15"], "d": ["L16", "L15", "M16", "M15", "K13", "K12", "L13", "L12", "N16", "P15", "L14", "M14", "P16", "R16", "M13", "N14"], "cs_n": "H15", "oe_n": "J14", "we_n": "K14", "ble_n": "J15", "bhe_n": "J16"}
    onboard_ethernet:   # U8 LAN8710AI 10/100 Ethernet PHY (MII) + XS4 RJ45 (passive PoE)
      device: {"name": "U8 LAN8710AI 10/100 Ethernet PHY (MII) + XS4 RJ45 (passive PoE)", "kind": "ethernet"}
      pins: {"tx_clk": "B4", "tx_en": "A4", "txd": ["B5", "A5", "B6", "A6"], "rx_clk": "F1", "rx_dv": "B7", "rx_er": "C2", "rxd": ["D1", "E2", "E1", "F2"], "col": "B2", "crs": "C1", "mdc": "A2", "mdio": "B1", "int_n": "B3", "rst_n": "A3"}
    onboard_rs485:   # U9 MAX487 RS-485 transceiver (XS3)
      device: {"name": "U9 MAX487 RS-485 transceiver (XS3)", "kind": "other"}
      shares: ["onboard_switches"]   # the board multiplexes these pins
      pins: {"ro": "A7", "di": "A8", "de_re": "C7"}
    onboard_hdmi:   # J3 HDMI connector (direct from FPGA, series capacitors)
      device: {"name": "J3 HDMI connector (direct from FPGA, series capacitors)", "kind": "hdmi_tx"}
      pins: {"d0_p": "A11", "d0_n": "A12", "d1_p": "D11", "d1_n": "E11", "d2_p": "B11", "d2_n": "C11", "clk_p": "B12", "clk_n": "C12", "scl": "E9", "sda": "D9", "cec": "C9", "hpd": "B8"}
    onboard_adc:   # U10 ADC128S052 SPI ADC (XS6..XS9 inputs, mic via audio jack)
      device: {"name": "U10 ADC128S052 SPI ADC (XS6..XS9 inputs, mic via audio jack)", "kind": "adc"}
      pins: {"sclk": "F15", "cs_n": "F16", "mosi": "E16", "miso": "G16"}
    onboard_dac:   # U11 AD5328 SPI DAC (XS10/XS11 outputs, XS12 audio L/R)
      device: {"name": "U11 AD5328 SPI DAC (XS10/XS11 outputs, XS12 audio L/R)", "kind": "audio"}
      pins: {"sclk": "C16", "cs_n": "C15", "mosi": "B15", "miso": "B16"}
    onboard_eeprom:   # U6 AT24C01C I2C EEPROM (1 kbit) + J2 EEPROM RESET jumper
      device: {"name": "U6 AT24C01C I2C EEPROM (1 kbit) + J2 EEPROM RESET jumper", "kind": "eeprom"}
      pins: {"scl": "R7", "sda": "P7", "wp": "R6", "reset": "T6"}
    onboard_serial_flash:   # U7 W25Q128JVPIQ SPI config flash (quad)
      device: {"name": "U7 W25Q128JVPIQ SPI config flash (quad)", "kind": "flash"}
      pins: {"cs_n": "N8", "mosi_io0": "T8", "miso_io1": "T7", "io2": "M7", "io3": "N7", "sck": "N9"}
    onboard_other:   # U20 FT2232D channel A — JTAG (+ J4 external JTAG header)
      device: {"name": "U20 FT2232D channel A — JTAG (+ J4 external JTAG header)", "kind": "other"}
      pins: {"tck": "T10", "tdi": "R11", "tdo": "M10", "tms": "T11"}
  # ---- drawn: headers and parts; ./unifpga layout draft karnix_ecp5 regenerates from here on ----
  layout: {verified: false, generated: true}
  headers:
    - id: gpio
      type: pin_row
      label: GPIO
      note: 'pins in the pinmap''s order: the header''s physical pin numbers are not verified yet'
      bank: gpio
      pins: {'[0]': 'gpio[0]', '[1]': 'gpio[1]', '[2]': 'gpio[2]', '[3]': 'gpio[3]', '[4]': 'gpio[4]', '[5]': 'gpio[5]', '[6]': 'gpio[6]', '[7]': 'gpio[7]', '[8]': 'gpio[8]', '[9]': 'gpio[9]', '[10]': 'gpio[10]', '[11]': 'gpio[11]', '[12]': 'gpio[12]', '[13]': 'gpio[13]'}
  parts:
    - id: clk
      label: clk
      attach: {peripheral: clock_input, bind: {clk: clk}}
    - id: leds
      label: leds
      attach: {peripheral: led_bank, params: {width: 4}, bind: {led: onboard_leds}}
    - id: buttons
      label: buttons
      attach: {peripheral: button_array, params: {width: 4}, bind: {btn: onboard_buttons}}
    - id: vga
      label: vga
      attach: {peripheral: vga_4bit, params: {bits_r: 4, bits_g: 4, bits_b: 4, pin_bits_r: 4, pin_bits_g: 4, pin_bits_b: 4, color_depth: 444, gate: false}, bind: {r: onboard_vga.r, g: onboard_vga.g, b: onboard_vga.b, hs: onboard_vga.hs, vs: onboard_vga.vs}}
    - id: switches
      label: switches
      attach: {peripheral: sw_bank, params: {width: 2}, bind: {sw: onboard_switches}}
    - id: uart
      label: uart
      attach: {peripheral: uart_2wire, bind: {tx: onboard_uart.tx, rx: onboard_uart.rx}}
    - id: adc
      label: U10 ADC128S052 SPI ADC (XS6..XS9 inputs, mic via audio jack)
      attach: {peripheral: adc128s022, bind: {cs_n: onboard_adc.cs_n, sclk: onboard_adc.sclk, din: onboard_adc.mosi, dout: onboard_adc.miso}}
    - id: reset_button_sw5_fpga_reset
      label: RESET button SW5 (FPGA_RESET)
      device: {kind: reset, bank: onboard_reset_button_sw5_fpga_reset}   # no peripheral model yet
    - id: sram
      label: U21 K6R4016V1D-TC10 256Kx16 async SRAM (512 KB)
      attach: {peripheral: async_sram, params: {addr_bits: 18}, bind: {a: onboard_sram.a, d: onboard_sram.d, ce_n: onboard_sram.cs_n, oe_n: onboard_sram.oe_n, we_n: onboard_sram.we_n, lb_n: onboard_sram.ble_n, ub_n: onboard_sram.bhe_n}}
    - id: ethernet
      label: U8 LAN8710AI 10/100 Ethernet PHY (MII) + XS4 RJ45 (passive PoE)
      device: {kind: ethernet, bank: onboard_ethernet}   # no peripheral model yet
    - id: rs485
      label: U9 MAX487 RS-485 transceiver (XS3)
      device: {kind: other, bank: onboard_rs485}   # no peripheral model yet
    - id: hdmi
      label: J3 HDMI connector (direct from FPGA, series capacitors)
      device: {kind: hdmi_tx, bank: onboard_hdmi}   # no peripheral model yet
    - id: dac
      label: U11 AD5328 SPI DAC (XS10/XS11 outputs, XS12 audio L/R)
      device: {kind: audio, bank: onboard_dac}   # no peripheral model yet
    - id: eeprom
      label: U6 AT24C01C I2C EEPROM (1 kbit) + J2 EEPROM RESET jumper
      device: {kind: eeprom, bank: onboard_eeprom}   # no peripheral model yet
    - id: serial_flash
      label: U7 W25Q128JVPIQ SPI config flash (quad)
      device: {kind: flash, bank: onboard_serial_flash}   # no peripheral model yet
    - id: other
      label: U20 FT2232D channel A — JTAG (+ J4 external JTAG header)
      device: {kind: other, bank: onboard_other}   # no peripheral model yet
