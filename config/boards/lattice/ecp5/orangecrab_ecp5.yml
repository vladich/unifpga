# orangecrab_ecp5 pin map.

Board:
  id: orangecrab_ecp5
  fpga:
    producer: Lattice
    family: ECP5
  defaults:
    iostandard: LVCMOS33

  # yosys synth flags.
  toolchain_options:
    yosys:
      synth_options: [noabc9]
      loader_ftdi_channel: "1"
      device_part: "25k"
      device_pack: "CSFBGA285"
      speed: "8"
  pinBanks:
    clk: { pins: A9, frequency_mhz: 48 }
    onboard_leds:
      active: low
      pins: [K4, M3, J3]
    onboard_buttons:
      active: low
      pins: [J17, V17]
      overrides:
        J17: SSTL135_I
    onboard_vga:
      pins:
        r: [M18, N17, N15, N16]
        g: [R17, T17, G4, H4]
        b: [N4, N3, L4, C10]
        hs: C9
        vs: B10
    gpio:
      pins: [B9, C8, B8, A8, H2, J2, K1, K2]
    onboard_switches:
      pins: [L3, M1]
    onboard_uart:
      pins:
        rx: J1
        tx: K3
