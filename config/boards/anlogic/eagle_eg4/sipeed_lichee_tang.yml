Board:
  id: sipeed_lichee_tang
  name: Sipeed Lichee Tang
  product: Lichee Tang (Tang Primer)
  summary: Anlogic EG4S20BG256 (20K LUT, 64 Mbit SDRAM in package, 12-bit ADC); 24 MHz clock, GD32F150 USB-JTAG/UART,
    RGB LED, 2 keys, config SPI flash + user SPI flash, microSD, DVP camera FPC-24P, RGB LCD FPC-40P + NS2009 touch,
    2x SIP40 side rows (header + castellated)
  url: https://wiki.sipeed.com/hardware/en/tang/Tang-primer/Tang-primer.html
  producer: sipeed
  chip: EG4S20BG256
  bridges:
  - jtag
  programmer: td_pgm
  features:
  - usb_jtag_bridge
  - user_leds
  - user_buttons
  - qspi_flash
  - microsd_socket
  - parallel_camera_input
  - parallel_lcd
  - adc_chip
  devices:
  - ftdi_ft2232h
