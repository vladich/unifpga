# 12-bit (4-4-4) DVI parallel output via the icebreaker DVI Pmod.

Peripheral:
  id: dvi_12bit
  description: 12-bit RGB DVI output (4 bits per channel) plus HSYNC/VSYNC/DE/CLK
  signals:
    - { name: r,  type: bus, width: 4, direction: output }
    - { name: g,  type: bus, width: 4, direction: output }
    - { name: b,  type: bus, width: 4, direction: output }
    - { name: hs, type: scalar, direction: output }
    - { name: vs, type: scalar, direction: output }
    - { name: de, type: scalar, direction: output }
    - { name: ck, type: scalar, direction: output }
  provides:
    - capability: screen
      params:
        width: 640
        height: 480
        color_depth: 444
  # 25.125 MHz pixel clock from the iCE40 PLL (BGM: SB_PLL40_PAD 12 -> 25.125
  # MHz on the iCEBreaker); the timing generator runs on it directly.
  clocks:
    - { name: pixel, mhz: 25.125 }
  driver:
    # BGM icebreaker_dvi_12b_*: `vga` + SB_IO PIN_OUTPUT_REGISTERED data +
    # an SB_IO PIN_OUTPUT_DDR clock pin (0 / 1 = inverted pixel clock)
    module: dvi_pmod_12b
    file: rtl/peripherals/dvi_pmod_12b.sv
    parameters:
      clk_mhz:   25
      pixel_mhz: 25
    port_map:
      clk:     clock.pixel
      rst:     context.rst
      x:       capability.screen.x
      y:       capability.screen.y
      red_i:   capability.screen.red
      green_i: capability.screen.green
      blue_i:  capability.screen.blue
      r:       pin.r
      g:       pin.g
      b:       pin.b
      hs:      pin.hs
      vs:      pin.vs
      de:      pin.de
      ck:      pin.ck
