# 12-bit (4-4-4) DVI parallel output via the icebreaker DVI Pmod.

Peripheral:
  id: dvi_12bit
  description: 12-bit RGB DVI output (4 bits per channel) plus HSYNC/VSYNC/DE/CLK
  signals:
    - { name: r,  type: bus, width: 4, direction: output }
    - { name: g,  type: bus, width: 4, direction: output }
    - { name: b,  type: bus, width: 4, direction: output }
    - { name: hs, type: scalar, direction: output }
    - { name: vs, type: scalar, direction: output }
    - { name: de, type: scalar, direction: output }
    - { name: ck, type: scalar, direction: output }
  provides:
    - capability: screen
      params:
        width: 640
        height: 480
        color_depth: 444
  # 25.125 MHz pixel clock from the iCE40 PLL (BGM: SB_PLL40_PAD 12 -> 25.125
  # MHz on the iCEBreaker); the timing generator runs on it directly.
  clocks:
    - { name: pixel, mhz: 25.125 }
  driver:
    module: vga
    file: rtl/peripherals/vga.sv
    parameters:
      CLK_MHZ:   25
      PIXEL_MHZ: 25
      H_DISPLAY: 640
      V_DISPLAY: 480
      W_RED:     4
      W_GREEN:   4
      W_BLUE:    4
      W_RED_O:   4
      W_GREEN_O: 4
      W_BLUE_O:  4
    port_map:
      clk:        clock.pixel
      rst:        context.rst
      hsync:      pin.hs
      vsync:      pin.vs
      hpos:       capability.screen.x
      vpos:       capability.screen.y
      display_on: pin.de      # data enable = active area
      pixel_clk:
      red:        capability.screen.red
      green:      capability.screen.green
      blue:       capability.screen.blue
      vga_r:      pin.r       # gated by display_on inside the driver
      vga_g:      pin.g
      vga_b:      pin.b
  pin_assigns:
    pin.ck: clock.pixel
