# 480x272 RGB-parallel LCD with the ML6485 controller (Tang Nano 9K
# `lcd_ml6485` variants), driven through the same LARGE_LCD_* pins as the
# plain 480x272 panel with the `lcd_480_272_ml6485` timing module and the
# 800x480 PLL setting (Gowin_rPLL CLKOUTD = 32.4 MHz). It is not a serial
# (SPI) display: the SMALL_LCD_* pins are declared but never driven.

Peripheral:
  id: lcd_ml6485
  description: 480x272 RGB-parallel LCD (ML6485 controller) with HSYNC/VSYNC/DE/CLK and optional backlight
  parameters:
    bits_r: { type: int, default: 5 }
    bits_g: { type: int, default: 6 }
    bits_b: { type: int, default: 5 }
    bl:   { type: string, default: const.1 }
    init: { type: string, default: const.0 }
  signals:
    - { name: r,    type: bus, width: $bits_r, direction: output }
    - { name: g,    type: bus, width: $bits_g, direction: output }
    - { name: b,    type: bus, width: $bits_b, direction: output }
    - { name: hs,   type: scalar, direction: output, optional: true }
    - { name: vs,   type: scalar, direction: output, optional: true }
    - { name: de,   type: scalar, direction: output }
    - { name: ck,   type: scalar, direction: output }
    - { name: bl,   type: scalar, direction: output, optional: true, comment: "Backlight enable" }
    - { name: init, type: scalar, direction: output, optional: true, comment: "Init / display enable" }
  provides:
    - capability: screen
      params:
        width: 480
        height: 272
        color_depth: 565
        bits_r: $bits_r
        bits_g: $bits_g
        bits_b: $bits_b
  # The panel is clocked from the 800x480 PLL setting: 27 MHz -> CLKOUT
  # 129.6 MHz -> CLKOUTD / 4 = 32.4 MHz (annotated "33.33 MHz" in the top).
  clocks:
    - { name: pixel, mhz: 32.4 }
  driver:
    module: lcd_480_272_ml6485
    file: rtl/peripherals/lcd_480_272_ml6485.sv
    port_map:
      PixelClk:  clock.pixel
      nRST:      context.rst_n
      LCD_DE:    pin.de
      LCD_HSYNC: pin.hs
      LCD_VSYNC: pin.vs
      x:         capability.screen.x
      y:         capability.screen.y
  pin_assigns:
    pin.r:    capability.screen.red
    pin.g:    capability.screen.green
    pin.b:    capability.screen.blue
    pin.ck:   clock.pixel
    pin.bl:   $bl
    pin.init: $init
