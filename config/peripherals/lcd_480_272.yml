# 480x272 RGB-parallel LCD module (e.g. ER-TFT043-3, common 4.3" panel).

Peripheral:
  id: lcd_480_272
  description: 480x272 RGB-parallel LCD with HSYNC/VSYNC/DE/CLK and optional backlight
  # Colour bus width per channel: 5-6-5 on Tang Nano 9K/20K and Primer 20K
  # Dock (w_red = 5), 6-6-6 on Tang Mega 138K / 138K Pro (w_red = 6).
  # The user-visible width equals the pin width for these panels.
  parameters:
    bits_r:
      type: int
      default: 5
    bits_g:
      type: int
      default: 6
    bits_b:
      type: int
      default: 5
    # What drives the backlight / init pins when the board has them. It
    # differs per board (`assign LCD_BL = 1'b0` on Tang Nano 9K, `1'b1` on
    # Tang Nano 20K, `~ rst` on Tang Primer 20K Dock); each configuration
    # sets its board's choice.
    bl:
      type: string
      default: const.1
    init:
      type: string
      default: const.0
  signals:
    - name: r
      type: bus
      width: $bits_r
      direction: output
    - name: g
      type: bus
      width: $bits_g
      direction: output
    - name: b
      type: bus
      width: $bits_b
      direction: output
    # hs/vs are optional: the Tang Mega 138K Pro adapter is wired DE-only (its
    # pin constraints have no LCD_HS/VS).
    - name: hs
      type: scalar
      direction: output
      optional: true
    - name: vs
      type: scalar
      direction: output
      optional: true
    - name: de
      type: scalar
      direction: output
    - name: ck
      type: scalar
      direction: output
    - name: bl
      type: scalar
      direction: output
      optional: true
      comment: Backlight enable
    - name: init
      type: scalar
      direction: output
      optional: true
      comment: Init / display enable
  provides:
    - capability: screen
      params:
        width: 480
        height: 272
        color_depth: 565
        bits_r: $bits_r
        bits_g: $bits_g
        bits_b: $bits_b
  # 9 MHz pixel clock from a PLL on the board clock, as on every Tang board
  # (Gowin_rPLL 27 -> 9 MHz). Codegen instantiates the
  # vendor PLL wrapper and exposes it as `clock.pixel`.
  clocks:
    - name: pixel
      mhz: 9
  driver:
    module: lcd_480_272
    file: rtl/peripherals/lcd_480_272.sv
    port_map:
      PixelClk:  clock.pixel
      nRST:      context.rst_n   # active-low reset
      LCD_DE:    pin.de
      LCD_HSYNC: pin.hs
      LCD_VSYNC: pin.vs
      x:         capability.screen.x
      y:         capability.screen.y
  pin_assigns:
    pin.r:    capability.screen.red
    pin.g:    capability.screen.green
    pin.b:    capability.screen.blue
    pin.ck:   clock.pixel
    pin.bl:   $bl
    pin.init: $init
