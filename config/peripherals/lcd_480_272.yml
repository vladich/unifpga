# 480x272 RGB-parallel LCD module (e.g. ER-TFT043-3, common 4.3" panel).

Peripheral:
  id: lcd_480_272
  description: 480x272 RGB-parallel LCD with HSYNC/VSYNC/DE/CLK and optional backlight
  # Colour bus width per channel: 5-6-5 on Tang Nano 9K/20K and Primer 20K
  # Dock (BGM w_red = 5), 6-6-6 on Tang Mega 138K / 138K Pro (BGM w_red = 6).
  # The user-visible width equals the pin width for these panels.
  parameters:
    bits_r: { type: int, default: 5 }
    bits_g: { type: int, default: 6 }
    bits_b: { type: int, default: 5 }
  signals:
    - { name: r,    type: bus, width: $bits_r, direction: output }
    - { name: g,    type: bus, width: $bits_g, direction: output }
    - { name: b,    type: bus, width: $bits_b, direction: output }
    # hs/vs are optional: the Tang Mega 138K Pro adapter is wired DE-only (BGM
    # tang_mega_138k_pro_lcd_480_272_tm1638/board_specific.cst has no LCD_HS/VS).
    - { name: hs,   type: scalar, direction: output, optional: true }
    - { name: vs,   type: scalar, direction: output, optional: true }
    - { name: de,   type: scalar, direction: output }
    - { name: ck,   type: scalar, direction: output }
    - { name: bl,   type: scalar, direction: output, optional: true, comment: "Backlight enable" }
    - { name: init, type: scalar, direction: output, optional: true, comment: "Init / display enable" }
  provides:
    - capability: screen
      params:
        width: 480
        height: 272
        color_depth: 565
        bits_r: $bits_r
        bits_g: $bits_g
        bits_b: $bits_b
  driver:
    module: lcd_480_272
    file: rtl/peripherals/lcd_480_272.sv
    port_map:
      PixelClk:  context.clk
      nRST:      context.rst_n   # active-low reset
      LCD_DE:    pin.de
      LCD_HSYNC: pin.hs
      LCD_VSYNC: pin.vs
      x:         capability.screen.x
      y:         capability.screen.y
  pin_assigns:
    pin.r:    capability.screen.red
    pin.g:    capability.screen.green
    pin.b:    capability.screen.blue
    pin.ck:   context.clk    # pixel clock — board may need a PLL upstream
    pin.bl:   const.1
    pin.init: const.1
