# Differential 12-pin Pmod header. 4 differential pairs (P/N) routed to the
# FPGA's XADC analog input bank on Xilinx 7-series boards. Used as a pin
# bank that other (analog or LVDS) peripherals attach to.

Peripheral:
  id: pmod_diff
  description: Differential Pmod header (4 LVDS pairs)
  signals:
    - name: p
      type: bus
      width: 4
      direction: inout
      comment: Positive lines (P1..P4)
    - name: n
      type: bus
      width: 4
      direction: inout
      comment: Negative lines (N1..N4)
  # Differential pairs aren't directly usable as plain GPIO at the user level;
  # this header is exposed as raw pins for board-specific use, with no
  # capability mapped at the design_top tier.
  provides: []
  driver: null
