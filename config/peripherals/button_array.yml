# A bank of N momentary push-buttons.

Peripheral:
  id: button_array
  description: Array of N momentary push-buttons
  parameters:
    width:
      type: int
      required: true
    active:
      type: enum
      values: [high, low]
      default: high
    as_switches:
      type: bool
      default: false
      rig: true             # the rig's convention, not the part's        # boards without switches feed the design's sw from the keys (`.sw (key)`)
  signals:
    - { name: btn, type: bus, width: $width, direction: input }
  # the on-board devices it models: a board inventory's `buttons` device (a bank
  # of pins) becomes an on-board part attaching this peripheral
  models: {kind: buttons, signal: btn}
  provides:
    - capability: buttons
      params:
        width: $width
    - capability: switches
      when: $as_switches
      params:
        width: $width
      signal_map:
        sw: btn             # the switches bus reads the same pins
  driver: null   # codegen inverts when active=low
