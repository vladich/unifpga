# 8-digit common-cathode (or common-anode with active-low logic) 7-segment display
# wired with shared segment lines and a per-digit anode-select bus. The host must
# multiplex digits in time. Used on Digilent Nexys 4 / 4 DDR / A7 / Basys 3 etc.

Peripheral:
  id: seven_segment_8digit_shared
  description: 8-digit 7-segment display, shared segment lines, per-digit anode select
  parameters:
    digits:
      type: int
      default: 8
    active:                  # segments and dp
      type: enum
      values: [high, low]
      default: low
    digits_active:           # digit select: `an = ~ digit` (low) on Digilent,
      type: enum             # `seg_sel = {digit[0], ...}` (high) on dk_dev_3c120n
      values: [high, low]
      default: low
  signals:
    - { name: segments, type: bus, width: 7, direction: output, comment: "CA, CB, CC, CD, CE, CF, CG" }
    - { name: dp,       type: scalar, direction: output, optional: true, comment: "Decimal point (some boards have none)" }
    - { name: digits,   type: bus, width: $digits, direction: output, comment: "Anode select, one-hot" }
  provides:
    - capability: seven_segment
      params:
        digits: $digits
  driver: null
  # The peripheral pin signals (`segments`, `dp`, `digits`) don't share names
  # with the capability signals (`abcdefgh`, `digit`); the codegen wires them
  # explicitly via pin_assigns.
  #
  # Bit order follows the capability: `abcdefgh[7]` is segment a and
  # `abcdefgh[0]` is h (the decimal point) — designs write '0' as
  # 8'b1111_1100. `segments[0]` is CA (segment a), `segments[6]` is CG.
  # Written per bit so the mapping is explicit and independent of whether
  # `segments` is bound to a 7-wide bank or to a list of scalar pins. Boards
  # whose bus is index-aligned with abcdefgh (`SEG_DATA = ~ abcdefgh`: a on
  # bit 7) bind `segments` to the list [bank[7], ..., bank[1]] and `dp` to
  # bank[0].
  pin_assigns:
    pin.segments[0]: capability.seven_segment.abcdefgh[7]   # a
    pin.segments[1]: capability.seven_segment.abcdefgh[6]   # b
    pin.segments[2]: capability.seven_segment.abcdefgh[5]   # c
    pin.segments[3]: capability.seven_segment.abcdefgh[4]   # d
    pin.segments[4]: capability.seven_segment.abcdefgh[3]   # e
    pin.segments[5]: capability.seven_segment.abcdefgh[2]   # f
    pin.segments[6]: capability.seven_segment.abcdefgh[1]   # g
    pin.dp:          capability.seven_segment.abcdefgh[0]   # h / decimal point
    pin.digits:      capability.seven_segment.digit
