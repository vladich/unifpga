# Quad-SPI configuration flash. The clock is shared with the FPGA's CCLK pin
# during configuration and is not modeled as a separate signal here.

Peripheral:
  id: qspi_flash
  description: Quad-SPI configuration flash (4-bit data + chip-select)
  signals:
    - name: dq
      type: bus
      width: 4
      direction: inout
      comment: DQ[3:0]
    - name: csn
      type: scalar
      direction: output
      comment: Chip-select, active low
  provides: []
  driver: null
