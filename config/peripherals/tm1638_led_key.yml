# TM1638 "LED & KEY" serial display module: 8 LEDs, 8-digit 7-segment, 8 keys
# multiplexed on a 3-wire bidirectional serial bus. Frequently attached via a
# Pmod header.

Peripheral:
  id: tm1638_led_key
  description: TM1638 serial module (8 LEDs + 8-digit 7-seg + 8 keys on 3-wire bus)
  signals:
    - { name: stb,  type: scalar, direction: output, comment: "Strobe (chip-select, active-low)" }
    - { name: clk,  type: scalar, direction: output, comment: "Serial clock" }
    - { name: dio,  type: scalar, direction: inout,  comment: "Bidirectional data" }
  # The TM1638 controller chip provides FOUR user-visible capabilities through
  # one 3-wire serial bus. The driver multiplexes them internally.
  parameters:
    # What resets the controller: the design's reset, or (Tang Primer 25K:
    # `.rst ( tm_rst )`, tm_rst = rst_on_power_up) the power-up reset alone,
    # so a TM1638 key that resets the design does not also clear the keys
    rst: { type: string, default: context.rst, rig: true }
  provides:
    - capability: switches
      params: { width: 8 }
    - capability: leds
      params: { width: 8 }
    - capability: buttons
      params: { width: 8 }
    - capability: seven_segment
      params: { digits: 8 }
  driver:
    module: tm1638_board_controller
    file: rtl/peripherals/tm1638_board_controller.sv
    parameters:
      clk_mhz: context.clk_mhz
      w_digit: 8
    port_map:
      clk:      context.clk
      rst:      $rst
      sio_stb:  pin.stb
      sio_clk:  pin.clk
      sio_data: pin.dio
      keys:     capability.switches.sw  # the controller exposes one keys port;
                                        # codegen also fans it to buttons.btn
      ledr:     capability.leds.led
      # The controller's port is bit-reversed relative to the capability
      # (`hgfedcba[0]` = a, `abcdefgh[7]` = a) — the SWAP_BITS of a
      # board_specific_top.sv. A list renders as a concat, first element MSB.
      hgfedcba:
        - "capability.seven_segment.abcdefgh[0]"   # -> hgfedcba[7] = h
        - "capability.seven_segment.abcdefgh[1]"   # -> hgfedcba[6] = g
        - "capability.seven_segment.abcdefgh[2]"
        - "capability.seven_segment.abcdefgh[3]"
        - "capability.seven_segment.abcdefgh[4]"
        - "capability.seven_segment.abcdefgh[5]"
        - "capability.seven_segment.abcdefgh[6]"
        - "capability.seven_segment.abcdefgh[7]"   # -> hgfedcba[0] = a
      digit:    capability.seven_segment.digit
  pin_assigns:
    capability.buttons.btn: capability.switches.sw   # mirror keys to btn capability
