# VGA output with HSYNC/VSYNC and an R/G/B DAC of any width: the 4-4-4
# Digilent/Pmod carriers (the historical default and the reason for the id),
# the 8-8-8 DACs on DE1-SoC / DE2-115 / SoCKit, the 10-10-10 DAC on DE2, the
# 5-6-5 resistor ladder on saylinx, and the one-bit-per-colour boards
# (omdazz, rzrd, zeowaa, piswords6).
#
# Two width sets, both taken from the board:
#   bits_*      what design_top sees (w_red / w_green / w_blue)
#   pin_bits_*  how many pins the board has per channel
# The `vga` driver gates the colours with display_on and reduces them to the
# pin width (OR-reduction for a single pin, MSBs otherwise).

Peripheral:
  id: vga_4bit
  description: VGA output (HSYNC/VSYNC + R/G/B DAC of configurable width)
  parameters:
    bits_r:     { type: int, default: 4 }
    bits_g:     { type: int, default: 4 }
    bits_b:     { type: int, default: 4 }
    pin_bits_r: { type: int, default: 4 }
    pin_bits_g: { type: int, default: 4 }
    pin_bits_b: { type: int, default: 4 }
    color_depth:
      type: enum
      values: [111, 444, 565, 888]
      default: 444      # informational; bits_* win when present
    gate:
      type: bool
      default: true     # colours 0 outside the display (resistor ladders); false with a DAC
                        # driven through blank_n (DE1-SoC, SoCKit, DE2-115) or an ungated header
    registered:
      type: bool
      default: false    # colours and syncs through a flop (DE0-Nano: "to remove the glitches")
  signals:
    - { name: r,  type: bus, width: $pin_bits_r, direction: output }
    - { name: g,  type: bus, width: $pin_bits_g, direction: output }
    - { name: b,  type: bus, width: $pin_bits_b, direction: output }
    - { name: hs, type: scalar, direction: output }
    - { name: vs, type: scalar, direction: output }
    # DAC boards (DE2-115, DE1-SoC, SoCKit, DE2): VGA_BLANK_N is driven with
    # display_on and VGA_CLK with the pixel clock; VGA_SYNC_N is a `tie:`.
    - { name: blank_n, type: scalar, direction: output, optional: true, comment: "ADV7123 BLANK_N = display_on" }
    - { name: clk,     type: scalar, direction: output, optional: true, comment: "ADV7123 pixel clock" }
  provides:
    - capability: screen
      params:
        width: 640
        height: 480
        color_depth: $color_depth
        bits_r: $bits_r
        bits_g: $bits_g
        bits_b: $bits_b
  # which design ports each pin carries through the driver (tools/trace.py):
  # the colour pins the colours, the syncs and the pixel timing the raster
  serves:
    r:       [screen.red]
    g:       [screen.green]
    b:       [screen.blue]
    hs:      [screen.x]
    vs:      [screen.y]
    blank_n: [screen.x, screen.y]
    clk:     [screen.x, screen.y]
  # how the driver fits a colour channel onto its pins (tools/trace.py):
  # msb = as many pins as bits: bit for bit; one pin: the OR of the channel;
  # fewer pins: the most significant bits
  pin_fit:
    r: msb
    g: msb
    b: msb
  driver:
    module: vga
    file: rtl/peripherals/vga.sv
    parameters:
      CLK_MHZ:    context.clk_mhz
      PIXEL_MHZ:  25
      H_DISPLAY:  640
      V_DISPLAY:  480
      W_RED:      $bits_r
      W_GREEN:    $bits_g
      W_BLUE:     $bits_b
      W_RED_O:    $pin_bits_r
      W_GREEN_O:  $pin_bits_g
      W_BLUE_O:   $pin_bits_b
      GATE:       $gate
      REGISTERED: $registered
    port_map:
      clk:        context.clk
      rst:        context.rst
      hsync:      pin.hs
      vsync:      pin.vs
      hpos:       capability.screen.x
      vpos:       capability.screen.y
      display_on: pin.blank_n
      pixel_clk:  pin.clk
      red:        capability.screen.red
      green:      capability.screen.green
      blue:       capability.screen.blue
      vga_r:      pin.r
      vga_g:      pin.g
      vga_b:      pin.b
