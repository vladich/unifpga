# HDMI / DVI output over TMDS: three data pairs plus the clock pair.
#
# Driver: rtl/peripherals/hdmi_tmds_out.sv = BGM's `dvi_top` (sync, TMDS
# encoders, 10:1 SDR serializers on a 10x pixel clock) plus one vendor
# differential buffer per pair (rtl/io/diff_obuf.sv, kind from
# `context.diff_buf`: ELVDS_OBUF on Gowin LittleBee, TLVDS_OBUF on Gowin
# Arora, OBUFDS on Xilinx, pseudo-differential elsewhere). This is the open
# implementation BGM ships for a7_lite_35t and the tang_primer_20k_dock
# `_yosys` variant; where BGM uses Gowin's encrypted DVI_TX IP (5x DDR
# serializer, 126 MHz) the pixel clock is the same and only the serializer
# clock differs.
#
# Pins: a Gowin pinmap writes each pair as one "P,N" entry on the P signal
# (`clk_p: "69,68"`) plus the N pin on its own (`clk_n: "68"`); the top
# declares both ports (the buffer drives both) and the CST locates the pair
# through the P port under Gowin EDA, both halves under apicula. Xilinx
# pinmaps list P and N pins with IOSTANDARD TMDS_33 on the bank.

Peripheral:
  id: hdmi_tmds
  description: HDMI / DVI digital video output (3 TMDS data pairs + 1 TMDS clock pair)
  signals:
    - { name: clk_p, type: scalar, direction: output }
    - { name: clk_n, type: scalar, direction: output, optional: true }
    - { name: d_p,   type: bus, width: 3, direction: output, comment: "Channels 0/1/2 = B/G/R" }
    - { name: d_n,   type: bus, width: 3, direction: output, optional: true }
  provides:
    - capability: screen
      params:
        width: 640
        height: 480
        color_depth: 888
  # 640x480@60: 25.2 MHz pixel clock, 252 MHz serial (10x, SDR). The pixel
  # clock is divided from the serial one (Gowin CLKDIV2 + CLKDIV 5 as in BGM's
  # yosys variant; a second MMCM output on Xilinx; the board clock itself when
  # it already runs at 1/10 of the serial clock — Tang Nano 4K at 27 MHz).
  parameters:
    timing:
      type: enum
      values: [serial, lab, pixel, dvi]
      default: serial     # the clock BGM's `vga` timing generator runs on (x / y / syncs):
                          # the serial clock (Gowin DVI_TX boards), the lab clock (Tang Nano 4K,
                          # colorlight, marsohod3gw2) or the pixel clock (Tang Primer 25K); `dvi`
                          # is dvi_top's own dvi_sync, as where BGM instantiates dvi_top (a7_lite)
  clocks:
    - { name: serial, mhz: 252 }
    - { name: pixel, from: serial, divide: 10 }
    # BGM's Gowin DVI_TX boards run `vga` on their 5x DDR serial clock (125
    # MHz); ours is 10x SDR, so the timing generator gets serial / 2, phase-
    # aligned with it (aligned: the rPLL's CLKOUTD, not a CLKDIV the lock starts)
    - { name: timing, from: serial, divide: 2, aligned: true, when: { timing: serial } }
  driver:
    module: hdmi_tmds_out
    file: rtl/peripherals/hdmi_tmds_out.sv
    files:
      - rtl/peripherals/dvi.sv
      - rtl/peripherals/vga.sv
      - rtl/io/diff_obuf.sv
    parameters:
      DIFF_BUF:   context.diff_buf
      TIMING:     $timing
      SERIAL_MHZ: clock.serial.mhz
      PIXEL_MHZ:  clock.pixel.mhz
      LAB_MHZ:    context.clk_mhz
    port_map:
      serial_clk_i: clock.serial
      pixel_clk_i:  clock.pixel
      lab_clk_i:    context.clk
      timing_clk_i: clock.timing
      rst_i:        context.rst
      red_i:        capability.screen.red
      green_i:      capability.screen.green
      blue_i:       capability.screen.blue
      x_o:          capability.screen.x
      y_o:          capability.screen.y
      tmds_clk_p:   pin.clk_p
      tmds_clk_n:   pin.clk_n
      tmds_d_p:     pin.d_p
      tmds_d_n:     pin.d_n
