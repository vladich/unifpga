# A TI ADC128S022 A/D converter (8 channels, 12 bits; the DE0-Nano's):
# rtl/peripherals/adc128s022_scan.sv converts its channels in turn. Its full
# scale is its supply VA: `full_scale_mv` (3.3 V on the DE0-Nano, whose manual's
# ADC demo reads 0 - 3.3 V; a board's model_params can say otherwise).

Peripheral:
  id: adc128s022
  description: TI ADC128S022 8-channel 12-bit A/D converter (SPI), channels scanned in turn
  parameters:
    full_scale_mv:
      type: int
      default: 3300
  # the on-board devices it models: a board inventory's ADC with these pins
  models: {kind: adc, pins: {cs_n: [ADC_CS_N, cs_n], sclk: [ADC_SCLK, sclk],
                             din: [ADC_SADDR, din], dout: [ADC_SDAT, dout]}}
  signals:
    - { name: cs_n, type: scalar, direction: output, comment: "Chip select, active low" }
    - { name: sclk, type: scalar, direction: output }
    - { name: din,  type: scalar, direction: output, comment: "The next channel's address (ADC_SADDR)" }
    - { name: dout, type: scalar, direction: input,  comment: "The conversion result (ADC_SDAT)" }
  provides:
    - capability: adc
      params:
        channels: 8
        full_scale_mv: $full_scale_mv
  driver:
    module: adc128s022_scan
    file: rtl/peripherals/adc128s022_scan.sv
    parameters:
      CLK_MHZ: context.clk_mhz
    port_map:
      clk:     context.clk
      rst:     context.rst
      cs_n:    pin.cs_n
      sclk:    pin.sclk
      din:     pin.din
      dout:    pin.dout
      valid:   capability.adc.valid
      channel: capability.adc.channel
      value:   capability.adc.value
