# Pulse outputs for actuators: RC servo signal lines (Digilent PmodCON3) or
# PWM inputs of motor drivers and power stages. One output per actuator; the
# actuator's level is the servo position or the PWM duty, its enable bit
# turns the output on.

Peripheral:
  id: servo_pwm
  description: Servo / PWM outputs, one per actuator (position or duty from the 8-bit level)
  parameters:
    count:
      type: int
      required: true
    servo:
      type: bool
      default: true
      description: 'true: 50 Hz servo pulses of 1..2 ms; false: PWM'
    pwm_khz:
      type: int
      default: 20
      description: 'PWM frequency (servo: false)'
  signals:
    - name: pwm
      type: bus
      width: $count
      direction: output
  provides:
    - capability: actuators
      params:
        count: $count
  serves:
    pwm: [actuators.level, actuators.enable]
  driver:
    module: servo_pwm
    file: rtl/peripherals/servo_pwm.sv
    parameters:
      CLK_MHZ: context.clk_mhz
      COUNT:   $count
      SERVO:   $servo
      PWM_KHZ: $pwm_khz
    port_map:
      clk:   context.clk
      rst:   context.rst
      enable: capability.actuators.enable
      level: capability.actuators.level
      out:   pin.pwm
