# A bank of N slide switches.

Peripheral:
  id: sw_bank
  description: Bank of N slide switches (each switch is a single digital input)
  parameters:
    width:
      type: int
      description: Number of switches
      required: true
  signals:
    - { name: sw, type: bus, width: $width, direction: input }
  # the on-board devices it models: a board inventory's `switches` device (a bank
  # of pins) becomes an on-board part attaching this peripheral
  models: {kind: switches, signal: sw}
  provides:
    - capability: switches
      params:
        width: $width
  driver: null   # pin.sw -> slice of capability.switches.sw
