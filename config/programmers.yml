#  ---------- Third-party / open programmers ----------
#  Not bundled with any toolchain. Use families / requires_bridge /
#  requires_bootloader to declare what they can program.

  - id: openFPGALoader
    name: "openFPGALoader (universal)"
    known_versions: ['0.10', '0.11', '0.12', '0.13', git-master]
    version: git-master
    bundled: null
    binary: openFPGALoader
    bridge: jtag
    families:
      - ice40
      - ice40_ultraplus
      - ecp5
      - machxo2
      - machxo3
      - crosslink_nx
      - certus_nx
      - certuspro_nx
      - littlebee_gw1n
      - littlebee_gw1nr
      - littlebee_gw1ns
      - littlebee_gw1nsr
      - littlebee_gw1nz
      - arora_gw2a
      - arora_gw2ar
      - arorav_gw5a
      - arorav_gw5ast
      - arorav_gw5at
      - artix_7
      - spartan_7
      - kintex_7
      - zynq_7000
      - spartan_6
      - eagle_eg4
      - elf_ef2
      - phoenix_ef3
      - gatemate
      - trion
      - titanium
    url: https://github.com/trabucayre/openFPGALoader

  - id: iceprog
    name: "iceprog (Project IceStorm)"
    known_versions: [git-master]
    version: git-master
    bundled: null
    binary: iceprog
    bridge: ft2232h-spi
    requires_bridge: ft2232h-spi
    families:
      - ice40
      - ice40_ultraplus
    url: https://github.com/YosysHQ/icestorm

  - id: ecpprog
    name: ecpprog
    known_versions: [git-master]
    version: git-master
    bundled: null
    binary: ecpprog
    bridge: ft2232h-jtag
    requires_bridge: ft2232h-jtag
    families:
      - ecp5
    url: https://github.com/gregdavill/ecpprog

  - id: dfu_util
    name: dfu-util
    known_versions: ['0.10', '0.11']
    version: "0.11"
    bundled: null
    binary: dfu-util
    bridge: usb-dfu
    requires_bootloader: usb-dfu
    url: https://dfu-util.sourceforge.net/

  - id: openocd
    name: OpenOCD
    known_versions: [0.11.0, 0.12.0]
    version: "0.12.0"
    bundled: null
    binary: openocd
    bridge: jtag
    url: https://openocd.org/

  - id: xc3sprog
    name: "xc3sprog (third-party Xilinx)"
    known_versions: [git-master]
    version:
    bundled: null
    binary: xc3sprog
    bridge: ft2232h-jtag
    requires_bridge: ft2232h-jtag
    families:
      - spartan_6
      - artix_7
      - kintex_7
      - spartan_3
      - spartan_3e
      - spartan_3a
    url: http://xc3sprog.sourceforge.net/

  - id: urjtag
    name: "UrJTAG (universal JTAG)"
    known_versions: ['0.10']
    version:
    bundled: null
    binary: jtag
    bridge: jtag
    url: http://urjtag.org/

#  ---------- Board-specific / community programmers ----------
#  These apply ONLY to boards that explicitly list them in ExtraProgrammers.

  - id: mojoload
    name: "Mojo Loader"
    known_versions: [v1.2.1]
    version: "v1.2.1"
    bundled: null
    binary: mojoload
    bridge: avr-mojo
    requires_bridge: avr-mojo
    url: https://github.com/embmicro/mojo-loader

  - id: papilio_loader
    name: "Papilio Loader"
    known_versions: ['2.8']
    version:
    bundled: null
    binary: papilio-loader
    bridge: papilio-ft2232
    requires_bridge: papilio-ft2232
    url: https://gadgetfactory.net/
