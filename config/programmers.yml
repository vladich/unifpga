    binary: pgrcmd
    bridge: jtag

  - id: radiant_pgm
    name: "Lattice Radiant Programmer"
    known_versions: ['2.2', '3.0', '2024.1']
    version:
    bundled: lattice_radiant
    binary: radiant-programmer
    bridge: jtag

  - id: icecube2_pgm
    name: "iCEcube2 Programmer"
    known_versions: ['2017.08', '2020.12']
    version:
    bundled: icecube2
    binary: pgrcmd
    bridge: jtag

  - id: td_pgm
    name: "Tang Dynasty Programmer"
    known_versions: ['4.6', '5.0', '5.6']
    version:
    bundled: td
    binary: td_programmer
    bridge: jtag

  - id: pango_pgm
    name: "Pango Design Suite Programmer"
    known_versions: ['2024.1']
    version:
    bundled: pango_ds
    binary: pds_programmer
    bridge: jtag

  - id: renesas_go_pgm
    name: "Renesas Go Configure / ForgeFPGA Workshop"
    known_versions: ['6.0']
