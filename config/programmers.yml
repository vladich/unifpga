---
# Registry of programmers.
#
# A programmer is a tool that loads a synthesized bitstream onto a physical
# FPGA board (over JTAG, USB-DFU, SPI, or a board-specific bootloader). It
# is orthogonal to the toolchain — the same bitstream may be loaded by
# either a vendor-bundled programmer or a third-party tool like
# `openFPGALoader`.
#
# Field schema (config/schema/programmer.schema.json):
#   id:                  the programmer's id, as a board's programmer /
#                        extra_programmers name it; version constraints use
#                        bracket notation: `vivado_hw[*]`, `vivado_hw[2017+]`,
#                        `iceprog[git-master]`
#   name:                display name
#   known_versions:      list of versions seen in the wild
#   version:             version installed locally (for install_dir / binary resolution)
#   bundled:             the id of the toolchain this programmer ships with, or
#                        null for third-party / community tools. When non-null,
#                        the programmer is "chip-tied via toolchain": it applies
#                        wherever the chip's toolchains include this id.
#   binary:              executable name expected on $PATH
#   bridge:              physical interface this programmer speaks (jtag,
#                        ft2232h-spi, ft2232h-jtag, usb-dfu, avr-mojo, etc.)
#   requires_bridge:     bridge that must be on the board for this programmer
#                        to apply. Skipped if null (e.g., bundled vendor
#                        programmers usually accept any vendor cable).
#   families:            for non-bundled programmers — the chip families the
#                        programmer can target, by family id (config/chips/).
#                        Implies chip-tied compatibility.
#   requires_bootloader: for bootloader-tied programmers (dfu-util) — the
#                        bootloader type required on the board.
#   install_dir:         optional override (expanded with ~ / $VAR)
#   url:                 project / vendor page

Programmers:

#  ---------- Bundled vendor programmers ----------
#  These apply wherever their bundled toolchain applies. No explicit
#  families list — derived from the chip's toolchains.

  - id: vivado_hw
    name: "Vivado HW Server"
    known_versions: [2014.4, 2015.4, 2016.4, 2017.4, 2018.3, 2019.2, 2020.2, 2021.2, 2022.2, 2023.2, 2024.2]
    version: "2023.2"
    bundled: vivado
    binary: hw_server
    bridge: jtag
    url: https://www.amd.com/en/products/software/adaptive-socs-and-fpgas/vivado.html

  - id: ise_impact
    name: iMPACT
    known_versions: [14.7]
    version: "14.7"
