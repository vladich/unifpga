    bundled: quartus_prime_lite
    binary: quartus_pgm
    bridge: jtag

  - id: quartus2_pgm
    name: "Quartus II 13 Programmer"
    known_versions: [13.0sp1]
    version: "13.0sp1"
    bundled: quartus2
    binary: quartus_pgm
    bridge: jtag

  - id: libero_fpexpress
    name: "FlashPro Express"
