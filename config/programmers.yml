    version: "2024.1"
    bundled: libero_soc
    binary: FPExpress
    bridge: jtag

  - id: efinity_pgm
    name: "Efinity Programmer"
    known_versions: ['2022.1', '2023.1', '2023.2', '2024.1']
    version: "2023.2"
    bundled: efinity
    binary: efx_pgm
    bridge: jtag

  - id: gowin_pgm
    name: "Gowin Programmer"
    known_versions: [1.9.9.03.Education, 1.9.11.03.Educational]
    version: "1.9.11.03.Educational"
