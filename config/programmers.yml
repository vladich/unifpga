    bridge: jtag
    url: https://www.amd.com/en/support/downloadable-files/ise-design-suite-14-7.html

  - id: quartus_pgm
    name: "Quartus Programmer"
    known_versions: ['18.1', '19.1', '20.1', '21.1', 22.1std, 23.1std, 24.1std]
