# sipeed / general - mezzanines, SoMs, piggyback boards

Mezzanines:
  - id: sipeed_tang_primer_20k_dock_carrier
    name: "Sipeed Tang Primer 20K Dock (carrier)"
    producer: sipeed
    type: carrier
    connector: ddr3_sodimm_footprint
    features:
      - usb_jtag_bridge
      - usb_uart_bridge
      - ethernet_phy_gigabit
      - usb_2_otg
      - hdmi_output
      - headphone_jack
      - parallel_lcd
      - parallel_camera_input
      - pmod_connector
    devices:
      - microsd_socket_generic
    url: "https://wiki.sipeed.com/hardware/en/tang/tang-primer-20k/primer-20k.html"
    status: active
    compatible_boards:
      - sipeed_tang_primer_20k_module
  - id: sipeed_tang_primer_20k_lite_carrier
    name: "Sipeed Tang Primer 20K Lite (carrier, IO-breakout)"
    producer: sipeed
    type: carrier
    connector: ddr3_sodimm_footprint
    features:
      - pmod_connector
      - gpio_header_generic
    url: "https://wiki.sipeed.com/hardware/en/tang/tang-primer-20k/primer-20k.html"
    status: active
    compatible_boards:
      - sipeed_tang_primer_20k_module
  - id: sipeed_tang_primer_25k_dock_carrier
    name: "Sipeed Tang Primer 25K Dock (carrier)"
    producer: sipeed
    type: carrier
    connector: tang_primer_25k_b2b
    features:
      - usb_jtag_bridge
      - pmod_connector
      - usb_2_host
      - gpio_header_generic
    url: "https://wiki.sipeed.com/hardware/en/tang/tang-primer-25k/primer-25k.html"
    status: active
    compatible_boards:
      - tang_primer_25k
  - id: sipeed_tang_console_carrier
    name: "Sipeed Tang Console carrier (Mega SoM socket)"
    producer: sipeed
    type: carrier
    connector: tang_mega_b2b
    features:
      - hdmi_output
      - usb_3_host
      - usb_2_device
      - microsd_socket
      - pmod_connector
      - adc_chip
      - audio_amp_class_d
      - battery_input
      - parallel_lcd
      - user_buttons
      - usb_jtag_bridge
    devices:
      - microsd_socket_generic
    url: "https://wiki.sipeed.com/hardware/en/tang/tang-console/mega-console.html"
    status: active
    compatible_boards:
      - sipeed_tang_mega_60k
      - tang_mega_138k
      - tang_mega_138k_pro
  - id: sipeed_tang_mega_neo_dock
    name: "Sipeed Tang Mega NEO Dock (shared 60K / 138K carrier)"
    producer: sipeed
    type: carrier
    connector: tang_mega_b2b
    features:
      - hdmi_output
      - hdmi_input
      - ethernet_phy_gigabit
      - usb_3_device
      - usb_2_host
      - pmod_connector
      - pcie_edge_connector
      - audio_dac
      - audio_amp_class_d
      - parallel_camera_input
      - parallel_lcd
      - microsd_socket
    devices:
      - microsd_socket_generic
    url: "https://wiki.sipeed.com/hardware/en/tang/tang-mega-60k/mega-60k.html"
    status: active
    compatible_boards:
      - sipeed_tang_mega_60k
      - tang_mega_138k                  # (the 138K Pro is its own FPG676 board)
