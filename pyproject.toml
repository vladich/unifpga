[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-fpga"
version = "0.1.0"
description = "Multi-vendor FPGA build orchestrator"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["config*", "toolchains*"]
